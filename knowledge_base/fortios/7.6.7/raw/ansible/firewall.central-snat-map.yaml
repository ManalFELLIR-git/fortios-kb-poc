id: firewall.central-snat-map
version: 7.6.7
source_object: fortios_firewall_central_snat_map
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_central_snat_map.py
root_type: list
attributes:
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID. see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the active status of this policy.
  type:
    type: enum
    raw_type: string
    choices:
    - ipv4
    - ipv6
    version_ranges:
    - - v6.4.0
      - ''
    description: IPv4/IPv6 source NAT.
  srcintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source interface name from available interfaces.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  dstintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination interface name from available interfaces.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  orig_addr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 Original address.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - system.external-resource.name
  orig_addr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: IPv6 Original address.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name system.external-resource.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
        - system.external-resource.name
  dst_addr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 Destination address.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  dst_addr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: IPv6 Destination address.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for the protocol type (0 - 255).
  orig_port:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Original TCP port (1 to 65535, 0 means any port).
  nat:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable source NAT.
  nat46:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT46.
  nat64:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT64.
  nat_ippool:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the IP pools to be used to translate addresses from available IP Pools.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP pool name. Source firewall.ippool.name.
        references:
        - firewall.ippool.name
  nat_ippool6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: IPv6 pools to be used for source NAT.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: IPv6 pool name. Source firewall.ippool6.name.
        references:
        - firewall.ippool6.name
  port_preserve:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable preservation of the original source port from source NAT if it has not been used.
  port_random:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable random source port selection for source NAT.
  nat_port:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Translated port or port range (1 to 65535, 0 means any port).
  dst_port:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Destination port or port range (1 to 65535, 0 means any port).
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
