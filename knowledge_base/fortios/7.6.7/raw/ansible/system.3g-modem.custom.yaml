id: system.3g-modem.custom
version: 7.6.7
source_object: fortios_system_3g_modem_custom
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_3g_modem_custom.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  vendor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: MODEM vendor name.
  model:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: MODEM model name.
  vendor_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: USB vendor ID in hexadecimal format (0000-ffff).
  product_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: USB product ID in hexadecimal format (0000-ffff).
  class_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: USB interface class in hexadecimal format (00-ff).
  init_string:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Init string in hexadecimal format (even length).
  modeswitch_string:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: 'USB modeswitch arguments. For example: "-v 1410 -p 9030 -V 1410 -P 9032 -u 3".'
