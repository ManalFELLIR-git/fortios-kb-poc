id: gtp.apn-shaper
version: 7.6.7
source_object: fortios_gtp_apn_shaper
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_gtp_apn_shaper.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Shaper ID. see <a href='#notes'>Notes</a>.
  apn:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: APN names to match. Leave empty to match ANY. Source gtp.apn.name.
    references:
    - gtp.apn.name
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - v7.0.8
        - - v7.2.0
          - v7.2.4
        - - v7.4.3
          - v7.6.7
        description: APN name. Source gtp.apn.name gtp.apngrp.name.
        references:
        - gtp.apn.name
        - gtp.apngrp.name
  rate_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Rate limit in packets/s (0 - 1000000, 0 means unlimited).
  action:
    type: enum
    raw_type: string
    choices:
    - drop
    - reject
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Action.
  back_off_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Back off time in seconds (10 - 360).
