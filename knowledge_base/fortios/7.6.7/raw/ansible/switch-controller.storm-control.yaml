id: switch-controller.storm-control
version: 7.6.7
source_object: fortios_switch_controller_storm_control
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_storm_control.py
root_type: object
attributes:
  rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Rate in packets per second at which storm control drops excess traffic(0-10000000).
  burst_size_level:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.4
      - ''
    description: Increase level to handle bursty traffic (0 - 4).
  unknown_unicast:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable storm control to drop unknown unicast traffic.
  unknown_multicast:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable storm control to drop unknown multicast traffic.
  broadcast:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable storm control to drop broadcast traffic.
