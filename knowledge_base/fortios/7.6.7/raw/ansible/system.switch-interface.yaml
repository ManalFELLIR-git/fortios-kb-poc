id: system.switch-interface
version: 7.6.7
source_object: fortios_system_switch_interface
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_switch_interface.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface name (name cannot be in use by any other interfaces, VLANs, or inter-VDOM links).
  vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: VDOM that the software switch belongs to. Source system.vdom.name.
    references:
    - system.vdom.name
  span_dest_port:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SPAN destination port name. All traffic on the SPAN source ports is echoed to the SPAN destination port.
      Source system.interface.name.
    references:
    - system.interface.name
  span_source_port:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Physical interface name. Port spanning echoes all traffic on the SPAN source ports to the SPAN destination
      port.
    children:
      interface_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Physical interface name. Source system.interface.name.
        references:
        - system.interface.name
  member:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of the interfaces that belong to the software switch.
    children:
      interface_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  type:
    type: enum
    raw_type: string
    choices:
    - switch
    - hub
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Type of switch based on functionality: switch for normal functionality, or hub to duplicate packets to all
      port members.'
  intra_switch_policy:
    type: enum
    raw_type: string
    choices:
    - implicit
    - explicit
    version_ranges:
    - - v6.0.0
      - ''
    description: Allow any traffic between switch interfaces or require firewall policies to allow traffic between switch
      interfaces.
  mac_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Duration for which MAC addresses are held in the ARP table (300 - 8640000 sec).
  span:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable port spanning. Port spanning echoes traffic received by the software switch to the span destination
      port.
  span_direction:
    type: enum
    raw_type: string
    choices:
    - rx
    - tx
    - both
    version_ranges:
    - - v6.0.0
      - ''
    description: 'The direction in which the SPAN port operates, either: rx, tx, or both.'
