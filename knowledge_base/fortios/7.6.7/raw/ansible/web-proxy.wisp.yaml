id: web-proxy.wisp
version: 7.6.7
source_object: fortios_web_proxy_wisp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_web_proxy_wisp.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Server name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  outgoing_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WISP outgoing IP address.
  server_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WISP server IP address.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: WISP server port (1 - 65535).
  max_connections:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of web proxy WISP connections (4 - 4096).
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period of time before WISP requests time out (1 - 15 sec).
