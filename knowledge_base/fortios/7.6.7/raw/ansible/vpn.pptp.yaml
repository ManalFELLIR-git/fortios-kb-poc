id: vpn.pptp
version: 7.6.7
source_object: fortios_vpn_pptp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_pptp.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiGate as a PPTP gateway.
  ip_mode:
    type: enum
    raw_type: string
    choices:
    - range
    - usrgrp
    version_ranges:
    - - v6.0.0
      - ''
    description: IP assignment mode for PPTP client.
  eip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: End IP.
  sip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Start IP.
  local_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local IP to be used for peer"s remote IP.
  usrgrp:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User group. Source user.group.name.
    references:
    - user.group.name
