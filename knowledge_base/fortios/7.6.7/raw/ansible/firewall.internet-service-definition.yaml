id: firewall.internet-service-definition
version: 7.6.7
source_object: fortios_firewall_internet_service_definition
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_definition.py
root_type: list
attributes:
  entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Protocol and port information in an Internet Service entry.
    children:
      seq_num:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Entry sequence number. see <a href='#notes'>Notes</a>.
      port_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Port ranges in the definition entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Custom entry port range ID. see <a href='#notes'>Notes</a>.
