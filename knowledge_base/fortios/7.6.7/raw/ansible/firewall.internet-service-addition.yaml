id: firewall.internet-service-addition
version: 7.6.7
source_object: fortios_firewall_internet_service_addition
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_addition.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service ID in the Internet Service database. see <a href='#notes'>Notes</a>. Source firewall.internet-service.id.
    references:
    - firewall.internet-service.id
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Entries added to the Internet Service addition database.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Entry ID(1-255). see <a href='#notes'>Notes</a>.
      addr_mode:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        version_ranges:
        - - v7.2.1
          - ''
        description: Address mode (IPv4 or IPv6).
      protocol:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Integer value for the protocol type as defined by IANA (0 - 255).
      port_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Port ranges in the custom entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Custom entry port range ID. see <a href='#notes'>Notes</a>.
          start_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Integer value for starting TCP/UDP/SCTP destination port in range (0 to 65535).
          end_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Integer value for ending TCP/UDP/SCTP destination port in range (0 to 65535).
