id: wireless-controller.global
version: 7.6.7
source_object: fortios_wireless_controller_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_global.py
root_type: object
attributes:
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the wireless controller.
  location:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description of the location of the wireless controller.
  acd_process_count:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.4
      - ''
    description: Configure the number cw_acd daemons for multi-core CPU support .
  wpad_process_count:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Wpad daemon process count for multi-core CPU support.
  image_download:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable WTP image download at join time.
  rolling_wtp_upgrade:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable rolling WTP upgrade .
  rolling_wtp_upgrade_threshold:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Minimum signal level/threshold in dBm required for the managed WTP to be included in rolling WTP upgrade
      (-95 to -20).
  max_retransmit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of tunnel packet retransmissions (0 - 64).
  control_message_offload:
    type: enum
    raw_type: list
    choices:
    - ebp-frame
    - aeroscout-tag
    - ap-list
    - sta-list
    - sta-cap-list
    - stats
    - aeroscout-mu
    - sta-health
    - spectral-analysis
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure CAPWAP control message data channel offload.
  data_ethernet_II:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure the wireless controller to use Ethernet II or 802.3 frames with 802.3 data tunnel mode .
  link_aggregation:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable calculating the CAPWAP transmit hash to load balance sessions to link aggregation nodes .
  mesh_eth_type:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Mesh Ethernet identifier included in backhaul packets (0 - 65535).
  fiapp_eth_type:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Ethernet type for Fortinet Inter-Access Point Protocol (IAPP), or IEEE 802.11f, packets (0 - 65535).
  discovery_mc_addr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Multicast IP address for AP discovery .
  discovery_mc_addr6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: Multicast IPv6 address for AP discovery .
  max_clients:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of clients that can connect simultaneously .
  rogue_scan_mac_adjacency:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum numerical difference between an AP"s Ethernet and wireless MAC values to match for rogue detection
      (0 - 31).
  ipsec_base_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Base IP address for IPsec VPN tunnels between the access points and the wireless controller .
  wtp_share:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sharing of WTPs between VDOMs.
  tunnel_mode:
    type: enum
    raw_type: string
    choices:
    - compatible
    - strict
    version_ranges:
    - - v7.0.1
      - ''
    description: Configure tunnel mode security .
  nac_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.2
      - ''
    description: Interval in seconds between two WiFi network access control (NAC) checks (10 - 600).
  ap_log_server:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable configuring FortiGate to redirect wireless event log messages or FortiAPs to send UTM log
      messages to a syslog server .
  ap_log_server_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address that FortiGate or FortiAPs send log messages to.
  ap_log_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port that FortiGate or FortiAPs send log messages to.
  max_sta_offline:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Maximum number of station offline stored on the controller .
  max_sta_offline_ip2mac:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Maximum number of station offline ip2mac stored on the controller .
  max_sta_cap:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of station cap stored on the controller .
  max_sta_cap_wtp:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of station cap"s wtp info stored on the controller (1 - 16).
  max_rogue_ap:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of rogue APs stored on the controller .
  max_rogue_ap_wtp:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of rogue AP"s wtp info stored on the controller (1 - 16).
  max_rogue_sta:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of rogue stations stored on the controller .
  max_wids_entry:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Maximum number of wids entries stored on the controller .
  max_ble_device:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Maximum number of BLE devices stored on the controller .
  dfs_lab_test:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.12
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable DFS certificate lab test mode.
