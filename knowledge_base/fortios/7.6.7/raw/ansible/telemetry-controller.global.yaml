id: telemetry-controller.global
version: 7.6.7
source_object: fortios_telemetry_controller_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_telemetry_controller_global.py
root_type: object
attributes:
  region:
    type: enum
    raw_type: string
    choices:
    - global
    version_ranges:
    - - v7.6.3
      - ''
    description: Configure telemetry cloud region.
  retry_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Configure telemetry cloud retry interval (1 - 999).
  telemetry_ca_certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: Name of the CA certificate used to verify the telemetry agent certificate. Source certificate.ca.name.
    references:
    - certificate.ca.name
  auto_group_telemetry_addr:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable automatically adding the telemetry address to the default addrgrp TELEMETRY.
