id: log.tacacs+accounting2.setting
version: 7.6.7
source_object: fortios_log_tacacsplusaccounting2_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_tacacsplusaccounting2_setting.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable TACACS+ accounting.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Address of TACACS+ server.
  server_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Key to access the TACACS+ server.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Source IP address for communication to TACACS+ server.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.2.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
