id: wanopt.remote-storage
version: 7.6.7
source_object: fortios_wanopt_remote_storage
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wanopt_remote_storage.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using remote device as Web cache storage.
  local_cache_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ID that this device uses to connect to the remote device.
  remote_cache_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ID of the remote device to which the device connects.
  remote_cache_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address of the remote device to which the device connects.
