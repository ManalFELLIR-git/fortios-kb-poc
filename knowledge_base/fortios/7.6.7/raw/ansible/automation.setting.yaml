id: automation.setting
version: 7.6.7
source_object: fortios_automation_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_automation_setting.py
root_type: object
attributes:
  max_concurrent_stitches:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Maximum number of automation stitches that are allowed to run concurrently.
  fabric_sync:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable synchronization of automation settings with security fabric.
  secure_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable secure running mode for automation.
