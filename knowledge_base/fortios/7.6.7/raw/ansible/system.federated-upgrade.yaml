id: system.federated-upgrade
version: 7.6.7
source_object: fortios_system_federated_upgrade
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_federated_upgrade.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - disabled
    - initialized
    - downloading
    - device-disconnected
    - ready
    - coordinating
    - staging
    - final-check
    - upgrade-devices
    - cancelled
    - confirmed
    - done
    - dry-run-done
    - failed
    version_ranges:
    - - v7.0.0
      - ''
    description: Current status of the upgrade.
  source:
    type: enum
    raw_type: string
    choices:
    - user
    - auto-firmware-upgrade
    - forced-upgrade
    version_ranges:
    - - v7.6.0
      - ''
    description: Source that set up the federated upgrade config.
  failure_reason:
    type: enum
    raw_type: string
    choices:
    - none
    - internal
    - timeout
    - device-type-unsupported
    - download-failed
    - device-missing
    - version-unavailable
    - staging-failed
    - reboot-failed
    - device-not-reconnected
    - node-not-ready
    - no-final-confirmation
    - no-confirmation-query
    - config-error-log-nonempty
    - csf-tree-not-supported
    - firmware-changed
    - node-failed
    - image-missing
    version_ranges:
    - - v7.0.2
      - ''
    description: Reason for upgrade failure.
  failure_device:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Serial number of the node to include.
  upgrade_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Unique identifier for this upgrade.
  next_path_index:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.4
      - ''
    description: The index of the next image to upgrade to.
  ignore_signing_errors:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Allow/reject use of FortiGate firmware images that are unsigned.
  ha_reboot_controller:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Serial number of the FortiGate unit that will control the reboot process for the federated upgrade of the
      HA cluster.
  known_ha_members:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: Known members of the HA cluster. If a member is missing at upgrade time, the upgrade will be cancelled.
    children:
      serial:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Serial number of HA member
  initial_version:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Firmware version when the upgrade was set up.
  starter_admin:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Admin that started the upgrade.
  node_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Nodes which will be included in the upgrade.
    children:
      serial:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Serial number of the node to include.
      timing:
        type: enum
        raw_type: string
        choices:
        - immediate
        - scheduled
        version_ranges:
        - - v7.0.0
          - ''
        description: Run immediately or at a scheduled time.
      maximum_minutes:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.0
          - ''
        description: Maximum number of minutes to allow for immediate upgrade preparation.
      time:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Scheduled upgrade execution time in UTC (hh:mm yyyy/mm/dd UTC).
      setup_time:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Upgrade preparation start time in UTC (hh:mm yyyy/mm/dd UTC).
      upgrade_path:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Fortinet OS image versions to upgrade through in major-minor-patch format, such as 7-0-4.
      device_type:
        type: enum
        raw_type: string
        choices:
        - fortigate
        - fortiswitch
        - fortiap
        - fortiextender
        version_ranges:
        - - v7.0.0
          - ''
        description: Fortinet device type.
      allow_download:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.4
          - ''
        description: Enable/disable download firmware images.
      coordinating_fortigate:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Serial number of the FortiGate unit that controls this device.
      failure_reason:
        type: enum
        raw_type: string
        choices:
        - none
        - internal
        - timeout
        - device-type-unsupported
        - download-failed
        - device-missing
        - version-unavailable
        - staging-failed
        - reboot-failed
        - device-not-reconnected
        - node-not-ready
        - no-final-confirmation
        - no-confirmation-query
        - config-error-log-nonempty
        - csf-tree-not-supported
        - firmware-changed
        - node-failed
        - image-missing
        version_ranges:
        - - v7.6.3
          - ''
        description: Upgrade failure reason.
