id: user.fortitoken
version: 7.6.7
source_object: fortios_user_fortitoken
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_fortitoken.py
root_type: list
attributes:
  serial_number:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Serial number.
  status:
    type: enum
    raw_type: string
    choices:
    - active
    - lock
    version_ranges:
    - - v6.0.0
      - ''
    description: Status.
  seed:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.11
    - - v6.2.3
      - v6.2.3
    - - v7.0.12
      - v7.0.12
    - - v7.2.1
      - ''
    description: Token seed.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  license:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Mobile token license.
  activation_code:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Mobile token user activation-code.
  activation_expire:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Mobile token user activation-code expire time.
  reg_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Device Reg ID.
  os_ver:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Device Mobile Version.
