id: router.bfd
version: 7.6.7
source_object: fortios_router_bfd
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_bfd.py
root_type: object
attributes:
  neighbor:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Neighbor.
    children:
      ip:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 address of the BFD neighbor.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  multihop_template:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.6
      - ''
    description: BFD multi-hop template table.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.6
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      src:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.6
          - ''
        description: Source prefix.
      dst:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.6
          - ''
        description: Destination prefix.
      bfd_desired_min_tx:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.6
          - ''
        description: BFD desired minimal transmit interval (milliseconds).
      bfd_required_min_rx:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.6
          - ''
        description: BFD required minimal receive interval (milliseconds).
      bfd_detect_mult:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.6
          - ''
        description: BFD detection multiplier.
      auth_mode:
        type: enum
        raw_type: string
        choices:
        - none
        - md5
        version_ranges:
        - - v7.0.6
          - ''
        description: Authentication mode.
      md5_key:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.6
          - ''
        description: MD5 key of key ID 1.
