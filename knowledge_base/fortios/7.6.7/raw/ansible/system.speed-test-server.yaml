id: system.speed-test-server
version: 7.6.7
source_object: fortios_system_speed_test_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_speed_test_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Speed test server name.
  timestamp:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Speed test server timestamp.
  host:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Hosts of the server.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Server host ID. see <a href='#notes'>Notes</a>.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Server host IPv4 address.
      port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Server host port number to communicate with client.
      user:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Speed test host user name.
      password:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Speed test host password.
      longitude:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.12
          - v7.0.12
        - - v7.2.4
          - ''
        description: Speed test host longitude.
      latitude:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.12
          - v7.0.12
        - - v7.2.4
          - ''
        description: Speed test host latitude.
      distance:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.12
          - v7.0.12
        - - v7.2.4
          - ''
        description: Speed test host distance.
