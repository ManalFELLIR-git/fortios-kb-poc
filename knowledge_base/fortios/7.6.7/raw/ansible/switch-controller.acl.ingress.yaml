id: switch-controller.acl.ingress
version: 7.6.7
source_object: fortios_switch_controller_acl_ingress
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_acl_ingress.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v7.4.0
      - ''
    description: ACL ID. see <a href='#notes'>Notes</a>.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Description for the ACL policy.
  action:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: ACL actions.
    children:
      drop:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable drop.
      count:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable count.
  classifier:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: ACL classifiers.
    children:
      dst_ip_prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Destination IP address to be matched.
      dst_mac:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Destination MAC address to be matched.
      src_ip_prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Source IP address to be matched.
      src_mac:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Source MAC address to be matched.
      vlan:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.0
          - ''
        description: VLAN ID to be matched.
