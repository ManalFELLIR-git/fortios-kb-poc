id: system.npu
version: 7.6.7
source_object: fortios_system_npu
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_npu.py
root_type: object
attributes:
  dedicated_management_cpu:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to dedicate one CPU for GUI and CLI connections when NPs are busy.
  dedicated_management_affinity:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Affinity setting for management daemons (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
  capwap_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable offloading managed FortiAP and FortiLink CAPWAP sessions.
  mcast_denied_ses_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.5
      - ''
    description: Enable/disable offloading of multicast denied sessions.
  session_denied_offload:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Enable/disable offloading of denied sessions. Requires ses-denied-traffic to be set.
  port_cpu_map:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Configure NPU interface to CPU core mapping.
    children:
      interface:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: The interface to map to a CPU core.
      cpu_core:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: The CPU core to map to an interface.
  fastpath:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable NP6 offloading (also called fast path).
  ipsec_enc_subengine_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: IPsec encryption subengine mask (0x1 - 0xff).
  ipsec_dec_subengine_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: IPsec decryption subengine mask (0x1 - 0xff).
  sw_np_bandwidth:
    type: enum
    raw_type: string
    choices:
    - 0G
    - 2G
    - 4G
    - 5G
    - 6G
    - 7G
    - 8G
    - 9G
    version_ranges:
    - - v6.2.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Bandwidth from switch to NP.
  gtp_enhanced_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.6.7
    description: Enable/disable GTP enhanced mode.
  gtp_enhanced_cpu_range:
    type: enum
    raw_type: string
    choices:
    - '0'
    - '1'
    - '2'
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: GTP enhanced CPU range option.
  intf_shaping_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable NPU offload when doing interface-based traffic shaping according to the egress-shaping-profile.
  strip_esp_padding:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable stripping ESP padding.
  strip_clear_text_padding:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable stripping clear text padding.
  ipsec_inbound_cache:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable IPsec inbound cache for anti-replay.
  sse_backpressure:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable SSE backpressure.
  rdp_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable RDP offload.
  ipsec_over_vlink:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable IPsec over vlink.
  uesp_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable UDP-encapsulated ESP offload .
  qos_mode:
    type: enum
    raw_type: string
    choices:
    - disable
    - priority
    - round-robin
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: QoS mode on switch and NP.
  isf_np_queues:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Configure queues of switch port connected to NP6 XAUI on ingress path.
    children:
      cos0:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 0. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos1:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 1. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos2:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 2. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos3:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 3. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos4:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 4. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos5:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 5. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 6. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
      cos7:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: CoS profile name for CoS 7. Source system.isf-queue-profile.name.
        references:
        - system.isf-queue-profile.name
  mcast_session_accounting:
    type: enum
    raw_type: string
    choices:
    - tpe-based
    - session-based
    - disable
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - v6.2.0
    - - v6.2.5
      - v6.2.7
    - - v6.4.4
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable traffic accounting for each multicast session through TAE counter.
  ipsec_mtu_override:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.7
      - v6.2.7
    - - v6.4.4
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable NP6 IPsec MTU override.
  lag_out_port_select:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - v6.2.7
    - - v6.4.1
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable LAG outgoing port selection based on incoming traffic port.
  sw_eh_hash:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Configure switch enhanced hashing.
    children:
      computation:
        type: enum
        raw_type: string
        choices:
        - xor16
        - xor8
        - xor4
        - crc16
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Set hashing computation.
      ip_protocol:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude IP protocol.
      source_ip_upper_16:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude source IP address upper 16 bits.
      source_ip_lower_16:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude source IP address lower 16 bits.
      destination_ip_upper_16:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude destination IP address upper 16 bits.
      destination_ip_lower_16:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude destination IP address lower 16 bits.
      source_port:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude source port if TCP/UDP.
      destination_port:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude destination port if TCP/UDP.
      netmask_length:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - v7.2.0
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Network mask length.
  sw_tr_hash:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Configure switch traditional hashing.
    children:
      draco15:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Enable/disable DRACO15 hashing.
      tcp_udp_port:
        type: enum
        raw_type: string
        choices:
        - include
        - exclude
        version_ranges:
        - - v7.4.0
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Include/exclude TCP/UDP source and destination port for unicast trunk traffic.
  tunnel_over_vlink:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - v7.6.7
    description: Enable/disable selection of which NP6 chip the tunnel uses .
  priority_protocol:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Configure NPU priority protocol.
    children:
      bgp:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - v6.0.0
        - - v6.0.11
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Enable/disable NPU BGP priority protocol.
      slbc:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - v6.0.0
        - - v6.0.11
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Enable/disable NPU SLBC priority protocol.
      bfd:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - v6.0.0
        - - v6.0.11
          - v7.4.1
        - - v7.4.3
          - v7.6.7
        description: Enable/disable NPU BFD priority protocol.
