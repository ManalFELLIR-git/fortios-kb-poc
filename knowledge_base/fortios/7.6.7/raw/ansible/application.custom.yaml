id: application.custom
version: 7.6.7
source_object: fortios_application_custom
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_application_custom.py
root_type: list
attributes:
  tag:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Signature tag.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  signature:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: The text that makes up the actual custom application signature.
  category:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom application category ID (use ? to view available options).
  protocol:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom application signature protocol.
  technology:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom application signature technology.
  behavior:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom application signature behavior.
  vendor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom application signature vendor.
