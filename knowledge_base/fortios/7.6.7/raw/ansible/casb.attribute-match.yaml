id: casb.attribute-match
version: 7.6.7
source_object: fortios_casb_attribute_match
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_casb_attribute_match.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: CASB attribute match name.
  application:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: CASB attribute application name. Source casb.saas-application.name.
    references:
    - casb.saas-application.name
  match_strategy:
    type: enum
    raw_type: string
    choices:
    - or
    - and
    - subset
    version_ranges:
    - - v7.6.1
      - ''
    description: CASB attribute match strategy.
  match:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.3
      - ''
    description: CASB tenant match rules.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.6.3
          - ''
        description: CASB attribute match rule ID. see <a href='#notes'>Notes</a>.
      rule_strategy:
        type: enum
        raw_type: string
        choices:
        - and
        - or
        version_ranges:
        - - v7.6.3
          - ''
        description: CASB attribute match rule strategy.
      rule:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.3
          - ''
        description: CASB attribute match rule.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.6.3
              - ''
            description: CASB attribute rule ID. see <a href='#notes'>Notes</a>.
          attribute:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.3
              - ''
            description: CASB attribute match name.
          match_pattern:
            type: enum
            raw_type: string
            choices:
            - simple
            - substr
            - regexp
            version_ranges:
            - - v7.6.3
              - ''
            description: CASB attribute match pattern.
          match_value:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.3
              - ''
            description: CASB attribute match value.
          case_sensitive:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.3
              - ''
            description: CASB attribute match case sensitive.
          negate:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.3
              - ''
            description: Enable/disable what the matching strategy must not be.
