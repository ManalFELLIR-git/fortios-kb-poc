    description: Threat weight score for URL blocking.
  botnet_connection_detected:
    type: enum
    raw_type: string
    choices:
    - disable
    - low
    - medium
    - high
    - critical
    version_ranges:
    - - v6.2.0
      - ''
    description: Threat weight score for detected botnet connections.
  malware:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Anti-virus malware threat weight settings.
    children:
      virus_infected:
        type: enum
        raw_type: string
