id: log.threat-weight
version: 7.6.7
source_object: fortios_log_threat_weight
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_threat_weight.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the threat weight feature.
  level:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Score mapping for threat weight levels.
    children:
      low:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Low level score value (1 - 100).
      medium:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Medium level score value (1 - 100).
      high:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: High level score value (1 - 100).
      critical:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Critical level score value (1 - 100).
  blocked_connection:
    type: enum
    raw_type: string
    choices:
    - disable
    - low
    - medium
    - high
    - critical
    version_ranges:
    - - v6.0.0
      - ''
    description: Threat weight score for blocked connections.
  failed_connection:
    type: enum
    raw_type: string
    choices:
    - disable
    - low
    - medium
    - high
    - critical
    version_ranges:
    - - v6.0.0
      - ''
    description: Threat weight score for failed connections.
  url_block_detected:
    type: enum
    raw_type: string
    choices:
