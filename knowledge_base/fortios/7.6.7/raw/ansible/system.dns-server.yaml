id: system.dns-server
version: 7.6.7
source_object: fortios_system_dns_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_dns_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server name. Source system.interface.name.
    references:
    - system.interface.name
  mode:
    type: enum
    raw_type: string
    choices:
    - recursive
    - non-recursive
    - forward-only
    - resolver
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server mode.
  dnsfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS filter profile. Source dnsfilter.profile.name.
    references:
    - dnsfilter.profile.name
  doh:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable DNS over HTTPS/443 .
  doh3:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable DNS over QUIC/HTTP3/443 .
  doq:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable DNS over QUIC/853 .
