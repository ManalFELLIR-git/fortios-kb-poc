id: router.policy
version: 7.6.7
source_object: fortios_router_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_policy.py
root_type: list
attributes:
  seq_num:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Sequence number(1-65535). see <a href='#notes'>Notes</a>.
  input_device:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Incoming interface name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  input_device_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable negation of input device match.
  src:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP and mask (x.x.x.x/x).
    references:
    - x.x.x.x
    children:
      subnet:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP and mask.
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source address name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address/group name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  src_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable negation of source address match.
  dst:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination IP and mask (x.x.x.x/x).
    children:
      subnet:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP and mask.
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination address name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address/group name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  dst_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable negation of destination address match.
  action:
    type: enum
    raw_type: string
    choices:
    - deny
    - permit
    version_ranges:
    - - v6.0.0
      - ''
    description: Action of the policy route.
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocol number (0 - 255).
  start_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Start destination port number (0 - 65535).
  end_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: End destination port number (0 - 65535).
  start_source_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Start source port number (0 - 65535).
  end_source_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: End source port number (0 - 65535).
  gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address of the gateway.
  output_device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Outgoing interface name. Source system.interface.name.
    references:
    - system.interface.name
  tos:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Type of service bit pattern.
  tos_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Type of service evaluated bits.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this policy route.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  internet_service_id:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Destination Internet Service ID.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Destination Internet Service ID. see <a href='#notes'>Notes</a>. Source firewall.internet-service.id.
        references:
        - firewall.internet-service.id
  internet_service_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Destination Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Destination Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Destination Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Destination Internet Service name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  users:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.3
      - ''
    description: List of users.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.3
          - ''
        description: User name. Source user.local.name.
        references:
        - user.local.name
  groups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.3
      - ''
    description: List of user groups.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.3
          - ''
        description: Group name. Source user.group.name.
        references:
        - user.group.name
