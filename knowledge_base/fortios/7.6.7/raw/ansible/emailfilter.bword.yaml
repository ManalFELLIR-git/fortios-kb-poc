id: emailfilter.bword
version: 7.6.7
source_object: fortios_emailfilter_bword
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_emailfilter_bword.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Name of table.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Optional comments.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Spam filter banned word.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable status.
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Banned word entry ID. see <a href='#notes'>Notes</a>.
      pattern:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Pattern for the banned word.
      pattern_type:
        type: enum
        raw_type: string
        choices:
        - wildcard
        - regexp
        version_ranges:
        - - v6.2.0
          - ''
        description: Wildcard pattern or regular expression.
      action:
        type: enum
        raw_type: string
        choices:
        - spam
        - clear
        version_ranges:
        - - v6.2.0
          - ''
        description: Mark spam or good.
      where:
        type: enum
        raw_type: string
        choices:
        - subject
        - body
        - all
        version_ranges:
        - - v6.2.0
          - ''
        description: Component of the email to be scanned.
      language:
        type: enum
        raw_type: string
        choices:
        - western
        - simch
        - trach
        - japanese
        - korean
        - french
        - thai
        - spanish
        version_ranges:
        - - v6.2.0
          - ''
        description: Language for the banned word.
      score:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Score value.
