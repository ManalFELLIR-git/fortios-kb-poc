id: firewall.ipmacbinding.table
version: 7.6.7
source_object: fortios_firewall_ipmacbinding_table
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ipmacbinding_table.py
root_type: list
attributes:
  seq_num:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Entry number. see <a href='#notes'>Notes</a>.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'IPv4 address portion of the pair (format: xxx.xxx.xxx.xxx).'
  mac:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: MAC address portion of the pair (format = xx:xx:xx:xx:xx:xx in hexadecimal).
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the pair (optional).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this IP-mac binding pair.
