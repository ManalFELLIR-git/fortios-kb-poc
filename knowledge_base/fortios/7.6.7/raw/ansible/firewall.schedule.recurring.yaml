id: firewall.schedule.recurring
version: 7.6.7
source_object: fortios_firewall_schedule_recurring
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_schedule_recurring.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Recurring schedule name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  fabric_object:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Security Fabric global object setting.
  start:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day to start the schedule, format hh:mm.
  end:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day to end the schedule, format hh:mm.
  day:
    type: enum
    raw_type: list
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - none
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: One or more days of the week on which the schedule is valid. Separate the names of the days with a space.
  color:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Color of icon on the GUI.
  label_day:
    type: enum
    raw_type: string
    choices:
    - none
    - over-night
    - early-morning
    - morning
    - midday
    - afternoon
    - evening
    - night
    - late-night
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Configure a window during the time of day in which the schedule job is executed.
