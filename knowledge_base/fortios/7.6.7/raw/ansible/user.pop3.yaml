id: user.pop3
version: 7.6.7
source_object: fortios_user_pop3
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_pop3.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: POP3 server entry name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Server domain name or IP address.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: POP3 service port number.
  secure:
    type: enum
    raw_type: string
    choices:
    - none
    - starttls
    - pop3s
    version_ranges:
    - - v6.0.0
      - ''
    description: SSL connection.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
