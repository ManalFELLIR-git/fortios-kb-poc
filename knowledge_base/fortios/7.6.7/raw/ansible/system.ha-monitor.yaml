id: system.ha-monitor
version: 7.6.7
source_object: fortios_system_ha_monitor
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ha_monitor.py
root_type: object
attributes:
  monitor_vlan:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable monitor VLAN interfaces.
  vlan_hb_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure heartbeat interval (seconds).
  vlan_hb_lost_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: VLAN lost heartbeat threshold (1 - 60).
