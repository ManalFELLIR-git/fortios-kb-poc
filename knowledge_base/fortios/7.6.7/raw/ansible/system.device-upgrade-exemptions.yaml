id: system.device-upgrade-exemptions
version: 7.6.7
source_object: fortios_system_device_upgrade_exemptions
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_device_upgrade_exemptions.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v7.6.4
      - ''
    description: Device upgrade exemption ID (0 - 65535). see <a href='#notes'>Notes</a>.
  fortinet_device:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Fortinet extension device (FortiAP, FortiSwitch, FortiExtender).
  version:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Highest version of Fortinet firmware to exempt (format in Major.minor.patch, such as 7.6.4).
