id: firewall.security-policy
version: 7.6.7
source_object: fortios_firewall_security_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_security_policy.py
root_type: list
attributes:
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Policy ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Policy name.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  srcintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Incoming (ingress) interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  dstintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Outgoing (egress) interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Source IPv4 address name and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - system.external-resource.name
  srcaddr_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: When enabled srcaddr specifies what the source address must NOT be.
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Destination IPv4 address name and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name firewall.vip.name firewall.vipgrp.name
