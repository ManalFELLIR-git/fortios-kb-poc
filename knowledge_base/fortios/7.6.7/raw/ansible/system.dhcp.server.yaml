id: system.dhcp.server
version: 7.6.7
source_object: fortios_system_dhcp_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_dhcp_server.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this DHCP configuration.
  lease_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Lease time in seconds, 0 means unlimited.
  mac_acl_default_action:
    type: enum
    raw_type: string
    choices:
    - assign
    - block
    version_ranges:
    - - v6.0.0
      - ''
    description: MAC access control default action (allow or block assigning IP settings).
  forticlient_on_net_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiClient-On-Net service for this DHCP server.
  dns_service:
    type: enum
    raw_type: string
    choices:
    - local
    - default
    - specify
    version_ranges:
    - - v6.0.0
      - ''
    description: Options for assigning DNS servers to DHCP clients.
  dns_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server 1.
  dns_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server 2.
  dns_server3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server 3.
  dns_server4:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: DNS server 4.
  wifi_ac_service:
    type: enum
    raw_type: string
    choices:
    - specify
    - local
    version_ranges:
    - - v6.2.0
      - ''
    description: Options for assigning WiFi access controllers to DHCP clients.
  wifi_ac1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WiFi Access Controller 1 IP address (DHCP option 138, RFC 5417).
  wifi_ac2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WiFi Access Controller 2 IP address (DHCP option 138, RFC 5417).
  wifi_ac3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WiFi Access Controller 3 IP address (DHCP option 138, RFC 5417).
  ntp_service:
    type: enum
    raw_type: string
    choices:
    - local
    - default
    - specify
    version_ranges:
    - - v6.0.0
      - ''
    description: Options for assigning Network Time Protocol (NTP) servers to DHCP clients.
  ntp_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: NTP server 1.
  ntp_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: NTP server 2.
  ntp_server3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: NTP server 3.
  domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name suffix for the IP addresses that the DHCP server assigns to clients.
  wins_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WINS server 1.
  wins_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WINS server 2.
  default_gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default gateway IP address assigned by the DHCP server.
  netmask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Netmask assigned by the DHCP server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP server can assign IP configurations to clients connected to this interface. Source system.interface.name.
    references:
    - system.interface.name
  next_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address of a server, such as a TFTP server, from which DHCP clients can download a boot file.
  ip_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP IP range configuration.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Start of IP range.
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: End of IP range.
      vci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this range.
      vci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: One or more VCI strings in quotes separated by spaces.
        children:
          vci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: VCI strings.
      uci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.4
          - ''
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this range.
      uci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.4
          - ''
        description: One or more UCI strings in quotes separated by spaces.
        children:
          uci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.4
              - ''
            description: UCI strings.
      lease_time:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.4
          - ''
        description: Lease time in seconds, 0 means default lease time.
  timezone_option:
    type: enum
    raw_type: string
    choices:
    - disable
    - default
    - specify
    version_ranges:
    - - v6.0.0
      - ''
    description: Options for the DHCP server to set the client"s time zone.
  timezone:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Select the time zone to be assigned to DHCP clients. Source system.timezone.name.
    references:
    - system.timezone.name
  tftp_server:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: One or more hostnames or IP addresses of the TFTP servers in quotes separated by spaces.
    children:
      tftp_server:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: TFTP server.
  filename:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the boot file on the TFTP server.
  options:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP options.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      code:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: DHCP option code.
      type:
        type: enum
        raw_type: string
        choices:
        - hex
        - string
        - ip
        - fqdn
        version_ranges:
        - - v6.0.0
          - ''
        description: DHCP option type.
      value:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: DHCP option value.
      ip:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: DHCP option IPs.
      vci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this option.
      vci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: One or more VCI strings in quotes separated by spaces.
        children:
          vci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: VCI strings.
      uci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.4
          - ''
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this option.
      uci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.4
          - ''
        description: One or more UCI strings in quotes separated by spaces.
        children:
          uci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.4
              - ''
            description: UCI strings.
  server_type:
    type: enum
    raw_type: string
    choices:
    - regular
    - ipsec
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP server can be a normal DHCP server or an IPsec DHCP server.
  ip_mode:
    type: enum
    raw_type: string
    choices:
    - range
    - usrgrp
    version_ranges:
    - - v6.0.0
      - ''
    description: Method used to assign client IP.
  conflicted_ip_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds to wait after a conflicted IP address is removed from the DHCP range before it can be reused.
  ipsec_lease_hold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP over IPsec leases expire this many seconds after tunnel down (0 to disable forced-expiry).
  auto_configuration:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable auto configuration.
  dhcp_settings_from_fortiipam:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable populating of DHCP server settings from FortiIPAM.
  auto_managed_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable use of this DHCP server once this interface has been assigned an IP address from FortiIPAM.
  ddns_update:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DDNS update for DHCP.
  ddns_update_override:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DDNS update override for DHCP.
  ddns_server_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS server IP.
  ddns_zone:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Zone of your domain name (ex. DDNS.com).
  ddns_auth:
    type: enum
    raw_type: string
    choices:
    - disable
    - tsig
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS authentication mode.
  ddns_keyname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS update key name.
  ddns_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS update key (base 64 encoding).
  ddns_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: TTL.
  vci_match:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching VCI
      are served.
  vci_string:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: One or more VCI strings in quotes separated by spaces.
    children:
      vci_string:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: VCI strings.
  exclude_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Exclude one or more ranges of IP addresses from being assigned to clients.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Start of IP range.
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: End of IP range.
      vci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this range.
      vci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: One or more VCI strings in quotes separated by spaces.
        children:
          vci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: VCI strings.
      uci_match:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.2.4
          - ''
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this range.
      uci_string:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.4
          - ''
        description: One or more UCI strings in quotes separated by spaces.
        children:
          uci_string:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.4
              - ''
            description: UCI strings.
      lease_time:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.4
          - ''
        description: Lease time in seconds, 0 means default lease time.
  shared_subnet:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable shared subnet.
  relay_agent:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Relay agent IP.
  reserved_address:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Options for the DHCP server to assign IP settings to specific MAC addresses.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      type:
        type: enum
        raw_type: string
        choices:
        - mac
        - option82
        version_ranges:
        - - v6.2.0
          - ''
        description: DHCP reserved-address type.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IP address to be reserved for the MAC address.
      mac:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: MAC address of the client that will get the reserved IP address.
      action:
        type: enum
        raw_type: string
        choices:
        - assign
        - block
        - reserved
        version_ranges:
        - - v6.0.0
          - ''
        description: Options for the DHCP server to configure the client with the reserved MAC address.
      circuit_id_type:
        type: enum
        raw_type: string
        choices:
        - hex
        - string
        version_ranges:
        - - v6.2.0
          - ''
        description: DHCP option type.
      circuit_id:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Option 82 circuit-ID of the client that will get the reserved IP address.
      remote_id_type:
        type: enum
        raw_type: string
        choices:
        - hex
        - string
        version_ranges:
        - - v6.2.0
          - ''
        description: DHCP option type.
      remote_id:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Option 82 remote-ID of the client that will get the reserved IP address.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Description.
