id: user.fsso
version: 7.6.7
source_object: fortios_user_fsso
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_fsso.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  type:
    type: enum
    raw_type: string
    choices:
    - default
    - fortinac
    version_ranges:
    - - v6.2.0
      - ''
    description: Server type.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name or IP address of the first FSSO collector agent.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port of the first FSSO collector agent.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the first FSSO collector agent.
  server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name or IP address of the second FSSO collector agent.
  port2:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port of the second FSSO collector agent.
  password2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the second FSSO collector agent.
  server3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name or IP address of the third FSSO collector agent.
  port3:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port of the third FSSO collector agent.
  password3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the third FSSO collector agent.
  server4:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name or IP address of the fourth FSSO collector agent.
  port4:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port of the fourth FSSO collector agent.
  password4:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the fourth FSSO collector agent.
  server5:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name or IP address of the fifth FSSO collector agent.
  port5:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port of the fifth FSSO collector agent.
  password5:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the fifth FSSO collector agent.
  logon_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - ''
    description: Interval in minutes to keep logons after FSSO server down.
  ldap_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP server to get group information. Source user.ldap.name.
    references:
    - user.ldap.name
  group_poll_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Interval in minutes within to fetch groups from FSSO server, or unset to disable.
  ldap_poll:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable automatic fetching of groups from LDAP server.
  ldap_poll_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Interval in minutes within to fetch groups from LDAP server.
  ldap_poll_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Filter used to fetch groups.
  user_info_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: LDAP server to get user information. Source user.ldap.name.
    references:
    - user.ldap.name
  ssl:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable use of SSL.
  sni:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Server Name Indication.
  ssl_server_host_ip_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable server host/IP verification.
  ssl_trusted_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Trusted server certificate or CA certificate. Source vpn.certificate.remote.name vpn.certificate.ca.name.
    references:
    - vpn.certificate.ca.name
    - vpn.certificate.remote.name
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP for communications to FSSO agent.
  source_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source for communications to FSSO agent.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
