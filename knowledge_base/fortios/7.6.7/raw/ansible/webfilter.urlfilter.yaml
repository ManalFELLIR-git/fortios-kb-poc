id: webfilter.urlfilter
version: 7.6.7
source_object: fortios_webfilter_urlfilter
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_webfilter_urlfilter.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of URL filter list.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  one_arm_ips_urlfilter:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DNS resolver for one-arm IPS URL filter operation.
  ip_addr_block:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking URLs when the hostname appears as an IP address.
  ip4_mapped_ip6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable matching of IPv4 mapped IPv6 URLs.
  include_subdomains:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable matching subdomains. Applies only to simple type .
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: URL filter entries.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Id. see <a href='#notes'>Notes</a>.
      url:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: URL to be filtered.
      type:
        type: enum
        raw_type: string
        choices:
        - simple
        - regex
        - wildcard
        version_ranges:
        - - v6.0.0
          - ''
        description: Filter type (simple or wildcard). If table type "profile", regex also supported.
      action:
        type: enum
        raw_type: string
        choices:
        - exempt
        - block
        - allow
        - monitor
        version_ranges:
        - - v6.0.0
          - ''
        description: Action to take for URL filter matches.
      antiphish_action:
        type: enum
        raw_type: string
        choices:
        - block
        - log
        version_ranges:
        - - v6.4.0
          - ''
        description: Action to take for AntiPhishing matches.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable this URL filter.
      exempt:
        type: enum
        raw_type: list
        choices:
        - av
        - web-content
        - activex-java-cookie
        - dlp
        - fortiguard
        - range-block
        - pass
        - antiphish
        - all
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: If action is set to exempt, select the security profile operations that exempt URLs skip. Separate multiple
          options with a space.
      web_proxy_profile:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Web proxy profile. Source web-proxy.profile.name.
        references:
        - web-proxy.profile.name
      referrer_host:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Referrer host name.
      dns_address_family:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        - both
        version_ranges:
        - - v6.0.0
          - ''
        description: Resolve IPv4 address, IPv6 address, or both from DNS server.
      comment:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.4
          - ''
        description: Comment.
