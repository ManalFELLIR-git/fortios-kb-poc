id: firewall.internet-service-fortiguard
version: 7.6.7
source_object: fortios_firewall_internet_service_fortiguard
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_fortiguard.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.4
      - ''
    description: Internet Service name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Comment.
  entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: Entries added to the Internet Service FortiGuard database.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: Entry ID(1-255). see <a href='#notes'>Notes</a>.
      addr_mode:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        version_ranges:
        - - v7.6.4
          - ''
        description: Address mode (IPv4 or IPv6).
      protocol:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.4
          - ''
        description: Integer value for the protocol type as defined by IANA (0 - 255).
      port_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.4
          - ''
        description: Port ranges in the custom entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.6.4
              - ''
            description: Custom entry port range ID. see <a href='#notes'>Notes</a>.
          start_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.4
              - ''
            description: Integer value for starting TCP/UDP/SCTP destination port in range (0 to 65535).
          end_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.4
              - ''
            description: Integer value for ending TCP/UDP/SCTP destination port in range (0 to 65535).
      dst:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.4
          - ''
        description: Destination address or address group name.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.6.4
              - ''
            description: Select the destination address or address group object from available options. Source firewall.address.name
              firewall .addrgrp.name.
            references:
            - firewall.address.name
      dst6:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.4
          - ''
        description: Destination address6 or address6 group name.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.6.4
              - ''
            description: Select the destination address6 or address group object from available options. Source firewall.address6.name
              firewall .addrgrp6.name.
            references:
            - firewall.address6.name
