      - ''
    description: Country or region in which the FortiGate is located. The country determines the 802.11 bands and channels
      that are available.
  duplicate_ssid:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing Virtual Access Points (VAPs) to use the same SSID name in the same VDOM.
  fapc_compatibility:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FAP-C series compatibility.
  wfa_compatibility:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable WFA compatibility.
  phishing_ssid_detect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable phishing SSID detection.
  fake_ssid_action:
    type: enum
    raw_type: list
    choices:
    - log
    - suppress
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: Actions taken for detected fake SSID.
  offending_ssid:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure offending SSID.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      ssid_pattern:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Define offending SSID pattern (case insensitive). For example, word, word*, *word, wo*rd.
      action:
        type: enum
        raw_type: list
        choices:
        - log
        - suppress
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.2.0
          - ''
        description: Actions taken for detected offending SSID.
  device_weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Upper limit of confidence of device for identification (0 - 255).
  device_holdoff:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Lower limit of creation time of device for identification in minutes (0 - 60).
  device_idle:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Upper limit of idle time of device for identification in minutes (0 - 14400).
  firmware_provision_on_authorization:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable automatic provisioning of latest firmware on authorization.
  rolling_wtp_upgrade:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable rolling WTP upgrade .
  darrp_optimize:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Time for running Distributed Automatic Radio Resource Provisioning (DARRP) optimizations (0 - 86400 sec).
  darrp_optimize_schedules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Firewall schedules for DARRP running time. DARRP will run periodically based on darrp-optimize within the
      schedules. Separate multiple schedule names with a space.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Schedule name. Source firewall.schedule.group.name firewall.schedule.recurring.name firewall.schedule.onetime.name.
        references:
        - firewall.schedule.group.name
        - firewall.schedule.onetime.name
        - firewall.schedule.recurring.name
