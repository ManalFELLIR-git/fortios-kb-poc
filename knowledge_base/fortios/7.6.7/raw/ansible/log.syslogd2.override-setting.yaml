id: log.syslogd2.override-setting
version: 7.6.7
source_object: fortios_log_syslogd2_override_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_syslogd2_override_setting.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable remote syslog logging.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Address of remote syslog server.
  mode:
    type: enum
    raw_type: string
    choices:
    - udp
    - legacy-reliable
    - reliable
    version_ranges:
    - - v6.2.0
      - ''
    description: Remote syslog logging over UDP/Reliable TCP.
  use_management_vdom:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable use of management VDOM as source VDOM for logs sent to syslog server.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Server listen port.
  facility:
    type: enum
    raw_type: string
    choices:
    - kernel
    - user
    - mail
    - daemon
    - auth
    - syslog
    - lpr
    - news
    - uucp
    - cron
    - authpriv
    - ftp
    - ntp
    - audit
    - alert
    - clock
    - local0
    - local1
    - local2
    - local3
    - local4
    - local5
    - local6
    - local7
    version_ranges:
    - - v6.2.0
      - ''
    description: Remote syslog facility.
  source_ip_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Source interface of syslog. Source system.interface.name.
    references:
    - system.interface.name
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Source IP address of syslog.
  format:
    type: enum
    raw_type: string
    choices:
    - default
    - csv
    - cef
    - rfc5424
    - json
    version_ranges:
    - - v6.2.0
      - ''
    description: Log format.
  priority:
    type: enum
    raw_type: string
    choices:
    - default
    - low
    version_ranges:
    - - v6.2.0
      - ''
    description: Set log transmission priority.
  max_log_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Syslog maximum log rate in MBps (0 = unlimited).
  enc_algorithm:
    type: enum
    raw_type: string
    choices:
    - high-medium
    - high
    - low
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable reliable syslogging with TLS encryption.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.2.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Certificate used to communicate with Syslog server. Source certificate.local.name.
    references:
    - certificate.local.name
  custom_field_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom field name for CEF format logging.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Entry ID. see <a href='#notes'>Notes</a>.
      name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Field name [A-Za-z0-9_].
      custom:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Field custom name [A-Za-z0-9_].
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
