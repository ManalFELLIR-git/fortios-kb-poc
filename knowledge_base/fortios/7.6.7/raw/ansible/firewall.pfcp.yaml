id: firewall.pfcp
version: 7.6.7
source_object: fortios_firewall_pfcp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_pfcp.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: PFCP profile name.
  min_message_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Minimum message length.
  max_message_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Maximum message length.
  monitor_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    - vdom
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: PFCP monitor mode.
  message_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: PFCP message filter. Source pfcp.message-filter.name.
    references:
    - pfcp.message-filter.name
  pfcp_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Set PFCP timeout (in seconds).
  unknown_version:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny unknown version packets.
  invalid_reserved_field:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny invalid reserved field in PFCP header packets.
  forwarded_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Enable/disable logging forwarded PFCP packets.
  denied_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Enable/disable logging denied PFCP packets.
  traffic_count_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Enable/disable logging session traffic counter.
  log_freq:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Logging frequency of PFCP packets.
