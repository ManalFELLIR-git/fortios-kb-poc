id: casb.saas-application
version: 7.6.7
source_object: fortios_casb_saas_application
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_casb_saas_application.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.1
      - ''
    description: SaaS application name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable setting.
  type:
    type: enum
    raw_type: string
    choices:
    - built-in
    - customized
    version_ranges:
    - - v7.4.1
      - ''
    description: SaaS application type.
  casb_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: SaaS application signature name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: SaaS application description.
  domains:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: SaaS application domain list.
    children:
      domain:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: Domain list separated by space.
  output_attributes:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: SaaS application output attributes.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute name.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute description.
      type:
        type: enum
        raw_type: string
        choices:
        - string
        - string-list
        - integer
        - integer-list
        - boolean
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute format type.
      optional:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.3
          - ''
        description: CASB output attribute optional.
  input_attributes:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: SaaS application input attributes.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute name.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute description.
      type:
        type: enum
        raw_type: string
        choices:
        - string
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute format type.
      required:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB input attribute required.
      default:
        type: enum
        raw_type: string
        choices:
        - string
        - string-list
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute default value.
      fallback_input:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB attribute legacy input.
