id: wireless-controller.vap-group
version: 7.6.7
source_object: fortios_wireless_controller_vap_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_vap_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Group Name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  vaps:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: List of SSIDs to be included in the VAP group.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: VAP name. Source wireless-controller.vap.name.
        references:
        - wireless-controller.vap.name
