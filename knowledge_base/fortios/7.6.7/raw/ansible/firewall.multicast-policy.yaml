id: firewall.multicast-policy
version: 7.6.7
source_object: fortios_firewall_multicast_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_multicast_policy.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID ((0 - 4294967294). see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Policy name.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Comment.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this policy.
  srcintf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
    references:
    - system.interface.name
    - system.sdwan.zone.name
    - system.zone.name
  dstintf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
    references:
    - system.interface.name
    - system.sdwan.zone.name
    - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Source address objects. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Destination address objects. Source firewall.multicast-address.name.
        references:
        - firewall.multicast-address.name
  snat:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable substitution of the outgoing interface IP address for the original source IP address (called
      source NAT or SNAT).
  snat_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address to be used as the source address for NATed traffic.
  dnat:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 DNAT address used for multicast destination addresses.
  action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept or deny traffic matching the policy.
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for the protocol type as defined by IANA (0 - 255).
  start_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for starting TCP/UDP/SCTP destination port in range (1 - 65535).
  end_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for ending TCP/UDP/SCTP destination port in range (1 - 65535).
  utm_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable to add an IPS security profile to the policy.
  ips_sensor:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Name of an existing IPS sensor. Source ips.sensor.name.
    references:
    - ips.sensor.name
  logtraffic:
    type: enum
    raw_type: string
    choices:
    - all
    - utm
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable or disable logging. Log all sessions or security profile sessions.
  auto_asic_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable offloading policy traffic for hardware acceleration.
  traffic_shaper:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Traffic shaper to apply to traffic forwarded by the multicast policy. Source firewall.shaper.traffic-shaper.name.
    references:
    - firewall.shaper.traffic-shaper.name
