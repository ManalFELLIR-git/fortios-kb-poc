id: authentication.setting
version: 7.6.7
source_object: fortios_authentication_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_authentication_setting.py
root_type: object
attributes:
  active_auth_scheme:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Active authentication method (scheme name). Source authentication.scheme.name.
    references:
    - authentication.scheme.name
  sso_auth_scheme:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Single-Sign-On authentication method (scheme name). Source authentication.scheme.name.
    references:
    - authentication.scheme.name
  update_time:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Time of the last update.
  persistent_cookie:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable persistent cookie on web portal authentication .
  ip_auth_cookie:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable persistent cookie on IP based web portal authentication .
  cookie_max_age:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Persistent web portal cookie maximum age in minutes (30 - 10080 (1 week)).
  cookie_refresh_div:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Refresh rate divider of persistent web portal cookie . Refresh value = cookie-max-age/cookie-refresh-div.
  captive_portal_type:
    type: enum
    raw_type: string
    choices:
    - fqdn
    - ip
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal type.
  captive_portal_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal IP address.
  captive_portal_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal IPv6 address.
  captive_portal:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal host name. Source firewall.address.name.
    references:
    - firewall.address.name
  captive_portal6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 captive portal host name. Source firewall.address6.name.
    references:
    - firewall.address6.name
  cert_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable redirecting certificate authentication to HTTPS portal.
  cert_captive_portal:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Certificate captive portal host name. Source firewall.address.name.
    references:
    - firewall.address.name
  cert_captive_portal_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Certificate captive portal IP address.
  cert_captive_portal_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - ''
    description: Certificate captive portal port number (1 - 65535).
  captive_portal_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal port number (1 - 65535).
  auth_https:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable redirecting HTTP user authentication to HTTPS.
  captive_portal_ssl_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Captive portal SSL port number (1 - 65535).
  ems_root_ca:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.7
      - ''
    description: Enable/disable use of the EMS root CA for FortiClient, ZTNA, and endpoint authentication .
  user_cert_ca:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: CA certificate used for client certificate verification.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: CA certificate list. Source vpn.certificate.ca.name vpn.certificate.local.name.
        references:
        - vpn.certificate.ca.name
        - vpn.certificate.local.name
  dev_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Address range for the IP based device query.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
