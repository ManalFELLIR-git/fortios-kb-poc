id: switch-controller.global
version: 7.6.7
source_object: fortios_switch_controller_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_global.py
root_type: object
attributes:
  mac_aging_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time after which an inactive MAC is aged out (10 - 1000000 sec).
  https_image_push:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable image push to FortiSwitch using HTTPS.
  vlan_all_mode:
    type: enum
    raw_type: string
    choices:
    - all
    - defined
    version_ranges:
    - - v6.2.0
      - ''
    description: VLAN configuration mode, user-defined-vlans or all-possible-vlans.
  vlan_optimization:
    type: enum
    raw_type: string
    choices:
    - prune
    - configured
    - none
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiLink VLAN optimization.
  vlan_identity:
    type: enum
    raw_type: string
    choices:
    - description
    - name
    version_ranges:
    - - v7.4.1
      - ''
    description: Identity of the VLAN. Commonly used for RADIUS Tunnel-Private-Group-Id.
  disable_discovery:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Prevent this FortiSwitch from discovering.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: FortiSwitch Serial-number.
  mac_retention_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in hours after which an inactive MAC is removed from client DB (0 = aged out based on mac-aging-interval).
  default_virtual_switch_vlan:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default VLAN for ports when added to the virtual-switch. Source system.interface.name.
    references:
    - system.interface.name
  dhcp_server_access_list:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable DHCP snooping server access list.
  dhcp_option82_format:
    type: enum
    raw_type: string
    choices:
    - ascii
    - legacy
    version_ranges:
    - - v7.4.0
      - ''
    description: DHCP option-82 format string.
  dhcp_option82_circuit_id:
    type: enum
    raw_type: list
    choices:
    - intfname
    - vlan
    - hostname
    - mode
    - description
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.0
      - ''
    description: List the parameters to be included to inform about client identification.
  dhcp_option82_remote_id:
    type: enum
    raw_type: list
    choices:
    - mac
    - hostname
    - ip
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.0
      - ''
    description: List the parameters to be included to inform about client identification.
  dhcp_snoop_client_req:
    type: enum
    raw_type: string
    choices:
    - drop-untrusted
    - forward-untrusted
    version_ranges:
    - - v7.4.0
      - ''
    description: Client DHCP packet broadcast mode.
  dhcp_snoop_client_db_exp:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Expiry time for DHCP snooping server database entries (300 - 259200 sec).
  dhcp_snoop_db_per_port_learn_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Per Interface dhcp-server entries learn limit (0 - 1024).
  log_mac_limit_violations:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logs for Learning Limit Violations.
  mac_violation_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Set timeout for Learning Limit Violations (0 = disabled).
  sn_dns_resolution:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable DNS resolution of the FortiSwitch unit"s IP address with switch name.
  mac_event_logging:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable MAC address event logging.
  bounce_quarantined_link:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable bouncing (administratively bring the link down, up) of a switch port where a quarantined device
      was seen last. Helps to re-initiate the DHCP process for a device.
  quarantine_mode:
    type: enum
    raw_type: string
    choices:
    - by-vlan
    - by-redirect
    version_ranges:
    - - v6.4.0
      - ''
    description: Quarantine mode.
  update_user_device:
    type: enum
    raw_type: list
    choices:
    - mac-cache
    - lldp
    - dhcp-snooping
    - l2-db
    - l3-db
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Control which sources update the device user list.
  custom_command:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: List of custom commands to be pushed to all FortiSwitches in the VDOM.
    children:
      command_entry:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: List of FortiSwitch commands.
      command_name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Name of custom command to push to all FortiSwitches in VDOM. Source switch-controller.custom-command.command-name.
        references:
        - switch-controller.custom-command.command-name
  fips_enforce:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable enforcement of FIPS on managed FortiSwitch devices.
  firmware_provision_on_authorization:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable automatic provisioning of latest firmware on authorization.
  switch_on_deauth:
    type: enum
    raw_type: string
    choices:
    - no-op
    - factory-reset
    version_ranges:
    - - v7.6.1
      - ''
    description: No-operation/Factory-reset the managed FortiSwitch on deauthorization.
  firewall_auth_user_hold_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.4
      - ''
    description: Time period in minutes to hold firewall authenticated MAC users (5 - 1440).
