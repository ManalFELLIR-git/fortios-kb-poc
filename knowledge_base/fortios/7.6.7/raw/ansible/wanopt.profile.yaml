id: wanopt.profile
version: 7.6.7
source_object: fortios_wanopt_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wanopt_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Profile name.
  transparent:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable transparent mode.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  auth_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optionally add an authentication group to restrict access to the WAN Optimization tunnel to peers in the
      authentication group. Source wanopt.auth-group.name.
    references:
    - wanopt.auth-group.name
  http:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HTTP WAN Optimization and configure HTTP WAN Optimization features.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable WAN Optimization.
      secure_tunnel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
      byte_caching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
      ssl:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable SSL/TLS offloading (hardware acceleration) for traffic in this tunnel.
      prefer_chunking:
        type: enum
        raw_type: string
        choices:
        - dynamic
        - fix
        version_ranges:
        - - v6.0.0
          - ''
        description: Select dynamic or fixed-size data chunking for WAN Optimization.
      protocol_opt:
        type: enum
        raw_type: string
        choices:
        - protocol
        - tcp
        version_ranges:
        - - v6.4.0
          - ''
        description: Select protocol specific optimization or generic TCP optimization.
      tunnel_sharing:
        type: enum
        raw_type: string
        choices:
        - shared
        - express-shared
        - private
        version_ranges:
        - - v6.0.0
          - ''
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
  cifs:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable CIFS (Windows sharing) WAN Optimization and configure CIFS WAN Optimization features.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable WAN Optimization.
      secure_tunnel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
      byte_caching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
      prefer_chunking:
        type: enum
        raw_type: string
        choices:
        - dynamic
        - fix
        version_ranges:
        - - v6.0.0
          - ''
        description: Select dynamic or fixed-size data chunking for WAN Optimization.
      protocol_opt:
        type: enum
        raw_type: string
        choices:
        - protocol
        - tcp
        version_ranges:
        - - v6.4.0
          - ''
        description: Select protocol specific optimization or generic TCP optimization.
      tunnel_sharing:
        type: enum
        raw_type: string
        choices:
        - shared
        - express-shared
        - private
        version_ranges:
        - - v6.0.0
          - ''
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
  mapi:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable MAPI email WAN Optimization and configure MAPI WAN Optimization features.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable WAN Optimization.
      secure_tunnel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
      byte_caching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
      tunnel_sharing:
        type: enum
        raw_type: string
        choices:
        - shared
        - express-shared
        - private
        version_ranges:
        - - v6.0.0
          - ''
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
  ftp:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FTP WAN Optimization and configure FTP WAN Optimization features.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable WAN Optimization.
      secure_tunnel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
      byte_caching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
      prefer_chunking:
        type: enum
        raw_type: string
        choices:
        - dynamic
        - fix
        version_ranges:
        - - v6.0.0
          - ''
        description: Select dynamic or fixed-size data chunking for WAN Optimization.
      protocol_opt:
        type: enum
        raw_type: string
        choices:
        - protocol
        - tcp
        version_ranges:
        - - v6.4.0
          - ''
        description: Select protocol specific optimization or generic TCP optimization.
      tunnel_sharing:
        type: enum
        raw_type: string
        choices:
        - shared
        - express-shared
        - private
        version_ranges:
        - - v6.0.0
          - ''
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
  tcp:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable TCP WAN Optimization and configure TCP WAN Optimization features.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable WAN Optimization.
      secure_tunnel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
      byte_caching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
      byte_caching_opt:
        type: enum
        raw_type: string
        choices:
        - mem-only
        - mem-disk
        version_ranges:
        - - v6.0.0
          - ''
        description: Select whether TCP byte-caching uses system memory only or both memory and disk space.
      tunnel_sharing:
        type: enum
        raw_type: string
        choices:
        - shared
        - express-shared
        - private
        version_ranges:
        - - v6.0.0
          - ''
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
      port:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Port numbers or port number ranges for TCP. Only packets with a destination port number that matches
          this port number or range are accepted by this profile.
      ssl:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable SSL/TLS offloading (hardware acceleration) for traffic in this tunnel.
      ssl_port:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Port numbers or port number ranges on which to expect HTTPS traffic for SSL/TLS offloading.
