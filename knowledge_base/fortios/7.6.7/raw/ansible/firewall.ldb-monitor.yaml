id: firewall.ldb-monitor
version: 7.6.7
source_object: fortios_firewall_ldb_monitor
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ldb_monitor.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Monitor name.
  type:
    type: enum
    raw_type: string
    choices:
    - ping
    - tcp
    - http
    - https
    - dns
    - passive-sip
    version_ranges:
    - - v6.0.0
      - ''
    description: Select the Monitor type used by the health check monitor to check the health of the server (PING | TCP |
      HTTP | HTTPS | DNS).
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between health checks (5 - 65535 sec).
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time to wait to receive response to a health check from a server. Reaching the timeout means the health check
      failed (1 - 255 sec).
  retry:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number health check attempts before the server is considered down (1 - 255).
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Service port used to perform the health check. If 0, health check monitor inherits port configured for the
      server (0 - 65535).
  src_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Source IP for ldb-monitor.
  http_get:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Request URI used to send a GET request to check the health of an HTTP server. Optionally provide a hostname
      before the first "/" and it will be used as the HTTP Host Header.
  http_match:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: String to match the value expected in response to an HTTP-GET request.
  http_max_redirects:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The maximum number of HTTP redirects to be allowed (0 - 5).
  dns_protocol:
    type: enum
    raw_type: string
    choices:
    - udp
    - tcp
    version_ranges:
    - - v7.0.0
      - ''
    description: Select the protocol used by the DNS health check monitor to check the health of the server (UDP | TCP).
  dns_request_domain:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Fully qualified domain name to resolve for the DNS probe.
  dns_match_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Response IP expected from DNS server.
