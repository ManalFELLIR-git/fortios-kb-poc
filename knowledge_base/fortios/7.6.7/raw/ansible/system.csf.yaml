id: system.csf
version: 7.6.7
source_object: fortios_system_csf
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_csf.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Security Fabric.
  uid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Unique ID of the current CSF node
  upstream:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: IP/FQDN of the FortiGate upstream from this FortiGate in the Security Fabric.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Source IP address for communication with the upstream FortiGate.
  upstream_interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  upstream_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  upstream_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The port number to use to communicate with the FortiGate upstream from this FortiGate in the Security Fabric
      .
  group_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Security Fabric group name. All FortiGates in a Security Fabric must have the same group name.
  group_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Security Fabric group password. For legacy authentication, fabric members must have the same group password.
  accept_auth_by_cert:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Accept connections with unknown certificates and ask admin for approval.
  log_unification:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable broadcast of discovery messages for log unification.
  authorization_request_type:
    type: enum
    raw_type: string
    choices:
    - serial
    - certificate
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Authorization request type.
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Certificate. Source certificate.local.name.
    references:
    - certificate.local.name
  fabric_workers:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: Number of worker processes for Security Fabric daemon.
  downstream_access:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable downstream device access to this device"s configuration and data.
  legacy_authentication:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable legacy authentication.
  downstream_accprofile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Default access profile for requests from downstream devices. Source system.accprofile.name.
    references:
    - system.accprofile.name
  configuration_sync:
    type: enum
    raw_type: string
    choices:
    - default
    - local
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration sync mode.
  fabric_object_unification:
    type: enum
    raw_type: string
    choices:
    - default
    - local
    version_ranges:
    - - v6.4.0
      - ''
    description: Fabric CMDB Object Unification.
  saml_configuration_sync:
    type: enum
    raw_type: string
    choices:
    - default
    - local
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: SAML setting configuration synchronization.
  trusted_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-authorized and blocked security fabric nodes.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Name.
      action:
        type: enum
        raw_type: string
        choices:
        - accept
        - deny
        version_ranges:
        - - v6.0.0
          - ''
        description: Security fabric authorization action.
      index:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.4
          - ''
        description: Index of the downstream in tree.
      authorization_type:
        type: enum
        raw_type: string
        choices:
        - serial
        - certificate
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - v7.6.7
        description: Authorization type.
      serial:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - v7.6.7
        description: Serial.
      certificate:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - v7.6.7
        description: Certificate.
      ha_members:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - v7.6.7
        description: HA members.
      downstream_authorization:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - v7.6.7
        description: Trust authorizations by this node"s administrator.
  fabric_connector:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Fabric connector configuration.
    children:
      serial:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Serial.
      accprofile:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Override access profile. Source system.accprofile.name.
        references:
        - system.accprofile.name
      configuration_write_access:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.0.0
          - ''
        description: Enable/disable downstream device write access to configuration.
      vdom:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.0
          - ''
        description: Virtual domains that the connector has access to. If none are set, the connector will only have access
          to the VDOM that it joins the Security Fabric through.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.0
              - ''
            description: Virtual domain name. Source system.vdom.name.
            references:
            - system.vdom.name
  forticloud_account_enforcement:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.4
      - ''
    description: Fabric FortiCloud account unification.
  file_mgmt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable Security Fabric daemon file management.
  file_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Maximum amount of memory that can be used by the daemon files (in bytes).
  file_quota_warning:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Warn when the set percentage of quota has been used.
