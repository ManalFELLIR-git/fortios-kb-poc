id: endpoint-control.fctems
version: 7.6.7
source_object: fortios_endpoint_control_fctems
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_endpoint_control_fctems.py
root_type: list
attributes:
  ems_id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: EMS ID in order (1 - 7). see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable or disable this EMS configuration.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiClient Enterprise Management Server (EMS) name.
  dirty_reason:
    type: enum
    raw_type: string
    choices:
    - none
    - mismatched-ems-sn
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Dirty Reason for FortiClient EMS.
  fortinetone_cloud_authentication:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable authentication of FortiClient EMS Cloud through FortiCloud account.
  cloud_authentication_access_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: FortiClient EMS Cloud multitenancy access key
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiClient EMS FQDN or IPv4 address.
  https_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiClient EMS HTTPS access port number. (1 - 65535).
  serial_number:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.7
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: EMS Serial Number.
  tenant_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: EMS Tenant ID.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: REST API call source IP.
  pull_sysinfo:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable pulling SysInfo from EMS.
  pull_vulnerabilities:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable pulling vulnerabilities from EMS.
  pull_tags:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable pulling FortiClient user tags from EMS.
  pull_malware_hash:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable pulling FortiClient malware hash from EMS.
  capabilities:
    type: enum
    raw_type: list
    choices:
    - fabric-auth
    - silent-approval
    - websocket
    - websocket-malware
    - push-ca-certs
    - common-tags-api
    - tenant-id
    - client-avatars
    - single-vdom-connector
    - fgt-sysinfo-api
    - ztna-server-info
    - used-tags
    - crl
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: List of EMS capabilities.
  call_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiClient EMS call timeout in seconds (1 - 180 seconds).
  out_of_sync_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.8
      - ''
    description: Outdated resource threshold in seconds (10 - 2592000).
  send_tags_to_all_vdoms:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Relax restrictions on tags to send all EMS tags to all VDOMs
  websocket_override:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable override behavior for how this FortiGate unit connects to EMS using a WebSocket connection.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.0.6
      - v7.0.12
    - - v7.2.1
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.6
      - v7.0.12
    - - v7.2.1
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  trust_ca_cn:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.12
      - v7.0.12
    - - v7.2.4
      - ''
    description: Enable/disable trust of the EMS certificate issuer(CA) and common name(CN) for certificate auto-renewal.
  verifying_ca:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Lowest CA cert on Fortigate in verified EMS cert chain. Source certificate.ca.name vpn.certificate.ca.name.
    references:
    - certificate.ca.name
    - vpn.certificate.ca.name
