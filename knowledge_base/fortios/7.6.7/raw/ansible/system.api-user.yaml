id: system.api-user
version: 7.6.7
source_object: fortios_system_api_user
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_api_user.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: User name.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  api_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Admin user password.
  accprofile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Admin user access profile. Source system.accprofile.name.
    references:
    - system.accprofile.name
  vdom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual domains.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Virtual domain name. Source system.vdom.name.
        references:
        - system.vdom.name
  schedule:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule name.
  cors_allow_origin:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Value for Access-Control-Allow-Origin on API responses. Avoid using "*" if possible.
  peer_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable peer authentication.
  peer_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer group name.
  trusthost:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusthost.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      type:
        type: enum
        raw_type: string
        choices:
        - ipv4-trusthost
        - ipv6-trusthost
        version_ranges:
        - - v6.0.0
          - ''
        description: Trusthost type.
      ipv4_trusthost:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 trusted host address.
      ipv6_trusthost:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 trusted host address.
