id: system.auto-script
version: 7.6.7
source_object: fortios_system_auto_script
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_auto_script.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Auto script name.
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Repeat interval in seconds.
  repeat:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of times to repeat this script (0 = infinite).
  start:
    type: enum
    raw_type: string
    choices:
    - manual
    - auto
    version_ranges:
    - - v6.0.0
      - ''
    description: Script starting mode.
  script:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: List of FortiOS CLI commands to repeat.
  output_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of megabytes to limit script output to (10 - 1024).
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Maximum running time for this script in seconds (0 = no timeout).
