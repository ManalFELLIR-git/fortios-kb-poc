id: router.auth-path
version: 7.6.7
source_object: fortios_router_auth_path
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_auth_path.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the entry.
  device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Outgoing interface. Source system.interface.name.
    references:
    - system.interface.name
  gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway IP address.
