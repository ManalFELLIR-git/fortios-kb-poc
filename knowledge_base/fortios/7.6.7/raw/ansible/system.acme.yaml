id: system.acme
version: 7.6.7
source_object: fortios_system_acme
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_acme.py
root_type: object
attributes:
  interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Interface(s) on which the ACME client will listen for challenges.
    children:
      interface_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  use_ha_direct:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable the use of "ha-mgmt" interface to connect to the ACME server when "ha-direct" is enabled in HA configuration
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.6
      - ''
    description: Source IPv4 address used to connect to the ACME server.
  source_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.6
      - ''
    description: Source IPv6 address used to connect to the ACME server.
  accounts:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: ACME accounts list.
    children:
      id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Account id.
      status:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Account status.
      url:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Account url.
      ca_url:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Account ca_url.
      email:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Account email.
      eab_key_id:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.3
          - ''
        description: External Acccount Binding Key ID.
      eab_key_hmac:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.3
          - ''
        description: External Acccount Binding Key HMAC.
      privatekey:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Account Private Key.
