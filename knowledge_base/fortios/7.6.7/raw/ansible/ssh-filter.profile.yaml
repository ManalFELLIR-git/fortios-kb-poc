id: ssh-filter.profile
version: 7.6.7
source_object: fortios_ssh_filter_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ssh_filter_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH filter profile name.
  block:
    type: enum
    raw_type: list
    choices:
    - x11
    - shell
    - exec
    - port-forward
    - tun-forward
    - sftp
    - scp
    - unknown
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH blocking options.
  log:
    type: enum
    raw_type: list
    choices:
    - x11
    - shell
    - exec
    - port-forward
    - tun-forward
    - sftp
    - scp
    - unknown
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH logging options.
  default_command_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging unmatched shell commands.
  shell_commands:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH command filter.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Id. see <a href='#notes'>Notes</a>.
      type:
        type: enum
        raw_type: string
        choices:
        - simple
        - regex
        version_ranges:
        - - v6.0.0
          - ''
        description: Matching type.
      pattern:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: SSH shell command pattern.
      action:
        type: enum
        raw_type: string
        choices:
        - block
        - allow
        version_ranges:
        - - v6.0.0
          - ''
        description: Action to take for SSH shell command matches.
      log:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable logging.
      alert:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable alert.
      severity:
        type: enum
        raw_type: string
        choices:
        - low
        - medium
        - high
        - critical
        version_ranges:
        - - v6.0.0
          - ''
        description: Log severity.
