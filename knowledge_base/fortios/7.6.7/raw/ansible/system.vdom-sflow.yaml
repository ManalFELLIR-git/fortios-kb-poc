id: system.vdom-sflow
version: 7.6.7
source_object: fortios_system_vdom_sflow
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_vdom_sflow.py
root_type: object
attributes:
  vdom_sflow:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the sFlow configuration for the current VDOM.
  collectors:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: sFlow collectors.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      collector_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.2
          - ''
        description: IP addresses of the sFlow collectors that sFlow agents added to interfaces in this VDOM send sFlow datagrams
          to.
      collector_port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.2
          - ''
        description: UDP port number used for sending sFlow datagrams (configure only if required by your sFlow collector
          or your network configuration) (0 - 65535).
      source_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.2
          - ''
        description: Source IP address for sFlow agent.
      interface_select_method:
        type: enum
        raw_type: string
        choices:
        - auto
        - sdwan
        - specify
        version_ranges:
        - - v7.4.2
          - ''
        description: Specify how to select outgoing interface to reach server.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.2
          - ''
        description: Specify outgoing interface to reach server. Source system.interface.name.
        references:
        - system.interface.name
