id: system.vdom-property
version: 7.6.7
source_object: fortios_system_vdom_property
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_vdom_property.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: VDOM name. Source system.vdom.name.
    references:
    - system.vdom.name
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  snmp_index:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Permanent SNMP Index of the virtual domain (1 - 2147483647).
  session:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of sessions.
  ipsec_phase1:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of VPN IPsec phase 1 tunnels.
  ipsec_phase2:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of VPN IPsec phase 2 tunnels.
  ipsec_phase1_interface:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of VPN IPsec phase1 interface tunnels.
  ipsec_phase2_interface:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of VPN IPsec phase2 interface tunnels.
  dialup_tunnel:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of dial-up tunnels.
  firewall_policy:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall policies (policy, DoS-policy4, DoS-policy6, multicast).
  firewall_address:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall addresses (IPv4, IPv6, multicast).
  firewall_addrgrp:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall address groups (IPv4, IPv6).
  custom_service:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall custom services.
  service_group:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall service groups.
  onetime_schedule:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall one-time schedules.
  recurring_schedule:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of firewall recurring schedules.
  user:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of local users.
  user_group:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of user groups.
  sslvpn:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of Agentless VPNs.
  proxy:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum guaranteed number of concurrent proxy users.
  log_disk_quota:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Log disk quota in megabytes (MB). Range depends on how much disk space is available.
