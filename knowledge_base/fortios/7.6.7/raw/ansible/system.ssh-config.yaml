id: system.ssh-config
version: 7.6.7
source_object: fortios_system_ssh_config
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ssh_config.py
root_type: object
attributes:
  ssh_kex_algo:
    type: enum
    raw_type: list
    choices:
    - diffie-hellman-group1-sha1
    - diffie-hellman-group14-sha1
    - diffie-hellman-group14-sha256
    - diffie-hellman-group16-sha512
    - diffie-hellman-group18-sha512
    - diffie-hellman-group-exchange-sha1
    - diffie-hellman-group-exchange-sha256
    - curve25519-sha256@libssh.org
    - ecdh-sha2-nistp256
    - ecdh-sha2-nistp384
    - ecdh-sha2-nistp521
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.4
      - ''
    description: Select one or more SSH kex algorithms.
  ssh_enc_algo:
    type: enum
    raw_type: list
    choices:
    - chacha20-poly1305@openssh.com
    - aes128-ctr
    - aes192-ctr
    - aes256-ctr
    - arcfour256
    - arcfour128
    - aes128-cbc
    - 3des-cbc
    - blowfish-cbc
    - cast128-cbc
    - aes192-cbc
    - aes256-cbc
    - arcfour
    - rijndael-cbc@lysator.liu.se
    - aes128-gcm@openssh.com
    - aes256-gcm@openssh.com
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.4
      - ''
    description: Select one or more SSH ciphers.
  ssh_mac_algo:
    type: enum
    raw_type: list
    choices:
    - hmac-md5
    - hmac-md5-etm@openssh.com
    - hmac-md5-96
    - hmac-md5-96-etm@openssh.com
    - hmac-sha1
    - hmac-sha1-etm@openssh.com
    - hmac-sha2-256
    - hmac-sha2-256-etm@openssh.com
    - hmac-sha2-512
    - hmac-sha2-512-etm@openssh.com
    - hmac-ripemd160
    - hmac-ripemd160@openssh.com
    - hmac-ripemd160-etm@openssh.com
    - umac-64@openssh.com
    - umac-128@openssh.com
    - umac-64-etm@openssh.com
    - umac-128-etm@openssh.com
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.4
      - ''
    description: Select one or more SSH MAC algorithms.
  ssh_hsk_algo:
    type: enum
    raw_type: list
    choices:
    - ssh-rsa
    - ecdsa-sha2-nistp521
    - ecdsa-sha2-nistp384
    - ecdsa-sha2-nistp256
    - rsa-sha2-256
    - rsa-sha2-512
    - ssh-ed25519
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.4
      - ''
    description: Select one or more SSH hostkey algorithms.
  ssh_hsk_override:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable SSH host key override in SSH daemon.
  ssh_hsk_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Password for ssh-hostkey.
  ssh_hsk:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Config SSH host key.
