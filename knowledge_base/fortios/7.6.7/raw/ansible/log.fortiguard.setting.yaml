id: log.fortiguard.setting
version: 7.6.7
source_object: fortios_log_fortiguard_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_fortiguard_setting.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging to FortiCloud.
  upload_option:
    type: enum
    raw_type: string
    choices:
    - store-and-upload
    - realtime
    - 1-minute
    - 5-minute
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure how log messages are sent to FortiCloud.
  upload_interval:
    type: enum
    raw_type: string
    choices:
    - daily
    - weekly
    - monthly
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency of uploading log files to FortiCloud.
  upload_day:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of week to roll logs.
  upload_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day to roll logs (hh:mm).
  priority:
    type: enum
    raw_type: string
    choices:
    - default
    - low
    version_ranges:
    - - v6.2.0
      - ''
    description: Set log transmission priority.
  max_log_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiCloud maximum log rate in MBps (0 = unlimited).
  access_config:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable FortiCloud access to configuration and data.
  enc_algorithm:
    type: enum
    raw_type: string
    choices:
    - high-medium
    - high
    - low
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure the level of SSL protection for secure communication with FortiCloud.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  conn_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: FortiGate Cloud connection timeout in seconds.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address used to connect FortiCloud.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
