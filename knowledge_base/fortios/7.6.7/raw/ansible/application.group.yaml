id: application.group
version: 7.6.7
source_object: fortios_application_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_application_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Application group name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comments.
  type:
    type: enum
    raw_type: string
    choices:
    - application
    - filter
    version_ranges:
    - - v6.0.0
      - ''
    description: Application group type.
  application:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Application ID list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Application IDs. see <a href='#notes'>Notes</a>.
  category:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Application category ID list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Category IDs. see <a href='#notes'>Notes</a>.
  risk:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Risk, or impact, of allowing traffic from this application to occur (1 - 5; Low, Elevated, Medium, High,
      and Critical).
    children:
      level:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Risk, or impact, of allowing traffic from this application to occur (1 - 5; Low, Elevated, Medium, High,
          and Critical). see <a href='#notes'>Notes</a>.
  protocols:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Application protocol filter.
  vendor:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Application vendor filter.
  technology:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Application technology filter.
  behavior:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Application behavior filter.
  popularity:
    type: enum
    raw_type: list
    choices:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Application popularity filter (1 - 5, from least to most popular).
