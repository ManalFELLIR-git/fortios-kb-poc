id: system.link-monitor
version: 7.6.7
source_object: fortios_system_link_monitor
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_link_monitor.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Link monitor name.
  addr_mode:
    type: enum
    raw_type: string
    choices:
    - ipv4
    - ipv6
    version_ranges:
    - - v6.0.0
      - ''
    description: Address mode (IPv4 or IPv6).
  srcintf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface that receives the traffic to be monitored. Source system.interface.name.
    references:
    - system.interface.name
  server_config:
    type: enum
    raw_type: string
    choices:
    - default
    - individual
    version_ranges:
    - - v7.0.1
      - ''
    description: Mode of server configuration.
  server_type:
    type: enum
    raw_type: string
    choices:
    - static
    - dynamic
    version_ranges:
    - - v7.2.0
      - ''
    description: Server type (static or dynamic).
  server:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address of the server(s) to be monitored.
    children:
      address:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Server address.
  protocol:
    type: enum
    raw_type: list
    choices:
    - ping
    - tcp-echo
    - udp-echo
    - http
    - https
    - twamp
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocols used to monitor the server.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port number of the traffic to be used to monitor the server.
  gateway_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway IP address used to probe the server.
  gateway_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway IPv6 address used to probe the server.
  route:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Subnet to monitor.
    children:
      subnet:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: IP and netmask (x.x.x.x/y).
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address used in packet to the server.
  source_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IPv6 address used in packet to the server.
  http_get:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: If you are monitoring an HTML server you can send an HTTP-GET request with a custom string. Use this option
      to define the string.
  http_agent:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: String in the http-agent field in the HTTP header.
  http_match:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: String that you expect to see in the HTTP-GET requests of the traffic to be monitored.
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Detection interval in milliseconds (20 - 3600 * 1000 msec).
  probe_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Time to wait before a probe packet is considered lost (20 - 5000 msec).
  failtime:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of retry attempts before the server is considered down (1 - 3600).
  recoverytime:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of successful responses received before server is considered recovered (1 - 3600).
  probe_count:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Number of most recent probes that should be used to calculate latency and jitter (5 - 30).
  security_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - authentication
    version_ranges:
    - - v6.0.0
      - ''
    description: Twamp controller security mode.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: TWAMP controller password in authentication mode.
  packet_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Packet size of a TWAMP test session (124/158 - 1024).
  ha_priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: HA election priority (1 - 50).
  fail_weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - ''
    description: Threshold weight to trigger link failure alert.
  update_cascade_interface:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable update cascade interface.
  update_static_route:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable updating the static route.
  update_policy_route:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable updating the policy route.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this link monitor.
  diffservcode:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Differentiated services code point (DSCP) in the IP header of the probe packet.
  class_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Traffic class ID. Source firewall.traffic-class.class-id.
    references:
    - firewall.traffic-class.class-id
  service_detection:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Only use monitor to read quality values. If enabled, static routes and cascade interfaces will not be updated.
  server_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.1
      - ''
    description: Servers for link-monitor to monitor.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.1
          - ''
        description: Server ID. see <a href='#notes'>Notes</a>.
      dst:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.1
          - ''
        description: IP address of the server to be monitored.
      protocol:
        type: enum
        raw_type: list
        choices:
        - ping
        - tcp-echo
        - udp-echo
        - http
        - https
        - twamp
        multiple_values: true
        elements: str
        version_ranges:
        - - v7.0.1
          - ''
        description: Protocols used to monitor the server.
      port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.1
          - ''
        description: Port number of the traffic to be used to monitor the server.
      weight:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.1
          - ''
        description: Weight of the monitor to this dst (0 - 255).
