id: firewall.ippool6
version: 7.6.7
source_object: fortios_firewall_ippool6
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ippool6.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 IP pool name.
  type:
    type: enum
    raw_type: string
    choices:
    - overload
    - nptv6
    version_ranges:
    - - v7.6.0
      - ''
    description: Configure IPv6 pool type (overload or NPTv6).
  startip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: First IPv6 address (inclusive) in the range for the address pool (format = xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).
  endip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Final IPv6 address (inclusive) in the range for the address pool (format = xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).
  internal_prefix:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Internal NPTv6 prefix length (32 - 64).
  external_prefix:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: External NPTv6 prefix length (32 - 64).
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  nat46:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT46.
  add_nat46_route:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable adding NAT46 route.
