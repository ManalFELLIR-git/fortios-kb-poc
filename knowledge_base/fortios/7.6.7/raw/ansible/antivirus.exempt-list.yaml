id: antivirus.exempt-list
version: 7.6.7
source_object: fortios_antivirus_exempt_list
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_antivirus_exempt_list.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.4
      - ''
    description: Table entry name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Comment.
  hash_type:
    type: enum
    raw_type: string
    choices:
    - md5
    - sha1
    - sha256
    version_ranges:
    - - v7.2.4
      - ''
    description: Hash type.
  hash:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Hash value to be matched.
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable table entry.
