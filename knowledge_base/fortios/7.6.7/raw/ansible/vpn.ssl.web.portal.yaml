id: vpn.ssl.web.portal
version: 7.6.7
source_object: fortios_vpn_ssl_web_portal
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ssl_web_portal.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Portal name.
  dns_suffix:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS suffix.
  web_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Agentless VPN web mode.
  landing_page_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable Agentless VPN landing page mode.
  display_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to display the web portal bookmark widget.
  user_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow web portal users to create their own bookmarks.
  allow_user_access:
    type: enum
    raw_type: list
    choices:
    - web
    - ftp
    - smb
    - sftp
    - telnet
    - ssh
    - vnc
    - rdp
    - ping
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Allow user access to Agentless VPN applications.
  default_protocol:
    type: enum
    raw_type: string
    choices:
    - web
    - ftp
    - telnet
    - smb
    - vnc
    - rdp
    - ssh
    - sftp
    version_ranges:
    - - v7.4.1
      - ''
    description: Application type that is set by default.
  user_group_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow web portal users to create bookmarks for all users in the same user group.
  bookmark_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Portal bookmark group.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Bookmark group name.
      bookmarks:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Bookmark table.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Bookmark name.
          apptype:
            type: enum
            raw_type: string
            choices:
            - ftp
            - rdp
            - sftp
            - smb
            - ssh
            - telnet
            - vnc
            - web
            version_ranges:
            - - v6.0.0
              - ''
            description: Application type.
          url:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: URL parameter.
          host:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Host name/IP parameter.
          folder:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Network shared file folder parameter.
          domain:
            type: string
            raw_type: string
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: Login domain.
          additional_params:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Additional parameters.
          description:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Description.
          keyboard_layout:
            type: enum
            raw_type: string
            choices:
            - ar-101
            - ar-102
            - ar-102-azerty
            - can-mul
            - cz
            - cz-qwerty
            - cz-pr
            - da
            - nl
            - de
            - de-ch
            - de-ibm
            - en-uk
            - en-uk-ext
            - en-us
            - en-us-dvorak
            - es
            - es-var
            - fi
            - fi-sami
            - fr
            - fr-apple
            - fr-ca
            - fr-ch
            - fr-be
            - hr
            - hu
            - hu-101
            - it
            - it-142
            - ja
            - ja-106
            - ko
            - la-am
            - lt
            - lt-ibm
            - lt-std
            - lav-std
            - lav-leg
            - mk
            - mk-std
            - 'no'
            - no-sami
            - pol-214
            - pol-pr
            - pt
            - pt-br
            - pt-br-abnt2
            - ru
            - ru-mne
            - ru-t
            - sl
            - sv
            - sv-sami
            - tuk
            - tur-f
            - tur-q
            - zh-sym-sg-us
            - zh-sym-us
            - zh-tr-hk
            - zh-tr-mo
            - zh-tr-us
            version_ranges:
            - - v7.0.1
              - ''
            description: Keyboard layout.
          security:
            type: enum
            raw_type: string
            choices:
            - any
            - rdp
            - nla
            - tls
            version_ranges:
            - - v6.0.0
              - ''
            description: Security mode for RDP connection .
          send_preconnection_id:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.0.1
              - ''
            description: Enable/disable sending of preconnection ID.
          preconnection_id:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: The numeric ID of the RDP source (0-4294967295).
          preconnection_blob:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: An arbitrary string which identifies the RDP source.
          load_balancing_info:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: The load balancing information or cookie which should be provided to the connection broker.
          restricted_admin:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.0.1
              - ''
            description: Enable/disable restricted admin mode for RDP.
          port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Remote port.
          logon_user:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Logon user.
          logon_password:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Logon password.
          color_depth:
            type: enum
            raw_type: string
            choices:
            - '32'
            - '16'
            - '8'
            version_ranges:
            - - v7.0.1
              - ''
            description: Color depth per pixel.
          sso:
            type: enum
            raw_type: string
            choices:
            - disable
            - static
            - auto
            version_ranges:
            - - v6.0.0
              - ''
            description: Single sign-on.
          form_data:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: Form data.
            children:
              name:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Name.
              value:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Value.
          sso_credential:
            type: enum
            raw_type: string
            choices:
            - sslvpn-login
            - alternative
            version_ranges:
            - - v6.0.0
              - ''
            description: Single sign-on credentials.
          sso_username:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: SSO user name.
          sso_password:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: SSO password.
          sso_credential_sent_once:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Single sign-on credentials are only sent once to remote server.
          width:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.0.4
              - ''
            description: Screen width (range from 0 - 65535).
          height:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.0.4
              - ''
            description: Screen height (range from 0 - 65535).
          vnc_keyboard_layout:
            type: enum
            raw_type: string
            choices:
            - default
            - da
            - nl
            - en-uk
            - en-uk-ext
            - fi
            - fr
            - fr-be
            - fr-ca-mul
            - de
            - de-ch
            - it
            - it-142
            - pt
            - pt-br-abnt2
            - 'no'
            - gd
            - es
            - sv
            - us-intl
            version_ranges:
            - - v7.2.4
              - ''
            description: Keyboard layout.
  display_connection_tools:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to display the web portal connection tools widget.
  display_history:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to display the web portal user login history widget.
  focus_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable to prioritize the placement of the bookmark section over the quick-connection section in the Agentless
      VPN application.
  display_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to display the web portal status widget.
  rewrite_ip_uri_ui:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Rewrite contents for URI contains IP and /ui/ .
  heading:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Web portal heading message.
  redir_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Client login redirect URL.
  theme:
    type: enum
    raw_type: string
    choices:
    - jade
    - neutrino
    - mariner
    - graphite
    - melongene
    - jet-stream
    - security-fabric
    - dark-matter
    - onyx
    - eclipse
    version_ranges:
    - - v6.0.0
      - ''
    description: Web portal color scheme.
  custom_lang:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Change the web portal display language. Overrides config system global set language. You can use config system
      custom-language and execute system custom-language to add custom language files. Source system.custom-language.name.
    references:
    - system.custom-language.name
  smb_ntlmv1_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable support of NTLMv1 for Samba authentication.
  smbv1:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: SMB version 1.
  smb_min_version:
    type: enum
    raw_type: string
    choices:
    - smbv1
    - smbv2
    - smbv3
    version_ranges:
    - - v6.2.0
      - ''
    description: SMB minimum client protocol version.
  smb_max_version:
    type: enum
    raw_type: string
    choices:
    - smbv1
    - smbv2
    - smbv3
    version_ranges:
    - - v6.2.0
      - ''
    description: SMB maximum client protocol version.
  use_sdwan:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.7
      - v6.2.7
    - - v6.4.4
      - ''
    description: Use SD-WAN rules to get output interface.
  prefer_ipv6_dns:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Prefer to query IPv6 DNS server first if enabled.
  clipboard:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable to support RDP/VPC clipboard functionality.
  default_window_width:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.6
      - ''
    description: Screen width (range from 0 - 65535).
  default_window_height:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.6
      - ''
    description: Screen height (range from 0 - 65535).
  limit_user_logins:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to limit each user to one Agentless VPN session at a time.
  hide_sso_credential:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to prevent SSO credential being sent to client.
  landing_page:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: Landing page options.
    children:
      url:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Landing page URL.
      sso:
        type: enum
        raw_type: string
        choices:
        - disable
        - static
        - auto
        version_ranges:
        - - v7.4.0
          - ''
        description: Single sign-on.
      form_data:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.0
          - ''
        description: Form data.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.0
              - ''
            description: Name.
          value:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.0
              - ''
            description: Value.
      sso_credential:
        type: enum
        raw_type: string
        choices:
        - sslvpn-login
        - alternative
        version_ranges:
        - - v7.4.0
          - ''
        description: Single sign-on credentials.
      sso_username:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: SSO user name.
      sso_password:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: SSO password.
