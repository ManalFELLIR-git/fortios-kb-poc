id: system.snmp.sysinfo
version: 7.6.7
source_object: fortios_system_snmp_sysinfo
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_snmp_sysinfo.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SNMP.
  engine_id_type:
    type: enum
    raw_type: string
    choices:
    - text
    - hex
    - mac
    version_ranges:
    - - v7.0.1
      - ''
    description: Local SNMP engineID type (text/hex/mac).
  engine_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local SNMP engineID string (maximum 27 characters).
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: System description.
  contact_info:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Contact information.
  location:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: System location.
  trap_high_cpu_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: CPU usage when trap is sent.
  trap_low_memory_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Memory usage when trap is sent.
  trap_log_full_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Log disk usage when trap is sent.
  trap_free_memory_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Free memory usage when trap is sent.
  trap_freeable_memory_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Freeable memory usage when trap is sent.
  append_index:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable allowance of appending vdom or interface index in some RFC tables.
  non_mgmt_vdom_query:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable allowance of SNMPv3 query from non-management vdoms.
