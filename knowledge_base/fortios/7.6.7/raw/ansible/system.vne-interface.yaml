id: system.vne-interface
version: 7.6.7
source_object: fortios_system_vne_interface
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_vne_interface.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.0
      - ''
    description: VNE tunnel name.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Interface name. Source system.interface.name.
    references:
    - system.interface.name
  ssl_certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Name of local certificate for SSL connections. Source certificate.local.name.
    references:
    - certificate.local.name
  bmr_hostname:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: BMR hostname.
  auto_asic_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable tunnel ASIC offloading.
  ipv4_address:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Tunnel IPv4 address and netmask.
  br:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: IPv6 address or FQDN of the border relay.
  update_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: URL of provisioning server.
  mode:
    type: enum
    raw_type: string
    choices:
    - map-e
    - fixed-ip
    - ds-lite
    version_ranges:
    - - v7.6.0
      - ''
    description: VNE tunnel mode.
  http_username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: HTTP authentication user name.
  http_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: HTTP authentication password.
