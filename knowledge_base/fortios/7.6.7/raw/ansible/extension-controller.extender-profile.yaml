            description: PDN3-dataplan. Source extension-controller.dataplan.name.
            references:
            - extension-controller.dataplan.name
          pdn4_dataplan:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: PDN4-dataplan. Source extension-controller.dataplan.name.
            references:
            - extension-controller.dataplan.name
      modem2:
        type: object
        raw_type: dict
        version_ranges:
