id: extension-controller.extender-profile
version: 7.6.7
source_object: fortios_extension_controller_extender_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_extension_controller_extender_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiExtender profile name.
  id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: ID.
  model:
    type: enum
    raw_type: string
    choices:
    - FX201E
    - FX211E
    - FX200F
    - FXA11F
    - FXE11F
    - FXA21F
    - FXE21F
    - FXA22F
    - FXE22F
    - FX212F
    - FX311F
    - FX312F
    - FX511F
    - FXR51G
    - FXN51G
    - FXW51G
    - FVG21F
    - FVA21F
    - FVG22F
    - FVA22F
    - FX04DA
    - FG
    - BS10FW
    - BS20GW
    - BS20GN
    - FVG51G
    - FXE11G
    - FX211G
    - FWE50G
    - FWA50G
    version_ranges:
    - - v7.2.1
      - ''
    description: Model.
  extension:
    type: enum
    raw_type: string
    choices:
    - wan-extension
    - lan-extension
    version_ranges:
    - - v7.2.1
      - ''
    description: Extension option.
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - ping
    - telnet
    - http
    - https
    - ssh
    - snmp
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.2.1
      - ''
    description: Control management access to the managed extender. Separate entries with a space.
  login_password_change:
    type: enum
    raw_type: string
    choices:
    - 'yes'
    - default
    - 'no'
    version_ranges:
    - - v7.2.1
      - ''
    description: Change or reset the administrator password of a managed extender (yes, default, or no).
  login_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Set the managed extender"s administrator password.
  enforce_bandwidth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable enforcement of bandwidth on LAN extension interface.
  bandwidth_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiExtender LAN extension bandwidth limit (Mbps).
  cellular:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiExtender cellular configuration.
    children:
      dataplan:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Dataplan names.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: Dataplan name. Source extension-controller.dataplan.name.
            references:
            - extension-controller.dataplan.name
      controller_report:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: FortiExtender controller report configuration.
        children:
          status:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiExtender controller report status.
          interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.2.1
              - ''
            description: Controller report interval.
          signal_threshold:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.2.1
              - ''
            description: Controller report signal threshold.
      sms_notification:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: FortiExtender cellular SMS notification configuration.
        children:
          status:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiExtender SMS notification status.
          alert:
            type: object
            raw_type: dict
            version_ranges:
            - - v7.2.1
              - ''
            description: SMS alert list.
            children:
              system_reboot:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when system rebooted.
              data_exhausted:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when data exhausted.
              session_disconnect:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when session disconnected.
              low_signal_strength:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when signal strength is low.
              os_image_fallback:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when falling back to a previous OS image.
              mode_switch:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when mode is switched.
              fgt_backup_mode_switch:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Display string when FortiGate backup mode switched.
          receiver:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.2.1
              - ''
            description: SMS notification receiver list.
            children:
              name:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.2.1
                  - ''
                description: FortiExtender SMS notification receiver name.
              status:
                type: enum
                raw_type: string
                choices:
                - disable
                - enable
                version_ranges:
                - - v7.2.1
                  - ''
                description: SMS notification receiver status.
              phone_number:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: 'Receiver phone number. Format: [+][country code][area code][local phone number]. For example,
                  +16501234567.'
              alert:
                type: enum
                raw_type: list
                choices:
                - system-reboot
                - data-exhausted
                - session-disconnect
                - low-signal-strength
                - mode-switch
                - os-image-fallback
                - fgt-backup-mode-switch
                multiple_values: true
                elements: str
                version_ranges:
                - - v7.2.1
                  - ''
                description: Alert multi-options.
      modem1:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Configuration options for modem 1.
        children:
          redundant_mode:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiExtender mode.
          redundant_intf:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Redundant interface.
          default_sim:
            type: enum
            raw_type: string
            choices:
            - sim1
            - sim2
            - carrier
            - cost
            version_ranges:
            - - v7.2.1
              - ''
            description: Default SIM selection.
          gps:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiExtender GPS enable/disable.
          sim1_pin:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: SIM
          sim2_pin:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.2.1
              - ''
            description: SIM
          sim1_pin_code:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: SIM
          sim2_pin_code:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: SIM
          preferred_carrier:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Preferred carrier.
          auto_switch:
            type: object
            raw_type: dict
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiExtender auto switch configuration.
            children:
              disconnect:
                type: enum
                raw_type: string
                choices:
                - disable
                - enable
                version_ranges:
                - - v7.2.1
                  - ''
                description: Auto switch by disconnect.
              disconnect_threshold:
                type: integer
                raw_type: integer
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch based on disconnect threshold.
              disconnect_period:
                type: integer
                raw_type: integer
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch based on disconnect period.
              signal:
                type: enum
                raw_type: string
                choices:
                - disable
                - enable
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch based on signal strength.
              dataplan:
                type: enum
                raw_type: string
                choices:
                - disable
                - enable
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch based on data usage.
              switch_back:
                type: enum
                raw_type: list
                choices:
                - time
                - timer
                multiple_values: true
                elements: str
                version_ranges:
                - - v7.2.1
                  - ''
                description: Auto switch with switch back multi-options.
              switch_back_time:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch over to preferred SIM/carrier at a specified time in UTC (HH:MM).
              switch_back_timer:
                type: integer
                raw_type: integer
                version_ranges:
                - - v7.2.1
                  - ''
                description: Automatically switch over to preferred SIM/carrier after the given time (3600 - 2147483647 sec).
          multiple_PDN:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.6.1
              - ''
            description: Multiple-PDN enable/disable.
          pdn1_dataplan:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: PDN1-dataplan. Source extension-controller.dataplan.name.
            references:
            - extension-controller.dataplan.name
          pdn2_dataplan:
            type: string
            raw_type: string
            version_ranges:
