id: firewall.internet-service-name
version: 7.6.7
source_object: fortios_firewall_internet_service_name
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_name.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service name.
  type:
    type: enum
    raw_type: string
    choices:
    - default
    - location
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service name type.
  internet_service_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service ID. Source firewall.internet-service.id.
    references:
    - firewall.internet-service.id
  country_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Country or Area ID. Source firewall.country.id.
    references:
    - firewall.country.id
  region_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Region ID. Source firewall.region.id.
    references:
    - firewall.region.id
  city_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: City ID. Source firewall.city.id.
    references:
    - firewall.city.id
