id: vpn.certificate.setting
version: 7.6.7
source_object: fortios_vpn_certificate_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_certificate_setting.py
root_type: object
attributes:
  ocsp_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - mandatory
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable receiving certificates using the OCSP.
  ocsp_option:
    type: enum
    raw_type: string
    choices:
    - certificate
    - server
    version_ranges:
    - - v6.2.0
      - ''
    description: Specify whether the OCSP URL is from certificate or configured OCSP server.
  proxy:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Proxy server FQDN or IP for OCSP/CA queries during certificate verification.
  proxy_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.4
      - ''
    description: Proxy server port (1 - 65535).
  proxy_username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Proxy server user name.
  proxy_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Proxy server password.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Source IP address for dynamic AIA and OCSP queries.
  ocsp_default_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default OCSP server. Source vpn.certificate.ocsp-server.name.
    references:
    - vpn.certificate.ocsp-server.name
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  check_ca_cert:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable verification of the user certificate and pass authentication if any CA in the chain is trusted
      .
  check_ca_chain:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable verification of the entire certificate chain and pass authentication only if the chain is
      complete and all of the CAs in the chain are trusted .
  subject_match:
    type: enum
    raw_type: string
    choices:
    - substring
    - value
    version_ranges:
    - - v6.0.0
      - ''
    description: When searching for a matching certificate, control how to do RDN value matching with certificate subject
      name .
  subject_set:
    type: enum
    raw_type: string
    choices:
    - subset
    - superset
    version_ranges:
    - - v7.0.1
      - ''
    description: When searching for a matching certificate, control how to do RDN set matching with certificate subject name
      .
  cn_match:
    type: enum
    raw_type: string
    choices:
    - substring
    - value
    version_ranges:
    - - v6.0.0
      - ''
    description: When searching for a matching certificate, control how to do CN value matching with certificate subject name
      .
  cn_allow_multi:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: When searching for a matching certificate, allow multiple CN fields in certificate subject name .
  crl_verification:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.0.1
      - ''
    description: CRL verification options.
    children:
      expiry:
        type: enum
        raw_type: string
        choices:
        - ignore
        - revoke
        version_ranges:
        - - v7.0.1
          - ''
        description: CRL verification option when CRL is expired .
      leaf_crl_absence:
        type: enum
        raw_type: string
        choices:
        - ignore
        - revoke
        version_ranges:
        - - v7.0.1
          - ''
        description: CRL verification option when leaf CRL is absent .
      chain_crl_absence:
        type: enum
        raw_type: string
        choices:
        - ignore
        - revoke
        version_ranges:
        - - v7.0.1
          - ''
        description: CRL verification option when CRL of any certificate in chain is absent .
  strict_ocsp_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable strict mode OCSP checking.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  cmp_save_extra_certs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable saving extra certificates in CMP mode .
  cmp_key_usage_checking:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - v6.2.0
    - - v6.2.5
      - ''
    description: Enable/disable server certificate key usage checking in CMP mode .
  cert_expire_warning:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Number of days before a certificate expires to send a warning. Set to 0 to disable sending of the warning
      (0 - 100).
  certname_rsa1024:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 1024 bit RSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_rsa2048:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 2048 bit RSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_rsa4096:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: 4096 bit RSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_dsa1024:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 1024 bit DSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_dsa2048:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 2048 bit DSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_ecdsa256:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 256 bit ECDSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_ecdsa384:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 384 bit ECDSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_ecdsa521:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: 521 bit ECDSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_ed25519:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: 253 bit EdDSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  certname_ed448:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: 456 bit EdDSA key certificate for re-signing server certificates for SSL inspection. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
