id: firewall.interface-policy
version: 7.6.7
source_object: fortios_firewall_interface_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_interface_policy.py
root_type: list
attributes:
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID (0 - 4294967295). see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this policy.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comments.
  logtraffic:
    type: enum
    raw_type: string
    choices:
    - all
    - utm
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Logging type to be used in this policy (Options: all | utm | disable).'
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Monitored interface name from available interfaces. Source system.zone.name system.sdwan.zone.name system.interface.name.
    references:
    - system.interface.name
    - system.sdwan.zone.name
    - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Address object to limit traffic monitoring to network traffic sent from the specified address or range.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Address object to limit traffic monitoring to network traffic sent to the specified address or range.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  service:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Service object from available options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Service name. Source firewall.service.custom.name firewall.service.group.name.
        references:
        - firewall.service.custom.name
        - firewall.service.group.name
  application_list_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable application control.
  application_list:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Application list name. Source application.list.name.
    references:
    - application.list.name
  ips_sensor_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPS.
  ips_sensor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPS sensor name. Source ips.sensor.name.
    references:
    - ips.sensor.name
  dsri:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DSRI.
  av_profile_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable antivirus.
  av_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Antivirus profile. Source antivirus.profile.name.
    references:
    - antivirus.profile.name
  webfilter_profile_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable web filtering.
  webfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Web filter profile. Source webfilter.profile.name.
    references:
    - webfilter.profile.name
  casb_profile_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable CASB.
  casb_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB profile. Source casb.profile.name.
    references:
    - casb.profile.name
  emailfilter_profile_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable email filter.
  emailfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Email filter profile. Source emailfilter.profile.name.
    references:
    - emailfilter.profile.name
  dlp_profile_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable DLP.
  dlp_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: DLP profile name. Source dlp.profile.name.
    references:
    - dlp.profile.name
