id: wireless-controller.wids-profile
version: 7.6.7
source_object: fortios_wireless_controller_wids_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_wids_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: WIDS profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  sensor_mode:
    type: enum
    raw_type: string
    choices:
    - disable
    - foreign
    - both
    version_ranges:
    - - v6.0.0
      - ''
    description: Scan nearby WiFi stations .
  ap_scan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable rogue AP detection.
  ap_scan_channel_list_2G_5G:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: Selected ap scan channel list for 2.4G and 5G bands.
    children:
      chan:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: Channel number.
  ap_scan_channel_list_6G:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: Selected ap scan channel list for 6G band.
    children:
      chan:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: Channel 6g number.
  ap_bgscan_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period between background scans (10 - 3600 sec).
  ap_bgscan_intv:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period between successive channel scans (1 - 600 sec).
  ap_bgscan_duration:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Listen time on scanning a channel (10 - 1000 msec).
  ap_bgscan_idle:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Wait time for channel inactivity before scanning this channel (0 - 1000 msec).
  ap_bgscan_report_intv:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period between background scan reports (15 - 600 sec).
  ap_bgscan_disable_schedules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Firewall schedules for turning off FortiAP radio background scan. Background scan will be disabled when at
      least one of the schedules is valid. Separate multiple schedule names with a space.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Schedule name. Source firewall.schedule.group.name firewall.schedule.recurring.name firewall.schedule.onetime.name.
        references:
        - firewall.schedule.group.name
        - firewall.schedule.onetime.name
        - firewall.schedule.recurring.name
  ap_fgscan_report_intv:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period between foreground scan reports (15 - 600 sec).
  ap_scan_passive:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable passive scanning. Enable means do not send probe request on any channels .
  ap_scan_threshold:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Minimum signal level/threshold in dBm required for the AP to report detected rogue AP (-95 to -20).
