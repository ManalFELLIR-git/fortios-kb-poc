id: system.automation-condition
version: 7.6.7
source_object: fortios_system_automation_condition
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_automation_condition.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: Name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Description.
  condition_type:
    type: enum
    raw_type: string
    choices:
    - cpu
    - memory
    - vpn
    version_ranges:
    - - v7.6.1
      - ''
    description: Condition type.
  cpu_usage_percent:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: CPU usage reaches specified percentage.
  mem_usage_percent:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Memory usage reaches specified percentage.
  vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual domain which the tunnel belongs to. Source system.vdom.name.
    references:
    - system.vdom.name
  vpn_tunnel_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: VPN tunnel name.
  vpn_tunnel_state:
    type: enum
    raw_type: string
    choices:
    - tunnel-up
    - tunnel-down
    version_ranges:
    - - v7.6.1
      - ''
    description: VPN tunnel state.
