id: system.settings
version: 7.6.7
source_object: fortios_system_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_settings.py
root_type: object
attributes:
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: VDOM comments.
  vdom_type:
    type: enum
    raw_type: string
    choices:
    - traffic
    - lan-extension
    - admin
    version_ranges:
    - - v7.2.0
      - ''
    description: Vdom type (traffic, lan-extension or admin).
  lan_extension_controller_addr:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Controller IP address or FQDN to connect.
  lan_extension_controller_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - ''
    description: Controller port to connect.
  opmode:
    type: enum
    raw_type: string
    choices:
    - nat
    - transparent
    version_ranges:
    - - v6.0.0
      - ''
    description: Firewall operation mode (NAT or Transparent).
  ngfw_mode:
    type: enum
    raw_type: string
    choices:
    - profile-based
    - policy-based
    version_ranges:
    - - v6.0.0
      - ''
    description: Next Generation Firewall (NGFW) mode.
  http_external_dest:
    type: enum
    raw_type: string
    choices:
    - fortiweb
    - forticache
    version_ranges:
    - - v6.0.0
      - ''
    description: Offload HTTP traffic to FortiWeb or FortiCache.
  firewall_session_dirty:
    type: enum
    raw_type: string
    choices:
    - check-all
    - check-new
    - check-policy-option
    version_ranges:
    - - v6.0.0
      - ''
    description: Select how to manage sessions affected by firewall policy configuration changes.
  manageip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Transparent mode IPv4 management IP address and netmask.
  gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Transparent mode IPv4 default gateway IP address.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address and netmask.
  manageip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Transparent mode IPv6 management IP address and netmask.
  gateway6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Transparent mode IPv6 default gateway IP address.
  ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address prefix for NAT mode.
  device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface to use for management access for NAT mode. Source system.interface.name.
    references:
    - system.interface.name
  bfd:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Bi-directional Forwarding Detection (BFD) on all interfaces.
  bfd_desired_min_tx:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD desired minimal transmit interval (1 - 100000 ms).
  bfd_required_min_rx:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD required minimal receive interval (1 - 100000 ms).
  bfd_detect_mult:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD detection multiplier (1 - 50).
  bfd_dont_enforce_src_port:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to not enforce verifying the source port of BFD Packets.
  utf8_spam_tagging:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable converting antispam tags to UTF-8 for better non-ASCII character support.
  wccp_cache_engine:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable WCCP cache engine.
  vpn_stats_log:
    type: enum
    raw_type: list
    choices:
    - ipsec
    - pptp
    - l2tp
    - ssl
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable periodic VPN log statistics for one or more types of VPN. Separate names with a space.
  vpn_stats_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period to send VPN log statistics (0 or 60 - 86400 sec).
  v4_ecmp_mode:
    type: enum
    raw_type: string
    choices:
    - source-ip-based
    - weight-based
    - usage-based
    - source-dest-ip-based
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 Equal-cost multi-path (ECMP) routing and load balancing mode.
  mac_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Duration of MAC addresses in Transparent mode (300 - 8640000 sec).
  fw_session_hairpin:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable checking for a matching policy each time hairpin traffic goes through the FortiGate.
  prp_trailer_action:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable action to take on PRP trailer.
  snat_hairpin_traffic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable source NAT (SNAT) for VIP hairpin traffic.
  dhcp_proxy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the DHCP Proxy.
  dhcp_proxy_interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  dhcp_proxy_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  dhcp_proxy_vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  dhcp_server_ip:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP Server IPv4 address.
  dhcp6_server_ip:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCPv6 server IPv6 address.
  central_nat:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable central NAT.
  gui_default_policy_columns:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Default columns to display for policy lists on GUI.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Select column name.
  lldp_reception:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    - global
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable Link Layer Discovery Protocol (LLDP) reception for this VDOM or apply global settings to this
      VDOM.
  lldp_transmission:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    - global
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Link Layer Discovery Protocol (LLDP) transmission for this VDOM or apply global settings to
      this VDOM.
  link_down_access:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable link down access traffic.
  nat46_generate_ipv6_fragment_header:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.6
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable NAT46 IPv6 fragment header generation.
  nat46_force_ipv4_packet_forwarding:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable mandatory IPv4 packet forwarding in NAT46.
  nat64_force_ipv6_packet_forwarding:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable mandatory IPv6 packet forwarding in NAT64.
  detect_unknown_esp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable detection of unknown ESP packets .
  intree_ses_best_route:
    type: enum
    raw_type: string
    choices:
    - force
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Force the intree session to always use the best route.
  auxiliary_session:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable auxiliary session.
  asymroute:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPv4 asymmetric routing.
  asymroute_icmp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ICMP asymmetric routing.
  tcp_session_without_syn:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing TCP session without SYN flags.
  ses_denied_traffic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable including denied session in the session table.
  ses_denied_multicast_traffic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable including denied multicast session in the session table.
  strict_src_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable strict source verification.
  src_check_reply:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.7
      - ''
    description: Enable/disable source verification for reply packets.
  allow_linkdown_path:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable link down path.
  asymroute6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPv6 asymmetric routing.
  asymroute6_icmp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ICMPv6 asymmetric routing.
  sctp_session_without_init:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable SCTP session creation without SCTP INIT.
  sip_expectation:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable the SIP kernel session helper to create an expectation for port 5060.
  sip_nat_trace:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable recording the original SIP source IP address when NAT is used.
  h323_direct_model:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable H323 direct model.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this VDOM.
  sip_tcp_port:
    type: list
    raw_type: list
    multiple_values: true
    elements: int
    version_ranges:
    - - v6.0.0
      - ''
    description: TCP port the SIP proxy monitors for SIP traffic (0 - 65535).
  sip_udp_port:
    type: list
    raw_type: list
    multiple_values: true
    elements: int
    version_ranges:
    - - v6.0.0
      - ''
    description: UDP port the SIP proxy monitors for SIP traffic (0 - 65535).
  sip_ssl_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: TCP port the SIP proxy monitors for SIP SSL/TLS traffic (0 - 65535).
  sccp_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: TCP port the SCCP proxy monitors for SCCP traffic (0 - 65535).
  multicast_forward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable multicast forwarding.
  multicast_ttl_notchange:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable preventing the FortiGate from changing the TTL for forwarded multicast packets.
  multicast_skip_policy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing multicast traffic through the FortiGate without a policy check.
  allow_subnet_overlap:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing interface subnets to use overlapping IP addresses.
  deny_tcp_with_icmp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable denying TCP by sending an ICMP communication prohibited packet.
  ecmp_max_paths:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of Equal Cost Multi-Path (ECMP) next-hops. Set to 1 to disable ECMP routing (1 - 255).
  discovered_device_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Timeout for discovered devices (1 - 365 days).
  email_portal_check_dns:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using DNS to validate email addresses collected by a captive portal.
  default_voip_alg_mode:
    type: enum
    raw_type: string
    choices:
    - proxy-based
    - kernel-helper-based
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure how the FortiGate handles VoIP traffic when a policy that accepts the traffic doesn"t include a
      VoIP profile.
  gui_icap:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ICAP on the GUI.
  gui_implicit_policy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable implicit firewall policies on the GUI.
  gui_dns_database:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DNS database settings on the GUI.
  gui_load_balance:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable server load balancing on the GUI.
  gui_multicast_policy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable multicast firewall policies on the GUI.
  gui_dos_policy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DoS policies on the GUI.
  gui_object_colors:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable object colors on the GUI.
  gui_route_tag_address_creation:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable route-tag addresses on the GUI.
  gui_voip_profile:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable VoIP profiles on the GUI.
  gui_ap_profile:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiAP profiles on the GUI.
  gui_security_profile_group:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Enable/disable Security Profile Groups on the GUI.
  gui_local_in_policy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Local-In policies on the GUI.
  gui_wanopt_cache:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Enable/disable WAN Optimization and Web Caching on the GUI.
  gui_explicit_proxy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the explicit proxy on the GUI.
  gui_dynamic_routing:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable dynamic routing on the GUI.
  gui_sslvpn_personal_bookmarks:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SSL-VPN personal bookmark management on the GUI.
  gui_sslvpn_realms:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SSL-VPN realms on the GUI.
  gui_policy_based_ipsec:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable policy-based IPsec VPN on the GUI.
  gui_threat_weight:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable threat weight on the GUI.
  gui_spamfilter:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Antispam on the GUI.
  gui_file_filter:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable File-filter on the GUI.
  gui_application_control:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable application control on the GUI.
  gui_ips:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPS on the GUI.
  gui_dhcp_advanced:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable advanced DHCP options on the GUI.
  gui_vpn:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPsec VPN settings pages on the GUI.
  gui_sslvpn:
    type: enum
    raw_type: string
    choices:
    - enable
