id: system.speed-test-schedule
version: 7.6.7
source_object: fortios_system_speed_test_schedule
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_speed_test_schedule.py
root_type: list
attributes:
  interface:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.0
      - ''
    description: Interface name. Source system.interface.name.
    references:
    - system.interface.name
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable scheduled speed test.
  diffserv:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: DSCP used for speed test.
  server_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Speed test server name. Source system.speed-test-server.name.
    references:
    - system.speed-test-server.name
  mode:
    type: enum
    raw_type: string
    choices:
    - UDP
    - TCP
    - Auto
    version_ranges:
    - - v7.4.1
      - ''
    description: Protocol Auto(default), TCP or UDP used for speed test.
  schedules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Schedules for the interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Name of a firewall recurring schedule. Source firewall.schedule.recurring.name.
        references:
        - firewall.schedule.recurring.name
  dynamic_server:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable dynamic server option.
  ctrl_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Port of the controller to get access token.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Port of the server to run speed test.
  update_inbandwidth_maximum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Maximum downloading bandwidth (kbps) or percentage of the interface"s inbandwidth to be used in shaping.
  update_inbandwidth_minimum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Minimum downloading bandwidth (kbps) or percentage of the interface"s inbandwidth to be used in shaping.
  update_outbandwidth_maximum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Maximum uploading bandwidth (kbps) or percentage of the interface"s outbandwidth to be used in shaping.
  update_outbandwidth_minimum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Minimum uploading bandwidth (kbps) or percentage of the interface"s outbandwidth to be used in shaping.
  update_shaper:
    type: enum
    raw_type: string
    choices:
    - disable
    - local
    - remote
    - both
    version_ranges:
    - - v7.4.2
      - v7.6.7
    description: Set egress shaper based on the test result.
  update_inbandwidth:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - v7.6.7
    description: Enable/disable bypassing interface"s inbound bandwidth setting.
  update_outbandwidth:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - v7.6.7
    description: Enable/disable bypassing interface"s outbound bandwidth setting.
  update_interface_shaping:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Enable/disable using the speedtest results as reference for interface shaping (overriding configured in/outbandwidth).
  expected_inbandwidth_minimum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Set the minimum inbandwidth threshold for applying speedtest results on shaping-profile.
  expected_inbandwidth_maximum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Set the maximum inbandwidth threshold for applying speedtest results on shaping-profile.
  expected_outbandwidth_minimum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Set the minimum outbandwidth threshold for applying speedtest results on shaping-profile.
  expected_outbandwidth_maximum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Set the maximum outbandwidth threshold for applying speedtest results on shaping-profile.
  retries:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Maximum number of times the FortiGate unit will attempt to contact the same server before considering the
      speed test has failed (1 - 10).
  retry_pause:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - v7.6.7
    description: Number of seconds the FortiGate pauses between successive speed tests before trying a different server (60
      - 3600).
