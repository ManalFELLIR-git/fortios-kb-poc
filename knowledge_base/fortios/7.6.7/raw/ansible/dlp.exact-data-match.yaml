id: dlp.exact-data-match
version: 7.6.7
source_object: fortios_dlp_exact_data_match
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_dlp_exact_data_match.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.2
      - ''
    description: Name of table containing the exact-data-match template.
  optional:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Number of optional columns need to match.
  data:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: External resource for exact data match. Source system.external-resource.name.
    references:
    - system.external-resource.name
  columns:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: DLP exact-data-match column types.
    children:
      index:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Column index. see <a href='#notes'>Notes</a>.
      type:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.2
          - ''
        description: Data-type for this column. Source dlp.data-type.name.
        references:
        - dlp.data-type.name
      optional:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: Enable/disable optional match.
