id: sctp-filter.profile
version: 7.6.7
source_object: fortios_sctp_filter_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_sctp_filter_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.1
      - ''
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Comment.
  ppid_filters:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.1
      - ''
    description: PPID filters list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.1
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      ppid:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.1
          - ''
        description: Payload protocol identifier.
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - reset
        - replace
        version_ranges:
        - - v7.0.1
          - ''
        description: Action taken when PPID is matched.
      comment:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.1
          - ''
        description: Comment.
