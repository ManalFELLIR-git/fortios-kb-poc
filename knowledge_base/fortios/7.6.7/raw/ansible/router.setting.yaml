id: router.setting
version: 7.6.7
source_object: fortios_router_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_setting.py
root_type: object
attributes:
  show_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Prefix-list as filter for showing routes. Source router.prefix-list.name.
    references:
    - router.prefix-list.name
  hostname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hostname for this virtual domain router.
  kernel_route_distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Administrative distance for routes learned from kernel (0 - 255).
