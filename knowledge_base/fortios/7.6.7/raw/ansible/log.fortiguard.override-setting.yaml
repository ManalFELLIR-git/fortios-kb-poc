id: log.fortiguard.override-setting
version: 7.6.7
source_object: fortios_log_fortiguard_override_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_fortiguard_override_setting.py
root_type: object
attributes:
  override:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Overriding FortiCloud settings for this VDOM or use global settings.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging to FortiCloud.
  upload_option:
    type: enum
    raw_type: string
    choices:
    - store-and-upload
    - realtime
    - 1-minute
    - 5-minute
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure how log messages are sent to FortiCloud.
  upload_interval:
    type: enum
    raw_type: string
    choices:
    - daily
    - weekly
    - monthly
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency of uploading log files to FortiCloud.
  upload_day:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of week to roll logs.
  upload_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day to roll logs (hh:mm).
  priority:
    type: enum
    raw_type: string
    choices:
    - default
    - low
    version_ranges:
    - - v6.2.0
      - ''
    description: Set log transmission priority.
  max_log_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiCloud maximum log rate in MBps (0 = unlimited).
  access_config:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable FortiCloud access to configuration and data.
