id: wireless-controller.vap
version: 7.6.7
source_object: fortios_wireless_controller_vap
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_vap.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual AP name.
  pre_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable pre-authentication, where supported by clients .
  external_pre_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable pre-authentication with external APs not managed by the FortiGate .
  mesh_backhaul:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using this VAP as a WiFi mesh backhaul . This entry is only available when security is set
      to a WPA type or open.
  atf_weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Airtime weight in percentage .
  max_clients:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of clients that can connect simultaneously to the VAP .
  max_clients_ap:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of clients that can connect simultaneously to the VAP per AP radio .
  ssid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IEEE 802.11 service set identifier (SSID) for the wireless interface. Users who wish to use the wireless
      network must configure their computers to access this SSID name.
  broadcast_ssid:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable broadcasting the SSID .
  security:
    type: enum
    raw_type: string
    choices:
    - open
    - wep64
    - wep128
    - wpa-personal
    - wpa-enterprise
    - wpa-only-personal
    - wpa-only-enterprise
    - wpa2-only-personal
    - wpa2-only-enterprise
    - wpa3-enterprise
    - wpa3-only-enterprise
    - wpa3-enterprise-transition
    - wpa3-sae
    - wpa3-sae-transition
    - owe
    - osen
    version_ranges:
    - - v6.0.0
      - ''
    description: Security mode for the wireless interface .
  pmf:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    - optional
    version_ranges:
    - - v6.0.0
      - ''
    description: Protected Management Frames (PMF) support .
  pmf_assoc_comeback_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Protected Management Frames (PMF) comeback maximum timeout (1-20 sec).
  pmf_sa_query_retry_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Protected Management Frames (PMF) SA query retry timeout interval (1 - 5 100s of msec).
  beacon_protection:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable beacon protection support .
  okc:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Opportunistic Key Caching (OKC) .
  mbo:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable Multiband Operation .
  gas_comeback_delay:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: GAS comeback delay (0 or 100 - 10000 milliseconds).
  gas_fragmentation_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: GAS fragmentation limit (512 - 4096).
  mbo_cell_data_conn_pref:
    type: enum
    raw_type: string
    choices:
    - excluded
    - prefer-not
    - prefer-use
    version_ranges:
    - - v7.0.0
      - ''
    description: MBO cell data connection preference (0, 1, or 255).
  neighbor_report_dual_band:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable dual-band neighbor report .
  fast_bss_transition:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable 802.11r Fast BSS Transition (FT) .
  ft_mobility_domain:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Mobility domain identifier in FT (1 - 65535).
  ft_r0_key_lifetime:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Lifetime of the PMK-R0 key in FT, 1-65535 minutes.
  ft_over_ds:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FT over the Distribution System (DS).
  sae_groups:
    type: enum
    raw_type: list
    choices:
    - '19'
    - '20'
    - '21'
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: SAE-Groups.
  owe_groups:
    type: enum
    raw_type: list
    choices:
    - '19'
    - '20'
    - '21'
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: OWE-Groups.
  owe_transition:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable OWE transition mode support.
  owe_transition_ssid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: OWE transition mode peer SSID.
  additional_akms:
    type: enum
    raw_type: list
    choices:
    - akm6
    - akm24
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: Additional AKMs.
  eapol_key_retries:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable retransmission of EAPOL-Key frames (message 3/4 and group message 1/2) .
  tkip_counter_measure:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable TKIP counter measure.
  external_web:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL of external authentication web server.
  external_web_format:
    type: enum
    raw_type: string
    choices:
    - auto-detect
    - no-query-string
    - partial-query-string
    version_ranges:
    - - v6.2.0
      - ''
    description: URL query parameter detection .
  external_logout:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL of external authentication logout server.
  mac_username_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.0.0
      - ''
    description: MAC authentication username delimiter .
  mac_password_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.0.0
      - ''
    description: MAC authentication password delimiter .
  mac_calling_station_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.0.0
      - ''
    description: MAC calling station delimiter .
  mac_called_station_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.0.0
      - ''
    description: MAC called station delimiter .
  mac_case:
    type: enum
    raw_type: string
    choices:
    - uppercase
    - lowercase
    version_ranges:
    - - v7.0.0
      - ''
    description: MAC case .
  called_station_id_type:
    type: enum
    raw_type: string
    choices:
    - mac
    - ip
    - apname
    version_ranges:
    - - v7.6.1
      - ''
    description: The format type of RADIUS attribute Called-Station-Id .
  mac_auth_bypass:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable MAC authentication bypass.
  radius_mac_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable RADIUS-based MAC authentication of clients .
  radius_mac_auth_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS-based MAC authentication server. Source user.radius.name.
    references:
    - user.radius.name
  radius_mac_auth_block_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.4
      - ''
    description: Don"t send RADIUS MAC auth request again if the client has been rejected within specific interval (0 or 30
      - 864000 seconds).
  radius_mac_mpsk_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable RADIUS-based MAC authentication of clients for MPSK authentication .
  radius_mac_mpsk_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.2
      - ''
    description: RADIUS MAC MPSK cache timeout interval (0 or 300 - 864000).
  radius_mac_auth_usergroups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Selective user groups that are permitted for RADIUS mac authentication.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: User group name. Source user.group.name.
        references:
        - user.group.name
  auth:
    type: enum
    raw_type: string
    choices:
    - radius
    - usergroup
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication protocol.
  encrypt:
    type: enum
    raw_type: string
    choices:
    - TKIP
    - AES
    - TKIP-AES
    version_ranges:
    - - v6.0.0
      - ''
    description: Encryption protocol to use (only available when security is set to a WPA type).
  keyindex:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: WEP key index (1 - 4).
  key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WEP Key.
  passphrase:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WPA pre-shared key (PSK) to be used to authenticate WiFi users.
  sae_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: WPA3 SAE password to be used to authenticate WiFi users.
  sae_h2e_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Use hash-to-element-only mechanism for PWE derivation .
  sae_hnp_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Use hunting-and-pecking-only mechanism for PWE derivation .
  sae_pk:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable WPA3 SAE-PK .
  sae_private_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Private key used for WPA3 SAE-PK authentication.
  akm24_only:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: WPA3 SAE using group-dependent hash only .
  radius_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS server to be used to authenticate WiFi users. Source user.radius.name.
    references:
    - user.radius.name
  nas_filter_rule:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable NAS filter rule support .
  domain_name_stripping:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable stripping domain name from identity .
  mlo:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.5
      - ''
    description: Enable/disable WiFi7 Multi-Link-Operation .
  local_standalone:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable AP local standalone .
  local_standalone_nat:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable AP local standalone NAT mode.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address and subnet mask for the local standalone NAT subnet.
  dhcp_lease_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP lease time in seconds for NAT IP address.
  local_standalone_dns:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable AP local standalone DNS.
  local_standalone_dns_ip:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.1
      - ''
    description: IPv4 addresses for the local standalone DNS.
  local_lan_partition:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable segregating client traffic to local LAN side .
  local_bridging:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable bridging of wireless and Ethernet interfaces on the FortiAP .
  local_lan:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v6.0.0
      - ''
    description: Allow/deny traffic destined for a Class A, B, or C private IP address .
  local_authentication:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable AP local authentication.
  usergroup:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Firewall user group to be used to authenticate WiFi users.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: User group name. Source user.group.name.
        references:
        - user.group.name
  captive_portal:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable captive portal.
  captive_network_assistant_bypass:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable Captive Network Assistant bypass.
  portal_message_override_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Replacement message group for this VAP (only available when security is set to a captive portal type). Source
      system.replacemsg-group .name.
  portal_message_overrides:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Individual message overrides.
    children:
      auth_disclaimer_page:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override auth-disclaimer-page message with message from portal-message-overrides group.
      auth_reject_page:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override auth-reject-page message with message from portal-message-overrides group.
      auth_login_page:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override auth-login-page message with message from portal-message-overrides group.
      auth_login_failed_page:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override auth-login-failed-page message with message from portal-message-overrides group.
  portal_type:
    type: enum
    raw_type: string
    choices:
    - auth
    - auth+disclaimer
    - disclaimer
    - email-collect
    - cmcc
    - cmcc-macauth
    - auth-mac
    - external-auth
    - external-macauth
    version_ranges:
    - - v6.0.0
      - ''
    description: Captive portal functionality. Configure how the captive portal authenticates users and whether it includes
      a disclaimer.
  selected_usergroups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Selective user groups that are permitted to authenticate.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: User group name. Source user.group.name.
        references:
        - user.group.name
  security_exempt_list:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional security exempt list for captive portal authentication. Source user.security-exempt-list.name.
    references:
    - user.security-exempt-list.name
  security_redirect_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional URL for redirecting users after they pass captive portal authentication.
  auth_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.4
      - ''
    description: HTTPS server certificate. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  auth_portal_addr:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.4
      - ''
    description: Address of captive portal.
  intra_vap_privacy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking communication between clients on the same SSID (called intra-SSID privacy) .
  schedule:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Firewall schedules for enabling this VAP on the FortiAP. This VAP will be enabled when at least one of the
      schedules is valid. Separate multiple schedule names with a space.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Schedule name. Source firewall.schedule.group.name firewall.schedule.recurring.name firewall.schedule.onetime.name.
        references:
        - firewall.schedule.group.name
        - firewall.schedule.onetime.name
        - firewall.schedule.recurring.name
  ldpc:
    type: enum
    raw_type: string
    choices:
    - disable
    - rx
    - tx
    - rxtx
    version_ranges:
    - - v6.0.0
      - ''
    description: VAP low-density parity-check (LDPC) coding configuration.
  high_efficiency:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable 802.11ax high efficiency .
  target_wake_time:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable 802.11ax target wake time .
  port_macauth:
    type: enum
    raw_type: string
    choices:
    - disable
    - radius
    - address-group
    version_ranges:
    - - v6.4.4
      - ''
    description: Enable/disable LAN port MAC authentication .
  port_macauth_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: LAN port MAC authentication idle timeout value .
  port_macauth_reauth_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: LAN port MAC authentication re-authentication timeout value .
  bss_color_partial:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Enable/disable 802.11ax partial BSS color .
