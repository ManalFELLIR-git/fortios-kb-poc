id: system.wccp
version: 7.6.7
source_object: fortios_system_wccp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_wccp.py
root_type: list
attributes:
  service_id:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Service ID.
  router_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address known to all cache engines. If all cache engines connect to the same FortiGate interface, use
      the default 0.0.0.0.
  cache_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address known to all routers. If the addresses are the same, use the default 0.0.0.0.
  group_address:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP multicast address used by the cache routers. For the FortiGate to ignore multicast WCCP traffic, use the
      default 0.0.0.0.
  server_list:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: IP addresses and netmasks for up to four cache servers.
  router_list:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: IP addresses of one or more WCCP routers.
  ports_defined:
    type: enum
    raw_type: string
    choices:
    - source
    - destination
    version_ranges:
    - - v6.0.0
      - ''
    description: Match method.
  server_type:
    type: enum
    raw_type: string
    choices:
    - forward
    - proxy
    version_ranges:
    - - v6.0.0
      - ''
    description: Cache server type.
  ports:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Service ports.
  authentication:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable MD5 authentication.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password for MD5 authentication.
  forward_method:
    type: enum
    raw_type: string
    choices:
    - GRE
    - L2
    - any
    version_ranges:
    - - v6.0.0
      - ''
    description: Method used to forward traffic to the cache servers.
  cache_engine_method:
    type: enum
    raw_type: string
    choices:
    - GRE
    - L2
    version_ranges:
    - - v6.0.0
      - ''
    description: Method used to forward traffic to the routers or to return to the cache engine.
  service_type:
    type: enum
    raw_type: string
    choices:
    - auto
    - standard
    - dynamic
    version_ranges:
    - - v6.0.0
      - ''
    description: WCCP service type used by the cache server for logical interception and redirection of traffic.
  primary_hash:
    type: enum
    raw_type: list
    choices:
    - src-ip
    - dst-ip
    - src-port
    - dst-port
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Hash method.
  priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Service priority.
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Service protocol.
  assignment_weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Assignment of hash weight/ratio for the WCCP cache engine.
  assignment_bucket_format:
    type: enum
    raw_type: string
    choices:
    - wccp-v2
    - cisco-implementation
    version_ranges:
    - - v6.0.0
      - ''
    description: Assignment bucket format for the WCCP cache engine.
  return_method:
    type: enum
    raw_type: string
    choices:
    - GRE
    - L2
    - any
    version_ranges:
    - - v6.0.0
      - ''
    description: Method used to decline a redirected packet and return it to the FortiGate unit.
  assignment_method:
    type: enum
    raw_type: string
    choices:
    - HASH
    - MASK
    - any
    version_ranges:
    - - v6.0.0
      - ''
    description: Hash key assignment preference.
  assignment_srcaddr_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Assignment source address mask.
  assignment_dstaddr_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Assignment destination address mask.
