id: firewall.service.custom
version: 7.6.7
source_object: fortios_firewall_service_custom
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_service_custom.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom service name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  fabric_object:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Security Fabric global object setting.
  proxy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable web proxy service.
  category:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Service category. Source firewall.service.category.name.
    references:
    - firewall.service.category.name
  protocol:
    type: enum
    raw_type: string
    choices:
    - TCP/UDP/UDP-Lite/SCTP
    - ICMP
    - ICMP6
    - IP
    - HTTP
    - FTP
    - CONNECT
    - SOCKS-TCP
    - SOCKS-UDP
    - ALL
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocol type based on IANA numbers.
  helper:
    type: enum
    raw_type: string
    choices:
    - auto
    - disable
    - ftp
    - tftp
    - ras
    - h323
    - tns
    - mms
    - sip
    - pptp
    - rtsp
    - dns-udp
    - dns-tcp
    - pmap
    - rsh
    - dcerpc
    - mgcp
    - gtp-c
    - gtp-u
    - gtp-b
    - pfcp
    version_ranges:
    - - v6.0.0
      - ''
    description: Helper name.
  iprange:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Start and end of the IP range associated with service.
  fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Fully qualified domain name.
  protocol_number:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: IP protocol number.
  icmptype:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: ICMP type.
  icmpcode:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: ICMP code.
  tcp_portrange:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Multiple TCP port ranges.
  udp_portrange:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Multiple UDP port ranges.
  udplite_portrange:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Multiple UDP-Lite port ranges.
  sctp_portrange:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Multiple SCTP port ranges.
  tcp_halfclose_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Wait time to close a TCP session waiting for an unanswered FIN packet (1 - 86400 sec, 0 = default).
  tcp_halfopen_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Wait time to close a TCP session waiting for an unanswered open session packet (1 - 86400 sec, 0 = default).
  tcp_timewait_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the length of the TCP TIME-WAIT state in seconds (1 - 300 sec, 0 = default).
  tcp_rst_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Set the length of the TCP CLOSE state in seconds (5 - 300 sec, 0 = default).
  udp_idle_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of seconds before an idle UDP/UDP-Lite connection times out (0 - 86400 sec, 0 = default).
  session_ttl:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Session TTL (300 - 2764800, 0 = default).
  check_reset_range:
    type: enum
    raw_type: string
    choices:
    - disable
    - strict
    - default
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure the type of ICMP error message verification.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  color:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Color of icon on the GUI.
  app_service_type:
    type: enum
    raw_type: string
    choices:
    - disable
    - app-id
    - app-category
    version_ranges:
    - - v6.0.0
      - ''
    description: Application service type.
  app_category:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Application category ID.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Application category id. see <a href='#notes'>Notes</a>.
  application:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Application ID.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Application id. see <a href='#notes'>Notes</a>.
