id: vpn.ipsec.concentrator
version: 7.6.7
source_object: fortios_vpn_ipsec_concentrator
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_concentrator.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v7.0.1
      - ''
    description: Concentrator ID (1 - 65535). see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Concentrator name.
  src_check:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to check source address of phase 2 selector. Disable to check only the destination selector.
  member:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of up to 3 VPN tunnels to add to the concentrator.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Member name. Source vpn.ipsec.manualkey.name vpn.ipsec.phase1.name.
        references:
        - vpn.ipsec.manualkey.name
        - vpn.ipsec.phase1.name
