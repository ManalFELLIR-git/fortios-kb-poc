id: router.static6
version: 7.6.7
source_object: fortios_router_static6
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_static6.py
root_type: list
attributes:
  seq_num:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Sequence number. see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this static route.
  dst:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination IPv6 prefix.
  gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address of the gateway.
  device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway out interface or tunnel. Source system.interface.name.
    references:
    - system.interface.name
  devindex:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Device index (0 - 4294967295).
  distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative distance (1 - 255).
  weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Administrative weight (0 - 255).
  priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative priority (1 - 65535).
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  blackhole:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable black hole.
  dynamic_gateway:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable use of dynamic gateway retrieved from Router Advertisement (RA).
  sdwan_zone:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.1
      - ''
    description: Choose SD-WAN Zone.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.1
          - ''
        description: SD-WAN zone name. Source system.sdwan.zone.name.
        references:
        - system.sdwan.zone.name
  dstaddr:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Name of firewall address or address group. Source firewall.address6.name firewall.addrgrp6.name.
    references:
    - firewall.address6.name
    - firewall.addrgrp6.name
  link_monitor_exempt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable withdrawal of this static route when link monitor or health check is down.
  vrf:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - ''
    description: Virtual Routing Forwarding ID.
  bfd:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Bidirectional Forwarding Detection (BFD).
  tag:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Route tag.
