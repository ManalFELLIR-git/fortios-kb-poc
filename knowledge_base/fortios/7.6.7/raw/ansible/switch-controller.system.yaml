id: switch-controller.system
version: 7.6.7
source_object: fortios_switch_controller_system
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_system.py
root_type: object
attributes:
  parallel_process_override:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable parallel process override.
  parallel_process:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of parallel processes.
  data_sync_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Time interval between collection of switch data (30 - 1800 sec).
  iot_weight_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: MAC entry"s confidence value. Value is re-queried when below this value .
  iot_scan_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: IoT scan interval (2 - 10080 mins).
  iot_holdoff:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: MAC entry"s creation time. Time must be greater than this value for an entry to be created (0 - 10080 mins).
  iot_mac_idle:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: MAC entry"s idle time. MAC entry is removed after this value (0 - 10080 mins).
  nac_periodic_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Periodic time interval to run NAC engine (5 - 180 sec).
  dynamic_periodic_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Periodic time interval to run Dynamic port policy engine (5 - 180 sec).
  tunnel_mode:
    type: enum
    raw_type: string
    choices:
    - compatible
    - moderate
    - strict
    version_ranges:
    - - v7.0.0
      - ''
    description: Configure tunnel mode security .
  caputp_echo_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Echo interval for the caputp echo requests from swtp.
  caputp_max_retransmit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Maximum retransmission count for the caputp tunnel packets.
