id: ips.sensor
version: 7.6.7
source_object: fortios_ips_sensor
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ips_sensor.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Sensor name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  replacemsg_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Replacement message group. Source system.replacemsg-group.name.
    references:
    - system.replacemsg-group.name
  block_malicious_url:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable malicious URL blocking.
  scan_botnet_connections:
    type: enum
    raw_type: string
    choices:
    - disable
    - block
    - monitor
    version_ranges:
    - - v6.2.0
      - ''
    description: Block or monitor connections to Botnet servers, or disable Botnet scanning.
  extended_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable extended logging.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPS sensor filter.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Rule ID in IPS database (0 - 4294967295). see <a href='#notes'>Notes</a>.
      rule:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Identifies the predefined or custom IPS signatures to add to the sensor.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Rule IPS. see <a href='#notes'>Notes</a>.
      location:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Protect client or server traffic.
      severity:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Relative severity of the signature, from info to critical. Log messages generated by the signature include
          the severity.
      protocol:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Protocols to be examined. Use all for every protocol and other for unlisted protocols.
      os:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Operating systems to be protected. Use all for every operating system and other for unlisted operating
          systems.
      application:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Operating systems to be protected. Use all for every application and other for unlisted application.
      default_action:
        type: enum
        raw_type: string
        choices:
        - all
        - pass
        - block
        version_ranges:
        - - v7.2.0
          - ''
        description: Signature default action filter.
      default_status:
        type: enum
        raw_type: string
        choices:
        - all
        - enable
        - disable
        version_ranges:
        - - v7.2.0
          - ''
        description: Signature default status filter.
      cve:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: List of CVE IDs of the signatures to add to the sensor.
        children:
          cve_entry:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: CVE IDs or CVE wildcards.
      vuln_type:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.0
          - ''
        description: List of signature vulnerability types to filter by.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.2.0
              - ''
            description: Vulnerability type ID. see <a href='#notes'>Notes</a>.
      last_modified:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.0
          - ''
        description: 'Filter by signature last modified date. Formats: before <date>, after <date>, between <start-date> <end-date>.'
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        - default
        version_ranges:
        - - v6.0.0
          - ''
        description: Status of the signatures included in filter. Only those filters with a status to enable are used.
      log:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable logging of signatures included in filter.
      log_packet:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable packet logging. Enable to save the packet that triggers the filter. You can download the
          packets in pcap format for diagnostic use.
      log_attack_context:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Enable/disable logging of attack context: URL buffer, header buffer, body buffer, packet buffer.'
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - block
        - reset
        - default
        version_ranges:
        - - v6.0.0
          - ''
        description: Action taken with traffic in which signatures are detected.
      rate_count:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Count of the rate.
      rate_duration:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Duration (sec) of the rate.
      rate_mode:
        type: enum
        raw_type: string
        choices:
        - periodical
        - continuous
        version_ranges:
        - - v6.0.0
          - ''
        description: Rate limit mode.
      rate_track:
        type: enum
        raw_type: string
        choices:
        - none
        - src-ip
        - dest-ip
        - dhcp-client-mac
        - dns-domain
        version_ranges:
        - - v6.0.0
          - ''
        description: Track the packet protocol field.
      exempt_ip:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Traffic from selected source or destination IP addresses is exempt from this signature.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Exempt IP ID. see <a href='#notes'>Notes</a>.
          src_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Source IP address and netmask (applies to packet matching the signature).
          dst_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Destination IP address and netmask (applies to packet matching the signature).
      quarantine:
        type: enum
        raw_type: string
        choices:
        - none
        - attacker
        version_ranges:
        - - v6.0.0
          - ''
        description: Quarantine method.
      quarantine_expiry:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Duration of quarantine. (Format
      quarantine_log:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable quarantine logging.
