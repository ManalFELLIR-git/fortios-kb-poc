id: certificate.ca
version: 7.6.7
source_object: fortios_certificate_ca
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_certificate_ca.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  ca:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: CA certificate as a PEM file.
  range:
    type: enum
    raw_type: string
    choices:
    - global
    - vdom
    version_ranges:
    - - v6.0.0
      - ''
    description: Either global or VDOM IP address range for the CA certificate.
  source:
    type: enum
    raw_type: string
    choices:
    - factory
    - user
    - bundle
    version_ranges:
    - - v6.0.0
      - ''
    description: CA certificate source type.
  ssl_inspection_trusted:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable this CA as a trusted CA for SSL inspection.
  scep_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL of the SCEP server.
  est_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: URL of the EST server.
  auto_update_days:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of days to wait before requesting an updated CA certificate (0 - 4294967295, 0 = disabled).
  auto_update_days_warning:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of days before an expiry-warning message is generated (0 - 4294967295, 0 = disabled).
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address for communications to the SCEP server.
  ca_identifier:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: CA identifier of the SCEP server.
  obsolete:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable this CA as obsoleted.
  fabric_ca:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable synchronization of CA across Security Fabric.
