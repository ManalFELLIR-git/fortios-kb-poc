        description: IPv6 VRRP configuration.
        children:
          vrid:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Virtual router identifier (1 - 255). see <a href='#notes'>Notes</a>.
          vrgrp:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: VRRP group ID (1 - 65535).
          vrip6:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: IPv6 address of the virtual router.
          priority:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Priority of the virtual router (1 - 255).
          adv_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Advertisement interval (250 - 255000 milliseconds).
          start_time:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Startup time (1 - 255 seconds).
          preempt:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable preempt mode.
          accept_mode:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable accept mode.
          vrdst6:
            type: list
            raw_type: list
            multiple_values: true
            elements: str
            version_ranges:
            - - v6.0.0
              - ''
            description: Monitor the route to this destination.
          vrdst_priority:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.0
              - ''
            description: Priority of the virtual router when the virtual router destination becomes unreachable (0 - 254).
          ignore_default_route:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.2
              - ''
            description: Enable/disable ignoring of default route when checking destination.
          status:
