id: system.interface
version: 7.6.7
source_object: fortios_system_interface
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_interface.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface is in this virtual domain (VDOM). Source system.vdom.name.
    references:
    - system.vdom.name
  vrf:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual Routing Forwarding ID.
  fortilink:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable FortiLink to dedicate this interface to manage other Fortinet devices.
  switch_controller_source_ip:
    type: enum
    raw_type: string
    choices:
    - outbound
    - fixed
    version_ranges:
    - - v6.4.4
      - ''
    description: Source IP address used in FortiLink over L3 connections.
  mode:
    type: enum
    raw_type: string
    choices:
    - static
    - dhcp
    - pppoe
    version_ranges:
    - - v6.0.0
      - ''
    description: Addressing mode (static, DHCP, PPPoE).
  client_options:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: DHCP client options.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      code:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.4.0
          - ''
        description: DHCP client option code.
      type:
        type: enum
        raw_type: string
        choices:
        - hex
        - string
        - ip
        - fqdn
        version_ranges:
        - - v6.4.0
          - ''
        description: DHCP client option type.
      value:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: DHCP client option value.
      ip:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.4.0
          - ''
        description: DHCP option IPs.
  distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance for routes learned through PPPoE or DHCP, lower distance indicates preferred route.
  priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Priority of learned routes.
  dhcp_relay_interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  dhcp_relay_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  dhcp_relay_vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  dhcp_broadcast_flag:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable setting of the broadcast flag in messages sent by the DHCP client .
  dhcp_relay_service:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing this interface to act as a DHCP relay.
  dhcp_relay_ip:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP relay IP address.
  dhcp_relay_source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: IP address used by the DHCP relay as its source IP.
  dhcp_relay_circuit_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: DHCP relay circuit ID.
  dhcp_relay_link_selection:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.4
      - ''
    description: DHCP relay link selection.
  dhcp_relay_request_all_server:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable sending of DHCP requests to all servers.
  dhcp_relay_allow_no_end_option:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable relaying DHCP messages with no end option.
  dhcp_relay_type:
    type: enum
    raw_type: string
    choices:
    - regular
    - ipsec
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP relay type (regular or IPsec).
  dhcp_smart_relay:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable DHCP smart relay.
  dhcp_relay_agent_option:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DHCP relay agent option.
  dhcp_classless_route_addition:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable addition of classless static routes retrieved from DHCP server.
  management_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: High Availability in-band management IP address of this interface.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Interface IPv4 address and subnet mask, syntax: X.X.X.X/24.'
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - ping
    - https
    - ssh
    - snmp
    - http
    - telnet
    - fgfm
    - radius-acct
    - probe-response
    - fabric
    - ftm
    - speed-test
    - scim
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Permitted types of management access to this interface.
  gwdetect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable detect gateway alive for first.
  detectserver:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway"s ping server for this IP.
  detectprotocol:
    type: enum
    raw_type: list
    choices:
    - ping
    - tcp-echo
    - udp-echo
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocols used to detect the server.
  ha_priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: HA election priority for the PING server.
  fail_detect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable fail detection features for this interface.
  fail_detect_option:
    type: enum
    raw_type: list
    choices:
    - detectserver
    - link-down
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Options for detecting that this interface has failed.
  fail_alert_method:
    type: enum
    raw_type: string
    choices:
    - link-failed-signal
    - link-down
    version_ranges:
    - - v6.0.0
      - ''
    description: Select link-failed-signal or link-down method to alert about a failed link.
  fail_action_on_extender:
    type: enum
    raw_type: string
    choices:
    - soft-restart
    - hard-restart
    - reboot
    version_ranges:
    - - v6.0.0
      - ''
    description: Action on FortiExtender when interface fail.
  fail_alert_interfaces:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of the FortiGate interfaces to which the link failure alert is sent.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Names of the non-virtual interface. Source system.interface.name.
        references:
        - system.interface.name
  dhcp_client_identifier:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP client identifier.
  dhcp_renew_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: DHCP renew time in seconds (300-604800), 0 means use the renew time provided by the server.
  ipunnumbered:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Unnumbered IP used for PPPoE interfaces for which no unique local address is provided.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Username of the PPPoE account, provided by your ISP.
  pppoe_egress_cos:
    type: enum
    raw_type: string
    choices:
    - cos0
    - cos1
    - cos2
    - cos3
    - cos4
    - cos5
    - cos6
    - cos7
    version_ranges:
    - - v7.6.0
      - ''
    description: CoS in VLAN tag for outgoing PPPoE/PPP packets.
  pppoe_unnumbered_negotiate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable PPPoE unnumbered negotiation.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPPoE account"s password.
  idle_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: PPPoE auto disconnect after idle timeout seconds, 0 means no timeout.
  multilink:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.5
      - ''
    description: Enable/disable PPP multilink support.
  mrru:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - ''
    description: PPP MRRU (296 - 65535).
  disc_retry_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds to wait before retrying to start a PPPoE discovery, 0 means no timeout.
  padt_retry_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: PPPoE Active Discovery Terminate (PADT) used to terminate sessions after an idle time.
  service_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPPoE service name.
  ac_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPPoE server name.
  lcp_echo_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds between PPPoE Link Control Protocol (LCP) echo requests.
  lcp_max_echo_fails:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum missed LCP echo messages before disconnect.
  defaultgw:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to get the gateway IP from the DHCP or PPPoE server.
  dns_server_override:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use DNS acquired by DHCP or PPPoE.
  dns_server_protocol:
    type: enum
    raw_type: list
    choices:
    - cleartext
    - dot
    - doh
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.4
      - ''
    description: DNS transport protocols.
  auth_type:
    type: enum
    raw_type: string
    choices:
    - auto
    - pap
    - chap
    - mschapv1
    - mschapv2
    version_ranges:
    - - v6.0.0
      - ''
    description: PPP authentication type to use.
  pptp_client:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable PPTP client.
  pptp_user:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPTP user name.
  pptp_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPTP password.
  pptp_server_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PPTP server IP address.
  pptp_auth_type:
    type: enum
    raw_type: string
    choices:
    - auto
    - pap
    - chap
    - mschapv1
    - mschapv2
    version_ranges:
    - - v6.0.0
      - ''
    description: PPTP authentication type.
  pptp_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Idle timer in minutes (0 for disabled).
  arpforward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ARP forwarding.
  ndiscforward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable NDISC forwarding.
  broadcast_forward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable broadcast forwarding.
  bfd:
    type: enum
    raw_type: string
    choices:
    - global
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Bidirectional Forwarding Detection (BFD) settings.
  bfd_desired_min_tx:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD desired minimal transmit interval.
  bfd_detect_mult:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD detection multiplier.
  bfd_required_min_rx:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: BFD required minimal receive interval.
  l2forward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable l2 forwarding.
  icmp_send_redirect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending of ICMP redirects.
  icmp_accept_redirect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ICMP accept redirect.
  reachable_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.4
      - ''
    description: IPv4 reachable time in milliseconds (30000 - 3600000).
  vlanforward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable traffic forwarding between VLANs on this interface.
  stpforward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable STP forwarding.
  stpforward_mode:
    type: enum
    raw_type: string
    choices:
    - rpl-all-ext-id
    - rpl-bridge-ext-id
    - rpl-nothing
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure STP forwarding mode.
  ips_sniffer_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the use of this interface as a one-armed sniffer.
  ident_accept:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable authentication for this interface.
  ipmac:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IP/MAC binding.
  subst:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to always send packets from this interface to a destination MAC address.
  macaddr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Change the interface"s MAC address.
  virtual_mac:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Change the interface"s virtual MAC address.
  substitute_dst_mac:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination MAC address that all packets are sent to from this interface.
  speed:
    type: enum
    raw_type: string
    choices:
    - auto
    - 10full
    - 10half
    - 100full
    - 100half
    - 100auto
    - 1000full
    - 1000auto
    - 10000full
    - 10000auto
    - 40000full
    - 40000auto
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface speed. The default setting and the options available depend on the interface hardware.
  status:
    type: enum
    raw_type: string
    choices:
    - up
    - down
    version_ranges:
    - - v6.0.0
      - ''
    description: Bring the interface up or shut the interface down.
  netbios_forward:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable NETBIOS forwarding.
  wins_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WINS server IP.
  type:
    type: enum
    raw_type: string
    choices:
    - physical
    - vlan
    - aggregate
    - redundant
    - tunnel
    - vdom-link
    - loopback
    - switch
    - vap-switch
    - wl-mesh
    - fext-wan
    - vxlan
    - geneve
    - switch-vlan
    - emac-vlan
    - lan-extension
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface type.
  dedicated_to:
    type: enum
    raw_type: string
    choices:
    - none
    - management
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure interface for single purpose.
  trust_ip_1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted host for dedicated management traffic (0.0.0.0/24 for all hosts).
  trust_ip_2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted host for dedicated management traffic (0.0.0.0/24 for all hosts).
  trust_ip_3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted host for dedicated management traffic (0.0.0.0/24 for all hosts).
  trust_ip6_1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted IPv6 host for dedicated management traffic (::/0 for all hosts).
  trust_ip6_2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted IPv6 host for dedicated management traffic (::/0 for all hosts).
  trust_ip6_3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Trusted IPv6 host for dedicated management traffic (::/0 for all hosts).
  wccp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable WCCP on this interface. Used for encapsulated WCCP communication between WCCP clients and
      servers.
  netflow_sampler:
    type: enum
    raw_type: string
    choices:
    - disable
    - tx
    - rx
    - both
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable NetFlow on this interface and set the data that NetFlow collects (rx, tx, or both).
  netflow_sample_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: NetFlow sample rate.  Sample one packet every configured number of packets(1 - 65535).
  netflow_sampler_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Netflow sampler ID.
  sflow_sampler:
    type: enum
    raw_type: string
    choices:
    - enable
