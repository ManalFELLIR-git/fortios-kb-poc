id: switch-controller.auto-config.policy
version: 7.6.7
source_object: fortios_switch_controller_auto_config_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_auto_config_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Auto-config policy name.
  qos_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Auto-Config QoS policy. Source switch-controller.qos.qos-policy.name.
    references:
    - switch-controller.qos.qos-policy.name
  storm_control_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Auto-Config storm control policy. Source switch-controller.storm-control-policy.name.
    references:
    - switch-controller.storm-control-policy.name
  poe_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable PoE status.
  igmp_flood_report:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable IGMP flood report.
  igmp_flood_traffic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable IGMP flood traffic.
