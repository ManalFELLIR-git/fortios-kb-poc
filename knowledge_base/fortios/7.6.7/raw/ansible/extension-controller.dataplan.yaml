id: extension-controller.dataplan
version: 7.6.7
source_object: fortios_extension_controller_dataplan
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_extension_controller_dataplan.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiExtender data plan name.
  modem_id:
    type: enum
    raw_type: string
    choices:
    - modem1
    - modem2
    - all
    version_ranges:
    - - v7.2.1
      - ''
    description: Dataplan"s modem specifics, if any.
  type:
    type: enum
    raw_type: string
    choices:
    - carrier
    - slot
    - iccid
    - generic
    version_ranges:
    - - v7.2.1
      - ''
    description: Type preferences configuration.
  slot:
    type: enum
    raw_type: string
    choices:
    - sim1
    - sim2
    version_ranges:
    - - v7.2.1
      - ''
    description: SIM slot configuration.
  iccid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: ICCID configuration.
  carrier:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Carrier configuration.
  apn:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: APN configuration.
  auth_type:
    type: enum
    raw_type: string
    choices:
    - none
    - pap
    - chap
    version_ranges:
    - - v7.2.1
      - ''
    description: Authentication type.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Username.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Password.
  pdn:
    type: enum
    raw_type: string
    choices:
    - ipv4-only
    - ipv6-only
    - ipv4-ipv6
    version_ranges:
    - - v7.2.1
      - ''
    description: PDN type.
  signal_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Signal threshold. Specify the range between 50 - 100, where 50/100 means -50/-100 dBm.
  signal_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Signal period (600 to 18000 seconds).
  capacity:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Capacity in MB (0 - 102400000).
  monthly_fee:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Monthly fee of dataplan (0 - 100000, in local currency).
  billing_date:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Billing day of the month (1 - 31).
  overage:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable dataplan overage detection.
  preferred_subnet:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Preferred subnet mask (0 - 32).
  private_network:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable dataplan private network support.
