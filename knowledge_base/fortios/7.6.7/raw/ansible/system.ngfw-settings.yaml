id: system.ngfw-settings
version: 7.6.7
source_object: fortios_system_ngfw_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ngfw_settings.py
root_type: object
attributes:
  match_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Number of seconds to wait before a security policy match for an idle non-TCP session (0 - 1800).
  tcp_match_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Number of seconds to wait before a security policy match for an idle TCP session (0 - 1800).
  tcp_halfopen_match_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Number of seconds to wait before a security policy match for a session after one peer has sent an open session
      packet but the other has not responded (0 - 300).
