id: wireless-controller.hotspot20.hs-profile
version: 7.6.7
source_object: fortios_wireless_controller_hotspot20_hs_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_hotspot20_hs_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Hotspot profile name.
  release:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.2
      - ''
    description: Hotspot 2.0 Release number (1, 2, 3).
  access_network_type:
    type: enum
    raw_type: string
    choices:
    - private-network
    - private-network-with-guest-access
    - chargeable-public-network
    - free-public-network
    - personal-device-network
    - emergency-services-only-network
    - test-or-experimental
    - wildcard
    version_ranges:
    - - v6.0.0
      - ''
    description: Access network type.
  access_network_internet:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable connectivity to the Internet.
  access_network_asra:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable additional step required for access (ASRA).
  access_network_esr:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable emergency services reachable (ESR).
  access_network_uesa:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable unauthenticated emergency service accessible (UESA).
  venue_group:
    type: enum
    raw_type: string
    choices:
    - unspecified
    - assembly
    - business
    - educational
    - factory
    - institutional
    - mercantile
    - residential
    - storage
    - utility
    - vehicular
    - outdoor
    version_ranges:
    - - v6.0.0
      - ''
    description: Venue group.
  venue_type:
    type: enum
    raw_type: string
    choices:
    - unspecified
    - arena
    - stadium
    - passenger-terminal
    - amphitheater
    - amusement-park
    - place-of-worship
    - convention-center
    - library
    - museum
    - restaurant
    - theater
    - bar
    - coffee-shop
    - zoo-or-aquarium
    - emergency-center
    - doctor-office
    - bank
    - fire-station
    - police-station
    - post-office
    - professional-office
    - research-facility
    - attorney-office
    - primary-school
    - secondary-school
    - university-or-college
    - factory
    - hospital
    - long-term-care-facility
    - rehab-center
    - group-home
    - prison-or-jail
    - retail-store
    - grocery-market
    - auto-service-station
    - shopping-mall
    - gas-station
    - private
    - hotel-or-motel
    - dormitory
    - boarding-house
    - automobile
    - airplane
    - bus
    - ferry
    - ship-or-boat
    - train
    - motor-bike
    - muni-mesh-network
    - city-park
    - rest-area
    - traffic-control
    - bus-stop
    - kiosk
    version_ranges:
    - - v6.0.0
      - ''
    description: Venue type.
  hessid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Homogeneous extended service set identifier (HESSID).
  proxy_arp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Proxy ARP.
  l2tif:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Layer 2 traffic inspection and filtering.
  pame_bi:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Pre-Association Message Exchange BSSID Independent (PAME-BI).
  anqp_domain_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: ANQP Domain ID (0-65535).
  domain_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name.
  osu_ssid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Online sign up (OSU) SSID.
  gas_comeback_delay:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: GAS comeback delay (0 or 100 - 10000 milliseconds).
  gas_fragmentation_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: GAS fragmentation limit (512 - 4096).
  dgaf:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable downstream group-addressed forwarding (DGAF).
  deauth_request_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Deauthentication request timeout (in seconds).
  wnm_sleep_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable wireless network management (WNM) sleep mode.
  bss_transition:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable basic service set (BSS) transition Support.
  venue_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Venue name. Source wireless-controller.hotspot20.anqp-venue-name.name.
    references:
    - wireless-controller.hotspot20.anqp-venue-name.name
  venue_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Venue name. Source wireless-controller.hotspot20.anqp-venue-url.name.
    references:
    - wireless-controller.hotspot20.anqp-venue-url.name
  roaming_consortium:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Roaming consortium list name. Source wireless-controller.hotspot20.anqp-roaming-consortium.name.
    references:
    - wireless-controller.hotspot20.anqp-roaming-consortium.name
  nai_realm:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: NAI realm list name. Source wireless-controller.hotspot20.anqp-nai-realm.name.
    references:
    - wireless-controller.hotspot20.anqp-nai-realm.name
  oper_friendly_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Operator friendly name. Source wireless-controller.hotspot20.h2qp-operator-name.name.
    references:
    - wireless-controller.hotspot20.h2qp-operator-name.name
  oper_icon:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Operator icon. Source wireless-controller.hotspot20.icon.name.
    references:
    - wireless-controller.hotspot20.icon.name
  advice_of_charge:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Advice of charge. Source wireless-controller.hotspot20.h2qp-advice-of-charge.name.
    references:
    - wireless-controller.hotspot20.h2qp-advice-of-charge.name
  osu_provider_nai:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: OSU Provider NAI. Source wireless-controller.hotspot20.h2qp-osu-provider-nai.name.
    references:
    - wireless-controller.hotspot20.h2qp-osu-provider-nai.name
  terms_and_conditions:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Terms and conditions. Source wireless-controller.hotspot20.h2qp-terms-and-conditions.name.
    references:
    - wireless-controller.hotspot20.h2qp-terms-and-conditions.name
  osu_provider:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Manually selected list of OSU provider(s).
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: OSU provider name. Source wireless-controller.hotspot20.h2qp-osu-provider.name.
        references:
        - wireless-controller.hotspot20.h2qp-osu-provider.name
  wan_metrics:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WAN metric name. Source wireless-controller.hotspot20.h2qp-wan-metric.name.
    references:
    - wireless-controller.hotspot20.h2qp-wan-metric.name
  network_auth:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Network authentication name. Source wireless-controller.hotspot20.anqp-network-auth-type.name.
    references:
    - wireless-controller.hotspot20.anqp-network-auth-type.name
  conn_cap:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Connection capability name. Source wireless-controller.hotspot20.h2qp-conn-capability.name.
    references:
    - wireless-controller.hotspot20.h2qp-conn-capability.name
  qos_map:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: QoS MAP set ID. Source wireless-controller.hotspot20.qos-map.name.
    references:
    - wireless-controller.hotspot20.qos-map.name
  ip_addr_type:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address type name. Source wireless-controller.hotspot20.anqp-ip-address-type.name.
    references:
    - wireless-controller.hotspot20.anqp-ip-address-type.name
  wba_open_roaming:
    type: enum
    raw_type: string
    choices:
