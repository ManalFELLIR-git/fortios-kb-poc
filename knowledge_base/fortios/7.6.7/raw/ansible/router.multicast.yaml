id: router.multicast
version: 7.6.7
source_object: fortios_router_multicast
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_multicast.py
root_type: object
attributes:
  route_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Generate warnings when the number of multicast routes exceeds this number, must not be greater than route-limit.
  route_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of multicast routes.
  multicast_routing:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IP multicast routing.
  pim_sm_global:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: PIM sparse-mode global settings.
    children:
      message_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Period of time between sending periodic PIM join/prune messages in seconds (1 - 65535).
      join_prune_holdtime:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Join/prune holdtime (1 - 65535).
      accept_register_list:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Sources allowed to register packets with this Rendezvous Point (RP). Source router.access-list.name.
        references:
        - router.access-list.name
      accept_source_list:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Sources allowed to send multicast traffic. Source router.access-list.name.
        references:
        - router.access-list.name
      bsr_candidate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable allowing this router to become a bootstrap router (BSR).
      bsr_interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface to advertise as candidate BSR. Source system.interface.name.
        references:
        - system.interface.name
      bsr_priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: BSR priority (0 - 255).
      bsr_hash:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: BSR hash length (0 - 32).
      bsr_allow_quick_refresh:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable accept BSR quick refresh packets from neighbors.
      cisco_crp_prefix:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable making candidate RP compatible with old Cisco IOS.
      cisco_register_checksum:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Checksum entire register packet(for old Cisco IOS compatibility).
      cisco_register_checksum_group:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Cisco register checksum only these groups. Source router.access-list.name.
        references:
        - router.access-list.name
      cisco_ignore_rp_set_priority:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Use only hash for RP selection (compatibility with old Cisco IOS).
      register_rp_reachability:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable check RP is reachable before registering packets.
      register_source:
        type: enum
        raw_type: string
        choices:
        - disable
        - interface
        - ip-address
        version_ranges:
        - - v6.0.0
          - ''
        description: Override source address in register packets.
      register_source_interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override with primary interface address. Source system.interface.name.
        references:
        - system.interface.name
      register_source_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Override with local IP address.
      register_supression:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Period of time to honor register-stop message (1 - 65535 sec).
      null_register_retries:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum retries of null register (1 - 20).
      rp_register_keepalive:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Timeout for RP receiving data on (S,G) tree (1 - 65535 sec).
      spt_threshold:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable switching to source specific trees.
      spt_threshold_group:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Groups allowed to switch to source tree. Source router.access-list.name.
        references:
        - router.access-list.name
      ssm:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable source specific multicast.
      ssm_range:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Groups allowed to source specific multicast. Source router.access-list.name.
        references:
        - router.access-list.name
      register_rate_limit:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Limit of packets/sec per source registered through this RP (0 - 65535).
      pim_use_sdwan:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable use of SDWAN when checking RPF neighbor and sending of REG packet.
      rp_address:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Statically configure RP addresses.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: ID. see <a href='#notes'>Notes</a>.
          ip_address:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: RP router address.
          group:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Groups to use this RP. Source router.access-list.name.
            references:
            - router.access-list.name
  pim_sm_global_vrf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: per-VRF PIM sparse-mode global settings.
    children:
      vrf:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: VRF ID. see <a href='#notes'>Notes</a>.
      bsr_candidate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable allowing this router to become a bootstrap router (BSR).
      bsr_interface:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: Interface to advertise as candidate BSR. Source system.interface.name.
        references:
        - system.interface.name
      bsr_priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: BSR priority (0 - 255).
      bsr_hash:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: BSR hash length (0 - 32).
      bsr_allow_quick_refresh:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable accept BSR quick refresh packets from neighbors.
      cisco_crp_prefix:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable making candidate RP compatible with old Cisco IOS.
      rp_address:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: Statically configure RP addresses.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.6.1
              - ''
            description: ID. see <a href='#notes'>Notes</a>.
          ip_address:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: RP router address.
          group:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: Groups to use this RP. Source router.access-list.name.
            references:
            - router.access-list.name
  interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: PIM interfaces.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
      ttl_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Minimum TTL of multicast packets that will be forwarded (applied only to new multicast routes) (1 - 255).
      pim_mode:
        type: enum
        raw_type: string
        choices:
        - sparse-mode
        - dense-mode
        version_ranges:
        - - v6.0.0
          - ''
        description: PIM operation mode.
      passive:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable listening to IGMP but not participating in PIM.
      bfd:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable Protocol Independent Multicast (PIM) Bidirectional Forwarding Detection (BFD).
      neighbour_filter:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Routers acknowledged as neighbor routers. Source router.access-list.name.
        references:
        - router.access-list.name
      hello_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Interval between sending PIM hello messages (0 - 65535 sec).
      hello_holdtime:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Time before old neighbor information expires (0 - 65535 sec).
      cisco_exclude_genid:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Exclude GenID from hello packets (compatibility with old Cisco IOS).
      dr_priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: DR election priority.
      propagation_delay:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Delay flooding packets on this interface (100 - 5000 msec).
      state_refresh_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Interval between sending state-refresh packets (1 - 100 sec).
      rp_candidate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable compete to become RP in elections.
      rp_candidate_group:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Multicast groups managed by this RP. Source router.access-list.name.
        references:
        - router.access-list.name
      rp_candidate_priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Router"s priority as RP.
      rp_candidate_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: RP candidate advertisement interval (1 - 16383 sec).
      multicast_flow:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Acceptable source for multicast group. Source router.multicast-flow.name.
        references:
        - router.multicast-flow.name
      static_group:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Statically set multicast groups to forward out. Source router.multicast-flow.name.
        references:
        - router.multicast-flow.name
      rpf_nbr_fail_back:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable fail back for RPF neighbor query.
      rpf_nbr_fail_back_filter:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Filter for fail back RPF neighbors. Source router.access-list.name.
        references:
        - router.access-list.name
      join_group:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Join multicast groups.
        children:
          address:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Multicast group IP address.
      igmp:
        type: object
        raw_type: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: IGMP configuration options.
        children:
          access_group:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Groups IGMP hosts are allowed to join. Source router.access-list.name.
            references:
            - router.access-list.name
          version:
            type: enum
            raw_type: string
            choices:
            - '3'
            - '2'
            - '1'
            version_ranges:
            - - v6.0.0
              - ''
            description: Maximum version of IGMP to support.
          immediate_leave_group:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Groups to drop membership for immediately after receiving IGMPv2 leave. Source router.access-list.name.
            references:
            - router.access-list.name
          last_member_query_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Timeout between IGMPv2 leave and removing group (1 - 65535 msec).
          last_member_query_count:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Number of group specific queries before removing group (2 - 7).
          query_max_response_time:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Maximum time to wait for a IGMP query response (1 - 25 sec).
          query_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Interval between queries to IGMP hosts (1 - 65535 sec).
          query_timeout:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Timeout between queries before becoming querying unit for network (60 - 900).
          router_alert_check:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable require IGMP packets contain router alert option.
      update_source:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.7
          - v7.6.7
        description: Interface to use as source IP. Source system.interface.name.
        references:
        - system.interface.name
