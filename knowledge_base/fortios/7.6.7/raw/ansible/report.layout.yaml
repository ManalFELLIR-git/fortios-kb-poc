id: report.layout
version: 7.6.7
source_object: fortios_report_layout
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_report_layout.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Report layout name.
  title:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Report title.
  subtitle:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Report subtitle.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  style_theme:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Report style theme.
  options:
    type: enum
    raw_type: list
    choices:
    - include-table-of-content
    - auto-numbering-heading
    - view-chart-as-heading
    - show-html-navbar-before-heading
    - dummy-option
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Report layout options.
  format:
    type: enum
    raw_type: list
    choices:
    - pdf
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Report format.
  schedule_type:
    type: enum
    raw_type: string
    choices:
    - demand
    - daily
    - weekly
    version_ranges:
    - - v6.0.0
      - ''
    description: Report schedule type.
  day:
    type: enum
    raw_type: string
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule days of week to generate report.
  time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule time to generate report (format = hh:mm).
  cutoff_option:
    type: enum
    raw_type: string
    choices:
    - run-time
    - custom
    version_ranges:
    - - v6.0.0
      - ''
    description: Cutoff-option is either run-time or custom.
  cutoff_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom cutoff time to generate report (format = hh:mm).
  email_send:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending emails after reports are generated.
  email_recipients:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Email recipients for generated reports.
  max_pdf_report:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of PDF reports to keep at one time (oldest report is overwritten).
  page:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure report page.
    children:
      paper:
        type: enum
        raw_type: string
        choices:
        - a4
        - letter
        version_ranges:
        - - v6.0.0
          - ''
        description: Report page paper.
      column_break_before:
        type: enum
        raw_type: list
        choices:
        - heading1
        - heading2
        - heading3
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Report page auto column break before heading.
      page_break_before:
        type: enum
        raw_type: list
        choices:
        - heading1
        - heading2
        - heading3
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Report page auto page break before heading.
      options:
        type: enum
        raw_type: list
        choices:
        - header-on-first-page
        - footer-on-first-page
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Report page options.
      header:
        type: object
        raw_type: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure report page header.
        children:
          style:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Report header style.
          header_item:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: Configure report header item.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item ID. see <a href='#notes'>Notes</a>.
              description:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Description.
              type:
                type: enum
                raw_type: string
                choices:
                - text
                - image
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item type.
              style:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item style.
              content:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item text content.
              img_src:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item image file name.
      footer:
        type: object
        raw_type: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure report page footer.
        children:
          style:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Report footer style.
          footer_item:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: Configure report footer item.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item ID. see <a href='#notes'>Notes</a>.
              description:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Description.
              type:
                type: enum
                raw_type: string
                choices:
                - text
                - image
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item type.
              style:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item style.
              content:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item text content.
              img_src:
                type: string
                raw_type: string
                version_ranges:
                - - v6.0.0
                  - ''
                description: Report item image file name.
  body_item:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure report body item.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item ID. see <a href='#notes'>Notes</a>.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Description.
      type:
        type: enum
        raw_type: string
        choices:
        - text
        - image
        - chart
        - misc
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item type.
      style:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item style.
      top_n:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Value of top.
      parameters:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Parameters.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: ID. see <a href='#notes'>Notes</a>.
          name:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Field name that match field of parameters defined in dataset.
          value:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Value to replace corresponding field of parameters defined in dataset.
      text_component:
        type: enum
        raw_type: string
        choices:
        - text
        - heading1
        - heading2
        - heading3
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item text component.
      content:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item text content.
      img_src:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item image file name.
      chart:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item chart name.
      chart_options:
        type: enum
        raw_type: list
        choices:
        - include-no-data
        - hide-title
        - show-caption
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Report chart options.
      misc_component:
        type: enum
        raw_type: string
        choices:
        - hline
        - page-break
        - column-break
        - section-start
        version_ranges:
        - - v6.0.0
          - ''
        description: Report item miscellaneous component.
      title:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Report section title.
