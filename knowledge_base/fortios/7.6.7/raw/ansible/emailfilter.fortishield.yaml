id: emailfilter.fortishield
version: 7.6.7
source_object: fortios_emailfilter_fortishield
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_emailfilter_fortishield.py
root_type: object
attributes:
  spam_submit_srv:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Hostname of the spam submission server.
  spam_submit_force:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable force insertion of a new mime entity for the submission text.
  spam_submit_txt2htm:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable conversion of text email to HTML email.
