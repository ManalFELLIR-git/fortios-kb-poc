id: switch-controller.traffic-policy
version: 7.6.7
source_object: fortios_switch_controller_traffic_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_traffic_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Traffic policy name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Description of the traffic policy.
  policer_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable policer config on the traffic policy.
  guaranteed_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Guaranteed bandwidth in kbps (max value = 524287000).
  guaranteed_burst:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Guaranteed burst size in bytes (max value = 4294967295).
  maximum_burst:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Maximum burst size in bytes (max value = 4294967295).
  cos_queue:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: COS queue(0 - 7), or unset to disable.
