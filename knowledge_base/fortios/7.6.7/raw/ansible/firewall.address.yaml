id: firewall.address
version: 7.6.7
source_object: fortios_firewall_address
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_address.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Address name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  fabric_object:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Security Fabric global object setting.
  subnet:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address and subnet mask of address.
  type:
    type: enum
    raw_type: string
    choices:
    - ipmask
    - iprange
    - fqdn
    - geography
    - wildcard
    - dynamic
    - interface-subnet
    - mac
    - route-tag
    version_ranges:
    - - v6.0.0
      - ''
    description: Type of address.
  route_tag:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: route-tag address.
  sub_type:
    type: enum
    raw_type: string
    choices:
    - sdn
    - clearpass-spt
    - fsso
    - rsso
    - ems-tag
    - fortivoice-tag
    - fortinac-tag
    - swc-tag
    - device-identification
    - external-resource
    - telemetry
    - obsolete
    version_ranges:
    - - v6.2.0
      - ''
    description: Sub-type of address.
  clearpass_spt:
    type: enum
    raw_type: string
    choices:
    - unknown
    - healthy
    - quarantine
    - checkup
    - transient
    - infected
    version_ranges:
    - - v6.2.0
      - ''
    description: SPT (System Posture Token) value.
  macaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Multiple MAC address ranges.
    children:
      macaddr:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: MAC address ranges <start>[-<end>] separated by space.
  start_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: First IP address (inclusive) in the range for the address.
  end_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Final IP address (inclusive) in the range for the address.
  fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Fully Qualified Domain Name address.
  country:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP addresses associated to a specific country.
  wildcard_fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Fully Qualified Domain Name with wildcard characters.
  cache_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Defines the minimal TTL of individual IP addresses in FQDN cache measured in seconds.
  wildcard:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address and wildcard netmask.
  sdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SDN. Source system.sdn-connector.name.
    references:
    - system.sdn-connector.name
  fsso_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: FSSO group(s).
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: FSSO group name. Source user.adgrp.name.
        references:
        - user.adgrp.name
  sso_attribute_value:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: RADIUS attributes value.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: RADIUS attribute value.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Name of interface whose IP address is to be used. Source system.interface.name.
    references:
    - system.interface.name
  tenant:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Tenant.
  organization:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Organization domain name (Syntax: organization/domain).'
  epg_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Endpoint group name.
  subnet_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Subnet name.
  sdn_tag:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SDN Tag.
  policy_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy group name.
  obj_tag:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Tag of dynamic address object.
  obj_type:
    type: enum
    raw_type: string
    choices:
    - ip
    - mac
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Object type.
  tag_detection_level:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.4
      - ''
    description: Tag detection level of dynamic address object.
  tag_type:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.4
      - ''
    description: Tag type of dynamic address object.
  hw_vendor:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Dynamic address matching hardware vendor.
  os:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Dynamic address matching operating system.
  sw_version:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Dynamic address matching software version.
  agent_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Telemetry agent id. Source telemetry-controller.agent.agent-id.
    references:
    - telemetry-controller.agent.agent-id
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  associated_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Network interface associated with address. Source system.interface.name system.zone.name.
    references:
    - system.interface.name
    - system.zone.name
  color:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Color of icon on the GUI.
  filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Match criteria filter.
  sdn_addr_type:
    type: enum
    raw_type: string
    choices:
    - private
    - public
    - all
    version_ranges:
    - - v6.2.0
      - ''
    description: Type of addresses to collect.
  node_ip_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable collection of node addresses only in Kubernetes.
  obj_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Object ID for NSX.
  list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address list.
    children:
      ip:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP.
  tagging:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Config object tagging.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Tagging entry name.
      category:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Tag category. Source system.object-tagging.category.
        references:
        - system.object-tagging.category
      tags:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Tags.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Tag name. Source system.object-tagging.tags.name.
            references:
            - system.object-tagging.tags.name
  allow_routing:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of this address in routing configurations.
  passive_fqdn_learning:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.5
      - ''
    description: Enable/disable passive learning of FQDNs.  When enabled, the FortiGate learns, trusts, and saves FQDNs from
      endpoint DNS queries .
  hw_model:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - v7.6.7
    description: Dynamic address matching hardware model.
