id: firewall.multicast-address
version: 7.6.7
source_object: fortios_firewall_multicast_address
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_multicast_address.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Multicast address name.
  type:
    type: enum
    raw_type: string
    choices:
    - multicastrange
    - broadcastmask
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Type of address object: multicast IP address range or broadcast IP/mask to be treated as a multicast address.'
  subnet:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Broadcast address and subnet.
  start_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: First IPv4 address (inclusive) in the range for the address.
  end_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Final IPv4 address (inclusive) in the range for the address.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  associated_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface associated with the address object. When setting up a policy, only addresses associated with this
      interface are available. Source system.interface.name.
    references:
    - system.interface.name
  color:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value to determine the color of the icon in the GUI (1 - 32).
  tagging:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Config object tagging.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Tagging entry name.
      category:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Tag category. Source system.object-tagging.category.
        references:
        - system.object-tagging.category
      tags:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Tags.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Tag name. Source system.object-tagging.tags.name.
            references:
            - system.object-tagging.tags.name
