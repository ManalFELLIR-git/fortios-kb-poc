id: vpn.ipsec.phase1
version: 7.6.7
source_object: fortios_vpn_ipsec_phase1
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_phase1.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPsec remote gateway name.
  type:
    type: enum
    raw_type: string
    choices:
    - static
    - dynamic
    - ddns
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote gateway type.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local physical, aggregate, loopback, or VLAN outgoing interface. Source system.interface.name.
    references:
    - system.interface.name
  ike_version:
    type: enum
    raw_type: string
    choices:
    - '1'
    - '2'
    version_ranges:
    - - v6.0.0
      - ''
    description: IKE protocol version.
  remote_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote VPN gateway.
  local_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local VPN gateway.
  remotegw_ddns:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name of remote gateway. For example, name.ddns.com.
  keylife:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time to wait in seconds before phase 1 encryption key expires.
  certificate:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of up to 4 signed personal certificates.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Certificate name. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  authmethod:
    type: enum
    raw_type: string
    choices:
    - psk
    - signature
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication method.
  authmethod_remote:
    type: enum
    raw_type: string
    choices:
    - psk
    - signature
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication method (remote side).
  mode:
    type: enum
    raw_type: string
    choices:
    - aggressive
    - main
    version_ranges:
    - - v6.0.0
      - ''
    description: ID protection mode used to establish a secure channel.
  peertype:
    type: enum
    raw_type: string
    choices:
    - any
    - one
    - dialup
    - peer
    - peergrp
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept this peer type.
  peerid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept this peer identity.
  usrgrp:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User group name for dialup peers. Source user.group.name.
    references:
    - user.group.name
  peer:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept this peer certificate. Source user.peer.name.
    references:
    - user.peer.name
  peergrp:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept this peer certificate group. Source user.peergrp.name.
    references:
    - user.peergrp.name
  mode_cfg:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable configuration method.
  mode_cfg_allow_client_selector:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable mode-cfg client to use custom phase2 selectors.
  assign_ip:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable assignment of IP to IPsec interface via configuration method.
  assign_ip_from:
    type: enum
    raw_type: string
    choices:
    - range
    - usrgrp
    - dhcp
    - name
    version_ranges:
    - - v6.0.0
      - ''
    description: Method by which the IP address will be assigned.
  ipv4_start_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Start of IPv4 range.
  ipv4_end_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: End of IPv4 range.
  ipv4_netmask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 Netmask.
  dhcp_ra_giaddr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Relay agent gateway IP address to use in the giaddr field of DHCP requests.
  dhcp6_ra_linkaddr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Relay agent IPv6 link address to use in DHCP6 requests.
  dns_mode:
    type: enum
    raw_type: string
    choices:
    - manual
    - auto
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS server mode.
  ipv4_dns_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 DNS server 1.
  ipv4_dns_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 DNS server 2.
  ipv4_dns_server3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 DNS server 3.
  internal_domain_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: One or more internal domain names in quotes separated by spaces.
    children:
      domain_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: Domain name.
  dns_suffix_search:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: One or more DNS domain name suffixes in quotes separated by spaces.
    children:
      dns_suffix:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: DNS suffix.
  ipv4_wins_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WINS server 1.
  ipv4_wins_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WINS server 2.
  ipv4_exclude_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration Method IPv4 exclude ranges.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Start of IPv4 exclusive range.
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: End of IPv4 exclusive range.
  ipv4_split_include:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 split-include subnets. Source firewall.address.name firewall.addrgrp.name.
    references:
    - firewall.address.name
    - firewall.addrgrp.name
  split_include_service:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Split-include services. Source firewall.service.group.name firewall.service.custom.name.
    references:
    - firewall.service.custom.name
    - firewall.service.group.name
  ipv4_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address name. Source firewall.address.name firewall.addrgrp.name.
    references:
    - firewall.address.name
    - firewall.addrgrp.name
  ipv6_start_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Start of IPv6 range.
  ipv6_end_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: End of IPv6 range.
  ipv6_prefix:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 prefix.
  ipv6_dns_server1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 DNS server 1.
  ipv6_dns_server2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 DNS server 2.
  ipv6_dns_server3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 DNS server 3.
  ipv6_exclude_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration method IPv6 exclude ranges.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Start of IPv6 exclusive range.
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: End of IPv6 exclusive range.
  ipv6_split_include:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 split-include subnets. Source firewall.address6.name firewall.addrgrp6.name.
    references:
    - firewall.address6.name
    - firewall.addrgrp6.name
  ipv6_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address name. Source firewall.address6.name firewall.addrgrp6.name.
    references:
    - firewall.address6.name
    - firewall.addrgrp6.name
  ip_delay_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.1
      - ''
    description: IP address reuse delay interval in seconds (0 - 28800).
  unity_support:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable support for Cisco UNITY Configuration Method extensions.
  domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Instruct unity clients about the single default DNS domain.
  banner:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Message that unity client should display after connecting.
  include_local_lan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allow local LAN access on unity clients.
  ipv4_split_exclude:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 subnets that should not be sent over the IPsec tunnel. Source firewall.address.name firewall.addrgrp.name.
    references:
    - firewall.address.name
    - firewall.addrgrp.name
  ipv6_split_exclude:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 subnets that should not be sent over the IPsec tunnel. Source firewall.address6.name firewall.addrgrp6.name.
    references:
    - firewall.address6.name
    - firewall.addrgrp6.name
  save_password:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable saving XAuth username and password on VPN clients.
  client_auto_negotiate:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the VPN client to bring up the tunnel when there is no traffic.
  client_keep_alive:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the VPN client to keep the tunnel up when there is no traffic.
  backup_gateway:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Instruct unity clients about the backup gateway address(es).
    children:
      address:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address of backup gateway.
  proposal:
    type: enum
    raw_type: list
    choices:
    - des-md5
    - des-sha1
    - des-sha256
    - des-sha384
    - des-sha512
    - 3des-md5
    - 3des-sha1
    - 3des-sha256
    - 3des-sha384
    - 3des-sha512
    - aes128-md5
    - aes128-sha1
    - aes128-sha256
    - aes128-sha384
    - aes128-sha512
    - aes128gcm-prfsha1
    - aes128gcm-prfsha256
    - aes128gcm-prfsha384
    - aes128gcm-prfsha512
    - aes192-md5
    - aes192-sha1
    - aes192-sha256
    - aes192-sha384
    - aes192-sha512
    - aes256-md5
    - aes256-sha1
    - aes256-sha256
    - aes256-sha384
    - aes256-sha512
    - aes256gcm-prfsha1
    - aes256gcm-prfsha256
    - aes256gcm-prfsha384
    - aes256gcm-prfsha512
    - chacha20poly1305-prfsha1
    - chacha20poly1305-prfsha256
    - chacha20poly1305-prfsha384
    - chacha20poly1305-prfsha512
    - aria128-md5
    - aria128-sha1
    - aria128-sha256
    - aria128-sha384
    - aria128-sha512
    - aria192-md5
    - aria192-sha1
    - aria192-sha256
    - aria192-sha384
    - aria192-sha512
    - aria256-md5
    - aria256-sha1
    - aria256-sha256
    - aria256-sha384
    - aria256-sha512
    - seed-md5
    - seed-sha1
    - seed-sha256
    - seed-sha384
    - seed-sha512
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase1 proposal.
  add_route:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable control addition of a route to peer destination selector.
  add_gw_route:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable automatically add a route to the remote gateway.
  psksecret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-shared secret for PSK authentication (ASCII string or hexadecimal encoded with a leading 0x).
  psksecret_remote:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-shared secret for remote side PSK authentication (ASCII string or hexadecimal encoded with a leading
      0x).
  keepalive:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
