  distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance for routes added by IKE (1 - 255).
  priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Priority for routes added by IKE (1 - 65535).
  localid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local ID.
  localid_type:
    type: enum
    raw_type: string
    choices:
    - auto
    - fqdn
    - user-fqdn
    - keyid
    - address
    - asn1dn
    version_ranges:
    - - v6.0.0
      - ''
    description: Local ID type.
  auto_negotiate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
