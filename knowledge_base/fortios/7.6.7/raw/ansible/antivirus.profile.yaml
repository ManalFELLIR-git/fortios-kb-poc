id: antivirus.profile
version: 7.6.7
source_object: fortios_antivirus_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_antivirus_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  replacemsg_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Replacement message group customized for this profile. Source system.replacemsg-group.name.
    references:
    - system.replacemsg-group.name
  feature_set:
    type: enum
    raw_type: string
    choices:
    - flow
    - proxy
    version_ranges:
    - - v6.4.0
      - ''
    description: Flow/proxy feature set.
  fortisandbox_mode:
    type: enum
    raw_type: string
    choices:
    - inline
    - analytics-suspicious
    - analytics-everything
    version_ranges:
    - - v7.2.0
      - ''
    description: FortiSandbox scan modes.
  fortisandbox_max_upload:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Maximum size of files that can be uploaded to FortiSandbox in Mbytes.
  analytics_ignore_filetype:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Do not submit files matching this DLP file-pattern to FortiSandbox (post-transfer scan only). Source dlp.filepattern.id.
    references:
    - dlp.filepattern.id
  analytics_accept_filetype:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Only submit files matching this DLP file-pattern to FortiSandbox (post-transfer scan only). Source dlp.filepattern.id.
    references:
    - dlp.filepattern.id
  analytics_db:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using the FortiSandbox signature database to supplement the AV signature databases.
  mobile_malware_db:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using the mobile malware signature database.
  http:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure HTTP AntiVirus options.
    children:
      av_scan:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v7.0.0
          - ''
        description: Enable/disable AntiVirus scan service.
      outbreak_prevention:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable virus outbreak prevention service.
      external_blocklist:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v7.0.0
          - ''
        description: Enable/disable external-blocklist. Analyzes files including the content of archives.
      malware_stream:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v7.6.3
          - ''
        description: Enable/disable 0-day malware-stream scanning. Analyzes files including the content of archives.
      fortindr:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v7.0.8
          - ''
        description: Enable/disable scanning of files by FortiNDR.
      fortisandbox:
        type: enum
        raw_type: string
        choices:
        - disable
        - block
        - monitor
        version_ranges:
        - - v7.2.0
          - ''
        description: Enable/disable scanning of files by FortiSandbox.
      quarantine:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.0.0
          - ''
        description: Enable/disable quarantine for infected files.
      archive_block:
        type: enum
        raw_type: list
        choices:
        - encrypted
        - corrupted
        - partiallycorrupted
        - multipart
        - nested
        - mailbomb
        - timeout
        - unhandled
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Select the archive types to block.
      archive_log:
        type: enum
        raw_type: list
        choices:
        - encrypted
        - corrupted
        - partiallycorrupted
        - multipart
        - nested
        - mailbomb
        - timeout
        - unhandled
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Select the archive types to log.
      emulator:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable the virus emulator.
      content_disarm:
