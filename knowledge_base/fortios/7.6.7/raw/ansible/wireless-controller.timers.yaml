id: wireless-controller.timers
version: 7.6.7
source_object: fortios_wireless_controller_timers
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_timers.py
root_type: object
attributes:
  echo_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between echo requests sent by the managed WTP, AP, or FortiAP (1 - 255 sec).
  nat_session_keep_alive:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Maximal time in seconds between control requests sent by the managed WTP, AP, or FortiAP (0 - 255 sec).
  discovery_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between discovery requests (2 - 180 sec).
  client_idle_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time after which a client is considered idle and times out (20 - 3600 sec).
  client_idle_rehome_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Time after which a client is considered idle and disconnected from the home controller (2 - 3600 sec).
  auth_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.6
      - ''
    description: Time after which a client is considered failed in RADIUS authentication and times out (5 - 30 sec).
  rogue_ap_log:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between logging rogue AP messages if periodic rogue AP logging is configured (0 - 1440 min).
  fake_ap_log:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between recording logs about fake APs if periodic fake AP logging is configured (1 - 1440 min).
  sta_offline_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Time period in seconds to keep station offline data after it is gone .
  sta_offline_ip2mac_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Time period in seconds to keep station offline Ip2mac data after it is gone .
  sta_cap_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Time period in minutes to keep station capability data after it is gone .
  rogue_ap_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.6
      - ''
    description: Time period in minutes to keep rogue AP after it is gone .
  rogue_sta_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Time period in minutes to keep rogue station after it is gone .
  wids_entry_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Time period in minutes to keep wids entry after it is gone .
  ble_device_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Time period in minutes to keep BLE device after it is gone .
  sta_stats_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running client (station) reports (1 - 255 sec).
  vap_stats_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running Virtual Access Point (VAP) reports (1 - 255 sec).
  radio_stats_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running radio reports (1 - 255 sec).
  sta_capability_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running station capability reports (1 - 255 sec).
  sta_locate_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running client presence flushes to remove clients that are listed but no longer present (0 -
      86400 sec).
  ipsec_intf_cleanup:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time period to keep IPsec VPN interfaces up after WTP sessions are disconnected (30 - 3600 sec).
  ble_scan_report_intv:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time between running Bluetooth Low Energy (BLE) reports (10 - 3600 sec).
  drma_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: Dynamic radio mode assignment (DRMA) schedule interval in minutes (1 - 1440).
  ap_reboot_wait_interval1:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Time in minutes to wait before AP reboots when there is no controller detected (5 - 65535).
  ap_reboot_wait_time:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Time to reboot the AP when there is no controller detected and standalone SSIDs are pushed to the AP in the
      previous session, format hh :mm.
  ap_reboot_wait_interval2:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Time in minutes to wait before AP reboots when there is no controller detected and standalone SSIDs are pushed
      to the AP in the previous session (5 - 65535).
