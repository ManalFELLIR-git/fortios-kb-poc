id: dlp.filepattern
version: 7.6.7
source_object: fortios_dlp_filepattern
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_dlp_filepattern.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of table containing the file pattern list.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure file patterns used by DLP blocking.
    children:
      filter_type:
        type: enum
        raw_type: string
        choices:
        - pattern
        - type
        version_ranges:
        - - v6.0.0
          - ''
        description: Filter by file name pattern or by file type.
      pattern:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Add a file name pattern.
      file_type:
        type: enum
        raw_type: string
        choices:
        - 7z
        - arj
        - cab
        - lzh
        - rar
        - tar
        - zip
        - bzip
        - gzip
        - bzip2
        - xz
        - bat
        - uue
        - mime
        - base64
        - binhex
        - elf
        - exe
        - dll
        - jnlp
        - hta
        - html
        - jad
        - class
        - cod
        - javascript
        - msoffice
        - msofficex
        - fsg
        - upx
        - petite
        - aspack
        - sis
        - hlp
        - activemime
        - jpeg
        - gif
        - tiff
        - png
        - bmp
        - unknown
        - mpeg
        - mov
        - mp3
        - wma
        - wav
        - pdf
        - avi
        - rm
        - torrent
        - hibun
        - msi
        - mach-o
        - dmg
        - .net
        - xar
        - chm
        - iso
        - crx
        - flac
        - registry
        - hwp
        - rpm
        - genscript
        - python
        - c/cpp
        - pfile
        - lzip
        - wasm
        - sylk
        - shellscript
        version_ranges:
        - - v6.0.0
          - ''
        description: Select a file type.
