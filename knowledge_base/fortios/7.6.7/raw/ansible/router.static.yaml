id: router.static
version: 7.6.7
source_object: fortios_router_static
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_static.py
root_type: list
attributes:
  seq_num:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Sequence number. see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this static route.
  dst:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination IP and mask for this route.
  src:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source prefix for this route.
  gateway:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway IP for this route.
  preferred_source:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Preferred source IP for this route.
  distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative distance (1 - 255).
  weight:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative weight (0 - 255).
  priority:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative priority (1 - 65535).
  device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Gateway out interface or tunnel. Source system.interface.name.
    references:
    - system.interface.name
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  blackhole:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable black hole.
  dynamic_gateway:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable use of dynamic gateway retrieved from a DHCP or PPP server.
  sdwan_zone:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.1
      - ''
    description: Choose SD-WAN Zone.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.1
          - ''
        description: SD-WAN zone name. Source system.sdwan.zone.name.
        references:
        - system.sdwan.zone.name
  dstaddr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of firewall address or address group. Source firewall.address.name firewall.addrgrp.name.
    references:
    - firewall.address.name
    - firewall.addrgrp.name
  internet_service:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Application ID in the Internet Service database. Source firewall.internet-service.id.
    references:
    - firewall.internet-service.id
  internet_service_custom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Application name in the Internet Service custom database. Source firewall.internet-service-custom.name.
    references:
    - firewall.internet-service-custom.name
  internet_service_fortiguard:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Application name in the Internet Service FortiGuard database. Source firewall.internet-service-fortiguard.name.
    references:
    - firewall.internet-service-fortiguard.name
  link_monitor_exempt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable withdrawal of this static route when link monitor or health check is down.
  tag:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.4
      - ''
    description: Route tag.
  vrf:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual Routing Forwarding ID.
  bfd:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Bidirectional Forwarding Detection (BFD).
