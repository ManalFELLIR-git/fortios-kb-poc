id: firewall.ssh.local-key
version: 7.6.7
source_object: fortios_firewall_ssh_local_key
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ssh_local_key.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH proxy local key name.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password for SSH private key.
  private_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH proxy private key, encrypted with a password.
  public_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH proxy public key.
  source:
    type: enum
    raw_type: string
    choices:
    - built-in
    - user
    version_ranges:
    - - v6.0.0
      - ''
    description: SSH proxy local key source type.
