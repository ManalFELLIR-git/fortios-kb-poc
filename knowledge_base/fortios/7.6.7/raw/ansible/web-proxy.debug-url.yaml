id: web-proxy.debug-url
version: 7.6.7
source_object: fortios_web_proxy_debug_url
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_web_proxy_debug_url.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Debug URL name.
  url_pattern:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL exemption pattern.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this URL exemption.
  exact:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable matching the exact path.
