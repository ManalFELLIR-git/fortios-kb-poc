id: emailfilter.profile
version: 7.6.7
source_object: fortios_emailfilter_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_emailfilter_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  feature_set:
    type: enum
    raw_type: string
    choices:
    - flow
    - proxy
    version_ranges:
    - - v6.4.0
      - ''
    description: Flow/proxy feature set.
  replacemsg_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Replacement message group. Source system.replacemsg-group.name.
    references:
    - system.replacemsg-group.name
  spam_log:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable spam logging for email filtering.
  spam_log_fortiguard_response:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable logging FortiGuard spam response.
  spam_filtering:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable spam filtering.
  external:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable external Email inspection.
  options:
    type: enum
    raw_type: list
    choices:
    - bannedword
    - spambal
    - spamfsip
    - spamfssubmit
    - spamfschksum
    - spamfsurl
    - spamhelodns
    - spamraddrdns
    - spamrbl
    - spamhdrcheck
    - spamfsphish
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: Options.
  imap:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: IMAP.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - tag
        version_ranges:
        - - v6.2.0
          - ''
        description: Action for spam email.
      tag_type:
        type: enum
        raw_type: list
        choices:
        - subject
        - header
        - spaminfo
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.2.0
          - ''
        description: Tag subject or header for spam email.
      tag_msg:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Subject text or header added to spam email.
  pop3:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: POP3.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - tag
        version_ranges:
        - - v6.2.0
          - ''
        description: Action for spam email.
      tag_type:
        type: enum
        raw_type: list
        choices:
        - subject
        - header
        - spaminfo
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.2.0
          - ''
        description: Tag subject or header for spam email.
      tag_msg:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Subject text or header added to spam email.
  smtp:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: SMTP.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - tag
        - discard
        version_ranges:
        - - v6.2.0
          - ''
        description: Action for spam email.
      tag_type:
        type: enum
        raw_type: list
        choices:
        - subject
        - header
        - spaminfo
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.2.0
          - ''
        description: Tag subject or header for spam email.
      tag_msg:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Subject text or header added to spam email.
      hdrip:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable SMTP email header IP checks for spamfsip, spamrbl, and spambal filters.
      local_override:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable local filter to override SMTP remote check result.
  mapi:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: MAPI.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
      action:
        type: enum
        raw_type: string
        choices:
        - pass
        - discard
        version_ranges:
        - - v6.2.0
          - ''
        description: Action for spam email.
  msn_hotmail:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: MSN Hotmail.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
  yahoo_mail:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Yahoo! Mail.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
  gmail:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Gmail.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
  other_webmails:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Other supported webmails.
    children:
      log_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable logging of all email traffic.
  spam_bword_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Spam banned word threshold.
  spam_bword_table:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Anti-spam banned word table ID. Source emailfilter.bword.id.
    references:
    - emailfilter.bword.id
  spam_bal_table:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Anti-spam block/allow list table ID. Source emailfilter.block-allow-list.id.
    references:
    - emailfilter.block-allow-list.id
  spam_mheader_table:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Anti-spam MIME header table ID. Source emailfilter.mheader.id.
    references:
    - emailfilter.mheader.id
  spam_rbl_table:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Anti-spam DNSBL table ID. Source emailfilter.dnsbl.id.
    references:
    - emailfilter.dnsbl.id
  spam_iptrust_table:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Anti-spam IP trust table ID. Source emailfilter.iptrust.id.
    references:
    - emailfilter.iptrust.id
