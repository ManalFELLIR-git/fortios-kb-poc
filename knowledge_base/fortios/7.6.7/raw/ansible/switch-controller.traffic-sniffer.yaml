id: switch-controller.traffic-sniffer
version: 7.6.7
source_object: fortios_switch_controller_traffic_sniffer
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_traffic_sniffer.py
root_type: object
attributes:
  mode:
    type: enum
    raw_type: string
    choices:
    - erspan-auto
    - rspan
    - none
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure traffic sniffer mode.
  erspan_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure ERSPAN collector IP address.
  target_mac:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Sniffer MACs to filter.
    children:
      mac:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Sniffer MAC.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Description for the sniffer MAC.
  target_ip:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Sniffer IPs to filter.
    children:
      ip:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Sniffer IP.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Description for the sniffer IP.
  target_port:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Sniffer ports to filter.
    children:
      switch_id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Managed-switch ID. Source switch-controller.managed-switch.switch-id.
        references:
        - switch-controller.managed-switch.switch-id
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Description for the sniffer port entry.
      in_ports:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Configure source ingress port interfaces.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Interface name.
      out_ports:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Configure source egress port interfaces.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Interface name.
