id: wireless-controller.wtp-profile
version: 7.6.7
source_object: fortios_wireless_controller_wtp_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_wtp_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP (or FortiAP or AP) profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  platform:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP, FortiAP, or AP platform.
    children:
      type:
        type: enum
        raw_type: string
        choices:
        - AP-11N
        - 421E
        - 423E
        - 221E
        - 223E
        - 431F
        - 431FL
        - 432F
        - 432FR
        - 433F
        - 433FL
        - 231F
        - 231FL
        - 234F
        - 23JF
        - 831F
        - 231G
        - 233G
        - 234G
        - 431G
        - 432G
        - 433G
        - 221K
        - 231K
        - 231KD
        - 23JK
        - 222KL
        - 241K
        - 243K
        - 244K
        - 441K
        - 435K
        - 443K
        - U431F
        - U433F
        - U231F
        - U234F
        - U432F
        - U231G
        - MVP
        - C24JE
        - 222E
        - 224E
        - 231E
        - 321E
        - U421E
        - U422EV
        - U423E
        - U221EV
        - U223EV
        - U24JEV
        - U321EV
        - U323EV
        version_ranges:
        - - v6.0.0
          - ''
        description: WTP, FortiAP or AP platform type. There are built-in WTP profiles for all supported FortiAP models. You
          can select a built-in profile and customize it or create a new profile.
      mode:
        type: enum
        raw_type: string
        choices:
        - single-5G
        - dual-5G
        version_ranges:
        - - v6.2.0
          - ''
        description: Configure operation mode of 5G radios .
      ddscan:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.2.0
          - v6.2.0
        - - v6.2.5
          - ''
        description: Enable/disable use of one radio for dedicated full-band scanning to detect RF characterization and wireless
          threat management.
  unii_4_5ghz_band:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable UNII-4 5Ghz band channels .
  control_message_offload:
    type: enum
    raw_type: list
    choices:
    - ebp-frame
    - aeroscout-tag
    - ap-list
    - sta-list
    - sta-cap-list
    - stats
    - aeroscout-mu
    - sta-health
    - spectral-analysis
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable CAPWAP control message data channel offload.
  bonjour_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Bonjour profile name. Source wireless-controller.bonjour-profile.name.
    references:
    - wireless-controller.bonjour-profile.name
  apcfg_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: AP local configuration profile name. Source wireless-controller.apcfg-profile.name.
    references:
    - wireless-controller.apcfg-profile.name
  apcfg_mesh:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable AP local mesh configuration .
  apcfg_mesh_ap_type:
    type: enum
    raw_type: string
    choices:
    - ethernet
    - mesh
    - auto
    version_ranges:
    - - v7.6.4
      - ''
    description: Mesh AP Type .
  apcfg_mesh_ssid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Mesh SSID . Source wireless-controller.vap.name.
    references:
    - wireless-controller.vap.name
  apcfg_mesh_eth_bridge:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable mesh ethernet bridge .
  ble_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Bluetooth Low Energy profile name. Source wireless-controller.ble-profile.name.
    references:
    - wireless-controller.ble-profile.name
  lw_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: LoRaWAN profile name. Source wireless-controller.lw-profile.name.
    references:
    - wireless-controller.lw-profile.name
  syslog_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: System log server configuration profile name. Source wireless-controller.syslog-profile.name.
    references:
    - wireless-controller.syslog-profile.name
  wan_port_mode:
    type: enum
    raw_type: string
    choices:
    - wan-lan
    - wan-only
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using a WAN port as a LAN port.
  lan:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP LAN port mapping.
    children:
      port_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port mode.
      port_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port1_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 1 mode.
      port1_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 1 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port2_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 2 mode.
      port2_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 2 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port3_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 3 mode.
      port3_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 3 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port4_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 4 mode.
      port4_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 4 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port5_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 5 mode.
      port5_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 5 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port6_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 6 mode.
      port6_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 6 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port7_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 7 mode.
      port7_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 7 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port8_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 8 mode.
      port8_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 8 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port_esl_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: ESL port mode.
      port_esl_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Bridge ESL port to SSID. Source system.interface.name.
        references:
        - system.interface.name
  energy_efficient_ethernet:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of energy efficient Ethernet on WTP.
  led_state:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of LEDs on WTP .
  led_schedules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Recurring firewall schedules for illuminating LEDs on the FortiAP. If led-state is enabled, LEDs will be
      visible when at least one of the schedules is valid. Separate multiple schedule names with a space.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Schedule name. Source firewall.schedule.group.name firewall.schedule.recurring.name firewall.schedule.onetime.name.
        references:
        - firewall.schedule.group.name
        - firewall.schedule.onetime.name
        - firewall.schedule.recurring.name
  dtls_policy:
    type: enum
    raw_type: list
    choices:
    - clear-text
    - dtls-enabled
    - ipsec-vpn
    - ipsec-sn-vpn
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP data channel DTLS policy .
  dtls_in_kernel:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable data channel DTLS in kernel.
  max_clients:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of stations (STAs) supported by the WTP .
  handoff_rssi:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum received signal strength indicator (RSSI) value for handoff (20 - 30).
  handoff_sta_thresh:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Threshold value for AP handoff.
  handoff_roaming:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable client load balancing during roaming to avoid roaming delay .
  deny_mac_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: List of MAC addresses that are denied access to this WTP, FortiAP, or AP.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      mac:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: A WiFi device with this MAC address is denied access to this WTP, FortiAP or AP.
  ap_country:
    type: enum
    raw_type: string
    choices:
    - --
    - AF
    - AL
    - DZ
    - AS
    - AO
    - AR
    - AM
    - AU
