    version_ranges:
    - - v6.0.0
      - ''
    description: Country in which this WTP, FortiAP, or AP will operate .
  ip_fragment_preventing:
    type: enum
    raw_type: list
    choices:
    - tcp-mss-adjust
    - icmp-unreachable
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Method(s) by which IP fragmentation is prevented for control and data packets through CAPWAP tunnel .
  tun_mtu_uplink:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The maximum transmission unit (MTU) of uplink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU
      of FortiAP; ).
  tun_mtu_downlink:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The MTU of downlink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU of FortiAP; ).
  split_tunneling_acl_path:
    type: enum
    raw_type: string
    choices:
    - tunnel
    - local
    version_ranges:
    - - v6.0.0
      - ''
    description: Split tunneling ACL path is local/tunnel.
  split_tunneling_acl_local_ap_subnet:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable automatically adding local subnetwork of FortiAP to split-tunneling ACL .
  split_tunneling_acl:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Split tunneling ACL filter list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      dest_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Destination IP and mask for the split-tunneling subnet.
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - https
    - ssh
    - snmp
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Control management access to the managed WTP, FortiAP, or AP. Separate entries with a space.
  login_passwd_change:
    type: enum
    raw_type: string
    choices:
    - 'yes'
    - default
    - 'no'
    version_ranges:
    - - v6.0.0
      - ''
    description: Change or reset the administrator password of a managed WTP, FortiAP or AP (yes, default, or no).
  login_passwd:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the managed WTP, FortiAP, or AP"s administrator password.
  lldp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Link Layer Discovery Protocol (LLDP) for the WTP, FortiAP, or AP .
  poe_mode:
    type: enum
    raw_type: string
    choices:
    - auto
    - 8023af
    - 8023at
    - power-adapter
    - full
    - high
    - low
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the WTP, FortiAP, or AP"s PoE mode.
  usb_port:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable USB port of the WTP .
  frequency_handoff:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable frequency handoff of clients to other channels .
  ap_handoff:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable AP handoff of clients to other APs .
  default_mesh_root:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Configure default mesh root SSID when it is not included by radio"s SSID configuration.
  indoor_outdoor_deployment:
    type: enum
    raw_type: string
    choices:
    - platform-determined
    - outdoor
    - indoor
    version_ranges:
    - - v7.0.1
      - ''
    description: Set to allow indoor/outdoor-only channels under regulatory rules .
  radio_1:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration options for radio 1.
    children:
      mode:
        type: enum
        raw_type: string
        choices:
        - disabled
        - ap
        - monitor
        - sniffer
        - sam
        version_ranges:
        - - v6.0.0
          - ''
        description: Mode of radio 1. Radio 1 can be disabled, configured as an access point, a rogue AP monitor, a sniffer,
          or a station.
      band:
        type: enum
        raw_type: list
        choices:
        - 802.11a
        - 802.11b
        - 802.11g
        - 802.11n-2G
        - 802.11n-5G
        - 802.11ac-2G
        - 802.11ac-5G
        - 802.11ax-2G
        - 802.11ax-5G
        - 802.11ax-6G
        - 802.11be-2G
        - 802.11be-5G
        - 802.11be-6G
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: WiFi band that Radio 1 operates on.
      band_5g_type:
        type: enum
        raw_type: string
        choices:
        - 5g-full
        - 5g-high
        - 5g-low
        version_ranges:
        - - v6.2.0
          - v6.2.0
        - - v6.2.5
          - ''
        description: WiFi 5G band type.
      drma:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.4
          - ''
        description: Enable/disable dynamic radio mode assignment (DRMA) .
