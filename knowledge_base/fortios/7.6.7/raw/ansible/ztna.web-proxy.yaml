id: ztna.web-proxy
version: 7.6.7
source_object: fortios_ztna_web_proxy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ztna_web_proxy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: ZTNA web proxy name.
  vip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual IP name. Source firewall.vip.name.
    references:
    - firewall.vip.name
  host:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual or real host name. Source firewall.access-proxy-virtual-host.name.
    references:
    - firewall.access-proxy-virtual-host.name
  decrypted_traffic_mirror:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Decrypted traffic mirror. Source firewall.decrypted-traffic-mirror.name.
    references:
    - firewall.decrypted-traffic-mirror.name
  vip6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual IPv6 name. Source firewall.vip6.name.
    references:
    - firewall.vip6.name
  api_gateway:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: Set IPv4 API Gateway.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: API Gateway ID. see <a href='#notes'>Notes</a>.
      url_map:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: URL pattern to match.
      service:
        type: enum
        raw_type: string
        choices:
        - http
        - https
        version_ranges:
        - - v7.6.1
          - ''
        description: Service.
      ldb_method:
        type: enum
        raw_type: string
        choices:
        - static
        - round-robin
        - weighted
        - first-alive
        - http-host
        version_ranges:
        - - v7.6.1
          - ''
        description: Method used to distribute sessions to real servers.
      url_map_type:
        type: enum
        raw_type: string
        choices:
        - sub-string
        - wildcard
        - regex
        version_ranges:
        - - v7.6.1
          - ''
        description: Type of url-map.
      h2_support:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: HTTP2 support, default=Enable.
      h3_support:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: HTTP3/QUIC support, default=Disable.
      quic:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: QUIC setting.
        children:
          max_idle_timeout:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Maximum idle timeout milliseconds (1 - 60000).
          max_udp_payload_size:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Maximum UDP payload size in bytes (1200 - 1500).
          active_connection_id_limit:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Active connection ID limit (1 - 8).
          ack_delay_exponent:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: ACK delay exponent (1 - 20).
          max_ack_delay:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Maximum ACK delay in milliseconds (1 - 16383).
          max_datagram_frame_size:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Maximum datagram frame size in bytes (1 - 1500).
          active_migration:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable/disable active migration .
          grease_quic_bit:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable/disable grease QUIC bit .
      realservers:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: Select the real servers that this ZTNA web-proxy will distribute traffic to.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.6.1
              - ''
            description: Real server ID. see <a href='#notes'>Notes</a>.
          addr_type:
            type: enum
            raw_type: string
            choices:
            - ip
            - fqdn
            version_ranges:
            - - v7.6.1
              - ''
            description: Type of address.
          address:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: Address or address group of the real server. Source firewall.address.name firewall.addrgrp.name.
            references:
            - firewall.address.name
            - firewall.addrgrp.name
          ip:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: IP address of the real server.
          port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Port for communicating with the real server.
          status:
            type: enum
            raw_type: string
            choices:
            - active
            - standby
            - disable
            version_ranges:
            - - v7.6.1
              - ''
            description: Set the status of the real server to active so that it can accept traffic, or on standby or disabled
              so no traffic is sent.
          weight:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Weight of the real server. If weighted load balancing is enabled, the server with the highest weight
              gets more connections.
          http_host:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: HTTP server domain name in HTTP header.
          health_check:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable to check the responsiveness of the real server before forwarding traffic.
          health_check_proto:
            type: enum
            raw_type: string
            choices:
            - ping
            - http
            - tcp-connect
            version_ranges:
            - - v7.6.1
              - ''
            description: Protocol of the health check monitor to use when polling to determine server"s connectivity status.
          holddown_interval:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable/disable holddown timer. Server will be considered active and reachable once the holddown period
              has expired (30 seconds).
          translate_host:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable/disable translation of hostname/IP from virtual server to real server.
          verify_cert:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.6.3
              - ''
            description: Enable/disable certificate verification of the real server.
      persistence:
        type: enum
        raw_type: string
        choices:
        - none
        - http-cookie
        version_ranges:
        - - v7.6.1
          - ''
        description: Configure how to make sure that clients connect to the same server every time they make a request that
          is part of the same session.
      http_cookie_domain_from_host:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable use of HTTP cookie domain from host field in HTTP.
      http_cookie_domain:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: Domain that HTTP cookie persistence should apply to.
      http_cookie_path:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: Limit HTTP cookie persistence to the specified path.
      http_cookie_generation:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: Generation of HTTP cookie to be accepted. Changing invalidates all existing cookies.
      http_cookie_age:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: Time in minutes that client web browsers should keep a cookie. Default is 60 minutes. 0 = no time limit.
      http_cookie_share:
        type: enum
        raw_type: string
        choices:
        - disable
        - same-ip
        version_ranges:
        - - v7.6.1
          - ''
        description: Control sharing of cookies across API Gateway. Use of same-ip means a cookie from one virtual server
          can be used by another. Disable stops cookie sharing.
      https_cookie_secure:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable verification that inserted HTTPS cookies are secure.
      ssl_dh_bits:
        type: enum
        raw_type: string
        choices:
        - '768'
        - '1024'
        - '1536'
        - '2048'
        - '3072'
        - '4096'
        version_ranges:
        - - v7.6.1
          - ''
        description: Number of bits to use in the Diffie-Hellman exchange for RSA encryption of SSL sessions.
      ssl_algorithm:
        type: enum
        raw_type: string
        choices:
        - high
        - medium
        - low
        version_ranges:
        - - v7.6.1
          - ''
        description: Permitted encryption algorithms for the server side of SSL full mode sessions according to encryption
          strength.
      ssl_cipher_suites:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: SSL/TLS cipher suites to offer to a server, ordered by priority.
        children:
          priority:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.6.1
              - ''
            description: SSL/TLS cipher suites priority. see <a href='#notes'>Notes</a>.
          cipher:
            type: enum
            raw_type: string
            choices:
            - TLS-AES-128-GCM-SHA256
            - TLS-AES-256-GCM-SHA384
            - TLS-CHACHA20-POLY1305-SHA256
            - TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256
            - TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256
            - TLS-DHE-RSA-WITH-CHACHA20-POLY1305-SHA256
            - TLS-DHE-RSA-WITH-AES-128-CBC-SHA
            - TLS-DHE-RSA-WITH-AES-256-CBC-SHA
            - TLS-DHE-RSA-WITH-AES-128-CBC-SHA256
            - TLS-DHE-RSA-WITH-AES-128-GCM-SHA256
            - TLS-DHE-RSA-WITH-AES-256-CBC-SHA256
            - TLS-DHE-RSA-WITH-AES-256-GCM-SHA384
            - TLS-DHE-DSS-WITH-AES-128-CBC-SHA
            - TLS-DHE-DSS-WITH-AES-256-CBC-SHA
            - TLS-DHE-DSS-WITH-AES-128-CBC-SHA256
            - TLS-DHE-DSS-WITH-AES-128-GCM-SHA256
            - TLS-DHE-DSS-WITH-AES-256-CBC-SHA256
            - TLS-DHE-DSS-WITH-AES-256-GCM-SHA384
            - TLS-ECDHE-RSA-WITH-AES-128-CBC-SHA
            - TLS-ECDHE-RSA-WITH-AES-128-CBC-SHA256
            - TLS-ECDHE-RSA-WITH-AES-128-GCM-SHA256
            - TLS-ECDHE-RSA-WITH-AES-256-CBC-SHA
            - TLS-ECDHE-RSA-WITH-AES-256-CBC-SHA384
            - TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384
            - TLS-ECDHE-ECDSA-WITH-AES-128-CBC-SHA
            - TLS-ECDHE-ECDSA-WITH-AES-128-CBC-SHA256
            - TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256
            - TLS-ECDHE-ECDSA-WITH-AES-256-CBC-SHA
            - TLS-ECDHE-ECDSA-WITH-AES-256-CBC-SHA384
            - TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384
            - TLS-RSA-WITH-AES-128-CBC-SHA
            - TLS-RSA-WITH-AES-256-CBC-SHA
            - TLS-RSA-WITH-AES-128-CBC-SHA256
            - TLS-RSA-WITH-AES-128-GCM-SHA256
            - TLS-RSA-WITH-AES-256-CBC-SHA256
            - TLS-RSA-WITH-AES-256-GCM-SHA384
            - TLS-RSA-WITH-CAMELLIA-128-CBC-SHA
            - TLS-RSA-WITH-CAMELLIA-256-CBC-SHA
            - TLS-RSA-WITH-CAMELLIA-128-CBC-SHA256
            - TLS-RSA-WITH-CAMELLIA-256-CBC-SHA256
            - TLS-DHE-RSA-WITH-3DES-EDE-CBC-SHA
            - TLS-DHE-RSA-WITH-CAMELLIA-128-CBC-SHA
            - TLS-DHE-DSS-WITH-CAMELLIA-128-CBC-SHA
            - TLS-DHE-RSA-WITH-CAMELLIA-256-CBC-SHA
            - TLS-DHE-DSS-WITH-CAMELLIA-256-CBC-SHA
            - TLS-DHE-RSA-WITH-CAMELLIA-128-CBC-SHA256
            - TLS-DHE-DSS-WITH-CAMELLIA-128-CBC-SHA256
            - TLS-DHE-RSA-WITH-CAMELLIA-256-CBC-SHA256
            - TLS-DHE-DSS-WITH-CAMELLIA-256-CBC-SHA256
            - TLS-DHE-RSA-WITH-SEED-CBC-SHA
            - TLS-DHE-DSS-WITH-SEED-CBC-SHA
            - TLS-DHE-RSA-WITH-ARIA-128-CBC-SHA256
            - TLS-DHE-RSA-WITH-ARIA-256-CBC-SHA384
            - TLS-DHE-DSS-WITH-ARIA-128-CBC-SHA256
            - TLS-DHE-DSS-WITH-ARIA-256-CBC-SHA384
            - TLS-RSA-WITH-SEED-CBC-SHA
            - TLS-RSA-WITH-ARIA-128-CBC-SHA256
            - TLS-RSA-WITH-ARIA-256-CBC-SHA384
            - TLS-ECDHE-RSA-WITH-ARIA-128-CBC-SHA256
            - TLS-ECDHE-RSA-WITH-ARIA-256-CBC-SHA384
            - TLS-ECDHE-ECDSA-WITH-ARIA-128-CBC-SHA256
            - TLS-ECDHE-ECDSA-WITH-ARIA-256-CBC-SHA384
            - TLS-ECDHE-RSA-WITH-RC4-128-SHA
            - TLS-ECDHE-RSA-WITH-3DES-EDE-CBC-SHA
            - TLS-DHE-DSS-WITH-3DES-EDE-CBC-SHA
            - TLS-RSA-WITH-3DES-EDE-CBC-SHA
            - TLS-RSA-WITH-RC4-128-MD5
            - TLS-RSA-WITH-RC4-128-SHA
            - TLS-DHE-RSA-WITH-DES-CBC-SHA
            - TLS-DHE-DSS-WITH-DES-CBC-SHA
            - TLS-RSA-WITH-DES-CBC-SHA
            version_ranges:
            - - v7.6.1
              - ''
            description: Cipher suite name.
          versions:
            type: enum
            raw_type: list
            choices:
            - tls-1.0
            - tls-1.1
            - tls-1.2
            - tls-1.3
            multiple_values: true
            elements: str
            version_ranges:
            - - v7.6.1
              - ''
            description: SSL/TLS versions that the cipher suite can be used with.
      ssl_min_version:
        type: enum
        raw_type: string
        choices:
        - tls-1.0
        - tls-1.1
        - tls-1.2
        - tls-1.3
        version_ranges:
        - - v7.6.1
          - ''
        description: Lowest SSL/TLS version acceptable from a server.
      ssl_max_version:
        type: enum
        raw_type: string
        choices:
        - tls-1.0
        - tls-1.1
        - tls-1.2
        - tls-1.3
        version_ranges:
        - - v7.6.1
          - ''
        description: Highest SSL/TLS version acceptable from a server.
      ssl_renegotiation:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.1
          - ''
        description: Enable/disable secure renegotiation to comply with RFC 5746.
