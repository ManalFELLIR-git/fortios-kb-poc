          max_ack_delay:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
              - ''
            description: Maximum ACK delay in milliseconds (1 - 16383).
          max_datagram_frame_size:
            type: integer
            raw_type: integer
            version_ranges:
            - - v7.6.1
