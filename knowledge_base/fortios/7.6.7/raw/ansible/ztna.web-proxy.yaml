            - fqdn
            version_ranges:
            - - v7.6.1
              - ''
            description: Type of address.
          address:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: Address or address group of the real server. Source firewall.address6.name firewall.addrgrp6.name.
            references:
            - firewall.address6.name
            - firewall.addrgrp6.name
          ip:
            type: string
            raw_type: string
            version_ranges:
