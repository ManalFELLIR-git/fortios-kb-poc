id: user.tacacs+
version: 7.6.7
source_object: fortios_user_tacacsplus
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_tacacsplus.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: TACACS+ server entry name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Primary TACACS+ server CN domain name or IP address.
  secondary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secondary TACACS+ server CN domain name or IP address.
  tertiary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Tertiary TACACS+ server CN domain name or IP address.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port number of the TACACS+ server.
  key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Key to access the primary server.
  secondary_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Key to access the secondary server.
  tertiary_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Key to access the tertiary server.
  status_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled).
  authen_type:
    type: enum
    raw_type: string
    choices:
    - mschap
    - chap
    - pap
    - ascii
    - auto
    version_ranges:
    - - v6.0.0
      - ''
    description: Allowed authentication protocols/methods.
  authorization:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable TACACS+ authorization.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address for communications to TACACS+ server.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
