id: wireless-controller.wtp
version: 7.6.7
source_object: fortios_wireless_controller_wtp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_wtp.py
root_type: list
attributes:
  wtp_id:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP ID.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  admin:
    type: enum
    raw_type: string
    choices:
    - discovered
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure how the FortiGate operating as a wireless controller discovers and manages this WTP, AP or FortiAP.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP, AP or FortiAP configuration name.
  location:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Field for describing the physical location of the WTP, AP or FortiAP.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Comment.
  region:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Region name WTP is associated with. Source wireless-controller.region.name.
    references:
    - wireless-controller.region.name
  region_x:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Relative horizontal region coordinate (between 0 and 1).
  region_y:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Relative vertical region coordinate (between 0 and 1).
  firmware_provision:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Firmware version to provision to this FortiAP on bootup (major.minor.build, i.e. 6.2.1234).
  firmware_provision_latest:
    type: enum
    raw_type: string
    choices:
    - disable
    - once
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable one-time automatic provisioning of the latest firmware version.
  wtp_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP profile name to apply to this WTP, AP or FortiAP. Source wireless-controller.wtp-profile.name.
    references:
    - wireless-controller.wtp-profile.name
  apcfg_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: AP local configuration profile name. Source wireless-controller.apcfg-profile.name.
    references:
    - wireless-controller.apcfg-profile.name
  bonjour_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Bonjour profile name. Source wireless-controller.bonjour-profile.name.
    references:
    - wireless-controller.bonjour-profile.name
  ble_major_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Override BLE Major ID.
  ble_minor_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Override BLE Minor ID.
  override_led_state:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to override the profile LED state setting for this FortiAP. You must enable this option to use the
      led-state command to turn off the FortiAP"s LEDs.
  led_state:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow the FortiAPs LEDs to light. Disable to keep the LEDs off. You may want to keep the LEDs off
      so they are not distracting in low light areas etc.
  override_wan_port_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable overriding the wan-port-mode in the WTP profile.
  wan_port_mode:
    type: enum
    raw_type: string
    choices:
    - wan-lan
    - wan-only
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using the FortiAP WAN port as a LAN port.
  override_ip_fragment:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable overriding the WTP profile IP fragment prevention setting.
  ip_fragment_preventing:
    type: enum
    raw_type: list
    choices:
    - tcp-mss-adjust
    - icmp-unreachable
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Method(s) by which IP fragmentation is prevented for control and data packets through CAPWAP tunnel .
  tun_mtu_uplink:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The maximum transmission unit (MTU) of uplink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU
      of FortiAP; ).
  tun_mtu_downlink:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The MTU of downlink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU of FortiAP; ).
  override_split_tunnel:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable overriding the WTP profile split tunneling setting.
  split_tunneling_acl_path:
    type: enum
    raw_type: string
    choices:
    - tunnel
    - local
    version_ranges:
    - - v6.0.0
      - ''
    description: Split tunneling ACL path is local/tunnel.
  split_tunneling_acl_local_ap_subnet:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable automatically adding local subnetwork of FortiAP to split-tunneling ACL .
  split_tunneling_acl:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Split tunneling ACL filter list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      dest_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Destination IP and mask for the split-tunneling subnet.
  override_lan:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to override the WTP profile LAN port setting.
  lan:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: WTP LAN port mapping.
    children:
      port_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port mode.
      port_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port1_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 1 mode.
      port1_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 1 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port2_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 2 mode.
      port2_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 2 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port3_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 3 mode.
      port3_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 3 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port4_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 4 mode.
      port4_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 4 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port5_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 5 mode.
      port5_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 5 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port6_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 6 mode.
      port6_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 6 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port7_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 7 mode.
      port7_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 7 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port8_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.0.0
          - ''
        description: LAN port 8 mode.
      port8_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Bridge LAN port 8 to SSID. Source system.interface.name.
        references:
        - system.interface.name
      port_esl_mode:
        type: enum
        raw_type: string
        choices:
        - offline
        - nat-to-wan
        - bridge-to-wan
        - bridge-to-ssid
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: ESL port mode.
      port_esl_ssid:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Bridge ESL port to SSID. Source system.interface.name.
        references:
        - system.interface.name
  override_allowaccess:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to override the WTP profile management access configuration.
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - https
    - ssh
    - snmp
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Control management access to the managed WTP, FortiAP, or AP. Separate entries with a space.
  override_login_passwd_change:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to override the WTP profile login-password (administrator password) setting.
  login_passwd_change:
    type: enum
    raw_type: string
    choices:
    - 'yes'
    - default
    - 'no'
    version_ranges:
    - - v6.0.0
      - ''
    description: Change or reset the administrator password of a managed WTP, FortiAP or AP (yes, default, or no).
  login_passwd:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the managed WTP, FortiAP, or AP"s administrator password.
  override_default_mesh_root:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable to override the WTP profile default mesh root SSID setting.
  default_mesh_root:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Configure default mesh root SSID when it is not included by radio"s SSID configuration.
  radio_1:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration options for radio 1.
    children:
      override_band:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override the WTP profile band setting.
      band:
        type: enum
        raw_type: list
        choices:
        - 802.11a
        - 802.11b
        - 802.11g
        - 802.11n-2G
        - 802.11n-5G
        - 802.11ac-2G
        - 802.11ac-5G
        - 802.11ax-2G
        - 802.11ax-5G
        - 802.11ax-6G
        - 802.11be-2G
        - 802.11be-5G
        - 802.11be-6G
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: WiFi band that Radio 1 operates on.
      override_txpower:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override the WTP profile power level configuration.
      auto_power_level:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable automatic power-level adjustment to prevent co-channel interference .
      auto_power_high:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: The upper bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
      auto_power_low:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: The lower bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
      auto_power_target:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.4
          - ''
        description: Target of automatic transmit power adjustment in dBm (-95 to -20).
      power_mode:
        type: enum
        raw_type: string
        choices:
        - dBm
        - percentage
        version_ranges:
        - - v7.0.0
          - ''
        description: Set radio effective isotropic radiated power (EIRP) in dBm or by a percentage of the maximum EIRP . This
          power takes into account both radio transmit power and antenna gain. Higher power level settings may be constrained
          by local regulatory requirements and AP capabilities.
      power_level:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Radio EIRP power level as a percentage of the maximum EIRP power (0 - 100).
      power_value:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.0
          - ''
        description: Radio EIRP power in dBm (1 - 33).
      override_vaps:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override WTP profile Virtual Access Point (VAP) settings.
      vap_all:
        type: enum
        raw_type: string
        choices:
        - tunnel
        - bridge
        - manual
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure method for assigning SSIDs to this FortiAP .
      vaps:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Manually selected list of Virtual Access Points (VAPs).
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Virtual Access Point (VAP) name. Source wireless-controller.vap-group.name system.interface.name.
            references:
            - system.interface.name
            - wireless-controller.vap-group.name
      override_channel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override WTP profile channel settings.
      channel:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Selected list of wireless radio channels.
        children:
          chan:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Channel number.
      drma_manual_mode:
        type: enum
        raw_type: string
        choices:
        - ap
        - monitor
        - ncf
        - ncf-peek
        version_ranges:
        - - v6.4.4
          - ''
        description: Radio mode to be used for DRMA manual mode .
  radio_2:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration options for radio 2.
    children:
      override_band:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override the WTP profile band setting.
      band:
        type: enum
        raw_type: list
        choices:
        - 802.11a
        - 802.11b
        - 802.11g
        - 802.11n-2G
        - 802.11n-5G
        - 802.11ac-2G
        - 802.11ac-5G
        - 802.11ax-2G
        - 802.11ax-5G
        - 802.11ax-6G
        - 802.11be-2G
        - 802.11be-5G
        - 802.11be-6G
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: WiFi band that Radio 2 operates on.
      override_txpower:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override the WTP profile power level configuration.
      auto_power_level:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable automatic power-level adjustment to prevent co-channel interference .
      auto_power_high:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: The upper bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
      auto_power_low:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: The lower bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
      auto_power_target:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.4
          - ''
        description: Target of automatic transmit power adjustment in dBm (-95 to -20).
      power_mode:
        type: enum
        raw_type: string
        choices:
        - dBm
        - percentage
        version_ranges:
        - - v7.0.0
          - ''
        description: Set radio effective isotropic radiated power (EIRP) in dBm or by a percentage of the maximum EIRP . This
          power takes into account both radio transmit power and antenna gain. Higher power level settings may be constrained
          by local regulatory requirements and AP capabilities.
      power_level:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Radio EIRP power level as a percentage of the maximum EIRP power (0 - 100).
      power_value:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.0
          - ''
        description: Radio EIRP power in dBm (1 - 33).
      override_vaps:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override WTP profile Virtual Access Point (VAP) settings.
      vap_all:
        type: enum
        raw_type: string
        choices:
        - tunnel
        - bridge
        - manual
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure method for assigning SSIDs to this FortiAP .
      vaps:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Manually selected list of Virtual Access Points (VAPs).
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Virtual Access Point (VAP) name. Source wireless-controller.vap-group.name system.interface.name.
            references:
            - system.interface.name
            - wireless-controller.vap-group.name
      override_channel:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable to override WTP profile channel settings.
      channel:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Selected list of wireless radio channels.
        children:
          chan:
