id: switch-controller.location
version: 7.6.7
source_object: fortios_switch_controller_location
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_location.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Unique location item name.
  address_civic:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure location civic address.
    children:
      additional:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location additional details.
      additional_code:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location additional code details.
      block:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location block details.
      branch_road:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location branch road details.
      building:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location building details.
      city:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location city details.
      city_division:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location city division details.
      country:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: The two-letter ISO 3166 country code in capital ASCII letters eg. US, CA, DK, DE.
      country_subdivision:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: National subdivisions (state, canton, region, province, or prefecture).
      county:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: County, parish, gun (JP), or district (IN).
      direction:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Leading street direction.
      floor:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Floor.
      landmark:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Landmark or vanity address.
      language:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Language.
      name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Name (residence and office occupant).
      number:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: House number.
      number_suffix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: House number suffix.
      place_type:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Place type.
      post_office_box:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Post office box.
      postal_community:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Postal community name.
      primary_road:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Primary road name.
      road_section:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Road section.
      room:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Room number.
      script:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Script used to present the address information.
      seat:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Seat number.
      street:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Street.
      street_name_post_mod:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Street name post modifier.
      street_name_pre_mod:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Street name pre modifier.
      street_suffix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Street suffix.
      sub_branch_road:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Sub branch road name.
      trailing_str_suffix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Trailing street suffix.
      unit:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Unit (apartment, suite).
      zip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Postal/zip code.
  coordinates:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure location GPS coordinates.
    children:
      altitude:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Plus or minus floating point number. For example, 117.47.
      altitude_unit:
        type: enum
        raw_type: string
        choices:
        - m
        - f
        version_ranges:
        - - v6.2.0
          - ''
        description: Configure the unit for which the altitude is to (m = meters, f = floors of a building).
      datum:
        type: enum
        raw_type: string
        choices:
        - WGS84
        - NAD83
        - NAD83/MLLW
        version_ranges:
        - - v6.2.0
          - ''
        description: WGS84, NAD83, NAD83/MLLW.
      latitude:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Floating point starting with +/- or ending with (N or S). For example, +/-16.67 or 16.67N.
      longitude:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Floating point starting with +/- or ending with (N or S). For example, +/-26.789 or 26.789E.
  elin_number:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure location ELIN number.
    children:
      elin_num:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Configure ELIN callback number.
