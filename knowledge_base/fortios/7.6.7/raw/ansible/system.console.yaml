id: system.console
version: 7.6.7
source_object: fortios_system_console
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_console.py
root_type: object
attributes:
  output:
    type: enum
    raw_type: string
    choices:
    - standard
    - more
    version_ranges:
    - - v6.0.0
      - ''
    description: Console output mode.
  login:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable serial console and FortiExplorer.
  fortiexplorer:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable access for FortiExplorer.
