id: user.setting
version: 7.6.7
source_object: fortios_user_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_setting.py
root_type: object
attributes:
  auth_type:
    type: enum
    raw_type: list
    choices:
    - http
    - https
    - ftp
    - telnet
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Supported firewall policy authentication protocols/methods.
  auth_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: HTTPS server certificate for policy authentication. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  auth_ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: HTTPS CA certificate for policy authentication. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  auth_secure_http:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable redirecting HTTP user authentication to more secure HTTPS.
  auth_http_basic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of HTTP basic authentication for identity-based firewall policies.
  auth_ssl_allow_renegotiation:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Allow/forbid SSL re-negotiation for HTTPS authentication.
  auth_src_mac:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable source MAC for user identity.
  auth_on_demand:
    type: enum
    raw_type: string
    choices:
    - always
    - implicitly
    version_ranges:
    - - v6.2.0
      - ''
    description: Always/implicitly trigger firewall authentication on demand.
  auth_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in minutes before the firewall user authentication timeout requires the user to re-authenticate.
  auth_timeout_type:
    type: enum
    raw_type: string
    choices:
    - idle-timeout
    - hard-timeout
    - new-session
    version_ranges:
    - - v6.0.0
      - ''
    description: Control if authenticated users have to login again after a hard timeout, after an idle timeout, or after
      a session timeout.
  auth_portal_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in minutes before captive portal user have to re-authenticate (1 - 30 min).
  radius_ses_timeout_act:
    type: enum
    raw_type: string
    choices:
    - hard-timeout
    - ignore-timeout
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the RADIUS session timeout to a hard timeout or to ignore RADIUS server session timeouts.
  auth_blackout_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds an IP address is denied access after failing to authenticate five times within one minute.
  auth_invalid_max:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of failed authentication attempts before the user is blocked.
  auth_lockout_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of failed login attempts before login lockout is triggered.
  auth_lockout_duration:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Lockout period in seconds after too many login failures.
  per_policy_disclaimer:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable per policy disclaimer.
  auth_ports:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Set up non-standard ports for authentication with HTTP, HTTPS, FTP, and TELNET.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      type:
        type: enum
        raw_type: string
        choices:
        - http
        - https
        - ftp
        - telnet
        version_ranges:
        - - v6.0.0
          - ''
        description: Service type.
      port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Non-standard port for firewall user authentication.
  auth_ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.2.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  auth_ssl_max_proto_version:
    type: enum
    raw_type: string
    choices:
    - sslv3
    - tlsv1
    - tlsv1-1
    - tlsv1-2
    - tlsv1-3
    version_ranges:
    - - v7.0.2
      - ''
    description: Maximum supported protocol version for SSL/TLS connections .
  auth_ssl_sigalgs:
    type: enum
    raw_type: string
    choices:
    - no-rsa-pss
    - all
    version_ranges:
    - - v7.0.2
      - ''
    description: Set signature algorithms related to HTTPS authentication (affects TLS version <= 1.2 only).
  default_user_password_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Default password policy to apply to all local users unless otherwise specified, as defined in config user
      password-policy. Source user .password-policy.name.
  cors:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable allowed origins white list for CORS.
  cors_allowed_origins:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.3
      - ''
    description: Allowed origins white list for CORS.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.3
          - ''
        description: Allowed origin for CORS.
