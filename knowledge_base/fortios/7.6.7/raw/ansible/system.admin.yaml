id: system.admin
version: 7.6.7
source_object: fortios_system_admin
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_admin.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: User name.
  vdom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual domain(s) that the administrator can access.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Virtual domain name. Source system.vdom.name.
        references:
        - system.vdom.name
  remote_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable authentication using a remote RADIUS, LDAP, or TACACS+ server.
  remote_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User group name used for remote auth.
  wildcard:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable wildcard RADIUS authentication.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Admin user password.
  peer_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Set to enable peer certificate authentication (for HTTPS admin access).
  peer_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of peer group defined under config user group which has PKI members. Used for peer certificate authentication
      (for HTTPS admin access).
  trusthost1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Any IPv4 address or subnet address and netmask from which the administrator can connect to the FortiGate
      unit. Default allows access from any IPv4 address.
  trusthost2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Any IPv4 address or subnet address and netmask from which the administrator can connect to the FortiGate
      unit. Default allows access from any IPv4 address.
  trusthost3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Any IPv4 address or subnet address and netmask from which the administrator can connect to the FortiGate
      unit. Default allows access from any IPv4 address.
