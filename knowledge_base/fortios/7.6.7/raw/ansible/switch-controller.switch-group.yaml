id: switch-controller.switch-group
version: 7.6.7
source_object: fortios_switch_controller_switch_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_switch_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Switch group name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional switch group description.
  fortilink:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: FortiLink interface to which switch group members belong. Source system.interface.name.
    references:
    - system.interface.name
  members:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch members belonging to this switch group.
    children:
      switch_id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Managed device ID. Source switch-controller.managed-switch.switch-id.
        references:
        - switch-controller.managed-switch.switch-id
