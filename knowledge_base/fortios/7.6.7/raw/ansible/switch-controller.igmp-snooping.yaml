id: switch-controller.igmp-snooping
version: 7.6.7
source_object: fortios_switch_controller_igmp_snooping
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_igmp_snooping.py
root_type: object
attributes:
  aging_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of seconds to retain a multicast snooping entry for which no packets have been seen (15 -
      3600 sec).
  flood_unknown_multicast:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable unknown multicast flooding.
  query_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Maximum time after which IGMP query will be sent (10 - 1200 sec).
