id: ips.custom
version: 7.6.7
source_object: fortios_ips_custom
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ips_custom.py
root_type: list
attributes:
  tag:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Signature tag.
  signature:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom signature enclosed in single quotes.
  severity:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Relative severity of the signature, from info to critical. Log messages generated by the signature include
      the severity.
  location:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Protect client or server traffic.
  os:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Operating system(s) that the signature protects. Blank for all operating systems.
  application:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Applications to be protected. Blank for all applications.
  protocol:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocol(s) that the signature scans. Blank for all protocols.
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this signature.
  log:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging.
  log_packet:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable packet logging.
  action:
    type: enum
    raw_type: string
    choices:
    - pass
    - block
    version_ranges:
    - - v6.0.0
      - ''
    description: Default action (pass or block) for this signature.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
