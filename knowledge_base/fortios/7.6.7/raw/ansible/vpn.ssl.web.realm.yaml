id: vpn.ssl.web.realm
version: 7.6.7
source_object: fortios_vpn_ssl_web_realm
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ssl_web_realm.py
root_type: list
attributes:
  url_path:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: URL path to access Agentless VPN login page.
  max_concurrent_user:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum concurrent users (0 - 65535, 0 means unlimited).
  login_page:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Replacement HTML for Agentless VPN login page.
  virtual_host:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual host name for realm.
  virtual_host_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable enforcement of virtual host method for Agentless VPN client access.
  virtual_host_server_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Name of the server certificate to used for this realm. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  radius_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: RADIUS server associated with realm. Source user.radius.name.
    references:
    - user.radius.name
  nas_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: IP address used as a NAS-IP to communicate with the RADIUS server.
  radius_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: RADIUS service port number (0 - 65535, 0 means user.radius.radius-port).
