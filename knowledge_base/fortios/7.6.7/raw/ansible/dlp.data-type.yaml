id: dlp.data-type
version: 7.6.7
source_object: fortios_dlp_data_type
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_dlp_data_type.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.0
      - ''
    description: Name of table containing the data type.
  pattern:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Regular expression pattern string without look around.
  verify:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Regular expression pattern string used to verify the data type.
  verify2:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Extra regular expression pattern string used to verify the data type.
  match_around:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Dictionary to check whether it has a match around (Only support match-any and basic types, no repeat supported).
      Source dlp.dictionary .name.
  look_back:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Number of characters required to save for verification (1 - 255).
  look_ahead:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Number of characters to obtain in advance for verification (1 - 255).
  match_back:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Number of characters in front for match-around (1 - 4096).
  match_ahead:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Number of characters behind for match-around (1 - 4096).
  transform:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Template to transform user input to a pattern using capture group from "pattern".
  verify_transformed_pattern:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable verification for transformed pattern.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Optional comments.
