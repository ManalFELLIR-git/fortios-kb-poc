id: vpn.ipsec.fec
version: 7.6.7
source_object: fortios_vpn_ipsec_fec
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_fec.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.2
      - ''
    description: Profile name.
  mappings:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.2
      - ''
    description: FEC redundancy mapping table.
    children:
      seqno:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.2
          - ''
        description: Sequence number (1 - 64). see <a href='#notes'>Notes</a>.
      base:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Number of base FEC packets (1 - 40).
      redundant:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Number of redundant FEC packets (0 - 20).
      packet_loss_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Apply FEC parameters when packet loss is >= threshold (0 - 100, 0 means no threshold).
      latency_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Apply FEC parameters when latency is <= threshold (0 means no threshold).
      bandwidth_up_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Apply FEC parameters when available up bandwidth is >= threshold (kbps, 0 means no threshold).
      bandwidth_down_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Apply FEC parameters when available down bandwidth is >= threshold (kbps, 0 means no threshold).
      bandwidth_bi_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.2
          - ''
        description: Apply FEC parameters when available bi-bandwidth is >= threshold (kbps, 0 means no threshold).
