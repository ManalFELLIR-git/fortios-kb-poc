id: wireless-controller.mpsk-profile
version: 7.6.7
source_object: fortios_wireless_controller_mpsk_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_mpsk_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: MPSK profile name.
  mpsk_concurrent_clients:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Maximum number of concurrent clients that connect using the same passphrase in multiple PSK authentication
      (0 - 65535).
  mpsk_external_server_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/Disable MPSK external server authentication .
  mpsk_external_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: RADIUS server to be used to authenticate MPSK users. Source user.radius.name.
    references:
    - user.radius.name
  mpsk_type:
    type: enum
    raw_type: string
    choices:
    - wpa2-personal
    - wpa3-sae
    - wpa3-sae-transition
    version_ranges:
    - - v7.4.4
      - ''
    description: Select the security type of keys for this profile.
  mpsk_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: List of multiple PSK groups.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: MPSK group name.
      vlan_type:
        type: enum
        raw_type: string
        choices:
        - no-vlan
        - fixed-vlan
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: MPSK group VLAN options.
      vlan_id:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Optional VLAN ID.
      mpsk_key:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: List of multiple PSK entries.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: Pre-shared key name.
          key_type:
            type: enum
            raw_type: string
            choices:
            - wpa2-personal
            - wpa3-sae
            version_ranges:
            - - v7.4.4
              - ''
            description: Select the type of the key.
          mac:
            type: string
            raw_type: string
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: MAC address.
          passphrase:
            type: string
            raw_type: string
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: WPA Pre-shared key.
          sae_password:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.4
              - ''
            description: WPA3 SAE password.
          sae_pk:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.4
              - ''
            description: Enable/disable WPA3 SAE-PK .
          sae_private_key:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.4
              - ''
            description: Private key used for WPA3 SAE-PK authentication.
          concurrent_client_limit_type:
            type: enum
            raw_type: string
            choices:
            - default
            - unlimited
            - specified
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: MPSK client limit type options.
          concurrent_clients:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: Number of clients that can connect using this pre-shared key (1 - 65535).
          comment:
            type: string
            raw_type: string
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: Comment.
          mpsk_schedules:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.4.0
              - v6.4.0
            - - v6.4.4
              - ''
            description: Firewall schedule for MPSK passphrase. The passphrase will be effective only when at least one schedule
              is valid.
            children:
              name:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v6.4.0
                  - v6.4.0
                - - v6.4.4
                  - ''
                description: Schedule name. Source firewall.schedule.group.name firewall.schedule.recurring.name firewall.schedule.onetime
                  .name.
                references:
                - firewall.schedule.group.name
                - firewall.schedule.onetime
                - firewall.schedule.recurring.name
