id: firewall.identity-based-route
version: 7.6.7
source_object: fortios_firewall_identity_based_route
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_identity_based_route.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comments.
  rule:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Rule.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Rule ID. see <a href='#notes'>Notes</a>.
      gateway:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: 'IPv4 address of the gateway (Format: xxx.xxx.xxx.xxx ).'
      device:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Outgoing interface for the rule. Source system.interface.name.
        references:
        - system.interface.name
      groups:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Select one or more group(s) from available groups that are allowed to use this route. Separate group
          names with a space.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Group name. Source user.group.name.
            references:
            - user.group.name
