id: system.ipip-tunnel
version: 7.6.7
source_object: fortios_system_ipip_tunnel
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ipip_tunnel.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPIP Tunnel name.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface name that is associated with the incoming traffic from available options. Source system.interface.name.
    references:
    - system.interface.name
  remote_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address for the remote gateway.
  local_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address for the local gateway.
  use_sdwan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable use of SD-WAN to reach remote gateway.
  auto_asic_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable tunnel ASIC offloading.
