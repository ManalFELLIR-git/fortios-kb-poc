id: vpn.qkd
version: 7.6.7
source_object: fortios_vpn_qkd
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_qkd.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.2
      - ''
    description: Quantum Key Distribution configuration name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: IPv4, IPv6 or DNS address of the KME.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Port to connect to on the KME.
  id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Quantum Key Distribution ID assigned by the KME.
  peer:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Authenticate Quantum Key Device"s certificate with the peer/peergrp. Source user.peer.name user.peergrp.name.
    references:
    - user.peer.name
    - user.peergrp.name
  certificate:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: Names of up to 4 certificates to offer to the KME.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Certificate name. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Comment.
