id: wireless-controller.wag-profile
version: 7.6.7
source_object: fortios_wireless_controller_wag_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_wag_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Tunnel profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  tunnel_type:
    type: enum
    raw_type: string
    choices:
    - l2tpv3
    - gre
    version_ranges:
    - - v6.2.0
      - ''
    description: Tunnel type.
  wag_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IP Address of the wireless access gateway.
  wag_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: UDP port of the wireless access gateway.
  ping_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Interval between two tunnel monitoring echo packets (1 - 65535 sec).
  ping_number:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Number of the tunnel monitoring echo packets (1 - 65535).
  return_packet_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Window of time for the return packets from the tunnel"s remote end (1 - 65535 sec).
  dhcp_ip_addr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IP address of the monitoring DHCP request packet sent through the tunnel.
