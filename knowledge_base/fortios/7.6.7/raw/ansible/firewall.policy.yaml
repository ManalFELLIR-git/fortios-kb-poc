  tos:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: ToS (Type of Service) value used for comparison.
  tos_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable negated TOS match.
  anti_replay:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable anti-replay check.
  tcp_session_without_syn:
    type: enum
    raw_type: string
    choices:
    - all
    - data-only
    - disable
    version_ranges:
    - - v6.0.0
      - ''
