id: firewall.policy
version: 7.6.7
source_object: fortios_firewall_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_policy.py
root_type: list
attributes:
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID (0 - 4294967294). see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable or disable this policy.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  srcintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Incoming (ingress) interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  dstintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Outgoing (egress) interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    - ipsec
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy action (accept/deny/ipsec).
  nat64:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT64.
  nat46:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT46.
  ztna_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable zero trust access.
  ztna_device_ownership:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable zero trust device ownership.
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IPv4 address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - system.external-resource.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination IPv4 address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name firewall.vip.name firewall.vipgrp.name
          system.external-resource .name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - firewall.vip.name
        - firewall.vipgrp.name
  srcaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Source IPv6 address name and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address6.name system.external-resource.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
        - system.external-resource.name
  dstaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Destination IPv6 address name and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name firewall.vip6.name firewall.vipgrp6.name
          system .external-resource.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
        - firewall.vip6.name
        - firewall.vipgrp6.name
  ztna_ems_tag:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Source ztna-ems-tag names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  ztna_ems_tag_secondary:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: Source ztna-ems-tag-secondary names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  ztna_tags_match_logic:
    type: enum
    raw_type: string
    choices:
    - or
    - and
    version_ranges:
    - - v7.2.4
      - ''
    description: ZTNA tag matching logic.
  ztna_geo_tag:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Source ztna-geo-tag names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  internet_service:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address and service are
      not used.
  internet_service_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  network_service_dynamic:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Dynamic Network Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Dynamic Network Service name. Source firewall.network-service-dynamic.name.
        references:
        - firewall.network-service-dynamic.name
  internet_service_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service_src:
    type: enum
    raw_type: string
    choices:
    - enable
