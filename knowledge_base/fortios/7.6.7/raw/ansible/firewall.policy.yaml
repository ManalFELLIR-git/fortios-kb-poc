    description: Custom Internet Service6 group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Custom Internet Service6 group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service6_src:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable use of IPv6 Internet Services in source for this policy. If enabled, source address is not
      used.
  internet_service6_src_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: IPv6 Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service6_src_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Internet Service6 source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
