  internet_service_src_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Internet Service source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  reputation_minimum:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Minimum Reputation to take action. Source firewall.internet-service-reputation.id.
    references:
    - firewall.internet-service-reputation.id
  reputation_direction:
    type: enum
    raw_type: string
    choices:
    - source
    - destination
    version_ranges:
    - - v6.2.0
      - ''
