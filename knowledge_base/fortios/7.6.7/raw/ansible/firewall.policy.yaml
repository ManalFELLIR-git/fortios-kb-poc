    description: Custom Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  network_service_src_dynamic:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Dynamic Network Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Dynamic Network Service name. Source firewall.network-service-dynamic.name.
        references:
