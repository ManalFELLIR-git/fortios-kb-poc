  dynamic_shaping:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable dynamic RADIUS defined traffic shaping.
  passive_wan_health_measurement:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable passive WAN health measurement. When enabled, auto-asic-offload is disabled.
  app_monitor:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable application TCP metrics in session logs.When enabled, auto-asic-offload is disabled.
  utm_status:
    type: enum
    raw_type: string
    choices:
    - enable
