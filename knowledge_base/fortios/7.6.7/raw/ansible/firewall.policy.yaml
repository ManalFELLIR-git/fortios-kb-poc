  src_vendor_mac:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Vendor MAC source ID.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Vendor MAC ID. see <a href='#notes'>Notes</a>. Source firewall.vendor-mac.id.
        references:
        - firewall.vendor-mac.id
  internet_service6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable use of IPv6 Internet Services for this policy. If enabled, destination address and service
