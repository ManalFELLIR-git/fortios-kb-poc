id: web-proxy.forward-server
version: 7.6.7
source_object: fortios_web_proxy_forward_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_web_proxy_forward_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Server name.
  addr_type:
    type: enum
    raw_type: string
    choices:
    - ip
    - ipv6
    - fqdn
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Address type of the forwarding proxy server: IP or FQDN.'
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Forward proxy server IP address.
  ipv6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Forward proxy server IPv6 address.
  fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Forward server Fully Qualified Domain Name (FQDN).
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port number that the forwarding server expects to receive HTTP sessions on (1 - 65535).
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - sdwan
    - specify
    version_ranges:
    - - v7.6.1
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  masquerade:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable use of the IP address of the outgoing interface as the client IP address
  healthcheck:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable forward server health checking. Attempts to connect through the remote forwarding server to
      a destination to verify that the forwarding server is operating normally.
  monitor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL for forward server health check monitoring .
  server_down_option:
    type: enum
    raw_type: string
    choices:
    - block
    - pass
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Action to take when the forward server is found to be down: block sessions until the server is back up or
      pass sessions to their destination.'
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: HTTP authentication user name.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: HTTP authentication password.
