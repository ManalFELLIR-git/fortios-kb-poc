id: user.peer
version: 7.6.7
source_object: fortios_user_peer
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_peer.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer name.
  mandatory_ca_verify:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Determine what happens to the peer if the CA certificate is not installed. Disable to automatically consider
      the peer certificate as valid.
  ca:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the CA certificate. Source vpn.certificate.ca.name.
    references:
    - vpn.certificate.ca.name
  subject:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer certificate name constraints.
  cn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer certificate common name.
  mfa_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - password
    - subject-identity
    version_ranges:
    - - v7.4.1
      - ''
    description: MFA mode for remote peer authentication/authorization.
  mfa_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Name of a remote authenticator. Performs client access right check. Source user.radius.name user.ldap.name.
    references:
    - user.ldap.name
    - user.radius.name
  mfa_username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Unified username for remote authentication.
  mfa_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Unified password for remote authentication. This field may be left empty when RADIUS authentication is used,
      in which case the FortiGate will use the RADIUS username as a password.
  ocsp_override_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Online Certificate Status Protocol (OCSP) server for certificate retrieval. Source vpn.certificate.ocsp-server.name.
    references:
    - vpn.certificate.ocsp-server.name
  two_factor:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable two-factor authentication, applying certificate and password-based authentication.
  passwd:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer"s password used for two-factor authentication.
  cn_type:
    type: enum
    raw_type: string
    choices:
    - string
    - email
    - FQDN
    - ipv4
    - ipv6
    version_ranges:
    - - v6.0.0
      - v7.6.7
    description: Peer certificate common name type.
