id: ips.global
version: 7.6.7
source_object: fortios_ips_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ips_global.py
root_type: object
attributes:
  fail_open:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow traffic if the IPS buffer is full. Default is disable and IPS traffic is blocked when the
      IPS buffer is full.
  database:
    type: enum
    raw_type: string
    choices:
    - regular
    - extended
    version_ranges:
    - - v6.0.0
      - ''
    description: Regular or extended IPS database. Regular protects against the latest common and in-the-wild attacks. Extended
      includes protection from legacy attacks.
  traffic_submit:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable submitting attack data found by this FortiGate to FortiGuard.
  anomaly_mode:
    type: enum
    raw_type: string
    choices:
    - periodical
    - continuous
    version_ranges:
    - - v6.0.0
      - ''
    description: Global blocking mode for rate-based anomalies.
  session_limit_mode:
    type: enum
    raw_type: string
    choices:
    - accurate
    - heuristic
    version_ranges:
    - - v6.0.0
      - ''
    description: Method of counting concurrent sessions used by session limit anomalies. Choose between greater accuracy (accurate)
      or improved performance (heuristics).
  socket_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: IPS socket buffer size. Max and default value depend on available memory. Can be changed to tune performance.
  engine_count:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of IPS engines running. If set to the default value of 0, FortiOS sets the number to optimize performance
      depending on the number of CPU cores.
  sync_session_ttl:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of kernel session TTL for IPS sessions.
  np_accel_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - basic
    version_ranges:
    - - v6.0.0
      - ''
    description: Acceleration mode for IPS processing by NPx processors.
  cp_accel_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - basic
    - advanced
    version_ranges:
    - - v6.0.0
      - ''
    description: IPS Pattern matching acceleration/offloading to CPx processors.
  deep_app_insp_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Timeout for Deep application inspection (1 - 2147483647 sec., 0 = use recommended setting).
  deep_app_insp_db_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Limit on number of entries in deep application inspection database (1 - 2147483647, use recommended setting
      = 0).
  exclude_signatures:
    type: enum
    raw_type: string
    choices:
    - none
    - ot
    version_ranges:
    - - v6.0.0
      - ''
    description: Excluded signatures.
  packet_log_queue_depth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.7
      - ''
    description: Packet/pcap log queue depth per IPS engine.
  ngfw_max_scan_range:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: NGFW policy-mode app detection threshold.
  av_mem_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Maximum percentage of system memory allowed for use on AV scanning (10 - 50). To disable set to zero. When
      disabled, there is no limit on the AV memory usage.
  machine_learning_detection:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable machine learning detection.
  tls_active_probe:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.7
      - v6.2.7
    - - v6.4.4
      - ''
    description: TLS active probe configuration.
    children:
      interface_select_method:
        type: enum
        raw_type: string
        choices:
        - auto
        - sdwan
        - specify
        version_ranges:
        - - v6.2.7
          - v6.2.7
        - - v6.4.4
          - ''
        description: Specify how to select outgoing interface to reach server.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.7
          - v6.2.7
        - - v6.4.4
          - ''
        description: Specify outgoing interface to reach server. Source system.interface.name.
        references:
        - system.interface.name
      vdom:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.7
          - v6.2.7
        - - v6.4.4
          - ''
        description: Virtual domain name for TLS active probe. Source system.vdom.name.
        references:
        - system.vdom.name
      source_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.7
          - v6.2.7
        - - v6.4.4
          - ''
        description: Source IP address used for TLS active probe.
      source_ip6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.7
          - v6.2.7
        - - v6.4.4
          - ''
        description: Source IPv6 address used for TLS active probe.
  ips_reserve_cpu:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable IPS daemon"s use of CPUs other than CPU 0.
