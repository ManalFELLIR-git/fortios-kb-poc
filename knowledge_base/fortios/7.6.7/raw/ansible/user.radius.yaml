id: user.radius
version: 7.6.7
source_object: fortios_user_radius
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_radius.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS server entry name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Primary RADIUS server CN domain name or IP address.
  secret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-shared secret key used to access the primary RADIUS server.
  secondary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secondary RADIUS CN domain name or IP address.
  secondary_secret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secret key to access the secondary server.
  tertiary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Tertiary RADIUS CN domain name or IP address.
  tertiary_secret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secret key to access the tertiary server.
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds to retry connecting server.
  status_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled).
  all_usergroup:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable automatically including this RADIUS server in all user groups.
  use_management_vdom:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable using management VDOM to send requests.
  switch_controller_nas_ip_dynamic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/Disable switch-controller nas-ip dynamic to dynamically set nas-ip.
  nas_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address used to communicate with the RADIUS server and used as NAS-IP-Address and Called-Station-ID attributes.
  nas_id_type:
    type: enum
    raw_type: string
    choices:
    - legacy
    - custom
    - hostname
    version_ranges:
    - - v7.2.4
      - ''
    description: NAS identifier type configuration .
  call_station_id_type:
    type: enum
    raw_type: string
    choices:
    - legacy
    - IP
    - MAC
    version_ranges:
    - - v7.4.1
      - ''
    description: Calling & Called station identifier type configuration , this option is not available for 802.1x authentication.
  nas_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Custom NAS identifier.
  acct_interim_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds between each accounting interim update message.
  radius_coa:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow a mechanism to change the attributes of an authentication, authorization, and accounting
      session after it is authenticated.
  radius_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS service port number.
  h3c_compatibility:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable compatibility with the H3C, a mechanism that performs security checking for authentication.
  auth_type:
    type: enum
    raw_type: string
    choices:
    - auto
    - ms_chap_v2
    - ms_chap
    - chap
    - pap
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication methods/protocols permitted for this RADIUS server.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address for communications to the RADIUS server.
  source_ip_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Source interface for communication with the RADIUS server. Source system.interface.name.
    references:
    - system.interface.name
  username_case_sensitive:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable case sensitive user names.
  group_override_attr_type:
    type: enum
    raw_type: string
    choices:
    - filter-Id
    - class
    version_ranges:
    - - v6.4.0
      - ''
    description: RADIUS attribute type to override user group information.
  class:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Class attribute name(s).
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Class name.
  password_renewal:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable password renewal.
  require_message_authenticator:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Require message authenticator in authentication response.
  password_encoding:
    type: enum
    raw_type: string
    choices:
    - auto
    - ISO-8859-1
    version_ranges:
    - - v6.0.0
      - ''
    description: Password encoding.
  mac_username_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.2.1
      - ''
    description: MAC authentication username delimiter .
  mac_password_delimiter:
    type: enum
    raw_type: string
    choices:
    - hyphen
    - single-hyphen
    - colon
    - none
    version_ranges:
    - - v7.2.1
      - ''
    description: MAC authentication password delimiter .
  mac_case:
    type: enum
    raw_type: string
    choices:
    - uppercase
    - lowercase
    version_ranges:
    - - v7.2.1
      - ''
    description: MAC authentication case .
  acct_all_servers:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending of accounting messages to all configured servers .
  switch_controller_acct_fast_framedip_detect:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Switch controller accounting message Framed-IP detection from DHCP snooping (seconds).
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  switch_controller_service_type:
    type: enum
    raw_type: list
    choices:
    - login
    - framed
    - callback-login
    - callback-framed
    - outbound
    - administrative
    - nas-prompt
    - authenticate-only
    - callback-nas-prompt
    - call-check
    - callback-administrative
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: RADIUS service type.
  transport_protocol:
    type: enum
    raw_type: string
    choices:
    - udp
    - tcp
    - tls
    version_ranges:
    - - v7.4.0
      - ''
    description: Transport protocol to be used .
  tls_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v7.4.0
      - ''
    description: Minimum supported protocol version for TLS connections .
  ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: CA of server to trust under TLS. Source vpn.certificate.ca.name.
    references:
    - vpn.certificate.ca.name
  client_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Client certificate to use under TLS. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  server_identity_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable RADIUS server identity check (verify server domain name/IP address against the server certificate).
  account_key_processing:
    type: enum
    raw_type: string
    choices:
    - same
    - strip
    version_ranges:
    - - v7.4.1
      - ''
    description: Account key processing operation. The FortiGate will keep either the whole domain or strip the domain from
      the subject identity.
  account_key_cert_field:
    type: enum
    raw_type: string
    choices:
    - othername
    - rfc822name
    - dnsname
    - cn
    version_ranges:
    - - v7.4.1
      - ''
    description: Define subject identity field in certificate for user access right checking.
  rsso:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable RADIUS based single sign on feature.
  rsso_radius_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: UDP port to listen on for RADIUS Start and Stop records.
  rsso_radius_response:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending RADIUS response packets after receiving Start and Stop records.
  rsso_validate_request_secret:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable validating the RADIUS request shared secret in the Start or End record.
  rsso_secret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS secret used by the RADIUS accounting server.
  rsso_endpoint_attribute:
    type: enum
    raw_type: string
    choices:
    - User-Name
    - NAS-IP-Address
    - Framed-IP-Address
    - Framed-IP-Netmask
    - Filter-Id
    - Login-IP-Host
    - Reply-Message
    - Callback-Number
    - Callback-Id
    - Framed-Route
    - Framed-IPX-Network
    - Class
    - Called-Station-Id
    - Calling-Station-Id
    - NAS-Identifier
    - Proxy-State
    - Login-LAT-Service
    - Login-LAT-Node
    - Login-LAT-Group
    - Framed-AppleTalk-Zone
    - Acct-Session-Id
    - Acct-Multi-Session-Id
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS attributes used to extract the user end point identifier from the RADIUS Start record.
  rsso_endpoint_block_attribute:
    type: enum
    raw_type: string
    choices:
    - User-Name
    - NAS-IP-Address
    - Framed-IP-Address
    - Framed-IP-Netmask
    - Filter-Id
    - Login-IP-Host
    - Reply-Message
    - Callback-Number
    - Callback-Id
    - Framed-Route
    - Framed-IPX-Network
    - Class
    - Called-Station-Id
    - Calling-Station-Id
    - NAS-Identifier
    - Proxy-State
    - Login-LAT-Service
    - Login-LAT-Node
    - Login-LAT-Group
    - Framed-AppleTalk-Zone
    - Acct-Session-Id
    - Acct-Multi-Session-Id
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS attributes used to block a user.
  sso_attribute:
    type: enum
    raw_type: string
    choices:
    - User-Name
    - NAS-IP-Address
    - Framed-IP-Address
    - Framed-IP-Netmask
    - Filter-Id
    - Login-IP-Host
    - Reply-Message
    - Callback-Number
    - Callback-Id
    - Framed-Route
    - Framed-IPX-Network
    - Class
    - Called-Station-Id
    - Calling-Station-Id
    - NAS-Identifier
    - Proxy-State
    - Login-LAT-Service
    - Login-LAT-Node
    - Login-LAT-Group
    - Framed-AppleTalk-Zone
    - Acct-Session-Id
    - Acct-Multi-Session-Id
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS attribute that contains the profile group name to be extracted from the RADIUS Start record.
  sso_attribute_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Key prefix for SSO group value in the SSO attribute.
  sso_attribute_value_override:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable override old attribute value with new value for the same endpoint.
  rsso_context_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in seconds before the logged out user is removed from the "user context list" of logged on users.
  rsso_log_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time interval in seconds that group event log messages will be generated for dynamic profile events.
  rsso_log_flags:
    type: enum
    raw_type: list
    choices:
    - protocol-error
    - profile-missing
    - accounting-stop-missed
    - accounting-event
    - endpoint-block
    - radiusd-other
    - none
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Events to log.
  rsso_flush_ip_session:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable flushing user IP sessions on RADIUS accounting Stop messages.
  rsso_ep_one_ip_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the replacement of old IP addresses with new ones for the same endpoint on RADIUS accounting
      Start messages.
  delimiter:
    type: enum
    raw_type: string
    choices:
    - plus
    - comma
    version_ranges:
    - - v7.2.0
      - ''
    description: Configure delimiter to be used for separating profile group names in the SSO attribute .
  accounting_server:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Additional accounting servers.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID (0 - 4294967295). see <a href='#notes'>Notes</a>.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Status.
      server:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Server CN domain name or IP address.
      secret:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Secret key.
      port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: RADIUS accounting port number.
      source_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Source IP address for communications to the RADIUS server.
      interface_select_method:
        type: enum
        raw_type: string
        choices:
        - auto
        - sdwan
        - specify
        version_ranges:
        - - v6.2.0
          - v6.2.0
        - - v6.2.5
          - ''
        description: Specify how to select outgoing interface to reach server.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - v6.2.0
        - - v6.2.5
          - ''
        description: Specify outgoing interface to reach server. Source system.interface.name.
        references:
        - system.interface.name
      vrf_select:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: VRF ID used for connection to server.
