id: system.ddns
version: 7.6.7
source_object: fortios_system_ddns
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ddns.py
root_type: list
attributes:
  ddnsid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS ID. see <a href='#notes'>Notes</a>.
  ddns_server:
    type: enum
    raw_type: string
    choices:
    - dyndns.org
    - dyns.net
    - tzo.com
    - vavic.com
    - dipdns.net
    - now.net.cn
    - dhs.org
    - easydns.com
    - genericDDNS
    - FortiGuardDDNS
    - noip.com
    version_ranges:
    - - v6.0.0
      - ''
    description: Select a DDNS service provider.
  addr_type:
    type: enum
    raw_type: string
    choices:
    - ipv4
    - ipv6
    version_ranges:
    - - v7.0.0
      - ''
    description: Address type of interface address in DDNS update.
  server_type:
    type: enum
    raw_type: string
    choices:
    - ipv4
    - ipv6
    version_ranges:
    - - v7.0.0
      - ''
    description: Address type of the DDNS server.
  ddns_server_addr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: Generic DDNS server IP/FQDN list.
    children:
      addr:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: IP address or FQDN of the server.
  ddns_zone:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Zone of your domain name (for example, DDNS.com).
  ddns_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time-to-live for DDNS packets.
  ddns_auth:
    type: enum
    raw_type: string
    choices:
    - disable
    - tsig
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable TSIG authentication for your DDNS server.
  ddns_keyname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS update key name.
  ddns_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS update key (base 64 encoding).
  ddns_domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Your fully qualified domain name. For example, yourname.ddns.com.
  ddns_username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS user name.
  ddns_sn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS Serial Number.
  ddns_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS password.
  use_public_ip:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of public IP address.
  update_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: DDNS update interval (60 - 2592000 sec, 0 means default).
  clear_text:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of clear text connections.
  ssl_certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of local certificate for SSL connections. Source certificate.local.name.
    references:
    - certificate.local.name
  monitor_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Monitored interface.
    children:
      interface_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
