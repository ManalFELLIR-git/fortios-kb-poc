id: firewall.ssl-server
version: 7.6.7
source_object: fortios_firewall_ssl_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ssl_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Server name.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address of the SSL server.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Server service port (1 - 65535).
  ssl_mode:
    type: enum
    raw_type: string
    choices:
    - half
    - full
    version_ranges:
    - - v6.0.0
      - ''
    description: SSL/TLS mode for encryption and decryption of traffic.
  add_header_x_forwarded_proto:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable adding an X-Forwarded-Proto header to forwarded requests.
  mapped_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Mapped server service port (1 - 65535).
  ssl_cert_dict:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: List of certificate names to use for SSL connections to this server. .
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Certificate list. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  ssl_dh_bits:
    type: enum
    raw_type: string
    choices:
    - '768'
    - '1024'
    - '1536'
    - '2048'
    version_ranges:
    - - v6.0.0
      - ''
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation .
  ssl_algorithm:
    type: enum
    raw_type: string
    choices:
    - high
    - medium
    - low
    version_ranges:
    - - v6.0.0
      - ''
    description: Relative strength of encryption algorithms accepted in negotiation.
  ssl_client_renegotiation:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    - secure
    version_ranges:
    - - v6.0.0
      - ''
    description: Allow or block client renegotiation by server.
  ssl_min_version:
    type: enum
    raw_type: string
    choices:
    - tls-1.0
    - tls-1.1
    - tls-1.2
    - tls-1.3
    version_ranges:
    - - v6.0.0
      - ''
    description: Lowest SSL/TLS version to negotiate.
  ssl_max_version:
    type: enum
    raw_type: string
    choices:
    - tls-1.0
    - tls-1.1
    - tls-1.2
    - tls-1.3
    version_ranges:
    - - v6.0.0
      - ''
    description: Highest SSL/TLS version to negotiate.
  ssl_send_empty_frags:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending empty fragments to avoid attack on CBC IV.
  url_rewrite:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable rewriting the URL.
