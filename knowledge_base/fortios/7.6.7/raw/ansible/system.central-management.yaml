id: system.central-management
version: 7.6.7
source_object: fortios_system_central_management
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_central_management.py
root_type: object
attributes:
  mode:
    type: enum
    raw_type: string
    choices:
    - normal
    - backup
    version_ranges:
    - - v6.0.0
      - ''
    description: Central management mode.
  type:
    type: enum
    raw_type: string
    choices:
    - fortimanager
    - fortiguard
    - none
    version_ranges:
    - - v6.0.0
      - ''
    description: Central management type.
  fortigate_cloud_sso_default_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Override access profile. Permission is set to read-only without a FortiGate Cloud Central Management license.
      Source system.accprofile .name.
  schedule_config_restore:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the central management server to restore the configuration of this FortiGate.
  schedule_script_restore:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the central management server to restore the scripts stored on this FortiGate.
  allow_push_configuration:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the central management server to push configuration changes to this FortiGate.
  allow_push_firmware:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the central management server to push firmware updates to this FortiGate.
  allow_remote_firmware_upgrade:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable remotely upgrading the firmware on this FortiGate from the central management server.
  allow_monitor:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable allowing the central management server to remotely monitor this FortiGate unit.
  serial_number:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Serial number.
  fmg:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address or FQDN of the FortiManager.
  fmg_source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 source address that this FortiGate uses when communicating with FortiManager.
  fmg_source_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source address that this FortiGate uses when communicating with FortiManager.
  local_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Certificate to be used by FGFM protocol. Source certificate.local.name.
    references:
    - certificate.local.name
  ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: CA certificate to be used by FGFM protocol. Source certificate.ca.name.
    references:
    - certificate.ca.name
  vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Virtual domain (VDOM) name to use when communicating with FortiManager. Source system.vdom.name.
    references:
    - system.vdom.name
  server_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Additional severs that the FortiGate can use for updates (for AV, IPS, updates) and ratings (for web filter
      and antispam ratings) servers.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      server_type:
        type: enum
        raw_type: list
        choices:
        - update
        - rating
        - iot-collect
        - vpatch-query
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: FortiGuard service type.
      addr_type:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        - fqdn
        version_ranges:
        - - v6.0.0
          - ''
        description: Indicate whether the FortiGate communicates with the override server using an IPv4 address, an IPv6 address
          or a FQDN.
      server_address:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 address of override server.
      server_address6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 address of override server.
      fqdn:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: FQDN address of override server.
  fmg_update_port:
    type: enum
    raw_type: string
    choices:
    - '8890'
    - '443'
    version_ranges:
    - - v6.2.0
      - ''
    description: Port used to communicate with FortiManager that is acting as a FortiGuard update server.
  fmg_update_http_header:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable inclusion of HTTP header in update request.
  include_default_servers:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable inclusion of public FortiGuard servers in the override server list.
  enc_algorithm:
    type: enum
    raw_type: string
    choices:
    - default
    - high
    - low
    version_ranges:
    - - v6.0.0
      - ''
    description: Encryption strength for communications between the FortiGate and central management.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
