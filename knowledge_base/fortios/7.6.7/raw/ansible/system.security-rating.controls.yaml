id: system.security-rating.controls
version: 7.6.7
source_object: fortios_system_security_rating_controls
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_security_rating_controls.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: Security Rating control name.
  display_report:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable displaying the Security Rating control in the default report.
  display_insight:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable displaying the Security Rating control as an insight across the GUI.
