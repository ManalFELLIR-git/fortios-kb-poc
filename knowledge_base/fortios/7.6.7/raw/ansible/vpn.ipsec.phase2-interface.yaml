id: vpn.ipsec.phase2-interface
version: 7.6.7
source_object: fortios_vpn_ipsec_phase2_interface
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_phase2_interface.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPsec tunnel name.
  phase1name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase 1 determines the options required for phase 2. Source vpn.ipsec.phase1-interface.name.
    references:
    - vpn.ipsec.phase1-interface.name
  dhcp_ipsec:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable DHCP-IPsec.
  proposal:
    type: enum
    raw_type: list
    choices:
    - null-md5
    - null-sha1
    - null-sha256
    - null-sha384
    - null-sha512
    - des-null
    - des-md5
    - des-sha1
    - des-sha256
    - des-sha384
    - des-sha512
    - 3des-null
    - 3des-md5
    - 3des-sha1
    - 3des-sha256
    - 3des-sha384
    - 3des-sha512
    - aes128-null
    - aes128-md5
