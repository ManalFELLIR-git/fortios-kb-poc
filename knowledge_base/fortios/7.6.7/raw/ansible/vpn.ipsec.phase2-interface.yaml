    - aes128-sha384
    - aes128-sha512
    - aes128gcm
    - aes192-null
    - aes192-md5
    - aes192-sha1
    - aes192-sha256
    - aes192-sha384
    - aes192-sha512
    - aes256-null
    - aes256-md5
    - aes256-sha1
    - aes256-sha256
    - aes256-sha384
    - aes256-sha512
    - aes256gcm
    - chacha20poly1305
    - aria128-null
    - aria128-md5
    - aria128-sha1
    - aria128-sha256
    - aria128-sha384
    - aria128-sha512
    - aria192-null
    - aria192-md5
    - aria192-sha1
    - aria192-sha256
    - aria192-sha384
    - aria192-sha512
    - aria256-null
    - aria256-md5
    - aria256-sha1
    - aria256-sha256
    - aria256-sha384
    - aria256-sha512
    - seed-null
    - seed-md5
    - seed-sha1
    - seed-sha256
    - seed-sha384
    - seed-sha512
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase2 proposal.
  pfs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable PFS feature.
  dhgrp:
    type: enum
    raw_type: list
    choices:
