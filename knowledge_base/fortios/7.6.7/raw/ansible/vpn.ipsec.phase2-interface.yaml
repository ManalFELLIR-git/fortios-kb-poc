  diffservcode:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.4
      - ''
    description: DSCP value to be applied to the IPsec tunnel outer IP header.
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Quick mode protocol selector (1 - 255 or 0 for all).
  src_name:
    type: string
    raw_type: string
    version_ranges:
