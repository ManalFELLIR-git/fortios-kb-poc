    - '2'
    - '5'
    - '14'
    - '15'
    - '16'
    - '17'
    - '18'
    - '19'
    - '20'
    - '21'
    - '27'
    - '28'
    - '29'
    - '30'
    - '31'
    - '32'
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase2 DH group.
  addke1:
    type: enum
    raw_type: list
    choices:
    - none
    - ml-kem-512
    - ml-kem-768
    - ml-kem-1024
    - kyber512
    - kyber768
    - kyber1024
