  inbound_dscp_copy:
    type: enum
    raw_type: string
    choices:
    - phase1
    - enable
    - disable
    version_ranges:
    - - v7.0.6
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable copying of the DSCP in the ESP header to the inner IP header.
  auto_discovery_sender:
    type: enum
    raw_type: string
    choices:
    - phase1
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending short-cut messages.
  auto_discovery_forwarder:
    type: enum
    raw_type: string
    choices:
    - phase1
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable forwarding short-cut messages.
  keylifeseconds:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase2 key life in time in seconds (120 - 172800).
  keylifekbs:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Phase2 key life in number of kilobytes of traffic (5120 - 4294967295).
  keylife_type:
    type: enum
    raw_type: string
    choices:
    - seconds
    - kbs
    - both
    version_ranges:
    - - v6.0.0
      - ''
