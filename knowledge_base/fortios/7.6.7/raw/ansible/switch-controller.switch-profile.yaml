id: switch-controller.switch-profile
version: 7.6.7
source_object: fortios_switch_controller_switch_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_switch_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch Profile name.
  login_passwd_override:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable overriding the admin administrator password for a managed FortiSwitch with the FortiGate admin
      administrator account password.
  login_passwd:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Login password of managed FortiSwitch.
  login:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable FortiSwitch serial console.
  revision_backup_on_logout:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable automatic revision backup upon logout from FortiSwitch.
  revision_backup_on_upgrade:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable automatic revision backup upon FortiSwitch image upgrade.
