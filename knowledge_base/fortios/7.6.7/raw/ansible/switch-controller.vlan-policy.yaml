id: switch-controller.vlan-policy
version: 7.6.7
source_object: fortios_switch_controller_vlan_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_vlan_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: VLAN policy name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Description for the VLAN policy.
  fortilink:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: FortiLink interface for which this VLAN policy belongs to. Source system.interface.name.
    references:
    - system.interface.name
  vlan:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Native VLAN to be applied when using this VLAN policy. Source system.interface.name.
    references:
    - system.interface.name
  allowed_vlans:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Allowed VLANs to be applied when using this VLAN policy.
    children:
      vlan_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: VLAN name. Source system.interface.name.
        references:
        - system.interface.name
  untagged_vlans:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Untagged VLANs to be applied when using this VLAN policy.
    children:
      vlan_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: VLAN name. Source system.interface.name.
        references:
        - system.interface.name
  allowed_vlans_all:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable all defined VLANs when using this VLAN policy.
  discard_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - all-untagged
    - all-tagged
    version_ranges:
    - - v6.4.0
      - ''
    description: Discard mode to be applied when using this VLAN policy.
