id: system.sdn-proxy
version: 7.6.7
source_object: fortios_system_sdn_proxy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_sdn_proxy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.0
      - ''
    description: SDN proxy name.
  type:
    type: enum
    raw_type: string
    choices:
    - general
    - fortimanager
    version_ranges:
    - - v7.4.0
      - ''
    description: Type of SDN proxy.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Server address of the SDN proxy.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Port number of the SDN proxy.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: SDN proxy username.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: SDN proxy password.
