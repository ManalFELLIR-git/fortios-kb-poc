id: icap.server
version: 7.6.7
source_object: fortios_icap_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_icap_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Server name.
  addr_type:
    type: enum
    raw_type: string
    choices:
    - ip4
    - ip6
    - fqdn
    version_ranges:
    - - v7.2.0
      - ''
    description: 'Address type of the remote ICAP server: IPv4, IPv6 or FQDN.'
  ip_address:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address of the ICAP server.
  ip6_address:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address of the ICAP server.
  fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: ICAP remote server Fully Qualified Domain Name (FQDN).
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: ICAP server port.
  max_connections:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of concurrent connections to ICAP server (unlimited = 0). Must not be less than wad-worker-count.
  secure:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable secure connection to ICAP server.
  ssl_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: CA certificate name. Source certificate.ca.name.
    references:
    - certificate.ca.name
  healthcheck:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable ICAP remote server health checking. Attempts to connect to the remote ICAP server to verify
      that the server is operating normally.
  healthcheck_service:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: ICAP Service name to use for health checks.
