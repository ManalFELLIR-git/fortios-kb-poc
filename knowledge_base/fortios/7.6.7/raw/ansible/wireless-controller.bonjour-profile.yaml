id: wireless-controller.bonjour-profile
version: 7.6.7
source_object: fortios_wireless_controller_bonjour_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_bonjour_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Bonjour profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  micro_location:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable Micro location for Bonjour profile .
  policy_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Bonjour policy list.
    children:
      policy_id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Policy ID. see <a href='#notes'>Notes</a>.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Description.
      from_vlan:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: VLAN ID from which the Bonjour service is advertised (0 - 4094).
      to_vlan:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: VLAN ID to which the Bonjour service is made available (0 - 4094).
      services:
        type: enum
        raw_type: list
        choices:
        - all
        - airplay
        - afp
        - bit-torrent
        - ftp
        - ichat
        - itunes
        - printers
        - samba
        - scanners
        - ssh
        - chromecast
        - miracast
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Bonjour services for the VLAN connecting to the Bonjour network.
