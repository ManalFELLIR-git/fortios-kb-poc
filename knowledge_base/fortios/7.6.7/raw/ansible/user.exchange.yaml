id: user.exchange
version: 7.6.7
source_object: fortios_user_exchange
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_exchange.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: MS Exchange server entry name.
  server_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: MS Exchange server hostname.
  domain_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: MS Exchange server fully qualified domain name.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: User name used to sign in to the server. Must have proper permissions for service.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Password for the specified username.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Server IPv4 address.
  connect_protocol:
    type: enum
    raw_type: string
    choices:
    - rpc-over-tcp
    - rpc-over-http
    - rpc-over-https
    version_ranges:
    - - v6.2.0
      - ''
    description: Connection protocol used to connect to MS Exchange service.
  validate_server_certificate:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable exchange server certificate validation.
  auth_type:
    type: enum
    raw_type: string
    choices:
    - spnego
    - ntlm
    - kerberos
    version_ranges:
    - - v6.2.0
      - ''
    description: Authentication security type used for the RPC protocol layer.
  auth_level:
    type: enum
    raw_type: string
    choices:
    - connect
    - call
    - packet
    - integrity
    - privacy
    version_ranges:
    - - v6.2.0
      - ''
    description: Authentication security level used for the RPC protocol layer.
  http_auth_type:
    type: enum
    raw_type: string
    choices:
    - basic
    - ntlm
    version_ranges:
    - - v6.2.0
      - ''
    description: Authentication security type used for the HTTP transport.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.2.0
      - ''
    description: Minimum SSL/TLS protocol version for HTTPS transport .
  auto_discover_kdc:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable automatic discovery of KDC IP addresses.
  kdc_ip:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: KDC IPv4 addresses for Kerberos authentication.
    children:
      ipv4:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: KDC IPv4 addresses for Kerberos authentication.
