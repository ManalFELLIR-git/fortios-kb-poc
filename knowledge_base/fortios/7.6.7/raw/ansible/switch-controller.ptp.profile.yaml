id: switch-controller.ptp.profile
version: 7.6.7
source_object: fortios_switch_controller_ptp_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_ptp_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.1
      - ''
    description: Profile name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Description.
  mode:
    type: enum
    raw_type: string
    choices:
    - transparent-e2e
    - transparent-p2p
    version_ranges:
    - - v7.4.1
      - ''
    description: Select PTP mode.
  ptp_profile:
    type: enum
    raw_type: string
    choices:
    - C37.238-2017
    version_ranges:
    - - v7.4.1
      - ''
    description: Configure PTP power profile.
  transport:
    type: enum
    raw_type: string
    choices:
    - l2-mcast
    version_ranges:
    - - v7.4.1
      - ''
    description: Configure PTP transport mode.
  domain:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Configure PTP domain value (0 - 255).
  pdelay_req_interval:
    type: enum
    raw_type: string
    choices:
    - 1sec
    - 2sec
    - 4sec
    - 8sec
    - 16sec
    - 32sec
    version_ranges:
    - - v7.4.1
      - ''
    description: Configure PTP peer delay request interval.
