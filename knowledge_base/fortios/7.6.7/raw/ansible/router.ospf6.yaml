id: router.ospf6
version: 7.6.7
source_object: fortios_router_ospf6
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_ospf6.py
root_type: object
attributes:
  abr_type:
    type: enum
    raw_type: string
    choices:
    - cisco
    - ibm
    - standard
    version_ranges:
    - - v6.0.0
      - ''
    description: Area border router type.
  auto_cost_ref_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Reference bandwidth in terms of megabits per second.
  default_information_originate:
    type: enum
    raw_type: string
    choices:
    - enable
    - always
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable generation of default route.
  log_neighbour_changes:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Log OSPFv3 neighbor changes.
  default_information_metric:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information metric.
  default_information_metric_type:
    type: enum
    raw_type: string
    choices:
    - '1'
    - '2'
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information metric type.
  default_information_route_map:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information route map. Source router.route-map.name.
    references:
    - router.route-map.name
  default_metric:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default metric of redistribute routes.
  router_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: A.B.C.D, in IPv4 address format.
  spf_timers:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SPF calculation frequency.
  bfd:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Bidirectional Forwarding Detection (BFD).
  restart_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - graceful-restart
    version_ranges:
    - - v7.2.0
      - ''
    description: OSPFv3 restart mode (graceful or none).
  restart_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Graceful restart period in seconds.
  restart_on_topology_change:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable continuing graceful restart upon topology change.
  area:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF6 area configuration.
    children:
      id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Area entry IP address.
      default_cost:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Summary default cost of stub or NSSA area.
      nssa_translator_role:
        type: enum
        raw_type: string
        choices:
        - candidate
        - never
        - always
        version_ranges:
        - - v6.0.0
          - ''
        description: NSSA translator role type.
      stub_type:
        type: enum
        raw_type: string
        choices:
        - no-summary
        - summary
        version_ranges:
        - - v6.0.0
          - ''
        description: Stub summary setting.
      type:
        type: enum
        raw_type: string
        choices:
        - regular
        - nssa
        - stub
        version_ranges:
        - - v6.0.0
          - ''
        description: Area type setting.
      nssa_default_information_originate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable originate type 7 default into NSSA area.
      nssa_default_information_originate_metric:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPFv3 default metric.
      nssa_default_information_originate_metric_type:
        type: enum
        raw_type: string
        choices:
        - '1'
        - '2'
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPFv3 metric type for default routes.
      nssa_redistribution:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable redistribute into NSSA area.
      authentication:
        type: enum
        raw_type: string
        choices:
        - none
        - ah
        - esp
        version_ranges:
        - - v6.2.0
          - ''
        description: Authentication mode.
      key_rollover_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Key roll-over interval.
      ipsec_auth_alg:
        type: enum
        raw_type: string
        choices:
        - md5
        - sha1
        - sha256
        - sha384
        - sha512
        version_ranges:
        - - v6.2.0
          - ''
        description: Authentication algorithm.
      ipsec_enc_alg:
        type: enum
        raw_type: string
        choices:
        - 'null'
        - des
        - 3des
        - aes128
        - aes192
        - aes256
        version_ranges:
        - - v6.2.0
          - ''
        description: Encryption algorithm.
      ipsec_keys:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: IPsec authentication and encryption keys.
        children:
          spi:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Security Parameters Index. see <a href='#notes'>Notes</a>.
          auth_key:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Authentication key.
          enc_key:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Encryption key.
      range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF6 area range configuration.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Range entry ID. see <a href='#notes'>Notes</a>.
          prefix6:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: IPv6 prefix.
          advertise:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable advertise status.
      virtual_link:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF6 virtual link configuration.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Virtual link entry name.
          dead_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Dead interval.
          hello_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Hello interval.
          retransmit_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Retransmit interval.
          transmit_delay:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Transmit delay.
          peer:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: A.B.C.D, peer router ID.
          authentication:
            type: enum
            raw_type: string
            choices:
            - none
            - ah
            - esp
            - area
            version_ranges:
            - - v6.2.0
              - ''
            description: Authentication mode.
          key_rollover_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Key roll-over interval.
          ipsec_auth_alg:
            type: enum
            raw_type: string
            choices:
            - md5
            - sha1
            - sha256
            - sha384
            - sha512
            version_ranges:
            - - v6.2.0
              - ''
            description: Authentication algorithm.
          ipsec_enc_alg:
            type: enum
            raw_type: string
            choices:
            - 'null'
            - des
            - 3des
            - aes128
            - aes192
            - aes256
            version_ranges:
            - - v6.2.0
              - ''
            description: Encryption algorithm.
          ipsec_keys:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.2.0
              - ''
            description: IPsec authentication and encryption keys.
            children:
              spi:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v6.2.0
                  - ''
                description: Security Parameters Index. see <a href='#notes'>Notes</a>.
              auth_key:
                type: string
                raw_type: string
                version_ranges:
                - - v6.2.0
                  - ''
                description: Authentication key.
              enc_key:
                type: string
                raw_type: string
                version_ranges:
                - - v6.2.0
                  - ''
                description: Encryption key.
  ospf6_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF6 interface configuration.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface entry name.
      area_id:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: A.B.C.D, in IPv4 address format.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Configuration interface name. Source system.interface.name.
        references:
        - system.interface.name
      retransmit_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Retransmit interval.
      transmit_delay:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Transmit delay.
      cost:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Cost of the interface, value range from 0 to 65535, 0 means auto-cost.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Priority.
      dead_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Dead interval.
      hello_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Hello interval.
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable OSPF6 routing on this interface.
      network_type:
        type: enum
        raw_type: string
        choices:
        - broadcast
        - point-to-point
        - non-broadcast
        - point-to-multipoint
        - point-to-multipoint-non-broadcast
        version_ranges:
        - - v6.0.0
          - ''
        description: Network type.
      bfd:
        type: enum
        raw_type: string
        choices:
        - global
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable Bidirectional Forwarding Detection (BFD).
      mtu:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: MTU for OSPFv3 packets.
      mtu_ignore:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable ignoring MTU field in DBD packets.
      authentication:
        type: enum
        raw_type: string
        choices:
        - none
        - ah
        - esp
        - area
        version_ranges:
        - - v6.2.0
          - ''
        description: Authentication mode.
      key_rollover_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Key roll-over interval.
      ipsec_auth_alg:
        type: enum
        raw_type: string
        choices:
        - md5
        - sha1
        - sha256
        - sha384
        - sha512
        version_ranges:
        - - v6.2.0
          - ''
        description: Authentication algorithm.
      ipsec_enc_alg:
        type: enum
        raw_type: string
        choices:
        - 'null'
        - des
        - 3des
        - aes128
        - aes192
        - aes256
        version_ranges:
        - - v6.2.0
          - ''
        description: Encryption algorithm.
      ipsec_keys:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: IPsec authentication and encryption keys.
        children:
          spi:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Security Parameters Index. see <a href='#notes'>Notes</a>.
          auth_key:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Authentication key.
          enc_key:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Encryption key.
      neighbor:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPFv3 neighbors are used when OSPFv3 runs on non-broadcast media.
        children:
          ip6:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: IPv6 link local address of the neighbor.
          poll_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Poll interval time in seconds.
          cost:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Cost of the interface, value range from 0 to 65535, 0 means auto-cost.
          priority:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Priority.
  passive_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Passive interface configuration.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Passive interface name. Source system.interface.name.
        references:
        - system.interface.name
  summary_address:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address summary configuration.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Summary address entry ID. see <a href='#notes'>Notes</a>.
      prefix6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 prefix.
      advertise:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise status.
      tag:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Tag value.
