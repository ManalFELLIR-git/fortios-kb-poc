id: virtual-patch.profile
version: 7.6.7
source_object: fortios_virtual_patch_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_virtual_patch_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.1
      - ''
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Comment.
  severity:
    type: enum
    raw_type: list
    choices:
    - info
    - low
    - medium
    - high
    - critical
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.1
      - ''
    description: Relative severity of the signature (low, medium, high, critical).
  action:
    type: enum
    raw_type: string
    choices:
    - pass
    - block
    version_ranges:
    - - v7.4.1
      - ''
    description: Action (pass/block).
  log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable logging of detection.
  exemption:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: Exempt devices or rules.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: IDs. see <a href='#notes'>Notes</a>.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable exemption.
      rule:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: Patch signature rule IDs.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: Rule IDs. see <a href='#notes'>Notes</a>.
      device:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: Device MAC addresses.
        children:
          mac:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: Device MAC address.
