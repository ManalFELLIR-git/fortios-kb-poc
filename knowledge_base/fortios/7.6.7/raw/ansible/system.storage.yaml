id: system.storage
version: 7.6.7
source_object: fortios_system_storage
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_storage.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Storage name.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable storage.
  media_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    - fail
    version_ranges:
    - - v6.0.0
      - ''
    description: The physical status of current media.
  order:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Set storage order.
  partition:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Label of underlying partition.
  device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Partition device.
  size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Partition size.
  usage:
    type: enum
    raw_type: string
    choices:
    - log
    - wanopt
    version_ranges:
    - - v6.0.0
      - ''
    description: Use hard disk for logging or WAN Optimization .
  wanopt_mode:
    type: enum
    raw_type: string
    choices:
    - mix
    - wanopt
    - webcache
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: WAN Optimization mode .
