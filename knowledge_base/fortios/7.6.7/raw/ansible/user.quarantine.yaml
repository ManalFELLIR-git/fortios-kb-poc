id: user.quarantine
version: 7.6.7
source_object: fortios_user_quarantine
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_quarantine.py
root_type: object
attributes:
  quarantine:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable quarantine.
  traffic_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Traffic policy for quarantined MACs. Source switch-controller.traffic-policy.name.
    references:
    - switch-controller.traffic-policy.name
  firewall_groups:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Firewall address group which includes all quarantine MAC address. Source firewall.addrgrp.name.
    references:
    - firewall.addrgrp.name
  targets:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Quarantine entry to hold multiple MACs.
    children:
      entry:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Quarantine entry name.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Description for the quarantine entry.
      macs:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Quarantine MACs.
        children:
          mac:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Quarantine MAC.
          description:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Description for the quarantine MAC.
          drop:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v6.4.0
              - ''
            description: Enable/disable dropping of quarantined device traffic.
