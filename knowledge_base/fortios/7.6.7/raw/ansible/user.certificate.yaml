id: user.certificate
version: 7.6.7
source_object: fortios_user_certificate
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_certificate.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.1
      - ''
    description: User name.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable allowing the certificate user to authenticate with the FortiGate unit.
  type:
    type: enum
    raw_type: string
    choices:
    - single-certificate
    - trusted-issuer
    version_ranges:
    - - v7.0.1
      - ''
    description: Type of certificate authentication method.
  common_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Certificate common name.
  issuer:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: CA certificate used for client certificate verification. Source vpn.certificate.ca.name vpn.certificate.local.name.
    references:
    - vpn.certificate.ca.name
    - vpn.certificate.local.name
