id: switch-controller.security-policy.802-1X
version: 7.6.7
source_object: fortios_switch_controller_security_policy_802_1x
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_security_policy_802_1x.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy name.
  security_mode:
    type: enum
    raw_type: string
    choices:
    - 802.1X
    - 802.1X-mac-based
    version_ranges:
    - - v6.0.0
      - ''
    description: Port or MAC based 802.1X security mode.
  user_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of user-group to assign to this MAC Authentication Bypass (MAB) policy.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Group name. Source user.group.name.
        references:
        - user.group.name
  mac_auth_bypass:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable MAB for this policy.
  auth_order:
    type: enum
    raw_type: string
    choices:
    - dot1x-mab
    - mab-dot1x
    - mab
    version_ranges:
    - - v7.6.0
      - ''
    description: Configure authentication order.
  auth_priority:
    type: enum
    raw_type: string
    choices:
    - legacy
    - dot1x-mab
    - mab-dot1x
    version_ranges:
    - - v7.6.0
      - ''
    description: Configure authentication priority.
  open_auth:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable open authentication for this policy.
  eap_passthru:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable EAP pass-through mode, allowing protocols (such as LLDP) to pass through ports for more flexible
      authentication.
  eap_auto_untagged_vlans:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable automatic inclusion of untagged VLANs.
  guest_vlan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable the guest VLAN feature to allow limited access to non-802.1X-compliant clients.
  guest_vlan_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Guest VLAN name. Source system.interface.name.
    references:
    - system.interface.name
  guest_auth_delay:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Guest authentication delay (1 - 900  sec).
  auth_fail_vlan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to allow limited access to clients that cannot authenticate.
  auth_fail_vlan_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: VLAN ID on which authentication failed. Source system.interface.name.
    references:
    - system.interface.name
  framevid_apply:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable the capability to apply the EAP/MAB frame VLAN to the port native VLAN.
  radius_timeout_overwrite:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to override the global RADIUS session timeout.
  policy_type:
    type: enum
    raw_type: string
    choices:
    - 802.1X
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy type.
  authserver_timeout_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.4
      - ''
    description: Authentication server timeout period (3 - 15 sec).
  authserver_timeout_vlan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.4
      - ''
    description: Enable/disable the authentication server timeout VLAN to allow limited access when RADIUS is unavailable.
  authserver_timeout_vlanid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.4
      - ''
    description: Authentication server timeout VLAN name. Source system.interface.name.
    references:
    - system.interface.name
  authserver_timeout_tagged:
    type: enum
    raw_type: string
    choices:
    - disable
    - lldp-voice
    - static
    version_ranges:
    - - v7.4.4
      - ''
    description: Configure timeout option for the tagged VLAN which allows limited access when the authentication server is
      unavailable.
  authserver_timeout_tagged_vlanid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Tagged VLAN name for which the timeout option is applied to (only one VLAN ID). Source system.interface.name.
    references:
    - system.interface.name
  dacl:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable dynamic access control list on this interface.
