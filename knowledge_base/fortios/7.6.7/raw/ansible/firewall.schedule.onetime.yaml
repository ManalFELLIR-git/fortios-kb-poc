id: firewall.schedule.onetime
version: 7.6.7
source_object: fortios_firewall_schedule_onetime
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_schedule_onetime.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Onetime schedule name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  fabric_object:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Security Fabric global object setting.
  start:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule start date and time, format hh:mm yyyy/mm/dd.
  start_utc:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Schedule start date and time, in epoch format.
  end:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule end date and time, format hh:mm yyyy/mm/dd.
  end_utc:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Schedule end date and time, in epoch format.
  color:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Color of icon on the GUI.
  expiration_days:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Write an event log message this many days before the schedule expires.
