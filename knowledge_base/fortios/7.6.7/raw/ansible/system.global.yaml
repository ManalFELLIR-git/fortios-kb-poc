id: system.global
version: 7.6.7
source_object: fortios_system_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_global.py
root_type: object
attributes:
  language:
    type: enum
    raw_type: string
    choices:
    - english
    - french
    - spanish
    - portuguese
    - japanese
    - trach
    - simch
    - korean
    version_ranges:
    - - v6.0.0
      - ''
    description: GUI display language.
  gui_allow_incompatible_fabric_fgt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.12
      - v7.0.12
    - - v7.2.1
      - ''
    description: Enable/disable Allow FGT with incompatible firmware to be treated as compatible in security fabric on the
      GUI. May cause unexpected error.
  gui_ipv6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPv6 settings on the GUI.
  gui_replacement_message_groups:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable replacement message groups on the GUI.
  gui_local_out:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable Local-out traffic on the GUI.
  gui_certificates:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the System > Certificate GUI page, allowing you to add and configure certificates from the
      GUI.
  gui_custom_language:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable custom languages in GUI.
  gui_wireless_opensecurity:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable wireless open security option on the GUI.
  gui_app_detection_sdwan:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable Allow app-detection based SD-WAN.
  gui_display_hostname:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable displaying the FortiGate"s hostname on the GUI login page.
  gui_fortigate_cloud_sandbox:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable displaying FortiGate Cloud Sandbox on the GUI.
  gui_firmware_upgrade_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable the firmware upgrade warning on the GUI.
  gui_forticare_registration_setup_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.4
      - ''
    description: Enable/disable the FortiCare registration setup warning on the GUI.
  gui_auto_upgrade_setup_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable the automatic patch upgrade setup prompt on the GUI.
  gui_workflow_management:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable Workflow management features on the GUI.
  gui_cdn_usage:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable Load GUI static files from a CDN.
  admin_https_ssl_versions:
    type: enum
    raw_type: list
    choices:
    - tlsv1-1
    - tlsv1-2
    - tlsv1-3
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Allowed TLS versions for web administration.
  admin_https_ssl_ciphersuites:
    type: enum
    raw_type: list
    choices:
    - TLS-AES-128-GCM-SHA256
    - TLS-AES-256-GCM-SHA384
    - TLS-CHACHA20-POLY1305-SHA256
    - TLS-AES-128-CCM-SHA256
    - TLS-AES-128-CCM-8-SHA256
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.2
      - ''
    description: Select one or more TLS 1.3 ciphersuites to enable. Does not affect ciphers in TLS 1.2 and below. At least
      one must be enabled. To disable all, remove TLS1.3 from admin-https-ssl-versions.
  admin_https_ssl_banned_ciphers:
    type: enum
    raw_type: list
    choices:
    - RSA
    - DHE
    - ECDHE
    - DSS
    - ECDSA
    - AES
    - AESGCM
    - CAMELLIA
    - 3DES
    - SHA1
    - SHA256
    - SHA384
    - STATIC
    - CHACHA20
    - ARIA
    - AESCCM
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.2
      - ''
    description: Select one or more cipher technologies that cannot be used in GUI HTTPS negotiations. Only applies to TLS
      1.2 and below.
  admintimeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of minutes before an idle administrator session times out (1 - 480 minutes (8 hours)). A shorter idle
      timeout is more secure.
  admin_console_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Console login timeout that overrides the admin timeout value (15 - 300 seconds).
  ssd_trim_freq:
    type: enum
    raw_type: string
    choices:
    - never
    - hourly
    - daily
    - weekly
    - monthly
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: How often to run SSD Trim . SSD Trim prevents SSD drive data loss by finding and isolating errors.
  ssd_trim_hour:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Hour of the day on which to run SSD Trim (0 - 23).
  ssd_trim_min:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Minute of the hour on which to run SSD Trim (0 - 59, 60 for random).
  ssd_trim_weekday:
    type: enum
    raw_type: string
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Day of week to run SSD Trim.
  ssd_trim_date:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Date within a month to run ssd trim.
  admin_concurrent:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable concurrent administrator logins. Use policy-auth-concurrent for firewall authenticated users.
  admin_lockout_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of failed login attempts before an administrator account is locked out for the admin-lockout-duration.
  admin_lockout_duration:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Amount of time in seconds that an administrator account is locked out after reaching the admin-lockout-threshold
      for repeated failed login attempts.
  refresh:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Statistics refresh interval second(s) in GUI.
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Dead gateway detection interval.
  failtime:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Fail-time for server lost.
  purdue_level:
    type: enum
    raw_type: string
    choices:
    - '1'
    - '1.5'
    - '2'
    - '2.5'
    - '3'
    - '3.5'
    - '4'
    - '5'
    - '5.5'
    version_ranges:
    - - v7.4.2
      - ''
    description: Purdue Level of this FortiGate.
  daily_restart:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable daily restart of FortiGate unit. Use the restart-time option to set the time of day for the
      restart.
  restart_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Daily restart time (hh:mm).
  wad_restart_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - time
    - memory
    version_ranges:
    - - v7.2.4
      - ''
    description: WAD worker restart mode .
  wad_restart_start_time:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: WAD workers daily restart time (hh:mm).
  wad_restart_end_time:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: WAD workers daily restart end time (hh:mm).
  wad_p2s_max_body_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Maximum size of the body of the local out HTTP request (1 - 32 Mbytes).
  radius_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: RADIUS service port number.
  speedtestd_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Speedtest server port number.
  speedtestd_ctrl_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Speedtest server controller port number.
  admin_login_max:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of administrators who can be logged in at the same time (1 - 100).
  remoteauthtimeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of seconds that the FortiGate waits for responses from remote RADIUS, LDAP, or TACACS+ authentication
      servers. (1-300 sec).
  ldapconntimeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Global timeout for connections with remote LDAP servers in milliseconds (1 - 300000).
  batch_cmdb:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable batch mode, allowing you to enter a series of CLI commands that will execute as a group once
      they are loaded.
  multi_factor_authentication:
    type: enum
    raw_type: string
    choices:
    - optional
    - mandatory
    version_ranges:
    - - v6.0.0
      - ''
    description: Enforce all login methods to require an additional authentication factor .
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  autorun_log_fsck:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable automatic log partition check after ungraceful shutdown.
  timezone:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Timezone database name. Enter ? to view the list of timezone. Source system.timezone.name.
    references:
    - system.timezone.name
  traffic_priority:
    type: enum
    raw_type: string
    choices:
    - tos
    - dscp
    version_ranges:
    - - v6.0.0
      - ''
    description: Choose Type of Service (ToS) or Differentiated Services Code Point (DSCP) for traffic prioritization in traffic
      shaping.
  traffic_priority_level:
    type: enum
    raw_type: string
    choices:
    - low
    - medium
    - high
    version_ranges:
    - - v6.0.0
      - ''
    description: Default system-wide level of priority for traffic prioritization.
  quic_congestion_control_algo:
    type: enum
    raw_type: string
    choices:
    - cubic
    - bbr
    - bbr2
    - reno
    version_ranges:
    - - v7.4.1
      - ''
    description: QUIC congestion control algorithm .
  quic_max_datagram_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Maximum transmit datagram size (1200 - 1500).
  quic_udp_payload_size_shaping_per_cid:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable UDP payload size shaping per connection ID .
  quic_ack_thresold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Maximum number of unacknowledged packets before sending ACK (2 - 5).
  quic_pmtud:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable path MTU discovery .
  quic_tls_handshake_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Time-to-live (TTL) for TLS handshake in seconds (1 - 60).
  anti_replay:
    type: enum
    raw_type: string
    choices:
    - disable
    - loose
    - strict
    version_ranges:
    - - v6.0.0
      - ''
    description: Level of checking for packet replay and TCP sequence checking.
  send_pmtu_icmp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending of path maximum transmission unit (PMTU) - ICMP destination unreachable packet and
      to support PMTUD protocol on your network to reduce fragmentation of packets.
  honor_df:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable honoring of Don"t-Fragment (DF) flag.
  pmtu_discovery:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable path MTU discovery.
  revision_image_auto_backup:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable back-up of the latest image revision after the firmware is upgraded.
  revision_backup_on_logout:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable back-up of the latest configuration revision when an administrator logs out of the CLI or
      GUI.
  management_vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Management virtual domain name. Source system.vdom.name.
    references:
    - system.vdom.name
  hostname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiGate unit"s hostname. Most models will truncate names longer than 24 characters. Some models support
      hostnames up to 35 characters.
  alias:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Alias for your FortiGate unit.
  strong_crypto:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to use strong encryption and only allow strong ciphers and digest for HTTPS/SSH/TLS/SSL functions.
  ssl_static_key_ciphers:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable static key ciphers in SSL/TLS connections (e.g. AES128-SHA, AES256-SHA, AES128-SHA256, AES256-SHA256).
  snat_route_change:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the ability to change the source NAT route.
  ipv6_snat_route_change:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable the ability to change the IPv6 source NAT route.
  speedtest_server:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable speed test server.
  cli_audit_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable CLI audit log.
  dh_params:
    type: enum
    raw_type: string
    choices:
    - '1024'
    - '1536'
    - '2048'
    - '3072'
    - '4096'
    - '6144'
    - '8192'
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of bits to use in the Diffie-Hellman exchange for HTTPS/SSH protocols.
  fds_statistics:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending IPS, Application Control, and AntiVirus data to FortiGuard. This data is used to improve
      FortiGuard services and is not shared with external parties and is protected by Fortinet"s privacy policy.
  fds_statistics_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiGuard statistics collection period in minutes. (1 - 1440 min (1 min to 24 hours)).
  tcp_option:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable SACK, timestamp and MSS TCP options.
  lldp_transmission:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Link Layer Discovery Protocol (LLDP) transmission.
  lldp_reception:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable Link Layer Discovery Protocol (LLDP) reception.
  proxy_auth_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication timeout in minutes for authenticated users (1 - 10000 min).
  proxy_keep_alive_mode:
    type: enum
    raw_type: string
    choices:
    - session
    - traffic
    - re-authentication
    version_ranges:
    - - v7.2.4
      - ''
    description: Control if users must re-authenticate after a session is closed, traffic has been idle, or from the point
      at which the user was authenticated.
  proxy_re_authentication_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.4
      - ''
    description: The time limit that users must re-authenticate if proxy-keep-alive-mode is set to re-authenticate (1  - 86400
      sec, default=30s.
  proxy_auth_lifetime:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable authenticated users lifetime control. This is a cap on the total time a proxy user can be
      authenticated for after which re-authentication will take place.
  proxy_auth_lifetime_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Lifetime timeout in minutes for authenticated users (5  - 65535 min).
  proxy_resource_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable use of the maximum memory usage on the FortiGate unit"s proxy processing of resources, such
      as block lists, allow lists, and external resources.
  proxy_cert_use_mgmt_vdom:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable using management VDOM to send requests.
  sys_perf_log_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in minutes between updates of performance statistics logging. (1 - 15 min).
  check_protocol_header:
    type: enum
    raw_type: string
    choices:
    - loose
    - strict
    version_ranges:
    - - v6.0.0
      - ''
    description: Level of checking performed on protocol headers. Strict checking is more thorough but may affect performance.
      Loose checking is OK in most cases.
  vip_arp_range:
    type: enum
    raw_type: string
    choices:
    - unlimited
    - restricted
    version_ranges:
    - - v6.0.0
      - ''
    description: Controls the number of ARPs that the FortiGate sends for a Virtual IP (VIP) address range.
  reset_sessionless_tcp:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Action to perform if the FortiGate receives a TCP packet but cannot find a corresponding session in its session
      table. NAT/Route mode only.
  allow_traffic_redirect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Disable to prevent traffic with same local ingress and egress interface from being forwarded without policy
      check.
  ipv6_allow_traffic_redirect:
    type: enum
    raw_type: string
    choices:
