id: log.fortianalyzer-cloud.setting
version: 7.6.7
source_object: fortios_log_fortianalyzer_cloud_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_fortianalyzer_cloud_setting.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Enable/disable logging to FortiAnalyzer Cloud.
  ips_archive:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Enable/disable IPS packet archive logging.
  certificate_verification:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable identity verification of FortiAnalyzer by use of certificate.
  serial:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.4
      - ''
    description: Serial numbers of the FortiAnalyzer.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.4
          - ''
        description: Serial Number.
  preshared_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Preshared-key used for auto-authorization on FortiAnalyzer.
  access_config:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable FortiAnalyzer access to configuration and data.
  hmac_algorithm:
    type: enum
    raw_type: string
    choices:
    - sha256
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: OFTP login hash algorithm.
  enc_algorithm:
    type: enum
    raw_type: string
    choices:
    - high-medium
    - high
    - low
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Configure the level of SSL protection for secure communication with FortiAnalyzer.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  conn_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: FortiAnalyzer connection time-out in seconds (for status and log buffer).
  monitor_keepalive_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Time between OFTP keepalives in seconds (for status and log buffer).
  monitor_failure_retry_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Time between FortiAnalyzer connection retries in seconds (for status and log buffer).
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Certificate used to communicate with FortiAnalyzer. Source certificate.local.name.
    references:
    - certificate.local.name
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Source IPv4 or IPv6 address used to communicate with FortiAnalyzer.
  upload_option:
    type: enum
    raw_type: string
    choices:
    - store-and-upload
    - realtime
    - 1-minute
    - 5-minute
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Enable/disable logging to hard disk and then uploading to FortiAnalyzer.
  upload_interval:
    type: enum
    raw_type: string
    choices:
    - daily
    - weekly
    - monthly
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Frequency to upload log files to FortiAnalyzer.
  upload_day:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Day of week (month) to upload logs.
  upload_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v6.0.0
    - - v6.0.11
      - ''
    description: Time to upload logs (hh:mm).
  priority:
    type: enum
    raw_type: string
    choices:
    - default
    - low
    version_ranges:
    - - v6.2.0
      - ''
    description: Set log transmission priority.
  max_log_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiAnalyzer maximum log rate in MBps (0 = unlimited).
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.7
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
