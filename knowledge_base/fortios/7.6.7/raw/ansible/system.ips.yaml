id: system.ips
version: 7.6.7
source_object: fortios_system_ips
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ips.py
root_type: object
attributes:
  signature_hold_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: 'Time to hold and monitor IPS signatures. Format <#d##h> (day range: 0 - 21, hour range: 0 - 23, max hold
      time: 21d0h).'
  override_signature_hold_by_id:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Enable/disable override of hold of triggering signatures that are specified by IDs regardless of hold.
