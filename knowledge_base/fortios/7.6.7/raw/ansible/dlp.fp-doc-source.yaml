id: dlp.fp-doc-source
version: 7.6.7
source_object: fortios_dlp_fp_doc_source
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_dlp_fp_doc_source.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the DLP fingerprint database.
  server_type:
    type: enum
    raw_type: string
    choices:
    - samba
    version_ranges:
    - - v6.0.0
      - ''
    description: Protocol used to communicate with the file server. Currently only Samba (SMB) servers are supported.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 or IPv6 address of the server.
  period:
    type: enum
    raw_type: string
    choices:
    - none
    - daily
    - weekly
    - monthly
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency for which the FortiGate checks the server for new or changed files.
  vdom:
    type: enum
    raw_type: string
    choices:
    - mgmt
    - current
    version_ranges:
    - - v6.0.0
      - ''
    description: Select the VDOM that can communicate with the file server.
  scan_subdirectories:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable scanning subdirectories to find files to create fingerprints from.
  scan_on_creation:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Initiate an immediate update of the fingerprint database after creating this fp-doc-source entry.
  remove_deleted:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to keep the fingerprint database up to date when a file is deleted from the server.
  keep_modified:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable so that when a file is changed on the server the FortiGate keeps the old fingerprint and adds a new
      fingerprint to the database.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User name required to log into the file server.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password required to log into the file server.
  file_path:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Path on the server to the fingerprint files (max 119 characters).
  file_pattern:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Files matching this pattern on the server are fingerprinted. Optionally use the * and ? wildcards.
  sensitivity:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Select a sensitivity or threat level for matches with this fingerprint database. Add sensitivities using
      sensitivity. Source dlp .sensitivity.name.
  tod_hour:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Hour of the day on which to scan the server (0 - 23).
  tod_min:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Minute of the hour on which to scan the server (0 - 59).
  weekday:
    type: enum
    raw_type: string
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of the week on which to scan the server.
  date:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of the month on which to scan the server (1 - 31).
