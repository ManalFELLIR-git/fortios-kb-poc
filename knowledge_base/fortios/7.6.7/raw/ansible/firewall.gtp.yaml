    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: send DELETE request to path endpoints when GTPv0/v1 tunnel timeout.
  send_delete_when_timeout_v2:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: send DELETE request to path endpoints when GTPv2 tunnel timeout.
  gtp_in_gtp:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: gtp in gtp
  unknown_version_action:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v6.0.0
