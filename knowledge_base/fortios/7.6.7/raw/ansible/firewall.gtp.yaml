id: firewall.gtp
version: 7.6.7
source_object: fortios_firewall_gtp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_gtp.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Comment.
  remove_if_echo_expires:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: remove if echo response expires
  remove_if_recovery_differ:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
