id: firewall.decrypted-traffic-mirror
version: 7.6.7
source_object: fortios_firewall_decrypted_traffic_mirror
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_decrypted_traffic_mirror.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: Name.
  dstmac:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Set destination MAC address for mirrored traffic.
  traffic_type:
    type: enum
    raw_type: list
    choices:
    - ssl
    - ssh
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.4.0
      - ''
    description: Types of decrypted traffic to be mirrored.
  traffic_source:
    type: enum
    raw_type: string
    choices:
    - client
    - server
    - both
    version_ranges:
    - - v6.4.0
      - ''
    description: Source of decrypted traffic to be mirrored.
  interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Decrypted traffic mirror interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Decrypted traffic mirror interface. Source system.interface.name.
        references:
        - system.interface.name
