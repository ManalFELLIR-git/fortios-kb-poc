id: vpn.ipsec.manualkey-interface
version: 7.6.7
source_object: fortios_vpn_ipsec_manualkey_interface
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_manualkey_interface.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPsec tunnel name.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the physical, aggregate, or VLAN interface. Source system.interface.name.
    references:
    - system.interface.name
  ip_version:
    type: enum
    raw_type: string
    choices:
    - '4'
    - '6'
    version_ranges:
    - - v6.0.0
      - ''
    description: IP version to use for VPN interface.
  addr_type:
    type: enum
    raw_type: string
    choices:
    - '4'
    - '6'
    version_ranges:
    - - v6.0.0
      - ''
    description: IP version to use for IP packets.
  remote_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address of the remote gateway"s external interface.
  remote_gw6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote IPv6 address of VPN gateway.
  local_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 address of the local gateway"s external interface.
  local_gw6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local IPv6 address of VPN gateway.
  auth_alg:
    type: enum
    raw_type: string
    choices:
    - 'null'
    - md5
    - sha1
    - sha256
    - sha384
    - sha512
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication algorithm. Must be the same for both ends of the tunnel.
  enc_alg:
    type: enum
    raw_type: string
    choices:
    - 'null'
    - des
    - 3des
    - aes128
    - aes192
    - aes256
    - aria128
    - aria192
    - aria256
    - seed
    version_ranges:
    - - v6.0.0
      - ''
    description: Encryption algorithm. Must be the same for both ends of the tunnel.
  auth_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hexadecimal authentication key in 16-digit (8-byte) segments separated by hyphens.
  enc_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hexadecimal encryption key in 16-digit (8-byte) segments separated by hyphens.
  local_spi:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
  remote_spi:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
  npu_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable offloading IPsec VPN manual key sessions to NPUs.
