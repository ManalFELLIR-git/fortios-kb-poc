id: antivirus.quarantine
version: 7.6.7
source_object: fortios_antivirus_quarantine
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_antivirus_quarantine.py
root_type: object
attributes:
  agelimit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Age limit for quarantined files (0 - 479 hours, 0 means forever).
  maxfilesize:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum file size to quarantine (0 - 500 Mbytes, 0 means unlimited).
  quarantine_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: The amount of disk space to reserve for quarantining files (0 - 4294967295 Mbytes, 0 means unlimited and
      depends on disk space).
  drop_infected:
    type: enum
    raw_type: list
    choices:
    - imap
    - smtp
    - pop3
    - http
    - ftp
    - nntp
    - imaps
    - smtps
    - pop3s
    - https
    - ftps
    - mapi
    - cifs
    - ssh
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Do not quarantine infected files found in sessions using the selected protocols. Dropped files are deleted
      instead of being quarantined.
  store_infected:
    type: enum
    raw_type: list
    choices:
    - imap
    - smtp
    - pop3
    - http
    - ftp
    - nntp
    - imaps
    - smtps
    - pop3s
    - https
    - ftps
    - mapi
    - cifs
    - ssh
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Quarantine infected files found in sessions using the selected protocols.
  drop_machine_learning:
    type: enum
    raw_type: list
    choices:
    - imap
    - smtp
    - pop3
    - http
    - ftp
    - nntp
    - imaps
    - smtps
    - pop3s
    - https
    - ftps
    - mapi
    - cifs
    - ssh
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.1
      - ''
    description: Do not quarantine files detected by machine learning found in sessions using the selected protocols. Dropped
      files are deleted instead of being quarantined.
  store_machine_learning:
    type: enum
    raw_type: list
    choices:
    - imap
    - smtp
    - pop3
    - http
    - ftp
    - nntp
    - imaps
    - smtps
    - pop3s
    - https
    - ftps
    - mapi
    - cifs
    - ssh
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.1
      - ''
    description: Quarantine files detected by machine learning found in sessions using the selected protocols.
  lowspace:
    type: enum
    raw_type: string
    choices:
    - drop-new
    - ovrw-old
    version_ranges:
    - - v6.0.0
      - ''
    description: Select the method for handling additional files when running low on disk space.
  destination:
    type: enum
    raw_type: string
    choices:
    - 'NULL'
    - disk
    - FortiAnalyzer
    version_ranges:
    - - v6.0.0
      - ''
    description: Choose whether to quarantine files to the FortiGate disk or to FortiAnalyzer or to delete them instead of
      quarantining them.
