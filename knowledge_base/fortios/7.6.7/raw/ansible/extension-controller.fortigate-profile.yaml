id: extension-controller.fortigate-profile
version: 7.6.7
source_object: fortios_extension_controller_fortigate_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_extension_controller_fortigate_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate connector profile name.
  id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: ID.
  lan_extension:
    type: object
    raw_type: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate connector LAN extension configuration.
    children:
      ipsec_tunnel:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: IPsec tunnel name.
      backhaul_interface:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: IPsec phase1 interface. Source system.interface.name.
        references:
        - system.interface.name
      backhaul_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: IPsec phase1 IPv4/FQDN. Used to specify the external IP/FQDN when the FortiGate unit is behind a NAT
          device.
