id: user.external-identity-provider
version: 7.6.7
source_object: fortios_user_external_identity_provider
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_external_identity_provider.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.2
      - ''
    description: External identity provider name.
  type:
    type: enum
    raw_type: string
    choices:
    - ms-graph
    version_ranges:
    - - v7.4.2
      - ''
    description: External identity provider type.
  version:
    type: enum
    raw_type: string
    choices:
    - v1.0
    - beta
    version_ranges:
    - - v7.4.2
      - ''
    description: External identity API version.
  user_attr_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: User attribute name in authentication query.
  group_attr_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Group attribute name in authentication query.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: External identity provider service port number (0 to use default).
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Use this IPv4/v6 address to connect to the external identity provider.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.4.2
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  server_identity_check:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable server"s identity check against its certificate and subject alternative name(s).
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Connection timeout value in seconds .
