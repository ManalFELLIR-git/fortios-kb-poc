id: extension-controller.extender-vap
version: 7.6.7
source_object: fortios_extension_controller_extender_vap
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_extension_controller_extender_vap.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi VAP name.
  type:
    type: enum
    raw_type: string
    choices:
    - local-vap
    - lan-ext-vap
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi VAP type local-vap / lan-extension-vap.
  ssid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi SSID.
  max_clients:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi maximum clients (0 - 512).
  broadcast_ssid:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable Wi-Fi broadcast SSID.
  security:
    type: enum
    raw_type: string
    choices:
    - OPEN
    - WPA2-Personal
    - WPA-WPA2-Personal
    - WPA3-SAE
    - WPA3-SAE-Transition
    - WPA2-Enterprise
    - WPA3-Enterprise-only
    - WPA3-Enterprise-transition
    - WPA3-Enterprise-192-bit
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi security.
  dtim:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi DTIM (1 - 255).
  rts_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi RTS threshold (256 - 2347).
  pmf:
    type: enum
    raw_type: string
    choices:
    - disabled
    - optional
    - required
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable Wi-Fi PMF .
  target_wake_time:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable Wi-Fi 802.11AX target wake time .
  bss_color_partial:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable Wi-Fi 802.11AX BSS color partial .
  mu_mimo:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable Wi-Fi multi-user MIMO .
  passphrase:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi passphrase.
  sae_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi SAE Password.
  auth_server_address:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi Authentication Server Address (IPv4 format).
  auth_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi Authentication Server Port.
  auth_server_secret:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Wi-Fi Authentication Server Secret.
  ip_address:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Extender IP address.
  start_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Start IP address.
  end_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: End IP address.
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - ping
    - telnet
    - http
    - https
    - ssh
    - snmp
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.4.4
      - ''
    description: Control management access to the managed extender. Separate entries with a space.
