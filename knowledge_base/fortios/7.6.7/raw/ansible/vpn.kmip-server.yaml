id: vpn.kmip-server
version: 7.6.7
source_object: fortios_vpn_kmip_server
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_kmip_server.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.0
      - ''
    description: KMIP server entry name.
  server_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: KMIP server list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: ID see <a href='#notes'>Notes</a>.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable KMIP server.
      server:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: KMIP server FQDN or IP address.
      port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.0
          - ''
        description: KMIP server port.
      cert:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.0
          - ''
        description: Client certificate to use for connectivity to the KMIP server. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: User name to use for connectivity to the KMIP server.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Password to use for connectivity to the KMIP server.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v7.4.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  server_identity_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable KMIP server identity check (verify server FQDN/IP address against the server certificate).
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.4.0
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: FortiGate IP address to be used for communication with the KMIP server.
