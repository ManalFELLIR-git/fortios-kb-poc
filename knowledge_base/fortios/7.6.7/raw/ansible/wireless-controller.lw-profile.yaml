id: wireless-controller.lw-profile
version: 7.6.7
source_object: fortios_wireless_controller_lw_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_lw_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.5
      - ''
    description: LoRaWAN profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: Comment.
  lw_protocol:
    type: enum
    raw_type: string
    choices:
    - basics-station
    - packet-forwarder
    version_ranges:
    - - v7.6.5
      - ''
    description: Configure LoRaWAN protocol
  cups_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: CUPS (Configuration and Update Server) domain name or IP address of LoRaWAN device.
  cups_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - ''
    description: CUPS Port value of LoRaWAN device.
  cups_api_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: CUPS API key of LoRaWAN device.
  tc_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: TC (Traffic Controller) domain name or IP address of LoRaWAN device.
  tc_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - ''
    description: TC Port value of LoRaWAN device.
  tc_api_key:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: TC API key of LoRaWAN device.
