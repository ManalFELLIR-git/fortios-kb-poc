id: webfilter.content-header
version: 7.6.7
source_object: fortios_webfilter_content_header
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_webfilter_content_header.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of table.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure content types used by web filter.
    children:
      pattern:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Content type (regular expression).
      action:
        type: enum
        raw_type: string
        choices:
        - block
        - allow
        - exempt
        version_ranges:
        - - v6.0.0
          - ''
        description: Action to take for this content type.
      category:
        type: list
        raw_type: list
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: Categories that this content type applies to.
