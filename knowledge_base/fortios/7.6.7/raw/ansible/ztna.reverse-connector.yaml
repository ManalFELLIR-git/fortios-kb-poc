id: ztna.reverse-connector
version: 7.6.7
source_object: fortios_ztna_reverse_connector
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ztna_reverse_connector.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: Reverse-Connector name
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Reverse-Connector status.
  address:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Connector service edge adress(IP or FQDN).
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Port number that traffic uses to connect to connector service edge(1 - 65535;).
  health_check_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Health check interval in seconds (0 - 600).
  ssl_max_version:
    type: enum
    raw_type: string
    choices:
    - tls-1.1
    - tls-1.2
    - tls-1.3
    version_ranges:
    - - v7.6.1
      - ''
    description: Highest TLS version acceptable from a server.
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: The name of the certificate to use for SSL handshake. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  trusted_server_ca:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Trusted Server CA certificate used by SSL connection. Source vpn.certificate.ca.name.
    references:
    - vpn.certificate.ca.name
