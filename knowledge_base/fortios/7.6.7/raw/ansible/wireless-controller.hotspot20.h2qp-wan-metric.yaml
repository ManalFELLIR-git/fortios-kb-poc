id: wireless-controller.hotspot20.h2qp-wan-metric
version: 7.6.7
source_object: fortios_wireless_controller_hotspot20_h2qp_wan_metric
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_hotspot20_h2qp_wan_metric.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: WAN metric name.
  link_status:
    type: enum
    raw_type: string
    choices:
    - up
    - down
    - in-test
    version_ranges:
    - - v6.0.0
      - ''
    description: Link status.
  symmetric_wan_link:
    type: enum
    raw_type: string
    choices:
    - symmetric
    - asymmetric
    version_ranges:
    - - v6.0.0
      - ''
    description: WAN link symmetry.
  link_at_capacity:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Link at capacity.
  uplink_speed:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Uplink speed (in kilobits/s).
  downlink_speed:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Downlink speed (in kilobits/s).
  uplink_load:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Uplink load.
  downlink_load:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Downlink load.
  load_measurement_duration:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Load measurement duration (in tenths of a second).
