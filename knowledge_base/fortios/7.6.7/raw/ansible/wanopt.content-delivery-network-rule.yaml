  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable WAN optimization content delivery network rules.
  host_domain_name_suffix:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Suffix portion of the fully qualified domain name. For example, fortinet.com in "www.fortinet.com".
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Suffix portion of the fully qualified domain name.
  category:
    type: enum
    raw_type: string
    choices:
    - vcache
    - youtube
    version_ranges:
    - - v6.0.0
      - ''
    description: Content delivery network rule category.
  request_cache_control:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HTTP request cache control.
  response_cache_control:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HTTP response cache control.
  response_expires:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HTTP response cache expires.
  updateserver:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable update server.
  rules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: WAN optimization content delivery network rule entries.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: WAN optimization content delivery network rule name.
      match_mode:
        type: enum
        raw_type: string
        choices:
        - all
        - any
        version_ranges:
        - - v6.0.0
          - ''
        description: Match criteria for collecting content ID.
      skip_rule_mode:
        type: enum
        raw_type: string
        choices:
        - all
        - any
        version_ranges:
        - - v6.0.0
          - ''
        description: Skip mode when evaluating skip-rules.
      match_entries:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: List of entries to match.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Rule ID. see <a href='#notes'>Notes</a>.
          target:
            type: enum
            raw_type: string
            choices:
            - path
            - parameter
            - referrer
            - youtube-map
            - youtube-id
            - youku-id
            version_ranges:
            - - v6.0.0
              - ''
            description: Option in HTTP header or URL parameter to match.
          pattern:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: Pattern string for matching target (Referrer or URL pattern). For example, a, a*c, *a*, a*c*e, and
              *.
            children:
              string:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Pattern strings.
      skip_entries:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: List of entries to skip.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Rule ID. see <a href='#notes'>Notes</a>.
          target:
            type: enum
            raw_type: string
            choices:
            - path
            - parameter
            - referrer
            - youtube-map
            - youtube-id
            - youku-id
            version_ranges:
            - - v6.0.0
              - ''
            description: Option in HTTP header or URL parameter to match.
          pattern:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: Pattern string for matching target (Referrer or URL pattern). For example, a, a*c, *a*, a*c*e, and
              *.
            children:
              string:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Pattern strings.
      content_id:
        type: object
        raw_type: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Content ID settings.
        children:
          target:
            type: enum
            raw_type: string
            choices:
            - path
            - parameter
            - referrer
            - youtube-map
            - youtube-id
            - youku-id
            - hls-manifest
            - dash-manifest
            - hls-fragment
            - dash-fragment
            version_ranges:
            - - v6.0.0
              - ''
