id: system.evpn
version: 7.6.7
source_object: fortios_system_evpn
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_evpn.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v7.4.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  rd:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: 'Route Distinguisher: AA:NN|A.B.C.D:NN.'
  import_rt:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: List of import route targets.
    children:
      route_target:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: 'Route target: AA:NN|A.B.C.D:NN.'
  export_rt:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: List of export route targets.
    children:
      route_target:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: 'Route target: AA:NN|A.B.C.D:NN.'
  ip_local_learning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable IP address local learning.
  arp_suppression:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable ARP suppression.
