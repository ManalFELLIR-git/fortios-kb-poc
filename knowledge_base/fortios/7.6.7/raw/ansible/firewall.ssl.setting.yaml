id: firewall.ssl.setting
version: 7.6.7
source_object: fortios_firewall_ssl_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ssl_setting.py
root_type: object
attributes:
  proxy_connect_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time limit to make an internal connection to the appropriate proxy process (1 - 60 sec).
  ssl_dh_bits:
    type: enum
    raw_type: string
    choices:
    - '768'
    - '1024'
    - '1536'
    - '2048'
    version_ranges:
    - - v6.0.0
      - ''
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation .
  ssl_send_empty_frags:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable sending empty fragments to avoid attack on CBC IV (for SSL 3.0 and TLS 1.0 only).
  no_matching_cipher_action:
    type: enum
    raw_type: string
    choices:
    - bypass
    - drop
    version_ranges:
    - - v6.0.0
      - ''
    description: Bypass or drop the connection when no matching cipher is found.
  cert_manager_cache_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: Time limit for certificate manager to keep FortiGate re-signed server certificate (24 - 720 hours).
  resigned_short_lived_certificate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable/disable short-lived certificate.
  cert_cache_capacity:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum capacity of the host certificate cache (0 - 500).
  cert_cache_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time limit to keep certificate cache (1 - 120 min).
  session_cache_capacity:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Capacity of the SSL session cache (--Obsolete--) (1 - 1000).
  session_cache_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time limit to keep SSL session state (1 - 60 min).
  kxp_queue_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum length of the CP KXP queue. When the queue becomes full, the proxy switches cipher functions to the
      main CPU (0 - 512).
  ssl_queue_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum length of the CP SSL queue. When the queue becomes full, the proxy switches cipher functions to the
      main CPU (0 - 512).
  abbreviate_handshake:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of SSL abbreviated handshake.
