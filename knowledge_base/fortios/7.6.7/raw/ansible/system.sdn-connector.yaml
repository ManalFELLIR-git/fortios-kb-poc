id: system.sdn-connector
version: 7.6.7
source_object: fortios_system_sdn_connector
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_sdn_connector.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: SDN connector name.
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable connection to the remote SDN connector.
  type:
    type: enum
    raw_type: string
    choices:
    - aci
    - alicloud
    - aws
    - azure
    - gcp
    - nsx
    - nuage
    - oci
    - openstack
    - kubernetes
    - vmware
    - sepm
    - aci-direct
    - ibm
    - nutanix
    - sap
    version_ranges:
    - - v6.0.0
      - ''
    description: Type of SDN connector.
  proxy:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: SDN proxy. Source system.sdn-proxy.name.
    references:
    - system.sdn-proxy.name
  use_metadata_iam:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of IAM role from metadata to call API.
  microsoft_365:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.3
      - ''
    description: Enable to use as Microsoft 365 connector.
  ha_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable use for FortiGate HA service.
  verify_certificate:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable server certificate verification.
  vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: Virtual domain name of the remote SDN connector. Source system.vdom.name.
    references:
    - system.vdom.name
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Server address of the remote SDN connector.
  server_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.4
      - ''
    description: Server address list of the remote SDN connector.
    children:
      ip:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.4
          - ''
        description: IPv4 address.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port number of the remote SDN connector.
  message_server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: HTTP port number of the SAP message server.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Username of the remote SDN connector as login credentials.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password of the remote SDN connector as login credentials.
  vcenter_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: vCenter server address for NSX quarantine.
  vcenter_username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: vCenter server username for NSX quarantine.
  vcenter_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: vCenter server password for NSX quarantine.
  access_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: AWS / ACS access key ID.
  secret_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: AWS / ACS secret access key.
  region:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: AWS / ACS region name.
  vpc_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: AWS VPC ID.
  alt_resource_ip:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable AWS alternative resource IP.
  external_account_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.4
      - ''
    description: Configure AWS external account list.
    children:
      role_arn:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.4
          - ''
        description: AWS role ARN to assume.
      external_id:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.8
          - v7.0.12
        - - v7.2.1
          - ''
        description: AWS external ID.
      region_list:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.0.4
          - ''
        description: AWS region name list.
        children:
          region:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.0.4
              - ''
            description: AWS region name.
  tenant_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Tenant ID (directory ID).
  client_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure client ID (application ID).
  client_secret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure client secret (application key).
  subscription_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure subscription ID.
  resource_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure resource group.
  login_endpoint:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure Stack login endpoint.
  resource_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure Stack resource URL.
  azure_region:
    type: enum
    raw_type: string
    choices:
    - global
    - china
    - germany
    - usgov
    - local
    version_ranges:
    - - v6.0.0
      - ''
    description: Azure server region.
  nic:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure Azure network interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Network interface name.
      peer_nic:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: Peer network interface name.
      ip:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure IP configuration.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: IP configuration name.
          private_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: Private IP address.
          public_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Public IP name.
          resource_group:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Resource group of Azure public IP.
  route_table:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure Azure route table.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Route table name.
      subscription_id:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - v6.2.0
        - - v6.2.5
          - ''
        description: Subscription ID of Azure route table.
      resource_group:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Resource group of Azure route table.
      route:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure Azure route.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Route name.
          next_hop:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Next hop address.
  user_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User ID.
  compartment_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: Configure OCI compartment list.
    children:
      compartment_id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: OCI compartment ID.
  oci_region_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: Configure OCI region list.
    children:
      region:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: OCI region.
  oci_region_type:
    type: enum
    raw_type: string
    choices:
    - commercial
    - government
    version_ranges:
    - - v6.2.0
      - ''
    description: OCI region type.
  oci_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: OCI certificate. Source certificate.local.name.
    references:
    - certificate.local.name
  external_ip:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure GCP external IP.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: External IP name.
  route:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure GCP route.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Route name.
  gcp_project_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.4
      - ''
    description: Configure GCP project list.
    children:
      id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.4
          - ''
        description: GCP project ID.
      gcp_zone_list:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.0.4
          - ''
        description: Configure GCP zone list.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.0.4
              - ''
            description: GCP zone name.
  forwarding_rule:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.2
      - ''
    description: Configure GCP forwarding rule.
    children:
      rule_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.2
          - ''
        description: Forwarding rule name.
      target:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.2
          - ''
        description: Target instance name.
  service_account:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: GCP service account email.
  private_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Private key of GCP service account.
  secret_token:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Secret token of Kubernetes service account.
  domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Domain name.
  group_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Full path group name of computers.
  server_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Trust servers that contain this certificate only. Source certificate.remote.name.
    references:
    - certificate.remote.name
  server_ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.4
      - ''
    description: Trust only those servers whose certificate is directly/indirectly signed by this certificate. Source certificate.remote.name
      certificate .ca.name.
    references:
    - certificate.remote.name
  api_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: IBM cloud API key or service ID API key.
  ibm_region:
    type: enum
    raw_type: string
    choices:
    - dallas
    - washington-dc
    - london
    - frankfurt
    - sydney
    - tokyo
    - osaka
    - toronto
    - sao-paulo
    - madrid
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: IBM cloud region name.
  par_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: Public address range ID.
  update_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Dynamic object update interval (30 - 3600 sec).
