id: extension-controller.fortigate
version: 7.6.7
source_object: fortios_extension_controller_fortigate
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_extension_controller_fortigate.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate entry name.
  id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate serial number.
  authorized:
    type: enum
    raw_type: string
    choices:
    - discovered
    - disable
    - enable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable FortiGate administration.
  hostname:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate hostname.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Description.
  device_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.1
      - ''
    description: Device ID.
  profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: FortiGate profile configuration. Source extension-controller.fortigate-profile.name.
    references:
    - extension-controller.fortigate-profile.name
