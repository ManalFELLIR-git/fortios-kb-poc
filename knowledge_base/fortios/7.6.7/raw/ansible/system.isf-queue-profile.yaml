id: system.isf-queue-profile
version: 7.6.7
source_object: fortios_system_isf_queue_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_isf_queue_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Profile name.
  guaranteed_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Guaranteed bandwidth.
  maximum_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Upper bandwidth limit enforced.
  bandwidth_unit:
    type: enum
    raw_type: string
    choices:
    - kbps
    - pps
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Unit of measurement for guaranteed and maximum bandwidth.
  burst_bps_granularity:
    type: enum
    raw_type: string
    choices:
    - disable
    - 512-bytes
    - 1k-bytes
    - 2k-bytes
    - 4k-bytes
    - 8k-bytes
    - 16k-bytes
    - 32k-bytes
    version_ranges:
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Burst granularity based on bytes per second.
  burst_pps_granularity:
    type: enum
    raw_type: string
    choices:
    - disable
    - half-packet
    - 1-packet
    - 2-packets
    - 4-packets
    - 16-packets
    - 65-packets
    - 262-packets
    version_ranges:
    - - v7.2.0
      - v7.2.0
    - - v7.4.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Burst granularity based on packets per second.
