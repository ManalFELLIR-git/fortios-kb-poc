id: switch-controller.stp-settings
version: 7.6.7
source_object: fortios_switch_controller_stp_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_stp_settings.py
root_type: object
attributes:
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of global STP settings configuration.
  revision:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: STP revision number (0 - 65535).
  hello_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period of time between successive STP frame Bridge Protocol Data Units (BPDUs) sent on a port (1 - 10 sec).
  forward_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period of time a port is in listening and learning state (4 - 30 sec).
  max_age:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum time before a bridge port expires its configuration BPDU information (6 - 40 sec).
  max_hops:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of hops between the root bridge and the furthest bridge (1- 40).
  pending_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Pending time (1 - 15 sec).
