id: router.key-chain
version: 7.6.7
source_object: fortios_router_key_chain
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_key_chain.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Key-chain name.
  key:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration method to edit key settings.
    children:
      id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Key ID (0 - 2147483647).
      accept_lifetime:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Lifetime of received authentication key.
      send_lifetime:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Lifetime of sent authentication key.
      key_string:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Password for the key (maximum = 64 characters).
      algorithm:
        type: enum
        raw_type: string
        choices:
        - md5
        - hmac-sha1
        - hmac-sha256
        - hmac-sha384
        - hmac-sha512
        - cmac-aes128
        version_ranges:
        - - v7.0.1
          - ''
        description: Cryptographic algorithm.
