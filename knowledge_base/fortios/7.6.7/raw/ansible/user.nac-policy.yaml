id: user.nac-policy
version: 7.6.7
source_object: fortios_user_nac_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_nac_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Description for the NAC policy matching pattern.
  category:
    type: enum
    raw_type: string
    choices:
    - device
    - firewall-user
    - ems-tag
    - fortivoice-tag
    - vulnerability
    version_ranges:
    - - v6.4.0
      - ''
    description: Category of NAC policy.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable NAC policy.
  match_type:
    type: enum
    raw_type: string
    choices:
    - dynamic
    - override
    version_ranges:
    - - v7.4.4
      - ''
    description: Match and retain the devices based on the type.
  match_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Duration in hours to retain the matched devices (0 - 3072, 0 = always retain).
  match_remove:
    type: enum
    raw_type: string
    choices:
    - default
    - link-down
    version_ranges:
    - - v7.6.3
      - ''
    description: Options to remove the matched override devices.
  mac:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching MAC address.
  hw_vendor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching hardware vendor.
  type:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching type.
  family:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching family.
  os:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching operating system.
  hw_version:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching hardware version.
  sw_version:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching software version.
  host:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching host.
  user:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching user.
  src:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching source.
  user_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: NAC policy matching user group. Source user.group.name.
    references:
    - user.group.name
  ems_tag:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: NAC policy matching EMS tag. Source firewall.address.name.
    references:
    - firewall.address.name
  fortivoice_tag:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: NAC policy matching FortiVoice tag. Source firewall.address.name.
    references:
    - firewall.address.name
  severity:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.0
      - ''
    description: NAC policy matching devices vulnerability severity lists.
    children:
      severity_num:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.0
          - ''
        description: Enter multiple severity levels, where 0 = Info, 1 = Low, ..., 4 = Critical see <a href='#notes'>Notes</a>.
  switch_fortilink:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: FortiLink interface for which this NAC policy belongs to. Source system.interface.name.
    references:
    - system.interface.name
  switch_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.2
      - ''
    description: List of managed FortiSwitch groups on which NAC policy can be applied.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.2
          - ''
        description: Managed FortiSwitch group name from available options. Source switch-controller.switch-group.name.
        references:
        - switch-controller.switch-group.name
  switch_mac_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Switch MAC policy action to be applied on the matched NAC policy. Source switch-controller.mac-policy.name.
    references:
    - switch-controller.mac-policy.name
  firewall_address:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Dynamic firewall address to associate MAC which match this policy. Source firewall.address.name.
    references:
    - firewall.address.name
  ssid_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: SSID policy to be applied on the matched NAC policy. Source wireless-controller.ssid-policy.name.
    references:
    - wireless-controller.ssid-policy.name
