id: wanopt.auth-group
version: 7.6.7
source_object: fortios_wanopt_auth_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wanopt_auth_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Auth-group name.
  auth_method:
    type: enum
    raw_type: string
    choices:
    - cert
    - psk
    version_ranges:
    - - v6.0.0
      - ''
    description: Select certificate or pre-shared key authentication for this authentication group.
  psk:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-shared key used by the peers in this authentication group.
  cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of certificate to identify this peer. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  peer_accept:
    type: enum
    raw_type: string
    choices:
    - any
    - defined
    - one
    version_ranges:
    - - v6.0.0
      - ''
    description: Determine if this auth group accepts, any peer, a list of defined peers, or just one peer.
  peer:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: If peer-accept is set to one, select the name of one peer to add to this authentication group. The peer must
      have added with the wanopt peer command. Source wanopt.peer.peer-host-id.
    references:
    - wanopt.peer.peer-host-id
