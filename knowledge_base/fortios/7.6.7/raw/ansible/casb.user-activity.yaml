id: casb.user-activity
version: 7.6.7
source_object: fortios_casb_user_activity
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_casb_user_activity.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: CASB user activity status.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity description.
  type:
    type: enum
    raw_type: string
    choices:
    - built-in
    - customized
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity type.
  casb_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity signature name.
  application:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB SaaS application name. Source casb.saas-application.name.
    references:
    - casb.saas-application.name
  category:
    type: enum
    raw_type: string
    choices:
    - activity-control
    - tenant-control
    - domain-control
    - safe-search-control
    - advanced-tenant-control
    - other
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity category.
  match_strategy:
    type: enum
    raw_type: string
    choices:
    - and
    - or
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity match strategy.
  match:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB user activity match rules.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB user activity match rules ID. see <a href='#notes'>Notes</a>.
      strategy:
        type: enum
        raw_type: string
        choices:
        - and
        - or
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB user activity rules strategy.
      rules:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB user activity rules.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity rule ID. see <a href='#notes'>Notes</a>.
          type:
            type: enum
            raw_type: string
            choices:
            - domains
            - host
            - path
            - header
            - header-value
            - method
            - body
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity rule type.
          domains:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity domain list.
            children:
              domain:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.4.1
                  - ''
                description: Domain list separated by space.
          methods:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity method list.
            children:
              method:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.4.1
                  - ''
                description: User activity method.
          match_pattern:
            type: enum
            raw_type: string
            choices:
            - simple
            - substr
            - regexp
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity rule match pattern.
          match_value:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity rule match value.
          header_name:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity rule header name.
          body_type:
            type: enum
            raw_type: string
            choices:
            - json
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB user activity match rule body type.
          jq:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB user activity rule match jq script.
          case_sensitive:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB user activity match case sensitive.
          negate:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.1
              - ''
            description: Enable/disable what the matching strategy must not be.
      tenant_extraction:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB user activity tenant extraction.
        children:
          status:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v7.6.1
              - ''
            description: Enable/disable CASB tenant extraction.
          type:
            type: enum
            raw_type: string
            choices:
            - json-query
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB user activity tenant extraction type.
          jq:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB user activity tenant extraction jq script.
          filters:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB user activity tenant extraction filters.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB content extraction filter ID. see <a href='#notes'>Notes</a>.
              direction:
                type: enum
                raw_type: string
                choices:
                - request
                - response
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB content extraction filter direction.
              place:
                type: enum
                raw_type: string
                choices:
                - path
                - header
                - body
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB content extraction filter place type.
              header_name:
                type: string
                raw_type: string
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB content extraction filter header name.
              body_type:
                type: enum
                raw_type: string
                choices:
                - json
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB content extraction filter body type.
  control_options:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB control options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB control option name.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: CASB control option status.
      operations:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB control option operations.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB control option operation name.
          target:
            type: enum
            raw_type: string
            choices:
            - header
            - path
            - body
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation target.
          action:
            type: enum
            raw_type: string
            choices:
            - append
            - prepend
            - replace
            - new
            - new-on-not-found
            - delete
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation action.
          direction:
            type: enum
            raw_type: string
            choices:
            - request
            - response
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation direction.
          header_name:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation header name to search.
          search_pattern:
            type: enum
            raw_type: string
            choices:
            - simple
            - substr
            - regexp
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation search pattern.
          search_key:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation key to search.
          case_sensitive:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation search case sensitive.
          value_from_input:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v7.4.1
              - ''
            description: Enable/disable value from user input.
          value_name_from_input:
            type: string
            raw_type: string
            version_ranges:
            - - v7.6.4
              - ''
            description: CASB operation value name from user input.
          values:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB operation new values.
            children:
              value:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.4.1
                  - ''
                description: Operation value.
