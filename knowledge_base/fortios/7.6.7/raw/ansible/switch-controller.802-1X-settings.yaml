id: switch-controller.802-1X-settings
version: 7.6.7
source_object: fortios_switch_controller_802_1x_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_802_1x_settings.py
root_type: object
attributes:
  link_down_auth:
    type: enum
    raw_type: string
    choices:
    - set-unauth
    - no-action
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface-reauthentication state to set if a link is down.
  reauth_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period of time to allow for reauthentication (1 - 1440 sec).
  max_reauth_attempt:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of authentication attempts (0 - 15).
  tx_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: 802.1X Tx period (seconds).
  mab_reauth:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable MAB re-authentication.
  mac_username_delimiter:
    type: enum
    raw_type: string
    choices:
    - colon
    - hyphen
    - none
    - single-hyphen
    version_ranges:
    - - v7.4.2
      - ''
    description: MAC authentication username delimiter .
  mac_password_delimiter:
    type: enum
    raw_type: string
    choices:
    - colon
    - hyphen
    - none
    - single-hyphen
    version_ranges:
    - - v7.4.2
      - ''
    description: MAC authentication password delimiter .
  mac_calling_station_delimiter:
    type: enum
    raw_type: string
    choices:
    - colon
    - hyphen
    - none
    - single-hyphen
    version_ranges:
    - - v7.4.2
      - ''
    description: MAC calling station delimiter .
  mac_called_station_delimiter:
    type: enum
    raw_type: string
    choices:
    - colon
    - hyphen
    - none
    - single-hyphen
    version_ranges:
    - - v7.4.2
      - ''
    description: MAC called station delimiter .
  mac_case:
    type: enum
    raw_type: string
    choices:
    - lowercase
    - uppercase
    version_ranges:
    - - v7.4.2
      - ''
    description: MAC case .
