id: icap.server-group
version: 7.6.7
source_object: fortios_icap_server_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_icap_server_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.0
      - ''
    description: Configure an ICAP server group consisting one or multiple forward servers. Supports failover and load balancing.
  ldb_method:
    type: enum
    raw_type: string
    choices:
    - weighted
    - least-session
    - active-passive
    version_ranges:
    - - v7.2.0
      - ''
    description: Load balance method.
  server_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.0
      - ''
    description: Add ICAP servers to a list to form a server group. Optionally assign weights to each server.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.0
          - ''
        description: ICAP server name. Source icap.server.name.
        references:
        - icap.server.name
      weight:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - ''
        description: Optionally assign a weight of the forwarding server for weighted load balancing (1 - 100).
