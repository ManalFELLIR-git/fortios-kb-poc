id: system.probe-response
version: 7.6.7
source_object: fortios_system_probe_response
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_probe_response.py
root_type: object
attributes:
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port number to response.
  http_probe_value:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Value to respond to the monitoring server.
  ttl_mode:
    type: enum
    raw_type: string
    choices:
    - reinit
    - decrease
    - retain
    version_ranges:
    - - v6.0.0
      - ''
    description: Mode for TWAMP packet TTL modification.
  mode:
    type: enum
    raw_type: string
    choices:
    - none
    - http-probe
    - twamp
    version_ranges:
    - - v6.0.0
      - ''
    description: SLA response mode.
  security_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - authentication
    version_ranges:
    - - v6.0.0
      - ''
    description: TWAMP responder security mode.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: TWAMP responder password in authentication mode.
  timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: An inactivity timer for a twamp test session.
