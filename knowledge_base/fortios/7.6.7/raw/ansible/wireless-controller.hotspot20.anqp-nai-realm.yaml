id: wireless-controller.hotspot20.anqp-nai-realm
version: 7.6.7
source_object: fortios_wireless_controller_hotspot20_anqp_nai_realm
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_hotspot20_anqp_nai_realm.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: NAI realm list name.
  nai_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: NAI list.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: NAI realm name.
      encoding:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable format in accordance with IETF RFC 4282.
      nai_realm:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure NAI realms (delimited by a semi-colon character).
      eap_method:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: EAP Methods.
        children:
          index:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: EAP method index. see <a href='#notes'>Notes</a>.
          method:
            type: enum
            raw_type: string
            choices:
            - eap-identity
            - eap-md5
            - eap-tls
            - eap-ttls
            - eap-peap
            - eap-sim
            - eap-aka
            - eap-aka-prime
            version_ranges:
            - - v6.0.0
              - ''
            description: EAP method type.
          auth_param:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.0.0
              - ''
            description: EAP auth param.
            children:
              index:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v6.0.0
                  - ''
                description: Param index. see <a href='#notes'>Notes</a>.
              id:
                type: enum
                raw_type: string
                choices:
                - non-eap-inner-auth
                - inner-auth-eap
                - credential
                - tunneled-credential
                version_ranges:
                - - v6.0.0
                  - ''
                description: ID of authentication parameter.
              val:
                type: enum
                raw_type: string
                choices:
                - eap-identity
                - eap-md5
                - eap-tls
                - eap-ttls
                - eap-peap
                - eap-sim
                - eap-aka
                - eap-aka-prime
                - non-eap-pap
                - non-eap-chap
                - non-eap-mschap
                - non-eap-mschapv2
                - cred-sim
                - cred-usim
                - cred-nfc
                - cred-hardware-token
                - cred-softoken
                - cred-certificate
                - cred-user-pwd
                - cred-none
                - cred-vendor-specific
                - tun-cred-sim
                - tun-cred-usim
                - tun-cred-nfc
                - tun-cred-hardware-token
                - tun-cred-softoken
                - tun-cred-certificate
                - tun-cred-user-pwd
                - tun-cred-anonymous
                - tun-cred-vendor-specific
                version_ranges:
                - - v6.0.0
                  - ''
                description: Value of authentication parameter.
