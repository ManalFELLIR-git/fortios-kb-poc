id: web-proxy.global
version: 7.6.7
source_object: fortios_web_proxy_global
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_web_proxy_global.py
root_type: object
attributes:
  ssl_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SSL certificate for SSL interception. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  ssl_ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SSL CA certificate for SSL interception. Source vpn.certificate.local.name vpn.certificate.hsm-local.name.
    references:
    - vpn.certificate.hsm-local.name
    - vpn.certificate.local.name
  fast_policy_match:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable fast matching algorithm for explicit and transparent proxy policy.
  ldap_user_cache:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable LDAP user cache for explicit and transparent proxy user.
  proxy_fqdn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Fully Qualified Domain Name of the explicit web proxy  that clients connect to.
  max_request_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum length of HTTP request line (2 - 64 Kbytes).
  max_message_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum length of HTTP message, not including body (16 - 256 Kbytes).
  http2_client_window_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: HTTP/2 client initial window size in bytes (65535 - 2147483647).
  http2_server_window_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.3
      - ''
    description: HTTP/2 server initial window size in bytes (65535 - 2147483647).
  auth_sign_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.5
      - ''
    description: Proxy auth query sign timeout in seconds (30 - 3600).
  strict_web_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable strict web checking to block web sites that send incorrect headers that don"t conform to HTTP.
  forward_proxy_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable forwarding proxy authentication headers.
  forward_server_affinity_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Period of time before the source IP"s traffic is no longer assigned to the forwarding server (6 - 60 min).
  max_waf_body_cache_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum length of HTTP messages processed by Web Application Firewall (WAF) (1 - 1024 Kbytes).
  webproxy_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the web proxy profile to apply when explicit proxy traffic is allowed by default and traffic is accepted
      that does not match an explicit proxy policy. Source web-proxy.profile.name.
    references:
    - web-proxy.profile.name
  learn_client_ip:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable learning the client"s IP address from headers.
  always_learn_client_ip:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable learning the client"s IP address from headers for every request.
  learn_client_ip_from_header:
    type: enum
    raw_type: list
    choices:
    - true-client-ip
    - x-real-ip
    - x-forwarded-for
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Learn client IP address from the specified headers.
  learn_client_ip_srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source address name (srcaddr or srcaddr6 must be set).
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  learn_client_ip_srcaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 Source address name (srcaddr or srcaddr6 must be set).
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
  src_affinity_exempt_addr:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: IPv4 source addresses to exempt proxy affinity.
  src_affinity_exempt_addr6:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: IPv6 source addresses to exempt proxy affinity.
  policy_partial_match:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.5
      - ''
    description: Enable/disable policy partial matching.
  log_policy_pending:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable logging sessions that are pending on policy matching.
  log_forward_server:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable forward server name logging in forward traffic log.
  log_app_id:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable always log application type in traffic log.
  proxy_transparent_cert_inspection:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable transparent proxy certificate inspection.
  request_obs_fold:
    type: enum
    raw_type: string
    choices:
    - replace-with-sp
    - block
    - keep
    version_ranges:
    - - v7.6.1
      - ''
    description: Action when HTTP/1.x request header contains obs-fold .
  ssl_bypass_cache:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.7
      - v7.6.7
    description: Enable/disable SSL bypass cache.
