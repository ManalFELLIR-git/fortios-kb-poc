id: firewall.shaping-policy
version: 7.6.7
source_object: fortios_firewall_shaping_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_shaping_policy.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Shaping policy ID (0 - 4294967295). see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Shaping policy name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comments.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this traffic shaping policy.
  ip_version:
    type: enum
    raw_type: string
    choices:
    - '4'
    - '6'
    version_ranges:
    - - v6.0.0
      - ''
    description: Apply this traffic shaping policy to IPv4 or IPv6 traffic.
  traffic_type:
    type: enum
    raw_type: string
    choices:
    - forwarding
    - local-in
    - local-out
    version_ranges:
    - - v7.4.0
      - ''
    description: Traffic type.
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 source address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv4 destination address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  srcaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
  dstaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 destination address and address group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
  internet_service:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address and service are
      not used.
  internet_service_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service ID.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Internet Service name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  internet_service_src:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of Internet Services in source for this policy. If enabled, source address is not used.
  internet_service_src_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service_src_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service_src_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service_src_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Internet Service source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service_src_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Internet Service name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  service:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Service and service group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Service name. Source firewall.service.custom.name firewall.service.group.name.
        references:
        - firewall.service.custom.name
        - firewall.service.group.name
  schedule:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule name. Source firewall.schedule.onetime.name firewall.schedule.recurring.name firewall.schedule.group.name.
    references:
    - firewall.schedule.group.name
    - firewall.schedule.onetime.name
    - firewall.schedule.recurring.name
  users:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Apply this traffic shaping policy to individual users that have authenticated with the FortiGate.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: User name. Source user.local.name.
        references:
        - user.local.name
  groups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Apply this traffic shaping policy to user groups that have authenticated with the FortiGate.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Group name. Source user.group.name.
        references:
        - user.group.name
  application:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IDs of one or more applications that this shaper applies application control traffic shaping to.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Application IDs. see <a href='#notes'>Notes</a>.
  app_category:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IDs of one or more application categories that this shaper applies application control traffic shaping to.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Category IDs. see <a href='#notes'>Notes</a>.
  app_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: One or more application group names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Application group name. Source application.group.name.
        references:
        - application.group.name
  url_category:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IDs of one or more FortiGuard Web Filtering categories that this shaper applies traffic shaping to.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: URL category ID. see <a href='#notes'>Notes</a>.
  srcintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: One or more incoming (ingress) interfaces.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  dstintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: One or more outgoing (egress) interfaces.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  tos_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Non-zero bit positions are used for comparison while zero bit positions are ignored.
  tos:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: ToS (Type of Service) value used for comparison.
  tos_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable negated TOS match.
  traffic_shaper:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Traffic shaper to apply to traffic forwarded by the firewall policy. Source firewall.shaper.traffic-shaper.name.
    references:
    - firewall.shaper.traffic-shaper.name
  traffic_shaper_reverse:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Traffic shaper to apply to response traffic received by the firewall policy. Source firewall.shaper.traffic-shaper.name.
    references:
    - firewall.shaper.traffic-shaper.name
  per_ip_shaper:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Per-IP traffic shaper to apply with this policy. Source firewall.shaper.per-ip-shaper.name.
    references:
    - firewall.shaper.per-ip-shaper.name
  class_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Traffic class ID. Source firewall.traffic-class.class-id.
    references:
    - firewall.traffic-class.class-id
  diffserv_forward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable to change packet"s DiffServ values to the specified diffservcode-forward value.
  diffserv_reverse:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable to change packet"s reverse (reply) DiffServ values to the specified diffservcode-rev value.
  diffservcode_forward:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Change packet"s DiffServ to this value.
  diffservcode_rev:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Change packet"s reverse (reply) DiffServ to this value.
  cos_mask:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: VLAN CoS evaluated bits.
  cos:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: VLAN CoS bit pattern.
