id: casb.profile
version: 7.6.7
source_object: fortios_casb_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_casb_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.4
      - ''
    description: Comment.
  saas_application:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: CASB profile SaaS application.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile SaaS application name. Source casb.saas-application.name.
        references:
        - casb.saas-application.name
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: Enable/disable setting.
      safe_search:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable safe search.
      safe_search_control:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile safe search control.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: Safe search control name.
      tenant_control:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable tenant control.
      tenant_control_tenants:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile tenant control tenants.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: Tenant control tenants name.
      advanced_tenant_control:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.6.1
          - ''
        description: CASB profile advanced tenant control.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB advanced tenant control name. Source casb.user-activity.name.
            references:
            - casb.user-activity.name
          attribute:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB advanced tenant control attribute.
            children:
              name:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB extend user input name.
              input:
                type: list
                raw_type: list
                elements: dict
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB extend user input value.
                children:
                  value:
                    type: string
                    raw_type: string
                    required: true
                    version_ranges:
                    - - v7.6.1
                      - ''
                    description: User input value.
      domain_control:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable domain control.
      domain_control_domains:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile domain control domains.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: Domain control domain name.
      log:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable log settings.
      access_rule:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile access rule.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB access rule activity name. Source casb.user-activity.name.
            references:
            - casb.user-activity.name
          action:
            type: enum
            raw_type: string
            choices:
            - monitor
            - bypass
            - block
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB access rule action.
          bypass:
            type: enum
            raw_type: list
            choices:
            - av
            - dlp
            - web-filter
            - file-filter
            - video-filter
            multiple_values: true
            elements: str
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB bypass options.
          attribute_filter:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB profile attribute filter.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB tenant control ID. see <a href='#notes'>Notes</a>.
              attribute_match:
                type: string
                raw_type: string
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB access rule tenant match. Source casb.attribute-match.name.
                references:
                - casb.attribute-match.name
              action:
                type: enum
                raw_type: string
                choices:
                - monitor
                - bypass
                - block
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB access rule tenant control action.
      custom_control:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.1
          - ''
        description: CASB profile custom control.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB custom control user activity name. Source casb.user-activity.name.
            references:
            - casb.user-activity.name
          option:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.4.1
              - ''
            description: CASB custom control option.
            children:
              name:
                type: string
                raw_type: string
                required: true
                version_ranges:
                - - v7.4.1
                  - ''
                description: CASB custom control option name.
              user_input:
                type: list
                raw_type: list
                elements: dict
                version_ranges:
                - - v7.4.1
                  - ''
                description: CASB custom control user input.
                children:
                  value:
                    type: string
                    raw_type: string
                    required: true
                    version_ranges:
                    - - v7.4.1
                      - ''
                    description: user input value.
          attribute_filter:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.6.1
              - ''
            description: CASB attribute filter.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB tenant control ID. see <a href='#notes'>Notes</a>.
              attribute_match:
                type: string
                raw_type: string
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB access rule tenant match. Source casb.attribute-match.name.
                references:
                - casb.attribute-match.name
              action:
                type: enum
                raw_type: string
                choices:
                - monitor
                - bypass
                - block
                version_ranges:
                - - v7.6.1
                  - ''
                description: CASB access rule tenant control action.
