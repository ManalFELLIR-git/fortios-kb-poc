id: router.bgp
version: 7.6.7
source_object: fortios_router_bgp
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_bgp.py
root_type: object
attributes:
  as:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Router AS number, asplain/asdot/asdot+ format, 0 to disable BGP.
  router_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Router ID.
  keepalive_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency to send keep alive requests.
  holdtime_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of seconds to mark peer as dead.
  always_compare_med:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable always compare MED.
  bestpath_as_path_ignore:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ignore AS path.
  bestpath_cmp_confed_aspath:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable compare federation AS path length.
  bestpath_cmp_routerid:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable compare router ID for identical EBGP paths.
  bestpath_med_confed:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable compare MED among confederation paths.
  bestpath_med_missing_as_worst:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable treat missing MED as least preferred.
  client_to_client_reflection:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable client-to-client route reflection.
  dampening:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable route-flap dampening.
  deterministic_med:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable enforce deterministic comparison of MED.
  ebgp_multipath:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable EBGP multi-path.
  ibgp_multipath:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IBGP multi-path.
  enforce_first_as:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable enforce first AS for EBGP routes.
  fast_external_failover:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable reset peer BGP session if link goes down.
  log_neighbour_changes:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Log BGP neighbor changes.
  network_import_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ensure BGP network route exists in IGP.
  ignore_optional_capability:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Do not send unknown optional capability notification message.
  additional_path:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable selection of BGP IPv4 additional paths.
  additional_path6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable selection of BGP IPv6 additional paths.
  additional_path_vpnv4:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable selection of BGP VPNv4 additional paths.
  additional_path_vpnv6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable selection of BGP VPNv6 additional paths.
  multipath_recursive_distance:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Enable/disable use of recursive distance to select multipath.
  recursive_next_hop:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable recursive resolution of next-hop using BGP route.
  recursive_inherit_priority:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable priority inheritance for recursive resolution.
  tag_resolve_mode:
    type: enum
    raw_type: string
    choices:
    - disable
    - preferred
    - merge
    - merge-all
    version_ranges:
    - - v7.0.4
      - ''
    description: Configure tag-match mode. Resolves BGP routes with other routes containing the same tag.
  cluster_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Route reflector cluster ID.
  confederation_identifier:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Confederation identifier.
  confederation_peers:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Confederation peers.
    children:
      peer:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Peer ID.
  dampening_route_map:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Criteria for dampening. Source router.route-map.name.
    references:
    - router.route-map.name
  dampening_reachability_half_life:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Reachability half-life time for penalty (min).
  dampening_reuse:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Threshold to reuse routes.
  dampening_suppress:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Threshold to suppress routes.
  dampening_max_suppress_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum minutes a route can be suppressed.
  dampening_unreachability_half_life:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Unreachability half-life time for penalty (min).
  default_local_preference:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default local preference.
  scan_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Background scanner interval (sec), 0 to disable it.
  distance_external:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance for routes external to the AS.
  distance_internal:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance for routes internal to the AS.
  distance_local:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance for routes local to the AS.
  synchronization:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable only advertise routes from iBGP if routes present in an IGP.
  graceful_restart:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable BGP graceful restart capabilities.
  graceful_restart_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time needed for neighbors to restart (sec).
  graceful_stalepath_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time to hold stale paths of restarting neighbor (sec).
  graceful_update_delay:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Route advertisement/selection delay after restart (sec).
  graceful_end_on_timer:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable to exit graceful restart on timer only.
  additional_path_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Number of additional paths to be selected for each IPv4 NLRI.
  additional_path_select6:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Number of additional paths to be selected for each IPv6 NLRI.
  additional_path_select_vpnv4:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.2.0
      - ''
    description: Number of additional paths to be selected for each VPNv4 NLRI.
  additional_path_select_vpnv6:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: Number of additional paths to be selected for each VPNv6 NLRI.
  cross_family_conditional_adv:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable cross address family conditional advertisement.
  aggregate_address:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: BGP aggregate address table.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Aggregate prefix.
      as_set:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable generate AS set path information.
      summary_only:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable filter more specific routes from updates.
  aggregate_address6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: BGP IPv6 aggregate address table.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      prefix6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Aggregate IPv6 prefix.
      as_set:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable generate AS set path information.
      summary_only:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable filter more specific routes from updates.
  neighbor:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: BGP neighbor table.
    children:
      ip:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP/IPv6 address of neighbor.
      advertisement_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Minimum interval (sec) between sending updates.
      allowas_in_enable:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable IPv4 to allow my AS in AS path.
      allowas_in_enable6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable IPv6 to allow my AS in AS path.
      allowas_in_enable_vpnv4:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable to allow my AS in AS path for VPNv4 route.
      allowas_in_enable_vpnv6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: Enable/disable to allow my AS in AS path for VPNv6 route.
      allowas_in_enable_evpn:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable to allow my AS in AS path for L2VPN EVPN route.
      allowas_in:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 The maximum number of occurrence of my AS number allowed.
      allowas_in6:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 The maximum number of occurrence of my AS number allowed.
      allowas_in_vpnv4:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - ''
        description: The maximum number of occurrence of my AS number allowed for VPNv4 route.
      allowas_in_vpnv6:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.2
          - ''
        description: The maximum number of occurrence of my AS number allowed for VPNv6 route.
      allowas_in_evpn:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.0
          - ''
        description: The maximum number of occurrence of my AS number allowed for L2VPN EVPN route.
      attribute_unchanged:
        type: enum
        raw_type: list
        choices:
        - as-path
        - med
        - next-hop
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 List of attributes that should be unchanged.
      attribute_unchanged6:
        type: enum
        raw_type: list
        choices:
        - as-path
        - med
        - next-hop
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 List of attributes that should be unchanged.
      attribute_unchanged_vpnv4:
        type: enum
        raw_type: list
        choices:
        - as-path
        - med
        - next-hop
        multiple_values: true
        elements: str
        version_ranges:
        - - v7.2.0
          - ''
        description: List of attributes that should be unchanged for VPNv4 route.
      attribute_unchanged_vpnv6:
        type: enum
        raw_type: list
        choices:
        - as-path
        - med
        - next-hop
        multiple_values: true
        elements: str
        version_ranges:
        - - v7.4.2
          - ''
        description: List of attributes that should not be changed for VPNv6 route.
      activate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable address family IPv4 for this neighbor.
      activate6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable address family IPv6 for this neighbor.
      activate_vpnv4:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.0
          - ''
        description: Enable/disable address family VPNv4 for this neighbor.
      activate_vpnv6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: Enable/disable address family VPNv6 for this neighbor.
      activate_evpn:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable address family L2VPN EVPN for this neighbor.
      bfd:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable BFD for this neighbor.
      capability_dynamic:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise dynamic capability to this neighbor.
      capability_orf:
        type: enum
        raw_type: string
        choices:
        - none
        - receive
        - send
        - both
        version_ranges:
        - - v6.0.0
          - ''
        description: Accept/Send IPv4 ORF lists to/from this neighbor.
      capability_orf6:
        type: enum
        raw_type: string
        choices:
        - none
        - receive
        - send
        - both
        version_ranges:
        - - v6.0.0
          - ''
        description: Accept/Send IPv6 ORF lists to/from this neighbor.
      capability_graceful_restart:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise IPv4 graceful restart capability to this neighbor.
      capability_graceful_restart6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise IPv6 graceful restart capability to this neighbor.
      capability_graceful_restart_vpnv4:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.0
          - ''
        description: Enable/disable advertise VPNv4 graceful restart capability to this neighbor.
      capability_graceful_restart_vpnv6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.2
          - ''
        description: Enable/disable advertisement of VPNv6 graceful restart capability to this neighbor.
      capability_graceful_restart_evpn:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.4.0
          - ''
        description: Enable/disable advertisement of L2VPN EVPN graceful restart capability to this neighbor.
      capability_route_refresh:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise route refresh capability to this neighbor.
      capability_default_originate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise default IPv4 route to this neighbor.
      capability_default_originate6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise default IPv6 route to this neighbor.
      dont_capability_negotiate:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Do not negotiate capabilities with this neighbor.
      ebgp_enforce_multihop:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable allow multi-hop EBGP neighbors.
      link_down_failover:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable failover upon link down.
      stale_route:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable stale route after neighbor down.
      next_hop_self:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable IPv4 next-hop calculation for this neighbor.
      next_hop_self6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable IPv6 next-hop calculation for this neighbor.
      next_hop_self_rr:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.4.4
          - ''
        description: Enable/disable setting nexthop"s address to interface"s IPv4 address for route-reflector routes.
      next_hop_self_rr6:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.4.4
          - ''
