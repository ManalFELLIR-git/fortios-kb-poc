id: wireless-controller.syslog-profile
version: 7.6.7
source_object: fortios_wireless_controller_syslog_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_syslog_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.2
      - ''
    description: WTP system log server profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.2
      - ''
    description: Comment.
  server_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable FortiAP units to send log messages to a syslog server .
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.5
      - ''
    description: Syslog server CN domain name or IP address.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.2
      - ''
    description: Port number of syslog server that FortiAP units send log messages to .
  server_type:
    type: enum
    raw_type: string
    choices:
    - standard
    - fortianalyzer
    version_ranges:
    - - v7.6.1
      - ''
    description: Configure syslog server type .
  log_level:
    type: enum
    raw_type: string
    choices:
    - emergency
    - alert
    - critical
    - error
    - warning
    - notification
    - information
    - debugging
    version_ranges:
    - - v7.0.2
      - ''
    description: Lowest level of log messages that FortiAP units send to this server .
