id: wireless-controller.inter-controller
version: 7.6.7
source_object: fortios_wireless_controller_inter_controller
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_inter_controller.py
root_type: object
attributes:
  inter_controller_mode:
    type: enum
    raw_type: string
    choices:
    - disable
    - l2-roaming
    - 1+1
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure inter-controller mode (disable, l2-roaming, 1+1).
  l3_roaming:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable layer 3 roaming .
  inter_controller_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secret key for inter-controller communications.
  inter_controller_pri:
    type: enum
    raw_type: string
    choices:
    - primary
    - secondary
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure inter-controller"s priority (primary or secondary).
  fast_failover_max:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of retransmissions for fast failover HA messages between peer wireless controllers (3 - 64).
  fast_failover_wait:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum wait time before an AP transitions from secondary controller to primary controller (10 - 86400 sec).
  inter_controller_peer:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Fast failover peer wireless controller list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      peer_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Peer wireless controller"s IP address.
      peer_port:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Port used by the wireless controller"s for inter-controller communications (1024 - 49150).
      peer_priority:
        type: enum
        raw_type: string
        choices:
        - primary
        - secondary
        version_ranges:
        - - v6.0.0
          - ''
        description: Peer wireless controller"s priority (primary or secondary).
