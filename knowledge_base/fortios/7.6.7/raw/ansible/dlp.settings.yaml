id: dlp.settings
version: 7.6.7
source_object: fortios_dlp_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_dlp_settings.py
root_type: object
attributes:
  storage_device:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Storage device name. Source system.storage.name.
    references:
    - system.storage.name
  size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum total size of files within the DLP fingerprint database (MB).
  db_mode:
    type: enum
    raw_type: string
    choices:
    - stop-adding
    - remove-modified-then-oldest
    - remove-oldest
    version_ranges:
    - - v6.0.0
      - ''
    description: Behavior when the maximum size is reached in the DLP fingerprint database.
  cache_mem_percent:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum percentage of available memory allocated to caching DLP fingerprints (1 - 15).
  chunk_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum fingerprint chunk size. Caution, changing this setting will flush the entire database.
  config_builder_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Maximum time allowed for building a single DLP profile .
