  user_group:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of user groups.
  sslvpn:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of Agentless VPN.
  proxy:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of concurrent proxy users.
  log_disk_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Log disk quota in megabytes (MB).
