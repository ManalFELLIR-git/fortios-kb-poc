  service_group:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of firewall service groups.
  onetime_schedule:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of firewall one-time schedules.
  recurring_schedule:
