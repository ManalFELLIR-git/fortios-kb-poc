id: system.resource-limits
version: 7.6.7
source_object: fortios_system_resource_limits
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_resource_limits.py
root_type: object
attributes:
  session:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of sessions.
  ipsec_phase1:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of VPN IPsec phase1 tunnels.
  ipsec_phase2:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of VPN IPsec phase2 tunnels.
  ipsec_phase1_interface:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of VPN IPsec phase1 interface tunnels.
  ipsec_phase2_interface:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of VPN IPsec phase2 interface tunnels.
  dialup_tunnel:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of dial-up tunnels.
  firewall_policy:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of firewall policies (policy, DoS-policy4, DoS-policy6, multicast).
  firewall_address:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
