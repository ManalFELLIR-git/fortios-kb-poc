id: firewall.ssl-ssh-profile
version: 7.6.7
source_object: fortios_firewall_ssl_ssh_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ssl_ssh_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  ssl:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure SSL options.
    children:
      inspect_all:
        type: enum
        raw_type: string
        choices:
        - disable
        - certificate-inspection
        - deep-inspection
        version_ranges:
        - - v6.0.0
          - ''
        description: Level of SSL inspection.
      client_certificate:
        type: enum
        raw_type: string
        choices:
        - bypass
        - inspect
        - block
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on received client certificate.
      unsupported_ssl_version:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v7.0.1
          - ''
        description: Action based on the SSL version used being unsupported.
      unsupported_ssl_cipher:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on the SSL cipher used being unsupported.
      unsupported_ssl_negotiation:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on the SSL negotiation used being unsupported.
      expired_server_cert:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        - ignore
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on server certificate is expired.
      revoked_server_cert:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        - ignore
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on server certificate is revoked.
      untrusted_server_cert:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        - ignore
        version_ranges:
        - - v6.2.0
          - ''
        description: Action based on server certificate is not issued by a trusted CA.
      cert_validation_timeout:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        - ignore
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on certificate validation timeout.
      cert_validation_failure:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        - ignore
        version_ranges:
        - - v6.4.0
          - ''
        description: Action based on certificate validation failure.
      sni_server_cert_check:
        type: enum
        raw_type: string
        choices:
        - enable
        - strict
        - disable
        version_ranges:
        - - v6.2.0
          - ''
        description: Check the SNI in the client hello message with the CN or SAN fields in the returned server certificate.
      cert_probe_failure:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v7.0.1
          - ''
        description: Action based on certificate probe failure.
      encrypted_client_hello:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v7.4.4
          - ''
        description: Block/allow session based on existence of encrypted-client-hello.
      min_allowed_ssl_version:
        type: enum
        raw_type: string
        choices:
        - ssl-3.0
        - tls-1.0
        - tls-1.1
        - tls-1.2
        - tls-1.3
