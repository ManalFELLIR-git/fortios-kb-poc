id: certificate.local
version: 7.6.7
source_object: fortios_certificate_local
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_certificate_local.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password as a PEM file.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  private_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PEM format key encrypted with a password.
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: PEM format certificate.
  csr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Certificate Signing Request.
  scep_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SCEP server URL.
  range:
    type: enum
    raw_type: string
    choices:
    - global
    - vdom
    version_ranges:
    - - v6.0.0
      - ''
    description: Either a global or VDOM IP address range for the certificate.
  source:
    type: enum
    raw_type: string
    choices:
    - factory
    - user
    - bundle
    version_ranges:
    - - v6.0.0
      - ''
    description: Certificate source type.
  auto_regenerate_days:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of days to wait before expiry of an updated local certificate is requested (0 = disabled).
  auto_regenerate_days_warning:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of days to wait before an expiry warning message is generated (0 = disabled).
  scep_password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SCEP server challenge password for auto-regeneration.
  ca_identifier:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: CA identifier of the CA server for signing via SCEP.
  name_encoding:
    type: enum
    raw_type: string
    choices:
    - printable
    - utf8
    version_ranges:
    - - v6.0.0
      - ''
    description: Name encoding method for auto-regeneration.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address for communications to the SCEP server.
  ike_localid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local ID the FortiGate uses for authentication as a VPN client.
  ike_localid_type:
    type: enum
    raw_type: string
    choices:
    - asn1dn
    - fqdn
    version_ranges:
    - - v6.0.0
      - ''
    description: IKE local ID type.
  enroll_protocol:
    type: enum
    raw_type: string
    choices:
    - none
    - scep
    - cmpv2
    - acme2
    - est
    version_ranges:
    - - v6.0.0
      - ''
    description: Certificate enrollment protocol.
  private_key_retain:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.1
      - ''
    description: Enable/disable retention of private key during SCEP renewal .
  cmp_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Address and port for CMP server (format = address:port).
  cmp_path:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Path location inside CMP server.
  cmp_server_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: CMP server certificate. Source certificate.ca.name certificate.remote.name.
    references:
    - certificate.ca.name
    - certificate.remote.name
  cmp_regeneration_method:
    type: enum
    raw_type: string
    choices:
    - keyupate
    - renewal
    version_ranges:
    - - v6.0.0
      - ''
    description: CMP auto-regeneration method.
  acme_ca_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: The URL for the ACME CA server (Let"s Encrypt is the ).
  acme_domain:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: A valid domain that resolves to this FortiGate unit.
  acme_email:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Contact email address that is required by some CAs like LetsEncrypt.
  acme_eab_key_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: External Account Binding Key ID (optional setting).
  acme_eab_key_hmac:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: External Account Binding HMAC Key (URL-encoded base64).
  acme_rsa_key_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Length of the RSA private key of the generated cert (Minimum 2048 bits).
  acme_renew_window:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Beginning of the renewal window (in days before certificate expiration, 30 by default).
  est_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Address and port for EST server (e.g. https://example.com:1234).
  est_ca_id:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: CA identifier of the CA server for signing via EST.
  est_http_username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: HTTP Authentication username for signing via EST.
  est_http_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: HTTP Authentication password for signing via EST.
  est_client_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Certificate used to authenticate this FortiGate to EST server. Source certificate.local.name.
    references:
    - certificate.local.name
  est_server_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: EST server"s certificate must be verifiable by this certificate to be authenticated. Source certificate.ca.name
      certificate.remote.name.
    references:
    - certificate.ca.name
    - certificate.remote.name
  est_srp_username:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: EST SRP authentication username.
  est_srp_password:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: EST SRP authentication password.
  est_regeneration_method:
    type: enum
    raw_type: string
    choices:
    - create-new-key
    - use-existing-key
    version_ranges:
    - - v7.6.3
      - ''
    description: EST behavioral options during re-enrollment.
