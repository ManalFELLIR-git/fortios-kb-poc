id: webfilter.search-engine
version: 7.6.7
source_object: fortios_webfilter_search_engine
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_webfilter_search_engine.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Search engine name.
  hostname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hostname (regular expression).
  url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL (regular expression).
  query:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Code used to prefix a query (must end with an equals character).
  safesearch:
    type: enum
    raw_type: string
    choices:
    - disable
    - url
    - header
    - translate
    - yt-pattern
    - yt-scan
    - yt-video
    - yt-channel
    version_ranges:
    - - v6.0.0
      - ''
    description: Safe search method. You can disable safe search, add the safe search string to URLs, or insert a safe search
      header.
  charset:
    type: enum
    raw_type: string
    choices:
    - utf-8
    - gb2312
    version_ranges:
    - - v6.0.0
      - ''
    description: Search engine charset.
  safesearch_str:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Safe search parameter used in the URL in URL mode. In translate mode, it provides either the regex to translate
      the URL or the special case to translate the URL.
