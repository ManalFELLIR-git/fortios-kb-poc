id: log.gui-display
version: 7.6.7
source_object: fortios_log_gui_display
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_gui_display.py
root_type: object
attributes:
  resolve_hosts:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable resolving IP addresses to hostname in log messages on the GUI using reverse DNS lookup.
  resolve_apps:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Resolve unknown applications on the GUI using Fortinet"s remote application database.
  fortiview_unscanned_apps:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable showing unscanned traffic in FortiView application charts.
