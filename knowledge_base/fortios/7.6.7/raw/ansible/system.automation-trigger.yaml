id: system.automation-trigger
version: 7.6.7
source_object: fortios_system_automation_trigger
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_automation_trigger.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Description.
  trigger_type:
    type: enum
    raw_type: string
    choices:
    - event-based
    - scheduled
    version_ranges:
    - - v6.0.0
      - ''
    description: Trigger type.
  event_type:
    type: enum
    raw_type: string
    choices:
    - ioc
    - event-log
    - reboot
    - low-memory
    - high-cpu
    - license-near-expiry
    - local-cert-near-expiry
    - ha-failover
    - config-change
    - security-rating-summary
    - virus-ips-db-updated
    - faz-event
    - incoming-webhook
    - fabric-event
    - ips-logs
    - anomaly-logs
    - virus-logs
    - ssh-logs
    - webfilter-violation
    - traffic-violation
    - stitch
    version_ranges:
    - - v6.0.0
      - ''
    description: Event type.
  vdom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.0
      - ''
    description: Virtual domain(s) that this trigger is valid for.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.0
          - ''
        description: Virtual domain name. Source system.vdom.name.
        references:
        - system.vdom.name
  license_type:
    type: enum
    raw_type: string
    choices:
    - forticare-support
    - fortiguard-webfilter
    - fortiguard-antispam
    - fortiguard-antivirus
    - fortiguard-ips
    - fortiguard-management
    - forticloud
    - any
    version_ranges:
    - - v6.0.0
      - ''
    description: License type.
  report_type:
    type: enum
    raw_type: string
    choices:
    - posture
    - coverage
    - optimization
    - any
    version_ranges:
    - - v6.4.0
      - ''
    description: Security Rating report.
  stitch_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Triggering stitch name. Source system.automation-stitch.name.
    references:
    - system.automation-stitch.name
  logid:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Log IDs to trigger event.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: Log ID. see <a href='#notes'>Notes</a>.
  trigger_frequency:
    type: enum
    raw_type: string
    choices:
    - hourly
    - daily
    - weekly
    - monthly
    - once
    version_ranges:
    - - v6.0.0
      - ''
    description: Scheduled trigger frequency .
  trigger_weekday:
    type: enum
    raw_type: string
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of week for trigger.
  trigger_day:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Day within a month to trigger.
  trigger_hour:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Hour of the day on which to trigger (0 - 23).
  trigger_minute:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Minute of the hour on which to trigger (0 - 59).
  trigger_datetime:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Trigger date and time (YYYY-MM-DD HH:MM:SS).
  fields:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Customized trigger field settings.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Entry ID. see <a href='#notes'>Notes</a>.
      name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Name.
      value:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Value.
  faz_event_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiAnalyzer event handler name.
  faz_event_severity:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiAnalyzer event severity.
  faz_event_tags:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiAnalyzer event tags.
  serial:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Fabric connector serial number.
  fabric_event_name:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Fabric connector event handler name.
  fabric_event_severity:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Fabric connector event severity.
