id: system.dns-database
version: 7.6.7
source_object: fortios_system_dns_database
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_dns_database.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Zone name.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this DNS zone.
  domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name.
  allow_transfer:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS zone transfer IP address list.
  type:
    type: enum
    raw_type: string
    choices:
    - primary
    - secondary
    version_ranges:
    - - v6.0.0
      - ''
    description: Zone type (primary to manage entries directly, secondary to import entries from other zones).
  view:
    type: enum
    raw_type: string
    choices:
    - shadow
    - public
    - shadow-ztna
    - proxy
    version_ranges:
    - - v6.0.0
      - ''
    description: Zone view (public to serve public clients, shadow to serve internal clients).
  ip_primary:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: IP address of primary DNS server. Entries in this primary DNS server and imported into the DNS zone.
  primary_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Domain name of the default DNS server for this zone.
  contact:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Email address of the administrator for this zone. You can specify only the username, such as admin or the
      full email address, such as admin@test.com When using only a username, the domain of the email will be this zone.
  ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default time-to-live value for the entries of this DNS zone (0 - 2147483647 sec).
  authoritative:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable authoritative zone.
  forwarder:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS zone forwarder IP address list.
  forwarder6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Forwarder IPv6 address.
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP for forwarding to DNS server.
  source_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: IPv6 source IP address for forwarding to DNS server.
  source_ip_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: IP address of the specified interface as the source IP address. Source system.interface.name.
    references:
    - system.interface.name
  rr_max:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Maximum number of resource records (10 - 65536, 0 means infinite).
  dns_entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: DNS entry.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: DNS entry ID. see <a href='#notes'>Notes</a>.
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable resource record status.
      type:
        type: enum
        raw_type: string
        choices:
        - A
        - NS
        - CNAME
        - MX
        - AAAA
        - PTR
        - PTR_V6
        version_ranges:
        - - v6.0.0
          - ''
        description: Resource record type.
      ttl:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Time-to-live for this entry (0 to 2147483647 sec).
      preference:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: DNS entry preference (0 - 65535, highest preference = 0).
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 address of the host.
      ipv6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv6 address of the host.
      hostname:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Name of the host.
      canonical_name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Canonical name of the host.
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v7.6.1
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
