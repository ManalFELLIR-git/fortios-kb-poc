id: waf.profile
version: 7.6.7
source_object: fortios_waf_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_waf_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: WAF Profile name.
  external:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Disable/Enable external HTTP Inspection.
  extended_log:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable extended logging.
  signature:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: WAF signatures.
    children:
      disabled_sub_class:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Disabled signature subclasses.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Signature subclass ID. see <a href='#notes'>Notes</a>. Source waf.sub-class.id.
            references:
            - waf.sub-class.id
      disabled_signature:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Disabled signatures.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Signature ID. see <a href='#notes'>Notes</a>. Source waf.signature.id.
            references:
            - waf.signature.id
      credit_card_detection_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: The minimum number of Credit cards to detect violation.
      custom_signature:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom signature.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Signature name.
          status:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Status.
          action:
            type: enum
            raw_type: string
            choices:
            - allow
            - block
            - erase
            version_ranges:
            - - v6.0.0
              - ''
            description: Action.
          log:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable logging.
          severity:
            type: enum
            raw_type: string
            choices:
            - high
            - medium
            - low
            version_ranges:
            - - v6.0.0
              - ''
            description: Severity.
          direction:
            type: enum
            raw_type: string
            choices:
            - request
            - response
            version_ranges:
            - - v6.0.0
              - ''
            description: Traffic direction.
          case_sensitivity:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v6.0.0
              - ''
            description: Case sensitivity in pattern.
          pattern:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Match pattern.
          target:
            type: enum
            raw_type: list
            choices:
            - arg
            - arg-name
            - req-body
            - req-cookie
            - req-cookie-name
            - req-filename
            - req-header
            - req-header-name
            - req-raw-uri
            - req-uri
            - resp-body
            - resp-hdr
            - resp-status
            multiple_values: true
            elements: str
            version_ranges:
            - - v6.0.0
              - ''
            description: Match HTTP target.
