id: firewall.profile-protocol-options
version: 7.6.7
source_object: fortios_firewall_profile_protocol_options
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_profile_protocol_options.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  replacemsg_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the replacement message group to be used. Source system.replacemsg-group.name.
    references:
    - system.replacemsg-group.name
  oversize_log:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging for antivirus oversize file blocking.
  switching_protocols_log:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging for HTTP/HTTPS switching protocols.
  http:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure HTTP protocol options.
    children:
      ports:
        type: list
        raw_type: list
        multiple_values: true
        elements: int
        version_ranges:
        - - v6.0.0
          - ''
        description: Ports to scan for content (1 - 65535).
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable the active status of scanning for this protocol.
      inspect_all:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable the inspection of all ports for the protocol.
      proxy_after_tcp_handshake:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.4.0
          - ''
        description: Proxy traffic after the TCP 3-way handshake has been established (not before).
      options:
        type: enum
        raw_type: list
        choices:
        - clientcomfort
        - servercomfort
        - oversize
        - chunkedbypass
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: One or more options that can be applied to the session.
      comfort_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Interval between successive transmissions of data for client comforting (seconds).
      comfort_amount:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Number of bytes to send in each transmission for client comforting (bytes).
      range_block:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable blocking of partial downloads.
      strip_x_forwarded_for:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable stripping of HTTP X-Forwarded-For header.
      post_lang:
        type: enum
        raw_type: list
        choices:
        - jisx0201
        - jisx0208
        - jisx0212
        - gb2312
        - ksc5601-ex
        - euc-jp
        - sjis
        - iso2022-jp
        - iso2022-jp-1
        - iso2022-jp-2
        - euc-cn
        - ces-gbk
        - hz
        - ces-big5
        - euc-kr
        - iso2022-jp-3
        - iso8859-1
        - tis620
        - cp874
        - cp1252
        - cp1251
        multiple_values: true
        elements: str
        version_ranges:
        - - v6.0.0
          - ''
        description: ID codes for character sets to be used to convert to UTF-8 for banned words and DLP on HTTP posts (maximum
          of 5 character sets).
      streaming_content_bypass:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable bypassing of streaming content from buffering.
      streaming_content_scan_type:
        type: enum
        raw_type: list
        choices:
        - flv
        - octet
        - dvi
        - rtmp
        - mms-framed
        - msmediaview
        - pncmd
        - rtsp-tunnel
        - audio
        - audio-accp
        - audio-mpeg
        - pn-realaudio
        - pn-realaudio-plugin
        - mixed
        - x-mixed
        - event-stream
        - video
        - video-mp4
        - video-mpeg
        - video-xflv
        - video-xasf
        multiple_values: true
        elements: str
        version_ranges:
        - - v7.6.7
          - ''
        description: Enforce scan on certain streaming content type when streaming-content-bypass is enabled.
      switching_protocols:
        type: enum
        raw_type: string
        choices:
        - bypass
        - block
        version_ranges:
        - - v6.0.0
          - ''
        description: Bypass from scanning, or block a connection that attempts to switch protocol.
      unknown_http_version:
        type: enum
        raw_type: string
        choices:
        - reject
        - tunnel
        - best-effort
        version_ranges:
        - - v6.4.0
          - ''
        description: How to handle HTTP sessions that do not comply with HTTP 0.9, 1.0, or 1.1.
      tunnel_non_http:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.4.0
          - ''
        description: Configure how to process non-HTTP traffic when a profile configured for HTTP traffic accepts a non-HTTP
          session. Can occur if an application sends non-HTTP traffic using an HTTP destination port.
      h2c:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.0
          - ''
        description: Enable/disable h2c HTTP connection upgrade.
      unknown_content_encoding:
        type: enum
        raw_type: string
        choices:
        - block
        - inspect
        - bypass
        version_ranges:
        - - v7.2.4
          - ''
        description: Configure the action the FortiGate unit will take on unknown content-encoding.
      oversize_limit:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum in-memory file size that can be scanned (MB).
      uncompressed_oversize_limit:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum in-memory uncompressed file size that can be scanned (MB).
      uncompressed_nest_limit:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum nested levels of compression that can be uncompressed and scanned (2 - 100).
      stream_based_uncompressed_limit:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Maximum stream-based uncompressed data size that will be scanned in megabytes. Stream-based uncompression
          used only under certain conditions (unlimited = 0).
      scan_bzip2:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable scanning of BZip2 compressed files.
      verify_dns_for_policy_matching:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable verification of DNS for policy matching.
      block_page_status_code:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Code number returned for blocked HTTP pages (non-FortiGuard only) (100 - 599).
      retry_count:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Number of attempts to retry HTTP connection (0 - 100).
      domain_fronting:
        type: enum
        raw_type: string
        choices:
        - allow
        - monitor
        - block
        - strict
        version_ranges:
        - - v7.6.0
          - ''
        description: Configure HTTP domain fronting .
      tcp_window_type:
        type: enum
        raw_type: string
        choices:
        - auto-tuning
        - system
        - static
        - dynamic
        version_ranges:
        - - v6.2.0
          - ''
        description: TCP window type to use for this protocol.
      tcp_window_minimum:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Minimum dynamic TCP window size.
      tcp_window_maximum:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Maximum dynamic TCP window size.
      tcp_window_size:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Set TCP static window size.
      ssl_offloaded:
        type: enum
        raw_type: string
        choices:
        - 'no'
        - 'yes'
        version_ranges:
        - - v6.2.0
          - ''
        description: SSL decryption and encryption performed by an external device.
      address_ip_rating:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.0.6
          - ''
        description: Enable/disable IP based URL rating.
      set_http_0dot9:
        type: enum
        raw_type: string
        choices:
        - allow
        - block
        version_ranges:
        - - v7.6.1
          - ''
        description: Configure action to take upon receipt of HTTP 0.9 request.
