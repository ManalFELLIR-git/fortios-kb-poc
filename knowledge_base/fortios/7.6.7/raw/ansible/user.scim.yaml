id: user.scim
version: 7.6.7
source_object: fortios_user_scim
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_scim.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.0
      - ''
    description: SCIM client name.
  id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: SCIM client ID.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable System for Cross-domain Identity Management (SCIM).
  base_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Server URL to receive SCIM create, read, update, delete (CRUD) requests.
  auth_method:
    type: enum
    raw_type: string
    choices:
    - token
    - base
    version_ranges:
    - - v7.6.1
      - ''
    description: TLS client authentication methods .
  token_certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Certificate for token verification. Source vpn.certificate.remote.name vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
    - vpn.certificate.remote.name
  secret:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Secret for token verification or base authentication.
  certificate:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Certificate for client verification during TLS handshake. Source vpn.certificate.ca.name vpn.certificate.remote.name
      certificate.ca.name certificate.remote.name.
    references:
    - certificate.ca.name
    - certificate.remote.name
    - vpn.certificate.ca.name
    - vpn.certificate.remote.name
  client_identity_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable client identity check.
  cascade:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable to follow SCIM users/groups changes in IDP.
