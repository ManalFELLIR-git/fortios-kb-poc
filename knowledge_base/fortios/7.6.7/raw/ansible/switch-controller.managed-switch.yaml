id: switch-controller.managed-switch
version: 7.6.7
source_object: fortios_switch_controller_managed_switch
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_managed_switch.py
root_type: list
attributes:
  switch_id:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Managed-switch name.
  sn:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Managed-switch serial number.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  switch_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch profile. Source switch-controller.switch-profile.name.
    references:
    - switch-controller.switch-profile.name
  access_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: FortiSwitch access profile. Source switch-controller.security-policy.local-access.name.
    references:
    - switch-controller.security-policy.local-access.name
  purdue_level:
    type: enum
    raw_type: string
    choices:
    - '1'
    - '1.5'
    - '2'
    - '2.5'
    - '3'
    - '3.5'
    - '4'
    - '5'
    - '5.5'
    version_ranges:
    - - v7.4.2
      - ''
    description: Purdue Level of this FortiSwitch.
  fsw_wan1_peer:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch WAN1 peer port. Source system.interface.name.
    references:
    - system.interface.name
  fsw_wan1_admin:
    type: enum
    raw_type: string
    choices:
    - discovered
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch WAN1 admin status; enable to authorize the FortiSwitch as a managed switch.
  poe_pre_standard_detection:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable PoE pre-standard detection.
  dhcp_server_access_list:
    type: enum
    raw_type: string
    choices:
    - global
    - enable
    - disable
    version_ranges:
    - - v7.0.1
      - ''
    description: DHCP snooping server access list.
  poe_detection_type:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: PoE detection type for FortiSwitch.
  version:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiSwitch version.
  max_allowed_trunk_members:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v6.0.11
    - - v6.2.3
      - v6.2.3
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: FortiSwitch maximum allowed trunk members.
  pre_provisioned:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Pre-provisioned managed switch.
  mgmt_mode:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.2
      - ''
    description: FortiLink management mode.
  dynamic_capability:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: List of features this FortiSwitch supports (not configurable) that is sent to the FortiGate device for subsequent
      configuration initiated by the FortiGate device.
  switch_device_tag:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User definable label/tag.
  switch_dhcp_opt43_key:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: DHCP option43 key.
  mclag_igmp_snooping_aware:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable MCLAG IGMP-snooping awareness.
  ptp_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable PTP profile on this FortiSwitch.
  ptp_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: PTP profile configuration. Source switch-controller.ptp.profile.name.
    references:
    - switch-controller.ptp.profile.name
  radius_nas_ip_override:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Use locally defined NAS-IP.
  radius_nas_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: NAS-IP address.
  route_offload:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable route offload on this FortiSwitch.
  route_offload_mclag:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable route offload MCLAG on this FortiSwitch.
  route_offload_router:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.1
      - ''
    description: Configure route offload MCLAG IP address.
    children:
      vlan_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.1
          - ''
        description: VLAN name. Source system.interface.name.
        references:
        - system.interface.name
      router_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v7.4.1
          - ''
        description: Router IP address.
  vlan:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: Configure VLAN assignment priority.
    children:
      vlan_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: VLAN name. Source system.interface.name.
        references:
        - system.interface.name
      assignment_priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.4.2
          - ''
        description: 802.1x Radius (Tunnel-Private-Group-Id) VLANID assign-by-name priority. A smaller value has a higher
          priority.
  type:
    type: enum
    raw_type: string
    choices:
    - virtual
    - physical
    version_ranges:
    - - v6.0.0
      - ''
    description: Indication of switch type, physical or virtual.
  owner_vdom:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: VDOM which owner of port belongs to.
  flow_identity:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Flow-tracking netflow ipfix switch identity in hex format(00000000-FFFFFFFF ).
  staged_image_version:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Staged image version for FortiSwitch.
  delayed_restart_trigger:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Delayed restart triggered for this FortiSwitch.
  firmware_provision:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable provisioning of firmware to FortiSwitches on join connection.
  firmware_provision_version:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Firmware version to provision to this FortiSwitch on bootup (major.minor.build, i.e. 6.2.1234).
  firmware_provision_latest:
    type: enum
    raw_type: string
    choices:
    - disable
    - once
    version_ranges:
    - - v7.0.4
      - ''
    description: Enable/disable one-time automatic provisioning of the latest firmware version.
  ports:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Managed-switch port list.
    children:
      port_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Switch port name.
      port_owner:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Switch port name.
      speed:
        type: enum
        raw_type: string
        choices:
        - 10half
        - 10full
        - 100half
        - 100full
        - 1000full
        - 10000full
        - auto
        - 1000auto
        - 1000full-fiber
        - 40000full
        - 100FX-half
        - 100FX-full
        - 100000full
        - 2500auto
        - 2500full
        - 25000full
        - 50000full
        - 10000cr
        - 10000sr
        - 100000sr4
        - 100000cr4
        - 40000sr4
        - 40000cr4
        - 40000auto
        - 25000cr
        - 25000sr
        - 50000cr
        - 50000sr
        - 5000auto
        - sgmii-auto
        - auto-module
        version_ranges:
        - - v6.0.0
          - ''
        description: Switch port speed; default and available settings depend on hardware.
      status:
        type: enum
        raw_type: string
        choices:
        - up
        - down
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Switch port admin status: up or down.'
      poe_status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable PoE status.
      ip_source_guard:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.4.0
          - ''
        description: Enable/disable IP source guard.
      ptp_status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v7.4.1
          - ''
        description: Enable/disable PTP policy on this FortiSwitch port.
      ptp_policy:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: PTP policy configuration. Source switch-controller.ptp.interface-policy.name.
        references:
        - switch-controller.ptp.interface-policy.name
      aggregator_mode:
        type: enum
        raw_type: string
        choices:
        - bandwidth
        - count
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: LACP member select mode.
      flapguard:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.0
          - ''
        description: Enable/disable flap guard.
      flap_rate:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - ''
        description: Number of stage change events needed within flap-duration.
      flap_duration:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - ''
        description: Period over which flap events are calculated (seconds).
      flap_timeout:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.0
          - ''
        description: Flap guard disabling protection (min).
      rpvst_port:
        type: enum
        raw_type: string
        choices:
        - disabled
        - enabled
        version_ranges:
        - - v6.4.0
          - v6.4.0
        - - v6.4.4
          - ''
        description: Enable/disable inter-operability with rapid PVST on this interface.
      poe_pre_standard_detection:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable PoE pre-standard detection.
      poe_capable:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: PoE capable.
      pd_capable:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.0
          - ''
        description: Powered device capable.
      poe_mode_bt_cabable:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.4
          - ''
        description: PoE mode IEEE 802.3BT capable.
      poe_port_mode:
        type: enum
        raw_type: string
        choices:
        - ieee802-3af
        - ieee802-3at
        - ieee802-3bt
        version_ranges:
        - - v7.2.4
          - ''
        description: Configure PoE port mode.
      poe_port_priority:
        type: enum
        raw_type: string
        choices:
        - critical-priority
        - high-priority
        - low-priority
        - medium-priority
        version_ranges:
        - - v7.2.4
          - ''
        description: Configure PoE port priority.
      poe_port_power:
        type: enum
        raw_type: string
        choices:
        - normal
        - perpetual
        - perpetual-fast
        version_ranges:
        - - v7.2.4
          - ''
        description: Configure PoE port power.
      vlan:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Assign switch ports to a VLAN. Source system.interface.name.
        references:
        - system.interface.name
      allowed_vlans_all:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable all defined vlans on this port.
      allowed_vlans:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure switch port tagged VLANs.
        children:
          vlan_name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: VLAN name. Source system.interface.name.
            references:
            - system.interface.name
      untagged_vlans:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure switch port untagged VLANs.
        children:
          vlan_name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: VLAN name. Source system.interface.name.
            references:
            - system.interface.name
      type:
        type: enum
        raw_type: string
        choices:
        - physical
        - trunk
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Interface type: physical or trunk port.'
      access_mode:
        type: enum
        raw_type: string
        choices:
        - dynamic
        - nac
        - static
        version_ranges:
        - - v6.4.0
          - ''
        description: Access mode of the port.
      matched_dpp_policy:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Matched child policy in the dynamic port policy.
      matched_dpp_intf_tags:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Matched interface tags in the dynamic port policy.
      acl_group:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.0
          - ''
        description: ACL groups on this port.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.0
              - ''
            description: ACL group name. Source switch-controller.acl.group.name.
            references:
            - switch-controller.acl.group.name
      fortiswitch_acls:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.0
          - ''
        description: ACLs on this port.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.4.0
              - ''
            description: ACL ID. see <a href='#notes'>Notes</a>.
      dhcp_snooping:
        type: enum
        raw_type: string
        choices:
        - untrusted
        - trusted
        version_ranges:
        - - v6.0.0
          - ''
        description: Trusted or untrusted DHCP-snooping interface.
      dhcp_snoop_option82_trust:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable allowance of DHCP with option-82 on untrusted interface.
      dhcp_snoop_option82_override:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.0
          - ''
        description: Configure DHCP snooping option 82 override.
        children:
          vlan_name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.4.0
              - ''
            description: DHCP snooping option 82 VLAN. Source system.interface.name.
            references:
            - system.interface.name
          circuit_id:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.0
              - ''
            description: Circuit ID string.
          remote_id:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.0
              - ''
            description: Remote ID string.
      arp_inspection_trust:
        type: enum
        raw_type: string
        choices:
        - untrusted
        - trusted
        version_ranges:
        - - v6.0.0
          - ''
        description: Trusted or untrusted dynamic ARP inspection.
      igmp_snooping_flood_reports:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable flooding of IGMP reports to this interface when igmp-snooping enabled.
      mcast_snooping_flood_traffic:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable flooding of IGMP snooping traffic to this interface.
      stp_state:
        type: enum
        raw_type: string
        choices:
        - enabled
        - disabled
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable Spanning Tree Protocol (STP) on this interface.
      stp_root_guard:
        type: enum
        raw_type: string
        choices:
        - enabled
        - disabled
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable STP root guard on this interface.
      stp_bpdu_guard:
        type: enum
        raw_type: string
        choices:
        - enabled
        - disabled
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable STP BPDU guard on this interface.
      stp_bpdu_guard_timeout:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: BPDU Guard disabling protection (0 - 120 min).
      edge_port:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable this interface as an edge port, bridging connections between workstations and/or computers.
      discard_mode:
        type: enum
        raw_type: string
        choices:
        - none
        - all-untagged
        - all-tagged
        version_ranges:
        - - v6.0.0
          - ''
        description: Configure discard mode for port.
      packet_sampler:
        type: enum
        raw_type: string
        choices:
        - enabled
        - disabled
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable packet sampling on this interface.
      packet_sample_rate:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Packet sampling rate (0 - 99999 p/sec).
      sflow_counter_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: sFlow sampling counter polling interval in seconds (0 - 255).
      sample_direction:
        type: enum
        raw_type: string
        choices:
        - tx
        - rx
        - both
        version_ranges:
        - - v6.0.0
          - ''
        description: Packet sampling direction.
      fec_capable:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.0.0
          - ''
        description: FEC capable.
      fec_state:
        type: enum
        raw_type: string
        choices:
        - disabled
        - cl74
        - cl91
        - detect-by-module
        version_ranges:
        - - v7.0.0
          - ''
        description: State of forward error correction.
      flow_control:
        type: enum
        raw_type: string
        choices:
        - disable
        - tx
        - rx
        - both
        version_ranges:
        - - v6.4.4
          - ''
        description: Flow control direction.
      pause_meter:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.4.4
          - ''
        description: Configure ingress pause metering rate, in kbps .
      pause_meter_resume:
        type: enum
        raw_type: string
        choices:
        - 75%
        - 50%
        - 25%
        version_ranges:
        - - v6.4.4
          - ''
        description: Resume threshold for resuming traffic on ingress port.
      loop_guard:
        type: enum
        raw_type: string
        choices:
        - enabled
        - disabled
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable loop-guard on this interface, an STP optimization used to prevent network loops.
      loop_guard_timeout:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Loop-guard timeout (0 - 120 min).
      port_policy:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Switch controller dynamic port policy from available options. Source switch-controller.dynamic-port-policy.name.
        references:
        - switch-controller.dynamic-port-policy.name
      qos_policy:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Switch controller QoS policy from available options. Source switch-controller.qos.qos-policy.name.
        references:
        - switch-controller.qos.qos-policy.name
      storm_control_policy:
        type: string
        raw_type: string
