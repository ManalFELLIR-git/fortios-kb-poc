id: system.standalone-cluster
version: 7.6.7
source_object: fortios_system_standalone_cluster
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_standalone_cluster.py
root_type: object
attributes:
  standalone_group_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Cluster group ID (0 - 255). Must be the same for all members.
  group_member_id:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Cluster member ID (0 - 15).
  layer2_connection:
    type: enum
    raw_type: string
    choices:
    - available
    - unavailable
    version_ranges:
    - - v6.4.0
      - ''
    description: Indicate whether layer 2 connections are present among FGSP members.
  session_sync_dev:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.4.0
      - ''
    description: Offload session-sync process to kernel and sync sessions using connected interface(s) directly. Source system.interface.name.
    references:
    - system.interface.name
  encryption:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable encryption when synchronizing sessions.
  psksecret:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Pre-shared secret for session synchronization (ASCII string or hexadecimal encoded with a leading 0x).
  asymmetric_traffic_control:
    type: enum
    raw_type: string
    choices:
    - cps-preferred
    - strict-anti-replay
    version_ranges:
    - - v7.4.2
      - ''
    description: Asymmetric traffic control mode.
  cluster_peer:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Configure FortiGate Session Life Support Protocol (FGSP) session synchronization.
    children:
      sync_id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: Sync ID. see <a href='#notes'>Notes</a>.
      peervd:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: VDOM that contains the session synchronization link interface on the peer unit. Usually both peers would
          have the same peervd. Source system.vdom.name.
        references:
        - system.vdom.name
      peerip:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: IP address of the interface on the peer unit that is used for the session synchronization link.
      syncvd:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Sessions from these VDOMs are synchronized using this session synchronization configuration.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: VDOM name. Source system.vdom.name.
            references:
            - system.vdom.name
      down_intfs_before_sess_sync:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: List of interfaces to be turned down before session synchronization is complete.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: Interface name. Source system.interface.name.
            references:
            - system.interface.name
      hb_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.1
          - ''
        description: Heartbeat interval (1 - 20) (100*ms). Increase to reduce false positives.
      hb_lost_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.2.1
          - ''
        description: Lost heartbeat threshold (1 - 60). Increase to reduce false positives.
      ipsec_tunnel_sync:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable IPsec tunnel synchronization.
      secondary_add_ipsec_routes:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable IKE route announcement on the backup unit.
      session_sync_filter:
        type: object
        raw_type: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Add one or more filters if you only want to synchronize some sessions. Use the filter to configure the
          types of sessions to synchronize.
        children:
          srcintf:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions from this interface are synchronized. Source system.interface.name.
            references:
            - system.interface.name
          dstintf:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions to this interface are synchronized. Source system.interface.name.
            references:
            - system.interface.name
          srcaddr:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions from this IPv4 address are synchronized.
          dstaddr:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions to this IPv4 address are synchronized.
          srcaddr6:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions from this IPv6 address are synchronized.
          dstaddr6:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions to this IPv6 address are synchronized.
          custom_service:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v7.2.1
              - ''
            description: Only sessions using these custom services are synchronized. Use source and destination port ranges
              to define these custom services.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v7.2.1
                  - ''
                description: Custom service ID. see <a href='#notes'>Notes</a>.
              src_port_range:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Custom service source port range.
              dst_port_range:
                type: string
                raw_type: string
                version_ranges:
                - - v7.2.1
                  - ''
                description: Custom service destination port range.
  monitor_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.0
      - ''
    description: Configure a list of interfaces on which to monitor itself. Monitoring is performed on the status of the interface.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  pingsvr_monitor_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.0
      - ''
    description: List of pingsvr monitor interface to check for remote IP monitoring.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.0
          - ''
        description: Interface name. Source system.interface.name.
        references:
        - system.interface.name
  monitor_prefix:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: Configure a list of routing prefixes to monitor.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      vdom:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: VDOM name. Source system.vdom.name.
        references:
        - system.vdom.name
      vrf:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: VRF ID.
      prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.1
          - ''
        description: Prefix.
  helper_traffic_bounce:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable helper related traffic bounce.
  utm_traffic_bounce:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.4
      - ''
    description: Enable/disable UTM related traffic bounce, disable it may stop the asymmetric-traffic UTM features from working.
