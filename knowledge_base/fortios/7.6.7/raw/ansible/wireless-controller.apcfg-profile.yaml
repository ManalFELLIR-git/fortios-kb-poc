id: wireless-controller.apcfg-profile
version: 7.6.7
source_object: fortios_wireless_controller_apcfg_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wireless_controller_apcfg_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: AP local configuration profile name.
  ap_family:
    type: enum
    raw_type: string
    choices:
    - fap
    - fap-u
    - fap-c
    version_ranges:
    - - v7.0.2
      - ''
    description: FortiAP family type .
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Comment.
  ac_type:
    type: enum
    raw_type: string
    choices:
    - default
    - specify
    - apcfg
    version_ranges:
    - - v6.4.0
      - ''
    description: Validation controller type .
  ac_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Maximum waiting time for the AP to join the validation controller after applying AP local configuration (3
      - 30 min).
  ac_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: IP address of the validation controller that AP must be able to join after applying AP local configuration.
  ac_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Port of the validation controller that AP must be able to join after applying AP local configuration (1024
      - 49150).
  command_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: AP local configuration command list.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Command ID. see <a href='#notes'>Notes</a>.
      type:
        type: enum
        raw_type: string
        choices:
        - non-password
        - password
        version_ranges:
        - - v6.4.0
          - ''
        description: The command type .
      name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: AP local configuration command name.
      value:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: AP local configuration command value.
      passwd_value:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: AP local configuration command password value.
