id: user.fsso-polling
version: 7.6.7
source_object: fortios_user_fsso_polling
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_fsso_polling.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Active Directory server ID. see <a href='#notes'>Notes</a>.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable polling for the status of this Active Directory server.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Host name or IP address of the Active Directory server.
  default_domain:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default domain managed by this Active Directory server.
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to communicate with this Active Directory server.
  user:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: User name required to log into this Active Directory server.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password required to log into this Active Directory server.
  ldap_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP server name used in LDAP connection strings. Source user.ldap.name.
    references:
    - user.ldap.name
  logon_history:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of hours of logon history to keep, 0 means keep all history.
  polling_frequency:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Polling frequency (every 1 to 30 seconds).
  adgrp:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP Group Info.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Name.
  smbv1:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable support of SMBv1 for Samba.
  smb_ntlmv1_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable support of NTLMv1 for Samba authentication.
