id: firewall.shaper.per-ip-shaper
version: 7.6.7
source_object: fortios_firewall_shaper_per_ip_shaper
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_shaper_per_ip_shaper.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Traffic shaper name.
  max_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Upper bandwidth limit enforced by this shaper (0 - 100000000). 0 means no limit. Units depend on the bandwidth-unit
      setting.
  bandwidth_unit:
    type: enum
    raw_type: string
    choices:
    - kbps
    - mbps
    - gbps
    version_ranges:
    - - v6.0.0
      - ''
    description: Unit of measurement for maximum bandwidth for this shaper (Kbps, Mbps or Gbps).
  max_concurrent_session:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum number of concurrent sessions allowed by this shaper (0 - 2097000). 0 means no limit.
  max_concurrent_tcp_session:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Maximum number of concurrent TCP sessions allowed by this shaper (0 - 2097000). 0 means no limit.
  max_concurrent_udp_session:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Maximum number of concurrent UDP sessions allowed by this shaper (0 - 2097000). 0 means no limit.
  diffserv_forward:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable changing the Forward (original) DiffServ setting applied to traffic accepted by this shaper.
  diffserv_reverse:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable changing the Reverse (reply) DiffServ setting applied to traffic accepted by this shaper.
  diffservcode_forward:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Forward (original) DiffServ setting to be applied to traffic accepted by this shaper.
  diffservcode_rev:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Reverse (reply) DiffServ setting to be applied to traffic accepted by this shaper.
