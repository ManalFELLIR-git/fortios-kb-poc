id: ips.settings
version: 7.6.7
source_object: fortios_ips_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ips_settings.py
root_type: object
attributes:
  packet_log_history:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of packets to capture before and including the one in which the IPS signature is detected (1 - 255).
  packet_log_post_attack:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of packets to log after the IPS signature is detected (0 - 255).
  packet_log_memory:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum memory can be used by packet log (64 - 8192 kB).
  ips_packet_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum amount of disk space in MB for logged packets when logging to disk. Range depends on disk size.
  proxy_inline_ips:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable proxy-mode policy inline IPS support.
  ha_session_pickup:
    type: enum
    raw_type: string
    choices:
    - connectivity
    - security
    version_ranges:
    - - v7.6.0
      - ''
    description: IPS HA failover session pickup preference.
