id: wanopt.cache-service
version: 7.6.7
source_object: fortios_wanopt_cache_service
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wanopt_cache_service.py
root_type: object
attributes:
  prefer_scenario:
    type: enum
    raw_type: string
    choices:
    - balance
    - prefer-speed
    - prefer-cache
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the preferred cache behavior towards the balance between latency and hit-ratio.
  collaboration:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable cache-collaboration between cache-service clusters.
  device_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Set identifier for this cache device.
  acceptable_connections:
    type: enum
    raw_type: string
    choices:
    - any
    - peers
    version_ranges:
    - - v6.0.0
      - ''
    description: Set strategy when accepting cache collaboration connection.
  dst_peer:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Modify cache-service destination peer list.
    children:
      device_id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Device ID of this peer.
      auth_type:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set authentication type for this peer.
      encode_type:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set encode type for this peer.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set priority for this peer.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Set cluster IP address of this peer.
  src_peer:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Modify cache-service source peer list.
    children:
      device_id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Device ID of this peer.
      auth_type:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set authentication type for this peer.
      encode_type:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set encode type for this peer.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Set priority for this peer.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Set cluster IP address of this peer.
