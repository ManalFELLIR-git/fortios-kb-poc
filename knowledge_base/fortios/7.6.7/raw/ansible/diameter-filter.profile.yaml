id: diameter-filter.profile
version: 7.6.7
source_object: fortios_diameter_filter_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_diameter_filter_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.4.2
      - ''
    description: Profile name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Comment.
  monitor_all_messages:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable logging for all User Name and Result Code AVP messages.
  log_packet:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable packet log for triggered diameter settings.
  track_requests_answers:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable validation that each answer has a corresponding request.
  missing_request_action:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for answers without corresponding request.
  protocol_version_invalid:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for invalid protocol version.
  message_length_invalid:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for invalid message length.
  request_error_flag_set:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for request messages with error flag set.
  cmd_flags_reserve_set:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for messages with cmd flag reserve bits set.
  command_code_invalid:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    - reset
    - monitor
    version_ranges:
    - - v7.4.2
      - ''
    description: Action to be taken for messages with invalid command code.
  command_code_range:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Valid range for command codes (0-16777215).
