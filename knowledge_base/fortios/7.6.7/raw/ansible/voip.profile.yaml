id: voip.profile
version: 7.6.7
source_object: fortios_voip_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_voip_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Profile name.
  feature_set:
    type: enum
    raw_type: string
    choices:
    - ips
    - voipd
    version_ranges:
    - - v7.0.0
      - ''
    description: IPS or voipd (SIP-ALG) inspection feature set.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  sip:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: SIP.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable SIP.
      rtp:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable create pinholes for RTP traffic to traverse firewall.
      nat_port_range:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: RTP NAT port range.
      open_register_pinhole:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable open pinhole for REGISTER Contact port.
      open_contact_pinhole:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable open pinhole for non-REGISTER Contact port.
      strict_register:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable only allow the registrar to connect.
      register_rate:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: REGISTER request rate limit (per second, per policy).
      register_rate_track:
        type: enum
        raw_type: string
        choices:
        - none
        - src-ip
        - dest-ip
        version_ranges:
        - - v7.0.0
          - ''
        description: Track the packet protocol field.
      invite_rate:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: INVITE request rate limit (per second, per policy).
      invite_rate_track:
        type: enum
        raw_type: string
        choices:
        - none
        - src-ip
        - dest-ip
        version_ranges:
        - - v7.0.0
          - ''
        description: Track the packet protocol field.
      max_dialogs:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum number of concurrent calls/dialogs (per policy).
      max_line_length:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Maximum SIP header line length (78-4096).
      block_long_lines:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block requests with headers exceeding max-line-length.
      block_unknown:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Block unrecognized SIP requests (enabled by default).
      call_keepalive:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Continue tracking calls with no RTP for this many minutes.
      block_ack:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block ACK requests.
      block_bye:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block BYE requests.
      block_cancel:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block CANCEL requests.
      block_info:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block INFO requests.
      block_invite:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block INVITE requests.
      block_message:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block MESSAGE requests.
      block_notify:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block NOTIFY requests.
      block_options:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block OPTIONS requests and no OPTIONS as notifying message for redundancy either.
      block_prack:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable block prack requests.
      block_publish:
        type: enum
