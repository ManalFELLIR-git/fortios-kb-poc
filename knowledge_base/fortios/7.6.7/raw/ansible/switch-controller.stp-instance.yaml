id: switch-controller.stp-instance
version: 7.6.7
source_object: fortios_switch_controller_stp_instance
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_stp_instance.py
root_type: list
attributes:
  id:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Instance ID.
  vlan_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure VLAN range for STP instance.
    children:
      vlan_name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: VLAN name. Source system.interface.name.
        references:
        - system.interface.name
