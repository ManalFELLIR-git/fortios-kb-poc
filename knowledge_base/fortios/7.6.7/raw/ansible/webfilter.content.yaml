id: webfilter.content
version: 7.6.7
source_object: fortios_webfilter_content
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_webfilter_content.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of table.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional comments.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure banned word entries.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Banned word.
      pattern_type:
        type: enum
        raw_type: string
        choices:
        - wildcard
        - regexp
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Banned word pattern type: wildcard pattern or Perl regular expression.'
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable banned word.
      score:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Score, to be applied every time the word appears on a web page (0 - 4294967295).
      action:
        type: enum
        raw_type: string
        choices:
        - block
        - exempt
        version_ranges:
        - - v6.0.0
          - ''
        description: Block or exempt word when a match is found.
