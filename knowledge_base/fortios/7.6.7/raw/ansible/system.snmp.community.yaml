id: system.snmp.community
version: 7.6.7
source_object: fortios_system_snmp_community
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_snmp_community.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Community ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Community name.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this SNMP community.
  hosts:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure IPv4 SNMP managers (hosts).
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Host entry ID. see <a href='#notes'>Notes</a>.
      source_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Source IPv4 address for SNMP traps.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IPv4 address of the SNMP manager (host).
      ha_direct:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable direct management of HA cluster members.
      host_type:
        type: enum
        raw_type: string
        choices:
        - any
        - query
        - trap
        version_ranges:
        - - v6.0.0
          - ''
        description: Control whether the SNMP manager sends SNMP queries, receives SNMP traps, or both. No traps will be sent
          when IP type is subnet.
      interface_select_method:
        type: enum
        raw_type: string
        choices:
        - auto
        - sdwan
        - specify
        version_ranges:
        - - v7.6.0
          - ''
        description: Specify how to select outgoing interface to reach server.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.0
          - ''
        description: Specify outgoing interface to reach server. Source system.interface.name.
        references:
        - system.interface.name
      vrf_select:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: VRF ID used for connection to server.
  hosts6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure IPv6 SNMP managers.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Host6 entry ID. see <a href='#notes'>Notes</a>.
      source_ipv6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Source IPv6 address for SNMP traps.
      ipv6:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: SNMP manager IPv6 address prefix.
      ha_direct:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable direct management of HA cluster members.
      host_type:
        type: enum
        raw_type: string
        choices:
        - any
        - query
        - trap
        version_ranges:
        - - v6.0.0
          - ''
        description: Control whether the SNMP manager sends SNMP queries, receives SNMP traps, or both.
      interface_select_method:
        type: enum
        raw_type: string
        choices:
        - auto
        - sdwan
        - specify
        version_ranges:
        - - v7.6.0
          - ''
        description: Specify how to select outgoing interface to reach server.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v7.6.0
          - ''
        description: Specify outgoing interface to reach server. Source system.interface.name.
        references:
        - system.interface.name
      vrf_select:
        type: integer
        raw_type: integer
        version_ranges:
        - - v7.6.1
          - ''
        description: VRF ID used for connection to server.
  query_v1_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SNMP v1 queries.
  query_v1_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v1 query port .
  query_v2c_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SNMP v2c queries.
  query_v2c_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v2c query port .
  trap_v1_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SNMP v1 traps.
  trap_v1_lport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v1 trap local port .
  trap_v1_rport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v1 trap remote port .
  trap_v2c_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SNMP v2c traps.
  trap_v2c_lport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v2c trap local port .
  trap_v2c_rport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP v2c trap remote port .
  events:
    type: enum
    raw_type: list
    choices:
    - cpu-high
    - mem-low
    - log-full
    - intf-ip
    - vpn-tun-up
    - vpn-tun-down
    - ha-switch
    - ha-hb-failure
    - ips-signature
    - ips-anomaly
    - av-virus
    - av-oversize
    - av-pattern
    - av-fragmented
    - fm-if-change
    - fm-conf-change
    - bgp-established
    - bgp-backward-transition
    - ha-member-up
    - ha-member-down
    - ent-conf-change
    - av-conserve
    - av-bypass
    - av-oversize-passed
    - av-oversize-blocked
    - ips-pkg-update
    - ips-fail-open
    - temperature-high
    - voltage-alert
    - power-supply
    - faz-disconnect
    - faz
    - fan-failure
    - wc-ap-up
    - wc-ap-down
    - fswctl-session-up
    - fswctl-session-down
    - load-balance-real-server-down
    - device-new
    - per-cpu-high
    - dhcp
    - pool-usage
    - ippool
    - interface
    - ospf-nbr-state-change
    - ospf-virtnbr-state-change
    - bfd
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: SNMP trap events.
  mib_view:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: SNMP access control MIB view. Source system.snmp.mib-view.name.
    references:
    - system.snmp.mib-view.name
  vdoms:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.0
      - ''
    description: SNMP access control VDOMs.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.0
          - ''
        description: VDOM name. Source system.vdom.name.
        references:
        - system.vdom.name
