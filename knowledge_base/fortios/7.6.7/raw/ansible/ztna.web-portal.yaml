id: ztna.web-portal
version: 7.6.7
source_object: fortios_ztna_web_portal
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ztna_web_portal.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: ZTNA web portal name.
  vip:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual IP name. Source firewall.vip.name.
    references:
    - firewall.vip.name
  host:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual or real host name. Source firewall.access-proxy-virtual-host.name.
    references:
    - firewall.access-proxy-virtual-host.name
  decrypted_traffic_mirror:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Decrypted traffic mirror. Source firewall.decrypted-traffic-mirror.name.
    references:
    - firewall.decrypted-traffic-mirror.name
  vip6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Virtual IPv6 name. Source firewall.vip6.name.
    references:
    - firewall.vip6.name
  auth_rule:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Authentication Rule. Source authentication.rule.name.
    references:
    - authentication.rule.name
  display_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable to display the web portal bookmark widget.
  focus_bookmark:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable to prioritize the placement of the bookmark section over the quick-connection section in the ztna
      web-portal.
  display_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable to display the web portal status widget.
  display_history:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable to display the web portal user login history widget.
  policy_auth_sso:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable policy sso authentication.
  heading:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Web portal heading message.
  theme:
    type: enum
    raw_type: string
    choices:
    - jade
    - neutrino
    - mariner
    - graphite
    - melongene
    - jet-stream
    - security-fabric
    - dark-matter
    - onyx
    - eclipse
    version_ranges:
    - - v7.6.1
      - ''
    description: Web portal color scheme.
  clipboard:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable to support RDP/VPC clipboard functionality.
  default_window_width:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Screen width (range from 0 - 65535).
  default_window_height:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Screen height (range from 0 - 65535).
  cookie_age:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Time in minutes that client web browsers should keep a cookie. Default is 60 minutes. 0 = no time limit.
  forticlient_download:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable download option for FortiClient.
  customize_forticlient_download_url:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable support of customized download URL for FortiClient.
  windows_forticlient_download_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Download URL for Windows FortiClient.
  macos_forticlient_download_url:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Download URL for Mac FortiClient.
  log_blocked_traffic:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - v7.6.7
    description: Enable/disable logging of blocked traffic.
  auth_portal:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - v7.6.7
    description: Enable/disable authentication portal.
  auth_virtual_host:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - v7.6.7
    description: Virtual host for authentication portal. Source firewall.access-proxy-virtual-host.name.
    references:
    - firewall.access-proxy-virtual-host.name
