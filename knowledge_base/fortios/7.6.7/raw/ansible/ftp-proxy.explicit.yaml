id: ftp-proxy.explicit
version: 7.6.7
source_object: fortios_ftp_proxy_explicit
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_ftp_proxy_explicit.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the explicit FTP proxy.
  incoming_port:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept incoming FTP requests on one or more ports.
  incoming_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept incoming FTP requests from this IP address. An interface must have this IP address.
  outgoing_ip:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Outgoing FTP requests will leave from this IP address. An interface must have this IP address.
  sec_default_action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept or deny explicit FTP proxy sessions when no FTP proxy firewall policy exists.
  server_data_mode:
    type: enum
    raw_type: string
    choices:
    - client
    - passive
    version_ranges:
    - - v7.4.0
      - ''
    description: Determine mode of data session on FTP server side.
  ssl:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable the explicit FTPS proxy.
  ssl_cert_dict:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: List of certificate names to use for SSL connections to this server.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Certificate list. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  ssl_dh_bits:
    type: enum
    raw_type: string
    choices:
    - '768'
    - '1024'
    - '1536'
    - '2048'
    version_ranges:
    - - v6.2.0
      - ''
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation .
  ssl_algorithm:
    type: enum
    raw_type: string
    choices:
    - high
    - medium
    - low
    version_ranges:
    - - v6.2.0
      - ''
    description: Relative strength of encryption algorithms accepted in negotiation.
