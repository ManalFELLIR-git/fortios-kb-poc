id: switch-controller.lldp-settings
version: 7.6.7
source_object: fortios_switch_controller_lldp_settings
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_lldp_settings.py
root_type: object
attributes:
  tx_hold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of tx-intervals before local LLDP data expires (1 - 16). Packet TTL is tx-hold * tx-interval.
  tx_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency of LLDP PDU transmission from FortiSwitch (5 - 4095 sec). Packet TTL is tx-hold * tx-interval.
  fast_start_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency of LLDP PDU transmission from FortiSwitch for the first 4 packets when the link is up (2 - 5 sec).
  management_interface:
    type: enum
    raw_type: string
    choices:
    - internal
    - mgmt
    version_ranges:
    - - v6.0.0
      - ''
    description: Primary management interface to be advertised in LLDP and CDP PDUs.
  device_detection:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable dynamic detection of LLDP neighbor devices for VLAN assignment.
