id: user.ldap
version: 7.6.7
source_object: fortios_user_ldap
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_ldap.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP server entry name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP server CN domain name or IP.
  secondary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Secondary LDAP server CN domain name or IP.
  tertiary_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Tertiary LDAP server CN domain name or IP.
  status_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled).
  server_identity_check:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable LDAP server identity check (verify server domain name/IP address against the server certificate).
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: FortiGate IP address to be used for communication with the LDAP server.
  source_ip_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Source interface for communication with the LDAP server. Source system.interface.name.
    references:
    - system.interface.name
  source_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Source port to be used for communication with the LDAP server.
  cnid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Common name identifier for the LDAP server. The common name identifier for most LDAP servers is "cn".
  dn:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Distinguished name used to look up entries on the LDAP server.
  type:
    type: enum
    raw_type: string
    choices:
    - simple
    - anonymous
    - regular
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication type for LDAP searches.
  two_factor:
    type: enum
    raw_type: string
    choices:
    - disable
    - fortitoken-cloud
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable two-factor authentication.
  two_factor_authentication:
    type: enum
    raw_type: string
    choices:
    - fortitoken
    - email
    - sms
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Authentication method by FortiToken Cloud.
  two_factor_notification:
    type: enum
    raw_type: string
    choices:
    - email
    - sms
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Notification method for user activation by FortiToken Cloud.
  two_factor_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.1
      - ''
    description: Filter used to synchronize users to FortiToken Cloud.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Username (full DN) for initial binding.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password for initial binding.
  group_member_check:
    type: enum
    raw_type: string
    choices:
    - user-attr
    - group-object
    - posix-group-object
    version_ranges:
    - - v6.0.0
      - ''
    description: Group member checking methods.
  group_search_base:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Search base used for group searching.
  group_object_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Filter used for group searching.
  group_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Filter used for group matching.
  secure:
    type: enum
    raw_type: string
    choices:
    - disable
    - starttls
    - ldaps
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to be used for authentication.
  ssl_min_proto_version:
    type: enum
    raw_type: string
    choices:
    - default
    - SSLv3
    - TLSv1
    - TLSv1-1
    - TLSv1-2
    - TLSv1-3
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum supported protocol version for SSL/TLS connections .
  ca_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: CA certificate name. Source vpn.certificate.ca.name.
    references:
    - vpn.certificate.ca.name
  port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to be used for communication with the LDAP server .
  password_expiry_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable password expiry warnings.
  password_renewal:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable online password renewal.
  member_attr:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of attribute from which to get group membership.
  account_key_processing:
    type: enum
    raw_type: string
    choices:
    - same
    - strip
    version_ranges:
    - - v6.0.0
      - ''
    description: Account key processing operation. The FortiGate will keep either the whole domain or strip the domain from
      the subject identity.
  account_key_cert_field:
    type: enum
    raw_type: string
    choices:
    - othername
    - rfc822name
    - dnsname
    - cn
    version_ranges:
    - - v7.4.1
      - ''
    description: Define subject identity field in certificate for user access right checking.
  account_key_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Account key filter, using the UPN as the search filter.
  search_type:
    type: enum
    raw_type: list
    choices:
    - recursive
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: Search type.
  client_cert_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable using client certificate for TLS authentication.
  client_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Client certificate name. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  obtain_user_info:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable obtaining of user information.
  user_info_exchange_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: MS Exchange server from which to fetch user information. Source user.exchange.name.
    references:
    - user.exchange.name
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
  antiphish:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable AntiPhishing credential backend.
  password_attr:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Name of attribute to get password hash.
