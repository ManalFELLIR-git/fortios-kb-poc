id: system.lldp.network-policy
version: 7.6.7
source_object: fortios_system_lldp_network_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_lldp_network_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: LLDP network policy name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  voice:
    type: object
    raw_type: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Voice.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable advertising this policy.
      tag:
        type: enum
        raw_type: string
        choices:
        - none
        - dot1q
        - dot1p
        version_ranges:
        - - v6.2.0
          - ''
        description: Advertise tagged or untagged traffic.
      vlan:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: 802.1Q VLAN ID to advertise (1 - 4094).
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: 802.1P CoS/PCP to advertise (0 - 7; from lowest to highest priority).
      dscp:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Differentiated Services Code Point (DSCP) value to advertise.
