id: wanopt.webcache
version: 7.6.7
source_object: fortios_wanopt_webcache
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_wanopt_webcache.py
root_type: object
attributes:
  max_object_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum cacheable object size in kB (1 - 2147483 kb (2GB). All objects that exceed this are delivered to
      the client but not stored in the web cache.
  neg_resp_time:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time in minutes to cache negative responses or errors (0 - 4294967295).
  fresh_factor:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency that the server is checked to see if any objects have expired (1 - 100). The higher the fresh factor,
      the less often the checks occur.
  max_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum time an object can stay in the web cache without checking to see if it has expired on the server
      .
  min_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Minimum time an object can stay in the web cache without checking to see if it has expired on the server
      .
  default_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default object expiry time . This only applies to those objects that do not have an expiry time set by the
      web server.
  ignore_ims:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ignoring the if-modified-since (IMS) header.
  ignore_conditional:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable controlling the behavior of cache-control HTTP 1.1 header values.
  ignore_pnc:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable ignoring the pragma no-cache (PNC) header.
  ignore_ie_reload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Enable/disable ignoring the PNC-interpretation of Internet Explorer"s Accept: / header.'
  cache_expired:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable caching type-1 objects that are already expired on arrival.
  cache_cookie:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable caching cookies. Since cookies contain information for or about individual users, they not
      usually cached.
  reval_pnc:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable revalidation of pragma-no-cache (PNC) to address bandwidth concerns.
  always_revalidate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable revalidation of requested cached objects, which have content on the server, before serving
      it to the client.
  cache_by_default:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable caching content that lacks explicit caching policies from the server.
  host_validate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable validating "Host:" with original server IP.
  external:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable external Web caching.
