id: firewall.address6-template
version: 7.6.7
source_object: fortios_firewall_address6_template
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_address6_template.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address template name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  fabric_object:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Security Fabric global object setting.
  ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 address prefix.
  subnet_segment_count:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of IPv6 subnet segments.
  subnet_segment:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 subnet segments.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Subnet segment ID. see <a href='#notes'>Notes</a>.
      name:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Subnet segment name.
      bits:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Number of bits.
      exclusive:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable exclusive value.
      values:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Subnet segment values.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Subnet segment value name.
          value:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Subnet segment value.
