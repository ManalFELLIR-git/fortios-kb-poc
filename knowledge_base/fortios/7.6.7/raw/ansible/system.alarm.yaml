id: system.alarm
version: 7.6.7
source_object: fortios_system_alarm
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_alarm.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable alarm.
  audible:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable audible alarm.
  groups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Alarm groups.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Group ID. see <a href='#notes'>Notes</a>.
      period:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Time period in seconds (0 = from start up).
      admin_auth_failure_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Admin authentication failure threshold.
      admin_auth_lockout_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Admin authentication lockout threshold.
      user_auth_failure_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: User authentication failure threshold.
      user_auth_lockout_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: User authentication lockout threshold.
      replay_attempt_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Replay attempt threshold.
      self_test_failure_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Self-test failure threshold.
      log_full_warning_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Log full warning threshold.
      encryption_failure_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Encryption failure threshold.
      decryption_failure_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Decryption failure threshold.
      fw_policy_violations:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Firewall policy violations.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Firewall policy violations ID. see <a href='#notes'>Notes</a>.
          threshold:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Firewall policy violation threshold.
          src_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Source IP (0=all).
          dst_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Destination IP (0=all).
          src_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Source port (0=all).
          dst_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Destination port (0=all).
      fw_policy_id:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Firewall policy ID.
      fw_policy_id_threshold:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Firewall policy ID threshold.
