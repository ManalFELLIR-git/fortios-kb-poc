id: monitoring.npu-hpe
version: 7.6.7
source_object: fortios_monitoring_npu_hpe
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_monitoring_npu_hpe.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable HPE status monitoring.
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: HPE status check interval (1 - 60 seconds).
  multipliers:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.0.0
      - ''
    description: HPE type interval multipliers (12 integers from <1> to <255>) number of continuous event logs.
