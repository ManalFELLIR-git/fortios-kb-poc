id: system.geoip-override
version: 7.6.7
source_object: fortios_system_geoip_override
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_geoip_override.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Location name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  country_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Two character Country ID code.
  ip_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Table of IP ranges assigned to country.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID of individual entry in the IP range table. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Starting IP address, inclusive, of the address range (format: xxx.xxx.xxx.xxx).'
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: 'Ending IP address, inclusive, of the address range (format: xxx.xxx.xxx.xxx).'
  ip6_range:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Table of IPv6 ranges assigned to country.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: ID of individual entry in the IPv6 range table. see <a href='#notes'>Notes</a>.
      start_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: 'Starting IP address, inclusive, of the address range (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
      end_ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.4.0
          - ''
        description: 'Ending IP address, inclusive, of the address range (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
