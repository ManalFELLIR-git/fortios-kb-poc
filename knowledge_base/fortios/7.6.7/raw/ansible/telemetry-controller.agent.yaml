id: telemetry-controller.agent
version: 7.6.7
source_object: fortios_telemetry_controller_agent
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_telemetry_controller_agent.py
root_type: list
attributes:
  agent_id:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.3
      - ''
    description: Agent ID.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: Comment.
  alias:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: Alias used in display for ease of distinguishing agents.
  authz:
    type: enum
    raw_type: string
    choices:
    - rejected
    - authorized
    - unauthorized
    version_ranges:
    - - v7.6.3
      - ''
    description: Authorization status of this agent.
  agent_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.3
      - ''
    description: Name of an existing agent profile. Source telemetry-controller.agent-profile.name.
    references:
    - telemetry-controller.agent-profile.name
