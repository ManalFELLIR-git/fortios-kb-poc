id: firewall.internet-service-group
version: 7.6.7
source_object: fortios_firewall_internet_service_group
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_group.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Internet Service group name.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  direction:
    type: enum
    raw_type: string
    choices:
    - source
    - destination
    - both
    version_ranges:
    - - v6.2.0
      - ''
    description: How this service may be used (source, destination or both).
  member:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Internet Service group member.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
