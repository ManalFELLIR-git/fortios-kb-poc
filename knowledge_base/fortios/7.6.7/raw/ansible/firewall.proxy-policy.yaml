id: firewall.proxy-policy
version: 7.6.7
source_object: fortios_firewall_proxy_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_proxy_policy.py
root_type: list
attributes:
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Policy name.
  proxy:
    type: enum
    raw_type: string
    choices:
    - explicit-web
    - transparent-web
    - ftp
    - ssh
    - ssh-tunnel
    - access-proxy
    - ztna-proxy
    - wanopt
    version_ranges:
    - - v6.0.0
      - ''
    description: Type of explicit proxy.
  ztna_proxy:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.0
      - ''
    description: ZTNA proxies.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.0
          - ''
        description: ZTNA proxy name. Source ztna.traffic-forward-proxy.name ztna.web-proxy.name ztna.web-portal.name.
        references:
        - ztna.traffic-forward-proxy.name
        - ztna.web-portal.name
        - ztna.web-proxy.name
  srcintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source interface names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  dstintf:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination interface names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name firewall.proxy-address.name firewall.proxy-addrgrp.name
          system .external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - firewall.proxy-address.name
        - firewall.proxy-addrgrp.name
  poolname:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of IP pool object.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: IP pool name. Source firewall.ippool.name.
        references:
        - firewall.ippool.name
  poolname6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.5
      - ''
    description: Name of IPv6 pool object.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.5
          - ''
        description: IPv6 pool name. Source firewall.ippool6.name.
        references:
        - firewall.ippool6.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name firewall.proxy-address.name firewall.proxy-addrgrp.name
          firewall.vip.name firewall.vipgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - firewall.proxy-address.name
        - firewall.proxy-addrgrp.name
        - firewall.vip.name
        - firewall.vipgrp.name
        - system.external-resource.name
  ztna_ems_tag:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.0
      - ''
    description: ZTNA EMS Tag names.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.0.0
          - ''
        description: EMS Tag name. Source firewall.address.name firewall.addrgrp.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
  ztna_tags_match_logic:
    type: enum
    raw_type: string
    choices:
    - or
    - and
    version_ranges:
    - - v7.0.2
      - ''
    description: ZTNA tag matching logic.
  device_ownership:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: When enabled, the ownership enforcement will be done at policy level.
  url_risk:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.1
      - ''
    description: URL risk level name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.1
          - ''
        description: Risk level name. Source webfilter.ftgd-risk-level.name.
        references:
        - webfilter.ftgd-risk-level.name
  internet_service:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address and service are
      not used.
  internet_service_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: When enabled, Internet Services match against any internet service EXCEPT the selected Internet Service.
  internet_service_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.4.0
      - ''
    description: Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.0
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Custom Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Custom Internet Service group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Internet Service name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Internet Service name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  internet_service6:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable use of Internet Services IPv6 for this policy. If enabled, destination IPv6 address and service
      are not used.
  internet_service6_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: When enabled, Internet Services match against any internet service IPv6 EXCEPT the selected Internet Service
      IPv6.
  internet_service6_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.4
      - ''
    description: Internet Service IPv6 name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.4
          - ''
        description: Internet Service IPv6 name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service6_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.4
      - ''
    description: Internet Service IPv6 group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.4
          - ''
        description: Internet Service IPv6 group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service6_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.4
      - ''
    description: Custom Internet Service IPv6 name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.4
          - ''
        description: Custom Internet Service IPv6 name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service6_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.4
      - ''
    description: Custom Internet Service IPv6 group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.4
          - ''
        description: Custom Internet Service IPv6 group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service6_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Internet Service IPv6 name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Internet Service IPv6 name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  service:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of service objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Service name. Source firewall.service.custom.name firewall.service.group.name.
        references:
        - firewall.service.custom.name
        - firewall.service.group.name
  srcaddr_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: When enabled, source addresses match against any address EXCEPT the specified source addresses.
  dstaddr_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: When enabled, destination addresses match against any address EXCEPT the specified destination addresses.
  ztna_ems_tag_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: When enabled, ZTNA EMS tags match against any tag EXCEPT the specified ZTNA EMS tags.
  service_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: When enabled, services match against any service EXCEPT the specified destination services.
  action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    - redirect
    - isolate
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept or deny traffic matching the policy parameters.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the active status of the policy.
  schedule:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of schedule object. Source firewall.schedule.onetime.name firewall.schedule.recurring.name firewall.schedule.group.name.
    references:
    - firewall.schedule.group.name
    - firewall.schedule.onetime.name
    - firewall.schedule.recurring.name
  logtraffic:
    type: enum
    raw_type: string
    choices:
    - all
    - utm
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging traffic through the policy.
  session_ttl:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: TTL in seconds for sessions accepted by this policy (0 means use the system ).
  srcaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name firewall.proxy-address6.name firewall.proxy-addrgrp6.name
          system.external-resource.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
        - firewall.proxy-address6.name
        - firewall.proxy-addrgrp6.name
        - system.external-resource.name
  dstaddr6:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 destination address objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name firewall.proxy-address6.name firewall.proxy-addrgrp6.name
          firewall.vip6.name firewall.vipgrp6.name system.external-resource.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
        - firewall.proxy-address6.name
        - firewall.proxy-addrgrp6.name
        - firewall.vip6.name
        - firewall.vipgrp6.name
        - system.external-resource.name
  groups:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of group objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Group name. Source user.group.name.
        references:
        - user.group.name
  users:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of user objects.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Group name. Source user.local.name user.certificate.name.
        references:
        - user.certificate.name
        - user.local.name
  http_tunnel_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HTTP tunnel authentication.
  ssh_policy_redirect:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Redirect SSH traffic to matching transparent proxy policy.
  webproxy_forward_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Web proxy forward server name. Source web-proxy.forward-server.name web-proxy.forward-server-group.name.
    references:
    - web-proxy.forward-server-group.name
    - web-proxy.forward-server.name
  isolator_server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Isolator server name. Source web-proxy.isolator-server.name.
    references:
    - web-proxy.isolator-server.name
  webproxy_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of web proxy profile. Source web-proxy.profile.name.
    references:
    - web-proxy.profile.name
  transparent:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable to use the IP address of the client to connect to the server.
  webcache:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Enable/disable web caching.
  webcache_https:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Enable/disable web caching for HTTPS (Requires deep-inspection enabled in ssl-ssh-profile).
  disclaimer:
    type: enum
    raw_type: string
    choices:
    - disable
    - domain
    - policy
    - user
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Web proxy disclaimer setting: by domain, policy, or user.'
  utm_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable the use of UTM profiles/sensors/lists.
  profile_type:
    type: enum
    raw_type: string
    choices:
    - single
    - group
    version_ranges:
    - - v6.0.0
      - ''
    description: Determine whether the firewall policy allows security profile groups or single profiles only.
  profile_group:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of profile group. Source firewall.profile-group.name.
    references:
    - firewall.profile-group.name
  profile_protocol_options:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing Protocol options profile. Source firewall.profile-protocol-options.name.
    references:
    - firewall.profile-protocol-options.name
  ssl_ssh_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing SSL SSH profile. Source firewall.ssl-ssh-profile.name.
    references:
    - firewall.ssl-ssh-profile.name
  av_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing Antivirus profile. Source antivirus.profile.name.
    references:
    - antivirus.profile.name
  webfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing Web filter profile. Source webfilter.profile.name.
    references:
    - webfilter.profile.name
  dnsfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Name of an existing DNS filter profile. Source dnsfilter.profile.name.
    references:
    - dnsfilter.profile.name
  emailfilter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Name of an existing email filter profile. Source emailfilter.profile.name.
    references:
    - emailfilter.profile.name
  dlp_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.2.0
      - ''
    description: Name of an existing DLP profile. Source dlp.profile.name.
    references:
    - dlp.profile.name
  file_filter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Name of an existing file-filter profile. Source file-filter.profile.name.
    references:
    - file-filter.profile.name
  ips_sensor:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing IPS sensor. Source ips.sensor.name.
    references:
    - ips.sensor.name
  application_list:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing Application list. Source application.list.name.
    references:
    - application.list.name
  ips_voip_filter:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.0
      - ''
    description: Name of an existing VoIP (ips) profile. Source voip.profile.name.
    references:
    - voip.profile.name
  sctp_filter_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.1
      - ''
    description: Name of an existing SCTP filter profile. Source sctp-filter.profile.name.
    references:
    - sctp-filter.profile.name
  icap_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of an existing ICAP profile. Source icap.profile.name.
    references:
    - icap.profile.name
