id: system.ftm-push
version: 7.6.7
source_object: fortios_system_ftm_push
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ftm_push.py
root_type: object
attributes:
  proxy:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable communication to the proxy server in FortiGuard configuration.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: Interface of FortiToken Mobile push services server. Source system.interface.name.
    references:
    - system.interface.name
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: IPv4 address or domain name of FortiToken Mobile push services server.
  server_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to communicate with FortiToken Mobile push services server (1 - 65535).
  server_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Name of the server certificate to be used for SSL. Source certificate.local.name.
    references:
    - certificate.local.name
  server_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'IPv4 address of FortiToken Mobile push services server (format: xxx.xxx.xxx.xxx).'
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable the use of FortiToken Mobile push services.
