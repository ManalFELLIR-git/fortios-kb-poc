id: firewall.internet-service-extension
version: 7.6.7
source_object: fortios_firewall_internet_service_extension
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_extension.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: Internet Service ID in the Internet Service database. see <a href='#notes'>Notes</a>. Source firewall.internet-service.id.
    references:
    - firewall.internet-service.id
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Comment.
  entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Entries added to the Internet Service extension database.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Entry ID(1-255). see <a href='#notes'>Notes</a>.
      addr_mode:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        version_ranges:
        - - v7.2.1
          - ''
        description: Address mode (IPv4 or IPv6).
      protocol:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Integer value for the protocol type as defined by IANA (0 - 255).
      port_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Port ranges in the custom entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Custom entry port range ID. see <a href='#notes'>Notes</a>.
          start_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Integer value for starting TCP/UDP/SCTP destination port in range (0 to 65535).
          end_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Integer value for ending TCP/UDP/SCTP destination port in range (0 to 65535).
      dst:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Destination address or address group name.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Select the destination address or address group object from available options. Source firewall.address.name
              firewall .addrgrp.name.
            references:
            - firewall.address.name
      dst6:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Destination address6 or address6 group name.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: Select the destination address6 or address group object from available options. Source firewall.address6.name
              firewall .addrgrp6.name.
            references:
            - firewall.address6.name
  disable_entry:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Disable entries in the Internet Service database.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Disable entry ID. see <a href='#notes'>Notes</a>.
      addr_mode:
        type: enum
        raw_type: string
        choices:
        - ipv4
        - ipv6
        version_ranges:
        - - v7.2.1
          - ''
        description: Address mode (IPv4 or IPv6).
      protocol:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.2.0
          - ''
        description: Integer value for the protocol type as defined by IANA (0 - 255).
      port_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: Port ranges in the disable entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Custom entry port range ID. see <a href='#notes'>Notes</a>.
          start_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Starting TCP/UDP/SCTP destination port (0 to 65535).
          end_port:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.2.0
              - ''
            description: Ending TCP/UDP/SCTP destination port (0 to 65535).
      ip_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: IPv4 ranges in the disable entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Disable entry range ID. see <a href='#notes'>Notes</a>.
          start_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Start IPv4 address.
          end_ip:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: End IPv4 address.
      ip6_range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: IPv6 ranges in the disable entry.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: Disable entry range ID. see <a href='#notes'>Notes</a>.
          start_ip6:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: Start IPv6 address.
          end_ip6:
            type: string
            raw_type: string
            version_ranges:
            - - v7.2.1
              - ''
            description: End IPv6 address.
