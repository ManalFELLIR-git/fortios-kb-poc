id: system.snmp.mib-view
version: 7.6.7
source_object: fortios_system_snmp_mib_view
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_snmp_mib_view.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.2.0
      - ''
    description: MIB view name.
  include:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.2.0
      - ''
    description: OID subtrees to be included in the view. Maximum 16 allowed.
  exclude:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v7.2.0
      - ''
    description: OID subtrees to be excluded in the view. Maximum 64 allowed.
