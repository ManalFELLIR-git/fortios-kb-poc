id: firewall.access-proxy-virtual-host
version: 7.6.7
source_object: fortios_firewall_access_proxy_virtual_host
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_access_proxy_virtual_host.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.0
      - ''
    description: Virtual host name.
  ssl_certificate_dict:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: SSL certificates for this host.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Certificate list. Source vpn.certificate.local.name.
        references:
        - vpn.certificate.local.name
  host:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: The host name.
  host_type:
    type: enum
    raw_type: string
    choices:
    - sub-string
    - wildcard
    version_ranges:
    - - v7.0.0
      - ''
    description: Type of host pattern.
  replacemsg_group:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.1
      - ''
    description: Access-proxy-virtual-host replacement message override group. Source system.replacemsg-group.name.
    references:
    - system.replacemsg-group.name
  empty_cert_action:
    type: enum
    raw_type: string
    choices:
    - accept
    - block
    - accept-unmanageable
    version_ranges:
    - - v7.6.1
      - ''
    description: Action for an empty client certificate.
  user_agent_detect:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable detecting device type by HTTP user-agent if no client certificate is provided.
  client_cert:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable requesting client certificate.
