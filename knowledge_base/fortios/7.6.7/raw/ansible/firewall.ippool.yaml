id: firewall.ippool
version: 7.6.7
source_object: fortios_firewall_ippool
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ippool.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IP pool name.
  type:
    type: enum
    raw_type: string
    choices:
    - overload
    - one-to-one
    - fixed-port-range
    - port-block-allocation
    version_ranges:
    - - v6.0.0
      - ''
    description: 'IP pool type: overload, one-to-one, fixed-port-range, port-block-allocation, cgn-resource-allocation (hyperscale
      vdom only)'
  startip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: First IPv4 address (inclusive) in the range for the address pool (format xxx.xxx.xxx.xxx).
  endip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Final IPv4 address (inclusive) in the range for the address pool (format xxx.xxx.xxx.xxx).
  startport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: First port number (inclusive) in the range for the address pool (1024 - 65535).
  endport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Final port number (inclusive) in the range for the address pool (1024 - 65535).
  source_startip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: First IPv4 address (inclusive) in the range of the source addresses to be translated (format = xxx.xxx.xxx.xxx).
  source_endip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Final IPv4 address (inclusive) in the range of the source addresses to be translated (format xxx.xxx.xxx.xxx).
  block_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of addresses in a block (64 - 4096).
  port_per_user:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.0
      - ''
    description: Number of port for each user (32 - 60416).
  num_blocks_per_user:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Number of addresses blocks that can be used by a user (1 to 128).
  pba_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port block allocation timeout (seconds).
  pba_interim_log:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.4
      - ''
    description: Port block allocation interim logging interval (600 - 86400 seconds).
  permit_any_host:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable fullcone NAT. Accept UDP packets from any host.
  arp_reply:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable replying to ARP requests when an IP Pool is added to a policy .
  arp_intf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Select an interface from available options that will reply to ARP requests. (If blank, any is selected).
      Source system.interface.name.
    references:
    - system.interface.name
  associated_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Associated interface name. Source system.interface.name.
    references:
    - system.interface.name
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  nat64:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable NAT64.
  add_nat64_route:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.1
      - ''
    description: Enable/disable adding NAT64 route.
  source_prefix6:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: Source IPv6 network to be translated (format = xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx/xxx).
  client_prefix_length:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Subnet length of a single deterministic NAT64 client (1 - 128).
  tcp_session_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Maximum number of concurrent TCP sessions allowed per client (0 - 2097000).
  udp_session_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Maximum number of concurrent UDP sessions allowed per client (0 - 2097000).
  icmp_session_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: Maximum number of concurrent ICMP sessions allowed per client (0 - 2097000).
  privileged_port_use_pba:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable selection of the external port from the port block allocation for NAT"ing privileged ports
      (deafult = disable).
  subnet_broadcast_in_ippool:
    type: enum
    raw_type: string
    choices:
    - disable
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.4
      - ''
    description: Enable/disable inclusion of the subnetwork address and broadcast IP address in the NAT64 IP pool.
