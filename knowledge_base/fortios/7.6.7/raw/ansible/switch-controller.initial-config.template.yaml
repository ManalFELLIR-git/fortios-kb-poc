id: switch-controller.initial-config.template
version: 7.6.7
source_object: fortios_switch_controller_initial_config_template
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_initial_config_template.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: Initial config template name.
  vlanid:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.4.0
      - ''
    description: Unique VLAN ID.
  ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Interface IPv4 address and subnet mask.
  allowaccess:
    type: enum
    raw_type: list
    choices:
    - ping
    - https
    - ssh
    - snmp
    - http
    - telnet
    - fgfm
    - radius-acct
    - probe-response
    - fabric
    - ftm
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.4.0
      - ''
    description: Permitted types of management access to this interface.
  auto_ip:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Automatically allocate interface address and subnet block.
  dhcp_server:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable a DHCP server on this interface.
