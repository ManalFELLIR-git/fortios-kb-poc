id: web-proxy.url-match
version: 7.6.7
source_object: fortios_web_proxy_url_match
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_web_proxy_url_match.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure a name for the URL to be exempted.
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable exempting the URLs matching the URL pattern from web proxy forwarding, caching and fast-fallback.
  url_pattern:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL pattern to be exempted from web proxy forwarding, caching and fast-fallback.
  forward_server:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Forward server name. Source web-proxy.forward-server.name web-proxy.forward-server-group.name.
    references:
    - web-proxy.forward-server-group.name
    - web-proxy.forward-server.name
  fast_fallback:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Fast fallback configuration entry name. Source web-proxy.fast-fallback.name.
    references:
    - web-proxy.fast-fallback.name
  cache_exemption:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable exempting this URL pattern from caching.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
