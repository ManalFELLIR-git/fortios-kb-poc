id: switch-controller.lldp-profile
version: 7.6.7
source_object: fortios_switch_controller_lldp_profile
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_lldp_profile.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Profile name.
  med_tlvs:
    type: enum
    raw_type: list
    choices:
    - inventory-management
    - network-policy
    - power-management
    - location-identification
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Transmitted LLDP-MED TLVs (type-length-value descriptions).
  auto_isl:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable auto inter-switch LAG.
  auto_isl_hello_timer:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Auto inter-switch LAG hello timer duration (1 - 30 sec).
  auto_isl_receive_timeout:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Auto inter-switch LAG timeout if no response is received (3 - 90 sec).
  auto_isl_port_group:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Auto inter-switch LAG port group ID (0 - 9).
  auto_mclag_icl:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable MCLAG inter chassis link.
  auto_isl_auth:
    type: enum
    raw_type: string
    choices:
    - legacy
    - strict
    - relax
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG authentication mode.
  auto_isl_auth_user:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG authentication user certificate.
  auto_isl_auth_identity:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG authentication identity.
  auto_isl_auth_reauth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG authentication reauth period in seconds(10 - 3600).
  auto_isl_auth_encrypt:
    type: enum
    raw_type: string
    choices:
    - none
    - mixed
    - must
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG encryption mode.
  auto_isl_auth_macsec_profile:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.1
      - ''
    description: Auto inter-switch LAG macsec profile for encryption.
  med_network_policy:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration method to edit Media Endpoint Discovery (MED) network policy type-length-value (TLV) categories.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Policy type name.
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable or disable this TLV.
      vlan_intf:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: VLAN interface to advertise; if configured on port. Source system.interface.name.
        references:
        - system.interface.name
      assign_vlan:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable VLAN assignment when this profile is applied on managed FortiSwitch port.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Advertised Layer 2 priority (0 - 7; from lowest to highest priority).
      dscp:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Advertised Differentiated Services Code Point (DSCP) value, a packet header value indicating the level
          of service requested for traffic, such as high priority or best effort delivery.
  med_location_service:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configuration method to edit Media Endpoint Discovery (MED) location service type-length-value (TLV) categories.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Location service type name.
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable or disable this TLV.
      sys_location_id:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: Location service ID. Source switch-controller.location.name.
        references:
        - switch-controller.location.name
  custom_tlvs:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configuration method to edit custom TLV entries.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: TLV name (not sent).
      oui:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Organizationally unique identifier (OUI), a 3-byte hexadecimal number, for this TLV.
      subtype:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Organizationally defined subtype (0 - 255).
      information_string:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Organizationally defined information string (0 - 507 hexadecimal bytes).
  tlvs_802dot1:
    type: enum
    raw_type: list
    choices:
    - port-vlan-id
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Transmitted IEEE 802.1 TLVs.
  tlvs_802dot3:
    type: enum
    raw_type: list
    choices:
    - max-frame-size
    - power-negotiation
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Transmitted IEEE 802.3 TLVs.
