id: system.ipam
version: 7.6.7
source_object: fortios_system_ipam
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ipam.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.2
      - ''
    description: Enable/disable IP address management services.
  server_type:
    type: enum
    raw_type: string
    choices:
    - fabric-root
    version_ranges:
    - - v7.0.2
      - ''
    description: Configure the type of IPAM server to use.
  automatic_conflict_resolution:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable automatic conflict resolution.
  require_subnet_size_match:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable/disable reassignment of subnets to make requested and actual sizes match.
  manage_lan_addresses:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable default management of LAN interface addresses.
  manage_lan_extension_addresses:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable default management of FortiExtender LAN extension interface addresses.
  manage_ssid_addresses:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.4.0
      - ''
    description: Enable/disable default management of FortiAP SSID addresses.
  pools:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Configure IPAM pools.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: IPAM pool name.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: Description.
      subnet:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: Configure IPAM pool subnet, Class A - Class B subnet.
      exclude:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.4.4
          - ''
        description: Configure pool exclude subnets.
        children:
          ID:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v7.4.4
              - ''
            description: Exclude ID. see <a href='#notes'>Notes</a>.
          exclude_subnet:
            type: string
            raw_type: string
            version_ranges:
            - - v7.4.4
              - ''
            description: Configure subnet to exclude from the IPAM pool.
  rules:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.2.1
      - ''
    description: Configure IPAM allocation rules.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.2.1
          - ''
        description: IPAM rule name.
      description:
        type: string
        raw_type: string
        version_ranges:
        - - v7.2.1
          - ''
        description: Description.
      device:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Configure serial number or wildcard of FortiGate to match.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: FortiGate serial number or wildcard.
      role:
        type: enum
        raw_type: string
        choices:
        - any
        - lan
        - wan
        - dmz
        - undefined
        version_ranges:
        - - v7.2.1
          - ''
        description: Configure role of interface to match.
      pool:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - ''
        description: Configure name of IPAM pool to use.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - ''
            description: IPAM pool name. Source system.ipam.pools.name.
            references:
            - system.ipam.pools.name
      dhcp:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.2.1
          - ''
        description: Enable/disable DHCP server for matching IPAM interfaces.
      interface:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v7.2.1
          - v7.6.7
        description: Configure name or wildcard of interface to match.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v7.2.1
              - v7.6.7
            description: Interface name or wildcard.
