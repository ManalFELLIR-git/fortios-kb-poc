id: user.saml
version: 7.6.7
source_object: fortios_user_saml
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_saml.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: SAML server entry name.
  cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Certificate to sign SAML messages. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  entity_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SP entity ID.
  single_sign_on_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SP single sign-on URL.
  single_logout_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SP single logout URL.
  idp_entity_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IDP entity ID.
  idp_single_sign_on_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IDP single sign-on URL.
  idp_single_logout_url:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IDP single logout url.
  idp_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IDP Certificate name. Source vpn.certificate.remote.name.
    references:
    - vpn.certificate.remote.name
  scim_client:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.0
      - ''
    description: SCIM client name. Source user.scim.name.
    references:
    - user.scim.name
  scim_user_attr_type:
    type: enum
    raw_type: string
    choices:
    - user-name
    - display-name
    - external-id
    - email
    version_ranges:
    - - v7.6.4
      - ''
    description: User attribute type used to match SCIM users .
  scim_group_attr_type:
    type: enum
    raw_type: string
    choices:
    - display-name
    - external-id
    version_ranges:
    - - v7.6.3
      - ''
    description: Group attribute type used to match SCIM groups .
  user_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: User name in assertion statement.
  group_name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Group name in assertion statement.
  digest_method:
    type: enum
    raw_type: string
    choices:
    - sha1
    - sha256
    version_ranges:
    - - v7.0.0
      - ''
    description: Digest method algorithm.
  require_signed_resp_and_asrt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.5
      - ''
    description: Require both response and assertion from IDP to be signed when FGT acts as SP .
  limit_relaystate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable limiting of relay-state parameter when it exceeds SAML 2.0 specification limits (80 bytes).
  clock_tolerance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.0.4
      - ''
    description: Clock skew tolerance in seconds (0 - 300).
  adfs_claim:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable ADFS Claim for user/group attribute in assertion statement .
  user_claim_type:
    type: enum
    raw_type: string
    choices:
    - email
    - given-name
    - name
    - upn
    - common-name
    - email-adfs-1x
    - group
    - upn-adfs-1x
    - role
    - sur-name
    - ppid
    - name-identifier
    - authentication-method
    - deny-only-group-sid
    - deny-only-primary-sid
    - deny-only-primary-group-sid
    - group-sid
    - primary-group-sid
    - primary-sid
    - windows-account-name
    version_ranges:
    - - v7.0.0
      - ''
    description: User name claim in assertion statement.
  group_claim_type:
    type: enum
    raw_type: string
    choices:
    - email
    - given-name
    - name
    - upn
    - common-name
    - email-adfs-1x
    - group
    - upn-adfs-1x
    - role
    - sur-name
    - ppid
    - name-identifier
    - authentication-method
    - deny-only-group-sid
    - deny-only-primary-sid
    - deny-only-primary-group-sid
    - group-sid
    - primary-group-sid
    - primary-sid
    - windows-account-name
    version_ranges:
    - - v7.0.0
      - ''
    description: Group claim in assertion statement.
  reauth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.1
      - ''
    description: Enable/disable signalling of IDP to force user re-authentication .
