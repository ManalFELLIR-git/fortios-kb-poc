id: switch-controller.snmp-community
version: 7.6.7
source_object: fortios_switch_controller_snmp_community
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_snmp_community.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP community ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP community name.
  status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable this SNMP community.
  hosts:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Configure IPv4 SNMP managers (hosts).
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: Host entry ID. see <a href='#notes'>Notes</a>.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: IPv4 address of the SNMP manager (host).
  query_v1_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable SNMP v1 queries.
  query_v1_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v1 query port .
  query_v2c_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable SNMP v2c queries.
  query_v2c_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v2c query port .
  trap_v1_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable SNMP v1 traps.
  trap_v1_lport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v2c trap local port .
  trap_v1_rport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v2c trap remote port .
  trap_v2c_status:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable SNMP v2c traps.
  trap_v2c_lport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v2c trap local port .
  trap_v2c_rport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP v2c trap remote port .
  events:
    type: enum
    raw_type: list
    choices:
    - cpu-high
    - mem-low
    - log-full
    - intf-ip
    - ent-conf-change
    - l2mac
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.2.0
      - ''
    description: SNMP notifications (traps) to send.
