id: vpn.ipsec.manualkey
version: 7.6.7
source_object: fortios_vpn_ipsec_manualkey
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_ipsec_manualkey.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPsec tunnel name.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the physical, aggregate, or VLAN interface. Source system.interface.name.
    references:
    - system.interface.name
  remote_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Peer gateway.
  local_gw:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local gateway.
  authentication:
    type: enum
    raw_type: string
    choices:
    - 'null'
    - md5
    - sha1
    - sha256
    - sha384
    - sha512
    version_ranges:
    - - v6.0.0
      - ''
    description: Authentication algorithm. Must be the same for both ends of the tunnel.
  encryption:
    type: enum
    raw_type: string
    choices:
    - 'null'
    - des
    - 3des
    - aes128
    - aes192
    - aes256
    - aria128
    - aria192
    - aria256
    - seed
    version_ranges:
    - - v6.0.0
      - ''
    description: Encryption algorithm. Must be the same for both ends of the tunnel.
  authkey:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hexadecimal authentication key in 16-digit (8-byte) segments separated by hyphens.
  enckey:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Hexadecimal encryption key in 16-digit (8-byte) segments separated by hyphens.
  localspi:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
  remotespi:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
  npu_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable NPU offloading.
