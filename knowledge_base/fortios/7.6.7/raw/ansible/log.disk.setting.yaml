id: log.disk.setting
version: 7.6.7
source_object: fortios_log_disk_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_log_disk_setting.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable local disk logging.
  ips_archive:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPS packet archiving to the local disk.
  max_log_file_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum log file size before rolling (1 - 100 Mbytes).
  max_policy_packet_capture_size:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Maximum size of policy sniffer in MB (0 means unlimited).
  roll_schedule:
    type: enum
    raw_type: string
    choices:
    - daily
    - weekly
    version_ranges:
    - - v6.0.0
      - ''
    description: Frequency to check log file for rolling.
  roll_day:
    type: enum
    raw_type: list
    choices:
    - sunday
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Day of week on which to roll log file.
  roll_time:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day to roll the log file (hh:mm).
  diskfull:
    type: enum
    raw_type: string
    choices:
    - overwrite
    - nolog
    version_ranges:
    - - v6.0.0
      - ''
    description: Action to take when disk is full. The system can overwrite the oldest log messages or stop logging when the
      disk is full .
  log_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Disk log quota (MB).
  dlp_archive_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: DLP archive quota (MB).
  report_quota:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - ''
    description: Report db quota (MB).
  maximum_log_age:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Delete log files older than (days).
  upload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable uploading log files when they are rolled.
  upload_destination:
    type: enum
    raw_type: string
    choices:
    - ftp-server
    version_ranges:
    - - v6.0.0
      - ''
    description: The type of server to upload log files to.
  uploadip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address of the FTP/SFTP server to upload log files to.
  uploadport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: TCP port to use for communicating with the FTP/SFTP server .
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Source IP address to use for uploading disk log files.
  uploaduser:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Username required to log into the FTP server to upload disk log files.
  uploadpass:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Password required to log into the FTP server to upload disk log files.
  uploaddir:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: The remote directory on the FTP server to upload log files to.
  uploadtype:
    type: enum
    raw_type: list
    choices:
    - traffic
    - event
    - virus
    - webfilter
    - IPS
    - emailfilter
    - dlp-archive
    - anomaly
    - voip
    - dlp
    - app-ctrl
    - waf
    - dns
    - ssh
    - ssl
    - file-filter
    - icap
    - virtual-patch
    - debug
    - gtp
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - ''
    description: Types of log files to upload. Separate multiple entries with a space.
  uploadsched:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.0.0
      - ''
    description: Set the schedule for uploading log files to the FTP server .
  uploadtime:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Time of day at which log files are uploaded if uploadsched is enabled (hh:mm or hh).
  upload_delete_files:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Delete log files after uploading .
  upload_ssl_conn:
    type: enum
    raw_type: string
    choices:
    - default
    - high
    - low
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable encrypted FTPS communication to upload log files.
  full_first_warning_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Log full first warning threshold as a percent (1 - 98).
  full_second_warning_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Log full second warning threshold as a percent (2 - 99).
  full_final_warning_threshold:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Log full final warning threshold as a percent (3 - 100).
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
