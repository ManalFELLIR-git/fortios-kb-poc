id: switch-controller.custom-command
version: 7.6.7
source_object: fortios_switch_controller_custom_command
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_custom_command.py
root_type: list
attributes:
  command_name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Command name called by the FortiGate switch controller in the execute command.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  command:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'String of commands to send to FortiSwitch devices (For example (%0a = return key): config switch trunk %0a
      edit myTrunk %0a set members port1 port2 %0a end %0a).'
