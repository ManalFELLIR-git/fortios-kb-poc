id: firewall.internet-service-append
version: 7.6.7
source_object: fortios_firewall_internet_service_append
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_internet_service_append.py
root_type: object
attributes:
  addr_mode:
    type: enum
    raw_type: string
    choices:
    - ipv4
    - ipv6
    - both
    version_ranges:
    - - v7.2.1
      - ''
    description: Address mode (IPv4 or IPv6).
  match_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Matching TCP/UDP/SCTP destination port (0 to 65535, 0 means any port).
  append_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - v6.2.0
    - - v6.2.5
      - ''
    description: Appending TCP/UDP/SCTP destination port (1 to 65535).
