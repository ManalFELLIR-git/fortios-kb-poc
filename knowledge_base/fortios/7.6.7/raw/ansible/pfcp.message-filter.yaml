id: pfcp.message-filter
version: 7.6.7
source_object: fortios_pfcp_message_filter
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_pfcp_message_filter.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Message filter name.
  unknown_message:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny unknown messages.
  unknown_message_allow_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow list of unknown messages.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v7.0.1
          - v7.0.8
        - - v7.2.0
          - v7.2.4
        - - v7.4.3
          - v7.6.7
        description: Message IDs (range from 1 to 255). see <a href='#notes'>Notes</a>.
  heartbeat:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP heartbeat request (1) and PFCP heartbeat response (2).
  pfd_management:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP PFD management request (3) and PFCP PFD management response (4).
  version_not_support:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP version not supported response (11).
  session_establish:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP session establishment request (50) and PFCP session establishment response (51).
  session_modification:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP session modification request (52) and PFCP session modification response (53).
  session_deletion:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP session deletion request (54) and PFCP session deletion response (55).
  session_report:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP session report request (56) and PFCP session report response (57).
  association_setup:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP association setup request (5) and PFCP association setup response (6).
  association_update:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP association update request (7) and PFCP association update response (8).
  association_release:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP association release request (9) and PFCP association release response (10).
  node_report:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP node report request (12) and PFCP node report response (13).
  session_set_deletion:
    type: enum
    raw_type: string
    choices:
    - allow
    - deny
    version_ranges:
    - - v7.0.1
      - v7.0.8
    - - v7.2.0
      - v7.2.4
    - - v7.4.3
      - v7.6.7
    description: Allow or deny PFCP session set deletion request (14) and PFCP session set deletion response (15).
