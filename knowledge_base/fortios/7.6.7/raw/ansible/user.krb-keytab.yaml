id: user.krb-keytab
version: 7.6.7
source_object: fortios_user_krb_keytab
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_krb_keytab.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Kerberos keytab entry name.
  pac_data:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.2.0
      - ''
    description: Enable/disable parsing PAC data in the ticket.
  principal:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Kerberos service principal. For example, HTTP/myfgt.example.com@example.com.
  ldap_server:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: LDAP server name(s). Source user.ldap.name.
    references:
    - user.ldap.name
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.4.4
          - ''
        description: LDAP server name. Source user.ldap.name.
        references:
        - user.ldap.name
  keytab:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Base64 coded keytab file containing a pre-shared key.
