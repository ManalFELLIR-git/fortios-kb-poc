id: system.ipv6-tunnel
version: 7.6.7
source_object: fortios_system_ipv6_tunnel
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_ipv6_tunnel.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 tunnel name.
  source:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Local IPv6 address of the tunnel.
  destination:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote IPv6 address of the tunnel.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Interface name. Source system.interface.name.
    references:
    - system.interface.name
  use_sdwan:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable use of SD-WAN to reach remote gateway.
  auto_asic_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable tunnel ASIC offloading.
