id: firewall.ssh.setting
version: 7.6.7
source_object: fortios_firewall_ssh_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ssh_setting.py
root_type: object
attributes:
  caname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: CA certificate used by SSH Inspection. Source firewall.ssh.local-ca.name.
    references:
    - firewall.ssh.local-ca.name
  untrusted_caname:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Untrusted CA certificate used by SSH Inspection. Source firewall.ssh.local-ca.name.
    references:
    - firewall.ssh.local-ca.name
  hostkey_rsa2048:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: RSA certificate used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  hostkey_dsa1024:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: DSA certificate used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  hostkey_ecdsa256:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ECDSA nid256 certificate used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  hostkey_ecdsa384:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ECDSA nid384 certificate used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  hostkey_ecdsa521:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ECDSA nid384 certificate used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  hostkey_ed25519:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: ED25519 hostkey used by SSH proxy. Source firewall.ssh.local-key.name.
    references:
    - firewall.ssh.local-key.name
  host_trusted_checking:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable host trusted checking.
