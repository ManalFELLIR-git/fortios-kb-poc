id: webfilter.fortiguard
version: 7.6.7
source_object: fortios_webfilter_fortiguard
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_webfilter_fortiguard.py
root_type: object
attributes:
  cache_mode:
    type: enum
    raw_type: string
    choices:
    - ttl
    - db-ver
    version_ranges:
    - - v6.0.0
      - ''
    description: Cache entry expiration mode.
  cache_prefix_match:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable prefix matching in the cache.
  cache_mem_permille:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.4.0
      - ''
    description: Maximum permille of available memory allocated to caching (1 - 150).
  ovrd_auth_port_http:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to use for FortiGuard Web Filter HTTP override authentication.
  ovrd_auth_port_https:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to use for FortiGuard Web Filter HTTPS override authentication in proxy mode.
  ovrd_auth_port_https_flow:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: Port to use for FortiGuard Web Filter HTTPS override authentication in flow mode.
  ovrd_auth_port_warning:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Port to use for FortiGuard Web Filter Warning override authentication.
  ovrd_auth_https:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of HTTPS for override authentication.
  warn_auth_https:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of HTTPS for warning and authentication.
  close_ports:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Close ports used for HTTP/HTTPS override authentication and disable user overrides.
  request_packet_size_limit:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Limit size of URL request packets sent to FortiGuard server (0 for default).
  embed_image:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable embedding images into replacement messages .
