id: firewall.local-in-policy
version: 7.6.7
source_object: fortios_firewall_local_in_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_local_in_policy.py
root_type: list
attributes:
  policyid:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: User defined local in policy ID. see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  ha_mgmt_intf_only:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable dedicating the HA management interface only for local-in policy.
  intf_dict:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.2
      - ''
    description: Incoming interface name from available options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.2
          - ''
        description: Address name. Source system.zone.name system.sdwan.zone.name system.interface.name.
        references:
        - system.interface.name
        - system.sdwan.zone.name
        - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Source address object from available options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - system.external-resource.name
  srcaddr_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: When enabled srcaddr specifies what the source address must NOT be.
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Destination address object from available options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address.name firewall.addrgrp.name system.external-resource.name.
        references:
        - firewall.address.name
        - firewall.addrgrp.name
        - system.external-resource.name
  internet_service_src:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: Enable/disable use of Internet Services in source for this local-in policy. If enabled, source address is
      not used.
  internet_service_src_name:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.4
      - ''
    description: Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.4
          - ''
        description: Internet Service name. Source firewall.internet-service-name.name.
        references:
        - firewall.internet-service-name.name
  internet_service_src_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.4
      - ''
    description: Internet Service source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.4
          - ''
        description: Internet Service group name. Source firewall.internet-service-group.name.
        references:
        - firewall.internet-service-group.name
  internet_service_src_custom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.4
      - ''
    description: Custom Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.4
          - ''
        description: Custom Internet Service name. Source firewall.internet-service-custom.name.
        references:
        - firewall.internet-service-custom.name
  internet_service_src_custom_group:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.4.4
      - ''
    description: Custom Internet Service source group name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.4.4
          - ''
        description: Custom Internet Service group name. Source firewall.internet-service-custom-group.name.
        references:
        - firewall.internet-service-custom-group.name
  internet_service_src_fortiguard:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v7.6.4
      - ''
    description: FortiGuard Internet Service source name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v7.6.4
          - ''
        description: FortiGuard Internet Service name. Source firewall.internet-service-fortiguard.name.
        references:
        - firewall.internet-service-fortiguard.name
  dstaddr_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: When enabled dstaddr specifies what the destination address must NOT be.
  action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    version_ranges:
    - - v6.0.0
      - ''
    description: Action performed on traffic matching the policy .
  service:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Service object from available options.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Service name. Source firewall.service.custom.name firewall.service.group.name.
        references:
        - firewall.service.custom.name
        - firewall.service.group.name
  service_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.0.0
      - ''
    description: When enabled service specifies what the service must NOT be.
  internet_service_src_negate:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.4
      - ''
    description: When enabled internet-service-src specifies what the service must NOT be.
  schedule:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Schedule object from available options. Source firewall.schedule.onetime.name firewall.schedule.recurring.name
      firewall.schedule.group .name.
    references:
    - firewall.schedule.group
    - firewall.schedule.onetime.name
    - firewall.schedule.recurring.name
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this local-in policy.
  virtual_patch:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.4
      - ''
    description: Enable/disable virtual patching.
  logtraffic:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.0
      - ''
    description: Enable/disable local-in traffic logging.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
