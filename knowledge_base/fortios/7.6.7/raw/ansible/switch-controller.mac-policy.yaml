id: switch-controller.mac-policy
version: 7.6.7
source_object: fortios_switch_controller_mac_policy
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_switch_controller_mac_policy.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.4.0
      - ''
    description: MAC policy name.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Description for the MAC policy.
  fortilink:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: FortiLink interface for which this MAC policy belongs to. Source system.interface.name.
    references:
    - system.interface.name
  vlan:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Ingress traffic VLAN assignment for the MAC address matching this MAC policy. Source system.interface.name.
    references:
    - system.interface.name
  traffic_policy:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - ''
    description: Traffic policy to be applied when using this MAC policy. Source switch-controller.traffic-policy.name.
    references:
    - switch-controller.traffic-policy.name
  count:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v6.4.0
      - ''
    description: Enable/disable packet count on the NAC device.
  bounce_port_link:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.0.0
      - ''
    description: Enable/disable bouncing (administratively bring the link down, up) of a switch port where this mac-policy
      is applied.
  bounce_port_duration:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: Bounce duration in seconds of a switch port where this mac-policy is applied.
  poe_reset:
    type: enum
    raw_type: string
    choices:
    - disable
    - enable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable POE reset of a switch port where this mac-policy is applied.
