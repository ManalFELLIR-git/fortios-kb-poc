id: firewall.multicast-policy6
version: 7.6.7
source_object: fortios_firewall_multicast_policy6
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_multicast_policy6.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Policy ID (0 - 4294967294). see <a href='#notes'>Notes</a>.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable this policy.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Policy name.
  srcintf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
    references:
    - system.interface.name
    - system.sdwan.zone.name
    - system.zone.name
  dstintf:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 destination interface name. Source system.interface.name system.zone.name system.sdwan.zone.name.
    references:
    - system.interface.name
    - system.sdwan.zone.name
    - system.zone.name
  srcaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 source address name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.address6.name firewall.addrgrp6.name.
        references:
        - firewall.address6.name
        - firewall.addrgrp6.name
  dstaddr:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IPv6 destination address name.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Address name. Source firewall.multicast-address6.name.
        references:
        - firewall.multicast-address6.name
  action:
    type: enum
    raw_type: string
    choices:
    - accept
    - deny
    version_ranges:
    - - v6.0.0
      - ''
    description: Accept or deny traffic matching the policy.
  protocol:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for the protocol type as defined by IANA (0 - 255).
  start_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for starting TCP/UDP/SCTP destination port in range (1 - 65535).
  end_port:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Integer value for ending TCP/UDP/SCTP destination port in range (1 - 65535).
  utm_status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.4.2
      - ''
    description: Enable to add an IPS security profile to the policy.
  ips_sensor:
    type: string
    raw_type: string
    version_ranges:
    - - v7.4.2
      - ''
    description: Name of an existing IPS sensor. Source ips.sensor.name.
    references:
    - ips.sensor.name
  logtraffic:
    type: enum
    raw_type: string
    choices:
    - all
    - utm
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable or disable logging. Log all sessions or security profile sessions.
  auto_asic_offload:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable offloading policy traffic for hardware acceleration.
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Comment.
