id: system.health-check-fortiguard
version: 7.6.7
source_object: fortios_system_health_check_fortiguard
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_health_check_fortiguard.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v7.6.1
      - ''
    description: Status check or predefined health-check targets name.
  server:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
