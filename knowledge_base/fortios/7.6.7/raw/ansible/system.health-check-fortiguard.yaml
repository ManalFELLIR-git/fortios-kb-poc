  protocol:
    type: enum
    raw_type: string
    choices:
    - ping
    - tcp-echo
    - udp-echo
    - http
    - https
    - twamp
    - dns
    - tcp-connect
    - ftp
    version_ranges:
    - - v7.6.1
      - ''
    description: Protocol name.
