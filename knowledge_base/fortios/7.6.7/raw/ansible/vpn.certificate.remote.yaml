id: vpn.certificate.remote
version: 7.6.7
source_object: fortios_vpn_certificate_remote
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_vpn_certificate_remote.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name.
  remote:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote certificate.
  range:
    type: enum
    raw_type: string
    choices:
    - global
    - vdom
    version_ranges:
    - - v6.0.0
      - ''
    description: Either the global or VDOM IP address range for the remote certificate.
  source:
    type: enum
    raw_type: string
    choices:
    - factory
    - user
    - bundle
    version_ranges:
    - - v6.0.0
      - ''
    description: Remote certificate source type.
