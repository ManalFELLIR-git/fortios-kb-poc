id: firewall.ipv6-eh-filter
version: 7.6.7
source_object: fortios_firewall_ipv6_eh_filter
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ipv6_eh_filter.py
root_type: object
attributes:
  hop_opt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with the Hop-by-Hop Options header .
  dest_opt:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with Destination Options headers .
  hdopt_type:
    type: list
    raw_type: list
    multiple_values: true
    elements: int
    version_ranges:
    - - v6.0.0
      - ''
    description: Block specific Hop-by-Hop and/or Destination Option types (max. 7 types, each between 0 and 255).
  routing:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with Routing headers .
  routing_type:
    type: list
    raw_type: list
    multiple_values: true
    elements: int
    version_ranges:
    - - v6.0.0
      - ''
    description: Block specific Routing header types (max. 7 types, each between 0 and 255).
  fragment:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with the Fragment header .
  auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with the Authentication header .
  no_next:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable blocking packets with the No Next header .
