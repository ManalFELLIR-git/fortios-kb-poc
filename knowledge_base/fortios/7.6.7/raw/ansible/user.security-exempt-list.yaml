id: user.security-exempt-list
version: 7.6.7
source_object: fortios_user_security_exempt_list
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_user_security_exempt_list.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the exempt list.
  description:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Description.
  rule:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Configure rules for exempting users from captive portal authentication.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: ID. see <a href='#notes'>Notes</a>.
      srcaddr:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Source addresses or address groups.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Address or group name. Source firewall.address.name firewall.addrgrp.name.
            references:
            - firewall.address.name
            - firewall.addrgrp.name
      dstaddr:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Destination addresses or address groups.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Address or group name. Source firewall.address.name firewall.addrgrp.name.
            references:
            - firewall.address.name
            - firewall.addrgrp.name
      service:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: Destination services.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Service name. Source firewall.service.custom.name firewall.service.group.name.
            references:
            - firewall.service.custom.name
            - firewall.service.group.name
