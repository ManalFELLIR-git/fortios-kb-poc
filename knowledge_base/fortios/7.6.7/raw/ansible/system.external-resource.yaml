id: system.external-resource
version: 7.6.7
source_object: fortios_system_external_resource
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_external_resource.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: External resource name.
  uuid:
    type: string
    raw_type: string
    version_ranges:
    - - v7.0.0
      - ''
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable user resource.
  type:
    type: enum
    raw_type: string
    choices:
    - category
    - domain
    - malware
    - address
    - mac-address
    - data
    - generic-address
    version_ranges:
    - - v6.0.0
      - ''
    description: User resource type.
  namespace:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Generic external connector address namespace.
  object_array_path:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: JSON Path to array of generic addresses in resource.
  address_name_field:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: JSON Path to address name in generic address entry.
  address_data_field:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: JSON Path to address data in generic address entry.
  address_comment_field:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: JSON Path to address description in generic address entry.
  update_method:
    type: enum
    raw_type: string
    choices:
    - feed
    - push
    version_ranges:
    - - v7.2.1
      - ''
    description: External resource update method.
  category:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: User resource category.
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: HTTP basic authentication user name.
  password:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: HTTP basic authentication password.
  client_cert_auth:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.6.1
      - ''
    description: Enable/disable using client certificate for TLS authentication.
  client_cert:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.1
      - ''
    description: Client certificate name. Source vpn.certificate.local.name.
    references:
    - vpn.certificate.local.name
  comments:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Comment.
  resource:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: URL of external resource.
  user_agent:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: HTTP User-Agent header .
  server_identity_check:
    type: enum
    raw_type: string
    choices:
    - none
    - basic
    - full
    version_ranges:
    - - v7.0.8
      - v7.0.12
    - - v7.2.4
      - ''
    description: Certificate verification option.
  refresh_rate:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Time interval to refresh external resource (1 - 43200 min).
  source_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Source IPv4 address used to communicate with server.
  source_ip_interface:
    type: string
    raw_type: string
    version_ranges:
    - - v7.6.4
      - ''
    description: IPv4 Source interface for communication with the server. Source system.interface.name.
    references:
    - system.interface.name
  interface_select_method:
    type: enum
    raw_type: string
    choices:
    - auto
    - sdwan
    - specify
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify how to select outgoing interface to reach server.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.4.0
      - v6.4.0
    - - v6.4.4
      - ''
    description: Specify outgoing interface to reach server. Source system.interface.name.
    references:
    - system.interface.name
  vrf_select:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.1
      - ''
    description: VRF ID used for connection to server.
