id: router.ospf
version: 7.6.7
source_object: fortios_router_ospf
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_router_ospf.py
root_type: object
attributes:
  abr_type:
    type: enum
    raw_type: string
    choices:
    - cisco
    - ibm
    - shortcut
    - standard
    version_ranges:
    - - v6.0.0
      - ''
    description: Area border router type.
  auto_cost_ref_bandwidth:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Reference bandwidth in terms of megabits per second.
  distance_external:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative external distance.
  distance_inter_area:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative inter-area distance.
  distance_intra_area:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Administrative intra-area distance.
  database_overflow:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable database overflow.
  database_overflow_max_lsas:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Database overflow maximum LSAs.
  database_overflow_time_to_recover:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Database overflow time to recover (sec).
  default_information_originate:
    type: enum
    raw_type: string
    choices:
    - enable
    - always
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable generation of default route.
  default_information_metric:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information metric.
  default_information_metric_type:
    type: enum
    raw_type: string
    choices:
    - '1'
    - '2'
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information metric type.
  default_information_route_map:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Default information route map. Source router.route-map.name.
    references:
    - router.route-map.name
  default_metric:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Default metric of redistribute routes.
  distance:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Distance of the route.
  lsa_refresh_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v7.6.0
      - ''
    description: The minimal OSPF LSA update time interval.
  rfc1583_compatible:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable RFC1583 compatibility.
  router_id:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Router ID.
  spf_timers:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: SPF calculation frequency.
  bfd:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Bidirectional Forwarding Detection (BFD).
  log_neighbour_changes:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Log of OSPF neighbor changes.
  distribute_list_in:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Filter incoming routes. Source router.access-list.name router.prefix-list.name.
    references:
    - router.access-list.name
    - router.prefix-list.name
  distribute_route_map_in:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Filter incoming external routes by route-map. Source router.route-map.name.
    references:
    - router.route-map.name
  restart_mode:
    type: enum
    raw_type: string
    choices:
    - none
    - lls
    - graceful-restart
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF restart mode (graceful or LLS).
  restart_period:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Graceful restart period.
  restart_on_topology_change:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v7.2.0
      - ''
    description: Enable/disable continuing graceful restart upon topology change.
  area:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF area configuration.
    children:
      id:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Area entry IP address.
      shortcut:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        - default
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable shortcut option.
      authentication:
        type: enum
        raw_type: string
        choices:
        - none
        - text
        - message-digest
        version_ranges:
        - - v6.0.0
          - ''
        description: Authentication type.
      default_cost:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Summary default cost of stub or NSSA area.
      nssa_translator_role:
        type: enum
        raw_type: string
        choices:
        - candidate
        - never
        - always
        version_ranges:
        - - v6.0.0
          - ''
        description: NSSA translator role type.
      stub_type:
        type: enum
        raw_type: string
        choices:
        - no-summary
        - summary
        version_ranges:
        - - v6.0.0
          - ''
        description: Stub summary setting.
      type:
        type: enum
        raw_type: string
        choices:
        - regular
        - nssa
        - stub
        version_ranges:
        - - v6.0.0
          - ''
        description: Area type setting.
      nssa_default_information_originate:
        type: enum
        raw_type: string
        choices:
        - enable
        - always
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Redistribute, advertise, or do not originate Type-7 default route into NSSA area.
      nssa_default_information_originate_metric:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF default metric.
      nssa_default_information_originate_metric_type:
        type: enum
        raw_type: string
        choices:
        - '1'
        - '2'
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF metric type for default routes.
      nssa_redistribution:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable redistribute into NSSA area.
      comments:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Comment.
      range:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF area range configuration.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Range entry ID. see <a href='#notes'>Notes</a>.
          prefix:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Prefix.
          advertise:
            type: enum
            raw_type: string
            choices:
            - disable
            - enable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable advertise status.
          substitute:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Substitute prefix.
          substitute_status:
            type: enum
            raw_type: string
            choices:
            - enable
            - disable
            version_ranges:
            - - v6.0.0
              - ''
            description: Enable/disable substitute status.
      virtual_link:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF virtual link configuration.
        children:
          name:
            type: string
            raw_type: string
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Virtual link entry name.
          authentication:
            type: enum
            raw_type: string
            choices:
            - none
            - text
            - message-digest
            version_ranges:
            - - v6.0.0
              - ''
            description: Authentication type.
          authentication_key:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Authentication key.
          keychain:
            type: string
            raw_type: string
            version_ranges:
            - - v7.0.1
              - ''
            description: Message-digest key-chain name. Source router.key-chain.name.
            references:
            - router.key-chain.name
          dead_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Dead interval.
          hello_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Hello interval.
          retransmit_interval:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Retransmit interval.
          transmit_delay:
            type: integer
            raw_type: integer
            version_ranges:
            - - v6.0.0
              - ''
            description: Transmit delay.
          peer:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Peer IP.
          md5_keys:
            type: list
            raw_type: list
            elements: dict
            version_ranges:
            - - v6.2.0
              - ''
            description: MD5 key.
            children:
              id:
                type: integer
                raw_type: integer
                required: true
                version_ranges:
                - - v6.2.0
                  - ''
                description: Key ID (1 - 255). see <a href='#notes'>Notes</a>.
              key_string:
                type: string
                raw_type: string
                version_ranges:
                - - v6.2.0
                  - ''
                description: Password for the key.
      filter_list:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.0.0
          - ''
        description: OSPF area filter-list configuration.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.0.0
              - ''
            description: Filter list entry ID. see <a href='#notes'>Notes</a>.
          list:
            type: string
            raw_type: string
            version_ranges:
            - - v6.0.0
              - ''
            description: Access-list or prefix-list name. Source router.access-list.name router.prefix-list.name.
            references:
            - router.access-list.name
            - router.prefix-list.name
          direction:
            type: enum
            raw_type: string
            choices:
            - in
            - out
            version_ranges:
            - - v6.0.0
              - ''
            description: Direction.
  ospf_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF interface configuration.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface entry name.
      comments:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Comment.
      interface:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Configuration interface name. Source system.interface.name.
        references:
        - system.interface.name
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: IP address.
      linkdown_fast_failover:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v7.6.0
          - ''
        description: Enable/disable fast link failover.
      authentication:
        type: enum
        raw_type: string
        choices:
        - none
        - text
        - message-digest
        version_ranges:
        - - v6.0.0
          - ''
        description: Authentication type.
      authentication_key:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Authentication key.
      keychain:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.1
          - ''
        description: Message-digest key-chain name. Source router.key-chain.name.
        references:
        - router.key-chain.name
      prefix_length:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Prefix length.
      retransmit_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Retransmit interval.
      transmit_delay:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Transmit delay.
      cost:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Cost of the interface, value range from 0 to 65535, 0 means auto-cost.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Priority.
      dead_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Dead interval.
      hello_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Hello interval.
      hello_multiplier:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Number of hello packets within dead interval.
      database_filter_out:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable control of flooding out LSAs.
      mtu:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: MTU for database description packets.
      mtu_ignore:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable ignore MTU.
      network_type:
        type: enum
        raw_type: string
        choices:
        - broadcast
        - non-broadcast
        - point-to-point
        - point-to-multipoint
        - point-to-multipoint-non-broadcast
        version_ranges:
        - - v6.0.0
          - ''
        description: Network type.
      bfd:
        type: enum
        raw_type: string
        choices:
        - global
        - enable
        - disable
        version_ranges:
        - - v6.0.0
          - ''
        description: Bidirectional Forwarding Detection (BFD).
      status:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable status.
      resync_timeout:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Graceful restart neighbor resynchronization timeout.
      md5_keys:
        type: list
        raw_type: list
        elements: dict
        version_ranges:
        - - v6.2.0
          - ''
        description: MD5 key.
        children:
          id:
            type: integer
            raw_type: integer
            required: true
            version_ranges:
            - - v6.2.0
              - ''
            description: Key ID (1 - 255). see <a href='#notes'>Notes</a>.
          key_string:
            type: string
            raw_type: string
            version_ranges:
            - - v6.2.0
              - ''
            description: Password for the key.
  network:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF network configuration.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Network entry ID. see <a href='#notes'>Notes</a>.
      prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Prefix.
      area:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Attach the network to area.
      comments:
        type: string
        raw_type: string
        version_ranges:
        - - v7.0.0
          - ''
        description: Comment.
  neighbor:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: OSPF neighbor configuration are used when OSPF runs on non-broadcast media.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Neighbor entry ID. see <a href='#notes'>Notes</a>.
      ip:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Interface IP address of the neighbor.
      poll_interval:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Poll interval time in seconds.
      cost:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Cost of the interface, value range from 0 to 65535, 0 means auto-cost.
      priority:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Priority.
  passive_interface:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Passive interface configuration.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Passive interface name. Source system.interface.name.
        references:
        - system.interface.name
  summary_address:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: IP address summary configuration.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Summary address entry ID. see <a href='#notes'>Notes</a>.
      prefix:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Prefix.
      tag:
        type: integer
        raw_type: integer
        version_ranges:
        - - v6.0.0
          - ''
        description: Tag value.
      advertise:
        type: enum
        raw_type: string
        choices:
        - disable
        - enable
        version_ranges:
        - - v6.0.0
          - ''
        description: Enable/disable advertise status.
  distribute_list:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Distribute list configuration.
    children:
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: Distribute list entry ID. see <a href='#notes'>Notes</a>.
      access_list:
        type: string
        raw_type: string
        version_ranges:
        - - v6.0.0
          - ''
        description: Access list name. Source router.access-list.name.
        references:
        - router.access-list.name
      protocol:
        type: enum
        raw_type: string
        choices:
        - connected
        - static
        - rip
        version_ranges:
        - - v6.0.0
          - ''
        description: Protocol type.
