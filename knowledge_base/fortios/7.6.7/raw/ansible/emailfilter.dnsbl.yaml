id: emailfilter.dnsbl
version: 7.6.7
source_object: fortios_emailfilter_dnsbl
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_emailfilter_dnsbl.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: ID. see <a href='#notes'>Notes</a>.
  name:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Name of table.
  comment:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Optional comments.
  entries:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.2.0
      - ''
    description: Spam filter DNSBL and ORBL server.
    children:
      status:
        type: enum
        raw_type: string
        choices:
        - enable
        - disable
        version_ranges:
        - - v6.2.0
          - ''
        description: Enable/disable status.
      id:
        type: integer
        raw_type: integer
        required: true
        version_ranges:
        - - v6.2.0
          - ''
        description: DNSBL/ORBL entry ID. see <a href='#notes'>Notes</a>.
      server:
        type: string
        raw_type: string
        version_ranges:
        - - v6.2.0
          - ''
        description: DNSBL or ORBL server name.
      action:
        type: enum
        raw_type: string
        choices:
        - reject
        - spam
        version_ranges:
        - - v6.2.0
          - ''
        description: Reject connection or mark as spam email.
