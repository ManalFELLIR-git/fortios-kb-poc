id: system.geneve
version: 7.6.7
source_object: fortios_system_geneve
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_geneve.py
root_type: list
attributes:
  name:
    type: string
    raw_type: string
    required: true
    version_ranges:
    - - v6.2.0
      - ''
    description: GENEVE device or interface name. Must be an unique interface name.
  interface:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: Outgoing interface for GENEVE encapsulated traffic. Source system.interface.name.
    references:
    - system.interface.name
  vni:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: GENEVE network ID.
  type:
    type: enum
    raw_type: string
    choices:
    - ethernet
    - ppp
    version_ranges:
    - - v6.4.4
      - ''
    description: GENEVE type.
  ip_version:
    type: enum
    raw_type: string
    choices:
    - ipv4-unicast
    - ipv6-unicast
    version_ranges:
    - - v6.2.0
      - ''
    description: IP version to use for the GENEVE interface and so for communication over the GENEVE. IPv4 or IPv6 unicast.
  remote_ip:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IPv4 address of the GENEVE interface on the device at the remote end of the GENEVE.
  remote_ip6:
    type: string
    raw_type: string
    version_ranges:
    - - v6.2.0
      - ''
    description: IPv6 IP address of the GENEVE interface on the device at the remote end of the GENEVE.
  dstport:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.2.0
      - ''
    description: GENEVE destination port (1 - 65535).
