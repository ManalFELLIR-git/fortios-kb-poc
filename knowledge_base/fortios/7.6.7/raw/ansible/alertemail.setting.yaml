id: alertemail.setting
version: 7.6.7
source_object: fortios_alertemail_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_alertemail_setting.py
root_type: object
attributes:
  username:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: 'Name that appears in the From: field of alert emails (max. 63 characters).'
  mailto1:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Email address to send alert email to (usually a system administrator) (max. 63 characters).
  mailto2:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional second email address to send alert email to (max. 63 characters).
  mailto3:
    type: string
    raw_type: string
    version_ranges:
    - - v6.0.0
      - ''
    description: Optional third email address to send alert email to (max. 63 characters).
  filter_mode:
    type: enum
    raw_type: string
    choices:
    - category
    - threshold
    version_ranges:
    - - v6.0.0
      - ''
    description: How to filter log messages that are sent to alert emails.
  email_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Interval between sending alert emails (1 - 99999 min).
  IPS_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPS logs in alert email.
  firewall_authentication_failure_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable firewall authentication failure logs in alert email.
  HA_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable HA logs in alert email.
  IPsec_errors_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable IPsec error logs in alert email.
  FDS_update_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiGuard update logs in alert email.
  PPP_errors_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable PPP error logs in alert email.
  sslvpn_authentication_errors_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Agentless VPN authentication error logs in alert email.
  antivirus_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable antivirus logs in alert email.
  webfilter_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable web filter logs in alert email.
  configuration_changes_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable configuration change logs in alert email.
  violation_traffic_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable violation traffic logs in alert email.
  admin_login_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable administrator login/logout logs in alert email.
  FDS_license_expiring_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiGuard license expiration warnings in alert email.
  log_disk_usage_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable disk usage warnings in alert email.
  fortiguard_log_quota_warning:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FortiCloud log quota warnings in alert email.
  amc_interface_bypass_mode:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable Fortinet Advanced Mezzanine Card (AMC) interface bypass mode logs in alert email.
  FIPS_CC_errors:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable FIPS and Common Criteria error logs in alert email.
  FSSO_disconnect_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable logging of FSSO collector agent disconnect.
  ssh_logs:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable SSH logs in alert email.
  local_disk_usage:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Disk usage percentage at which to send alert email (1 - 99 percent).
  emergency_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Emergency alert interval in minutes.
  alert_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Alert alert interval in minutes.
  critical_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Critical alert interval in minutes.
  error_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Error alert interval in minutes.
  warning_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Warning alert interval in minutes.
  notification_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Notification alert interval in minutes.
  information_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Information alert interval in minutes.
  debug_interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - ''
    description: Debug alert interval in minutes.
  severity:
    type: enum
    raw_type: string
    choices:
    - emergency
    - alert
    - critical
    - error
    - warning
    - notification
    - information
    - debug
    version_ranges:
    - - v6.0.0
      - ''
    description: Lowest severity level to log.
