id: system.vdom-exception
version: 7.6.7
source_object: fortios_system_vdom_exception
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_system_vdom_exception.py
root_type: list
attributes:
  id:
    type: integer
    raw_type: integer
    required: true
    version_ranges:
    - - v6.0.0
      - ''
    description: Index (1 - 4096). see <a href='#notes'>Notes</a>.
  object:
    type: enum
    raw_type: string
    choices:
    - log.fortianalyzer.setting
    - log.fortianalyzer.override-setting
    - log.fortianalyzer2.setting
    - log.fortianalyzer2.override-setting
    - log.fortianalyzer3.setting
    - log.fortianalyzer3.override-setting
    - log.fortianalyzer-cloud.setting
    - log.fortianalyzer-cloud.override-setting
    - log.syslogd.setting
    - log.syslogd.override-setting
    - log.syslogd2.setting
    - log.syslogd2.override-setting
    - log.syslogd3.setting
    - log.syslogd3.override-setting
    - log.syslogd4.setting
    - log.syslogd4.override-setting
    - system.gre-tunnel
    - system.central-management
    - system.csf
    - user.radius
    - system.interface
    - firewall.address
    - system.snmp.sysinfo
    - vpn.ipsec.phase1-interface
    - vpn.ipsec.phase2-interface
    - router.bgp
    - router.route-map
    - router.prefix-list
    - firewall.ippool
    - firewall.ippool6
    - router.static
    - router.static6
    - firewall.vip
    - firewall.vip6
    - system.sdwan
    - system.saml
    - router.policy
    - router.policy6
    - firewall.vip46
    - firewall.vip64
    version_ranges:
    - - v6.0.0
      - ''
    description: Name of the configuration object that can be configured independently for all VDOMs.
  scope:
    type: enum
    raw_type: string
    choices:
    - all
    - inclusive
    - exclusive
    version_ranges:
    - - v6.0.0
      - ''
    description: Determine whether the configuration object can be configured separately for all VDOMs or if some VDOMs share
      the same configuration.
  vdom:
    type: list
    raw_type: list
    elements: dict
    version_ranges:
    - - v6.0.0
      - ''
    description: Names of the VDOMs.
    children:
      name:
        type: string
        raw_type: string
        required: true
        version_ranges:
        - - v6.0.0
          - ''
        description: VDOM name. Source system.vdom.name.
        references:
        - system.vdom.name
