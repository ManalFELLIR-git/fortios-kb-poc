id: firewall.ipmacbinding.setting
version: 7.6.7
source_object: fortios_firewall_ipmacbinding_setting
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_firewall_ipmacbinding_setting.py
root_type: object
attributes:
  bindthroughfw:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of IP/MAC binding to filter packets that would normally go through the firewall.
  bindtofw:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - ''
    description: Enable/disable use of IP/MAC binding to filter packets that would normally go to the firewall.
  undefinedhost:
    type: enum
    raw_type: string
    choices:
    - allow
    - block
    version_ranges:
    - - v6.0.0
      - ''
    description: Select action to take on packets with IP/MAC addresses not in the binding list .
