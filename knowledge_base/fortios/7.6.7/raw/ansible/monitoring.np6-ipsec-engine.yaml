id: monitoring.np6-ipsec-engine
version: 7.6.7
source_object: fortios_monitoring_np6_ipsec_engine
source:
  kind: ansible
  file: .work\ansible\plugins\modules\fortios_monitoring_np6_ipsec_engine.py
root_type: object
attributes:
  status:
    type: enum
    raw_type: string
    choices:
    - enable
    - disable
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: Enable/disable NP6 IPsec engine status monitoring.
  interval:
    type: integer
    raw_type: integer
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: IPsec engine status check interval (1 - 60 seconds).
  threshold:
    type: list
    raw_type: list
    multiple_values: true
    elements: str
    version_ranges:
    - - v6.0.0
      - v7.4.1
    - - v7.4.3
      - v7.6.7
    description: 'IPsec engine status check threshold (x x x x x x x x, 8 integers from <1> to <255>). Example: Log is generated
      if IPsec engine 0 is busy each of every 15 consecutive interval checks.'
