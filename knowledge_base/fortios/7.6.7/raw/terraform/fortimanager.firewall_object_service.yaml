id: fortimanager.firewall_object_service
version: 7.6.7
source_object: resource_fortimanager_firewall_object_service
source:
  kind: terraform
  file: .work\terraform\fortios\resource_fortimanager_firewall_object_service.go
attributes:
  name:
    type: string
    raw_type: TypeString
    required: true
  comment:
    type: string
    raw_type: TypeString
    optional: true
  category:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - ''
    - File Access
    - Authentication
    - Email
    - General
    - Network Services
    - Remote Access
    - Tunneling
    - VoIP, Messaging & Other Applications
    - Web Access
    - Web Proxy
    default: ''
  protocol:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - TCP/UDP/SCTP
    - ICMP
    - ICMP6
    - IP
    default: TCP/UDP/SCTP
  proxy:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - disable
    - enable
    default: disable
  fqdn:
    type: string
    raw_type: TypeString
    optional: true
  iprange:
    type: string
    raw_type: TypeString
    optional: true
  tcp_portrange:
    type: list
    raw_type: TypeList
    optional: true
  udp_portrange:
    type: list
    raw_type: TypeList
    optional: true
  sctp_portrange:
    type: list
    raw_type: TypeList
    optional: true
  icmp_type:
    type: integer
    raw_type: TypeInt
    optional: true
  icmp_code:
    type: integer
    raw_type: TypeInt
    optional: true
  protocol_number:
    type: integer
    raw_type: TypeInt
    optional: true
  adom:
    type: string
    raw_type: TypeString
    optional: true
    default: root
