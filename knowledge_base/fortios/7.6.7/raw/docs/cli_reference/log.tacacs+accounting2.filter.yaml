id: log.tacacs+accounting2.filter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/124248630/config-log-tacacs-accounting2-filter
attributes:
  cli-cmd-audit:
    type: enum
    raw_type: option
    description: Enable/disable TACACS+ accounting for CLI commands audit.
    default: disable
  config-change-audit:
    type: enum
    raw_type: option
    description: Enable/disable TACACS+ accounting for configuration change events audit.
    default: enable
  login-audit:
    type: enum
    raw_type: option
    description: Enable/disable TACACS+ accounting for login events audit.
    default: enable
children: {}
