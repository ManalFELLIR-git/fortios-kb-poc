id: system.ips-urlfilter-dns
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/310403019/config-system-ips-urlfilter-dns
attributes:
  address:
    type: ipv4-address
    raw_type: ipv4-address
    description: DNS server IP address.
    default: 0.0.0.0
  ipv6-capability:
    type: enum
    raw_type: option
    description: Enable/disable this server for IPv6 queries.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable using this DNS server for IPS URL filter DNS queries.
    default: enable
children: {}
