id: wireless-controller.lw-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/898293577/config-wireless-controller-lw-profile
attributes:
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  cups-api-key:
    type: password
    raw_type: password
    description: CUPS API key of LoRaWAN device.
  cups-server:
    type: string
    raw_type: string
    description: CUPS (Configuration and Update Server) domain name or IP address of LoRaWAN device.
    max_length: 255
  cups-server-port:
    type: integer
    raw_type: integer
    description: CUPS Port value of LoRaWAN device.
    default: '0'
    min: 0
    max: 65535
  lw-protocol:
    type: enum
    raw_type: option
    description: Configure LoRaWAN protocol (default = basics-station)
    default: basics-station
  name:
    type: string
    raw_type: string
    description: LoRaWAN profile name.
    max_length: 35
  tc-api-key:
    type: password
    raw_type: password
    description: TC API key of LoRaWAN device.
  tc-server:
    type: string
    raw_type: string
    description: TC (Traffic Controller) domain name or IP address of LoRaWAN device.
    max_length: 255
  tc-server-port:
    type: integer
    raw_type: integer
    description: TC Port value of LoRaWAN device.
    default: '0'
    min: 0
    max: 65535
children: {}
