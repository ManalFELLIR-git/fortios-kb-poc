id: emailfilter.bword
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/240978890/config-emailfilter-bword
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Mark spam or good.
        default: spam
      id:
        type: integer
        raw_type: integer
        description: Banned word entry ID.
        default: '0'
        min: 0
        max: 4294967295
      language:
        type: enum
        raw_type: option
        description: Language for the banned word.
        default: western
      pattern:
        type: string
        raw_type: string
        description: Pattern for the banned word.
        max_length: 127
      pattern-type:
        type: enum
        raw_type: option
        description: Wildcard pattern or regular expression.
        default: wildcard
      score:
        type: integer
        raw_type: integer
        description: Score value.
        default: '10'
        min: 1
        max: 99999
      status:
        type: enum
        raw_type: option
        description: Enable/disable status.
        default: enable
      where:
        type: enum
        raw_type: option
        description: Component of the email to be scanned.
        default: all
