id: system.fortiguard
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/256936931/config-system-fortiguard
attributes:
  FDS-license-expiring-days:
    type: integer
    raw_type: integer
    description: Threshold for number of days before FortiGuard license expiration to generate license expiring event log
      (1 - 100 days, default = 15).
    default: '15'
    min: 1
    max: 100
  antispam-cache:
    type: enum
    raw_type: option
    description: Enable/disable FortiGuard antispam request caching. Uses a small amount of memory but improves performance.
    default: enable
  antispam-cache-mpermille:
    type: integer
    raw_type: integer
    description: Maximum permille of FortiGate memory the antispam cache is allowed to use (1 - 150).
    default: '1'
    min: 1
    max: 150
  antispam-cache-ttl:
    type: integer
    raw_type: integer
    description: Time-to-live for antispam cache entries in seconds (300 - 86400). Lower times reduce the cache size. Higher
      times may improve performance since the cache will have more entries.
    default: '1800'
    min: 300
    max: 86400
  antispam-expiration:
    type: integer
    raw_type: integer
    description: Expiration date of the FortiGuard antispam contract. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  antispam-force-off:
    type: enum
    raw_type: option
    description: Enable/disable turning off the FortiGuard antispam service.
    default: disable
  antispam-license:
    type: integer
    raw_type: integer
    description: Interval of time between license checks for the FortiGuard antispam contract. Read-only.
    default: '4294967295'
    min: 0
    max: 4294967295
  antispam-timeout:
    type: integer
    raw_type: integer
    description: Antispam query time out (1 - 30 sec, default = 7).
    default: '7'
    min: 1
    max: 30
  anycast-sdns-server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the FortiGuard anycast DNS rating server.
    default: 0.0.0.0
  anycast-sdns-server-port:
    type: integer
    raw_type: integer
    description: Port to connect to on the FortiGuard anycast DNS rating server.
    default: '853'
    min: 1
    max: 65535
  auto-firmware-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable automatic patch-level firmware upgrade from FortiGuard. The FortiGate unit searches for new
      patches only in the same major and minor version. Enabled by default for entry-level FortiGates; see Automatic firmware
      updates .
    default: enable
  auto-firmware-upgrade-day:
    type: enum
    raw_type: option
    description: Allowed day(s) of the week to install an automatic patch-level firmware upgrade from FortiGuard (default
      is none). Disallow any day of the week to use auto-firmware-upgrade-delay instead, which waits for designated days before
      installing an automatic patch-level firmware upgrade.
  auto-firmware-upgrade-delay:
    type: integer
    raw_type: integer
    description: Delay of day(s) before installing an automatic patch-level firmware upgrade from FortiGuard (default = 3).
      Set it 0 to use auto-firmware-upgrade-day instead, which selects allowed day(s) of the week for installing an automatic
      patch-level firmware upgrade.
    default: '3'
    min: 0
    max: 14
  auto-firmware-upgrade-end-hour:
    type: integer
    raw_type: integer
    description: End time in the designated time window for automatic patch-level firmware upgrade from FortiGuard in 24 hour
      time (0 ~ 23, default = 4). When the end time is smaller than the start time, the end time is interpreted as the next
      day. The actual upgrade time is selected randomly within the time window.
    default: '4'
    min: 0
    max: 23
  auto-firmware-upgrade-start-hour:
    type: integer
    raw_type: integer
    description: Start time in the designated time window for automatic patch-level firmware upgrade from FortiGuard in 24
      hour time (0 ~ 23, default = 2). The actual upgrade time is selected randomly within the time window.
    default: '2'
    min: 0
    max: 23
  auto-join-forticloud:
    type: enum
    raw_type: option
    description: Automatically connect to and login to FortiCloud.
    default: enable
  ddns-server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the FortiDDNS server.
    default: 0.0.0.0
  ddns-server-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address of the FortiDDNS server.
    default: '::'
  ddns-server-port:
    type: integer
    raw_type: integer
    description: Port used to communicate with FortiDDNS servers.
    default: '443'
    min: 1
    max: 65535
  fortiguard-anycast:
    type: enum
    raw_type: option
    description: Enable/disable use of FortiGuard's Anycast network.
    default: enable
  fortiguard-anycast-source:
    type: enum
    raw_type: option
    description: Configure which of Fortinet's servers to provide FortiGuard services in FortiGuard's anycast network. Default
      is Fortinet.
    default: fortinet
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  load-balance-servers:
    type: integer
    raw_type: integer
    description: Number of servers to alternate between as first FortiGuard option.
    default: '1'
    min: 1
    max: 266
  outbreak-prevention-cache:
    type: enum
    raw_type: option
    description: Enable/disable FortiGuard Virus Outbreak Prevention cache.
    default: enable
  outbreak-prevention-cache-mpermille:
    type: integer
    raw_type: integer
    description: Maximum permille of memory FortiGuard Virus Outbreak Prevention cache can use (1 - 150 permille, default
      = 1).
    default: '1'
    min: 1
    max: 150
  outbreak-prevention-cache-ttl:
    type: integer
    raw_type: integer
    description: Time-to-live for FortiGuard Virus Outbreak Prevention cache entries (300 - 86400 sec, default = 300).
    default: '300'
    min: 300
    max: 86400
  outbreak-prevention-expiration:
    type: integer
    raw_type: integer
    description: Expiration date of FortiGuard Virus Outbreak Prevention contract. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  outbreak-prevention-force-off:
    type: enum
    raw_type: option
    description: Turn off FortiGuard Virus Outbreak Prevention service.
    default: disable
  outbreak-prevention-license:
    type: integer
    raw_type: integer
    description: Interval of time between license checks for FortiGuard Virus Outbreak Prevention contract. Read-only.
    default: '4294967295'
    min: 0
    max: 4294967295
  outbreak-prevention-timeout:
    type: integer
    raw_type: integer
    description: FortiGuard Virus Outbreak Prevention time out (1 - 30 sec, default = 7).
    default: '7'
    min: 1
    max: 30
  persistent-connection:
    type: enum
    raw_type: option
    description: Enable/disable use of persistent connection to receive update notification from FortiGuard.
    default: disable
  port:
    type: enum
    raw_type: option
    description: Port used to communicate with the FortiGuard servers.
    default: '443'
  protocol:
    type: enum
    raw_type: option
    description: Protocol used to communicate with the FortiGuard servers.
    default: https
  proxy-password:
    type: password
    raw_type: password
    description: Proxy user password.
  proxy-server-ip:
    type: string
    raw_type: string
    description: Hostname or IPv4 address of the proxy server.
    max_length: 63
  proxy-server-port:
    type: integer
    raw_type: integer
    description: Port used to communicate with the proxy server.
    default: '0'
    min: 0
    max: 65535
  proxy-username:
    type: string
    raw_type: string
    description: Proxy user name.
    max_length: 64
  sandbox-inline-scan:
    type: enum
    raw_type: option
    description: Enable/disable FortiCloud Sandbox inline-scan.
    default: disable
  sandbox-region:
    type: string
    raw_type: string
    description: FortiCloud Sandbox region.
    max_length: 63
  sdns-options:
    type: enum
    raw_type: option
    description: Customization options for the FortiGuard DNS service.
  sdns-server-ip:
    type: string
    raw_type: user
    description: IP address of the FortiGuard DNS rating server.
  sdns-server-port:
    type: integer
    raw_type: integer
    description: Port to connect to on the FortiGuard DNS rating server.
    default: '53'
    min: 1
    max: 65535
  service-account-id:
    type: string
    raw_type: string
    description: Service account ID. Read only.
    max_length: 50
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IPv4 address used to communicate with FortiGuard.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Source IPv6 address used to communicate with FortiGuard.
    default: '::'
  subscribe-update-notification:
    type: enum
    raw_type: option
    description: Enable/disable subscription to receive update notification from FortiGuard.
    default: disable
  update-build-proxy:
    type: enum
    raw_type: option
    description: Enable/disable proxy dictionary rebuild.
    default: enable
  update-dldb:
    type: enum
    raw_type: option
    description: Enable/disable DLP signature update.
    default: enable
  update-extdb:
    type: enum
    raw_type: option
    description: Enable/disable external resource update.
    default: enable
  update-ffdb:
    type: enum
    raw_type: option
    description: Enable/disable Internet Service Database update.
    default: enable
  update-server-location:
    type: enum
    raw_type: option
    description: Location from which to receive FortiGuard updates.
    default: automatic
  update-uwdb:
    type: enum
    raw_type: option
    description: Enable/disable allowlist update.
    default: enable
  vdom:
    type: string
    raw_type: string
    description: FortiGuard Service virtual domain name.
    max_length: 31
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
  webfilter-cache:
    type: enum
    raw_type: option
    description: Enable/disable FortiGuard web filter caching.
    default: enable
  webfilter-cache-ttl:
    type: integer
    raw_type: integer
    description: Time-to-live for web filter cache entries in seconds (300 - 86400).
    default: '3600'
    min: 300
    max: 86400
  webfilter-expiration:
    type: integer
    raw_type: integer
    description: Expiration date of the FortiGuard web filter contract. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  webfilter-force-off:
    type: enum
    raw_type: option
    description: Enable/disable turning off the FortiGuard web filtering service.
    default: disable
  webfilter-license:
    type: integer
    raw_type: integer
    description: Interval of time between license checks for the FortiGuard web filter contract. Read-only.
    default: '4294967295'
    min: 0
    max: 4294967295
  webfilter-timeout:
    type: integer
    raw_type: integer
    description: Web filter query time out (1 - 30 sec, default = 15).
    default: '15'
    min: 1
    max: 30
children: {}
