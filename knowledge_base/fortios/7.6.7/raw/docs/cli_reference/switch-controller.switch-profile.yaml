id: switch-controller.switch-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/772820924/config-switch-controller-switch-profile
attributes:
  login:
    type: enum
    raw_type: option
    description: Enable/disable FortiSwitch serial console.
    default: enable
  login-passwd:
    type: password
    raw_type: password
    description: Login password of managed FortiSwitch.
  login-passwd-override:
    type: enum
    raw_type: option
    description: Enable/disable overriding the admin administrator password for a managed FortiSwitch with the FortiGate admin
      administrator account password.
    default: disable
  name:
    type: string
    raw_type: string
    description: FortiSwitch Profile name.
    max_length: 35
  revision-backup-on-logout:
    type: enum
    raw_type: option
    description: Enable/disable automatic revision backup upon logout from FortiSwitch.
    default: disable
  revision-backup-on-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable automatic revision backup upon FortiSwitch image upgrade.
    default: disable
children: {}
