id: videofilter.keyword
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/324571180/config-videofilter-keyword
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  match:
    type: enum
    raw_type: option
    description: Keyword matching logic.
    default: or
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  word:
    attributes:
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 79
      pattern-type:
        type: enum
        raw_type: option
        description: Pattern type.
        default: wildcard
      status:
        type: enum
        raw_type: option
        description: Enable(consider)/disable(ignore) this keyword.
        default: enable
