id: log.fortiguard.override-setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/387114700/config-log-fortiguard-override-setting
attributes:
  access-config:
    type: enum
    raw_type: option
    description: Enable/disable FortiCloud access to configuration and data.
    default: enable
  max-log-rate:
    type: integer
    raw_type: integer
    description: FortiCloud maximum log rate in MBps (0 = unlimited).
    default: '0'
    min: 0
    max: 100000
  override:
    type: enum
    raw_type: option
    description: Overriding FortiCloud settings for this VDOM or use global settings.
    default: disable
  priority:
    type: enum
    raw_type: option
    description: Set log transmission priority.
    default: default
  status:
    type: enum
    raw_type: option
    description: Enable/disable logging to FortiCloud.
    default: disable
  upload-day:
    type: string
    raw_type: user
    description: Day of week to roll logs.
  upload-interval:
    type: enum
    raw_type: option
    description: Frequency of uploading log files to FortiCloud.
    default: daily
  upload-option:
    type: enum
    raw_type: option
    description: Configure how log messages are sent to FortiCloud.
    default: 5-minute
  upload-time:
    type: string
    raw_type: user
    description: Time of day to roll logs (hh:mm).
children: {}
