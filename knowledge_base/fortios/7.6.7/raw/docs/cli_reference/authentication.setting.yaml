id: authentication.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/277229215/config-authentication-setting
attributes:
  active-auth-scheme:
    type: string
    raw_type: string
    description: Active authentication method (scheme name).
    max_length: 35
  auth-https:
    type: enum
    raw_type: option
    description: Enable/disable redirecting HTTP user authentication to HTTPS.
    default: enable
  captive-portal:
    type: string
    raw_type: string
    description: Captive portal host name.
    max_length: 255
  captive-portal-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Captive portal IP address.
    default: 0.0.0.0
  captive-portal-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Captive portal IPv6 address.
    default: '::'
  captive-portal-port:
    type: integer
    raw_type: integer
    description: Captive portal port number (1 - 65535, default = 7830).
    default: '7830'
    min: 1
    max: 65535
  captive-portal-ssl-port:
    type: integer
    raw_type: integer
    description: Captive portal SSL port number (1 - 65535, default = 7831).
    default: '7831'
    min: 1
    max: 65535
  captive-portal-type:
    type: enum
    raw_type: option
    description: Captive portal type.
    default: fqdn
  captive-portal6:
    type: string
    raw_type: string
    description: IPv6 captive portal host name.
    max_length: 255
  cert-auth:
    type: enum
    raw_type: option
    description: Enable/disable redirecting certificate authentication to HTTPS portal.
    default: disable
  cert-captive-portal:
    type: string
    raw_type: string
    description: Certificate captive portal host name.
    max_length: 255
  cert-captive-portal-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Certificate captive portal IP address.
    default: 0.0.0.0
  cert-captive-portal-port:
    type: integer
    raw_type: integer
    description: Certificate captive portal port number (1 - 65535, default = 7832).
    default: '7832'
    min: 1
    max: 65535
  cookie-max-age:
    type: integer
    raw_type: integer
    description: Persistent web portal cookie maximum age in minutes (30 - 10080 (1 week), default = 480 (8 hours)).
    default: '480'
    min: 30
    max: 10080
  cookie-refresh-div:
    type: integer
    raw_type: integer
    description: Refresh rate divider of persistent web portal cookie (default = 2). Refresh value = cookie-max-age/cookie-refresh-div.
    default: '2'
    min: 2
    max: 4
  dev-range:
    type: string
    raw_type: string
    description: Address range for the IP based device query. Address name.
    max_length: 79
  ems-root-ca:
    type: enum
    raw_type: option
    description: Enable/disable use of the EMS root CA for FortiClient, ZTNA, and endpoint authentication (default = enable).
    default: enable
  ip-auth-cookie:
    type: enum
    raw_type: option
    description: Enable/disable persistent cookie on IP based web portal authentication (default = disable).
    default: disable
  persistent-cookie:
    type: enum
    raw_type: option
    description: Enable/disable persistent cookie on web portal authentication (default = enable).
    default: enable
  sso-auth-scheme:
    type: string
    raw_type: string
    description: Single-Sign-On authentication method (scheme name).
    max_length: 35
  update-time:
    type: string
    raw_type: user
    description: Time of the last update.
  user-cert-ca:
    type: string
    raw_type: string
    description: CA certificate used for client certificate verification. CA certificate list.
    max_length: 79
children: {}
