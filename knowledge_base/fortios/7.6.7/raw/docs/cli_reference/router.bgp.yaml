id: router.bgp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/225427711/config-router-bgp
attributes:
  additional-path:
    type: enum
    raw_type: option
    description: Enable/disable selection of BGP IPv4 additional paths.
    default: disable
  additional-path-select:
    type: integer
    raw_type: integer
    description: Number of additional paths to be selected for each IPv4 NLRI.
    default: '2'
    min: 2
    max: 255
  additional-path-select-vpnv4:
    type: integer
    raw_type: integer
    description: Number of additional paths to be selected for each VPNv4 NLRI.
    default: '2'
    min: 2
    max: 255
  additional-path-select-vpnv6:
    type: integer
    raw_type: integer
    description: Number of additional paths to be selected for each VPNv6 NLRI.
    default: '2'
    min: 2
    max: 255
  additional-path-select6:
    type: integer
    raw_type: integer
    description: Number of additional paths to be selected for each IPv6 NLRI.
    default: '2'
    min: 2
    max: 255
  additional-path-vpnv4:
    type: enum
    raw_type: option
    description: Enable/disable selection of BGP VPNv4 additional paths.
    default: disable
  additional-path-vpnv6:
    type: enum
    raw_type: option
    description: Enable/disable selection of BGP VPNv6 additional paths.
    default: disable
  additional-path6:
    type: enum
    raw_type: option
    description: Enable/disable selection of BGP IPv6 additional paths.
    default: disable
  always-compare-med:
    type: enum
    raw_type: option
    description: Enable/disable always compare MED.
    default: disable
  as:
    type: string
    raw_type: user
    description: Router AS number, asplain/asdot/asdot+ format, 0 to disable BGP.
  bestpath-as-path-ignore:
    type: enum
    raw_type: option
    description: Enable/disable ignore AS path.
    default: disable
  bestpath-cmp-confed-aspath:
    type: enum
    raw_type: option
    description: Enable/disable compare federation AS path length.
    default: disable
  bestpath-cmp-routerid:
    type: enum
    raw_type: option
    description: Enable/disable compare router ID for identical EBGP paths.
    default: disable
  bestpath-med-confed:
    type: enum
    raw_type: option
    description: Enable/disable compare MED among confederation paths.
    default: disable
  bestpath-med-missing-as-worst:
    type: enum
    raw_type: option
    description: Enable/disable treat missing MED as least preferred.
    default: disable
  client-to-client-reflection:
    type: enum
    raw_type: option
    description: Enable/disable client-to-client route reflection.
    default: enable
  cluster-id:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Route reflector cluster ID.
    default: 0.0.0.0
  confederation-identifier:
    type: integer
    raw_type: integer
    description: Confederation identifier.
    default: '0'
    min: 1
    max: 4294967295
  confederation-peers:
    type: string
    raw_type: string
    description: Confederation peers. Peer ID.
    max_length: 79
  cross-family-conditional-adv:
    type: enum
    raw_type: option
    description: Enable/disable cross address family conditional advertisement.
    default: disable
  dampening:
    type: enum
    raw_type: option
    description: Enable/disable route-flap dampening.
    default: disable
  dampening-max-suppress-time:
    type: integer
    raw_type: integer
    description: Maximum minutes a route can be suppressed.
    default: '60'
    min: 1
    max: 255
  dampening-reachability-half-life:
    type: integer
    raw_type: integer
    description: Reachability half-life time for penalty (min).
    default: '15'
    min: 1
    max: 45
  dampening-reuse:
    type: integer
    raw_type: integer
    description: Threshold to reuse routes.
    default: '750'
    min: 1
    max: 20000
  dampening-route-map:
    type: string
    raw_type: string
    description: Criteria for dampening.
    max_length: 35
  dampening-suppress:
    type: integer
    raw_type: integer
    description: Threshold to suppress routes.
    default: '2000'
    min: 1
    max: 20000
  dampening-unreachability-half-life:
    type: integer
    raw_type: integer
    description: Unreachability half-life time for penalty (min).
    default: '15'
    min: 1
    max: 45
  default-local-preference:
    type: integer
    raw_type: integer
    description: Default local preference.
    default: '100'
    min: 0
    max: 4294967295
  deterministic-med:
    type: enum
    raw_type: option
    description: Enable/disable enforce deterministic comparison of MED.
    default: disable
  distance-external:
    type: integer
    raw_type: integer
    description: Distance for routes external to the AS.
    default: '20'
    min: 1
    max: 255
  distance-internal:
    type: integer
    raw_type: integer
    description: Distance for routes internal to the AS.
    default: '200'
    min: 1
    max: 255
  distance-local:
    type: integer
    raw_type: integer
    description: Distance for routes local to the AS.
    default: '200'
    min: 1
    max: 255
  ebgp-multipath:
    type: enum
    raw_type: option
    description: Enable/disable EBGP multi-path.
    default: disable
  enforce-first-as:
    type: enum
    raw_type: option
    description: Enable/disable enforce first AS for EBGP routes.
    default: enable
  fast-external-failover:
    type: enum
    raw_type: option
    description: Enable/disable reset peer BGP session if link goes down.
    default: enable
  graceful-end-on-timer:
    type: enum
    raw_type: option
    description: Enable/disable to exit graceful restart on timer only.
    default: disable
  graceful-restart:
    type: enum
    raw_type: option
    description: Enable/disable BGP graceful restart capabilities.
    default: disable
  graceful-restart-time:
    type: integer
    raw_type: integer
    description: Time needed for neighbors to restart (sec).
    default: '120'
    min: 1
    max: 3600
  graceful-stalepath-time:
    type: integer
    raw_type: integer
    description: Time to hold stale paths of restarting neighbor (sec).
    default: '360'
    min: 1
    max: 3600
  graceful-update-delay:
    type: integer
    raw_type: integer
    description: Route advertisement/selection delay after restart (sec).
    default: '120'
    min: 1
    max: 3600
  holdtime-timer:
    type: integer
    raw_type: integer
    description: Number of seconds to mark peer as dead.
    default: '180'
    min: 3
    max: 65535
  ibgp-multipath:
    type: enum
    raw_type: option
    description: Enable/disable IBGP multi-path.
    default: disable
  ignore-optional-capability:
    type: enum
    raw_type: option
    description: Do not send unknown optional capability notification message.
    default: enable
  keepalive-timer:
    type: integer
    raw_type: integer
    description: Frequency to send keep alive requests.
    default: '60'
    min: 0
    max: 65535
  log-neighbour-changes:
    type: enum
    raw_type: option
    description: Log BGP neighbor changes.
    default: enable
  multipath-recursive-distance:
    type: enum
    raw_type: option
    description: Enable/disable use of recursive distance to select multipath.
    default: disable
  network-import-check:
    type: enum
    raw_type: option
    description: Enable/disable ensure BGP network route exists in IGP.
    default: enable
  recursive-inherit-priority:
    type: enum
    raw_type: option
    description: Enable/disable priority inheritance for recursive resolution.
    default: disable
  recursive-next-hop:
    type: enum
    raw_type: option
    description: Enable/disable recursive resolution of next-hop using BGP route.
    default: disable
  router-id:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Router ID.
  scan-time:
    type: integer
    raw_type: integer
    description: Background scanner interval (sec), 0 to disable it.
    default: '60'
    min: 5
    max: 60
  synchronization:
    type: enum
    raw_type: option
    description: Enable/disable only advertise routes from iBGP if routes present in an IGP.
    default: disable
  tag-resolve-mode:
    type: enum
    raw_type: option
    description: Configure tag-match mode. Resolves BGP routes with other routes containing the same tag.
    default: disable
children:
  admin-distance:
    attributes:
      distance:
        type: integer
        raw_type: integer
        description: Administrative distance to apply (1 - 255).
        default: '0'
        min: 1
        max: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      neighbour-prefix:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: Neighbor address prefix.
        default: 0.0.0.0 0.0.0.0
      route-list:
        type: string
        raw_type: string
        description: Access list of routes to apply new distance to.
        max_length: 35
  aggregate-address:
    attributes:
      as-set:
        type: enum
        raw_type: option
        description: Enable/disable generate AS set path information.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      prefix:
        type: ipv4-classnet-any
        raw_type: ipv4-classnet-any
        description: Aggregate prefix.
        default: 0.0.0.0 0.0.0.0
      summary-only:
        type: enum
        raw_type: option
        description: Enable/disable filter more specific routes from updates.
        default: disable
  aggregate-address6:
    attributes:
      as-set:
        type: enum
        raw_type: option
        description: Enable/disable generate AS set path information.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      prefix6:
        type: ipv6-prefix
        raw_type: ipv6-prefix
        description: Aggregate IPv6 prefix.
        default: ::/0
      summary-only:
        type: enum
        raw_type: option
        description: Enable/disable filter more specific routes from updates.
        default: disable
  neighbor:
    attributes:
      activate:
        type: enum
        raw_type: option
        description: Enable/disable address family IPv4 for this neighbor.
        default: enable
      activate-evpn:
        type: enum
        raw_type: option
        description: Enable/disable address family L2VPN EVPN for this neighbor.
        default: enable
      activate-vpnv4:
        type: enum
        raw_type: option
        description: Enable/disable address family VPNv4 for this neighbor.
        default: enable
      activate-vpnv6:
        type: enum
        raw_type: option
        description: Enable/disable address family VPNv6 for this neighbor.
        default: enable
      activate6:
        type: enum
        raw_type: option
        description: Enable/disable address family IPv6 for this neighbor.
        default: enable
      additional-path:
        type: enum
        raw_type: option
        description: Enable/disable IPv4 additional-path capability.
        default: disable
      additional-path-vpnv4:
        type: enum
        raw_type: option
        description: Enable/disable VPNv4 additional-path capability.
        default: disable
      additional-path-vpnv6:
        type: enum
        raw_type: option
        description: Enable/disable VPNv6 additional-path capability.
        default: disable
      additional-path6:
        type: enum
        raw_type: option
        description: Enable/disable IPv6 additional-path capability.
        default: disable
      adv-additional-path:
        type: integer
        raw_type: integer
        description: Number of IPv4 additional paths that can be advertised to this neighbor.
        default: '2'
        min: 2
        max: 255
      adv-additional-path-vpnv4:
        type: integer
        raw_type: integer
        description: Number of VPNv4 additional paths that can be advertised to this neighbor.
        default: '2'
        min: 2
        max: 255
      adv-additional-path-vpnv6:
        type: integer
        raw_type: integer
        description: Number of VPNv6 additional paths that can be advertised to this neighbor.
        default: '2'
        min: 2
        max: 255
      adv-additional-path6:
        type: integer
        raw_type: integer
        description: Number of IPv6 additional paths that can be advertised to this neighbor.
        default: '2'
        min: 2
        max: 255
      advertisement-interval:
        type: integer
        raw_type: integer
        description: Minimum interval (sec) between sending updates.
        default: '30'
        min: 0
        max: 600
      allowas-in:
        type: integer
        raw_type: integer
        description: IPv4 The maximum number of occurrence of my AS number allowed.
        default: '3'
        min: 1
        max: 10
      allowas-in-enable:
        type: enum
        raw_type: option
        description: Enable/disable IPv4 Enable to allow my AS in AS path.
        default: disable
      allowas-in-enable-evpn:
        type: enum
        raw_type: option
        description: Enable/disable to allow my AS in AS path for L2VPN EVPN route.
        default: disable
      allowas-in-enable-vpnv4:
        type: enum
        raw_type: option
        description: Enable/disable to allow my AS in AS path for VPNv4 route.
        default: disable
      allowas-in-enable-vpnv6:
        type: enum
        raw_type: option
        description: Enable/disable use of my AS in AS path for VPNv6 route.
        default: disable
      allowas-in-enable6:
        type: enum
        raw_type: option
        description: Enable/disable IPv6 Enable to allow my AS in AS path.
        default: disable
      allowas-in-evpn:
        type: integer
        raw_type: integer
        description: The maximum number of occurrence of my AS number allowed for L2VPN EVPN route.
        default: '3'
        min: 1
        max: 10
      allowas-in-vpnv4:
        type: integer
        raw_type: integer
        description: The maximum number of occurrence of my AS number allowed for VPNv4 route.
        default: '3'
        min: 1
        max: 10
      allowas-in-vpnv6:
        type: integer
        raw_type: integer
        description: The maximum number of occurrence of my AS number allowed for VPNv6 route.
        default: '3'
        min: 1
        max: 10
      allowas-in6:
        type: integer
        raw_type: integer
        description: IPv6 The maximum number of occurrence of my AS number allowed.
        default: '3'
        min: 1
        max: 10
      as-override:
        type: enum
        raw_type: option
        description: Enable/disable replace peer AS with own AS for IPv4.
        default: disable
      as-override6:
        type: enum
        raw_type: option
        description: Enable/disable replace peer AS with own AS for IPv6.
        default: disable
      attribute-unchanged:
        type: enum
        raw_type: option
        description: IPv4 List of attributes that should be unchanged.
      attribute-unchanged-vpnv4:
        type: enum
        raw_type: option
        description: List of attributes that should be unchanged for VPNv4 route.
      attribute-unchanged-vpnv6:
        type: enum
        raw_type: option
        description: List of attributes that should not be changed for VPNv6 route.
      attribute-unchanged6:
        type: enum
        raw_type: option
        description: IPv6 List of attributes that should be unchanged.
      auth-options:
        type: string
        raw_type: string
        description: Key-chain name for TCP authentication options.
        max_length: 35
      bfd:
        type: enum
        raw_type: option
        description: Enable/disable BFD for this neighbor.
        default: disable
      capability-default-originate:
        type: enum
        raw_type: option
        description: Enable/disable advertise default IPv4 route to this neighbor.
        default: disable
      capability-default-originate6:
        type: enum
        raw_type: option
        description: Enable/disable advertise default IPv6 route to this neighbor.
        default: disable
      capability-dynamic:
        type: enum
        raw_type: option
        description: Enable/disable advertise dynamic capability to this neighbor.
        default: disable
      capability-graceful-restart:
        type: enum
        raw_type: option
        description: Enable/disable advertise IPv4 graceful restart capability to this neighbor.
        default: disable
      capability-graceful-restart-evpn:
        type: enum
        raw_type: option
        description: Enable/disable advertisement of L2VPN EVPN graceful restart capability to this neighbor.
        default: disable
      capability-graceful-restart-vpnv4:
        type: enum
        raw_type: option
        description: Enable/disable advertise VPNv4 graceful restart capability to this neighbor.
        default: disable
      capability-graceful-restart-vpnv6:
        type: enum
        raw_type: option
        description: Enable/disable advertisement of VPNv6 graceful restart capability to this neighbor.
        default: disable
      capability-graceful-restart6:
        type: enum
        raw_type: option
        description: Enable/disable advertise IPv6 graceful restart capability to this neighbor.
        default: disable
      capability-orf:
        type: enum
        raw_type: option
        description: Accept/Send IPv4 ORF lists to/from this neighbor.
        default: none
      capability-orf6:
        type: enum
        raw_type: option
        description: Accept/Send IPv6 ORF lists to/from this neighbor.
        default: none
      capability-route-refresh:
        type: enum
        raw_type: option
        description: Enable/disable advertise route refresh capability to this neighbor.
        default: enable
      connect-timer:
        type: integer
        raw_type: integer
        description: Interval (sec) for connect timer.
        default: '4294967295'
        min: 1
        max: 65535
      default-originate-routemap:
        type: string
        raw_type: string
        description: Route map to specify criteria to originate IPv4 default.
        max_length: 35
      default-originate-routemap6:
        type: string
        raw_type: string
        description: Route map to specify criteria to originate IPv6 default.
        max_length: 35
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      distribute-list-in:
        type: string
        raw_type: string
        description: Filter for IPv4 updates from this neighbor.
        max_length: 35
      distribute-list-in-vpnv4:
        type: string
        raw_type: string
        description: Filter for VPNv4 updates from this neighbor.
        max_length: 35
      distribute-list-in-vpnv6:
        type: string
        raw_type: string
        description: Filter for VPNv6 updates from this neighbor.
        max_length: 35
      distribute-list-in6:
        type: string
        raw_type: string
        description: Filter for IPv6 updates from this neighbor.
        max_length: 35
      distribute-list-out:
        type: string
        raw_type: string
        description: Filter for IPv4 updates to this neighbor.
        max_length: 35
      distribute-list-out-vpnv4:
        type: string
        raw_type: string
        description: Filter for VPNv4 updates to this neighbor.
        max_length: 35
      distribute-list-out-vpnv6:
        type: string
        raw_type: string
        description: Filter for VPNv6 updates to this neighbor.
        max_length: 35
      distribute-list-out6:
        type: string
        raw_type: string
        description: Filter for IPv6 updates to this neighbor.
        max_length: 35
      dont-capability-negotiate:
        type: enum
        raw_type: option
        description: Do not negotiate capabilities with this neighbor.
        default: disable
      ebgp-enforce-multihop:
        type: enum
        raw_type: option
        description: Enable/disable allow multi-hop EBGP neighbors.
        default: disable
      ebgp-multihop-ttl:
        type: integer
        raw_type: integer
        description: EBGP multihop TTL for this peer.
        default: '255'
        min: 1
        max: 255
      filter-list-in:
        type: string
        raw_type: string
        description: BGP filter for IPv4 inbound routes.
        max_length: 35
      filter-list-in-vpnv4:
        type: string
        raw_type: string
        description: BGP filter for VPNv4 inbound routes.
        max_length: 35
      filter-list-in-vpnv6:
        type: string
        raw_type: string
        description: BGP filter for VPNv6 inbound routes.
        max_length: 35
      filter-list-in6:
        type: string
        raw_type: string
        description: BGP filter for IPv6 inbound routes.
        max_length: 35
      filter-list-out:
        type: string
        raw_type: string
        description: BGP filter for IPv4 outbound routes.
        max_length: 35
      filter-list-out-vpnv4:
        type: string
        raw_type: string
        description: BGP filter for VPNv4 outbound routes.
        max_length: 35
      filter-list-out-vpnv6:
        type: string
        raw_type: string
        description: BGP filter for VPNv6 outbound routes.
        max_length: 35
      filter-list-out6:
        type: string
        raw_type: string
        description: BGP filter for IPv6 outbound routes.
        max_length: 35
      holdtime-timer:
        type: integer
        raw_type: integer
        description: Interval (sec) before peer considered dead.
        default: '4294967295'
        min: 3
        max: 65535
      interface:
        type: string
        raw_type: string
        description: Specify outgoing interface for peer connection. For IPv6 peer, the interface should have link-local address.
        max_length: 15
      ip:
        type: string
        raw_type: string
        description: IP/IPv6 address of neighbor.
        max_length: 45
      keep-alive-timer:
        type: integer
        raw_type: integer
        description: Keep alive timer interval (sec).
        default: '4294967295'
        min: 0
        max: 65535
      link-down-failover:
        type: enum
        raw_type: option
        description: Enable/disable failover upon link down.
        default: disable
      local-as:
        type: string
        raw_type: user
        description: Local AS number of neighbor.
      local-as-no-prepend:
        type: enum
        raw_type: option
        description: Do not prepend local-as to incoming updates.
        default: disable
      local-as-replace-as:
        type: enum
        raw_type: option
        description: Replace real AS with local-as in outgoing updates.
        default: disable
      maximum-prefix:
        type: integer
        raw_type: integer
        description: Maximum number of IPv4 prefixes to accept from this peer.
        default: '0'
        min: 1
        max: 4294967295
      maximum-prefix-evpn:
        type: integer
        raw_type: integer
        description: Maximum number of L2VPN EVPN prefixes to accept from this peer.
        default: '0'
        min: 1
        max: 4294967295
      maximum-prefix-threshold:
        type: integer
        raw_type: integer
        description: Maximum IPv4 prefix threshold value (1 - 100 percent).
        default: '75'
        min: 1
        max: 100
      maximum-prefix-threshold-evpn:
        type: integer
        raw_type: integer
        description: Maximum L2VPN EVPN prefix threshold value (1 - 100 percent).
        default: '75'
        min: 1
        max: 100
      maximum-prefix-threshold-vpnv4:
        type: integer
        raw_type: integer
        description: Maximum VPNv4 prefix threshold value (1 - 100 percent).
        default: '75'
        min: 1
        max: 100
      maximum-prefix-threshold-vpnv6:
        type: integer
        raw_type: integer
        description: Maximum VPNv6 prefix threshold value (1 - 100 percent).
        default: '75'
        min: 1
        max: 100
      maximum-prefix-threshold6:
        type: integer
        raw_type: integer
        description: Maximum IPv6 prefix threshold value (1 - 100 percent).
        default: '75'
        min: 1
        max: 100
      maximum-prefix-vpnv4:
        type: integer
        raw_type: integer
        description: Maximum number of VPNv4 prefixes to accept from this peer.
        default: '0'
        min: 1
        max: 4294967295
      maximum-prefix-vpnv6:
        type: integer
        raw_type: integer
        description: Maximum number of VPNv6 prefixes to accept from this peer.
        default: '0'
        min: 1
        max: 4294967295
      maximum-prefix-warning-only:
        type: enum
        raw_type: option
        description: Enable/disable IPv4 Only give warning message when limit is exceeded.
        default: disable
      maximum-prefix-warning-only-evpn:
        type: enum
        raw_type: option
        description: Enable/disable only sending warning message when exceeding limit of L2VPN EVPN routes.
        default: disable
      maximum-prefix-warning-only-vpnv4:
        type: enum
        raw_type: option
        description: Enable/disable only giving warning message when limit is exceeded for VPNv4 routes.
        default: disable
      maximum-prefix-warning-only-vpnv6:
        type: enum
        raw_type: option
        description: Enable/disable warning message when limit is exceeded for VPNv6 routes.
        default: disable
      maximum-prefix-warning-only6:
        type: enum
        raw_type: option
        description: Enable/disable IPv6 Only give warning message when limit is exceeded.
        default: disable
      maximum-prefix6:
        type: integer
        raw_type: integer
        description: Maximum number of IPv6 prefixes to accept from this peer.
        default: '0'
        min: 1
        max: 4294967295
      next-hop-self:
        type: enum
        raw_type: option
        description: Enable/disable IPv4 next-hop calculation for this neighbor.
        default: disable
      next-hop-self-rr:
