id: firewall.ttl-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/158447704/config-firewall-ttl-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Action to be performed on traffic matching this policy (default = deny).
    default: deny
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  schedule:
    type: string
    raw_type: string
    description: Schedule object from available options.
    max_length: 35
  service:
    type: string
    raw_type: string
    description: Service object(s) from available options. Separate multiple names with a space. Service name.
    max_length: 79
  srcaddr:
    type: string
    raw_type: string
    description: Source address object(s) from available options. Separate multiple names with a space. Address name.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: Source interface name from available interfaces.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable this TTL policy.
    default: enable
  ttl:
    type: string
    raw_type: user
    description: 'Value/range to match against the packet''s Time to Live value (format: ttl[ - ttl_high], 1 - 255).'
children: {}
