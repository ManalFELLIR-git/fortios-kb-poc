id: firewall.multicast-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/258529109/config-firewall-multicast-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Accept or deny traffic matching the policy.
    default: accept
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading policy traffic for hardware acceleration.
    default: enable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dnat:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 DNAT address used for multicast destination addresses.
    default: 0.0.0.0
  dstaddr:
    type: string
    raw_type: string
    description: Destination address objects. Destination address objects.
    max_length: 79
  dstintf:
    type: string
    raw_type: string
    description: Destination interface name.
    max_length: 35
  end-port:
    type: integer
    raw_type: integer
    description: Integer value for ending TCP/UDP/SCTP destination port in range (1 - 65535, default = 1).
    default: '65535'
    min: 0
    max: 65535
  id:
    type: integer
    raw_type: integer
    description: Policy ID ((0 - 4294967294).
    default: '0'
    min: 0
    max: 4294967294
  ips-sensor:
    type: string
    raw_type: string
    description: Name of an existing IPS sensor.
    max_length: 47
  logtraffic:
    type: enum
    raw_type: option
    description: Enable or disable logging. Log all sessions or security profile sessions.
    default: utm
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 35
  protocol:
    type: integer
    raw_type: integer
    description: Integer value for the protocol type as defined by IANA (0 - 255, default = 0).
    default: '0'
    min: 0
    max: 255
  snat:
    type: enum
    raw_type: option
    description: Enable/disable substitution of the outgoing interface IP address for the original source IP address (called
      source NAT or SNAT).
    default: disable
  snat-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address to be used as the source address for NATed traffic.
    default: 0.0.0.0
  srcaddr:
    type: string
    raw_type: string
    description: Source address objects. Source address objects.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: Source interface name.
    max_length: 35
  start-port:
    type: integer
    raw_type: integer
    description: Integer value for starting TCP/UDP/SCTP destination port in range (1 - 65535, default = 1).
    default: '1'
    min: 0
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable this policy.
    default: enable
  traffic-shaper:
    type: string
    raw_type: string
    description: Traffic shaper to apply to traffic forwarded by the multicast policy.
    max_length: 35
  utm-status:
    type: enum
    raw_type: option
    description: Enable to add an IPS security profile to the policy.
    default: disable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
