id: casb.saas-application
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/834015638/config-casb-saas-application
attributes:
  casb-name:
    type: string
    raw_type: string
    description: SaaS application signature name.
    max_length: 79
  description:
    type: string
    raw_type: string
    description: SaaS application description.
    max_length: 63
  domains:
    type: string
    raw_type: string
    description: SaaS application domain list. Domain list separated by space.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: SaaS application name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: Enable/disable setting.
    default: enable
  type:
    type: enum
    raw_type: option
    description: SaaS application type.
    default: customized
  uuid:
    type: string
    raw_type: string
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    max_length: 36
children:
  input-attributes:
    attributes:
      default:
        type: enum
        raw_type: option
        description: CASB attribute default value.
        default: string
      description:
        type: string
        raw_type: string
        description: CASB attribute description.
        max_length: 63
      fallback-input:
        type: enum
        raw_type: option
        description: CASB attribute legacy input.
        default: disable
      name:
        type: string
        raw_type: string
        description: CASB attribute name.
        max_length: 79
      required:
        type: enum
        raw_type: option
        description: CASB input attribute required.
        default: enable
      type:
        type: enum
        raw_type: option
        description: CASB attribute format type.
        default: string
  output-attributes:
    attributes:
      description:
        type: string
        raw_type: string
        description: CASB attribute description.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: CASB attribute name.
        max_length: 79
      optional:
        type: enum
        raw_type: option
        description: CASB output attribute optional.
        default: disable
      type:
        type: enum
        raw_type: option
        description: CASB attribute format type.
        default: string
