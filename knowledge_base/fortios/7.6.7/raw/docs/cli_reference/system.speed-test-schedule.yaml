id: system.speed-test-schedule
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/559215371/config-system-speed-test-schedule
attributes:
  ctrl-port:
    type: integer
    raw_type: integer
    description: Port of the controller to get access token.
    default: '5200'
    min: 1
    max: 65535
  diffserv:
    type: string
    raw_type: user
    description: DSCP used for speed test.
  dynamic-server:
    type: enum
    raw_type: option
    description: Enable/disable dynamic server option.
    default: disable
  expected-inbandwidth-maximum:
    type: integer
    raw_type: integer
    description: Set the maximum inbandwidth threshold for applying speedtest results on shaping-profile.
    default: '0'
    min: 0
    max: 16776000
  expected-inbandwidth-minimum:
    type: integer
    raw_type: integer
    description: Set the minimum inbandwidth threshold for applying speedtest results on shaping-profile.
    default: '0'
    min: 0
    max: 16776000
  expected-outbandwidth-maximum:
    type: integer
    raw_type: integer
    description: Set the maximum outbandwidth threshold for applying speedtest results on shaping-profile.
    default: '0'
    min: 0
    max: 16776000
  expected-outbandwidth-minimum:
    type: integer
    raw_type: integer
    description: Set the minimum outbandwidth threshold for applying speedtest results on shaping-profile.
    default: '0'
    min: 0
    max: 16776000
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 35
  mode:
    type: enum
    raw_type: option
    description: Protocol Auto(default), TCP or UDP used for speed test.
    default: Auto
  retries:
    type: integer
    raw_type: integer
    description: Maximum number of times the FortiGate unit will attempt to contact the same server before considering the
      speed test has failed (1 - 10, default = 5).
    default: '5'
    min: 1
    max: 10
  retry-pause:
    type: integer
    raw_type: integer
    description: Number of seconds the FortiGate pauses between successive speed tests before trying a different server (60
      - 3600, default = 300).
    default: '300'
    min: 60
    max: 3600
  schedules:
    type: string
    raw_type: string
    description: Schedules for the interface. Name of a firewall recurring schedule.
    max_length: 31
  server-name:
    type: string
    raw_type: string
    description: Speed test server name in system.speed-test-server list or leave it as empty to choose default server "FTNT_Auto".
    max_length: 35
  server-port:
    type: integer
    raw_type: integer
    description: Port of the server to run speed test.
    default: '5201'
    min: 1
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable scheduled speed test.
    default: enable
  update-inbandwidth:
    type: enum
    raw_type: option
    description: Enable/disable bypassing interface's inbound bandwidth setting.
    default: disable
  update-inbandwidth-maximum:
    type: integer
    raw_type: integer
    description: Maximum downloading bandwidth (kbps) to be used in a speed test.
    default: '0'
    min: 0
    max: 16776000
  update-inbandwidth-minimum:
    type: integer
    raw_type: integer
    description: Minimum downloading bandwidth (kbps) to be considered effective.
    default: '0'
    min: 0
    max: 16776000
  update-interface-shaping:
    type: enum
    raw_type: option
    description: Enable/disable using the speedtest results as reference for interface shaping (overriding configured in/outbandwidth).
    default: disable
  update-outbandwidth:
    type: enum
    raw_type: option
    description: Enable/disable bypassing interface's outbound bandwidth setting.
    default: disable
  update-outbandwidth-maximum:
    type: integer
    raw_type: integer
    description: Maximum uploading bandwidth (kbps) to be used in a speed test.
    default: '0'
    min: 0
    max: 16776000
  update-outbandwidth-minimum:
    type: integer
    raw_type: integer
    description: Minimum uploading bandwidth (kbps) to be considered effective.
    default: '0'
    min: 0
    max: 16776000
  update-shaper:
    type: enum
    raw_type: option
    description: Set egress shaper based on the test result.
    default: disable
children: {}
