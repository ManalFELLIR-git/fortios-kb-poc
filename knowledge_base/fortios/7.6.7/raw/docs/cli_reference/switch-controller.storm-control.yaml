id: switch-controller.storm-control
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/206734840/config-switch-controller-storm-control
attributes:
  broadcast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop broadcast traffic.
    default: disable
  burst-size-level:
    type: integer
    raw_type: integer
    description: Increase level to handle bursty traffic (0 - 4, default = 0).
    default: '0'
    min: 0
    max: 4
  rate:
    type: integer
    raw_type: integer
    description: Rate in packets per second at which storm control drops excess traffic(0-10000000, default=500, drop-all=0).
    default: '500'
    min: 0
    max: 10000000
  unknown-multicast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop unknown multicast traffic.
    default: disable
  unknown-unicast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop unknown unicast traffic.
    default: disable
children: {}
