id: router.key-chain
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/137506479/config-router-key-chain
attributes:
  name:
    type: string
    raw_type: string
    description: Key-chain name.
    max_length: 35
children:
  key:
    attributes:
      accept-lifetime:
        type: string
        raw_type: user
        description: 'Lifetime of received authentication key (format: hh:mm:ss day month year).'
      algorithm:
        type: enum
        raw_type: option
        description: Cryptographic algorithm.
        default: md5
      id:
        type: string
        raw_type: string
        description: Key ID (0 - 2147483647).
        max_length: 10
      key-string:
        type: password
        raw_type: password
        description: Password for the key (maximum = 64 characters).
      send-lifetime:
        type: string
        raw_type: user
        description: 'Lifetime of sent authentication key (format: hh:mm:ss day month year).'
