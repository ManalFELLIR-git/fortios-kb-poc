id: system.smc-ntp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/262516878/config-system-smc-ntp
attributes:
  channel:
    type: integer
    raw_type: integer
    description: SMC NTP client will send NTP packets through this channel.
    default: '5'
    min: 1
    max: 65535
  ntpsync:
    type: enum
    raw_type: option
    description: Enable/disable setting the FortiGate SMC system time by synchronizing with an NTP server.
    default: disable
  syncinterval:
    type: integer
    raw_type: integer
    description: SMC NTP synchronization interval (1 - 65535 secs).
    default: '60'
    min: 1
    max: 65535
children:
  ntpserver:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: NTP server ID.
        default: '0'
        min: 0
        max: 4294967295
      server:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address of the NTP server.
        default: 0.0.0.0
