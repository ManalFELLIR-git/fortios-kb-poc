id: firewall.internet-service-append
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/278397869/config-firewall-internet-service-append
attributes:
  addr-mode:
    type: enum
    raw_type: option
    description: Address mode (IPv4 or IPv6).
    default: ipv4
  append-port:
    type: integer
    raw_type: integer
    description: Appending TCP/UDP/SCTP destination port (1 to 65535).
    default: '0'
    min: 0
    max: 65535
  match-port:
    type: integer
    raw_type: integer
    description: Matching TCP/UDP/SCTP destination port (0 to 65535, 0 means any port).
    default: '0'
    min: 0
    max: 65535
children: {}
