id: firewall.access-proxy-ssh-client-cert
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/290392971/config-firewall-access-proxy-ssh-client-cert
attributes:
  auth-ca:
    type: string
    raw_type: string
    description: Name of the SSH server public key authentication CA.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: SSH client certificate name.
    max_length: 79
  permit-agent-forwarding:
    type: enum
    raw_type: option
    description: Enable/disable appending permit-agent-forwarding certificate extension.
    default: enable
  permit-port-forwarding:
    type: enum
    raw_type: option
    description: Enable/disable appending permit-port-forwarding certificate extension.
    default: enable
  permit-pty:
    type: enum
    raw_type: option
    description: Enable/disable appending permit-pty certificate extension.
    default: enable
  permit-user-rc:
    type: enum
    raw_type: option
    description: Enable/disable appending permit-user-rc certificate extension.
    default: enable
  permit-x11-forwarding:
    type: enum
    raw_type: option
    description: Enable/disable appending permit-x11-forwarding certificate extension.
    default: enable
  source-address:
    type: enum
    raw_type: option
    description: Enable/disable appending source-address certificate critical option. This option ensure certificate only
      accepted from FortiGate source address.
    default: disable
children:
  cert-extension:
    attributes:
      critical:
        type: enum
        raw_type: option
        description: Critical option.
        default: 'no'
      data:
        type: string
        raw_type: string
        description: Data of certificate extension.
        max_length: 127
      name:
        type: string
        raw_type: string
        description: Name of certificate extension.
        max_length: 127
      type:
        type: enum
        raw_type: option
        description: Type of certificate extension.
        default: fixed
