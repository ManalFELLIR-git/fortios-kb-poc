id: switch-controller.snmp-trap-threshold
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/298089334/config-switch-controller-snmp-trap-threshold
attributes:
  trap-high-cpu-threshold:
    type: integer
    raw_type: integer
    description: CPU usage when trap is sent.
    default: '80'
    min: 0
    max: 4294967295
  trap-log-full-threshold:
    type: integer
    raw_type: integer
    description: Log disk usage when trap is sent.
    default: '90'
    min: 0
    max: 4294967295
  trap-low-memory-threshold:
    type: integer
    raw_type: integer
    description: Memory usage when trap is sent.
    default: '80'
    min: 0
    max: 4294967295
children: {}
