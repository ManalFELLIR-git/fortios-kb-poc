id: system.api-user
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/625450553/config-system-api-user
attributes:
  accprofile:
    type: string
    raw_type: string
    description: Admin user access profile.
    max_length: 35
  api-key:
    type: password-2
    raw_type: password-2
    description: Admin user password.
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  cors-allow-origin:
    type: string
    raw_type: string
    description: Value for Access-Control-Allow-Origin on API responses. Avoid using '*' if possible.
    max_length: 269
  name:
    type: string
    raw_type: string
    description: User name.
    max_length: 35
  peer-auth:
    type: enum
    raw_type: option
    description: Enable/disable peer authentication.
    default: disable
  peer-group:
    type: string
    raw_type: string
    description: Peer group name.
    max_length: 35
  schedule:
    type: string
    raw_type: string
    description: Schedule name.
    max_length: 35
  vdom:
    type: string
    raw_type: string
    description: Virtual domains. Virtual domain name.
    max_length: 79
children:
  trusthost:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      ipv4-trusthost:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: IPv4 trusted host address.
        default: 0.0.0.0 0.0.0.0
      ipv6-trusthost:
        type: ipv6-prefix
        raw_type: ipv6-prefix
        description: IPv6 trusted host address.
        default: ::/0
      type:
        type: enum
        raw_type: option
        description: Trusthost type.
        default: ipv4-trusthost
