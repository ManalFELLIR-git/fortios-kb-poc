id: system.speed-test-setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/705162583/config-system-speed-test-setting
attributes:
  latency-threshold:
    type: integer
    raw_type: integer
    description: Speed test latency threshold in milliseconds (0 - 2000, default = 60) for the Auto mode. If the latency exceeds
      this threshold, the speed test will use the UDP protocol; otherwise, it will use the TCP protocol.
    default: '60'
    min: 0
    max: 2000
  multiple-tcp-stream:
    type: integer
    raw_type: integer
    description: Number of parallel client streams (1 - 64, default = 4) for the TCP protocol to run during the speed test.
    default: '4'
    min: 1
    max: 64
children: {}
