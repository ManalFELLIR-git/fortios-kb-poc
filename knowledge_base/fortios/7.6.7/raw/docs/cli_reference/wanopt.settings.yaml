id: wanopt.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/321128567/config-wanopt-settings
attributes:
  auto-detect-algorithm:
    type: enum
    raw_type: option
    description: Auto detection algorithms used in tunnel negotiations.
    default: simple
  host-id:
    type: string
    raw_type: string
    description: Local host ID (must also be entered in the remote FortiGate's peer list).
    default: default-id
    max_length: 35
  tunnel-optimization:
    type: enum
    raw_type: option
    description: WANOpt tunnel optimization option.
    default: balanced **
  tunnel-ssl-algorithm:
    type: enum
    raw_type: option
    description: Relative strength of encryption algorithms accepted during tunnel negotiation.
    default: high
children: {}
