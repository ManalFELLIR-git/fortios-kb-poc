id: webfilter.urlfilter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/333203621/config-webfilter-urlfilter
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  include-subdomains:
    type: enum
    raw_type: option
    description: Enable/disable matching subdomains. Applies only to simple type (default = enable).
    default: enable
  ip-addr-block:
    type: enum
    raw_type: option
    description: Enable/disable blocking URLs when the hostname appears as an IP address.
    default: disable
  ip4-mapped-ip6:
    type: enum
    raw_type: option
    description: Enable/disable matching of IPv4 mapped IPv6 URLs.
    default: disable
  name:
    type: string
    raw_type: string
    description: Name of URL filter list.
    max_length: 63
  one-arm-ips-urlfilter:
    type: enum
    raw_type: option
    description: Enable/disable DNS resolver for one-arm IPS URL filter operation.
    default: disable
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for URL filter matches.
        default: exempt
      antiphish-action:
        type: enum
        raw_type: option
        description: Action to take for AntiPhishing matches.
        default: block
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      dns-address-family:
        type: enum
        raw_type: option
        description: Resolve IPv4 address, IPv6 address, or both from DNS server.
        default: ipv4
      exempt:
        type: enum
        raw_type: option
        description: If action is set to exempt, select the security profile operations that exempt URLs skip. Separate multiple
          options with a space.
        default: av web-content activex-java-cookie dlp fortiguard range-block antiphish all
      id:
        type: integer
        raw_type: integer
        description: Id.
        default: '0'
        min: 0
        max: 4294967295
      referrer-host:
        type: string
        raw_type: string
        description: Referrer host name.
        max_length: 255
      status:
        type: enum
        raw_type: option
        description: Enable/disable this URL filter.
        default: enable
      type:
        type: enum
        raw_type: option
        description: Filter type (simple, regex, or wildcard).
        default: simple
      url:
        type: string
        raw_type: string
        description: URL to be filtered.
        max_length: 511
      web-proxy-profile:
        type: string
        raw_type: string
        description: Web proxy profile.
        max_length: 63
