id: system.geneve
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/294673694/config-system-geneve
attributes:
  dstport:
    type: integer
    raw_type: integer
    description: GENEVE destination port (1 - 65535, default = 6081).
    default: '6081'
    min: 1
    max: 65535
  interface:
    type: string
    raw_type: string
    description: Outgoing interface for GENEVE encapsulated traffic.
    max_length: 15
  ip-version:
    type: enum
    raw_type: option
    description: IP version to use for the GENEVE interface and so for communication over the GENEVE. IPv4 or IPv6 unicast.
    default: ipv4-unicast
  name:
    type: string
    raw_type: string
    description: GENEVE device or interface name. Must be an unique interface name.
    max_length: 15
  remote-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address of the GENEVE interface on the device at the remote end of the GENEVE.
    default: 0.0.0.0
  remote-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 IP address of the GENEVE interface on the device at the remote end of the GENEVE.
    default: '::'
  type:
    type: enum
    raw_type: option
    description: GENEVE type.
    default: ethernet
  vni:
    type: integer
    raw_type: integer
    description: GENEVE network ID.
    default: '0'
    min: 0
    max: 16777215
children: {}
