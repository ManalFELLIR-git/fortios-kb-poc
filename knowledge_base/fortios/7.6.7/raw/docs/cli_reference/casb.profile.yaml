id: casb.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/211842648/config-casb-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: CASB profile name.
    max_length: 47
children:
  saas-application:
    attributes:
      domain-control:
        type: enum
        raw_type: option
        description: Enable/disable domain control.
        default: disable
      domain-control-domains:
        type: string
        raw_type: string
        description: CASB profile domain control domains. Domain control domain name.
        max_length: 79
      log:
        type: enum
        raw_type: option
        description: Enable/disable log settings.
        default: enable
      name:
        type: string
        raw_type: string
        description: CASB profile SaaS application name.
        max_length: 79
      safe-search:
        type: enum
        raw_type: option
        description: Enable/disable safe search.
        default: disable
      safe-search-control:
        type: string
        raw_type: string
        description: CASB profile safe search control. Safe search control name.
        max_length: 79
      status:
        type: enum
        raw_type: option
        description: Enable/disable setting.
        default: enable
      tenant-control:
        type: enum
        raw_type: option
        description: Enable/disable tenant control.
        default: disable
      tenant-control-tenants:
        type: string
        raw_type: string
        description: CASB profile tenant control tenants. Tenant control tenants name.
        max_length: 79
  access-rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: CASB access rule action.
        default: monitor
      bypass:
        type: enum
        raw_type: option
        description: CASB bypass options.
      name:
        type: string
        raw_type: string
        description: CASB access rule activity name.
        max_length: 79
  advanced-tenant-control:
    attributes:
      name:
        type: string
        raw_type: string
        description: CASB advanced tenant control name.
        max_length: 79
  custom-control:
    attributes:
      name:
        type: string
        raw_type: string
        description: CASB custom control user activity name.
        max_length: 79
