id: system.vdom-radius-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/140539091/config-system-vdom-radius-server
attributes:
  name:
    type: string
    raw_type: string
    description: Name of the VDOM that you are adding the RADIUS server to.
    max_length: 31
  radius-server-vdom:
    type: string
    raw_type: string
    description: Use this option to select another VDOM containing a VDOM RSSO RADIUS server to use for the current VDOM.
    max_length: 31
  status:
    type: enum
    raw_type: option
    description: Enable/disable the RSSO RADIUS server for this VDOM.
    default: disable
children: {}
