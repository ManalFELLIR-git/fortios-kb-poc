id: switch-controller.ip-source-guard-log
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/139954259/config-switch-controller-ip-source-guard-log
attributes:
  log-violations:
    type: enum
    raw_type: option
    description: Enable/Disable log violations for IP source guard logging.
    default: disable
  violation-timer:
    type: integer
    raw_type: integer
    description: IP source gurad log violation timer in seconds (0 - 1500, default = 0).
    default: '0'
    min: 0
    max: 1500
children: {}
