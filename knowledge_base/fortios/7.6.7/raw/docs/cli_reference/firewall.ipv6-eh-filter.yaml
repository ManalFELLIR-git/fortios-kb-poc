id: firewall.ipv6-eh-filter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/634841056/config-firewall-ipv6-eh-filter
attributes:
  auth:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with the Authentication header (default = disable).
    default: disable
  dest-opt:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with Destination Options headers (default = disable).
    default: disable
  fragment:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with the Fragment header (default = disable).
    default: disable
  hdopt-type:
    type: integer
    raw_type: integer
    description: Block specific Hop-by-Hop and/or Destination Option types (max. 7 types, each between 0 and 255).
    min: 0
    max: 255
  hop-opt:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with the Hop-by-Hop Options header (default = disable).
    default: disable
  no-next:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with the No Next header (default = disable).
    default: disable
  routing:
    type: enum
    raw_type: option
    description: Enable/disable blocking packets with Routing headers (default = enable).
    default: enable
  routing-type:
    type: integer
    raw_type: integer
    description: Block specific Routing header types (max. 7 types, each between 0 and 255, default = 0).
    default: '0'
    min: 0
    max: 255
children: {}
