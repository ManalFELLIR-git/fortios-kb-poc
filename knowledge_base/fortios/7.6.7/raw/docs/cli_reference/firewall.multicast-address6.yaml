id: firewall.multicast-address6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/228898164/config-firewall-multicast-address6
attributes:
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  ip6:
    type: ipv6-network
    raw_type: ipv6-network
    description: 'IPv6 address prefix (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx/xxx).'
    default: ::/0
  name:
    type: string
    raw_type: string
    description: IPv6 multicast address name.
    max_length: 79
children:
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
