id: firewall.service.category
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/108758363/config-firewall-service-category
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  name:
    type: string
    raw_type: string
    description: Service category name.
    max_length: 63
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
