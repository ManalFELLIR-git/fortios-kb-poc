id: firewall.internet-service-extension
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/776407203/config-firewall-internet-service-extension
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: Internet Service ID in the Internet Service database.
    default: '0'
    min: 0
    max: 4294967295
children:
  disable-entry:
    attributes:
      addr-mode:
        type: enum
        raw_type: option
        description: Address mode (IPv4 or IPv6).
        default: ipv4
      id:
        type: integer
        raw_type: integer
        description: Disable entry ID.
        default: '0'
        min: 0
        max: 4294967295
      protocol:
        type: integer
        raw_type: integer
        description: Integer value for the protocol type as defined by IANA (0 - 255).
        default: '0'
        min: 0
        max: 255
  ip-range:
    attributes:
      end-ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: End IPv4 address.
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: Disable entry range ID.
        default: '0'
        min: 0
        max: 4294967295
      start-ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Start IPv4 address.
        default: 0.0.0.0
  ip6-range:
    attributes:
      end-ip6:
        type: ipv6-address
        raw_type: ipv6-address
        description: End IPv6 address.
        default: '::'
      id:
        type: integer
        raw_type: integer
        description: Disable entry range ID.
        default: '0'
        min: 0
        max: 4294967295
      start-ip6:
        type: ipv6-address
        raw_type: ipv6-address
        description: Start IPv6 address.
        default: '::'
  port-range:
    attributes:
      end-port:
        type: integer
        raw_type: integer
        description: Integer value for ending TCP/UDP/SCTP destination port in range (0 to 65535).
        default: '65535'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Custom entry port range ID.
        default: '0'
        min: 0
        max: 4294967295
      start-port:
        type: integer
        raw_type: integer
        description: Integer value for starting TCP/UDP/SCTP destination port in range (0 to 65535).
        default: '1'
        min: 0
        max: 65535
  entry:
    attributes:
      addr-mode:
        type: enum
        raw_type: option
        description: Address mode (IPv4 or IPv6).
        default: ipv4
      dst:
        type: string
        raw_type: string
        description: Destination address or address group name. Select the destination address or address group object from
          available options.
        max_length: 79
      dst6:
        type: string
        raw_type: string
        description: Destination address6 or address6 group name. Select the destination address6 or address group object
          from available options.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: Entry ID(1-255).
        default: '0'
        min: 0
        max: 255
      protocol:
        type: integer
        raw_type: integer
        description: Integer value for the protocol type as defined by IANA (0 - 255).
        default: '0'
        min: 0
        max: 255
