id: web-proxy.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/217949951/config-web-proxy-global
attributes:
  always-learn-client-ip:
    type: enum
    raw_type: option
    description: Enable/disable learning the client's IP address from headers for every request.
    default: disable
  auth-sign-timeout:
    type: integer
    raw_type: integer
    description: Proxy auth query sign timeout in seconds (30 - 3600, default = 120).
    default: '120'
    min: 30
    max: 3600
  fast-policy-match:
    type: enum
    raw_type: option
    description: Enable/disable fast matching algorithm for explicit and transparent proxy policy.
    default: enable
  forward-proxy-auth:
    type: enum
    raw_type: option
    description: Enable/disable forwarding proxy authentication headers.
    default: disable
  forward-server-affinity-timeout:
    type: integer
    raw_type: integer
    description: Period of time before the source IP's traffic is no longer assigned to the forwarding server (6 - 60 min,
      default = 30).
    default: '30'
    min: 6
    max: 60
  http2-client-window-size:
    type: integer
    raw_type: integer
    description: HTTP/2 client initial window size in bytes (65535 - 2147483647, default = 1048576 (1MB)).
    default: '1048576'
    min: 65535
    max: 2147483647
  http2-server-window-size:
    type: integer
    raw_type: integer
    description: HTTP/2 server initial window size in bytes (65535 - 2147483647, default = 1048576 (1MB)).
    default: '1048576'
    min: 65535
    max: 2147483647
  ldap-user-cache:
    type: enum
    raw_type: option
    description: Enable/disable LDAP user cache for explicit and transparent proxy user.
    default: disable
  learn-client-ip:
    type: enum
    raw_type: option
    description: Enable/disable learning the client's IP address from headers.
    default: disable
  learn-client-ip-from-header:
    type: enum
    raw_type: option
    description: Learn client IP address from the specified headers.
  learn-client-ip-srcaddr:
    type: string
    raw_type: string
    description: Source address name (srcaddr or srcaddr6 must be set). Address name.
    max_length: 79
  learn-client-ip-srcaddr6:
    type: string
    raw_type: string
    description: IPv6 Source address name (srcaddr or srcaddr6 must be set). Address name.
    max_length: 79
  log-app-id:
    type: enum
    raw_type: option
    description: Enable/disable always log application type in traffic log.
    default: disable
  log-forward-server:
    type: enum
    raw_type: option
    description: Enable/disable forward server name logging in forward traffic log.
    default: disable
  log-policy-pending:
    type: enum
    raw_type: option
    description: Enable/disable logging sessions that are pending on policy matching.
    default: disable
  max-message-length:
    type: integer
    raw_type: integer
    description: Maximum length of HTTP message, not including body (16 - 256 Kbytes, default = 32).
    default: '32'
    min: 16
    max: 256
  max-request-length:
    type: integer
    raw_type: integer
    description: Maximum length of HTTP request line (2 - 64 Kbytes, default = 8).
    default: '8'
    min: 2
    max: 64
  max-waf-body-cache-length:
    type: integer
    raw_type: integer
    description: Maximum length of HTTP messages processed by Web Application Firewall (WAF) (1 - 1024 Kbytes, default = 1).
    default: '1'
    min: 1
    max: 1024
  policy-partial-match:
    type: enum
    raw_type: option
    description: Enable/disable policy partial matching.
    default: enable
  proxy-fqdn:
    type: string
    raw_type: string
    description: Fully Qualified Domain Name of the explicit web proxy (default = default.fqdn) that clients connect to.
    default: default.fqdn
    max_length: 255
  proxy-transparent-cert-inspection:
    type: enum
    raw_type: option
    description: Enable/disable transparent proxy certificate inspection.
    default: disable
  request-obs-fold:
    type: enum
    raw_type: option
    description: Action when HTTP/1.x request header contains obs-fold (default = keep).
    default: keep
  src-affinity-exempt-addr:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 source addresses to exempt proxy affinity.
  src-affinity-exempt-addr6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 source addresses to exempt proxy affinity.
  ssl-bypass-cache:
    type: enum
    raw_type: option
    description: Enable/disable SSL bypass cache.
    default: enable
  ssl-ca-cert:
    type: string
    raw_type: string
    description: SSL CA certificate for SSL interception.
    default: Fortinet_CA_SSL
    max_length: 35
  ssl-cert:
    type: string
    raw_type: string
    description: SSL certificate for SSL interception.
    default: Fortinet_Factory **
    max_length: 35
  strict-web-check:
    type: enum
    raw_type: option
    description: Enable/disable strict web checking to block web sites that send incorrect headers that don't conform to HTTP.
    default: disable
  webproxy-profile:
    type: string
    raw_type: string
    description: Name of the web proxy profile to apply when explicit proxy traffic is allowed by default and traffic is accepted
      that does not match an explicit proxy policy.
    max_length: 63
children: {}
