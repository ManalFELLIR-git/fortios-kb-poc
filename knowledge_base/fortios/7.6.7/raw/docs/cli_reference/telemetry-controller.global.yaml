id: telemetry-controller.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/213750078/config-telemetry-controller-global
attributes:
  auto-group-telemetry-addr:
    type: enum
    raw_type: option
    description: Enable/disable automatically adding the telemetry address to the default addrgrp TELEMETRY.
    default: enable
  region:
    type: enum
    raw_type: option
    description: Configure telemetry cloud region.
    default: global
  retry-interval:
    type: integer
    raw_type: integer
    description: Configure telemetry cloud retry interval (1 - 999, default = 60).
    default: '60'
    min: 1
    max: 999
  telemetry-ca-certificate:
    type: string
    raw_type: string
    description: Name of the CA certificate used to verify the telemetry agent certificate.
    max_length: 79
children: {}
