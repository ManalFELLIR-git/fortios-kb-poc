id: system.ipip-tunnel
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/665891747/config-system-ipip-tunnel
attributes:
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable tunnel ASIC offloading.
    default: enable
  interface:
    type: string
    raw_type: string
    description: Interface name that is associated with the incoming traffic from available options.
    max_length: 15
  local-gw:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 address for the local gateway.
    default: 0.0.0.0
  name:
    type: string
    raw_type: string
    description: IPIP Tunnel name.
    max_length: 15
  remote-gw:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address for the remote gateway.
    default: 0.0.0.0
  use-sdwan:
    type: enum
    raw_type: option
    description: Enable/disable use of SD-WAN to reach remote gateway.
    default: disable
children: {}
