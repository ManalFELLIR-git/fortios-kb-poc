id: wanopt.auth-group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/214298351/config-wanopt-auth-group
attributes:
  auth-method:
    type: enum
    raw_type: option
    description: Select certificate or pre-shared key authentication for this authentication group.
    default: cert
  cert:
    type: string
    raw_type: string
    description: Name of certificate to identify this peer.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Auth-group name.
    max_length: 35
  peer:
    type: string
    raw_type: string
    description: If peer-accept is set to one, select the name of one peer to add to this authentication group. The peer must
      have added with the wanopt peer command.
    max_length: 35
  peer-accept:
    type: enum
    raw_type: option
    description: Determine if this auth group accepts, any peer, a list of defined peers, or just one peer.
    default: any
  psk:
    type: password
    raw_type: password
    description: Pre-shared key used by the peers in this authentication group.
children: {}
