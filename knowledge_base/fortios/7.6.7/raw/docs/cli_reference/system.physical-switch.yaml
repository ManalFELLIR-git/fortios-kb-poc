id: system.physical-switch
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/121410846/config-system-physical-switch
attributes:
  age-enable:
    type: enum
    raw_type: option
    description: Enable/disable layer 2 age timer.
    default: disable
  age-val:
    type: integer
    raw_type: integer
    description: Layer 2 table age timer value.
    default: '3158067'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 15
children: {}
