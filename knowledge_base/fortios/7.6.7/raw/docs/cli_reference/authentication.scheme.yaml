id: authentication.scheme
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/241272880/config-authentication-scheme
attributes:
  cert-http-header:
    type: enum
    raw_type: option
    description: Enable/disable authentication with user certificate in Client-Cert HTTP header (default = disable).
    default: disable
  digest-algo:
    type: enum
    raw_type: option
    description: Digest Authentication Algorithms.
    default: md5 sha-256
  digest-rfc2069:
    type: enum
    raw_type: option
    description: Enable/disable support for the deprecated RFC2069 Digest Client (no cnonce field, default = disable).
    default: disable
  domain-controller:
    type: string
    raw_type: string
    description: Domain controller setting.
    max_length: 35
  external-idp:
    type: string
    raw_type: string
    description: External identity provider configuration.
    max_length: 35
  fsso-agent-for-ntlm:
    type: string
    raw_type: string
    description: FSSO agent to use for NTLM authentication.
    max_length: 35
  fsso-guest:
    type: enum
    raw_type: option
    description: Enable/disable user fsso-guest authentication (default = disable).
    default: disable
  group-attr-type:
    type: enum
    raw_type: option
    description: Group attribute type used to match SCIM groups (default = display-name).
    default: display-name
  kerberos-keytab:
    type: string
    raw_type: string
    description: Kerberos keytab setting.
    max_length: 35
  method:
    type: enum
    raw_type: option
    description: Authentication methods (default = basic).
  name:
    type: string
    raw_type: string
    description: Authentication scheme name.
    max_length: 35
  negotiate-ntlm:
    type: enum
    raw_type: option
    description: Enable/disable negotiate authentication for NTLM (default = disable).
    default: enable
  require-tfa:
    type: enum
    raw_type: option
    description: Enable/disable two-factor authentication (default = disable).
    default: disable
  saml-server:
    type: string
    raw_type: string
    description: SAML configuration.
    max_length: 35
  saml-timeout:
    type: integer
    raw_type: integer
    description: SAML authentication timeout in seconds.
    default: '120'
    min: 30
    max: 1200
  ssh-ca:
    type: string
    raw_type: string
    description: SSH CA name.
    max_length: 35
  user-cert:
    type: enum
    raw_type: option
    description: Enable/disable authentication with user certificate (default = disable).
    default: disable
  user-database:
    type: string
    raw_type: string
    description: Authentication server to contain user information; "local-user-db" (default) or "123" (for LDAP). Authentication
      server name.
    max_length: 79
children: {}
