id: vpn.ipsec.phase1
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/574570212/config-vpn-ipsec-phase1
attributes:
  acct-verify:
    type: enum
    raw_type: option
    description: Enable/disable verification of RADIUS accounting record.
    default: disable
  add-gw-route:
    type: enum
    raw_type: option
    description: Enable/disable automatically add a route to the remote gateway.
    default: disable
  add-route:
    type: enum
    raw_type: option
    description: Enable/disable control addition of a route to peer destination selector.
    default: disable
  addke1:
    type: enum
    raw_type: option
    description: ADDKE1 group.
  addke2:
    type: enum
    raw_type: option
    description: ADDKE2 group.
  addke3:
    type: enum
    raw_type: option
    description: ADDKE3 group.
  addke4:
    type: enum
    raw_type: option
    description: ADDKE4 group.
  addke5:
    type: enum
    raw_type: option
    description: ADDKE5 group.
  addke6:
    type: enum
    raw_type: option
    description: ADDKE6 group.
  addke7:
    type: enum
    raw_type: option
    description: ADDKE7 group.
  assign-ip:
    type: enum
    raw_type: option
    description: Enable/disable assignment of IP to IPsec interface via configuration method.
    default: enable
  assign-ip-from:
    type: enum
    raw_type: option
    description: Method by which the IP address will be assigned.
    default: range
  authmethod:
    type: enum
    raw_type: option
    description: Authentication method.
    default: psk
  authmethod-remote:
    type: enum
    raw_type: option
    description: Authentication method (remote side).
  authpasswd:
    type: password
    raw_type: password
    description: XAuth password (max 35 characters).
  authusr:
    type: string
    raw_type: string
    description: XAuth user name.
    max_length: 64
  authusrgrp:
    type: string
    raw_type: string
    description: Authentication user group.
    max_length: 35
  auto-negotiate:
    type: enum
    raw_type: option
    description: Enable/disable automatic initiation of IKE SA negotiation.
    default: enable
  auto-transport-threshold:
    type: integer
    raw_type: integer
    description: Timeout in seconds before falling back to next transport protocol.
    default: '15'
    min: 1
    max: 300
  azure-ad-autoconnect:
    type: enum
    raw_type: option
    description: Enable/disable Azure AD Auto-Connect for FortiClient.
    default: disable
  backup-gateway:
    type: string
    raw_type: string
    description: Instruct unity clients about the backup gateway address(es). Address of backup gateway.
    max_length: 79
  banner:
    type: string
    raw_type: var-string
    description: Message that unity client should display after connecting.
    max_length: 1024
  cert-id-validation:
    type: enum
    raw_type: option
    description: Enable/disable cross validation of peer ID and the identity in the peer's certificate as specified in RFC
      4945.
    default: enable
  cert-peer-username-strip:
    type: enum
    raw_type: option
    description: Enable/disable domain stripping on certificate identity.
    default: disable
  cert-peer-username-validation:
    type: enum
    raw_type: option
    description: Enable/disable cross validation of peer username and the identity in the peer's certificate.
    default: none
  cert-trust-store:
    type: enum
    raw_type: option
    description: CA certificate trust store.
    default: local
  certificate:
    type: string
    raw_type: string
    description: Names of up to 4 signed personal certificates. Certificate name.
    max_length: 79
  childless-ike:
    type: enum
    raw_type: option
    description: Enable/disable childless IKEv2 initiation (RFC 6023).
    default: disable
  client-auto-negotiate:
    type: enum
    raw_type: option
    description: Enable/disable allowing the VPN client to bring up the tunnel when there is no traffic.
    default: disable
  client-keep-alive:
    type: enum
    raw_type: option
    description: Enable/disable allowing the VPN client to keep the tunnel up when there is no traffic.
    default: disable
  client-resume:
    type: enum
    raw_type: option
    description: Enable/disable resumption of offline FortiClient sessions. When a FortiClient enabled laptop is closed or
      enters sleep/hibernate mode, enabling this feature allows FortiClient to keep the tunnel during this period, and allows
      users to immediately resume using the IPsec tunnel when the device wakes up.
    default: disable
  client-resume-interval:
    type: integer
    raw_type: integer
    description: Maximum time in seconds during which a VPN client may resume using a tunnel after a client PC has entered
      sleep mode or temporarily lost its network connection (120 - 172800, default = 7200).
    default: '7200'
    min: 120
    max: 172800
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  dev-id:
    type: string
    raw_type: string
    description: Device ID carried by the device ID notification.
    max_length: 63
  dev-id-notification:
    type: enum
    raw_type: option
    description: Enable/disable device ID notification.
    default: disable
  dhcp-ra-giaddr:
    type: ipv4-address
    raw_type: ipv4-address
    description: Relay agent gateway IP address to use in the giaddr field of DHCP requests.
    default: 0.0.0.0
  dhcp6-ra-linkaddr:
    type: ipv6-address
    raw_type: ipv6-address
    description: Relay agent IPv6 link address to use in DHCP6 requests.
    default: '::'
  dhgrp:
    type: enum
    raw_type: option
    description: DH group.
    default: '20'
  digital-signature-auth:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 Digital Signature Authentication (RFC 7427).
    default: disable
  distance:
    type: integer
    raw_type: integer
    description: Distance for routes added by IKE (1 - 255).
    default: '15'
    min: 1
    max: 255
  dns-mode:
    type: enum
    raw_type: option
    description: DNS server mode.
    default: manual
  dns-suffix-search:
    type: string
    raw_type: string
    description: One or more DNS domain name suffixes in quotes separated by spaces. DNS suffix.
    max_length: 79
  domain:
    type: string
    raw_type: string
    description: Instruct unity clients about the single default DNS domain.
    max_length: 63
  dpd:
    type: enum
    raw_type: option
    description: Dead Peer Detection mode.
    default: on-demand
  dpd-retrycount:
    type: integer
    raw_type: integer
    description: Number of DPD retry attempts.
    default: '3'
    min: 1
    max: 10
  dpd-retryinterval:
    type: string
    raw_type: user
    description: DPD retry interval.
  eap:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 EAP authentication.
    default: disable
  eap-cert-auth:
    type: enum
    raw_type: option
    description: Enable/disable peer certificate authentication in addition to EAP if peer is a FortiClient endpoint.
    default: disable
  eap-exclude-peergrp:
    type: string
    raw_type: string
    description: Peer group excluded from EAP authentication.
    max_length: 35
  eap-identity:
    type: enum
    raw_type: option
    description: IKEv2 EAP peer identity type.
    default: use-id-payload
  ems-sn-check:
    type: enum
    raw_type: option
    description: Enable/disable verification of EMS serial number.
    default: disable
  enforce-unique-id:
    type: enum
    raw_type: option
    description: Enable/disable peer ID uniqueness check.
    default: disable
  esn:
    type: enum
    raw_type: option
    description: Extended sequence number (ESN) negotiation.
    default: disable
  exchange-fgt-device-id:
    type: enum
    raw_type: option
    description: Enable/disable device identifier exchange with peer FortiGate units for use of VPN monitor data by FortiManager.
    default: disable
  fec-base:
    type: integer
    raw_type: integer
    description: Number of base Forward Error Correction packets (1 - 20).
    default: '10'
    min: 1
    max: 20
  fec-codec:
    type: enum
    raw_type: option
    description: Forward Error Correction encoding/decoding algorithm.
    default: rs
  fec-egress:
    type: enum
    raw_type: option
    description: Enable/disable Forward Error Correction for egress IPsec traffic.
    default: disable
  fec-health-check:
    type: string
    raw_type: string
    description: SD-WAN health check.
    max_length: 35
  fec-ingress:
    type: enum
    raw_type: option
    description: Enable/disable Forward Error Correction for ingress IPsec traffic.
    default: disable
  fec-mapping-profile:
    type: string
    raw_type: string
    description: Forward Error Correction (FEC) mapping profile.
    max_length: 35
  fec-receive-timeout:
    type: integer
    raw_type: integer
    description: Timeout in milliseconds before dropping Forward Error Correction packets (1 - 1000).
    default: '50'
    min: 1
    max: 1000
  fec-redundant:
    type: integer
    raw_type: integer
    description: Number of redundant Forward Error Correction packets (1 - 5 for reed-solomon, 1 for xor).
    default: '1'
    min: 1
    max: 5
  fec-send-timeout:
    type: integer
    raw_type: integer
    description: Timeout in milliseconds before sending Forward Error Correction packets (1 - 1000).
    default: '5'
    min: 1
    max: 1000
  fgsp-sync:
    type: enum
    raw_type: option
    description: Enable/disable IPsec syncing of tunnels for FGSP IPsec.
    default: disable
  fortinet-esp:
    type: enum
    raw_type: option
    description: Enable/disable Fortinet ESP encapsulation.
    default: disable
  fragmentation:
    type: enum
    raw_type: option
    description: Enable/disable fragment IKE message on re-transmission.
    default: enable
  fragmentation-mtu:
    type: integer
    raw_type: integer
    description: IKE fragmentation MTU (500 - 16000).
    default: '1200'
    min: 500
    max: 16000
  group-authentication:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 IDi group authentication.
    default: disable
  group-authentication-secret:
    type: password-3
    raw_type: password-3
    description: Password for IKEv2 ID group authentication. ASCII string or hexadecimal indicated by a leading 0x.
  ha-sync-esp-seqno:
    type: enum
    raw_type: option
    description: Enable/disable sequence number jump ahead for IPsec HA.
    default: enable
  idle-timeout:
    type: enum
    raw_type: option
    description: Enable/disable IPsec tunnel idle timeout.
    default: disable
  idle-timeoutinterval:
    type: integer
    raw_type: integer
    description: IPsec tunnel idle timeout in minutes (5 - 43200).
    default: '15'
    min: 5
    max: 43200
  ike-version:
    type: enum
    raw_type: option
    description: IKE protocol version.
    default: '1'
  inbound-dscp-copy:
    type: enum
    raw_type: option
    description: Enable/disable copy the dscp in the ESP header to the inner IP Header.
    default: disable
  include-local-lan:
    type: enum
    raw_type: option
    description: Enable/disable allow local LAN access on unity clients.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Local physical, aggregate, loopback, or VLAN outgoing interface.
    max_length: 35
  internal-domain-list:
    type: string
    raw_type: string
    description: One or more internal domain names in quotes separated by spaces. Domain name.
    max_length: 79
  ip-delay-interval:
    type: integer
    raw_type: integer
    description: IP address reuse delay interval in seconds (0 - 28800).
    default: '0'
    min: 0
    max: 28800
  ipv4-dns-server1:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 DNS server 1.
    default: 0.0.0.0
  ipv4-dns-server2:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 DNS server 2.
    default: 0.0.0.0
  ipv4-dns-server3:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 DNS server 3.
    default: 0.0.0.0
  ipv4-end-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: End of IPv4 range.
    default: 0.0.0.0
  ipv4-name:
    type: string
    raw_type: string
    description: IPv4 address name.
    max_length: 79
  ipv4-netmask:
    type: ipv4-netmask
    raw_type: ipv4-netmask
    description: IPv4 Netmask.
    default: 255.255.255.255
  ipv4-split-exclude:
    type: string
    raw_type: string
    description: IPv4 subnets that should not be sent over the IPsec tunnel.
    max_length: 79
  ipv4-split-include:
    type: string
    raw_type: string
    description: IPv4 split-include subnets.
    max_length: 79
  ipv4-start-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Start of IPv4 range.
    default: 0.0.0.0
  ipv4-wins-server1:
    type: ipv4-address
    raw_type: ipv4-address
    description: WINS server 1.
    default: 0.0.0.0
  ipv4-wins-server2:
    type: ipv4-address
    raw_type: ipv4-address
    description: WINS server 2.
    default: 0.0.0.0
  ipv6-auto-linklocal:
    type: enum
    raw_type: option
    description: Enable/disable auto generation of IPv6 link-local address using last 8 bytes of mode-cfg assigned IPv6 address.
    default: disable
  ipv6-dns-server1:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 DNS server 1.
    default: '::'
  ipv6-dns-server2:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 DNS server 2.
    default: '::'
  ipv6-dns-server3:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 DNS server 3.
    default: '::'
  ipv6-end-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: End of IPv6 range.
    default: '::'
  ipv6-name:
    type: string
    raw_type: string
    description: IPv6 address name.
    max_length: 79
  ipv6-prefix:
    type: integer
    raw_type: integer
    description: IPv6 prefix.
    default: '128'
    min: 1
    max: 128
  ipv6-split-exclude:
    type: string
    raw_type: string
    description: IPv6 subnets that should not be sent over the IPsec tunnel.
    max_length: 79
  ipv6-split-include:
    type: string
    raw_type: string
    description: IPv6 split-include subnets.
    max_length: 79
  ipv6-start-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: Start of IPv6 range.
    default: '::'
  keepalive:
    type: integer
    raw_type: integer
    description: NAT-T keep alive interval.
    default: '10'
    min: 5
    max: 900
  keylife:
    type: integer
    raw_type: integer
    description: Time to wait in seconds before phase 1 encryption key expires.
    default: '86400'
    min: 120
    max: 172800
  kms:
    type: string
    raw_type: string
    description: Key Management Services server.
    max_length: 35
  link-cost:
    type: integer
    raw_type: integer
    description: VPN tunnel underlay link cost.
    default: '0'
    min: 0
    max: 255
  local-gw:
    type: ipv4-address
    raw_type: ipv4-address
    description: Local VPN gateway.
    default: 0.0.0.0
  localid:
    type: string
    raw_type: string
    description: Local ID.
    max_length: 63
  localid-type:
    type: enum
    raw_type: option
    description: Local ID type.
    default: auto
  loopback-asymroute:
    type: enum
    raw_type: option
    description: Enable/disable asymmetric routing for IKE traffic on loopback interface.
    default: enable
  mesh-selector-type:
    type: enum
    raw_type: option
    description: Add selectors containing subsets of the configuration depending on traffic.
    default: disable
  mode:
    type: enum
    raw_type: option
    description: ID protection mode used to establish a secure channel.
    default: main
  mode-cfg:
    type: enum
    raw_type: option
    description: Enable/disable configuration method.
    default: disable
  mode-cfg-allow-client-selector:
    type: enum
    raw_type: option
    description: Enable/disable mode-cfg client to use custom phase2 selectors.
    default: disable
  name:
    type: string
    raw_type: string
    description: IPsec remote gateway name.
    max_length: 35
  nattraversal:
    type: enum
    raw_type: option
    description: Enable/disable NAT traversal.
    default: enable
  negotiate-timeout:
    type: integer
    raw_type: integer
    description: IKE SA negotiation timeout in seconds (1 - 300).
    default: '30'
    min: 1
    max: 300
  network-id:
    type: integer
    raw_type: integer
    description: VPN gateway network ID.
    default: '0'
    min: 0
    max: 255
  network-overlay:
    type: enum
    raw_type: option
    description: Enable/disable network overlays.
    default: disable
  npu-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading NPU.
    default: enable
  peer:
    type: string
    raw_type: string
    description: Accept this peer certificate.
    max_length: 35
  peergrp:
    type: string
    raw_type: string
    description: Accept this peer certificate group.
    max_length: 35
  peerid:
    type: string
    raw_type: string
    description: Accept this peer identity.
    max_length: 255
  peertype:
    type: enum
    raw_type: option
    description: Accept this peer type.
    default: peer
  ppk:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 Postquantum Preshared Key (PPK).
    default: disable
  ppk-identity:
    type: string
    raw_type: string
    description: IKEv2 Postquantum Preshared Key Identity.
    max_length: 35
  ppk-secret:
    type: password-3
    raw_type: password-3
    description: IKEv2 Postquantum Preshared Key (ASCII string or hexadecimal encoded with a leading 0x).
  priority:
    type: integer
    raw_type: integer
    description: Priority for routes added by IKE (1 - 65535).
    default: '1'
    min: 1
    max: 65535
  proposal:
    type: enum
    raw_type: option
    description: Phase1 proposal.
  psksecret:
    type: password-3
    raw_type: password-3
    description: Pre-shared secret for PSK authentication (ASCII string or hexadecimal encoded with a leading 0x).
  psksecret-remote:
    type: password-3
    raw_type: password-3
    description: Pre-shared secret for remote side PSK authentication (ASCII string or hexadecimal encoded with a leading
      0x).
  qkd:
    type: enum
    raw_type: option
    description: Enable/disable use of Quantum Key Distribution (QKD) server.
    default: disable
  qkd-hybrid:
    type: enum
    raw_type: option
    description: Enable/disable use of Quantum Key Distribution (QKD) hybrid keys.
    default: disable
  qkd-profile:
    type: string
    raw_type: string
    description: Quantum Key Distribution (QKD) server profile.
    max_length: 35
  reauth:
    type: enum
    raw_type: option
    description: Enable/disable re-authentication upon IKE SA lifetime expiration.
    default: disable
  rekey:
    type: enum
    raw_type: option
    description: Enable/disable phase1 rekey.
    default: enable
  remote-gw:
    type: ipv4-address
    raw_type: ipv4-address
    description: Remote VPN gateway.
    default: 0.0.0.0
  remote-gw-country:
    type: string
    raw_type: string
    description: IPv4 addresses associated to a specific country.
    max_length: 2
  remote-gw-end-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Last IPv4 address in the range.
    default: 0.0.0.0
  remote-gw-match:
    type: enum
    raw_type: option
    description: Set type of IPv4 remote gateway address matching.
    default: any
  remote-gw-start-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: First IPv4 address in the range.
    default: 0.0.0.0
  remote-gw-subnet:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: IPv4 address and subnet mask.
    default: 0.0.0.0 0.0.0.0
  remote-gw-ztna-tags:
    type: string
    raw_type: string
    description: IPv4 ZTNA posture tags. Address name.
    max_length: 79
  remote-gw6-country:
    type: string
    raw_type: string
    description: IPv6 addresses associated to a specific country.
    max_length: 2
  remote-gw6-end-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: Last IPv6 address in the range.
    default: '::'
  remote-gw6-match:
    type: enum
    raw_type: option
    description: Set type of IPv6 remote gateway address matching.
    default: any
  remote-gw6-start-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: First IPv6 address in the range.
    default: '::'
  remote-gw6-subnet:
    type: ipv6-network
    raw_type: ipv6-network
    description: IPv6 address and prefix.
    default: ::/0
  remotegw-ddns:
    type: string
    raw_type: string
    description: Domain name of remote gateway. For example, name.ddns.com.
    max_length: 63
  rsa-signature-format:
    type: enum
    raw_type: option
    description: Digital Signature Authentication RSA signature format.
    default: pkcs1
  rsa-signature-hash-override:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 RSA signature hash algorithm override.
    default: disable
  save-password:
    type: enum
    raw_type: option
    description: Enable/disable saving XAuth username and password on VPN clients.
    default: disable
  send-cert-chain:
    type: enum
    raw_type: option
    description: Enable/disable sending certificate chain.
    default: enable
  shared-idle-timeout:
    type: enum
    raw_type: option
    description: Enable/disable IPsec tunnel shared idle timeout.
    default: disable
  signature-hash-alg:
    type: enum
    raw_type: option
    description: Digital Signature Authentication hash algorithms.
    default: sha2-512
  split-include-service:
    type: string
    raw_type: string
    description: Split-include services.
    max_length: 79
  suite-b:
    type: enum
    raw_type: option
    description: Use Suite-B.
    default: disable
  transport:
    type: enum
    raw_type: option
    description: Set IKE transport protocol.
    default: auto
  type:
    type: enum
    raw_type: option
    description: Remote gateway type.
    default: static
  unity-support:
    type: enum
    raw_type: option
    description: Enable/disable support for Cisco UNITY Configuration Method extensions.
    default: enable
  usrgrp:
    type: string
    raw_type: string
    description: User group name for dialup peers.
    max_length: 35
  wizard-type:
    type: enum
    raw_type: option
    description: GUI VPN Wizard Type.
    default: custom
  xauthtype:
    type: enum
    raw_type: option
    description: XAuth type.
    default: disable
  ztna-cert-scim-authorization:
    type: enum
    raw_type: option
    description: Enable/disable SCIM authorization based on the ZTNA peer certificate identity.
    default: disable
children:
  ipv4-exclude-range:
    attributes:
      end-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: End of IPv4 exclusive range.
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      start-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Start of IPv4 exclusive range.
        default: 0.0.0.0
  ipv6-exclude-range:
    attributes:
      end-ip:
        type: ipv6-address
        raw_type: ipv6-address
        description: End of IPv6 exclusive range.
        default: '::'
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      start-ip:
        type: ipv6-address
        raw_type: ipv6-address
        description: Start of IPv6 exclusive range.
        default: '::'
