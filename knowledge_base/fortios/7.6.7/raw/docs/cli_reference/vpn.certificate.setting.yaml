id: vpn.certificate.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/211164210/config-vpn-certificate-setting
attributes:
  cert-expire-warning:
    type: integer
    raw_type: integer
    description: Number of days before a certificate expires to send a warning. Set to 0 to disable sending of the warning
      (0 - 100, default = 14).
    default: '14'
    min: 0
    max: 100
  certname-dsa1024:
    type: string
    raw_type: string
    description: 1024 bit DSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_DSA1024
    max_length: 35
  certname-dsa2048:
    type: string
    raw_type: string
    description: 2048 bit DSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_DSA2048
    max_length: 35
  certname-ecdsa256:
    type: string
    raw_type: string
    description: 256 bit ECDSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_ECDSA256
    max_length: 35
  certname-ecdsa384:
    type: string
    raw_type: string
    description: 384 bit ECDSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_ECDSA384
    max_length: 35
  certname-ecdsa521:
    type: string
    raw_type: string
    description: 521 bit ECDSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_ECDSA521
    max_length: 35
  certname-ed25519:
    type: string
    raw_type: string
    description: 253 bit EdDSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_ED25519
    max_length: 35
  certname-ed448:
    type: string
    raw_type: string
    description: 456 bit EdDSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_ED448
    max_length: 35
  certname-rsa1024:
    type: string
    raw_type: string
    description: 1024 bit RSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_RSA1024
    max_length: 35
  certname-rsa2048:
    type: string
    raw_type: string
    description: 2048 bit RSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_RSA2048
    max_length: 35
  certname-rsa4096:
    type: string
    raw_type: string
    description: 4096 bit RSA key certificate for re-signing server certificates for SSL inspection.
    default: Fortinet_SSL_RSA4096
    max_length: 35
  check-ca-cert:
    type: enum
    raw_type: option
    description: Enable/disable verification of the user certificate and pass authentication if any CA in the chain is trusted
      (default = enable).
    default: enable
  check-ca-chain:
    type: enum
    raw_type: option
    description: Enable/disable verification of the entire certificate chain and pass authentication only if the chain is
      complete and all of the CAs in the chain are trusted (default = disable).
    default: disable
  cmp-key-usage-checking:
    type: enum
    raw_type: option
    description: Enable/disable server certificate key usage checking in CMP mode (default = enable).
    default: enable
  cmp-save-extra-certs:
    type: enum
    raw_type: option
    description: Enable/disable saving extra certificates in CMP mode (default = disable).
    default: disable
  cn-allow-multi:
    type: enum
    raw_type: option
    description: When searching for a matching certificate, allow multiple CN fields in certificate subject name (default
      = enable).
    default: enable
  cn-match:
    type: enum
    raw_type: option
    description: When searching for a matching certificate, control how to do CN value matching with certificate subject name
      (default = substring).
    default: substring
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ocsp-default-server:
    type: string
    raw_type: string
    description: Default OCSP server.
    max_length: 35
  ocsp-option:
    type: enum
    raw_type: option
    description: Specify whether the OCSP URL is from certificate or configured OCSP server.
    default: server
  ocsp-status:
    type: enum
    raw_type: option
    description: Enable/disable receiving certificates using the OCSP.
    default: disable
  proxy:
    type: string
    raw_type: string
    description: Proxy server FQDN or IP for OCSP/CA queries during certificate verification.
    max_length: 127
  proxy-password:
    type: password
    raw_type: password
    description: Proxy server password.
  proxy-port:
    type: integer
    raw_type: integer
    description: Proxy server port (1 - 65535, default = 8080).
    default: '8080'
    min: 1
    max: 65535
  proxy-username:
    type: string
    raw_type: string
    description: Proxy server user name.
    max_length: 63
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for dynamic AIA and OCSP queries.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  strict-ocsp-check:
    type: enum
    raw_type: option
    description: Enable/disable strict mode OCSP checking.
    default: disable
  subject-match:
    type: enum
    raw_type: option
    description: When searching for a matching certificate, control how to do RDN value matching with certificate subject
      name (default = substring).
    default: substring
  subject-set:
    type: enum
    raw_type: option
    description: When searching for a matching certificate, control how to do RDN set matching with certificate subject name
      (default = subset).
    default: subset
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  crl-verification:
    attributes:
      chain-crl-absence:
        type: enum
        raw_type: option
        description: CRL verification option when CRL of any certificate in chain is absent (default = ignore).
        default: ignore
      expiry:
        type: enum
        raw_type: option
        description: CRL verification option when CRL is expired (default = ignore).
        default: ignore
      leaf-crl-absence:
        type: enum
        raw_type: option
        description: CRL verification option when leaf CRL is absent (default = ignore).
        default: ignore
