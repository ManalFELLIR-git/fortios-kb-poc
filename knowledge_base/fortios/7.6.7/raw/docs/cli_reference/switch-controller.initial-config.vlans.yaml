id: switch-controller.initial-config.vlans
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/905612511/config-switch-controller-initial-config-vlans
attributes:
  default-vlan:
    type: string
    raw_type: string
    description: Default VLAN (native) assigned to all switch ports upon discovery.
    default: _default
    max_length: 63
  nac:
    type: string
    raw_type: string
    description: VLAN for NAC onboarding devices.
    default: onboarding
    max_length: 63
  nac-segment:
    type: string
    raw_type: string
    description: VLAN for NAC segment primary interface.
    default: nac_segment
    max_length: 63
  optional-vlans:
    type: enum
    raw_type: option
    description: Auto-generate pre-configured VLANs upon switch discovery.
    default: enable
  quarantine:
    type: string
    raw_type: string
    description: VLAN for quarantined traffic.
    default: quarantine
    max_length: 63
  rspan:
    type: string
    raw_type: string
    description: VLAN for RSPAN/ERSPAN mirrored traffic.
    default: rspan
    max_length: 63
  video:
    type: string
    raw_type: string
    description: VLAN dedicated for video devices.
    default: video
    max_length: 63
  voice:
    type: string
    raw_type: string
    description: VLAN dedicated for voice devices.
    default: voice
    max_length: 63
children: {}
