id: firewall.internet-service-definition
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/103790963/config-firewall-internet-service-definition
attributes:
  id:
    type: integer
    raw_type: integer
    description: Internet Service application list ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
children:
  entry:
    attributes:
      category-id:
        type: integer
        raw_type: integer
        description: Internet Service category ID. Read-only.
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Internet Service name. Read-only.
        max_length: 63
      protocol:
        type: integer
        raw_type: integer
        description: Integer value for the protocol type as defined by IANA (0 - 255). Read-only.
        default: '0'
        min: 0
        max: 255
      seq-num:
        type: integer
        raw_type: integer
        description: Entry sequence number.
        default: '0'
        min: 0
        max: 4294967295
  port-range:
    attributes:
      end-port:
        type: integer
        raw_type: integer
        description: Ending TCP/UDP/SCTP destination port (1 to 65535). Read-only.
        default: '65535'
        min: 1
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Custom entry port range ID.
        default: '0'
        min: 0
        max: 4294967295
      start-port:
        type: integer
        raw_type: integer
        description: Starting TCP/UDP/SCTP destination port (1 to 65535). Read-only.
        default: '1'
        min: 1
        max: 65535
