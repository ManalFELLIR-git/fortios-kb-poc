id: voip.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/295094155/config-voip-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  feature-set:
    type: enum
    raw_type: option
    description: IPS or voipd (SIP-ALG) inspection feature set.
    default: voipd
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
children:
  msrp:
    attributes:
      log-violations:
        type: enum
        raw_type: option
        description: Enable/disable logging of MSRP violations.
        default: enable
      max-msg-size:
        type: integer
        raw_type: integer
        description: Maximum allowable MSRP message size (1-65535).
        default: '0'
        min: 0
        max: 65535
      max-msg-size-action:
        type: enum
        raw_type: option
        description: Action for violation of max-msg-size.
        default: pass
      status:
        type: enum
        raw_type: option
        description: Enable/disable MSRP.
        default: enable
  sccp:
    attributes:
      block-mcast:
        type: enum
        raw_type: option
        description: Enable/disable block multicast RTP connections.
        default: disable
      log-call-summary:
        type: enum
        raw_type: option
        description: Enable/disable log summary of SCCP calls.
        default: disable
      log-violations:
        type: enum
        raw_type: option
        description: Enable/disable logging of SCCP violations.
        default: disable
      max-calls:
        type: integer
        raw_type: integer
        description: Maximum calls per minute per SCCP client (max 65535).
        default: '0'
        min: 0
        max: 65535
      status:
        type: enum
        raw_type: option
        description: Enable/disable SCCP.
        default: enable
      verify-header:
        type: enum
        raw_type: option
        description: Enable/disable verify SCCP header content.
        default: disable
  sip:
    attributes:
      ack-rate:
        type: integer
        raw_type: integer
        description: ACK request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      ack-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      block-ack:
        type: enum
        raw_type: option
        description: Enable/disable block ACK requests.
        default: disable
      block-bye:
        type: enum
        raw_type: option
        description: Enable/disable block BYE requests.
        default: disable
      block-cancel:
        type: enum
        raw_type: option
        description: Enable/disable block CANCEL requests.
        default: disable
      block-geo-red-options:
        type: enum
        raw_type: option
        description: Enable/disable block OPTIONS requests, but OPTIONS requests still notify for redundancy.
        default: disable
      block-info:
        type: enum
        raw_type: option
        description: Enable/disable block INFO requests.
        default: disable
      block-invite:
        type: enum
        raw_type: option
        description: Enable/disable block INVITE requests.
        default: disable
      block-long-lines:
        type: enum
        raw_type: option
        description: Enable/disable block requests with headers exceeding max-line-length.
        default: enable
      block-message:
        type: enum
        raw_type: option
        description: Enable/disable block MESSAGE requests.
        default: disable
      block-notify:
        type: enum
        raw_type: option
        description: Enable/disable block NOTIFY requests.
        default: disable
      block-options:
        type: enum
        raw_type: option
        description: Enable/disable block OPTIONS requests and no OPTIONS as notifying message for redundancy either.
        default: disable
      block-prack:
        type: enum
        raw_type: option
        description: Enable/disable block prack requests.
        default: disable
      block-publish:
        type: enum
        raw_type: option
        description: Enable/disable block PUBLISH requests.
        default: disable
      block-refer:
        type: enum
        raw_type: option
        description: Enable/disable block REFER requests.
        default: disable
      block-register:
        type: enum
        raw_type: option
        description: Enable/disable block REGISTER requests.
        default: disable
      block-subscribe:
        type: enum
        raw_type: option
        description: Enable/disable block SUBSCRIBE requests.
        default: disable
      block-unknown:
        type: enum
        raw_type: option
        description: Block unrecognized SIP requests (enabled by default).
        default: enable
      block-update:
        type: enum
        raw_type: option
        description: Enable/disable block UPDATE requests.
        default: disable
      bye-rate:
        type: integer
        raw_type: integer
        description: BYE request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      bye-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      call-id-regex:
        type: string
        raw_type: var-string
        description: Validate PCRE regular expression for Call-Id header value.
        max_length: 511
      call-keepalive:
        type: integer
        raw_type: integer
        description: Continue tracking calls with no RTP for this many minutes.
        default: '0'
        min: 0
        max: 10080
      cancel-rate:
        type: integer
        raw_type: integer
        description: CANCEL request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      cancel-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      contact-fixup:
        type: enum
        raw_type: option
        description: Fixup contact anyway even if contact's IP:port doesn't match session's IP:port.
        default: enable
      content-type-regex:
        type: string
        raw_type: var-string
        description: Validate PCRE regular expression for Content-Type header value.
        max_length: 511
      hnt-restrict-source-ip:
        type: enum
        raw_type: option
        description: Enable/disable restrict RTP source IP to be the same as SIP source IP when HNT is enabled.
        default: disable
      hosted-nat-traversal:
        type: enum
        raw_type: option
        description: Hosted NAT Traversal (HNT).
        default: disable
      info-rate:
        type: integer
        raw_type: integer
        description: INFO request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      info-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      invite-rate:
        type: integer
        raw_type: integer
        description: INVITE request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      invite-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      ips-rtp:
        type: enum
        raw_type: option
        description: Enable/disable allow IPS on RTP.
        default: enable
      log-call-summary:
        type: enum
        raw_type: option
        description: Enable/disable logging of SIP call summary.
        default: enable
      log-violations:
        type: enum
        raw_type: option
        description: Enable/disable logging of SIP violations.
        default: disable
      malformed-header-allow:
        type: enum
        raw_type: option
        description: Action for malformed Allow header.
        default: pass
      malformed-header-call-id:
        type: enum
        raw_type: option
        description: Action for malformed Call-ID header.
        default: pass
      malformed-header-contact:
        type: enum
        raw_type: option
        description: Action for malformed Contact header.
        default: pass
      malformed-header-content-length:
        type: enum
        raw_type: option
        description: Action for malformed Content-Length header.
        default: pass
      malformed-header-content-type:
        type: enum
        raw_type: option
        description: Action for malformed Content-Type header.
        default: pass
      malformed-header-cseq:
        type: enum
        raw_type: option
        description: Action for malformed CSeq header.
        default: pass
      malformed-header-expires:
        type: enum
        raw_type: option
        description: Action for malformed Expires header.
        default: pass
      malformed-header-from:
        type: enum
        raw_type: option
        description: Action for malformed From header.
        default: pass
      malformed-header-max-forwards:
        type: enum
        raw_type: option
        description: Action for malformed Max-Forwards header.
        default: pass
      malformed-header-no-proxy-require:
        type: enum
        raw_type: option
        description: Action for malformed SIP messages without Proxy-Require header.
        default: pass
      malformed-header-no-require:
        type: enum
        raw_type: option
        description: Action for malformed SIP messages without Require header.
        default: pass
      malformed-header-p-asserted-identity:
        type: enum
        raw_type: option
        description: Action for malformed P-Asserted-Identity header.
        default: pass
      malformed-header-rack:
        type: enum
        raw_type: option
        description: Action for malformed RAck header.
        default: pass
      malformed-header-record-route:
        type: enum
        raw_type: option
        description: Action for malformed Record-Route header.
        default: pass
      malformed-header-route:
        type: enum
        raw_type: option
        description: Action for malformed Route header.
        default: pass
      malformed-header-rseq:
        type: enum
        raw_type: option
        description: Action for malformed RSeq header.
        default: pass
      malformed-header-sdp-a:
        type: enum
        raw_type: option
        description: Action for malformed SDP a line.
        default: pass
      malformed-header-sdp-b:
        type: enum
        raw_type: option
        description: Action for malformed SDP b line.
        default: pass
      malformed-header-sdp-c:
        type: enum
        raw_type: option
        description: Action for malformed SDP c line.
        default: pass
      malformed-header-sdp-i:
        type: enum
        raw_type: option
        description: Action for malformed SDP i line.
        default: pass
      malformed-header-sdp-k:
        type: enum
        raw_type: option
        description: Action for malformed SDP k line.
        default: pass
      malformed-header-sdp-m:
        type: enum
        raw_type: option
        description: Action for malformed SDP m line.
        default: pass
      malformed-header-sdp-o:
        type: enum
        raw_type: option
        description: Action for malformed SDP o line.
        default: pass
      malformed-header-sdp-r:
        type: enum
        raw_type: option
        description: Action for malformed SDP r line.
        default: pass
      malformed-header-sdp-s:
        type: enum
        raw_type: option
        description: Action for malformed SDP s line.
        default: pass
      malformed-header-sdp-t:
        type: enum
        raw_type: option
        description: Action for malformed SDP t line.
        default: pass
      malformed-header-sdp-v:
        type: enum
        raw_type: option
        description: Action for malformed SDP v line.
        default: pass
      malformed-header-sdp-z:
        type: enum
        raw_type: option
        description: Action for malformed SDP z line.
        default: pass
      malformed-header-to:
        type: enum
        raw_type: option
        description: Action for malformed To header.
        default: pass
      malformed-header-via:
        type: enum
        raw_type: option
        description: Action for malformed VIA header.
        default: pass
      malformed-request-line:
        type: enum
        raw_type: option
        description: Action for malformed request line.
        default: pass
      max-body-length:
        type: integer
        raw_type: integer
        description: Maximum SIP message body length (0 meaning no limit).
        default: '0'
        min: 0
        max: 4294967295
      max-dialogs:
        type: integer
        raw_type: integer
        description: Maximum number of concurrent calls/dialogs (per policy).
        default: '0'
        min: 0
        max: 4294967295
      max-idle-dialogs:
        type: integer
        raw_type: integer
        description: Maximum number established but idle dialogs to retain (per policy).
        default: '0'
        min: 0
        max: 4294967295
      max-line-length:
        type: integer
        raw_type: integer
        description: Maximum SIP header line length (78-4096).
        default: '998'
        min: 78
        max: 4096
      message-rate:
        type: integer
        raw_type: integer
        description: MESSAGE request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      message-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      nat-port-range:
        type: string
        raw_type: user
        description: RTP NAT port range.
        default: 5117-65533
      nat-trace:
        type: enum
        raw_type: option
        description: Enable/disable preservation of original IP in SDP i line.
        default: enable
      no-sdp-fixup:
        type: enum
        raw_type: option
        description: Enable/disable no SDP fix-up.
        default: disable
      notify-rate:
        type: integer
        raw_type: integer
        description: NOTIFY request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      notify-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      open-contact-pinhole:
        type: enum
        raw_type: option
        description: Enable/disable open pinhole for non-REGISTER Contact port.
        default: enable
      open-record-route-pinhole:
        type: enum
        raw_type: option
        description: Enable/disable open pinhole for Record-Route port.
        default: enable
      open-register-pinhole:
        type: enum
        raw_type: option
        description: Enable/disable open pinhole for REGISTER Contact port.
        default: enable
      open-via-pinhole:
        type: enum
        raw_type: option
        description: Enable/disable open pinhole for Via port.
        default: disable
      options-rate:
        type: integer
        raw_type: integer
        description: OPTIONS request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      options-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      prack-rate:
        type: integer
        raw_type: integer
        description: PRACK request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      prack-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      preserve-override:
        type: enum
        raw_type: option
        description: 'Override i line to preserve original IPs (default: append).'
        default: disable
      provisional-invite-expiry-time:
        type: integer
        raw_type: integer
        description: Expiry time (10-3600, in seconds) for provisional INVITE.
        default: '210'
        min: 10
        max: 3600
      publish-rate:
        type: integer
        raw_type: integer
        description: PUBLISH request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      publish-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      refer-rate:
        type: integer
        raw_type: integer
        description: REFER request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      refer-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      register-contact-trace:
        type: enum
        raw_type: option
        description: Enable/disable trace original IP/port within the contact header of REGISTER requests.
        default: disable
      register-rate:
        type: integer
        raw_type: integer
        description: REGISTER request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      register-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      rfc2543-branch:
        type: enum
        raw_type: option
        description: Enable/disable support via branch compliant with RFC 2543.
        default: disable
      rtp:
        type: enum
        raw_type: option
        description: Enable/disable create pinholes for RTP traffic to traverse firewall.
        default: enable
      ssl-algorithm:
        type: enum
        raw_type: option
        description: Relative strength of encryption algorithms accepted in negotiation.
        default: high
      ssl-auth-client:
        type: string
        raw_type: string
        description: Require a client certificate and authenticate it with the peer/peergrp.
        max_length: 35
      ssl-auth-server:
        type: string
        raw_type: string
        description: Authenticate the server's certificate with the peer/peergrp.
        max_length: 35
      ssl-client-certificate:
        type: string
        raw_type: string
        description: Name of Certificate to offer to server if requested.
        max_length: 35
      ssl-client-renegotiation:
        type: enum
        raw_type: option
        description: Allow/block client renegotiation by server.
        default: allow
      ssl-max-version:
        type: enum
        raw_type: option
        description: Highest SSL/TLS version to negotiate.
        default: tls-1.3
      ssl-min-version:
        type: enum
        raw_type: option
        description: Lowest SSL/TLS version to negotiate.
        default: tls-1.1
      ssl-mode:
        type: enum
        raw_type: option
        description: SSL/TLS mode for encryption & decryption of traffic.
        default: 'off'
      ssl-pfs:
        type: enum
        raw_type: option
        description: SSL Perfect Forward Secrecy.
        default: allow
      ssl-send-empty-frags:
        type: enum
        raw_type: option
        description: Send empty fragments to avoid attack on CBC IV (SSL 3.0 & TLS 1.0 only).
        default: enable
      ssl-server-certificate:
        type: string
        raw_type: string
        description: Name of Certificate return to the client in every SSL connection.
        max_length: 35
      status:
        type: enum
        raw_type: option
        description: Enable/disable SIP.
        default: enable
      strict-register:
        type: enum
        raw_type: option
        description: Enable/disable only allow the registrar to connect.
        default: enable
      subscribe-rate:
        type: integer
        raw_type: integer
        description: SUBSCRIBE request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      subscribe-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
      unknown-header:
        type: enum
        raw_type: option
        description: Action for unknown SIP header.
        default: pass
      update-rate:
        type: integer
        raw_type: integer
        description: UPDATE request rate limit (per second, per policy).
        default: '0'
        min: 0
        max: 4294967295
      update-rate-track:
        type: enum
        raw_type: option
        description: Track the packet protocol field.
        default: none
