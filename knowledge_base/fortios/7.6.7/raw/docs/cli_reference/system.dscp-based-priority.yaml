id: system.dscp-based-priority
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/259314700/config-system-dscp-based-priority
attributes:
  ds:
    type: integer
    raw_type: integer
    description: DSCP(DiffServ) DS value (0 - 63).
    default: '0'
    min: 0
    max: 63
  id:
    type: integer
    raw_type: integer
    description: Item ID.
    default: '0'
    min: 0
    max: 4294967295
  priority:
    type: enum
    raw_type: option
    description: DSCP based priority level.
    default: high
children: {}
