id: system.automation-action
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/332365236/config-system-automation-action
attributes:
  accprofile:
    type: string
    raw_type: string
    description: Access profile for CLI script action to access FortiGate features.
    max_length: 35
  action-type:
    type: enum
    raw_type: option
    description: Action type.
    default: alert
  alicloud-access-key-id:
    type: string
    raw_type: string
    description: AliCloud AccessKey ID.
    max_length: 35
  alicloud-access-key-secret:
    type: password
    raw_type: password
    description: AliCloud AccessKey secret.
  alicloud-function-authorization:
    type: enum
    raw_type: option
    description: AliCloud function authorization type.
    default: anonymous
  aws-api-key:
    type: password
    raw_type: password
    description: AWS API Gateway API key.
  azure-api-key:
    type: password
    raw_type: password
    description: Azure function API key.
  azure-function-authorization:
    type: enum
    raw_type: option
    description: Azure function authorization level.
    default: anonymous
  description:
    type: string
    raw_type: var-string
    description: Description.
    max_length: 255
  duration:
    type: integer
    raw_type: integer
    description: Maximum running time for this script in seconds.
    default: '5'
    min: 1
    max: 36000
  email-from:
    type: string
    raw_type: var-string
    description: Email sender name.
    max_length: 127
  email-subject:
    type: string
    raw_type: var-string
    description: Email subject.
    max_length: 511
  email-to:
    type: string
    raw_type: string
    description: Email addresses. Email address.
    max_length: 255
  execute-security-fabric:
    type: enum
    raw_type: option
    description: Enable/disable execution of CLI script on all or only one FortiGate unit in the Security Fabric.
    default: disable
  file-only:
    type: enum
    raw_type: option
    description: Enable/disable the output in files only.
    default: disable
  forticare-email:
    type: enum
    raw_type: option
    description: Enable/disable use of your FortiCare email address as the email-to address.
    default: disable
  http-body:
    type: string
    raw_type: var-string
    description: Request body (if necessary). Should be serialized json string.
    max_length: 4095
  log-debug-print:
    type: enum
    raw_type: option
    description: Enable/disable logging debug print output from diagnose action.
    default: disable
  message:
    type: string
    raw_type: string
    description: Message content.
    default: 'Time: %%log.date%% %%log.time%% Device: %%log.devid%% (%%log.vd%%) Level: %%log.level%% Event: %%log.logdesc%%
      Raw log: %%log%%'
    max_length: 4095
  message-type:
    type: enum
    raw_type: option
    description: Message type.
    default: text
  method:
    type: enum
    raw_type: option
    description: Request method (POST, PUT, GET, PATCH or DELETE).
    default: post
  minimum-interval:
    type: integer
    raw_type: integer
    description: Limit execution to no more than once in this interval (in seconds).
    default: '0'
    min: 0
    max: 2592000
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 64
  output-interval:
    type: integer
    raw_type: integer
    description: Collect the outputs for each output-interval in seconds (0 = no intermediate output).
    default: '0'
    min: 0
    max: 36000
  output-size:
    type: integer
    raw_type: integer
    description: Number of megabytes to limit script output to (1 - 1024, default = 10).
    default: '10'
    min: 1
    max: 1024
  port:
    type: integer
    raw_type: integer
    description: Protocol port.
    default: '0'
    min: 1
    max: 65535
  protocol:
    type: enum
    raw_type: option
    description: Request protocol.
    default: http
  regular-expression:
    type: string
    raw_type: var-string
    description: Regular expression string.
    max_length: 1023
  replacement-message:
    type: enum
    raw_type: option
    description: Enable/disable replacement message.
    default: disable
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group.
    max_length: 35
  script:
    type: string
    raw_type: var-string
    description: CLI script.
    max_length: 1023
  sdn-connector:
    type: string
    raw_type: string
    description: NSX SDN connector names. SDN connector name.
    max_length: 79
  security-tag:
    type: string
    raw_type: string
    description: NSX security tag.
    max_length: 255
  system-action:
    type: enum
    raw_type: option
    description: System action type.
  timeout:
    type: integer
    raw_type: integer
    description: Maximum running time for this script in seconds (0 = no timeout).
    default: '0'
    min: 0
    max: 300
  tls-certificate:
    type: string
    raw_type: string
    description: Custom TLS certificate for API request.
    max_length: 35
  uri:
    type: string
    raw_type: var-string
    description: Request API URI.
    max_length: 1023
  verify-host-cert:
    type: enum
    raw_type: option
    description: Enable/disable verification of the remote host certificate.
    default: enable
children:
  form-data:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
      key:
        type: string
        raw_type: var-string
        description: Key of the part of Multipart/form-data.
        max_length: 1023
      value:
        type: string
        raw_type: var-string
        description: Value of the part of Multipart/form-data.
        max_length: 4095
  http-headers:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
      key:
        type: string
        raw_type: var-string
        description: Request header key.
        max_length: 1023
      value:
        type: string
        raw_type: var-string
        description: Request header value.
        max_length: 4095
