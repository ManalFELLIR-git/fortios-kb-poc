id: wireless-controller.apcfg-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/160851855/config-wireless-controller-apcfg-profile
attributes:
  ac-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the validation controller that AP must be able to join after applying AP local configuration.
    default: 0.0.0.0
  ac-port:
    type: integer
    raw_type: integer
    description: Port of the validation controller that AP must be able to join after applying AP local configuration (1024
      - 49150, default = 5246).
    default: '5246'
    min: 1024
    max: 49150
  ac-timer:
    type: integer
    raw_type: integer
    description: Maximum waiting time for the AP to join the validation controller after applying AP local configuration (3
      - 30 min, default = 10).
    default: '10'
    min: 3
    max: 30
  ac-type:
    type: enum
    raw_type: option
    description: Validation controller type (default = default).
    default: default
  ap-family:
    type: enum
    raw_type: option
    description: FortiAP family type (default = fap).
    default: fap
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: AP local configuration profile name.
    max_length: 35
children:
  command-list:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Command ID.
        default: '0'
        min: 1
        max: 255
      name:
        type: string
        raw_type: string
        description: AP local configuration command name.
        max_length: 63
      passwd-value:
        type: password
        raw_type: password
        description: AP local configuration command password value.
      type:
        type: enum
        raw_type: option
        description: The command type (default = non-password).
        default: non-password
      value:
        type: string
        raw_type: string
        description: AP local configuration command value.
        max_length: 127
