id: vpn.kmip-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/170596778/config-vpn-kmip-server
attributes:
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  name:
    type: string
    raw_type: string
    description: KMIP server entry name.
    max_length: 35
  password:
    type: password
    raw_type: password
    description: Password to use for connectivity to the KMIP server.
  server-identity-check:
    type: enum
    raw_type: option
    description: Enable/disable KMIP server identity check (verify server FQDN/IP address against the server certificate).
    default: disable
  source-ip:
    type: string
    raw_type: string
    description: FortiGate IP address to be used for communication with the KMIP server.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  username:
    type: string
    raw_type: string
    description: User name to use for connectivity to the KMIP server.
    max_length: 63
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  server-list:
    attributes:
      cert:
        type: string
        raw_type: string
        description: Client certificate to use for connectivity to the KMIP server.
        max_length: 35
      id:
        type: integer
        raw_type: integer
        description: ID
        default: '0'
        min: 0
        max: 4294967295
      port:
        type: integer
        raw_type: integer
        description: KMIP server port.
        default: '5696'
        min: 0
        max: 65535
      server:
        type: string
        raw_type: string
        description: KMIP server FQDN or IP address.
        max_length: 63
      status:
        type: enum
        raw_type: option
        description: Enable/disable KMIP server.
        default: enable
