id: extension-controller.fortigate
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/287318706/config-extension-controller-fortigate
attributes:
  authorized:
    type: enum
    raw_type: option
    description: Enable/disable FortiGate administration.
    default: discovered
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 255
  device-id:
    type: integer
    raw_type: integer
    description: Device ID.
    default: '1026'
    min: 0
    max: 4294967295
  hostname:
    type: string
    raw_type: string
    description: FortiGate hostname.
    max_length: 31
  id:
    type: string
    raw_type: string
    description: FortiGate serial number.
    max_length: 19
  name:
    type: string
    raw_type: string
    description: FortiGate entry name.
    max_length: 19
  profile:
    type: string
    raw_type: string
    description: FortiGate profile configuration.
    max_length: 31
  vdom:
    type: integer
    raw_type: integer
    description: VDOM. Read-only.
    default: '0'
    min: 0
    max: 4294967295
children: {}
