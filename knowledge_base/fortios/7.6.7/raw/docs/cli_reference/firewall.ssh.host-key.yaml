id: firewall.ssh.host-key
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/261733268/config-firewall-ssh-host-key
attributes:
  hostname:
    type: string
    raw_type: string
    description: Hostname of the SSH server to match SSH certificate principals.
    max_length: 255
  ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IP address of the SSH server.
    default: 0.0.0.0
  name:
    type: string
    raw_type: string
    description: SSH public key name.
    max_length: 35
  nid:
    type: enum
    raw_type: option
    description: Set the nid of the ECDSA key.
    default: '256'
  port:
    type: integer
    raw_type: integer
    description: Port of the SSH server.
    default: '22'
    min: 0
    max: 4294967295
  public-key:
    type: string
    raw_type: var-string
    description: SSH public key.
    max_length: 32768
  status:
    type: enum
    raw_type: option
    description: Set the trust status of the public key.
    default: trusted
  type:
    type: enum
    raw_type: option
    description: Set the type of the public key.
    default: RSA
  usage:
    type: enum
    raw_type: option
    description: Usage for this public key.
    default: transparent-proxy
children: {}
