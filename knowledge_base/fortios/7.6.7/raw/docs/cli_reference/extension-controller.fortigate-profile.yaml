id: extension-controller.fortigate-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/181925749/config-extension-controller-fortigate-profile
attributes:
  extension:
    type: enum
    raw_type: option
    description: Extension option. Read-only.
    default: lan-extension
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '32'
    min: 0
    max: 102400000
  name:
    type: string
    raw_type: string
    description: FortiGate connector profile name.
    max_length: 31
children:
  lan-extension:
    attributes:
      backhaul-interface:
        type: string
        raw_type: string
        description: IPsec phase1 interface.
        max_length: 15
      backhaul-ip:
        type: string
        raw_type: string
        description: IPsec phase1 IPv4/FQDN. Used to specify the external IP/FQDN when the FortiGate unit is behind a NAT
          device.
        max_length: 63
      ipsec-tunnel:
        type: string
        raw_type: string
        description: IPsec tunnel name.
        max_length: 15
