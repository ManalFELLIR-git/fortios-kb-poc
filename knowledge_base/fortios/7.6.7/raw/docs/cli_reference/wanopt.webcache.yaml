id: wanopt.webcache
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/299019971/config-wanopt-webcache
attributes:
  always-revalidate:
    type: enum
    raw_type: option
    description: Enable/disable revalidation of requested cached objects, which have content on the server, before serving
      it to the client.
    default: disable
  cache-by-default:
    type: enum
    raw_type: option
    description: Enable/disable caching content that lacks explicit caching policies from the server.
    default: disable
  cache-cookie:
    type: enum
    raw_type: option
    description: Enable/disable caching cookies. Since cookies contain information for or about individual users, they not
      usually cached.
    default: disable
  cache-expired:
    type: enum
    raw_type: option
    description: Enable/disable caching type-1 objects that are already expired on arrival.
    default: disable
  default-ttl:
    type: integer
    raw_type: integer
    description: Default object expiry time (default = 1440 min (1 day); maximum = 5256000 min (10 years)). This only applies
      to those objects that do not have an expiry time set by the web server.
    default: '1440'
    min: 1
    max: 5256000
  external:
    type: enum
    raw_type: option
    description: Enable/disable external Web caching.
    default: disable
  fresh-factor:
    type: integer
    raw_type: integer
    description: Frequency that the server is checked to see if any objects have expired (1 - 100, default = 100). The higher
      the fresh factor, the less often the checks occur.
    default: '100'
    min: 1
    max: 100
  host-validate:
    type: enum
    raw_type: option
    description: Enable/disable validating "Host:" with original server IP.
    default: disable
  ignore-conditional:
    type: enum
    raw_type: option
    description: Enable/disable controlling the behavior of cache-control HTTP 1.1 header values.
    default: disable
  ignore-ie-reload:
    type: enum
    raw_type: option
    description: 'Enable/disable ignoring the PNC-interpretation of Internet Explorer''s Accept: / header.'
    default: enable
  ignore-ims:
    type: enum
    raw_type: option
    description: Enable/disable ignoring the if-modified-since (IMS) header.
    default: disable
  ignore-pnc:
    type: enum
    raw_type: option
    description: Enable/disable ignoring the pragma no-cache (PNC) header.
    default: disable
  max-object-size:
    type: integer
    raw_type: integer
    description: Maximum cacheable object size in kB (1 - 2147483 kb (2GB). All objects that exceed this are delivered to
      the client but not stored in the web cache.
    default: '512000'
    min: 1
    max: 2147483
  max-ttl:
    type: integer
    raw_type: integer
    description: Maximum time an object can stay in the web cache without checking to see if it has expired on the server
      (default = 7200 min (5 days); maximum = 5256000 min (10 years)).
    default: '7200'
    min: 1
    max: 5256000
  min-ttl:
    type: integer
    raw_type: integer
    description: Minimum time an object can stay in the web cache without checking to see if it has expired on the server
      (default = 5 min; maximum = 5256000 (10 years)).
    default: '5'
    min: 1
    max: 5256000
  neg-resp-time:
    type: integer
    raw_type: integer
    description: Time in minutes to cache negative responses or errors (0 - 4294967295, default = 0 which means negative responses
      are not cached).
    default: '0'
    min: 0
    max: 4294967295
  reval-pnc:
    type: enum
    raw_type: option
    description: Enable/disable revalidation of pragma-no-cache (PNC) to address bandwidth concerns.
    default: disable
children: {}
