id: log.eventfilter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/320373792/config-log-eventfilter
attributes:
  cifs:
    type: enum
    raw_type: option
    description: Enable/disable CIFS logging.
    default: enable
  connector:
    type: enum
    raw_type: option
    description: Enable/disable SDN connector logging.
    default: enable
  endpoint:
    type: enum
    raw_type: option
    description: Enable/disable endpoint event logging.
    default: enable
  event:
    type: enum
    raw_type: option
    description: Enable/disable event logging.
    default: enable
  fortiextender:
    type: enum
    raw_type: option
    description: Enable/disable FortiExtender logging.
    default: enable
  ha:
    type: enum
    raw_type: option
    description: Enable/disable ha event logging.
    default: enable
  rest-api:
    type: enum
    raw_type: option
    description: Enable/disable REST API logging.
    default: enable
  router:
    type: enum
    raw_type: option
    description: Enable/disable router event logging.
    default: enable
  sdwan:
    type: enum
    raw_type: option
    description: Enable/disable SD-WAN logging.
    default: enable
  security-rating:
    type: enum
    raw_type: option
    description: Enable/disable Security Rating result logging.
    default: enable
  switch-controller:
    type: enum
    raw_type: option
    description: Enable/disable Switch-Controller logging.
    default: enable
  system:
    type: enum
    raw_type: option
    description: Enable/disable system event logging.
    default: enable
  telemetry:
    type: enum
    raw_type: option
    description: Enable/disable telemetry event logging.
    default: enable
  user:
    type: enum
    raw_type: option
    description: Enable/disable user authentication event logging.
    default: enable
  vpn:
    type: enum
    raw_type: option
    description: Enable/disable VPN event logging.
    default: enable
  wan-opt:
    type: enum
    raw_type: option
    description: Enable/disable WAN optimization event logging.
    default: enable
  web-svc:
    type: enum
    raw_type: option
    description: Enable/disable web-svc performance logging.
    default: enable
  webproxy:
    type: enum
    raw_type: option
    description: Enable/disable web proxy event logging.
    default: enable
  wireless-activity:
    type: enum
    raw_type: option
    description: Enable/disable wireless event logging.
    default: enable
children: {}
