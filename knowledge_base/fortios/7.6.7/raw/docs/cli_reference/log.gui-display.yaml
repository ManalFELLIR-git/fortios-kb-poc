id: log.gui-display
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/779411444/config-log-gui-display
attributes:
  fortiview-unscanned-apps:
    type: enum
    raw_type: option
    description: Enable/disable showing unscanned traffic in FortiView application charts.
    default: disable
  resolve-apps:
    type: enum
    raw_type: option
    description: Resolve unknown applications on the GUI using Fortinet's remote application database.
    default: enable
  resolve-hosts:
    type: enum
    raw_type: option
    description: Enable/disable resolving IP addresses to hostname in log messages on the GUI using reverse DNS lookup.
    default: enable
children: {}
