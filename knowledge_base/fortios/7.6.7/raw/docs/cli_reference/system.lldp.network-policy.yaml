id: system.lldp.network-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/885987215/config-system-lldp-network-policy
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  name:
    type: string
    raw_type: string
    description: LLDP network policy name.
    max_length: 35
children:
  guest:
    attributes:
      dscp:
        type: integer
        raw_type: integer
        description: Differentiated Services Code Point (DSCP) value to advertise.
        default: '46'
        min: 0
        max: 63
      priority:
        type: integer
        raw_type: integer
        description: 802.1P CoS/PCP to advertise (0 - 7; from lowest to highest priority).
        default: '5'
        min: 0
        max: 7
      status:
        type: enum
        raw_type: option
        description: Enable/disable advertising this policy.
        default: disable
      tag:
        type: enum
        raw_type: option
        description: Advertise tagged or untagged traffic.
        default: none
      vlan:
        type: integer
        raw_type: integer
        description: 802.1Q VLAN ID to advertise (1 - 4094).
        default: '0'
        min: 1
        max: 4094
