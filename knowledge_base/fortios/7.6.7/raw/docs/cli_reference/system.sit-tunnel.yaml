id: system.sit-tunnel
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/297289002/config-system-sit-tunnel
attributes:
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable tunnel ASIC offloading.
    default: enable
  destination:
    type: ipv4-address
    raw_type: ipv4-address
    description: Destination IP address of the tunnel.
    default: 0.0.0.0
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  ip6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: IPv6 address of the tunnel.
    default: ::/0
  name:
    type: string
    raw_type: string
    description: Tunnel name.
    max_length: 15
  source:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address of the tunnel.
    default: 0.0.0.0
  use-sdwan:
    type: enum
    raw_type: option
    description: Enable/disable use of SD-WAN to reach remote gateway.
    default: disable
children: {}
