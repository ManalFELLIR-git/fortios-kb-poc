id: firewall.internet-service-addition
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/920640797/config-firewall-internet-service-addition
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: Internet Service ID in the Internet Service database.
    default: '0'
    min: 0
    max: 4294967295
children:
  entry:
    attributes:
      addr-mode:
        type: enum
        raw_type: option
        description: Address mode (IPv4 or IPv6).
        default: ipv4
      id:
        type: integer
        raw_type: integer
        description: Entry ID(1-255).
        default: '0'
        min: 0
        max: 255
      protocol:
        type: integer
        raw_type: integer
        description: Integer value for the protocol type as defined by IANA (0 - 255).
        default: '0'
        min: 0
        max: 255
  port-range:
    attributes:
      end-port:
        type: integer
        raw_type: integer
        description: Integer value for ending TCP/UDP/SCTP destination port in range (0 to 65535).
        default: '65535'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Custom entry port range ID.
        default: '0'
        min: 0
        max: 4294967295
      start-port:
        type: integer
        raw_type: integer
        description: Integer value for starting TCP/UDP/SCTP destination port in range (0 to 65535).
        default: '1'
        min: 0
        max: 65535
