id: wireless-controller.syslog-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/170474908/config-wireless-controller-syslog-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  log-level:
    type: enum
    raw_type: option
    description: Lowest level of log messages that FortiAP units send to this server (default = information).
    default: information
  name:
    type: string
    raw_type: string
    description: WTP system log server profile name.
    max_length: 35
  server:
    type: string
    raw_type: string
    description: Syslog server CN domain name or IP address.
    max_length: 63
  server-port:
    type: integer
    raw_type: integer
    description: Port number of syslog server that FortiAP units send log messages to (default = 514).
    default: '514'
    min: 0
    max: 65535
  server-status:
    type: enum
    raw_type: option
    description: Enable/disable FortiAP units to send log messages to a syslog server (default = enable).
    default: enable
  server-type:
    type: enum
    raw_type: option
    description: Configure syslog server type (default = standard).
    default: standard
children: {}
