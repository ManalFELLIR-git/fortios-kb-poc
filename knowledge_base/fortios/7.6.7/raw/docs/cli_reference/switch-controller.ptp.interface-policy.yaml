id: switch-controller.ptp.interface-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/316914254/config-switch-controller-ptp-interface-policy
attributes:
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 63
  vlan:
    type: string
    raw_type: string
    description: PTP VLAN.
    max_length: 15
  vlan-pri:
    type: integer
    raw_type: integer
    description: Configure PTP VLAN priority (0 - 7, default = 4).
    default: '4'
    min: 0
    max: 7
children: {}
