id: report.layout
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/249930383/config-report-layout
attributes:
  cutoff-option:
    type: enum
    raw_type: option
    description: Cutoff-option is either run-time or custom.
    default: run-time
  cutoff-time:
    type: string
    raw_type: user
    description: Custom cutoff time to generate report (format = hh:mm).
  day:
    type: enum
    raw_type: option
    description: Schedule days of week to generate report.
    default: sunday
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 127
  email-recipients:
    type: string
    raw_type: string
    description: Email recipients for generated reports.
    max_length: 511
  email-send:
    type: enum
    raw_type: option
    description: Enable/disable sending emails after reports are generated.
    default: disable
  format:
    type: enum
    raw_type: option
    description: Report format.
    default: pdf
  max-pdf-report:
    type: integer
    raw_type: integer
    description: Maximum number of PDF reports to keep at one time (oldest report is overwritten).
    default: '31'
    min: 1
    max: 365
  name:
    type: string
    raw_type: string
    description: Report layout name.
    max_length: 35
  options:
    type: enum
    raw_type: option
    description: Report layout options.
    default: include-table-of-content auto-numbering-heading view-chart-as-heading
  schedule-type:
    type: enum
    raw_type: option
    description: Report schedule type.
    default: daily
  style-theme:
    type: string
    raw_type: string
    description: Report style theme.
    max_length: 35
  subtitle:
    type: string
    raw_type: string
    description: Report subtitle.
    max_length: 127
  time:
    type: string
    raw_type: user
    description: Schedule time to generate report (format = hh:mm).
  title:
    type: string
    raw_type: string
    description: Report title.
    max_length: 127
children:
  body-item:
    attributes:
      chart:
        type: string
        raw_type: string
        description: Report item chart name.
        max_length: 71
      chart-options:
        type: enum
        raw_type: option
        description: Report chart options.
        default: include-no-data hide-title show-caption
      content:
        type: string
        raw_type: string
        description: Report item text content.
        max_length: 511
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      id:
        type: integer
        raw_type: integer
        description: Report item ID.
        default: '0'
        min: 0
        max: 4294967295
      img-src:
        type: string
        raw_type: string
        description: Report item image file name.
        max_length: 127
      misc-component:
        type: enum
        raw_type: option
        description: Report item miscellaneous component.
        default: hline
      style:
        type: string
        raw_type: string
        description: Report item style.
        max_length: 71
      text-component:
        type: enum
        raw_type: option
        description: Report item text component.
        default: text
      title:
        type: string
        raw_type: string
        description: Report section title.
        max_length: 511
      top-n:
        type: integer
        raw_type: integer
        description: Value of top.
        default: '0'
        min: 0
        max: 4294967295
      type:
        type: enum
        raw_type: option
        description: Report item type.
        default: text
  parameters:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Field name that match field of parameters defined in dataset.
        max_length: 127
      value:
        type: string
        raw_type: string
        description: Value to replace corresponding field of parameters defined in dataset.
        max_length: 1023
  page:
    attributes:
      column-break-before:
        type: enum
        raw_type: option
        description: Report page auto column break before heading.
      options:
        type: enum
        raw_type: option
        description: Report page options.
      page-break-before:
        type: enum
        raw_type: option
        description: Report page auto page break before heading.
      paper:
        type: enum
        raw_type: option
        description: Report page paper.
        default: a4
  footer:
    attributes:
      style:
        type: string
        raw_type: string
        description: Report footer style.
        max_length: 71
  footer-item:
    attributes:
      content:
        type: string
        raw_type: string
        description: Report item text content.
        max_length: 511
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      id:
        type: integer
        raw_type: integer
        description: Report item ID.
        default: '0'
        min: 0
        max: 4294967295
      img-src:
        type: string
        raw_type: string
        description: Report item image file name.
        max_length: 127
      style:
        type: string
        raw_type: string
        description: Report item style.
        max_length: 71
      type:
        type: enum
        raw_type: option
        description: Report item type.
        default: text
  header:
    attributes:
      style:
        type: string
        raw_type: string
        description: Report header style.
        max_length: 71
  header-item:
    attributes:
      content:
        type: string
        raw_type: string
        description: Report item text content.
        max_length: 511
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      id:
        type: integer
        raw_type: integer
        description: Report item ID.
        default: '0'
        min: 0
        max: 4294967295
      img-src:
        type: string
        raw_type: string
        description: Report item image file name.
        max_length: 127
      style:
        type: string
        raw_type: string
        description: Report item style.
        max_length: 71
      type:
        type: enum
        raw_type: option
        description: Report item type.
        default: text
