id: system.pppoe-interface
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/268798926/config-system-pppoe-interface
attributes:
  ac-name:
    type: string
    raw_type: string
    description: PPPoE AC name.
    max_length: 63
  auth-type:
    type: enum
    raw_type: option
    description: PPP authentication type to use.
    default: auto
  device:
    type: string
    raw_type: string
    description: Name for the physical interface.
    max_length: 15
  dial-on-demand:
    type: enum
    raw_type: option
    description: Enable/disable dial on demand to dial the PPPoE interface when packets are routed to the PPPoE interface.
    default: disable
  disc-retry-timeout:
    type: integer
    raw_type: integer
    description: PPPoE discovery init timeout value in (0-4294967295 sec).
    default: '1'
    min: 0
    max: 4294967295
  idle-timeout:
    type: integer
    raw_type: integer
    description: PPPoE auto disconnect after idle timeout (0-4294967295 sec).
    default: '0'
    min: 0
    max: 4294967295
  ipunnumbered:
    type: ipv4-address
    raw_type: ipv4-address
    description: PPPoE unnumbered IP.
    default: 0.0.0.0
  ipv6:
    type: enum
    raw_type: option
    description: Enable/disable IPv6 Control Protocol (IPv6CP).
    default: disable
  lcp-echo-interval:
    type: integer
    raw_type: integer
    description: Time in seconds between PPPoE Link Control Protocol (LCP) echo requests.
    default: '5'
    min: 0
    max: 32767
  lcp-max-echo-fails:
    type: integer
    raw_type: integer
    description: Maximum missed LCP echo messages before disconnect.
    default: '3'
    min: 0
    max: 32767
  mrru:
    type: integer
    raw_type: integer
    description: PPP MRRU (296 - 65535, default = 1500).
    default: '1500'
    min: 296
    max: 65535
  multilink:
    type: enum
    raw_type: option
    description: Enable/disable PPP multilink support.
    default: disable
  name:
    type: string
    raw_type: string
    description: Name of the PPPoE interface.
    max_length: 15
  padt-retry-timeout:
    type: integer
    raw_type: integer
    description: PPPoE terminate timeout value in (0-4294967295 sec).
    default: '1'
    min: 0
    max: 4294967295
  password:
    type: password
    raw_type: password
    description: Enter the password.
  pppoe-egress-cos:
    type: enum
    raw_type: option
    description: CoS in VLAN tag for outgoing PPPoE/PPP packets.
    default: cos0
  pppoe-unnumbered-negotiate:
    type: enum
    raw_type: option
    description: Enable/disable PPPoE unnumbered negotiation.
    default: enable
  service-name:
    type: string
    raw_type: string
    description: PPPoE service name.
    max_length: 63
  username:
    type: string
    raw_type: string
    description: User name.
    max_length: 64
children: {}
