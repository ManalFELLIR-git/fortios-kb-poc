id: system.auto-scale
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/336417547/config-system-auto-scale
attributes:
  callback-url:
    type: string
    raw_type: var-string
    description: Callback URL.
    max_length: 4095
  cloud-mode:
    type: string
    raw_type: string
    description: Auto-scaling cloud mode.
    max_length: 31
  hb-interval:
    type: integer
    raw_type: integer
    description: Time between sending heartbeat packets (5 - 120 seconds). Increase to reduce false positives.
    default: '10'
    min: 5
    max: 120
  primary-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Primary IP address.
    default: 0.0.0.0
  psksecret:
    type: password-3
    raw_type: password-3
    description: Pre-shared secret for auto-scaling authentication (ASCII string or hexadecimal encoded with a leading 0x).
  role:
    type: enum
    raw_type: option
    description: Auto-scaling role.
    default: secondary
  status:
    type: enum
    raw_type: option
    description: Auto-Scaling status.
    default: disable
  sync-interface:
    type: string
    raw_type: string
    description: Interface used for synchronization.
    max_length: 15
children: {}
