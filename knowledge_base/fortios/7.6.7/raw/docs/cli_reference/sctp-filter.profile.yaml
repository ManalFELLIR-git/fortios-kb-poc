id: sctp-filter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/772097183/config-sctp-filter-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
children:
  ppid-filters:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action taken when PPID is matched.
        default: reset
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      ppid:
        type: integer
        raw_type: integer
        description: Payload protocol identifier.
        min: 0
        max: 4294967295
