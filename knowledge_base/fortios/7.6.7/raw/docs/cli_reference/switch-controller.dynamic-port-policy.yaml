id: switch-controller.dynamic-port-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/691320696/config-switch-controller-dynamic-port-policy
attributes:
  description:
    type: string
    raw_type: string
    description: Description for the Dynamic port policy.
    max_length: 63
  fortilink:
    type: string
    raw_type: string
    description: FortiLink interface for which this Dynamic port policy belongs to.
    max_length: 15
  name:
    type: string
    raw_type: string
    description: Dynamic port policy name.
    max_length: 63
children:
  policy:
    attributes:
      802-1x:
        type: string
        raw_type: string
        description: 802.1x security policy to be applied when using this policy.
        max_length: 31
      bounce-port-duration:
        type: integer
        raw_type: integer
        description: Bounce duration in seconds of a switch port where this policy is applied.
        default: '5'
        min: 1
        max: 30
      bounce-port-link:
        type: enum
        raw_type: option
        description: Enable/disable bouncing (administratively bring the link down, up) of a switch port where this policy
          is applied. Helps to clear and reassign VLAN from lldp-profile.
        default: enable
      category:
        type: enum
        raw_type: option
        description: Category of Dynamic port policy.
        default: device
      description:
        type: string
        raw_type: string
        description: Description for the policy.
        max_length: 63
      family:
        type: string
        raw_type: string
        description: Match policy based on family.
        max_length: 31
      host:
        type: string
        raw_type: string
        description: Match policy based on host.
        max_length: 64
      hw-vendor:
        type: string
        raw_type: string
        description: Match policy based on hardware vendor.
        max_length: 15
      interface-tags:
        type: string
        raw_type: string
        description: Match policy based on the FortiSwitch interface object tags. FortiSwitch port tag name.
        max_length: 63
      lldp-profile:
        type: string
        raw_type: string
        description: LLDP profile to be applied when using this policy.
        max_length: 63
      mac:
        type: string
        raw_type: string
        description: Match policy based on MAC address.
        max_length: 17
      match-period:
        type: integer
        raw_type: integer
        description: Number of days the matched devices will be retained (0 - 120, 0 = always retain).
        default: '0'
        min: 0
        max: 120
      match-remove:
        type: enum
        raw_type: option
        description: Options to remove the matched override devices.
        default: default
      match-type:
        type: enum
        raw_type: option
        description: Match and retain the devices based on the type.
        default: dynamic
      name:
        type: string
        raw_type: string
        description: Policy name.
        max_length: 63
      poe-reset:
        type: enum
        raw_type: option
        description: Enable/disable POE reset of a switch port where this policy is applied.
        default: disable
      qos-policy:
        type: string
        raw_type: string
        description: QoS policy to be applied when using this policy.
        max_length: 63
      status:
        type: enum
        raw_type: option
        description: Enable/disable policy.
        default: enable
      type:
        type: string
        raw_type: string
        description: Match policy based on type.
        max_length: 15
      vlan-policy:
        type: string
        raw_type: string
        description: VLAN policy to be applied when using this policy.
        max_length: 63
