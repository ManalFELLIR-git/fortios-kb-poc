id: ztna.traffic-forward-proxy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/719493258/config-ztna-traffic-forward-proxy
attributes:
  auth-portal:
    type: enum
    raw_type: option
    description: Enable/disable authentication portal.
    default: disable
  auth-virtual-host:
    type: string
    raw_type: string
    description: Virtual host for authentication portal.
    max_length: 79
  decrypted-traffic-mirror:
    type: string
    raw_type: string
    description: Decrypted traffic mirror.
    max_length: 35
  host:
    type: string
    raw_type: string
    description: Virtual or real host name.
    max_length: 79
  log-blocked-traffic:
    type: enum
    raw_type: option
    description: Enable/disable logging of blocked traffic.
    default: enable
  name:
    type: string
    raw_type: string
    description: ZTNA proxy name.
    max_length: 79
  vip:
    type: string
    raw_type: string
    description: Virtual IP name.
    max_length: 79
  vip6:
    type: string
    raw_type: string
    description: Virtual IPv6 name.
    max_length: 79
children: {}
