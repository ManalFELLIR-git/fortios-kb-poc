id: system.ipv6-neighbor-cache
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/149392283/config-system-ipv6-neighbor-cache
attributes:
  id:
    type: integer
    raw_type: integer
    description: Unique integer ID of the entry.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: Select the associated interface name from available options.
    max_length: 15
  ipv6:
    type: ipv6-address
    raw_type: ipv6-address
    description: 'IPv6 address (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
    default: '::'
  mac:
    type: mac-address
    raw_type: mac-address
    description: 'MAC address (format: xx:xx:xx:xx:xx:xx).'
    default: 00:00:00:00:00:00
children: {}
