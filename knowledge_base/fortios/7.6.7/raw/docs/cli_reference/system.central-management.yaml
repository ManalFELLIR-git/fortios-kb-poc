id: system.central-management
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/327901742/config-system-central-management
attributes:
  allow-monitor:
    type: enum
    raw_type: option
    description: Enable/disable allowing the central management server to remotely monitor this FortiGate unit.
    default: enable
  allow-push-configuration:
    type: enum
    raw_type: option
    description: Enable/disable allowing the central management server to push configuration changes to this FortiGate.
    default: enable
  allow-push-firmware:
    type: enum
    raw_type: option
    description: Enable/disable allowing the central management server to push firmware updates to this FortiGate.
    default: enable
  allow-remote-firmware-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable remotely upgrading the firmware on this FortiGate from the central management server.
    default: enable
  allow-remote-lte-firmware-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable remotely upgrading the lte firmware on this FortiGate from the central management server.
    default: enable
  allow-remote-modem-firmware-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable remotely upgrading the internal cellular modem firmware on this FortiGate from the central
      management server.
    default: enable
  ca-cert:
    type: string
    raw_type: user
    description: CA certificate to be used by FGFM protocol.
  enc-algorithm:
    type: enum
    raw_type: option
    description: Encryption strength for communications between the FortiGate and central management.
    default: high
  fmg:
    type: string
    raw_type: user
    description: IP address or FQDN of the FortiManager.
  fmg-source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 source address that this FortiGate uses when communicating with FortiManager.
    default: 0.0.0.0
  fmg-source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 source address that this FortiGate uses when communicating with FortiManager.
    default: '::'
  fmg-update-http-header:
    type: enum
    raw_type: option
    description: Enable/disable inclusion of HTTP header in update request.
    default: disable
  fmg-update-port:
    type: enum
    raw_type: option
    description: Port used to communicate with FortiManager that is acting as a FortiGuard update server.
    default: '8890'
  fortigate-cloud-sso-default-profile:
    type: string
    raw_type: string
    description: Override access profile. Permission is set to read-only without a FortiGate Cloud Central Management license.
    max_length: 35
  include-default-servers:
    type: enum
    raw_type: option
    description: Enable/disable inclusion of public FortiGuard servers in the override server list.
    default: enable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  local-cert:
    type: string
    raw_type: string
    description: Certificate to be used by FGFM protocol.
    max_length: 35
  ltefw-upgrade-frequency:
    type: enum
    raw_type: option
    description: Set LTE firmware auto pushdown frequency.
  ltefw-upgrade-time:
    type: string
    raw_type: string
    description: 'Schedule next LTE firmware upgrade time (Local Time). Format: YYYY-MM-DD HH:MM:SS'
    max_length: 35
  mode:
    type: enum
    raw_type: option
    description: Central management mode.
    default: normal
  modem-upgrade-frequency:
    type: enum
    raw_type: option
    description: Set internal cellular modem firmware auto pushdown frequency.
  modem-upgrade-time:
    type: string
    raw_type: string
    description: 'Schedule next internal cellular modem firmware upgrade time (Local Time). Format: YYYY-MM-DD HH:MM:SS'
    max_length: 35
  schedule-config-restore:
    type: enum
    raw_type: option
    description: Enable/disable allowing the central management server to restore the configuration of this FortiGate.
    default: enable
  schedule-script-restore:
    type: enum
    raw_type: option
    description: Enable/disable allowing the central management server to restore the scripts stored on this FortiGate.
    default: enable
  serial-number:
    type: string
    raw_type: user
    description: Serial number.
  type:
    type: enum
    raw_type: option
    description: Central management type.
    default: none
  use-elbc-vdom:
    type: enum
    raw_type: option
    description: Enable/disable use of special ELBC config sync VDOM to connect to FortiManager.
    default: disable
  vdom:
    type: string
    raw_type: string
    description: Virtual domain (VDOM) name to use when communicating with FortiManager.
    default: root
    max_length: 31
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  server-list:
    attributes:
      addr-type:
        type: enum
        raw_type: option
        description: Indicate whether the FortiGate communicates with the override server using an IPv4 address, an IPv6 address
          or a FQDN.
        default: ipv4
      fqdn:
        type: string
        raw_type: string
        description: FQDN address of override server.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      server-address:
        type: ipv4-address
        raw_type: ipv4-address
        description: IPv4 address of override server.
        default: 0.0.0.0
      server-address6:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 address of override server.
        default: '::'
      server-type:
        type: enum
        raw_type: option
        description: FortiGuard service type.
