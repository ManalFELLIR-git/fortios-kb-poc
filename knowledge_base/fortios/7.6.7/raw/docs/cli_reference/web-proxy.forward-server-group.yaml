id: web-proxy.forward-server-group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/990957863/config-web-proxy-forward-server-group
attributes:
  affinity:
    type: enum
    raw_type: option
    description: Enable/disable affinity, attaching a source-ip's traffic to the assigned forwarding server until the forward-server-affinity-timeout
      is reached (under web-proxy global).
    default: enable
  group-down-option:
    type: enum
    raw_type: option
    description: 'Action to take when all of the servers in the forward server group are down: block sessions until at least
      one server is back up or pass sessions to their destination.'
    default: block
  ldb-method:
    type: enum
    raw_type: option
    description: 'Load balance method: weighted or least-session.'
    default: weighted
  name:
    type: string
    raw_type: string
    description: Configure a forward server group consisting one or multiple forward servers. Supports failover and load balancing.
    max_length: 63
children:
  server-list:
    attributes:
      name:
        type: string
        raw_type: string
        description: Forward server name.
        max_length: 63
      weight:
        type: integer
        raw_type: integer
        description: Optionally assign a weight of the forwarding server for weighted load balancing (1 - 100, default = 10).
        default: '10'
        min: 1
        max: 100
