id: system.dns-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/109980766/config-system-dns-server
attributes:
  dnsfilter-profile:
    type: string
    raw_type: string
    description: DNS filter profile.
    max_length: 47
  doh:
    type: enum
    raw_type: option
    description: Enable/disable DNS over HTTPS/443 (default = disable).
    default: disable
  doh3:
    type: enum
    raw_type: option
    description: Enable/disable DNS over QUIC/HTTP3/443 (default = disable).
    default: disable
  doq:
    type: enum
    raw_type: option
    description: Enable/disable DNS over QUIC/853 (default = disable).
    default: disable
  mode:
    type: enum
    raw_type: option
    description: DNS server mode.
    default: recursive
  name:
    type: string
    raw_type: string
    description: DNS server name.
    max_length: 15
children: {}
