id: system.automation-stitch
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/878454488/config-system-automation-stitch
attributes:
  condition:
    type: string
    raw_type: string
    description: Automation conditions. Condition name.
    max_length: 79
  condition-logic:
    type: enum
    raw_type: option
    description: Apply AND/OR logic to the specified automation conditions.
    default: and
  description:
    type: string
    raw_type: var-string
    description: Description.
    max_length: 255
  destination:
    type: string
    raw_type: string
    description: Serial number/HA group-name of destination devices. Destination name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable this stitch.
    default: enable
  trigger:
    type: string
    raw_type: string
    description: Trigger name.
    max_length: 35
children:
  actions:
    attributes:
      action:
        type: string
        raw_type: string
        description: Action name.
        max_length: 64
      delay:
        type: integer
        raw_type: integer
        description: Delay before execution (in seconds).
        default: '0'
        min: 0
        max: 3600
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
      required:
        type: enum
        raw_type: option
        description: Required in action chain.
        default: disable
