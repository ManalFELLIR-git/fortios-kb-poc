id: user.radius
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/164332072/config-user-radius
attributes:
  account-key-cert-field:
    type: enum
    raw_type: option
    description: Define subject identity field in certificate for user access right checking.
    default: othername
  account-key-processing:
    type: enum
    raw_type: option
    description: Account key processing operation. The FortiGate will keep either the whole domain or strip the domain from
      the subject identity.
    default: same
  acct-all-servers:
    type: enum
    raw_type: option
    description: Enable/disable sending of accounting messages to all configured servers (default = disable).
    default: disable
  acct-interim-interval:
    type: integer
    raw_type: integer
    description: Time in seconds between each accounting interim update message.
    default: '0'
    min: 60
    max: 86400
  all-usergroup:
    type: enum
    raw_type: option
    description: Enable/disable automatically including this RADIUS server in all user groups.
    default: disable
  auth-type:
    type: enum
    raw_type: option
    description: Authentication methods/protocols permitted for this RADIUS server.
    default: auto
  ca-cert:
    type: string
    raw_type: string
    description: CA of server to trust under TLS.
    max_length: 79
  call-station-id-type:
    type: enum
    raw_type: option
    description: Calling & Called station identifier type configuration (default = legacy), this option is not available for
      802.1x authentication.
    default: legacy
  class:
    type: string
    raw_type: string
    description: Class attribute name(s). Class name.
    max_length: 79
  client-cert:
    type: string
    raw_type: string
    description: Client certificate to use under TLS.
    max_length: 35
  delimiter:
    type: enum
    raw_type: option
    description: Configure delimiter to be used for separating profile group names in the SSO attribute (default = plus character
      "+").
    default: plus
  group-override-attr-type:
    type: enum
    raw_type: option
    description: RADIUS attribute type to override user group information.
  h3c-compatibility:
    type: enum
    raw_type: option
    description: Enable/disable compatibility with the H3C, a mechanism that performs security checking for authentication.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  mac-case:
    type: enum
    raw_type: option
    description: MAC authentication case (default = lowercase).
    default: lowercase
  mac-password-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication password delimiter (default = hyphen).
    default: hyphen
  mac-username-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication username delimiter (default = hyphen).
    default: hyphen
  name:
    type: string
    raw_type: string
    description: RADIUS server entry name.
    max_length: 35
  nas-id:
    type: string
    raw_type: string
    description: Custom NAS identifier.
    max_length: 255
  nas-id-type:
    type: enum
    raw_type: option
    description: NAS identifier type configuration (default = legacy).
    default: legacy
  nas-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address used to communicate with the RADIUS server and used as NAS-IP-Address and Called-Station-ID attributes.
    default: 0.0.0.0
  password-encoding:
    type: enum
    raw_type: option
    description: Password encoding.
    default: auto
  password-renewal:
    type: enum
    raw_type: option
    description: Enable/disable password renewal.
    default: enable
  radius-coa:
    type: enum
    raw_type: option
    description: Enable to allow a mechanism to change the attributes of an authentication, authorization, and accounting
      session after it is authenticated.
    default: disable
  radius-port:
    type: integer
    raw_type: integer
    description: RADIUS service port number.
    default: '0'
    min: 0
    max: 65535
  require-message-authenticator:
    type: enum
    raw_type: option
    description: Require message authenticator in authentication response.
    default: enable
  rsso:
    type: enum
    raw_type: option
    description: Enable/disable RADIUS based single sign on feature.
    default: disable
  rsso-context-timeout:
    type: integer
    raw_type: integer
    description: Time in seconds before the logged out user is removed from the "user context list" of logged on users.
    default: '28800'
    min: 0
    max: 4294967295
  rsso-endpoint-attribute:
    type: enum
    raw_type: option
    description: RADIUS attributes used to extract the user end point identifier from the RADIUS Start record.
    default: Calling-Station-Id
  rsso-endpoint-block-attribute:
    type: enum
    raw_type: option
    description: RADIUS attributes used to block a user.
  rsso-ep-one-ip-only:
    type: enum
    raw_type: option
    description: Enable/disable the replacement of old IP addresses with new ones for the same endpoint on RADIUS accounting
      Start messages.
    default: disable
  rsso-flush-ip-session:
    type: enum
    raw_type: option
    description: Enable/disable flushing user IP sessions on RADIUS accounting Stop messages.
    default: disable
  rsso-log-flags:
    type: enum
    raw_type: option
    description: Events to log.
    default: protocol-error profile-missing accounting-stop-missed accounting-event endpoint-block radiusd-other
  rsso-log-period:
    type: integer
    raw_type: integer
    description: Time interval in seconds that group event log messages will be generated for dynamic profile events.
    default: '0'
    min: 0
    max: 4294967295
  rsso-radius-response:
    type: enum
    raw_type: option
    description: Enable/disable sending RADIUS response packets after receiving Start and Stop records.
    default: disable
  rsso-radius-server-port:
    type: integer
    raw_type: integer
    description: UDP port to listen on for RADIUS Start and Stop records.
    default: '1813'
    min: 0
    max: 65535
  rsso-secret:
    type: password
    raw_type: password
    description: RADIUS secret used by the RADIUS accounting server.
  rsso-validate-request-secret:
    type: enum
    raw_type: option
    description: Enable/disable validating the RADIUS request shared secret in the Start or End record.
    default: disable
  secondary-secret:
    type: password
    raw_type: password
    description: Secret key to access the secondary server.
  secondary-server:
    type: string
    raw_type: string
    description: Secondary RADIUS CN domain name or IP address.
    max_length: 63
  secret:
    type: password
    raw_type: password
    description: Pre-shared secret key used to access the primary RADIUS server.
  server:
    type: string
    raw_type: string
    description: Primary RADIUS server CN domain name or IP address.
    max_length: 63
  server-identity-check:
    type: enum
    raw_type: option
    description: Enable/disable RADIUS server identity check (verify server domain name/IP address against the server certificate).
    default: enable
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for communications to the RADIUS server.
    max_length: 63
  source-ip-interface:
    type: string
    raw_type: string
    description: Source interface for communication with the RADIUS server.
    max_length: 15
  sso-attribute:
    type: enum
    raw_type: option
    description: RADIUS attribute that contains the profile group name to be extracted from the RADIUS Start record.
    default: Class
  sso-attribute-key:
    type: string
    raw_type: string
    description: Key prefix for SSO group value in the SSO attribute.
    max_length: 35
  sso-attribute-value-override:
    type: enum
    raw_type: option
    description: Enable/disable override old attribute value with new value for the same endpoint.
    default: enable
  status-ttl:
    type: integer
    raw_type: integer
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled, default = 300).
    default: '300'
    min: 0
    max: 600
  switch-controller-acct-fast-framedip-detect:
    type: integer
    raw_type: integer
    description: Switch controller accounting message Framed-IP detection from DHCP snooping (seconds, default=2).
    default: '2'
    min: 2
    max: 600
  switch-controller-nas-ip-dynamic:
    type: enum
    raw_type: option
    description: Enable/Disable switch-controller nas-ip dynamic to dynamically set nas-ip.
    default: disable
  switch-controller-service-type:
    type: enum
    raw_type: option
    description: RADIUS service type.
  tertiary-secret:
    type: password
    raw_type: password
    description: Secret key to access the tertiary server.
  tertiary-server:
    type: string
    raw_type: string
    description: Tertiary RADIUS CN domain name or IP address.
    max_length: 63
  timeout:
    type: integer
    raw_type: integer
    description: Time in seconds to retry connecting server.
    default: '5'
    min: 1
    max: 300
  tls-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for TLS connections (default is to follow system global setting).
    default: default
  transport-protocol:
    type: enum
    raw_type: option
    description: Transport protocol to be used (default = udp).
    default: udp
  use-management-vdom:
    type: enum
    raw_type: option
    description: Enable/disable using management VDOM to send requests.
    default: disable
  username-case-sensitive:
    type: enum
    raw_type: option
    description: Enable/disable case sensitive user names.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  accounting-server:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID (0 - 4294967295).
        default: '0'
        min: 0
        max: 4294967295
      interface:
        type: string
        raw_type: string
        description: Specify outgoing interface to reach server.
        max_length: 15
      interface-select-method:
        type: enum
        raw_type: option
        description: Specify how to select outgoing interface to reach server.
        default: auto
      port:
        type: integer
        raw_type: integer
        description: RADIUS accounting port number.
        default: '0'
        min: 0
        max: 65535
      secret:
        type: password
        raw_type: password
        description: Secret key.
      server:
        type: string
        raw_type: string
        description: Server CN domain name or IP address.
        max_length: 63
      source-ip:
        type: string
        raw_type: string
        description: Source IP address for communications to the RADIUS server.
        max_length: 63
      status:
        type: enum
        raw_type: option
        description: Status.
        default: disable
      vrf-select:
        type: integer
        raw_type: integer
        description: VRF ID used for connection to server.
        default: '0'
        min: 0
        max: 511
