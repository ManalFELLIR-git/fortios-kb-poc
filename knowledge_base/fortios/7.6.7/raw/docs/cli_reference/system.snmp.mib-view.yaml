id: system.snmp.mib-view
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/121038485/config-system-snmp-mib-view
attributes:
  exclude:
    type: string
    raw_type: string
    description: OID subtrees to be excluded in the view. Maximum 64 allowed.
    max_length: 79
  include:
    type: string
    raw_type: string
    description: OID subtrees to be included in the view. Maximum 16 allowed.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: MIB view name.
    max_length: 32
children: {}
