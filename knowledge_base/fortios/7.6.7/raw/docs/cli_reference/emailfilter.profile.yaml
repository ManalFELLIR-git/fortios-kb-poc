id: emailfilter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/268788570/config-emailfilter-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  external:
    type: enum
    raw_type: option
    description: Enable/disable external Email inspection.
    default: disable
  feature-set:
    type: enum
    raw_type: option
    description: Flow/proxy feature set.
    default: flow
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
  options:
    type: enum
    raw_type: option
    description: Options.
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group.
    max_length: 35
  spam-bal-table:
    type: integer
    raw_type: integer
    description: Anti-spam block/allow list table ID.
    default: '0'
    min: 0
    max: 4294967295
  spam-bword-table:
    type: integer
    raw_type: integer
    description: Anti-spam banned word table ID.
    default: '0'
    min: 0
    max: 4294967295
  spam-bword-threshold:
    type: integer
    raw_type: integer
    description: Spam banned word threshold.
    default: '10'
    min: 0
    max: 2147483647
  spam-filtering:
    type: enum
    raw_type: option
    description: Enable/disable spam filtering.
    default: disable
  spam-iptrust-table:
    type: integer
    raw_type: integer
    description: Anti-spam IP trust table ID.
    default: '0'
    min: 0
    max: 4294967295
  spam-log:
    type: enum
    raw_type: option
    description: Enable/disable spam logging for email filtering.
    default: enable
  spam-log-fortiguard-response:
    type: enum
    raw_type: option
    description: Enable/disable logging FortiGuard spam response.
    default: disable
  spam-mheader-table:
    type: integer
    raw_type: integer
    description: Anti-spam MIME header table ID.
    default: '0'
    min: 0
    max: 4294967295
  spam-rbl-table:
    type: integer
    raw_type: integer
    description: Anti-spam DNSBL table ID.
    default: '0'
    min: 0
    max: 4294967295
children:
  gmail:
    attributes:
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
  imap:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action for spam email.
        default: tag
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
      tag-msg:
        type: string
        raw_type: string
        description: Subject text or header added to spam email.
        default: Spam
        max_length: 63
      tag-type:
        type: enum
        raw_type: option
        description: Tag subject or header for spam email.
        default: subject spaminfo
  mapi:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action for spam email.
        default: pass
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
  msn-hotmail:
    attributes:
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
  other-webmails:
    attributes:
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
  pop3:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action for spam email.
        default: tag
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
      tag-msg:
        type: string
        raw_type: string
        description: Subject text or header added to spam email.
        default: Spam
        max_length: 63
      tag-type:
        type: enum
        raw_type: option
        description: Tag subject or header for spam email.
        default: subject spaminfo
  smtp:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action for spam email.
        default: discard
      hdrip:
        type: enum
        raw_type: option
        description: Enable/disable SMTP email header IP checks for spamfsip, spamrbl, and spambal filters.
        default: disable
      local-override:
        type: enum
        raw_type: option
        description: Enable/disable local filter to override SMTP remote check result.
        default: disable
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
      tag-msg:
        type: string
        raw_type: string
        description: Subject text or header added to spam email.
        default: Spam
        max_length: 63
      tag-type:
        type: enum
        raw_type: option
        description: Tag subject or header for spam email.
        default: subject spaminfo
  yahoo-mail:
    attributes:
      log-all:
        type: enum
        raw_type: option
        description: Enable/disable logging of all email traffic.
        default: disable
