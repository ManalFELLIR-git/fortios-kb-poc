id: router.policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/796289482/config-router-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Action of the policy route.
    default: permit
  comments:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  dst:
    type: string
    raw_type: string
    description: Destination IP and mask (x.x.x.x/x). IP and mask.
    max_length: 79
  dst-negate:
    type: enum
    raw_type: option
    description: Enable/disable negating destination address match.
    default: disable
  dstaddr:
    type: string
    raw_type: string
    description: Destination address name. Address/group name.
    max_length: 79
  end-port:
    type: integer
    raw_type: integer
    description: End destination port number (0 - 65535).
    default: '65535'
    min: 0
    max: 65535
  end-source-port:
    type: integer
    raw_type: integer
    description: End source port number (0 - 65535).
    default: '65535'
    min: 0
    max: 65535
  gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the gateway.
    default: 0.0.0.0
  groups:
    type: string
    raw_type: string
    description: List of user groups. Group name.
    max_length: 79
  input-device:
    type: string
    raw_type: string
    description: Incoming interface name. Interface name.
    max_length: 79
  input-device-negate:
    type: enum
    raw_type: option
    description: Enable/disable negation of input device match.
    default: disable
  internet-service-custom:
    type: string
    raw_type: string
    description: Custom Destination Internet Service name. Custom Destination Internet Service name.
    max_length: 79
  internet-service-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Destination Internet Service name. FortiGuard Destination Internet Service name.
    max_length: 79
  internet-service-id:
    type: integer
    raw_type: integer
    description: Destination Internet Service ID. Destination Internet Service ID.
    min: 0
    max: 4294967295
  output-device:
    type: string
    raw_type: string
    description: Outgoing interface name.
    max_length: 35
  protocol:
    type: integer
    raw_type: integer
    description: Protocol number (0 - 255).
    default: '0'
    min: 0
    max: 255
  seq-num:
    type: integer
    raw_type: integer
    description: Sequence number(1-65535).
    default: '0'
    min: 1
    max: 65535
  src:
    type: string
    raw_type: string
    description: Source IP and mask (x.x.x.x/x). IP and mask.
    max_length: 79
  src-negate:
    type: enum
    raw_type: option
    description: Enable/disable negating source address match.
    default: disable
  srcaddr:
    type: string
    raw_type: string
    description: Source address name. Address/group name.
    max_length: 79
  start-port:
    type: integer
    raw_type: integer
    description: Start destination port number (0 - 65535).
    default: '0'
    min: 0
    max: 65535
  start-source-port:
    type: integer
    raw_type: integer
    description: Start source port number (0 - 65535).
    default: '0'
    min: 0
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable this policy route.
    default: enable
  tos:
    type: string
    raw_type: user
    description: Type of service bit pattern.
  tos-mask:
    type: string
    raw_type: user
    description: Type of service evaluated bits.
  users:
    type: string
    raw_type: string
    description: List of users. User name.
    max_length: 79
children: {}
