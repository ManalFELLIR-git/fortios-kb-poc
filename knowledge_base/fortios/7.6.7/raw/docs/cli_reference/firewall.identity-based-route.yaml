id: firewall.identity-based-route
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/266463931/config-firewall-identity-based-route
attributes:
  comments:
    type: string
    raw_type: string
    description: Comments.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  rule:
    attributes:
      device:
        type: string
        raw_type: string
        description: Outgoing interface for the rule.
        max_length: 35
      gateway:
        type: ipv4-address
        raw_type: ipv4-address
        description: 'IPv4 address of the gateway (Format: xxx.xxx.xxx.xxx , Default: 0.0.0.0).'
        default: 0.0.0.0
      groups:
        type: string
        raw_type: string
        description: Select one or more group(s) from available groups that are allowed to use this route. Separate group
          names with a space. Group name.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
