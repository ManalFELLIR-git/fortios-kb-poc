id: vpn.certificate.remote
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260190803/config-vpn-certificate-remote
attributes:
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  range:
    type: enum
    raw_type: option
    description: Either the global or VDOM IP address range for the remote certificate.
    default: vdom
  remote:
    type: string
    raw_type: user
    description: Remote certificate.
  source:
    type: enum
    raw_type: option
    description: Remote certificate source type.
    default: user
children: {}
