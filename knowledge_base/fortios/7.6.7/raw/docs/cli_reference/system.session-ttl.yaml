id: system.session-ttl
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/325536976/config-system-session-ttl
attributes:
  default:
    type: string
    raw_type: user
    description: Default timeout.
children:
  port:
    attributes:
      end-port:
        type: integer
        raw_type: integer
        description: End port number.
        default: '0'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Table entry ID.
        default: '0'
        min: 0
        max: 65535
      protocol:
        type: integer
        raw_type: integer
        description: Protocol (0 - 255).
        default: '0'
        min: 0
        max: 255
      refresh-direction:
        type: enum
        raw_type: option
        description: Configure refresh direction.
        default: both
      start-port:
        type: integer
        raw_type: integer
        description: Start port number.
        default: '0'
        min: 0
        max: 65535
      timeout:
        type: string
        raw_type: user
        description: Session timeout (TTL).
