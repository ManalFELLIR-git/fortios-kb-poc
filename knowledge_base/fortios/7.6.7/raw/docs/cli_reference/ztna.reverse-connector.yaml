id: ztna.reverse-connector
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/166202010/config-ztna-reverse-connector
attributes:
  address:
    type: string
    raw_type: string
    description: Connector service edge adress(IP or FQDN).
    max_length: 255
  certificate:
    type: string
    raw_type: string
    description: The name of the certificate to use for SSL handshake.
    max_length: 35
  health-check-interval:
    type: integer
    raw_type: integer
    description: Health check interval in seconds (0 - 600, default = 60, 0 = disable).
    default: '60'
    min: 0
    max: 600
  name:
    type: string
    raw_type: string
    description: Reverse-Connector name
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: Port number that traffic uses to connect to connector service edge(0 - 65535;).
    default: '0'
    min: 0
    max: 65535
  ssl-max-version:
    type: enum
    raw_type: option
    description: Highest TLS version acceptable from a server.
    default: tls-1.3
  status:
    type: enum
    raw_type: option
    description: Reverse-Connector status.
    default: enable
  trusted-server-ca:
    type: string
    raw_type: string
    description: Trusted Server CA certificate used by SSL connection.
    max_length: 79
children: {}
