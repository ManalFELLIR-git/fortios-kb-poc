id: user.tacacs+
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/555694309/config-user-tacacs
attributes:
  authen-type:
    type: enum
    raw_type: option
    description: Allowed authentication protocols/methods.
    default: auto
  authorization:
    type: enum
    raw_type: option
    description: Enable/disable TACACS+ authorization.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  key:
    type: password
    raw_type: password
    description: Key to access the primary server.
  name:
    type: string
    raw_type: string
    description: TACACS+ server entry name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: Port number of the TACACS+ server.
    default: '49'
    min: 1
    max: 65535
  secondary-key:
    type: password
    raw_type: password
    description: Key to access the secondary server.
  secondary-server:
    type: string
    raw_type: string
    description: Secondary TACACS+ server CN domain name or IP address.
    max_length: 63
  server:
    type: string
    raw_type: string
    description: Primary TACACS+ server CN domain name or IP address.
    max_length: 63
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for communications to TACACS+ server.
    max_length: 63
  status-ttl:
    type: integer
    raw_type: integer
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled, default = 300).
    default: '300'
    min: 0
    max: 600
  tertiary-key:
    type: password
    raw_type: password
    description: Key to access the tertiary server.
  tertiary-server:
    type: string
    raw_type: string
    description: Tertiary TACACS+ server CN domain name or IP address.
    max_length: 63
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
