id: system.stp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/129965190/config-system-stp
attributes:
  forward-delay:
    type: integer
    raw_type: integer
    description: Forward delay (4 - 30 sec, default = 15).
    default: '15'
    min: 4
    max: 30
  hello-time:
    type: integer
    raw_type: integer
    description: Hello time (1 - 10 sec, default = 2).
    default: '2'
    min: 1
    max: 10
  max-age:
    type: integer
    raw_type: integer
    description: Maximum packet age (6 - 40 sec, default = 20).
    default: '20'
    min: 6
    max: 40
  max-hops:
    type: integer
    raw_type: integer
    description: Maximum number of hops (1 - 40, default = 20).
    default: '20'
    min: 1
    max: 40
  switch-priority:
    type: enum
    raw_type: option
    description: STP switch priority; the lower the number the higher the priority (select from 0, 4096, 8192, 12288, 16384,
      20480, 24576, 28672, 32768, 36864, 40960, 45056, 49152, 53248, and 57344).
    default: '32768'
children: {}
