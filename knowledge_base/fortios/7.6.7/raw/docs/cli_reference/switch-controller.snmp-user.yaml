id: switch-controller.snmp-user
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/323826479/config-switch-controller-snmp-user
attributes:
  auth-proto:
    type: enum
    raw_type: option
    description: Authentication protocol.
    default: sha256
  auth-pwd:
    type: password
    raw_type: password
    description: Password for authentication protocol.
  name:
    type: string
    raw_type: string
    description: SNMP user name.
    max_length: 32
  priv-proto:
    type: enum
    raw_type: option
    description: Privacy (encryption) protocol.
    default: aes128
  priv-pwd:
    type: password
    raw_type: password
    description: Password for privacy (encryption) protocol.
  queries:
    type: enum
    raw_type: option
    description: Enable/disable SNMP queries for this user.
    default: enable
  query-port:
    type: integer
    raw_type: integer
    description: SNMPv3 query port (default = 161).
    default: '161'
    min: 0
    max: 65535
  security-level:
    type: enum
    raw_type: option
    description: Security level for message authentication and encryption.
    default: no-auth-no-priv
children: {}
