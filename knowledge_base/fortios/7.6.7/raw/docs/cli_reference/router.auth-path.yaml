id: router.auth-path
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/261108417/config-router-auth-path
attributes:
  device:
    type: string
    raw_type: string
