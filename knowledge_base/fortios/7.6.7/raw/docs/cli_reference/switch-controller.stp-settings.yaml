id: switch-controller.stp-settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/338809026/config-switch-controller-stp-settings
attributes:
  forward-time:
    type: integer
    raw_type: integer
    description: Period of time a port is in listening and learning state (4 - 30 sec, default = 15).
    default: '15'
    min: 4
    max: 30
  hello-time:
    type: integer
    raw_type: integer
    description: Period of time between successive STP frame Bridge Protocol Data Units (BPDUs) sent on a port (1 - 10 sec,
      default = 2).
    default: '2'
    min: 1
    max: 10
  max-age:
    type: integer
    raw_type: integer
    description: Maximum time before a bridge port expires its configuration BPDU information (6 - 40 sec, default = 20).
    default: '20'
    min: 6
    max: 40
  max-hops:
    type: integer
    raw_type: integer
    description: Maximum number of hops between the root bridge and the furthest bridge (1- 40, default = 20).
    default: '20'
    min: 1
    max: 40
  name:
    type: string
    raw_type: string
    description: Name of global STP settings configuration.
    max_length: 31
  pending-timer:
    type: integer
    raw_type: integer
    description: Pending time (1 - 15 sec, default = 4).
    default: '4'
    min: 1
    max: 15
  revision:
    type: integer
    raw_type: integer
    description: STP revision number (0 - 65535).
    default: '0'
    min: 0
    max: 65535
children: {}
