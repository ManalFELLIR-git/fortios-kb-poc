id: system.object-tagging
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/134869288/config-system-object-tagging
attributes:
  address:
    type: enum
    raw_type: option
    description: Address.
    default: optional
  category:
    type: string
    raw_type: string
    description: Tag Category.
    max_length: 63
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  device:
    type: enum
    raw_type: option
    description: Device.
    default: optional
  interface:
    type: enum
    raw_type: option
    description: Interface.
    default: optional
  multiple:
    type: enum
    raw_type: option
    description: Allow multiple tag selection.
    default: enable
  tags:
    type: string
    raw_type: string
    description: Tags. Tag name.
    max_length: 79
children: {}
