id: dlp.dictionary
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/125200258/config-dlp-dictionary
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  match-around:
    type: enum
    raw_type: option
    description: Enable/disable match-around support.
    default: disable
  match-type:
    type: enum
    raw_type: option
    description: Logical relation between entries (default = match-any).
    default: match-any
  name:
    type: string
    raw_type: string
    description: Name of table containing the dictionary.
    max_length: 35
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children:
  entries:
    attributes:
      comment:
        type: string
        raw_type: var-string
        description: Optional comments.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      ignore-case:
        type: enum
        raw_type: option
        description: Enable/disable ignore case.
        default: disable
      pattern:
        type: string
        raw_type: string
        description: Pattern to match.
        max_length: 255
      repeat:
        type: enum
        raw_type: option
        description: Enable/disable repeat match.
        default: disable
      status:
        type: enum
        raw_type: option
        description: Enable/disable this pattern.
        default: enable
      type:
        type: string
        raw_type: string
        description: Pattern type to match.
        max_length: 35
