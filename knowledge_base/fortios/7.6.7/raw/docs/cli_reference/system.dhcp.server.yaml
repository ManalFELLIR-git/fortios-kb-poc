id: system.dhcp.server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/121865377/config-system-dhcp-server
attributes:
  auto-configuration:
    type: enum
    raw_type: option
    description: Enable/disable auto configuration.
    default: enable
  auto-managed-status:
    type: enum
    raw_type: option
    description: Enable/disable use of this DHCP server once this interface has been assigned an IP address from FortiIPAM.
    default: enable
  conflicted-ip-timeout:
    type: integer
    raw_type: integer
    description: Time in seconds to wait after a conflicted IP address is removed from the DHCP range before it can be reused.
    default: '1800'
    min: 60
    max: 8640000
  ddns-auth:
    type: enum
    raw_type: option
    description: DDNS authentication mode.
    default: disable
  ddns-key:
    type: password_aes256
    raw_type: password_aes256
    description: DDNS update key (base 64 encoding).
  ddns-keyname:
    type: string
    raw_type: string
    description: DDNS update key name.
    max_length: 64
  ddns-server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: DDNS server IP.
    default: 0.0.0.0
  ddns-ttl:
    type: integer
    raw_type: integer
    description: TTL.
    default: '300'
    min: 60
    max: 86400
  ddns-update:
    type: enum
    raw_type: option
    description: Enable/disable DDNS update for DHCP.
    default: disable
  ddns-update-override:
    type: enum
    raw_type: option
    description: Enable/disable DDNS update override for DHCP.
    default: disable
  ddns-zone:
    type: string
    raw_type: string
    description: Zone of your domain name (ex. DDNS.com).
    max_length: 64
  default-gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: Default gateway IP address assigned by the DHCP server.
    default: 0.0.0.0
  dhcp-settings-from-fortiipam:
    type: enum
    raw_type: option
    description: Enable/disable populating of DHCP server settings from FortiIPAM.
    default: disable
  dns-server1:
    type: ipv4-address
    raw_type: ipv4-address
    description: DNS server 1.
    default: 0.0.0.0
  dns-server2:
    type: ipv4-address
    raw_type: ipv4-address
    description: DNS server 2.
    default: 0.0.0.0
  dns-server3:
    type: ipv4-address
    raw_type: ipv4-address
    description: DNS server 3.
    default: 0.0.0.0
  dns-server4:
    type: ipv4-address
    raw_type: ipv4-address
    description: DNS server 4.
    default: 0.0.0.0
  dns-service:
    type: enum
    raw_type: option
    description: Options for assigning DNS servers to DHCP clients.
    default: specify
  domain:
    type: string
    raw_type: string
    description: Domain name suffix for the IP addresses that the DHCP server assigns to clients.
    max_length: 35
  filename:
    type: string
    raw_type: string
    description: Name of the boot file on the TFTP server.
    max_length: 127
  forticlient-on-net-status:
    type: enum
    raw_type: option
    description: Enable/disable FortiClient-On-Net service for this DHCP server.
    default: enable
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: DHCP server can assign IP configurations to clients connected to this interface.
    max_length: 15
  ip-mode:
    type: enum
    raw_type: option
    description: Method used to assign client IP.
    default: range
  ipsec-lease-hold:
    type: integer
    raw_type: integer
    description: DHCP over IPsec leases expire this many seconds after tunnel down (0 to disable forced-expiry).
    default: '60'
    min: 0
    max: 8640000
  lease-time:
    type: integer
    raw_type: integer
    description: Lease time in seconds, 0 means unlimited.
    default: '604800'
    min: 300
    max: 8640000
  mac-acl-default-action:
    type: enum
    raw_type: option
    description: MAC access control default action (allow or block assigning IP settings).
    default: assign
  netmask:
    type: ipv4-netmask
    raw_type: ipv4-netmask
    description: Netmask assigned by the DHCP server.
    default: 0.0.0.0
  next-server:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of a server (for example, a TFTP sever) that DHCP clients can download a boot file from.
    default: 0.0.0.0
  ntp-server1:
    type: ipv4-address
    raw_type: ipv4-address
    description: NTP server 1.
    default: 0.0.0.0
  ntp-server2:
    type: ipv4-address
    raw_type: ipv4-address
    description: NTP server 2.
    default: 0.0.0.0
  ntp-server3:
    type: ipv4-address
    raw_type: ipv4-address
    description: NTP server 3.
    default: 0.0.0.0
  ntp-service:
    type: enum
    raw_type: option
    description: Options for assigning Network Time Protocol (NTP) servers to DHCP clients.
    default: specify
  relay-agent:
    type: ipv4-address
    raw_type: ipv4-address
    description: Relay agent IP.
    default: 0.0.0.0
  server-type:
    type: enum
    raw_type: option
    description: DHCP server can be a normal DHCP server or an IPsec DHCP server.
    default: regular
  shared-subnet:
    type: enum
    raw_type: option
    description: Enable/disable shared subnet.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable this DHCP configuration.
    default: enable
  tftp-server:
    type: string
    raw_type: string
    description: One or more hostnames or IP addresses of the TFTP servers in quotes separated by spaces. TFTP server.
    max_length: 63
  timezone:
    type: string
    raw_type: string
    description: Select the time zone to be assigned to DHCP clients.
    max_length: 63
  timezone-option:
    type: enum
    raw_type: option
    description: Options for the DHCP server to set the client's time zone.
    default: disable
  vci-match:
    type: enum
    raw_type: option
    description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching VCI
      are served.
    default: disable
  vci-string:
    type: string
    raw_type: string
    description: One or more VCI strings in quotes separated by spaces. VCI strings.
    max_length: 255
  wifi-ac-service:
    type: enum
    raw_type: option
    description: Options for assigning WiFi access controllers to DHCP clients.
    default: specify
  wifi-ac1:
    type: ipv4-address
    raw_type: ipv4-address
    description: WiFi Access Controller 1 IP address (DHCP option 138, RFC 5417).
    default: 0.0.0.0
  wifi-ac2:
    type: ipv4-address
    raw_type: ipv4-address
    description: WiFi Access Controller 2 IP address (DHCP option 138, RFC 5417).
    default: 0.0.0.0
  wifi-ac3:
    type: ipv4-address
    raw_type: ipv4-address
    description: WiFi Access Controller 3 IP address (DHCP option 138, RFC 5417).
    default: 0.0.0.0
  wins-server1:
    type: ipv4-address
    raw_type: ipv4-address
    description: WINS server 1.
    default: 0.0.0.0
  wins-server2:
    type: ipv4-address
    raw_type: ipv4-address
    description: WINS server 2.
    default: 0.0.0.0
children:
  exclude-range:
    attributes:
      end-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: End of IP range.
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      lease-time:
        type: integer
        raw_type: integer
        description: Lease time in seconds, 0 means default lease time.
        default: '0'
        min: 300
        max: 8640000
      start-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Start of IP range.
        default: 0.0.0.0
      uci-match:
        type: enum
        raw_type: option
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this range.
        default: disable
      uci-string:
        type: string
        raw_type: string
        description: One or more UCI strings in quotes separated by spaces. UCI strings.
        max_length: 255
      vci-match:
        type: enum
        raw_type: option
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this range.
        default: disable
      vci-string:
        type: string
        raw_type: string
        description: One or more VCI strings in quotes separated by spaces. VCI strings.
        max_length: 255
  ip-range:
    attributes:
      end-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: End of IP range.
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      lease-time:
        type: integer
        raw_type: integer
        description: Lease time in seconds, 0 means default lease time.
        default: '0'
        min: 300
        max: 8640000
      start-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Start of IP range.
        default: 0.0.0.0
      uci-match:
        type: enum
        raw_type: option
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this range.
        default: disable
      uci-string:
        type: string
        raw_type: string
        description: One or more UCI strings in quotes separated by spaces. UCI strings.
        max_length: 255
      vci-match:
        type: enum
        raw_type: option
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this range.
        default: disable
      vci-string:
        type: string
        raw_type: string
        description: One or more VCI strings in quotes separated by spaces. VCI strings.
        max_length: 255
  options:
    attributes:
      code:
        type: integer
        raw_type: integer
        description: DHCP option code.
        default: '0'
        min: 0
        max: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: string
        raw_type: user
        description: DHCP option IPs.
      type:
        type: enum
        raw_type: option
        description: DHCP option type.
        default: hex
      uci-match:
        type: enum
        raw_type: option
        description: Enable/disable user class identifier (UCI) matching. When enabled only DHCP requests with a matching
          UCI are served with this option.
        default: disable
      uci-string:
        type: string
        raw_type: string
        description: One or more UCI strings in quotes separated by spaces. UCI strings.
        max_length: 255
      value:
        type: string
        raw_type: string
        description: DHCP option value.
        max_length: 312
      vci-match:
        type: enum
        raw_type: option
        description: Enable/disable vendor class identifier (VCI) matching. When enabled only DHCP requests with a matching
          VCI are served with this option.
        default: disable
      vci-string:
        type: string
        raw_type: string
        description: One or more VCI strings in quotes separated by spaces. VCI strings.
        max_length: 255
  reserved-address:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Options for the DHCP server to configure the client with the reserved MAC address.
        default: reserved
      circuit-id:
        type: string
        raw_type: string
        description: Option 82 circuit-ID of the client that will get the reserved IP address.
        max_length: 312
      circuit-id-type:
        type: enum
        raw_type: option
        description: DHCP option type.
        default: string
      description:
        type: string
        raw_type: var-string
        description: Description.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address to be reserved for the MAC address.
        default: 0.0.0.0
      mac:
        type: mac-address
        raw_type: mac-address
        description: MAC address of the client that will get the reserved IP address.
        default: 00:00:00:00:00:00
      remote-id:
        type: string
        raw_type: string
        description: Option 82 remote-ID of the client that will get the reserved IP address.
        max_length: 312
      remote-id-type:
        type: enum
        raw_type: option
        description: DHCP option type.
        default: string
      type:
        type: enum
        raw_type: option
        description: DHCP reserved-address type.
        default: mac
