id: wireless-controller.arrp-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/321555942/config-wireless-controller-arrp-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  darrp-optimize:
    type: integer
    raw_type: integer
    description: Time for running Distributed Automatic Radio Resource Provisioning (DARRP) optimizations (0 - 86400 sec,
      default = 86400, 0 = disable).
    default: '86400'
    min: 0
    max: 86400
  darrp-optimize-schedules:
    type: string
    raw_type: string
    description: Firewall schedules for DARRP running time. DARRP will run periodically based on darrp-optimize within the
      schedules. Separate multiple schedule names with a space. Schedule name.
    max_length: 35
  include-dfs-channel:
    type: enum
    raw_type: option
    description: Enable/disable use of DFS channel in DARRP channel selection phase 1 (default = enable).
    default: enable
  include-weather-channel:
    type: enum
    raw_type: option
    description: Enable/disable use of weather channel in DARRP channel selection phase 1 (default = enable).
    default: enable
  monitor-period:
    type: integer
    raw_type: integer
    description: Period in seconds to measure average transmit retries and receive errors (default = 300).
    default: '300'
    min: 0
    max: 65535
  name:
    type: string
    raw_type: string
    description: WiFi ARRP profile name.
    max_length: 35
  override-darrp-optimize:
    type: enum
    raw_type: option
    description: Enable to override setting darrp-optimize and darrp-optimize-schedules (default = disable).
    default: disable
  selection-period:
    type: integer
    raw_type: integer
    description: Period in seconds to measure average channel load, noise floor, spectral RSSI (default = 3600).
    default: '3600'
    min: 0
    max: 65535
  threshold-ap:
    type: integer
    raw_type: integer
    description: Threshold to reject channel in DARRP channel selection phase 1 due to surrounding APs (0 - 500, default =
      250).
    default: '250'
    min: 0
    max: 500
  threshold-channel-load:
    type: integer
    raw_type: integer
    description: Threshold in percentage to reject channel in DARRP channel selection phase 1 due to channel load (0 - 100,
      default = 60).
    default: '60'
    min: 0
    max: 100
  threshold-noise-floor:
    type: string
    raw_type: string
    description: Threshold in dBm to reject channel in DARRP channel selection phase 1 due to noise floor (-95 to -20, default
      = -85).
    default: '-85'
    max_length: 7
  threshold-rx-errors:
    type: integer
    raw_type: integer
    description: Threshold in percentage for receive errors to trigger channel reselection in DARRP monitor stage (0 - 100,
      default = 50).
    default: '50'
    min: 0
    max: 100
  threshold-spectral-rssi:
    type: string
    raw_type: string
    description: Threshold in dBm to reject channel in DARRP channel selection phase 1 due to spectral RSSI (-95 to -20, default
      = -65).
    default: '-65'
    max_length: 7
  threshold-tx-retries:
    type: integer
    raw_type: integer
    description: Threshold in percentage for transmit retries to trigger channel reselection in DARRP monitor stage (0 - 1000,
      default = 300).
    default: '300'
    min: 0
    max: 1000
  weight-channel-load:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for channel load (0 - 2000, default = 20).
    default: '20'
    min: 0
    max: 2000
  weight-dfs-channel:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for DFS channel (0 - 2000, default = 0).
    default: '0'
    min: 0
    max: 2000
  weight-managed-ap:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for managed APs (0 - 2000, default = 50).
    default: '50'
    min: 0
    max: 2000
  weight-noise-floor:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for noise floor (0 - 2000, default = 40).
    default: '40'
    min: 0
    max: 2000
  weight-rogue-ap:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for rogue APs (0 - 2000, default = 10).
    default: '10'
    min: 0
    max: 2000
  weight-spectral-rssi:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for spectral RSSI (0 - 2000, default = 40).
    default: '40'
    min: 0
    max: 2000
  weight-weather-channel:
    type: integer
    raw_type: integer
    description: Weight in DARRP channel score calculation for weather channel (0 - 2000, default = 0).
    default: '0'
    min: 0
    max: 2000
children: {}
