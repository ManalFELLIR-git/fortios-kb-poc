id: alertemail.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/239356323/config-alertemail-setting
attributes:
  FDS-license-expiring-warning:
    type: enum
    raw_type: option
    description: Enable/disable FortiGuard license expiration warnings in alert email.
    default: disable
  FDS-update-logs:
    type: enum
    raw_type: option
    description: Enable/disable FortiGuard update logs in alert email.
    default: disable
  FIPS-CC-errors:
    type: enum
    raw_type: option
    description: Enable/disable FIPS and Common Criteria error logs in alert email.
    default: disable
  FSSO-disconnect-logs:
    type: enum
    raw_type: option
    description: Enable/disable logging of FSSO collector agent disconnect.
    default: disable
  HA-logs:
    type: enum
    raw_type: option
    description: Enable/disable HA logs in alert email.
    default: disable
  IPS-logs:
    type: enum
    raw_type: option
    description: Enable/disable IPS logs in alert email.
    default: disable
  IPsec-errors-logs:
    type: enum
    raw_type: option
    description: Enable/disable IPsec error logs in alert email.
    default: disable
  PPP-errors-logs:
    type: enum
    raw_type: option
    description: Enable/disable PPP error logs in alert email.
    default: disable
  admin-login-logs:
    type: enum
    raw_type: option
    description: Enable/disable administrator login/logout logs in alert email.
    default: disable
  alert-interval:
    type: integer
    raw_type: integer
    description: Alert alert interval in minutes.
    default: '2'
    min: 1
    max: 99999
  amc-interface-bypass-mode:
    type: enum
    raw_type: option
    description: Enable/disable Fortinet Advanced Mezzanine Card (AMC) interface bypass mode logs in alert email.
    default: disable
  antivirus-logs:
    type: enum
    raw_type: option
    description: Enable/disable antivirus logs in alert email.
    default: disable
  configuration-changes-logs:
    type: enum
    raw_type: option
    description: Enable/disable configuration change logs in alert email.
    default: disable
  critical-interval:
    type: integer
    raw_type: integer
    description: Critical alert interval in minutes.
    default: '3'
    min: 1
    max: 99999
  debug-interval:
    type: integer
    raw_type: integer
    description: Debug alert interval in minutes.
    default: '60'
    min: 1
    max: 99999
  email-interval:
    type: integer
    raw_type: integer
    description: Interval between sending alert emails (1 - 99999 min, default = 5).
    default: '5'
    min: 1
    max: 99999
  emergency-interval:
    type: integer
    raw_type: integer
    description: Emergency alert interval in minutes.
    default: '1'
    min: 1
    max: 99999
  error-interval:
    type: integer
    raw_type: integer
    description: Error alert interval in minutes.
    default: '5'
    min: 1
    max: 99999
  filter-mode:
    type: enum
    raw_type: option
    description: How to filter log messages that are sent to alert emails.
    default: category
  firewall-authentication-failure-logs:
    type: enum
    raw_type: option
    description: Enable/disable firewall authentication failure logs in alert email.
    default: disable
  fortiguard-log-quota-warning:
    type: enum
    raw_type: option
    description: Enable/disable FortiCloud log quota warnings in alert email.
    default: disable
  information-interval:
    type: integer
    raw_type: integer
    description: Information alert interval in minutes.
    default: '30'
    min: 1
    max: 99999
  local-disk-usage:
    type: integer
    raw_type: integer
    description: Disk usage percentage at which to send alert email (1 - 99 percent, default = 75).
    default: '75'
    min: 1
    max: 99
  log-disk-usage-warning:
    type: enum
    raw_type: option
    description: Enable/disable disk usage warnings in alert email.
    default: disable
  mailto1:
    type: string
    raw_type: string
    description: Email address to send alert email to (usually a system administrator) (max. 63 characters).
    max_length: 63
  mailto2:
    type: string
    raw_type: string
    description: Optional second email address to send alert email to (max. 63 characters).
    max_length: 63
  mailto3:
    type: string
    raw_type: string
    description: Optional third email address to send alert email to (max. 63 characters).
    max_length: 63
  notification-interval:
    type: integer
    raw_type: integer
    description: Notification alert interval in minutes.
    default: '20'
    min: 1
    max: 99999
  severity:
    type: enum
    raw_type: option
    description: Lowest severity level to log.
    default: alert
  ssh-logs:
    type: enum
    raw_type: option
    description: Enable/disable SSH logs in alert email.
    default: disable
  sslvpn-authentication-errors-logs:
    type: enum
    raw_type: option
    description: Enable/disable Agentless VPN authentication error logs in alert email.
    default: disable
  username:
    type: string
    raw_type: string
    description: 'Name that appears in the From: field of alert emails (max. 63 characters).'
    max_length: 63
  violation-traffic-logs:
    type: enum
    raw_type: option
    description: Enable/disable violation traffic logs in alert email.
    default: disable
  warning-interval:
    type: integer
    raw_type: integer
    description: Warning alert interval in minutes.
    default: '10'
    min: 1
    max: 99999
  webfilter-logs:
    type: enum
    raw_type: option
    description: Enable/disable web filter logs in alert email.
    default: disable
children: {}
