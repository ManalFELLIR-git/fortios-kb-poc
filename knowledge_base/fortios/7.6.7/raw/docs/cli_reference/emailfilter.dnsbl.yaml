id: emailfilter.dnsbl
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/333173583/config-emailfilter-dnsbl
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Reject connection or mark as spam email.
        default: spam
      id:
        type: integer
        raw_type: integer
        description: DNSBL/ORBL entry ID.
        default: '0'
        min: 0
        max: 4294967295
      server:
        type: string
        raw_type: string
        description: DNSBL or ORBL server name.
        max_length: 127
      status:
        type: enum
        raw_type: option
        description: Enable/disable status.
        default: enable
