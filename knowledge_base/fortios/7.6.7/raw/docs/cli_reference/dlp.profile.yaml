id: dlp.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/144318225/config-dlp-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  dlp-log:
    type: enum
    raw_type: option
    description: Enable/disable DLP logging.
    default: enable
  extended-log:
    type: enum
    raw_type: option
    description: Enable/disable extended logging for data loss prevention.
    default: disable
  feature-set:
    type: enum
    raw_type: option
    description: Flow/proxy feature set.
    default: flow
  fortidata-error-action:
    type: enum
    raw_type: option
    description: Action to take if FortiData query fails.
    default: block
  full-archive-proto:
    type: enum
    raw_type: option
    description: Protocols to always content archive.
  nac-quar-log:
    type: enum
    raw_type: option
    description: Enable/disable NAC quarantine logging.
    default: disable
  name:
    type: string
    raw_type: string
    description: Name of the DLP profile.
    max_length: 47
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group used by this DLP profile.
    max_length: 35
  summary-proto:
    type: enum
    raw_type: option
    description: Protocols to always log summary.
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take with content that this DLP profile matches.
        default: allow
      archive:
        type: enum
        raw_type: option
        description: Enable/disable DLP archiving.
        default: disable
      expiry:
        type: string
        raw_type: user
        description: Quarantine duration in days, hours, minutes (format = dddhhmm).
        default: 5m
      file-size:
        type: integer
        raw_type: integer
        description: Match files greater than or equal to this size (KB).
        default: '0'
        min: 0
        max: 1644544
      file-type:
        type: integer
        raw_type: integer
        description: Select the number of a DLP file pattern table to match.
        default: '0'
        min: 0
        max: 4294967295
      filter-by:
        type: enum
        raw_type: option
        description: Select the type of content to match.
        default: none
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      label:
        type: string
        raw_type: string
        description: Select DLP label.
        max_length: 35
      match-percentage:
        type: integer
        raw_type: integer
        description: Percentage of fingerprints in the fingerprint databases designated with the selected sensitivity to match.
        default: '10'
        min: 1
        max: 100
      name:
        type: string
        raw_type: string
        description: Filter name.
        max_length: 35
      proto:
        type: enum
        raw_type: option
        description: Check messages or files over one or more of these protocols.
      sensitivity:
        type: string
        raw_type: string
        description: Select a DLP file pattern sensitivity to match. Select a DLP sensitivity.
        max_length: 35
      sensor:
        type: string
        raw_type: string
        description: Select DLP sensors. Address name.
        max_length: 35
      severity:
        type: enum
        raw_type: option
        description: Select the severity or threat level that matches this filter.
        default: medium
      type:
        type: enum
        raw_type: option
        description: Select whether to check the content of messages (an email message) or files (downloaded files or email
          attachments).
        default: file
