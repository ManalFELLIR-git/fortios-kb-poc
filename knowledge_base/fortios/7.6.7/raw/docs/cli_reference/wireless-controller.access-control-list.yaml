id: wireless-controller.access-control-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/136054176/config-wireless-controller-access-control-list
attributes:
  comment:
    type: string
    raw_type: string
    description: Description.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: AP access control list name.
    max_length: 35
children:
  layer3-ipv4-rules:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Policy action (allow | deny).
      comment:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      dstaddr:
        type: string
        raw_type: user
        description: Destination IP address (any | local-LAN | IPv4 address[/<network mask | mask length>], default = any).
      dstport:
        type: integer
        raw_type: integer
        description: Destination port (0 - 65535, default = 0, meaning any).
        default: '0'
        min: 0
        max: 65535
      protocol:
        type: integer
        raw_type: integer
        description: Protocol type as defined by IANA (0 - 255, default = 255, meaning any).
        default: '255'
        min: 0
        max: 255
      rule-id:
        type: integer
        raw_type: integer
        description: Rule ID (1 - 65535).
        default: '0'
        min: 1
        max: 65535
      srcaddr:
        type: string
        raw_type: user
        description: Source IP address (any | local-LAN | IPv4 address[/<network mask | mask length>], default = any).
      srcport:
        type: integer
        raw_type: integer
        description: Source port (0 - 65535, default = 0, meaning any).
        default: '0'
        min: 0
        max: 65535
  layer3-ipv6-rules:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Policy action (allow | deny).
      comment:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      dstaddr:
        type: string
        raw_type: user
        description: Destination IPv6 address (any | local-LAN | IPv6 address[/prefix length]), default = any.
      dstport:
        type: integer
        raw_type: integer
        description: Destination port (0 - 65535, default = 0, meaning any).
        default: '0'
        min: 0
        max: 65535
      protocol:
        type: integer
        raw_type: integer
        description: Protocol type as defined by IANA (0 - 255, default = 255, meaning any).
        default: '255'
        min: 0
        max: 255
      rule-id:
        type: integer
        raw_type: integer
        description: Rule ID (1 - 65535).
        default: '0'
        min: 1
        max: 65535
      srcaddr:
        type: string
        raw_type: user
        description: Source IPv6 address (any | local-LAN | IPv6 address[/prefix length]), default = any.
      srcport:
        type: integer
        raw_type: integer
        description: Source port (0 - 65535, default = 0, meaning any).
        default: '0'
        min: 0
        max: 65535
