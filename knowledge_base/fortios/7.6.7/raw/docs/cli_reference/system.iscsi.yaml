id: system.iscsi
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/101778647/config-system-iscsi
attributes:
  ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: iSCSI IP address.
    default: 0.0.0.0
  iqn:
    type: string
    raw_type: string
    description: iSCSI qualified name.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: iSCSI name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: iSCSI port number.
    default: '3260'
    min: 1
    max: 65535
children: {}
