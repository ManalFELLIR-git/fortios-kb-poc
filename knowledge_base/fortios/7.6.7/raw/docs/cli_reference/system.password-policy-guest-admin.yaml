id: system.password-policy-guest-admin
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/157859029/config-system-password-policy-guest-admin
attributes:
  apply-to:
    type: enum
    raw_type: option
    description: Guest administrator to which this password policy applies.
    default: guest-admin-password
  expire-day:
    type: integer
    raw_type: integer
    description: Number of days after which passwords expire (1 - 999 days, default = 90).
    default: '90'
    min: 1
    max: 999
  expire-status:
    type: enum
    raw_type: option
    description: Enable/disable password expiration.
    default: disable
  min-lower-case-letter:
    type: integer
    raw_type: integer
    description: Minimum number of lowercase characters in password (0 - 128, default = 1).
    default: '1'
    min: 0
    max: 128
  min-non-alphanumeric:
    type: integer
    raw_type: integer
    description: Minimum number of non-alphanumeric characters in password (0 - 128, default = 1).
    default: '1'
    min: 0
    max: 128
  min-number:
    type: integer
    raw_type: integer
    description: Minimum number of numeric characters in password (0 - 128, default = 1).
    default: '1'
    min: 0
    max: 128
  min-upper-case-letter:
    type: integer
    raw_type: integer
    description: Minimum number of uppercase characters in password (0 - 128, default = 1).
    default: '1'
    min: 0
    max: 128
  minimum-length:
    type: integer
    raw_type: integer
    description: Minimum password length (12 - 128, default = 12).
    default: '12'
    min: 12
    max: 128
  reuse-password:
    type: enum
    raw_type: option
    description: Enable/disable reuse of password.
    default: enable
  reuse-password-limit:
    type: integer
    raw_type: integer
    description: Number of times passwords can be reused (0 - 20, default = 0. If set to 0, can reuse password an unlimited
      number of times.).
    default: '0'
    min: 0
    max: 20
  status:
    type: enum
    raw_type: option
    description: Enable/disable setting a password policy for locally defined administrator passwords and IPsec VPN pre-shared
      keys.
    default: disable
children: {}
