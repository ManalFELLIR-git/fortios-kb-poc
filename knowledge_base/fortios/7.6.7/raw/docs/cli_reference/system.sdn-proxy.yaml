id: system.sdn-proxy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/276484310/config-system-sdn-proxy
attributes:
  name:
    type: string
    raw_type: string
    description: SDN proxy name.
    max_length: 35
  password:
    type: password_aes256
    raw_type: password_aes256
    description: SDN proxy password.
  server:
    type: string
    raw_type: string
    description: Server address of the SDN proxy.
    max_length: 127
  server-port:
    type: integer
    raw_type: integer
    description: Port number of the SDN proxy.
    default: '0'
    min: 0
    max: 65535
  type:
    type: enum
    raw_type: option
    description: Type of SDN proxy.
    default: general
  username:
    type: string
    raw_type: string
    description: SDN proxy username.
    max_length: 64
children: {}
