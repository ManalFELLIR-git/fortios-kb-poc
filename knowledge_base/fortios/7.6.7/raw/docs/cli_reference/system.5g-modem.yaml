id: system.5g-modem
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/961913955/config-system-5g-modem
attributes:
  status:
    type: enum
    raw_type: option
    description: Enable/disable USB 5G modem daemon.
    default: enable
children:
  data-plan:
    attributes:
      apn:
        type: string
        raw_type: string
        description: Login APN string for PDP-IP packet data calls.
        max_length: 127
      auth-type:
        type: enum
        raw_type: option
        description: Authentication type for PDP-IP packet data calls.
        default: none
      name:
        type: string
        raw_type: string
        description: Data plan name.
        max_length: 35
      password:
        type: password
        raw_type: password
        description: Authentication password for PDP-IP packet data calls.
      pdp-type:
        type: enum
        raw_type: option
        description: Packet Data Protocol (PDP) context type.
        default: ipv4v6
      username:
        type: string
        raw_type: string
        description: Authentication username for PDP-IP packet data calls.
        max_length: 63
  modem1:
    attributes:
      carrier-config:
        type: enum
        raw_type: option
        description: carrier-config selection mode.
        default: auto-gcf
      custom-ipv4-netmask:
        type: ipv4-netmask
        raw_type: ipv4-netmask
        description: Netmask assigned by the DHCP server.
        default: 255.255.255.255
      default-gateway:
        type: enum
        raw_type: option
        description: Modem interface default gateway.
        default: auto
      default-netmask:
        type: enum
        raw_type: option
        description: Modem interface default netmask.
        default: auto
      gps-antenna-type:
        type: enum
        raw_type: option
        description: GPS antenna type used on the GNSS port (default = passive).
        default: passive
      gps-service:
        type: enum
        raw_type: option
        description: Enable/disable Modem online mode.
        default: enable
      network-type:
        type: enum
        raw_type: option
        description: Modem network type.
        default: auto
      sim1-data-plan:
        type: string
        raw_type: string
        description: 'data plan for SIM #1.'
        max_length: 35
      sim1-pin:
        type: password
        raw_type: password
        description: 'PIN code for SIM #1 (if applicable).'
      sim2-data-plan:
        type: string
        raw_type: string
        description: 'data plan for SIM #2.'
        max_length: 35
      sim2-pin:
        type: password
        raw_type: password
        description: 'PIN code for SIM #2 (if applicable).'
      status:
        type: enum
        raw_type: option
        description: Enable/disable Modem online mode.
        default: online
  sim-switch:
    attributes:
      active-sim-slot:
        type: enum
        raw_type: option
        description: set active SIM card slot to slot-1 or slot-2.
        default: slot-1
      by-connection-state:
        type: enum
        raw_type: option
        description: Enable/disable automatic switch of SIM by MODEM connection state (mobile data usage charges not incurred).
        default: enable
      by-link-monitor:
        type: enum
        raw_type: option
        description: Enable/disable automatic switch of SIM by link monitor (mobile data usage charges incurred).
        default: disable
      by-sim-state:
        type: enum
        raw_type: option
        description: Enable/disable automatic switch of SIM when MODEM SIM state is empty or in error.
        default: enable
      link-monitor:
        type: string
        raw_type: string
        description: Set link monitor name.
        max_length: 35
      modem-disconnection-time:
        type: integer
        raw_type: integer
        description: Configure connection-based automatic switch of SIM time interval in seconds (30 - 86400).
        default: '300'
        min: 30
        max: 86400
      sim-switch-log-alert-interval:
        type: integer
        raw_type: integer
        description: When sim-switch > X threshold within Y interval, trigger log event (Y:1 - 99999 min, default = 15).
        default: '15'
        min: 1
        max: 99999
      sim-switch-log-alert-threshold:
        type: integer
        raw_type: integer
        description: When sim-switch > X threshold within Y interval, trigger log event (X:1 - 1000 times, default = 5).
        default: '5'
        min: 1
        max: 1000
  modem2:
    attributes:
      carrier-config:
        type: enum
        raw_type: option
        description: carrier-config selection mode.
        default: auto-gcf
      custom-ipv4-netmask:
        type: ipv4-netmask
        raw_type: ipv4-netmask
        description: Netmask assigned by the DHCP server.
        default: 255.255.255.255
      default-gateway:
        type: enum
        raw_type: option
        description: Modem interface default gateway.
        default: auto
      default-netmask:
        type: enum
        raw_type: option
        description: Modem interface default netmask.
        default: auto
      gps-service:
        type: enum
        raw_type: option
        description: Enable/disable Modem online mode.
        default: disable
      network-type:
        type: enum
        raw_type: option
        description: Modem network type.
        default: auto
      sim-data-plan:
        type: string
        raw_type: string
        description: data plan for SIM.
        max_length: 35
      sim-pin:
        type: password
        raw_type: password
        description: PIN code for SIM(if applicable).
      status:
        type: enum
        raw_type: option
        description: Enable/disable Modem online mode.
        default: online
