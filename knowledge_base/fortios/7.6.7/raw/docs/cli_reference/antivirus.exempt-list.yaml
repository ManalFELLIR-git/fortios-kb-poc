id: antivirus.exempt-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/232184791/config-antivirus-exempt-list
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  hash:
    type: string
    raw_type: string
    description: Hash value to be matched.
    max_length: 64
  hash-type:
    type: enum
    raw_type: option
    description: Hash type.
    default: sha1
  name:
    type: string
    raw_type: string
    description: Table entry name.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable table entry.
    default: enable
children: {}
