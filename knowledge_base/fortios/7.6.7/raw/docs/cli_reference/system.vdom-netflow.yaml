id: system.vdom-netflow
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/945928963/config-system-vdom-netflow
attributes:
  vdom-netflow:
    type: enum
    raw_type: option
    description: Enable/disable NetFlow per VDOM.
    default: disable
children:
  collectors:
    attributes:
      collector-ip:
        type: string
        raw_type: string
        description: Collector IP.
        max_length: 63
      collector-port:
        type: integer
        raw_type: integer
        description: NetFlow collector port number.
        default: '2055'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 1
        max: 6
      interface:
        type: string
        raw_type: string
        description: Specify outgoing interface to reach server.
        max_length: 15
      interface-select-method:
        type: enum
        raw_type: option
        description: Specify how to select outgoing interface to reach server.
        default: auto
      source-ip:
        type: string
        raw_type: string
        description: Source IP address for communication with the NetFlow agent.
        max_length: 63
      source-ip-interface:
        type: string
        raw_type: string
        description: Name of the interface used to determine the source IP for exporting packets.
        max_length: 15
      vrf-select:
        type: integer
        raw_type: integer
        description: VRF ID used for connection to server.
        default: '0'
        min: 0
        max: 511
