id: log.fortiguard.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/407706904/config-log-fortiguard-setting
attributes:
  access-config:
    type: enum
    raw_type: option
    description: Enable/disable FortiCloud access to configuration and data.
    default: enable
  conn-timeout:
    type: integer
    raw_type: integer
    description: FortiGate Cloud connection timeout in seconds.
    default: '10'
    min: 1
    max: 3600
  enc-algorithm:
    type: enum
    raw_type: option
    description: Configure the level of SSL protection for secure communication with FortiCloud.
    default: high
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  max-log-rate:
    type: integer
    raw_type: integer
    description: FortiCloud maximum log rate in MBps (0 = unlimited).
    default: '0'
    min: 0
    max: 100000
  priority:
    type: enum
    raw_type: option
    description: Set log transmission priority.
    default: default
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address used to connect FortiCloud.
    default: 0.0.0.0
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  status:
    type: enum
    raw_type: option
    description: Enable/disable logging to FortiCloud.
    default: disable
  upload-day:
    type: string
    raw_type: user
    description: Day of week to roll logs.
  upload-interval:
    type: enum
    raw_type: option
    description: Frequency of uploading log files to FortiCloud.
    default: daily
  upload-option:
    type: enum
    raw_type: option
    description: Configure how log messages are sent to FortiCloud.
    default: 5-minute
  upload-time:
    type: string
    raw_type: user
    description: Time of day to roll logs (hh:mm).
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
