id: webfilter.content-header
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/315619917/config-webfilter-content-header
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for this content type.
        default: allow
      category:
        type: string
        raw_type: user
        description: Categories that this content type applies to.
        default: all
      pattern:
        type: string
        raw_type: string
        description: Content type (regular expression).
        max_length: 31
