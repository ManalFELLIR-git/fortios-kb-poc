id: user.domain-controller
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/168038580/config-user-domain-controller
attributes:
  ad-mode:
    type: enum
    raw_type: option
    description: Set Active Directory mode.
    default: none
  adlds-dn:
    type: string
    raw_type: string
    description: AD LDS distinguished name.
    max_length: 255
  adlds-ip-address:
    type: ipv4-address
    raw_type: ipv4-address
    description: AD LDS IPv4 address.
    default: 0.0.0.0
  adlds-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: AD LDS IPv6 address.
    default: '::'
  adlds-port:
    type: integer
    raw_type: integer
    description: Port number of AD LDS service (default = 389).
    default: '389'
    min: 0
    max: 65535
  change-detection:
    type: enum
    raw_type: option
    description: Enable/disable detection of a configuration change in the Active Directory server.
    default: disable
  change-detection-period:
    type: integer
    raw_type: integer
    description: Minutes to detect a configuration change in the Active Directory server (5 - 10080 minutes (7 days), default
      = 60).
    default: '60'
    min: 5
    max: 10080
  dns-srv-lookup:
    type: enum
    raw_type: option
    description: Enable/disable DNS service lookup.
    default: disable
  domain-name:
    type: string
    raw_type: string
    description: Domain DNS name.
    max_length: 255
  hostname:
    type: string
    raw_type: string
    description: Hostname of the server to connect to.
    max_length: 255
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ip-address:
    type: ipv4-address
    raw_type: ipv4-address
    description: Domain controller IPv4 address.
    default: 0.0.0.0
  ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Domain controller IPv6 address.
    default: '::'
  ldap-server:
    type: string
    raw_type: string
    description: LDAP server name(s). LDAP server name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Domain controller entry name.
    max_length: 35
  password:
    type: password
    raw_type: password
    description: Password for specified username.
  port:
    type: integer
    raw_type: integer
    description: Port to be used for communication with the domain controller (default = 445).
    default: '445'
    min: 0
    max: 65535
  replication-port:
    type: integer
    raw_type: integer
    description: Port to be used for communication with the domain controller for replication service. Port number 0 indicates
      automatic discovery.
    default: '0'
    min: 0
    max: 65535
  source-ip-address:
    type: ipv4-address
    raw_type: ipv4-address
    description: FortiGate IPv4 address to be used for communication with the domain controller.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: FortiGate IPv6 address to be used for communication with the domain controller.
    default: '::'
  source-port:
    type: integer
    raw_type: integer
    description: Source port to be used for communication with the domain controller.
    default: '0'
    min: 0
    max: 65535
  username:
    type: string
    raw_type: string
    description: User name to sign in with. Must have proper permissions for service.
    max_length: 64
children:
  extra-server:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Server ID.
        default: '0'
        min: 1
        max: 100
      ip-address:
        type: ipv4-address
        raw_type: ipv4-address
        description: Domain controller IP address.
        default: 0.0.0.0
      port:
        type: integer
        raw_type: integer
        description: Port to be used for communication with the domain controller (default = 445).
        default: '445'
        min: 0
        max: 65535
      source-ip-address:
        type: ipv4-address
        raw_type: ipv4-address
        description: FortiGate IPv4 address to be used for communication with the domain controller.
        default: 0.0.0.0
      source-port:
        type: integer
        raw_type: integer
        description: Source port to be used for communication with the domain controller.
        default: '0'
        min: 0
        max: 65535
