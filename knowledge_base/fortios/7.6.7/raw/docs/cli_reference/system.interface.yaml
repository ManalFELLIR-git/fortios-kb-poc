id: system.interface
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/317104469/config-system-interface
attributes:
  ac-name:
    type: string
    raw_type: string
    description: PPPoE server name.
    max_length: 63
  aggregate:
    type: string
    raw_type: string
    description: Aggregate interface. Read-only.
    max_length: 15
  aggregate-type:
    type: enum
    raw_type: option
    description: Type of aggregation.
    default: physical
  algorithm:
    type: enum
    raw_type: option
    description: Frame distribution algorithm.
    default: L4
  alias:
    type: string
    raw_type: string
    description: Alias will be displayed with the interface name to make it easier to distinguish.
    max_length: 25
  allowaccess:
    type: enum
    raw_type: option
    description: Permitted types of management access to this interface.
  annex:
    type: enum
    raw_type: option
    description: Set xDSL annex type.
    default: a
  ap-discover:
    type: enum
    raw_type: option
    description: Enable/disable automatic registration of unknown FortiAP devices.
    default: enable
  arpforward:
    type: enum
    raw_type: option
    description: Enable/disable ARP forwarding.
    default: enable
  atm-protocol:
    type: enum
    raw_type: option
    description: ATM protocol.
    default: none
  auth-cert:
    type: string
    raw_type: string
    description: HTTPS server certificate.
    max_length: 35
  auth-portal-addr:
    type: string
    raw_type: string
    description: Address of captive portal.
    max_length: 63
  auth-type:
    type: enum
    raw_type: option
    description: PPP authentication type to use.
    default: auto
  auto-auth-extension-device:
    type: enum
    raw_type: option
    description: Enable/disable automatic authorization of dedicated Fortinet extension device on this interface.
    default: disable
  bandwidth-measure-time:
    type: integer
    raw_type: integer
    description: Bandwidth measure time.
    default: '0'
    min: 0
    max: 4294967295
  bfd:
    type: enum
    raw_type: option
    description: Bidirectional Forwarding Detection (BFD) settings.
    default: global
  bfd-desired-min-tx:
    type: integer
    raw_type: integer
    description: BFD desired minimal transmit interval.
    default: '250'
    min: 1
    max: 100000
  bfd-detect-mult:
    type: integer
    raw_type: integer
    description: BFD detection multiplier.
    default: '3'
    min: 1
    max: 50
  bfd-required-min-rx:
    type: integer
    raw_type: integer
    description: BFD required minimal receive interval.
    default: '250'
    min: 1
    max: 100000
  broadcast-forward:
    type: enum
    raw_type: option
    description: Enable/disable broadcast forwarding.
    default: disable
  cli-conn-status:
    type: integer
    raw_type: integer
    description: CLI connection status. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  dedicated-to:
    type: enum
    raw_type: option
    description: Configure interface for single purpose.
    default: none
  default-purdue-level:
    type: enum
    raw_type: option
    description: default purdue level of device detected on this interface.
    default: '3'
  defaultgw:
    type: enum
    raw_type: option
    description: Enable to get the gateway IP from the DHCP or PPPoE server.
    default: enable
  description:
    type: string
    raw_type: var-string
    description: Description.
    max_length: 255
  detected-peer-mtu:
    type: integer
    raw_type: integer
    description: MTU of detected peer (0 - 4294967295). Read-only.
    default: '0'
    min: 0
    max: 4294967295
  detectprotocol:
    type: enum
    raw_type: option
    description: Protocols used to detect the server.
    default: ping
  detectserver:
    type: string
    raw_type: user
    description: Gateway's ping server for this IP.
  device-identification:
    type: enum
    raw_type: option
    description: Enable/disable passively gathering of device identity information about the devices on the network connected
      to this interface.
    default: disable
  device-user-identification:
    type: enum
    raw_type: option
    description: Enable/disable passive gathering of user identity information about users on this interface.
    default: enable
  devindex:
    type: integer
    raw_type: integer
    description: Device Index. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  dhcp-broadcast-flag:
    type: enum
    raw_type: option
    description: Enable/disable setting of the broadcast flag in messages sent by the DHCP client (default = enable).
    default: enable
  dhcp-classless-route-addition:
    type: enum
    raw_type: option
    description: Enable/disable addition of classless static routes retrieved from DHCP server.
    default: disable **
  dhcp-client-identifier:
    type: string
    raw_type: string
    description: DHCP client identifier.
    max_length: 48
  dhcp-relay-agent-option:
    type: enum
    raw_type: option
    description: Enable/disable DHCP relay agent option.
    default: enable
  dhcp-relay-allow-no-end-option:
    type: enum
    raw_type: option
    description: Enable/disable relaying DHCP messages with no end option.
    default: disable
  dhcp-relay-circuit-id:
    type: string
    raw_type: string
    description: DHCP relay circuit ID.
    max_length: 64
  dhcp-relay-interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  dhcp-relay-interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  dhcp-relay-ip:
    type: string
    raw_type: user
    description: DHCP relay IP address.
  dhcp-relay-link-selection:
    type: ipv4-address
    raw_type: ipv4-address
    description: DHCP relay link selection.
    default: 0.0.0.0
  dhcp-relay-request-all-server:
    type: enum
    raw_type: option
    description: Enable/disable sending of DHCP requests to all servers.
    default: disable
  dhcp-relay-service:
    type: enum
    raw_type: option
    description: Enable/disable allowing this interface to act as a DHCP relay.
    default: disable
  dhcp-relay-source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address used by the DHCP relay as its source IP.
    default: 0.0.0.0
  dhcp-relay-type:
    type: enum
    raw_type: option
    description: DHCP relay type (regular or IPsec).
    default: regular
  dhcp-relay-vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '-1'
    min: 0
    max: 511
  dhcp-renew-time:
    type: integer
    raw_type: integer
    description: DHCP renew time in seconds (300-604800), 0 means use the renew time provided by the server.
    default: '0'
    min: 300
    max: 604800
  dhcp-smart-relay:
    type: enum
    raw_type: option
    description: Enable/disable DHCP smart relay.
    default: disable
  disc-retry-timeout:
    type: integer
    raw_type: integer
    description: Time in seconds to wait before retrying to start a PPPoE discovery, 0 means no timeout.
    default: '1'
    min: 0
    max: 4294967295
  distance:
    type: integer
    raw_type: integer
    description: Distance for routes learned through PPPoE or DHCP, lower distance indicates preferred route.
    default: '5'
    min: 1
    max: 255
  dns-server-override:
    type: enum
    raw_type: option
    description: Enable/disable use DNS acquired by DHCP or PPPoE.
    default: enable
  dns-server-protocol:
    type: enum
    raw_type: option
    description: DNS transport protocols.
    default: cleartext
  drop-fragment:
    type: enum
    raw_type: option
    description: Enable/disable drop fragment packets.
    default: disable
  eap-ca-cert:
    type: string
    raw_type: string
    description: EAP CA certificate name.
    max_length: 79
  eap-identity:
    type: string
    raw_type: string
    description: EAP identity.
    max_length: 35
  eap-method:
    type: enum
    raw_type: option
    description: EAP method.
  eap-password:
    type: password
    raw_type: password
    description: EAP password.
  eap-supplicant:
    type: enum
    raw_type: option
    description: Enable/disable EAP-Supplicant.
    default: disable
  eap-user-cert:
    type: string
    raw_type: string
    description: EAP user certificate name.
    max_length: 35
  egress-cos:
    type: enum
    raw_type: option
    description: Override outgoing CoS in user VLAN tag.
    default: disable
  egress-shaping-profile:
    type: string
    raw_type: string
    description: Outgoing traffic shaping profile.
    max_length: 35
  eip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: External IP. Read-only.
    default: 0.0.0.0
  estimated-downstream-bandwidth:
    type: integer
    raw_type: integer
    description: Estimated maximum downstream bandwidth (kbps). Used to estimate link utilization.
    default: '0'
    min: 0
    max: 4294967295
  estimated-upstream-bandwidth:
    type: integer
    raw_type: integer
    description: Estimated maximum upstream bandwidth (kbps). Used to estimate link utilization.
    default: '0'
    min: 0
    max: 4294967295
  exclude-signatures:
    type: enum
    raw_type: option
    description: Exclude IOT or OT application signatures.
  explicit-ftp-proxy:
    type: enum
    raw_type: option
    description: Enable/disable the explicit FTP proxy on this interface.
    default: disable
  explicit-web-proxy:
    type: enum
    raw_type: option
    description: Enable/disable the explicit web proxy on this interface.
    default: disable
  external:
    type: enum
    raw_type: option
    description: Enable/disable identifying the interface as an external interface (which usually means it's connected to
      the Internet).
    default: disable
  fail-action-on-extender:
    type: enum
    raw_type: option
    description: Action on FortiExtender when interface fail.
    default: soft-restart
  fail-alert-interfaces:
    type: string
    raw_type: string
    description: Names of the FortiGate interfaces to which the link failure alert is sent. Names of the non-virtual interface.
    max_length: 15
  fail-alert-method:
    type: enum
    raw_type: option
    description: Select link-failed-signal or link-down method to alert about a failed link.
    default: link-down
  fail-detect:
    type: enum
    raw_type: option
    description: Enable/disable fail detection features for this interface.
    default: disable
  fail-detect-option:
    type: enum
    raw_type: option
    description: Options for detecting that this interface has failed.
    default: link-down
  fortilink:
    type: enum
    raw_type: option
    description: Enable FortiLink to dedicate this interface to manage other Fortinet devices.
    default: disable
  fortilink-backup-link:
    type: integer
    raw_type: integer
    description: FortiLink split interface backup link. Read-only.
    default: '0'
    min: 0
    max: 255
  fortilink-neighbor-detect:
    type: enum
    raw_type: option
    description: Protocol for FortiGate neighbor discovery.
    default: lldp
  fortilink-split-interface:
    type: enum
    raw_type: option
    description: Enable/disable FortiLink split interface to connect member link to different FortiSwitch in stack for uplink
      redundancy.
    default: enable
  forward-domain:
    type: integer
    raw_type: integer
    description: Transparent mode forward domain.
    default: '0'
    min: 0
    max: 2147483647
  forward-error-correction:
    type: enum
    raw_type: option
    description: Enable/disable forward error correction (FEC).
    default: none
  gateway-address:
    type: ipv4-address
    raw_type: ipv4-address
    description: Gateway address.
    default: 0.0.0.0
  gwaddr:
    type: ipv4-address
    raw_type: ipv4-address
    description: Gateway address.
    default: 0.0.0.0
  gwdetect:
    type: enum
    raw_type: option
    description: Enable/disable detect gateway alive for first.
    default: disable
  ha-priority:
    type: integer
    raw_type: integer
    description: HA election priority for the PING server.
    default: '1'
    min: 1
    max: 50
  icmp-accept-redirect:
    type: enum
    raw_type: option
    description: Enable/disable ICMP accept redirect.
    default: enable
  icmp-send-redirect:
    type: enum
    raw_type: option
    description: Enable/disable sending of ICMP redirects.
    default: enable
  ident-accept:
    type: enum
    raw_type: option
    description: Enable/disable authentication for this interface.
    default: disable
  idle-timeout:
    type: integer
    raw_type: integer
    description: PPPoE auto disconnect after idle timeout seconds, 0 means no timeout.
    default: '0'
    min: 0
    max: 32767
  ike-saml-server:
    type: string
    raw_type: string
    description: Configure IKE authentication SAML server.
    max_length: 35
  inbandwidth:
    type: integer
    raw_type: integer
    description: Bandwidth limit for incoming traffic (0 - 80000000 kbps), 0 means unlimited.
    default: '0'
    min: 0
    max: 80000000
  ingress-cos:
    type: enum
    raw_type: option
    description: Override incoming CoS in user VLAN tag on VLAN interface or assign a priority VLAN tag on physical interface.
    default: disable
  ingress-shaping-profile:
    type: string
    raw_type: string
    description: Incoming traffic shaping profile.
    max_length: 35
  ingress-spillover-threshold:
    type: integer
    raw_type: integer
    description: Ingress Spillover threshold (0 - 16776000 kbps), 0 means unlimited.
    default: '0'
    min: 0
    max: 16776000
  interconnect-profile:
    type: enum
    raw_type: option
    description: Set interconnect profile.
    default: default
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  internal:
    type: integer
    raw_type: integer
    description: Implicitly created.
    default: '0'
    min: 0
    max: 255
  ip:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: 'Interface IPv4 address and subnet mask, syntax: X.X.X.X/24.'
    default: 0.0.0.0 0.0.0.0
  ip-managed-by-fortiipam:
    type: enum
    raw_type: option
    description: Enable/disable automatic IP address assignment of this interface by FortiIPAM.
    default: inherit-global
  ipmac:
    type: enum
    raw_type: option
    description: Enable/disable IP/MAC binding.
    default: disable
  ips-sniffer-mode:
    type: enum
    raw_type: option
    description: Enable/disable the use of this interface as a one-armed sniffer.
    default: disable
  ipunnumbered:
    type: ipv4-address
    raw_type: ipv4-address
    description: Unnumbered IP used for PPPoE interfaces for which no unique local address is provided.
    default: 0.0.0.0
  l2forward:
    type: enum
    raw_type: option
    description: Enable/disable l2 forwarding.
    default: disable
  l2tp-client:
    type: enum
    raw_type: option
    description: Enable/disable this interface as a Layer 2 Tunnelling Protocol (L2TP) client.
    default: disable
  lacp-ha-secondary:
    type: enum
    raw_type: option
    description: LACP HA secondary member.
    default: enable
  lacp-mode:
    type: enum
    raw_type: option
    description: LACP mode.
    default: active
  lacp-speed:
    type: enum
    raw_type: option
    description: How often the interface sends LACP messages.
    default: slow
  lcp-echo-interval:
    type: integer
    raw_type: integer
    description: Time in seconds between PPPoE Link Control Protocol (LCP) echo requests.
    default: '5'
    min: 0
    max: 32767
  lcp-max-echo-fails:
    type: integer
    raw_type: integer
    description: Maximum missed LCP echo messages before disconnect.
    default: '3'
    min: 0
    max: 32767
  link-up-delay:
    type: integer
    raw_type: integer
    description: Number of milliseconds to wait before considering a link is up.
    default: '50'
    min: 50
    max: 3600000
  lldp-network-policy:
    type: string
    raw_type: string
    description: LLDP-MED network policy profile.
    max_length: 35
  lldp-reception:
    type: enum
    raw_type: option
    description: Enable/disable Link Layer Discovery Protocol (LLDP) reception.
    default: vdom
  lldp-transmission:
    type: enum
    raw_type: option
    description: Enable/disable Link Layer Discovery Protocol (LLDP) transmission.
    default: vdom
  macaddr:
    type: mac-address
    raw_type: mac-address
    description: Change the interface's MAC address.
    default: 00:00:00:00:00:00 **
  managed-subnetwork-size:
    type: enum
    raw_type: option
    description: Number of IP addresses to be allocated by FortiIPAM and used by this FortiGate unit's DHCP server settings.
    default: '256'
  management-ip:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: High Availability in-band management IP address of this interface.
    default: 0.0.0.0 0.0.0.0
  measured-downstream-bandwidth:
    type: integer
    raw_type: integer
    description: Measured downstream bandwidth (kbps).
    default: '0'
    min: 0
    max: 4294967295
  measured-upstream-bandwidth:
    type: integer
    raw_type: integer
    description: Measured upstream bandwidth (kbps).
    default: '0'
    min: 0
    max: 4294967295
  mediatype:
    type: enum
    raw_type: option
    description: Select SFP media interface type
    default: serdes-sfp **
  member:
    type: string
    raw_type: string
    description: Physical interfaces that belong to the aggregate or redundant interface. Physical interface name.
    max_length: 79
  min-links:
    type: integer
    raw_type: integer
    description: Minimum number of aggregated ports that must be up.
    default: '1'
    min: 1
    max: 32
  min-links-down:
    type: enum
    raw_type: option
    description: Action to take when less than the configured minimum number of links are active.
    default: operational
  mirroring-direction:
    type: enum
    raw_type: option
    description: Port mirroring direction.
  mirroring-port:
    type: string
    raw_type: string
    description: Mirroring port.
    max_length: 15
  mode:
    type: enum
    raw_type: option
    description: Addressing mode (static, DHCP, PPPoE).
    default: static
  monitor-bandwidth:
    type: enum
    raw_type: option
    description: Enable monitoring bandwidth on this interface.
    default: disable
  mrru:
    type: integer
    raw_type: integer
    description: PPP MRRU (296 - 65535, default = 1500).
    default: '1500'
    min: 296
    max: 65535
  mtu:
    type: integer
    raw_type: integer
    description: MTU value for this interface.
    default: '1500'
    min: 0
    max: 4294967295
  mtu-override:
    type: enum
    raw_type: option
    description: Enable to set a custom MTU for this interface.
    default: disable
  multilink:
    type: enum
    raw_type: option
    description: Enable/disable PPP multilink support.
    default: disable
  mux-type:
    type: enum
    raw_type: option
    description: Multiplexer type.
    default: llc-encaps
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 15
  ndiscforward:
    type: enum
    raw_type: option
    description: Enable/disable NDISC forwarding.
    default: enable
  netbios-forward:
    type: enum
    raw_type: option
    description: Enable/disable NETBIOS forwarding.
    default: disable
  netflow-sample-rate:
    type: integer
    raw_type: integer
    description: NetFlow sample rate. Sample one packet every configured number of packets (1 - 65535, default = 1, which
      means standard NetFlow where all packets are sampled).
    default: '1'
    min: 1
    max: 65535
  netflow-sampler:
    type: enum
    raw_type: option
    description: Enable/disable NetFlow on this interface and set the data that NetFlow collects (rx, tx, or both).
    default: disable
  netflow-sampler-id:
    type: integer
    raw_type: integer
    description: Netflow sampler ID.
    default: '0'
    min: 1
    max: 254
  np-qos-profile:
    type: integer
    raw_type: integer
    description: NP QoS profile ID.
    default: '0'
    min: 0
    max: 15
  outbandwidth:
    type: integer
    raw_type: integer
    description: Bandwidth limit for outgoing traffic (0 - 80000000 kbps).
    default: '0'
    min: 0
    max: 80000000
  padt-retry-timeout:
    type: integer
    raw_type: integer
    description: PPPoE Active Discovery Terminate (PADT) used to terminate sessions after an idle time.
    default: '1'
    min: 0
    max: 4294967295
  password:
    type: password
    raw_type: password
    description: PPPoE account's password.
  phy-mode:
    type: enum
    raw_type: option
    description: DSL physical mode.
    default: vdsl
  ping-serv-status:
    type: integer
    raw_type: integer
    description: PING server status. Read-only.
    default: '0'
    min: 0
    max: 255
  poe:
    type: enum
    raw_type: option
    description: Enable/disable PoE status.
    default: enable
  polling-interval:
    type: integer
    raw_type: integer
    description: sFlow polling interval in seconds (1 - 255).
    default: '20'
    min: 1
    max: 255
  port-mirroring:
    type: enum
    raw_type: option
    description: Enable/disable NP port mirroring.
    default: disable
  pppoe-egress-cos:
    type: enum
    raw_type: option
    description: CoS in VLAN tag for outgoing PPPoE/PPP packets.
    default: cos0
  pppoe-unnumbered-negotiate:
    type: enum
    raw_type: option
    description: Enable/disable PPPoE unnumbered negotiation.
    default: enable
  pptp-auth-type:
    type: enum
    raw_type: option
    description: PPTP authentication type.
    default: auto
  pptp-client:
    type: enum
    raw_type: option
    description: Enable/disable PPTP client.
    default: disable
  pptp-password:
    type: password
    raw_type: password
    description: PPTP password.
  pptp-server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: PPTP server IP address.
    default: 0.0.0.0
  pptp-timeout:
    type: integer
    raw_type: integer
    description: Idle timer in minutes (0 for disabled).
    default: '0'
    min: 0
    max: 65535
  pptp-user:
    type: string
    raw_type: string
    description: PPTP user name.
    max_length: 64
  preserve-session-route:
    type: enum
    raw_type: option
    description: Enable/disable preservation of session route when dirty.
    default: disable
  priority:
    type: integer
    raw_type: integer
    description: Priority of learned routes.
    default: '1'
    min: 1
    max: 65535
  priority-override:
    type: enum
    raw_type: option
    description: Enable/disable fail back to higher priority port once recovered.
    default: enable
  profiles:
    type: enum
    raw_type: option
    description: Set allowed VDSL profiles.
    default: 17a 30a
  proxy-captive-portal:
    type: enum
    raw_type: option
    description: Enable/disable proxy captive portal on this interface.
    default: disable
  pvc-atm-qos:
    type: enum
    raw_type: option
    description: SFP-DSL ADSL Fallback PVC ATM QoS.
    default: ubr
  pvc-chan:
    type: integer
    raw_type: integer
    description: SFP-DSL ADSL Fallback PVC Channel.
    default: '0'
    min: 0
    max: 7
  pvc-crc:
    type: integer
    raw_type: integer
    description: 'SFP-DSL ADSL Fallback PVC CRC Option: bit0: sar LLC preserve, bit1: ream LLC preserve, bit2: ream VC-MUX
      has crc.'
    default: '2'
    min: 0
    max: 7
  pvc-pcr:
    type: integer
    raw_type: integer
    description: SFP-DSL ADSL Fallback PVC Packet Cell Rate in cells (0 - 5500).
    default: '0'
    min: 0
    max: 5500
  pvc-scr:
