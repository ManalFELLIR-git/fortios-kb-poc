id: system.network-visibility
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/278813649/config-system-network-visibility
attributes:
  destination-hostname-visibility:
    type: enum
    raw_type: option
    description: Enable/disable logging of destination hostname visibility.
    default: enable
  destination-location:
    type: enum
    raw_type: option
    description: Enable/disable logging of destination geographical location visibility.
    default: enable
  destination-visibility:
    type: enum
    raw_type: option
    description: Enable/disable logging of destination visibility.
    default: enable
  source-location:
    type: enum
    raw_type: option
    description: Enable/disable logging of source geographical location visibility.
    default: enable
children: {}
