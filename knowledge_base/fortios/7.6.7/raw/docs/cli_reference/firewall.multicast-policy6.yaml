id: firewall.multicast-policy6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/114614907/config-firewall-multicast-policy6
attributes:
  action:
    type: enum
    raw_type: option
    description: Accept or deny traffic matching the policy.
    default: accept
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading policy traffic for hardware acceleration.
    default: enable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dstaddr:
    type: string
    raw_type: string
    description: IPv6 destination address name. Address name.
    max_length: 79
  dstintf:
    type: string
    raw_type: string
    description: IPv6 destination interface name.
    max_length: 35
  end-port:
    type: integer
    raw_type: integer
    description: Integer value for ending TCP/UDP/SCTP destination port in range (1 - 65535, default = 65535).
    default: '65535'
    min: 0
    max: 65535
  id:
    type: integer
    raw_type: integer
    description: Policy ID (0 - 4294967294).
    default: '0'
    min: 0
    max: 4294967294
  ips-sensor:
    type: string
    raw_type: string
    description: Name of an existing IPS sensor.
    max_length: 47
  logtraffic:
    type: enum
    raw_type: option
    description: Enable or disable logging. Log all sessions or security profile sessions.
    default: utm
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 35
  protocol:
    type: integer
    raw_type: integer
    description: Integer value for the protocol type as defined by IANA (0 - 255, default = 0).
    default: '0'
    min: 0
    max: 255
  srcaddr:
    type: string
    raw_type: string
    description: IPv6 source address name. Address name.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: IPv6 source interface name.
    max_length: 35
  start-port:
    type: integer
    raw_type: integer
    description: Integer value for starting TCP/UDP/SCTP destination port in range (1 - 65535, default = 1).
    default: '1'
    min: 0
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable this policy.
    default: enable
  utm-status:
    type: enum
    raw_type: option
    description: Enable to add an IPS security profile to the policy.
    default: disable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
