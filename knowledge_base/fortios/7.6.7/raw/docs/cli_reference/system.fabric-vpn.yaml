id: system.fabric-vpn
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/323819537/config-system-fabric-vpn
attributes:
  bgp-as:
    type: string
    raw_type: user
    description: BGP Router AS number, asplain/asdot/asdot+ format.
  branch-name:
    type: string
    raw_type: string
    description: Branch name.
    max_length: 35
  health-checks:
    type: string
    raw_type: string
    description: Underlying health checks.
    max_length: 35
  loopback-address-block:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: 'IPv4 address and subnet mask for hub''s loopback address, syntax: X.X.X.X/24.'
    default: 0.0.0.0 0.0.0.0
  loopback-advertised-subnet:
    type: integer
    raw_type: integer
    description: Loopback advertised subnet reference.
    default: '0'
    min: 0
    max: 4294967295
  loopback-interface:
    type: string
    raw_type: string
    description: Loopback interface.
    max_length: 15
  policy-rule:
    type: enum
    raw_type: option
    description: Policy creation rule.
    default: health-check
  psksecret:
    type: password-3
    raw_type: password-3
    description: Pre-shared secret for ADVPN.
  sdwan-zone:
    type: string
    raw_type: string
    description: Reference to created SD-WAN zone.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable Fabric VPN.
    default: disable
  sync-mode:
    type: enum
    raw_type: option
    description: Setting synchronized by fabric or manual.
    default: enable
  vpn-role:
    type: enum
    raw_type: option
    description: Fabric VPN role.
    default: hub
children:
  advertised-subnets:
    attributes:
      access:
        type: enum
        raw_type: option
        description: Access policy direction.
        default: inbound
      bgp-network:
        type: integer
        raw_type: integer
        description: Underlying BGP network.
        default: '0'
        min: 0
        max: 4294967295
      firewall-address:
        type: string
        raw_type: string
        description: Underlying firewall address.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967294
      policies:
        type: integer
        raw_type: integer
        description: Underlying policies.
        min: 0
        max: 4294967295
      prefix:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: Network prefix.
        default: 0.0.0.0 0.0.0.0
  overlays:
    attributes:
      bgp-neighbor:
        type: string
        raw_type: string
        description: Underlying BGP neighbor entry.
        max_length: 45
      bgp-neighbor-group:
        type: string
        raw_type: string
        description: Underlying BGP neighbor group entry.
        max_length: 45
      bgp-neighbor-range:
        type: integer
        raw_type: integer
        description: Underlying BGP neighbor range entry.
        default: '0'
        min: 0
        max: 4294967295
      bgp-network:
        type: integer
        raw_type: integer
        description: Underlying BGP network.
        default: '0'
        min: 0
        max: 4294967295
      interface:
        type: string
        raw_type: string
        description: Underlying interface name.
        max_length: 15
      ipsec-network-id:
        type: integer
        raw_type: integer
        description: VPN gateway network ID.
        default: '0'
        min: 0
        max: 255
      ipsec-phase1:
        type: string
        raw_type: string
        description: IPsec interface.
        max_length: 35
      name:
        type: string
        raw_type: string
        description: Overlay name.
        max_length: 79
      overlay-policy:
        type: integer
        raw_type: integer
        description: The overlay policy to allow ADVPN thru traffic.
        default: '0'
        min: 0
        max: 4294967295
      overlay-tunnel-block:
        type: ipv4-classnet-host
        raw_type: ipv4-classnet-host
        description: 'IPv4 address and subnet mask for the overlay tunnel , syntax: X.X.X.X/24.'
        default: 0.0.0.0 0.0.0.0
      remote-gw:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: IP address of the hub gateway (Set by hub).
        default: 0.0.0.0
      route-policy:
        type: integer
        raw_type: integer
        description: Underlying router policy.
        default: '0'
        min: 0
        max: 4294967295
      sdwan-member:
        type: integer
        raw_type: integer
        description: Reference to SD-WAN member entry.
        default: '0'
        min: 0
        max: 4294967295
