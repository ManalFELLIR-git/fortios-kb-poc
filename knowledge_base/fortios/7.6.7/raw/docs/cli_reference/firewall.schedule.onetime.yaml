id: firewall.schedule.onetime
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260188243/config-firewall-schedule-onetime
attributes:
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  end:
    type: string
    raw_type: user
    description: Schedule end date and time, format hh:mm yyyy/mm/dd.
  end-utc:
    type: string
    raw_type: user
    description: Schedule end date and time, in epoch format.
  expiration-days:
    type: integer
    raw_type: integer
    description: Write an event log message this many days before the schedule expires.
    default: '3'
    min: 0
    max: 100
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  name:
    type: string
    raw_type: string
    description: Onetime schedule name.
    max_length: 31
  start:
    type: string
    raw_type: user
    description: Schedule start date and time, format hh:mm yyyy/mm/dd.
  start-utc:
    type: string
    raw_type: user
    description: Schedule start date and time, in epoch format.
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
