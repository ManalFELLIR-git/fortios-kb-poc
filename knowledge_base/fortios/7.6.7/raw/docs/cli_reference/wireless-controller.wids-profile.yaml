id: wireless-controller.wids-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/109977937/config-wireless-controller-wids-profile
attributes:
  adhoc-network:
    type: enum
    raw_type: option
    description: Enable/disable adhoc network detection (default = disable).
    default: disable
  adhoc-valid-ssid:
    type: enum
    raw_type: option
    description: Enable/disable adhoc using valid SSID detection (default = disable).
    default: disable
  air-jack:
    type: enum
    raw_type: option
    description: Enable/disable AirJack detection (default = disable).
    default: disable
  ap-auto-suppress:
    type: enum
    raw_type: option
    description: Enable/disable on-wire rogue AP auto-suppression (default = disable).
    default: disable
  ap-bgscan-disable-schedules:
    type: string
    raw_type: string
    description: Firewall schedules for turning off FortiAP radio background scan. Background scan will be disabled when at
      least one of the schedules is valid. Separate multiple schedule names with a space. Schedule name.
    max_length: 35
  ap-bgscan-duration:
    type: integer
    raw_type: integer
    description: Listen time on scanning a channel (10 - 1000 msec, default = 30).
    default: '30'
    min: 10
    max: 1000
  ap-bgscan-idle:
    type: integer
    raw_type: integer
    description: Wait time for channel inactivity before scanning this channel (0 - 1000 msec, default = 20).
    default: '20'
    min: 0
    max: 1000
  ap-bgscan-intv:
    type: integer
    raw_type: integer
    description: Period between successive channel scans (1 - 600 sec, default = 3).
    default: '3'
    min: 1
    max: 600
  ap-bgscan-period:
    type: integer
    raw_type: integer
    description: Period between background scans (10 - 3600 sec, default = 600).
    default: '600'
    min: 10
    max: 3600
  ap-bgscan-report-intv:
    type: integer
    raw_type: integer
    description: Period between background scan reports (15 - 600 sec, default = 30).
    default: '30'
    min: 15
    max: 600
  ap-fgscan-report-intv:
    type: integer
    raw_type: integer
    description: Period between foreground scan reports (15 - 600 sec, default = 15).
    default: '15'
    min: 15
    max: 600
  ap-impersonation:
    type: enum
    raw_type: option
    description: Enable/disable AP impersonation detection (default = disable).
    default: disable
  ap-scan:
    type: enum
    raw_type: option
    description: Enable/disable rogue AP detection.
    default: disable
  ap-scan-channel-list-2G-5G:
    type: string
    raw_type: string
    description: Selected ap scan channel list for 2.4G and 5G bands. Channel number.
    max_length: 3
  ap-scan-channel-list-6G:
    type: string
    raw_type: string
    description: Selected ap scan channel list for 6G band. Channel 6g number.
    max_length: 3
  ap-scan-passive:
    type: enum
    raw_type: option
    description: Enable/disable passive scanning. Enable means do not send probe request on any channels (default = disable).
    default: disable
  ap-scan-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the AP to report detected rogue AP (-95 to -20, default
      = -90).
    default: '-90'
    max_length: 7
  ap-spoofing:
    type: enum
    raw_type: option
    description: Enable/disable AP spoofing detection (default = disable).
    default: disable
  asleap-attack:
    type: enum
    raw_type: option
    description: Enable/disable asleap attack detection (default = disable).
    default: disable
  assoc-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for association frame flooding.
    default: '30'
    min: 1
    max: 100
  assoc-flood-time:
    type: integer
    raw_type: integer
    description: Number of seconds after which a station is considered not connected.
    default: '10'
    min: 5
    max: 120
  assoc-frame-flood:
    type: enum
    raw_type: option
    description: Enable/disable association frame flooding detection (default = disable).
    default: disable
  auth-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for authentication frame flooding.
    default: '30'
    min: 1
    max: 100
  auth-flood-time:
    type: integer
    raw_type: integer
    description: Number of seconds after which a station is considered not connected.
    default: '10'
    min: 5
    max: 120
  auth-frame-flood:
    type: enum
    raw_type: option
    description: Enable/disable authentication frame flooding detection (default = disable).
    default: disable
  bcn-flood:
    type: enum
    raw_type: option
    description: Enable/disable bcn flood detection (default = disable).
    default: disable
  bcn-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for bcn flood.
    default: '15'
    min: 1
    max: 65100
  bcn-flood-time:
    type: integer
    raw_type: integer
    description: Detection Window Period.
    default: '1'
    min: 1
    max: 120
  beacon-wrong-channel:
    type: enum
    raw_type: option
    description: Enable/disable beacon wrong channel detection (default = disable).
    default: disable
  block_ack-flood:
    type: enum
    raw_type: option
    description: Enable/disable block_ack flood detection (default = disable).
    default: disable
  block_ack-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for block_ack flood.
    default: '50'
    min: 1
    max: 65100
  block_ack-flood-time:
    type: integer
    raw_type: integer
    description: Detection Window Period.
    default: '1'
    min: 1
    max: 120
  chan-based-mitm:
    type: enum
    raw_type: option
    description: Enable/disable channel based mitm detection (default = disable).
    default: disable
  client-flood:
    type: enum
    raw_type: option
    description: Enable/disable client flood detection (default = disable).
    default: disable
  client-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for client flood.
    default: '30'
    min: 1
    max: 65100
  client-flood-time:
    type: integer
    raw_type: integer
    description: Detection Window Period.
    default: '10'
    min: 1
    max: 120
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  cts-flood:
    type: enum
    raw_type: option
    description: Enable/disable cts flood detection (default = disable).
    default: disable
  cts-flood-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for cts flood.
    default: '30'
    min: 1
    max: 65100
  cts-flood-time:
    type: integer
    raw_type: integer
    description: Detection Window Period.
    default: '10'
    min: 1
    max: 120
  deauth-broadcast:
    type: enum
    raw_type: option
    description: Enable/disable broadcasting de-authentication detection (default = disable).
    default: disable
  deauth-unknown-src-thresh:
    type: integer
    raw_type: integer
    description: 'Threshold value per second to deauth unknown src for DoS attack (0: no limit).'
    default: '10'
    min: 0
    max: 65535
  disassoc-broadcast:
    type: enum
    raw_type: option
    description: Enable/disable broadcast dis-association detection (default = disable).
    default: disable
  disconnect-station:
    type: enum
    raw_type: option
    description: Enable/disable disconnect station detection (default = disable).
    default: disable
  eapol-fail-flood:
    type: enum
    raw_type: option
    description: Enable/disable EAPOL-Failure flooding (to AP) detection (default = disable).
    default: disable
  eapol-fail-intv:
    type: integer
    raw_type: integer
    description: The detection interval for EAPOL-Failure flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-fail-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for EAPOL-Failure flooding in specified interval.
    default: '10'
    min: 2
    max: 100
  eapol-key-overflow:
    type: enum
    raw_type: option
    description: Enable/disable overflow EAPOL key detection (default = disable).
    default: disable
  eapol-logoff-flood:
    type: enum
    raw_type: option
    description: Enable/disable EAPOL-Logoff flooding (to AP) detection (default = disable).
    default: disable
  eapol-logoff-intv:
    type: integer
    raw_type: integer
    description: The detection interval for EAPOL-Logoff flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-logoff-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for EAPOL-Logoff flooding in specified interval.
    default: '10'
    min: 2
    max: 100
  eapol-pre-fail-flood:
    type: enum
    raw_type: option
    description: Enable/disable premature EAPOL-Failure flooding (to STA) detection (default = disable).
    default: disable
  eapol-pre-fail-intv:
    type: integer
    raw_type: integer
    description: The detection interval for premature EAPOL-Failure flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-pre-fail-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for premature EAPOL-Failure flooding in specified interval.
    default: '10'
    min: 2
    max: 100
  eapol-pre-succ-flood:
    type: enum
    raw_type: option
    description: Enable/disable premature EAPOL-Success flooding (to STA) detection (default = disable).
    default: disable
  eapol-pre-succ-intv:
    type: integer
    raw_type: integer
    description: The detection interval for premature EAPOL-Success flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-pre-succ-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for premature EAPOL-Success flooding in specified interval.
    default: '10'
    min: 2
    max: 100
  eapol-start-flood:
    type: enum
    raw_type: option
    description: Enable/disable EAPOL-Start flooding (to AP) detection (default = disable).
    default: disable
  eapol-start-intv:
    type: integer
    raw_type: integer
    description: The detection interval for EAPOL-Start flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-start-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for EAPOL-Start flooding in specified interval.
    default: '10'
    min: 2
    max: 100
  eapol-succ-flood:
    type: enum
    raw_type: option
    description: Enable/disable EAPOL-Success flooding (to AP) detection (default = disable).
    default: disable
  eapol-succ-intv:
    type: integer
    raw_type: integer
    description: The detection interval for EAPOL-Success flooding (1 - 3600 sec).
    default: '1'
    min: 1
    max: 3600
  eapol-succ-thresh:
    type: integer
    raw_type: integer
    description: The threshold value for EAPOL-Success flooding in specified interval.
    default: '10'
    min: 2
    max: 100
