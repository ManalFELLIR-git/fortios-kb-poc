id: monitoring.npu-hpe
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/203871562/config-monitoring-npu-hpe
attributes:
  interval:
    type: integer
    raw_type: integer
    description: HPE status check interval (1 - 60 seconds, default = 1 second).
    default: '1'
    min: 1
    max: 60
  multipliers:
    type: string
    raw_type: user
    description: HPE type interval multipliers (12 integers from <1> to <255>, default = 4, 4, 4, 4, 8, 8, 8, 8, 8, 8, 8,
      8). An event log is generated after every (interval * multiplier)seconds as configured for any HPE type when drops occur
      for that HPE type. An attack log is generated after every (4 * multiplier) number of continuous event logs.
  status:
    type: enum
    raw_type: option
    description: Enable/disable HPE status monitoring.
    default: disable
children: {}
