id: nsxt.service-chain
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/203647089/config-nsxt-service-chain
attributes:
  id:
    type: integer
    raw_type: integer
    description: Chain ID.
    default: '0'
    min: 0
    max: 1023
  name:
    type: string
    raw_type: string
    description: Chain name.
    max_length: 63
children:
  service-index:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Service index.
        default: '0'
        min: 0
        max: 255
      name:
        type: string
        raw_type: string
        description: Index name.
        max_length: 63
      reverse-index:
        type: integer
        raw_type: integer
        description: Reverse service index.
        default: '1'
        min: 1
        max: 255
      vd:
        type: string
        raw_type: string
        description: VDOM name.
        max_length: 31
