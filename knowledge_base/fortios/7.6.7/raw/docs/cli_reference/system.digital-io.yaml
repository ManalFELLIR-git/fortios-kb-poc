id: system.digital-io
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/128753062/config-system-digital-io
attributes:
  input1-detection-mode:
    type: enum
    raw_type: option
    description: Set input1 to default(open|closed) or voltage(low|high).
    default: voltage
  input2-detection-mode:
    type: enum
    raw_type: option
    description: Set input2 to default(open|closed) or voltage(low|high).
    default: voltage
  output-keep-last-state:
    type: enum
    raw_type: option
    description: 'enable: keep the previous output state default|opposite after reboot.'
    default: disable
children: {}
