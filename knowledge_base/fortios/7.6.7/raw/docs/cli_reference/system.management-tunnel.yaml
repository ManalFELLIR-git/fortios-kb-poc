id: system.management-tunnel
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130600820/config-system-management-tunnel
attributes:
  allow-collect-statistics:
    type: enum
    raw_type: option
    description: Enable/disable collection of run time statistics.
    default: enable
  allow-config-restore:
    type: enum
    raw_type: option
    description: Enable/disable allow config restore.
    default: enable
  allow-push-configuration:
    type: enum
    raw_type: option
    description: Enable/disable push configuration.
    default: enable
  allow-push-firmware:
    type: enum
    raw_type: option
    description: Enable/disable push firmware.
    default: enable
  authorized-manager-only:
    type: enum
    raw_type: option
    description: Enable/disable restriction of authorized manager only.
    default: enable
  serial-number:
    type: string
    raw_type: user
    description: Serial number.
  status:
    type: enum
    raw_type: option
    description: Enable/disable FGFM tunnel.
    default: enable
children: {}
