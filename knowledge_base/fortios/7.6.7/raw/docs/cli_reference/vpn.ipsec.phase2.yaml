id: vpn.ipsec.phase2
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/143662319/config-vpn-ipsec-phase2
attributes:
  add-route:
    type: enum
    raw_type: option
    description: Enable/disable automatic route addition.
    default: phase1
  addke1:
    type: enum
    raw_type: option
    description: phase2 ADDKE1 group.
  addke2:
    type: enum
    raw_type: option
    description: phase2 ADDKE2 group.
  addke3:
    type: enum
    raw_type: option
    description: phase2 ADDKE3 group.
  addke4:
    type: enum
    raw_type: option
    description: phase2 ADDKE4 group.
  addke5:
    type: enum
    raw_type: option
    description: phase2 ADDKE5 group.
  addke6:
    type: enum
    raw_type: option
    description: phase2 ADDKE6 group.
  addke7:
    type: enum
    raw_type: option
    description: phase2 ADDKE7 group.
  auto-negotiate:
    type: enum
    raw_type: option
    description: Enable/disable IPsec SA auto-negotiation.
    default: disable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  dhcp-ipsec:
    type: enum
    raw_type: option
    description: Enable/disable DHCP-IPsec.
    default: disable
  dhgrp:
    type: enum
    raw_type: option
    description: Phase2 DH group.
    default: '20'
  diffserv:
    type: enum
    raw_type: option
    description: Enable/disable applying DSCP value to the IPsec tunnel outer IP header.
    default: disable
  diffservcode:
    type: string
    raw_type: user
    description: DSCP value to be applied to the IPsec tunnel outer IP header.
  dst-addr-type:
    type: enum
    raw_type: option
    description: Remote proxy ID type.
    default: subnet
  dst-end-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Remote proxy ID IPv4 end.
    default: 0.0.0.0
  dst-end-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Remote proxy ID IPv6 end.
    default: '::'
  dst-name:
    type: string
    raw_type: string
    description: Remote proxy ID name.
    max_length: 79
  dst-name6:
    type: string
    raw_type: string
    description: Remote proxy ID name.
    max_length: 79
  dst-port:
    type: integer
    raw_type: integer
    description: Quick mode destination port (1 - 65535 or 0 for all).
    default: '0'
    min: 0
    max: 65535
  dst-start-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Remote proxy ID IPv4 start.
    default: 0.0.0.0
  dst-start-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Remote proxy ID IPv6 start.
    default: '::'
  dst-subnet:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: Remote proxy ID IPv4 subnet.
    default: 0.0.0.0 0.0.0.0
  dst-subnet6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Remote proxy ID IPv6 subnet.
    default: ::/0
  encapsulation:
    type: enum
    raw_type: option
    description: ESP encapsulation mode.
    default: tunnel-mode
  inbound-dscp-copy:
    type: enum
    raw_type: option
    description: Enable/disable copying of the DSCP in the ESP header to the inner IP header.
    default: phase1
  initiator-ts-narrow:
    type: enum
    raw_type: option
    description: Enable/disable traffic selector narrowing for IKEv2 initiator.
    default: disable
  keepalive:
    type: enum
    raw_type: option
    description: Enable/disable keep alive.
    default: disable
  keylife-type:
    type: enum
    raw_type: option
    description: Keylife type.
    default: seconds
  keylifekbs:
    type: integer
    raw_type: integer
    description: Phase2 key life in number of kilobytes of traffic (5120 - 4294967295).
    default: '5120'
    min: 5120
    max: 4294967295
  keylifeseconds:
    type: integer
    raw_type: integer
    description: Phase2 key life in time in seconds (120 - 172800).
    default: '43200'
    min: 120
    max: 172800
  l2tp:
    type: enum
    raw_type: option
    description: Enable/disable L2TP over IPsec.
    default: disable
  name:
    type: string
    raw_type: string
    description: IPsec tunnel name.
    max_length: 35
  pfs:
    type: enum
    raw_type: option
    description: Enable/disable PFS feature.
    default: enable
  phase1name:
    type: string
    raw_type: string
    description: Phase 1 determines the options required for phase 2.
    max_length: 35
  proposal:
    type: enum
    raw_type: option
    description: Phase2 proposal.
  protocol:
    type: integer
    raw_type: integer
    description: Quick mode protocol selector (1 - 255 or 0 for all).
    default: '0'
    min: 0
    max: 255
  replay:
    type: enum
    raw_type: option
    description: Enable/disable replay detection.
    default: enable
  route-overlap:
    type: enum
    raw_type: option
    description: Action for overlapping routes.
    default: use-new
  selector-match:
    type: enum
    raw_type: option
    description: Match type to use when comparing selectors.
    default: auto
  single-source:
    type: enum
    raw_type: option
    description: Enable/disable single source IP restriction.
    default: disable
  src-addr-type:
    type: enum
    raw_type: option
    description: Local proxy ID type.
    default: subnet
  src-end-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Local proxy ID end.
    default: 0.0.0.0
  src-end-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Local proxy ID IPv6 end.
    default: '::'
  src-name:
    type: string
    raw_type: string
    description: Local proxy ID name.
    max_length: 79
  src-name6:
    type: string
    raw_type: string
    description: Local proxy ID name.
    max_length: 79
  src-port:
    type: integer
    raw_type: integer
    description: Quick mode source port (1 - 65535 or 0 for all).
    default: '0'
    min: 0
    max: 65535
  src-start-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Local proxy ID start.
    default: 0.0.0.0
  src-start-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Local proxy ID IPv6 start.
    default: '::'
  src-subnet:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: Local proxy ID subnet.
    default: 0.0.0.0 0.0.0.0
  src-subnet6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Local proxy ID IPv6 subnet.
    default: ::/0
  use-natip:
    type: enum
    raw_type: option
    description: Enable to use the FortiGate public IP as the source selector when outbound NAT is used.
    default: enable
children: {}
