id: user.fortitoken
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/694071898/config-user-fortitoken
attributes:
  activation-code:
    type: string
    raw_type: string
    description: Mobile token user activation-code.
    max_length: 32
  activation-expire:
    type: integer
    raw_type: integer
    description: Mobile token user activation-code expire time.
    default: '0'
    min: 0
    max: 4294967295
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  license:
    type: string
    raw_type: string
    description: Mobile token license.
    max_length: 31
  os-ver:
    type: string
    raw_type: string
    description: Device Mobile Version.
    max_length: 15
  reg-id:
    type: string
    raw_type: string
    description: Device Reg ID.
    max_length: 256
  seed:
    type: string
    raw_type: string
    description: Token seed.
    max_length: 208
  serial-number:
    type: string
    raw_type: string
    description: Serial number.
    max_length: 16
  status:
    type: enum
    raw_type: option
    description: Status.
    default: active
children: {}
