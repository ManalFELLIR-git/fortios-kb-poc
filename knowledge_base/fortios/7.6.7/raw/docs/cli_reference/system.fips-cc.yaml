id: system.fips-cc
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/102385268/config-system-fips-cc
attributes:
  key-generation-self-test:
    type: enum
    raw_type: option
    description: Enable/disable self tests after key generation.
    default: disable
  self-test-period:
    type: integer
    raw_type: integer
    description: Self test period.
    default: '1440'
    min: 5
    max: 1440
  status:
    type: enum
    raw_type: option
    description: Enable/disable ciphers for FIPS mode of operation.
    default: disable
children: {}
