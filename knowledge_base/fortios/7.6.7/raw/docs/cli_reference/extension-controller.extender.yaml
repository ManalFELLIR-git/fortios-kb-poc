id: extension-controller.extender
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/278860181/config-extension-controller-extender
attributes:
  allowaccess:
    type: enum
    raw_type: option
    description: Control management access to the managed extender. Separate entries with a space.
  authorized:
    type: enum
    raw_type: option
    description: FortiExtender Administration (enable or disable).
    default: discovered
  bandwidth-limit:
    type: integer
    raw_type: integer
    description: FortiExtender LAN extension bandwidth limit (Mbps).
    default: '1024'
    min: 1
    max: 16776000
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 255
  device-id:
    type: integer
    raw_type: integer
    description: Device ID.
    default: '1026'
    min: 0
    max: 4294967295
  enforce-bandwidth:
    type: enum
    raw_type: option
    description: Enable/disable enforcement of bandwidth on LAN extension interface.
    default: disable
  ext-name:
    type: string
    raw_type: string
    description: FortiExtender name.
    max_length: 31
  extension-type:
    type: enum
    raw_type: option
    description: Extension type for this FortiExtender.
  firmware-provision-latest:
    type: enum
    raw_type: option
    description: Enable/disable one-time automatic provisioning of the latest firmware version.
    default: disable
  id:
    type: string
    raw_type: string
    description: FortiExtender serial number.
    max_length: 19
  login-password:
    type: password
    raw_type: password
    description: Set the managed extender's administrator password.
  login-password-change:
    type: enum
    raw_type: option
    description: Change or reset the administrator password of a managed extender (yes, default, or no, default = no).
    default: 'no'
  name:
    type: string
    raw_type: string
    description: FortiExtender entry name.
    max_length: 19
  override-allowaccess:
    type: enum
    raw_type: option
    description: Enable to override the extender profile management access configuration.
    default: disable
  override-enforce-bandwidth:
    type: enum
    raw_type: option
    description: Enable to override the extender profile enforce-bandwidth setting.
    default: disable
  override-login-password-change:
    type: enum
    raw_type: option
    description: Enable to override the extender profile login-password (administrator password) setting.
    default: disable
  profile:
    type: string
    raw_type: string
    description: FortiExtender profile configuration.
    max_length: 31
  vdom:
    type: integer
    raw_type: integer
    description: VDOM. Read-only.
    default: '1'
    min: 0
    max: 4294967295
children:
  wan-extension:
    attributes:
      modem1-extension:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem1-pdn1-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem1-pdn2-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem1-pdn3-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem1-pdn4-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem2-extension:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem2-pdn1-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem2-pdn2-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem2-pdn3-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
      modem2-pdn4-interface:
        type: string
        raw_type: string
        description: FortiExtender interface name.
        max_length: 31
