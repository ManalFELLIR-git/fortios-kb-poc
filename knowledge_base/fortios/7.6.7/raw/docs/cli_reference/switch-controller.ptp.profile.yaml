id: switch-controller.ptp.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/162177657/config-switch-controller-ptp-profile
attributes:
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 63
  domain:
    type: integer
    raw_type: integer
    description: Configure PTP domain value (0 - 255, default = 254).
    default: '254'
    min: 0
    max: 255
  mode:
    type: enum
    raw_type: option
    description: Select PTP mode.
    default: transparent-e2e
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 63
  pdelay-req-interval:
    type: enum
    raw_type: option
    description: Configure PTP peer delay request interval.
    default: 1sec
  ptp-profile:
    type: enum
    raw_type: option
    description: Configure PTP power profile.
    default: C37.238-2017
  transport:
    type: enum
    raw_type: option
    description: Configure PTP transport mode.
    default: l2-mcast
children: {}
