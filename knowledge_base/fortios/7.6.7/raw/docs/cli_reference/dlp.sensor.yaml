id: dlp.sensor
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/329567803/config-dlp-sensor
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  eval:
    type: string
    raw_type: string
    description: Expression to evaluate.
    max_length: 255
  match-type:
    type: enum
    raw_type: option
    description: Logical relation between entries (default = match-any).
    default: match-any
  name:
    type: string
    raw_type: string
    description: Name of table containing the sensor.
    max_length: 35
children:
  entries:
    attributes:
      count:
        type: integer
        raw_type: integer
        description: Count of dictionary matches to trigger sensor entry match (Dictionary might not be able to trigger more
          than once based on its 'repeat' option, 1 - 255, default = 1).
        default: '1'
        min: 1
        max: 255
      dictionary:
        type: string
        raw_type: string
        description: Select a DLP dictionary or exact-data-match.
        max_length: 35
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 1
        max: 32
      status:
        type: enum
        raw_type: option
        description: Enable/disable this entry.
        default: enable
