id: web-proxy.fast-fallback
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/463563456/config-web-proxy-fast-fallback
attributes:
  connection-mode:
    type: enum
    raw_type: option
    description: Connection mode for multiple destinations.
    default: sequentially
  connection-timeout:
    type: integer
    raw_type: integer
    description: Number of milliseconds to wait before starting another connection (200 - 1800000, default = 200). For sequential
      connection-mode only.
    default: '200'
    min: 200
    max: 1800000
  name:
    type: string
    raw_type: string
    description: Configure a name for the fast-fallback entry.
    max_length: 63
  protocol:
    type: enum
    raw_type: option
    description: Connection protocols for multiple destinations.
    default: IPv4-first
  status:
    type: enum
    raw_type: option
    description: Enable/disable the fast-fallback entry.
    default: enable
children: {}
