id: router.access-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/291768841/config-router-access-list
attributes:
  comments:
    type: string
    raw_type: string
    description: Comment.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Permit or deny this IP address and netmask prefix.
        default: permit
      exact-match:
        type: enum
        raw_type: option
        description: Enable/disable exact match.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
      prefix:
        type: string
        raw_type: user
        description: IPv4 prefix to define regular filter criteria, such as "any" or subnets.
      wildcard:
        type: string
        raw_type: user
        description: Wildcard to define Cisco-style wildcard filter criteria.
