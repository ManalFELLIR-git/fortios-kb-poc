id: endpoint-control.fctems-override
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/774217896/config-endpoint-control-fctems-override
attributes:
  call-timeout:
    type: integer
    raw_type: integer
    description: FortiClient EMS call timeout in seconds (1 - 180 seconds, default = 30).
    default: '30'
    min: 1
    max: 180
  capabilities:
    type: enum
    raw_type: option
    description: List of EMS capabilities.
  cloud-authentication-access-key:
    type: password
    raw_type: password
    description: FortiClient EMS Cloud multitenancy access key
  dirty-reason:
    type: enum
    raw_type: option
    description: Dirty Reason for FortiClient EMS.
    default: none
  ems-id:
    type: integer
    raw_type: integer
    description: EMS ID in order (1 - 7).
    default: '0'
    min: 1
    max: 7
  fortinetone-cloud-authentication:
    type: enum
    raw_type: option
    description: Enable/disable authentication of FortiClient EMS Cloud through FortiCloud account.
    default: disable
  https-port:
    type: integer
    raw_type: integer
    description: 'FortiClient EMS HTTPS access port number. (1 - 65535, default: 443).'
    default: '443'
    min: 1
    max: 65535
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  name:
    type: string
    raw_type: string
    description: FortiClient Enterprise Management Server (EMS) name.
    max_length: 35
  out-of-sync-threshold:
    type: integer
    raw_type: integer
    description: Outdated resource threshold in seconds (10 - 3600, default = 180).
    default: '180'
    min: 10
    max: 3600
  pull-malware-hash:
    type: enum
    raw_type: option
    description: Enable/disable pulling FortiClient malware hash from EMS.
    default: enable
  pull-sysinfo:
    type: enum
    raw_type: option
    description: Enable/disable pulling SysInfo from EMS.
    default: enable
  pull-tags:
    type: enum
    raw_type: option
    description: Enable/disable pulling FortiClient user tags from EMS.
    default: enable
  pull-vulnerabilities:
    type: enum
    raw_type: option
    description: Enable/disable pulling vulnerabilities from EMS.
    default: enable
  send-tags-to-all-vdoms:
    type: enum
    raw_type: option
    description: Relax restrictions on tags to send all EMS tags to all VDOMs
    default: disable
  serial-number:
    type: string
    raw_type: string
    description: EMS Serial Number.
    max_length: 16
  server:
    type: string
    raw_type: string
    description: FortiClient EMS FQDN or IPv4 address.
    max_length: 255
  source-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: REST API call source IP.
    default: 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable or disable this EMS configuration.
    default: disable
  tenant-id:
    type: string
    raw_type: string
    description: EMS Tenant ID.
    max_length: 32
  trust-ca-cn:
    type: enum
    raw_type: option
    description: Enable/disable trust of the EMS certificate issuer(CA) and common name(CN) for certificate auto-renewal.
    default: enable
  verifying-ca:
    type: string
    raw_type: string
    description: Lowest CA cert on Fortigate in verified EMS cert chain.
    max_length: 79
  websocket-override:
    type: enum
    raw_type: option
    description: Enable/disable override behavior for how this FortiGate unit connects to EMS using a WebSocket connection.
    default: disable
children: {}
