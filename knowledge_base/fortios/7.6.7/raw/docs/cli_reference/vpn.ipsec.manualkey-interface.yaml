id: vpn.ipsec.manualkey-interface
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/263813893/config-vpn-ipsec-manualkey-interface
attributes:
  addr-type:
    type: enum
    raw_type: option
    description: IP version to use for IP packets.
    default: '4'
  auth-alg:
    type: enum
    raw_type: option
    description: Authentication algorithm. Must be the same for both ends of the tunnel.
    default: 'null'
  auth-key:
    type: string
    raw_type: user
    description: Hexadecimal authentication key in 16-digit (8-byte) segments separated by hyphens.
  enc-alg:
    type: enum
    raw_type: option
    description: Encryption algorithm. Must be the same for both ends of the tunnel.
    default: 'null'
  enc-key:
    type: string
    raw_type: user
    description: Hexadecimal encryption key in 16-digit (8-byte) segments separated by hyphens.
  interface:
    type: string
    raw_type: string
    description: Name of the physical, aggregate, or VLAN interface.
    max_length: 15
  ip-version:
    type: enum
    raw_type: option
    description: IP version to use for VPN interface.
    default: '4'
  local-gw:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 address of the local gateway's external interface.
    default: 0.0.0.0
  local-gw6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Local IPv6 address of VPN gateway.
    default: '::'
  local-spi:
    type: string
    raw_type: user
    description: Local SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
  name:
    type: string
    raw_type: string
    description: IPsec tunnel name.
    max_length: 15
  npu-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading IPsec VPN manual key sessions to NPUs.
    default: enable
  remote-gw:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address of the remote gateway's external interface.
    default: 0.0.0.0
  remote-gw6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Remote IPv6 address of VPN gateway.
    default: '::'
  remote-spi:
    type: string
    raw_type: user
    description: Remote SPI, a hexadecimal 8-digit (4-byte) tag. Discerns between two traffic streams with different encryption
      rules.
children: {}
