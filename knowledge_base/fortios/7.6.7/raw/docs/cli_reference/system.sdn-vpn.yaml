id: system.sdn-vpn
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/542883509/config-system-sdn-vpn
attributes:
  bgp-as:
    type: integer
    raw_type: integer
    description: BGP Router AS number.
    default: '65000'
    min: 1
    max: 4294967295
  cgw-gateway:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Public IP address of the customer gateway.
    default: 0.0.0.0
  cgw-name:
    type: string
    raw_type: string
    description: AWS customer gateway name to be created.
    max_length: 35
  code:
    type: integer
    raw_type: integer
    description: SDN VPN error code. Read-only.
    default: '0'
    min: 0
    max: 255
  internal-interface:
    type: string
    raw_type: string
    description: Internal interface with local subnet.
    max_length: 15
  local-cidr:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Local subnet address and subnet mask.
    default: 0.0.0.0 0.0.0.0
  name:
    type: string
    raw_type: string
    description: Public cloud VPN name.
    max_length: 35
  nat-traversal:
    type: enum
    raw_type: option
    description: Enable/disable use for NAT traversal. Please enable if your FortiGate device is behind a NAT/PAT device.
    default: enable
  psksecret:
    type: password-3
    raw_type: password-3
    description: Pre-shared secret for PSK authentication. Auto-generated if not specified
  remote-cidr:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Remote subnet address and subnet mask.
    default: 0.0.0.0 0.0.0.0
  remote-type:
    type: enum
    raw_type: option
    description: Type of remote device.
    default: vgw
  routing-type:
    type: enum
    raw_type: option
    description: Type of routing.
    default: dynamic
  sdn:
    type: string
    raw_type: string
    description: SDN connector name.
    max_length: 35
  status:
    type: integer
    raw_type: integer
    description: SDN VPN status. Read-only.
    default: '0'
    min: 0
    max: 255
  subnet-id:
    type: string
    raw_type: string
    description: AWS subnet id for TGW route propagation.
    max_length: 63
  tgw-id:
    type: string
    raw_type: string
    description: Transit gateway id.
    max_length: 63
  tunnel-interface:
    type: string
    raw_type: string
    description: Tunnel interface with public IP.
    max_length: 15
  type:
    type: integer
    raw_type: integer
    description: SDN VPN type. Read-only.
    default: '0'
    min: 0
    max: 65535
  vgw-id:
    type: string
    raw_type: string
    description: Virtual private gateway id.
    max_length: 63
children: {}
