id: system.fortidata
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/184642133/config-system-fortidata
attributes:
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  source-ip:
    type: string
    raw_type: user
    description: Source IPv4 address used to communicate with FortiData.
  status:
    type: enum
    raw_type: option
    description: Enable/disable FortiData.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
