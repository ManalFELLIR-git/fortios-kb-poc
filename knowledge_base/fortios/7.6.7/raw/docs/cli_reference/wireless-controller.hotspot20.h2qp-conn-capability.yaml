id: wireless-controller.hotspot20.h2qp-conn-capability
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/301729542/config-wireless-controller-hotspot20-h2qp-conn-capability
attributes:
  esp-port:
    type: enum
    raw_type: option
    description: Set ESP port service (used by IPsec VPNs) status.
    default: unknown
  ftp-port:
    type: enum
    raw_type: option
    description: Set FTP port service status.
    default: unknown
  http-port:
    type: enum
    raw_type: option
    description: Set HTTP port service status.
    default: unknown
  icmp-port:
    type: enum
    raw_type: option
    description: Set ICMP port service status.
    default: unknown
  ikev2-port:
    type: enum
    raw_type: option
    description: Set IKEv2 port service for IPsec VPN status.
    default: unknown
  ikev2-xx-port:
    type: enum
    raw_type: option
    description: Set UDP port 4500 (which may be used by IKEv2 for IPsec VPN) service status.
    default: unknown
  name:
    type: string
    raw_type: string
    description: Connection capability name.
    max_length: 35
  pptp-vpn-port:
    type: enum
    raw_type: option
    description: Set Point to Point Tunneling Protocol (PPTP) VPN port service status.
    default: unknown
  ssh-port:
    type: enum
    raw_type: option
    description: Set SSH port service status.
    default: unknown
  tls-port:
    type: enum
    raw_type: option
    description: Set TLS VPN (HTTPS) port service status.
    default: unknown
  voip-tcp-port:
    type: enum
    raw_type: option
    description: Set VoIP TCP port service status.
    default: unknown
  voip-udp-port:
    type: enum
    raw_type: option
    description: Set VoIP UDP port service status.
    default: unknown
children: {}
