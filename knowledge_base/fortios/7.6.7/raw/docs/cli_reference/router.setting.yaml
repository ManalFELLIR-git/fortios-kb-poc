id: router.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/263404019/config-router-setting
attributes:
  hostname:
    type: string
    raw_type: string
    description: Hostname for this virtual domain router.
    max_length: 14
  kernel-route-distance:
    type: integer
    raw_type: integer
    description: Administrative distance for routes learned from kernel (0 - 255).
    default: '255'
    min: 0
    max: 255
  show-filter:
    type: string
    raw_type: string
    description: Prefix-list as filter for showing routes.
    max_length: 35
children: {}
