id: system.npu-setting.prp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/656612232/config-system-npu-setting-prp
attributes:
  prp-port-in:
    type: string
    raw_type: string
    description: Ingress port configured to allow the PRP trailer not be stripped off when the PRP packets come in. All of
      the traffic originating from these ports will always be sent to the host. Physical interface name.
    max_length: 35
  prp-port-out:
    type: string
    raw_type: string
    description: Egress port configured to allow the PRP trailer not be stripped off when the PRP packets go out. Physical
      interface name.
    max_length: 35
children: {}
