id: file-filter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/317994547/config-file-filter-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  extended-log:
    type: enum
    raw_type: option
    description: Enable/disable file-filter extended logging.
    default: disable
  feature-set:
    type: enum
    raw_type: option
    description: Flow/proxy feature set.
    default: flow
  log:
    type: enum
    raw_type: option
    description: Enable/disable file-filter logging.
    default: enable
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group.
    max_length: 35
  scan-archive-contents:
    type: enum
    raw_type: option
    description: Enable/disable archive contents scan.
    default: enable
children:
  rules:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action taken for matched file.
        default: log-only
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      direction:
        type: enum
        raw_type: option
        description: Traffic direction (HTTP, FTP, SSH, WEBSOCKET, CIFS, and MAPI only).
        default: any
      file-type:
        type: string
        raw_type: string
        description: Select file type. File type name.
        max_length: 39
      name:
        type: string
        raw_type: string
        description: File-filter rule name.
        max_length: 35
      password-protected:
        type: enum
        raw_type: option
        description: Match password-protected files.
        default: any
      protocol:
        type: enum
        raw_type: option
        description: Protocols to apply rule to.
        default: http ftp smtp imap pop3 mapi cifs ssh websocket **
