id: log.fortianalyzer3.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260538855/config-log-fortianalyzer3-setting
attributes:
  access-config:
    type: enum
    raw_type: option
    description: Enable/disable FortiAnalyzer access to configuration and data.
    default: enable
  alt-server:
    type: string
    raw_type: string
    description: Alternate FortiAnalyzer.
    max_length: 127
  certificate:
    type: string
    raw_type: string
    description: Certificate used to communicate with FortiAnalyzer.
    max_length: 35
  certificate-verification:
    type: enum
    raw_type: option
    description: Enable/disable identity verification of FortiAnalyzer by use of certificate.
    default: enable
  conn-timeout:
    type: integer
    raw_type: integer
    description: FortiAnalyzer connection time-out in seconds (for status and log buffer).
    default: '10'
    min: 1
    max: 3600
  enc-algorithm:
    type: enum
    raw_type: option
    description: Configure the level of SSL protection for secure communication with FortiAnalyzer.
    default: high
  fallback-to-primary:
    type: enum
    raw_type: option
    description: Enable/disable this FortiGate unit to fallback to the primary FortiAnalyzer when it is available.
    default: enable
  hmac-algorithm:
    type: enum
    raw_type: option
    description: OFTP login hash algorithm.
    default: sha256
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ips-archive:
    type: enum
    raw_type: option
    description: Enable/disable IPS packet archive logging.
    default: enable
  max-log-rate:
    type: integer
    raw_type: integer
    description: FortiAnalyzer maximum log rate in MBps (0 = unlimited).
    default: '0'
    min: 0
    max: 100000
  monitor-failure-retry-period:
    type: integer
    raw_type: integer
    description: Time between FortiAnalyzer connection retries in seconds (for status and log buffer).
    default: '5'
    min: 1
    max: 86400
  monitor-keepalive-period:
    type: integer
    raw_type: integer
    description: Time between OFTP keepalives in seconds (for status and log buffer).
    default: '5'
    min: 1
    max: 120
  preshared-key:
    type: string
    raw_type: string
    description: Preshared-key used for auto-authorization on FortiAnalyzer.
    max_length: 63
  priority:
    type: enum
    raw_type: option
    description: Set log transmission priority.
    default: default
  reliable:
    type: enum
    raw_type: option
    description: Enable/disable reliable logging to FortiAnalyzer.
    default: disable
  serial:
    type: string
    raw_type: string
    description: Serial numbers of the FortiAnalyzer. Serial Number.
    max_length: 79
  server:
    type: string
    raw_type: string
    description: The remote FortiAnalyzer.
    max_length: 127
  server-cert-ca:
    type: string
    raw_type: string
    description: Mandatory CA on FortiGate in certificate chain of server.
    max_length: 79
  source-ip:
    type: string
    raw_type: string
    description: Source IPv4 or IPv6 address used to communicate with FortiAnalyzer.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  status:
    type: enum
    raw_type: option
    description: Enable/disable logging to FortiAnalyzer.
    default: disable
  upload-day:
    type: string
    raw_type: user
    description: Day of week (month) to upload logs.
  upload-interval:
    type: enum
    raw_type: option
    description: Frequency to upload log files to FortiAnalyzer.
    default: daily
  upload-option:
    type: enum
    raw_type: option
    description: Enable/disable logging to hard disk and then uploading to FortiAnalyzer.
    default: 5-minute
  upload-time:
    type: string
    raw_type: user
    description: Time to upload logs (hh:mm).
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
