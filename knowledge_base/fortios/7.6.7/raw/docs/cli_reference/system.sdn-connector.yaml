id: system.sdn-connector
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/783867834/config-system-sdn-connector
attributes:
  access-key:
    type: string
    raw_type: string
    description: AWS / ACS access key ID.
    max_length: 31
  alt-resource-ip:
    type: enum
    raw_type: option
    description: Enable/disable AWS alternative resource IP.
    default: disable
  api-key:
    type: password
    raw_type: password
    description: IBM cloud API key or service ID API key.
  azure-region:
    type: enum
    raw_type: option
    description: Azure server region.
    default: global
  client-id:
    type: string
    raw_type: string
    description: Azure client ID (application ID).
    max_length: 63
  client-secret:
    type: password
    raw_type: password
    description: Azure client secret (application key).
  domain:
    type: string
    raw_type: string
    description: Domain name.
    max_length: 127
  group-name:
    type: string
    raw_type: string
    description: Full path group name of computers.
    max_length: 127
  ha-status:
    type: enum
    raw_type: option
    description: Enable/disable use for FortiGate HA service.
    default: disable
  ibm-region:
    type: enum
    raw_type: option
    description: IBM cloud region name.
    default: dallas
  login-endpoint:
    type: string
    raw_type: string
    description: Azure Stack login endpoint.
    max_length: 127
  message-server-port:
    type: integer
    raw_type: integer
    description: HTTP port number of the SAP message server.
    default: '0'
    min: 0
    max: 65535
  microsoft-365:
    type: enum
    raw_type: option
    description: Enable to use as Microsoft 365 connector.
    default: disable
  name:
    type: string
    raw_type: string
    description: SDN connector name.
    max_length: 35
  oci-cert:
    type: string
    raw_type: string
    description: OCI certificate.
    max_length: 63
  oci-fingerprint:
    type: string
    raw_type: string
    description: OCI pubkey fingerprint. Read-only.
    max_length: 63
  oci-region-type:
    type: enum
    raw_type: option
    description: OCI region type.
    default: commercial
  par-id:
    type: string
    raw_type: string
    description: Public address range ID.
    max_length: 63
  password:
    type: password_aes256
    raw_type: password_aes256
    description: Password of the remote SDN connector as login credentials.
  private-key:
    type: string
    raw_type: user
    description: Private key of GCP service account.
  proxy:
    type: string
    raw_type: string
    description: SDN proxy.
    max_length: 35
  region:
    type: string
    raw_type: string
    description: AWS / ACS region name.
    max_length: 31
  resource-group:
    type: string
    raw_type: string
    description: Azure resource group.
    max_length: 63
  resource-url:
    type: string
    raw_type: string
    description: Azure Stack resource URL.
    max_length: 127
  secret-key:
    type: password
    raw_type: password
    description: AWS / ACS secret access key.
  secret-token:
    type: string
    raw_type: user
    description: Secret token of Kubernetes service account.
  server:
    type: string
    raw_type: string
    description: Server address of the remote SDN connector.
    max_length: 127
  server-ca-cert:
    type: string
    raw_type: string
    description: Trust only those servers whose certificate is directly/indirectly signed by this certificate.
    max_length: 127
  server-cert:
    type: string
    raw_type: string
    description: Trust servers that contain this certificate only.
    max_length: 127
  server-list:
    type: string
    raw_type: string
    description: Server address list of the remote SDN connector. IPv4 address.
    max_length: 15
  server-port:
    type: integer
    raw_type: integer
    description: Port number of the remote SDN connector.
    default: '0'
    min: 0
    max: 65535
  service-account:
    type: string
    raw_type: string
    description: GCP service account email.
    max_length: 127
  status:
    type: enum
    raw_type: option
    description: Enable/disable connection to the remote SDN connector.
    default: enable
  subscription-id:
    type: string
    raw_type: string
    description: Azure subscription ID.
    max_length: 63
  tenant-id:
    type: string
    raw_type: string
    description: Tenant ID (directory ID).
    max_length: 127
  type:
    type: enum
    raw_type: option
    description: Type of SDN connector.
    default: aws
  update-interval:
    type: integer
    raw_type: integer
    description: Dynamic object update interval (30 - 3600 sec, default = 60, 0 = disabled).
    default: '60'
    min: 0
    max: 3600
  use-metadata-iam:
    type: enum
    raw_type: option
    description: Enable/disable use of IAM role from metadata to call API.
    default: disable **
  user-id:
    type: string
    raw_type: string
    description: User ID.
    max_length: 127
  username:
    type: string
    raw_type: string
    description: Username of the remote SDN connector as login credentials.
    max_length: 64
  vcenter-password:
    type: password_aes256
    raw_type: password_aes256
    description: vCenter server password for NSX quarantine.
  vcenter-server:
    type: string
    raw_type: string
    description: vCenter server address for NSX quarantine.
    max_length: 127
  vcenter-username:
    type: string
    raw_type: string
    description: vCenter server username for NSX quarantine.
    max_length: 64
  vdom:
    type: string
    raw_type: string
    description: Virtual domain name of the remote SDN connector.
    max_length: 31
  verify-certificate:
    type: enum
    raw_type: option
    description: Enable/disable server certificate verification.
    default: enable
  vpc-id:
    type: string
    raw_type: string
    description: AWS VPC ID.
    max_length: 31
children:
  compartment-list:
    attributes:
      compartment-id:
        type: string
        raw_type: string
        description: OCI compartment ID.
        max_length: 127
  external-account-list:
    attributes:
      external-id:
        type: string
        raw_type: string
        description: AWS external ID.
        max_length: 1399
      region-list:
        type: string
        raw_type: string
        description: AWS region name list. AWS region name.
        max_length: 31
      role-arn:
        type: string
        raw_type: string
        description: AWS role ARN to assume.
        max_length: 2047
  external-ip:
    attributes:
      name:
        type: string
        raw_type: string
        description: External IP name.
        max_length: 63
  forwarding-rule:
    attributes:
      rule-name:
        type: string
        raw_type: string
        description: Forwarding rule name.
        max_length: 63
      target:
        type: string
        raw_type: string
        description: Target instance name.
        max_length: 63
  gcp-project-list:
    attributes:
      gcp-zone-list:
        type: string
        raw_type: string
        description: Configure GCP zone list. GCP zone name.
        max_length: 127
      id:
        type: string
        raw_type: string
        description: GCP project ID.
        max_length: 127
  nic:
    attributes:
      name:
        type: string
        raw_type: string
        description: Network interface name.
        max_length: 63
      peer-nic:
        type: string
        raw_type: string
        description: Peer network interface name.
        max_length: 63
  ip:
    attributes:
      name:
        type: string
        raw_type: string
        description: IP configuration name.
        max_length: 63
      private-ip:
        type: string
        raw_type: string
        description: Private IP address.
        max_length: 39
      public-ip:
        type: string
        raw_type: string
        description: Public IP name.
        max_length: 63
      resource-group:
        type: string
        raw_type: string
        description: Resource group of Azure public IP.
        max_length: 63
  oci-region-list:
    attributes:
      region:
        type: string
        raw_type: string
        description: OCI region.
        max_length: 31
  route:
    attributes:
      name:
        type: string
        raw_type: string
        description: Route name.
        max_length: 63
      next-hop:
        type: string
        raw_type: string
        description: Next hop address.
        max_length: 127
  route-table:
    attributes:
      name:
        type: string
        raw_type: string
        description: Route table name.
        max_length: 63
      resource-group:
        type: string
        raw_type: string
        description: Resource group of Azure route table.
        max_length: 63
      subscription-id:
        type: string
        raw_type: string
        description: Subscription ID of Azure route table.
        max_length: 63
