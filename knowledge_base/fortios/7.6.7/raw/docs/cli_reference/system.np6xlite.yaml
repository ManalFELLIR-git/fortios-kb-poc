id: system.np6xlite
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/148956957/config-system-np6xlite
attributes:
  congestion-handling-mode:
    type: enum
    raw_type: option
    description: Configure Marvell switch packet congestion handling.
    default: head-of-line
  fastpath:
    type: enum
    raw_type: option
    description: Enable/disable NP6XLITE offloading (also called fast path).
    default: enable
  ipsec-inner-fragment:
    type: enum
    raw_type: option
    description: 'Enable/disable NP6XLite IPsec fragmentation type: inner.'
    default: disable
  ipsec-sts-timeout:
    type: enum
    raw_type: option
    description: Set NP6XLite IPsec STS message timeout.
    default: '5'
  ipsec-throughput-msg-frequency:
    type: enum
    raw_type: option
    description: Set NP6XLite IPsec throughput message frequency (0 = disable).
    default: disable
  name:
    type: string
    raw_type: string
    description: Device Name.
    max_length: 31
  per-session-accounting:
    type: enum
    raw_type: option
    description: Enable/disable per-session accounting.
    default: traffic-log-only
  session-timeout-interval:
    type: integer
    raw_type: integer
    description: Set session timeout interval (0 - 1000 sec, default 40 sec).
    default: '40'
    min: 0
    max: 1000
children:
  fp-anomaly:
    attributes:
      icmp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 ICMP checksum anomalies.
        default: drop
      icmp-frag:
        type: enum
        raw_type: option
        description: Layer 3 fragmented packets that could be part of layer 4 ICMP anomalies.
        default: allow
      icmp-land:
        type: enum
        raw_type: option
        description: ICMP land anomalies.
        default: trap-to-host
      ipv4-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 IP checksum anomalies.
        default: drop
      ipv4-land:
        type: enum
        raw_type: option
        description: Land anomalies.
        default: trap-to-host
      ipv4-optlsrr:
        type: enum
        raw_type: option
        description: Loose source record route option anomalies.
        default: trap-to-host
      ipv4-optrr:
        type: enum
        raw_type: option
        description: Record route option anomalies.
        default: trap-to-host
      ipv4-optsecurity:
        type: enum
        raw_type: option
        description: Security option anomalies.
        default: trap-to-host
      ipv4-optssrr:
        type: enum
        raw_type: option
        description: Strict source record route option anomalies.
        default: trap-to-host
      ipv4-optstream:
        type: enum
        raw_type: option
        description: Stream option anomalies.
        default: trap-to-host
      ipv4-opttimestamp:
        type: enum
        raw_type: option
        description: Timestamp option anomalies.
        default: trap-to-host
      ipv4-proto-err:
        type: enum
        raw_type: option
        description: Invalid layer 4 protocol anomalies.
        default: trap-to-host
      ipv4-unknopt:
        type: enum
        raw_type: option
        description: Unknown option anomalies.
        default: trap-to-host
      ipv6-daddr-err:
        type: enum
        raw_type: option
        description: Destination address as unspecified or loopback address anomalies.
        default: trap-to-host
      ipv6-land:
        type: enum
        raw_type: option
        description: Land anomalies.
        default: trap-to-host
      ipv6-optendpid:
        type: enum
        raw_type: option
        description: End point identification anomalies.
        default: trap-to-host
      ipv6-opthomeaddr:
        type: enum
        raw_type: option
        description: Home address option anomalies.
        default: trap-to-host
      ipv6-optinvld:
        type: enum
        raw_type: option
        description: Invalid option anomalies.Invalid option anomalies.
        default: trap-to-host
      ipv6-optjumbo:
        type: enum
        raw_type: option
        description: Jumbo options anomalies.
        default: trap-to-host
      ipv6-optnsap:
        type: enum
        raw_type: option
        description: Network service access point address option anomalies.
        default: trap-to-host
      ipv6-optralert:
        type: enum
        raw_type: option
        description: Router alert option anomalies.
        default: trap-to-host
      ipv6-opttunnel:
        type: enum
        raw_type: option
        description: Tunnel encapsulation limit option anomalies.
        default: trap-to-host
      ipv6-proto-err:
        type: enum
        raw_type: option
        description: Layer 4 invalid protocol anomalies.
        default: trap-to-host
      ipv6-saddr-err:
        type: enum
        raw_type: option
        description: Source address as multicast anomalies.
        default: trap-to-host
      ipv6-unknopt:
        type: enum
        raw_type: option
        description: Unknown option anomalies.
        default: trap-to-host
      tcp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 TCP checksum anomalies.
        default: drop
      tcp-fin-noack:
        type: enum
        raw_type: option
        description: TCP SYN flood with FIN flag set without ACK setting anomalies.
        default: trap-to-host
      tcp-fin-only:
        type: enum
        raw_type: option
        description: TCP SYN flood with only FIN flag set anomalies.
        default: trap-to-host
      tcp-land:
        type: enum
        raw_type: option
        description: TCP land anomalies.
        default: trap-to-host
      tcp-no-flag:
        type: enum
        raw_type: option
        description: TCP SYN flood with no flag set anomalies.
        default: allow
      tcp-syn-data:
        type: enum
        raw_type: option
        description: TCP SYN flood packets with data anomalies.
        default: allow
      tcp-syn-fin:
        type: enum
        raw_type: option
        description: TCP SYN flood SYN/FIN flag set anomalies.
        default: allow
      tcp-winnuke:
        type: enum
        raw_type: option
        description: TCP WinNuke anomalies.
        default: trap-to-host
      udp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 UDP checksum anomalies.
        default: drop
      udp-land:
        type: enum
        raw_type: option
        description: UDP land anomalies.
        default: trap-to-host
  hpe:
    attributes:
      arp-max:
        type: integer
        raw_type: integer
        description: Maximum ARP packet rate (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      enable-shaper:
        type: enum
        raw_type: option
        description: Enable/Disable NPU host protection engine (HPE) shaper.
        default: disable
      esp-max:
        type: integer
        raw_type: integer
        description: Maximum ESP packet rate (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      icmp-max:
        type: integer
        raw_type: integer
        description: Maximum ICMP packet rate (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      ip-frag-max:
        type: integer
        raw_type: integer
        description: Maximum fragmented IP packet rate (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      ip-others-max:
        type: integer
        raw_type: integer
        description: Maximum IP packet rate for other packets (packet types that cannot be set with other options) (1K - 1G
          pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      l2-others-max:
        type: integer
        raw_type: integer
        description: Maximum L2 packet rate for L2 packets that are not ARP packets (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      pri-type-max:
        type: integer
        raw_type: integer
        description: 'Maximum overflow rate of priority type traffic (1K - 1G pps, default = 200K pps). Includes L2: HA, 802.3ad
          LACP, heartbeats. L3: OSPF. L4_TCP: BGP. L4_UDP: IKE, SLBC, BFD.'
        default: '200000'
        min: 1000
        max: 1000000000
      sctp-max:
        type: integer
        raw_type: integer
        description: Maximum SCTP packet rate (1K - 1G pps, default = 200K pps).
        default: '200000'
        min: 1000
        max: 1000000000
      tcp-others-max:
        type: integer
        raw_type: integer
        description: Maximum TCP packet rate for TCP packets that match none of the 3 types above (1K - 1G pps, default =
          600K pps).
        default: '600000'
        min: 1000
        max: 1000000000
      tcpfin-rst-max:
        type: integer
        raw_type: integer
        description: Maximum TCP carries FIN or RST flags packet rate (1K - 1G pps, default = 600K pps).
        default: '600000'
        min: 1000
        max: 1000000000
      tcpsyn-ack-max:
        type: integer
        raw_type: integer
        description: Maximum TCP carries SYN and ACK flags packet rate (1K - 1G pps, default = 600K pps).
        default: '600000'
        min: 1000
        max: 1000000000
      tcpsyn-max:
        type: integer
        raw_type: integer
        description: Maximum TCP SYN only packet rate (1K - 1G pps, default = 600K pps).
        default: '600000'
        min: 1000
        max: 1000000000
      udp-max:
        type: integer
        raw_type: integer
        description: Maximum UDP packet rate (1K - 1G pps, default = 600K pps).
        default: '600000'
        min: 1000
        max: 1000000000
