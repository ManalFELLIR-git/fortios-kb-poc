id: switch-controller.system
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/170244381/config-switch-controller-system
attributes:
  caputp-echo-interval:
    type: integer
    raw_type: integer
    description: Echo interval for the caputp echo requests from swtp.
    default: '30'
    min: 8
    max: 600
  caputp-max-retransmit:
    type: integer
    raw_type: integer
    description: Maximum retransmission count for the caputp tunnel packets.
    default: '5'
    min: 0
    max: 64
  data-sync-interval:
    type: integer
    raw_type: integer
    description: Time interval between collection of switch data (30 - 1800 sec, default = 60, 0 = disable).
    default: '60'
    min: 30
    max: 1800
  dynamic-periodic-interval:
    type: integer
    raw_type: integer
    description: Periodic time interval to run Dynamic port policy engine (5 - 180 sec, default = 60).
    default: '60'
    min: 5
    max: 180
  iot-holdoff:
    type: integer
    raw_type: integer
    description: MAC entry's creation time. Time must be greater than this value for an entry to be created (0 - 10080 mins,
      default = 5 mins).
    default: '5'
    min: 0
    max: 10080
  iot-mac-idle:
    type: integer
    raw_type: integer
    description: MAC entry's idle time. MAC entry is removed after this value (0 - 10080 mins, default = 1440 mins).
    default: '1440'
    min: 0
    max: 10080
  iot-scan-interval:
    type: integer
    raw_type: integer
    description: IoT scan interval (2 - 10080 mins, default = 60 mins, 0 = disable).
    default: '60'
    min: 2
    max: 10080
  iot-weight-threshold:
    type: integer
    raw_type: integer
    description: MAC entry's confidence value. Value is re-queried when below this value (default = 1, 0 = disable).
    default: '1'
    min: 0
    max: 255
  nac-periodic-interval:
    type: integer
    raw_type: integer
    description: Periodic time interval to run NAC engine (5 - 180 sec, default = 60).
    default: '60'
    min: 5
    max: 180
  parallel-process:
    type: integer
    raw_type: integer
    description: Maximum number of parallel processes.
    default: '1'
    min: 1
    max: 128
  parallel-process-override:
    type: enum
    raw_type: option
    description: Enable/disable parallel process override.
    default: disable
  tunnel-mode:
    type: enum
    raw_type: option
    description: Compatible/strict tunnel mode.
    default: compatible
children: {}
