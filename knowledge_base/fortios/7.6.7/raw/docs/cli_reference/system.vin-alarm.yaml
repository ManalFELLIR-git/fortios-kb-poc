id: system.vin-alarm
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/241981422/config-system-vin-alarm
attributes:
  psu-1-initial-voltage:
    type: integer
    raw_type: integer
    description: Initial voltage for the first PSU
    default: '0'
    min: 10
    max: 125
  psu-1-threshold-low-percent:
    type: integer
    raw_type: integer
    description: Percentage threshold at which the first PSU voltage drops to trigger a low voltage alarm (default = 80)
    default: '80'
    min: 1
    max: 99
  psu-2-initial-voltage:
    type: integer
    raw_type: integer
    description: Initial voltage for the second PSU
    default: '0'
    min: 10
    max: 125
  psu-2-threshold-low-percent:
    type: integer
    raw_type: integer
    description: Percentage threshold at which the second PSU voltage drops to trigger a low voltage alarm (default = 80)
    default: '80'
    min: 1
    max: 99
  status:
    type: enum
    raw_type: option
    description: Enable/disable vin alarm.
    default: disable
children: {}
