id: switch-controller.qos.ip-dscp-map
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/195051355/config-switch-controller-qos-ip-dscp-map
attributes:
  description:
    type: string
    raw_type: string
    description: Description of the ip-dscp map name.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: Dscp map name.
    max_length: 63
children:
  map:
    attributes:
      cos-queue:
        type: integer
        raw_type: integer
        description: COS queue number.
        default: '0'
        min: 0
        max: 7
      diffserv:
        type: enum
        raw_type: option
        description: Differentiated service.
      ip-precedence:
        type: enum
        raw_type: option
        description: IP Precedence.
      name:
        type: string
        raw_type: string
        description: Dscp mapping entry name.
        max_length: 63
      value:
        type: string
        raw_type: user
        description: Raw values of DSCP (0 - 63).
