id: dlp.data-type
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/624395066/config-dlp-data-type
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  look-ahead:
    type: integer
    raw_type: integer
    description: Number of characters to obtain in advance for verification (1 - 255, default = 1).
    default: '1'
    min: 1
    max: 255
  look-back:
    type: integer
    raw_type: integer
    description: Number of characters required to save for verification (1 - 255, default = 1).
    default: '1'
    min: 1
    max: 255
  match-ahead:
    type: integer
    raw_type: integer
    description: Number of characters behind for match-around (1 - 4096, default = 1).
    default: '1'
    min: 1
    max: 4096
  match-around:
    type: string
    raw_type: string
    description: Dictionary to check whether it has a match around (Only support match-any and basic types, no repeat supported).
    max_length: 35
  match-back:
    type: integer
    raw_type: integer
    description: Number of characters in front for match-around (1 - 4096, default = 1).
    default: '1'
    min: 1
    max: 4096
  name:
    type: string
    raw_type: string
    description: Name of table containing the data type.
    max_length: 35
  pattern:
    type: string
    raw_type: string
    description: Regular expression pattern string without look around.
    max_length: 255
  transform:
    type: string
    raw_type: string
    description: Template to transform user input to a pattern using capture group from 'pattern'.
    max_length: 255
  verify:
    type: string
    raw_type: string
    description: Regular expression pattern string used to verify the data type.
    max_length: 255
  verify-transformed-pattern:
    type: enum
    raw_type: option
    description: Enable/disable verification for transformed pattern.
    default: disable
  verify2:
    type: string
    raw_type: string
    description: Extra regular expression pattern string used to verify the data type.
    max_length: 255
children: {}
