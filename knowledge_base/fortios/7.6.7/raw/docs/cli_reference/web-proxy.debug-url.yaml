id: web-proxy.debug-url
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/187321315/config-web-proxy-debug-url
attributes:
  exact:
    type: enum
    raw_type: option
    description: Enable/disable matching the exact path.
    default: enable
  name:
    type: string
    raw_type: string
    description: Debug URL name.
    max_length: 63
  status:
    type: enum
    raw_type: option
    description: Enable/disable this URL exemption.
    default: enable
  url-pattern:
    type: string
    raw_type: string
    description: URL exemption pattern.
    max_length: 511
children: {}
