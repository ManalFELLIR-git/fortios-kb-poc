id: telemetry-controller.agent
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/281707786/config-telemetry-controller-agent
attributes:
  agent-id:
    type: string
    raw_type: string
    description: Agent ID.
    max_length: 19
  agent-profile:
    type: string
    raw_type: string
    description: Name of an existing agent profile.
    max_length: 35
  alias:
    type: string
    raw_type: string
    description: Alias used in display for ease of distinguishing agents.
    max_length: 35
  authz:
    type: enum
    raw_type: option
    description: Authorization status of this agent.
    default: unauthorized
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
children: {}
