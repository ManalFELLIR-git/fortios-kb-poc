id: wireless-controller.wtp-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/596642240/config-wireless-controller-wtp-profile
attributes:
  admin-auth-tacacs:
    type: string
    raw_type: string
    description: Remote authentication server for admin user.
    max_length: 35
  admin-restrict-local:
    type: enum
    raw_type: option
    description: Enable/disable local admin authentication restriction when remote authenticator is up and running (default
      = disable).
    default: disable
  allowaccess:
    type: enum
    raw_type: option
    description: Control management access to the managed WTP, FortiAP, or AP. Separate entries with a space.
  ap-country:
    type: enum
    raw_type: option
    description: Country in which this WTP, FortiAP, or AP will operate (default = NA, automatically use the country configured
      for the current VDOM).
    default: --
  ap-handoff:
    type: enum
    raw_type: option
    description: Enable/disable AP handoff of clients to other APs (default = disable).
    default: disable
  apcfg-auto-cert:
    type: enum
    raw_type: option
    description: Enable/disable AP local auto cert configuration (default = disable).
    default: disable
  apcfg-auto-cert-auto-regen-days:
    type: integer
    raw_type: integer
    description: Number of days to wait before expiry of an updated local certificate is requested (0 = disabled) (default
      = 30).
    default: '30'
    min: 0
    max: 4294967295
  apcfg-auto-cert-crypto-algo:
    type: enum
    raw_type: option
    description: 'Cryptography algorithm: rsa-1024, rsa-1536, rsa-2048, rsa-4096, ec-secp256r1, ec-secp384r1, ec-secp521r1
      (default = ec-secp256r1)'
    default: ec-secp256r1
  apcfg-auto-cert-enroll-protocol:
    type: enum
    raw_type: option
    description: Certificate enrollment protocol (default = none)
    default: none
  apcfg-auto-cert-est-ca-id:
    type: string
    raw_type: string
    description: CA identifier of the CA server for signing via EST.
    max_length: 255
  apcfg-auto-cert-est-http-password:
    type: password
    raw_type: password
    description: HTTP Authentication password for signing via EST.
  apcfg-auto-cert-est-http-username:
    type: string
    raw_type: string
    description: HTTP Authentication username for signing via EST.
    max_length: 63
  apcfg-auto-cert-est-https-ca:
    type: string
    raw_type: string
    description: PEM format https CA Certificate.
    max_length: 79
  apcfg-auto-cert-est-server:
    type: string
    raw_type: string
    description: Address and port for EST server (e.g. https://example.com:1234).
    max_length: 255
  apcfg-auto-cert-est-subject:
    type: string
    raw_type: string
    description: Subject e.g. "CN=User,DC=example,DC=COM" (default = CN=FortiAP,DC=local,DC=COM)
    default: CN=FortiAP,DC=local,DC=COM
    max_length: 127
  apcfg-auto-cert-est-subject-alt-name:
    type: string
    raw_type: string
    description: Subject alternative name (optional, e.g. "DNS:dns1.com,IP:192.168.1.99")
    max_length: 127
  apcfg-auto-cert-scep-ca-id:
    type: string
    raw_type: string
    description: CA identifier of the CA server for signing via SCEP.
    max_length: 255
  apcfg-auto-cert-scep-ec-name:
    type: enum
    raw_type: option
    description: 'Elliptic curve name: secp256r1, secp384r1 and secp521r1. (default secp256r1).'
    default: secp256r1
  apcfg-auto-cert-scep-https-ca:
    type: string
    raw_type: string
    description: PEM format https CA Certificate.
    max_length: 79
  apcfg-auto-cert-scep-keysize:
    type: enum
    raw_type: option
    description: 'Key size: 1024, 1536, 2048, 4096 (default 2048).'
    default: '2048'
  apcfg-auto-cert-scep-keytype:
    type: enum
    raw_type: option
    description: Key type (default = rsa)
    default: rsa
  apcfg-auto-cert-scep-password:
    type: password
    raw_type: password
    description: SCEP server challenge password for auto-regeneration.
  apcfg-auto-cert-scep-sub-fully-dn:
    type: string
    raw_type: string
    description: Full DN of the subject (e.g C=US,ST=CA,L=Sunnyvale,O=Fortinet,OU=Dep1,emailAddress=test@example.com). There
      should be no space in between the attributes. Supported DN attributes (case-sensitive) are:C,ST,L,O,OU,emailAddress.
      The CN defaults to the device’s SN and cannot be changed.
    max_length: 255
  apcfg-auto-cert-scep-subject-alt-name:
    type: string
    raw_type: string
    description: Subject alternative name (optional, e.g. "DNS:dns1.com,IP:192.168.1.99")
    max_length: 127
  apcfg-auto-cert-scep-url:
    type: string
    raw_type: string
    description: SCEP server URL.
    max_length: 255
  apcfg-mesh:
    type: enum
    raw_type: option
    description: Enable/disable AP local mesh configuration (default = disable).
    default: disable
  apcfg-mesh-ap-type:
    type: enum
    raw_type: option
    description: Mesh AP Type (default = ethernet).
    default: ethernet
  apcfg-mesh-eth-bridge:
    type: enum
    raw_type: option
    description: Enable/disable mesh ethernet bridge (default = disable).
    default: disable
  apcfg-mesh-ssid:
    type: string
    raw_type: string
    description: Mesh SSID (default = none).
    max_length: 15
  apcfg-profile:
    type: string
    raw_type: string
    description: AP local configuration profile name.
    max_length: 35
  ble-profile:
    type: string
    raw_type: string
    description: Bluetooth Low Energy profile name.
    max_length: 35
  bonjour-profile:
    type: string
    raw_type: string
    description: Bonjour profile name.
    max_length: 35
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  console-login:
    type: enum
    raw_type: option
    description: Enable/disable FortiAP console login access (default = enable).
    default: enable
  control-message-offload:
    type: enum
    raw_type: option
    description: Enable/disable CAPWAP control message data channel offload.
    default: ebp-frame aeroscout-tag ap-list sta-list sta-cap-list stats aeroscout-mu sta-health spectral-analysis
  default-mesh-root:
    type: enum
    raw_type: option
    description: Configure default mesh root SSID when it is not included by radio's SSID configuration.
    default: disable
  dtls-in-kernel:
    type: enum
    raw_type: option
    description: Enable/disable data channel DTLS in kernel.
    default: disable
  dtls-policy:
    type: enum
    raw_type: option
    description: WTP data channel DTLS policy (default = clear-text).
    default: clear-text
  energy-efficient-ethernet:
    type: enum
    raw_type: option
    description: Enable/disable use of energy efficient Ethernet on WTP.
    default: disable
  ext-info-enable:
    type: enum
    raw_type: option
    description: Enable/disable station/VAP/radio extension information.
    default: enable
  frequency-handoff:
    type: enum
    raw_type: option
    description: Enable/disable frequency handoff of clients to other channels (default = disable).
    default: disable
  handoff-roaming:
    type: enum
    raw_type: option
    description: Enable/disable client load balancing during roaming to avoid roaming delay (default = enable).
    default: enable
  handoff-rssi:
    type: integer
    raw_type: integer
    description: Minimum received signal strength indicator (RSSI) value for handoff (20 - 30, default = 25).
    default: '25'
    min: 20
    max: 30
  handoff-sta-thresh:
    type: integer
    raw_type: integer
    description: Threshold value for AP handoff.
    default: '0'
    min: 5
    max: 60
  indoor-outdoor-deployment:
    type: enum
    raw_type: option
    description: Set to allow indoor/outdoor-only channels under regulatory rules (default = platform-determined).
    default: platform-determined
  ip-fragment-preventing:
    type: enum
    raw_type: option
    description: Method(s) by which IP fragmentation is prevented for control and data packets through CAPWAP tunnel (default
      = tcp-mss-adjust).
    default: tcp-mss-adjust
  led-schedules:
    type: string
    raw_type: string
    description: Recurring firewall schedules for illuminating LEDs on the FortiAP. If led-state is enabled, LEDs will be
      visible when at least one of the schedules is valid. Separate multiple schedule names with a space. Schedule name.
    max_length: 35
  led-state:
    type: enum
    raw_type: option
    description: Enable/disable use of LEDs on WTP (default = enable).
    default: enable
  lldp:
    type: enum
    raw_type: option
    description: Enable/disable Link Layer Discovery Protocol (LLDP) for the WTP, FortiAP, or AP (default = enable).
    default: enable
  login-passwd:
    type: password
    raw_type: password
    description: Set the managed WTP, FortiAP, or AP's administrator password.
  login-passwd-change:
    type: enum
    raw_type: option
    description: Change or reset the administrator password of a managed WTP, FortiAP or AP (yes, default, or no, default
      = no).
    default: 'no'
  lw-profile:
    type: string
    raw_type: string
    description: LoRaWAN profile name.
    max_length: 35
  max-clients:
    type: integer
    raw_type: integer
    description: Maximum number of stations (STAs) supported by the WTP (default = 0, meaning no client limitation).
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: WTP (or FortiAP or AP) profile name.
    max_length: 35
  poe-mode:
    type: enum
    raw_type: option
    description: Set the WTP, FortiAP, or AP's PoE mode.
    default: auto
  split-tunneling-acl-local-ap-subnet:
    type: enum
    raw_type: option
    description: Enable/disable automatically adding local subnetwork of FortiAP to split-tunneling ACL (default = disable).
    default: disable
  split-tunneling-acl-path:
    type: enum
    raw_type: option
    description: Split tunneling ACL path is local/tunnel.
    default: local
  syslog-profile:
    type: string
    raw_type: string
    description: System log server configuration profile name.
    max_length: 35
  tun-mtu-downlink:
    type: integer
    raw_type: integer
    description: The MTU of downlink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU of FortiAP; default = 0).
    default: '0'
    min: 576
    max: 1500
  tun-mtu-uplink:
    type: integer
    raw_type: integer
    description: The maximum transmission unit (MTU) of uplink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU
      of FortiAP; default = 0).
    default: '0'
    min: 576
    max: 1500
  unii-4-5ghz-band:
    type: enum
    raw_type: option
    description: Enable/disable UNII-4 5Ghz band channels (default = disable).
    default: disable
  usb-port:
    type: enum
    raw_type: option
    description: Enable/disable USB port of the WTP (default = enable).
    default: enable
  wan-port-auth:
    type: enum
    raw_type: option
    description: Set WAN port authentication mode (default = none).
    default: none
  wan-port-auth-macsec:
    type: enum
    raw_type: option
    description: Enable/disable WAN port 802.1x supplicant MACsec policy (default = disable).
    default: disable
  wan-port-auth-methods:
    type: enum
    raw_type: option
    description: WAN port 802.1x supplicant EAP methods (default = all).
    default: all
  wan-port-auth-password:
    type: password
    raw_type: password
    description: Set WAN port 802.1x supplicant password.
  wan-port-auth-usrname:
    type: string
    raw_type: string
    description: Set WAN port 802.1x supplicant user name.
    max_length: 63
  wan-port-mode:
    type: enum
    raw_type: option
    description: Enable/disable using a WAN port as a LAN port.
    default: wan-only
children:
  deny-mac-list:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      mac:
        type: mac-address
        raw_type: mac-address
        description: A WiFi device with this MAC address is denied access to this WTP, FortiAP or AP.
        default: 00:00:00:00:00:00
  esl-ses-dongle:
    attributes:
      apc-addr-type:
        type: enum
        raw_type: option
        description: ESL SES-imagotag APC address type (default = fqdn).
        default: fqdn
      apc-fqdn:
        type: string
        raw_type: string
        description: FQDN of ESL SES-imagotag Access Point Controller (APC).
        max_length: 63
      apc-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address of ESL SES-imagotag Access Point Controller (APC).
        default: 0.0.0.0
      apc-port:
        type: integer
        raw_type: integer
        description: Port of ESL SES-imagotag Access Point Controller (APC).
        default: '0'
        min: 0
        max: 65535
      coex-level:
        type: enum
        raw_type: option
        description: ESL SES-imagotag dongle coexistence level (default = none).
        default: none
      compliance-level:
        type: enum
        raw_type: option
        description: Compliance levels for the ESL solution integration (default = compliance-level-2).
        default: compliance-level-2
      esl-channel:
        type: enum
        raw_type: option
        description: ESL SES-imagotag dongle channel (default = 127).
        default: '127'
      output-power:
        type: enum
        raw_type: option
        description: ESL SES-imagotag dongle output power (default = A).
        default: a
      scd-enable:
        type: enum
        raw_type: option
        description: Enable/disable ESL SES-imagotag Serial Communication Daemon (SCD) (default = disable).
        default: disable
      tls-cert-verification:
        type: enum
        raw_type: option
        description: Enable/disable TLS certificate verification (default = enable).
        default: enable
      tls-fqdn-verification:
        type: enum
        raw_type: option
        description: Enable/disable TLS FQDN verification (default = disable).
        default: disable
  lan:
    attributes:
      port-esl-mode:
        type: enum
        raw_type: option
        description: ESL port mode.
        default: offline
      port-esl-ssid:
        type: string
        raw_type: string
        description: Bridge ESL port to SSID.
        max_length: 15
      port-mode:
        type: enum
        raw_type: option
        description: LAN port mode.
        default: offline
      port-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port to SSID.
        max_length: 15
      port1-mode:
        type: enum
        raw_type: option
        description: LAN port 1 mode.
        default: offline
      port1-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 1 to SSID.
        max_length: 15
      port2-mode:
        type: enum
        raw_type: option
        description: LAN port 2 mode.
        default: offline
      port2-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 2 to SSID.
        max_length: 15
      port3-mode:
        type: enum
        raw_type: option
        description: LAN port 3 mode.
        default: offline
      port3-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 3 to SSID.
        max_length: 15
      port4-mode:
        type: enum
        raw_type: option
        description: LAN port 4 mode.
        default: offline
      port4-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 4 to SSID.
        max_length: 15
      port5-mode:
        type: enum
        raw_type: option
        description: LAN port 5 mode.
        default: offline
      port5-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 5 to SSID.
        max_length: 15
      port6-mode:
        type: enum
        raw_type: option
        description: LAN port 6 mode.
        default: offline
      port6-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 6 to SSID.
        max_length: 15
      port7-mode:
        type: enum
        raw_type: option
        description: LAN port 7 mode.
        default: offline
      port7-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 7 to SSID.
        max_length: 15
      port8-mode:
        type: enum
        raw_type: option
        description: LAN port 8 mode.
        default: offline
      port8-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 8 to SSID.
        max_length: 15
  lbs:
    attributes:
      aeroscout:
        type: enum
        raw_type: option
        description: Enable/disable AeroScout Real Time Location Service (RTLS) support (default = disable).
        default: disable
      aeroscout-ap-mac:
        type: enum
        raw_type: option
        description: Use BSSID or board MAC address as AP MAC address in AeroScout AP messages (default = bssid).
        default: bssid
      aeroscout-mmu-report:
        type: enum
        raw_type: option
        description: Enable/disable compounded AeroScout tag and MU report (default = enable).
        default: enable
      aeroscout-mu:
        type: enum
        raw_type: option
        description: Enable/disable AeroScout Mobile Unit (MU) support (default = disable).
        default: disable
      aeroscout-mu-factor:
        type: integer
        raw_type: integer
        description: AeroScout MU mode dilution factor (default = 20).
        default: '20'
        min: 0
        max: 4294967295
      aeroscout-mu-timeout:
        type: integer
        raw_type: integer
        description: AeroScout MU mode timeout (0 - 65535 sec, default = 5).
        default: '5'
        min: 0
        max: 65535
      aeroscout-server-ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: IP address of AeroScout server.
        default: 0.0.0.0
      aeroscout-server-port:
        type: integer
        raw_type: integer
        description: AeroScout server UDP listening port.
        default: '0'
        min: 1024
        max: 65535
      ble-rtls:
        type: enum
        raw_type: option
        description: Set BLE Real Time Location Service (RTLS) support (default = none).
        default: none
      ble-rtls-accumulation-interval:
        type: integer
        raw_type: integer
        description: Time that measurements should be accumulated in seconds (default = 2).
        default: '2'
        min: 1
        max: 60
      ble-rtls-asset-addrgrp-list:
        type: string
        raw_type: string
        description: Tags and asset addrgrp list to be reported.
        max_length: 79
      ble-rtls-asset-uuid-list1:
        type: string
        raw_type: string
        description: Tags and asset UUID list 1 to be reported (string in the format of 'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX').
        max_length: 36
      ble-rtls-asset-uuid-list2:
        type: string
        raw_type: string
        description: Tags and asset UUID list 2 to be reported (string in the format of 'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX').
        max_length: 36
      ble-rtls-asset-uuid-list3:
        type: string
        raw_type: string
        description: Tags and asset UUID list 3 to be reported (string in the format of 'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX').
        max_length: 36
      ble-rtls-asset-uuid-list4:
        type: string
        raw_type: string
        description: Tags and asset UUID list 4 to be reported (string in the format of 'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX').
        max_length: 36
      ble-rtls-protocol:
        type: enum
        raw_type: option
        description: Select the protocol to report Measurements, Advertising Data, or Location Data to Cloud Server (default
          = WSS).
        default: WSS
      ble-rtls-reporting-interval:
        type: integer
        raw_type: integer
        description: Time between reporting accumulated measurements in seconds (default = 2).
        default: '2'
        min: 1
        max: 600
      ble-rtls-server-fqdn:
        type: string
        raw_type: string
        description: FQDN of BLE Real Time Location Service (RTLS) Server.
        max_length: 255
      ble-rtls-server-path:
        type: string
        raw_type: string
        description: Path of BLE Real Time Location Service (RTLS) Server.
        max_length: 255
      ble-rtls-server-port:
        type: integer
        raw_type: integer
        description: Port of BLE Real Time Location Service (RTLS) Server (default = 443).
        default: '443'
        min: 1
        max: 65535
      ble-rtls-server-token:
        type: string
        raw_type: string
        description: Access Token of BLE Real Time Location Service (RTLS) Server.
        max_length: 31
      ekahau-blink-mode:
        type: enum
        raw_type: option
        description: Enable/disable Ekahau blink mode (now known as AiRISTA Flow) to track and locate WiFi tags (default =
          disable).
        default: disable
      ekahau-tag:
        type: mac-address
        raw_type: mac-address
        description: WiFi frame MAC address or WiFi Tag.
        default: 01:18:8e:00:00:00
      erc-server-ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: IP address of Ekahau RTLS Controller (ERC).
        default: 0.0.0.0
      erc-server-port:
        type: integer
        raw_type: integer
        description: Ekahau RTLS Controller (ERC) UDP listening port.
        default: '8569'
        min: 1024
        max: 65535
      fortipresence:
        type: enum
        raw_type: option
        description: Enable/disable FortiPresence to monitor the location and activity of WiFi clients even if they don't
          connect to this WiFi network (default = disable).
        default: disable
      fortipresence-ble:
        type: enum
        raw_type: option
        description: Enable/disable FortiPresence finding and reporting BLE devices.
        default: enable
      fortipresence-frequency:
        type: integer
        raw_type: integer
        description: FortiPresence report transmit frequency (5 - 65535 sec, default = 30).
        default: '30'
        min: 5
        max: 65535
      fortipresence-port:
        type: integer
        raw_type: integer
        description: UDP listening port of FortiPresence server (default = 3000).
        default: '3000'
        min: 300
        max: 65535
      fortipresence-project:
        type: string
        raw_type: string
        description: FortiPresence project name (max. 16 characters, default = fortipresence).
        default: fortipresence
        max_length: 16
      fortipresence-rogue:
        type: enum
        raw_type: option
        description: Enable/disable FortiPresence finding and reporting rogue APs.
        default: disable
      fortipresence-secret:
        type: password
        raw_type: password
        description: FortiPresence secret password (max. 16 characters).
      fortipresence-server:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: IP address of FortiPresence server.
        default: 0.0.0.0
      fortipresence-server-addr-type:
        type: enum
        raw_type: option
        description: FortiPresence server address type (default = ipv4).
        default: ipv4
      fortipresence-server-fqdn:
        type: string
        raw_type: string
        description: FQDN of FortiPresence server.
        max_length: 255
      fortipresence-unassoc:
        type: enum
        raw_type: option
        description: Enable/disable FortiPresence finding and reporting unassociated stations.
        default: enable
      station-locate:
        type: enum
        raw_type: option
        description: Enable/disable client station locating services for all clients, whether associated or not (default =
          disable).
        default: disable
  platform:
    attributes:
      ddscan:
        type: enum
        raw_type: option
        description: Enable/disable use of one radio for dedicated full-band scanning to detect RF characterization and wireless
          threat management.
        default: disable
      mode:
        type: enum
        raw_type: option
        description: Configure operation mode of 5G radios (default = single-5G).
        default: single-5G
      type:
        type: enum
        raw_type: option
        description: WTP, FortiAP or AP platform type. There are built-in WTP profiles for all supported FortiAP models. You
          can select a built-in profile and customize it or create a new profile.
        default: 221E
  radio-1:
    attributes:
      80211d:
        type: enum
        raw_type: option
        description: Enable/disable 802.11d countryie(default = enable).
        default: enable
      80211mc:
        type: enum
        raw_type: option
        description: Enable/disable 802.11mc responder mode (default = disable).
        default: disable
      ai-darrp-support:
        type: enum
        raw_type: option
        description: Enable/disable support for FortiAIOps to retrieve Distributed Automatic Radio Resource Provisioning (DARRP)
