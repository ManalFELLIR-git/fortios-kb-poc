id: system.vdom-exception
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/151002735/config-system-vdom-exception
attributes:
  id:
    type: integer
    raw_type: integer
    description: Index (1 - 4096).
    default: '0'
    min: 1
    max: 4096
  object:
    type: enum
    raw_type: option
    description: Name of the configuration object that can be configured independently for all VDOMs.
  scope:
    type: enum
    raw_type: option
    description: Determine whether the configuration object can be configured separately for all VDOMs or if some VDOMs share
      the same configuration.
    default: all
  vdom:
    type: string
    raw_type: string
    description: Names of the VDOMs. VDOM name.
    max_length: 79
children: {}
