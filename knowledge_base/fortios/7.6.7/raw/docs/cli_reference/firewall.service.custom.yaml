id: firewall.service.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/198499981/config-firewall-service-custom
attributes:
  app-category:
    type: integer
    raw_type: integer
    description: Application category ID. Application category id.
    min: 0
    max: 4294967295
  app-service-type:
    type: enum
    raw_type: option
    description: Application service type.
    default: disable
  application:
    type: integer
    raw_type: integer
    description: Application ID. Application id.
    min: 0
    max: 4294967295
  category:
    type: string
    raw_type: string
    description: Service category.
    max_length: 63
  check-reset-range:
    type: enum
    raw_type: option
    description: Configure the type of ICMP error message verification.
    default: default
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  fqdn:
    type: string
    raw_type: string
    description: Fully qualified domain name.
    max_length: 255
  helper:
    type: enum
    raw_type: option
    description: Helper name.
    default: auto
  icmpcode:
    type: integer
    raw_type: integer
    description: ICMP code.
    min: 0
    max: 255
  icmptype:
    type: integer
    raw_type: integer
    description: ICMP type.
    min: 0
    max: 4294967295
  iprange:
    type: string
    raw_type: user
    description: Start and end of the IP range associated with service.
  name:
    type: string
    raw_type: string
    description: Custom service name.
    max_length: 79
  protocol:
    type: enum
    raw_type: option
    description: Protocol type based on IANA numbers.
    default: TCP/UDP/UDP-Lite/SCTP
  protocol-number:
    type: integer
    raw_type: integer
    description: IP protocol number.
    default: '0'
    min: 0
    max: 254
  proxy:
    type: enum
    raw_type: option
    description: Enable/disable web proxy service.
    default: disable
  sctp-portrange:
    type: string
    raw_type: user
    description: Multiple SCTP port ranges.
  session-ttl:
    type: string
    raw_type: user
    description: Session TTL (300 - 2764800, 0 = default).
  tcp-halfclose-timer:
    type: integer
    raw_type: integer
    description: Wait time to close a TCP session waiting for an unanswered FIN packet (1 - 86400 sec, 0 = default).
    default: '0'
    min: 0
    max: 86400
  tcp-halfopen-timer:
    type: integer
    raw_type: integer
    description: Wait time to close a TCP session waiting for an unanswered open session packet (1 - 86400 sec, 0 = default).
    default: '0'
    min: 0
    max: 86400
  tcp-portrange:
    type: string
    raw_type: user
    description: Multiple TCP port ranges.
  tcp-rst-timer:
    type: integer
    raw_type: integer
    description: Set the length of the TCP CLOSE state in seconds (5 - 300 sec, 0 = default).
    default: '0'
    min: 5
    max: 300
  tcp-timewait-timer:
    type: integer
    raw_type: integer
    description: Set the length of the TCP TIME-WAIT state in seconds (1 - 300 sec, 0 = default).
    default: '0'
    min: 0
    max: 300
  udp-idle-timer:
    type: integer
    raw_type: integer
    description: Number of seconds before an idle UDP/UDP-Lite connection times out (0 - 86400 sec, 0 = default).
    default: '0'
    min: 0
    max: 86400
  udp-portrange:
    type: string
    raw_type: user
    description: Multiple UDP port ranges.
  udplite-portrange:
    type: string
    raw_type: user
    description: Multiple UDP-Lite port ranges.
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
