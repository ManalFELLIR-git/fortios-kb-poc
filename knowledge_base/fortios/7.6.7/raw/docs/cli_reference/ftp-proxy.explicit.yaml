id: ftp-proxy.explicit
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/315040594/config-ftp-proxy-explicit
attributes:
  incoming-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Accept incoming FTP requests from this IP address. An interface must have this IP address.
    default: 0.0.0.0
  incoming-port:
    type: string
    raw_type: user
    description: Accept incoming FTP requests on one or more ports.
  outgoing-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Outgoing FTP requests will leave from this IP address. An interface must have this IP address.
  sec-default-action:
    type: enum
    raw_type: option
    description: Accept or deny explicit FTP proxy sessions when no FTP proxy firewall policy exists.
    default: deny
  server-data-mode:
    type: enum
    raw_type: option
    description: Determine mode of data session on FTP server side.
    default: client
  ssl:
    type: enum
    raw_type: option
    description: Enable/disable the explicit FTPS proxy.
    default: disable
  ssl-algorithm:
    type: enum
    raw_type: option
    description: Relative strength of encryption algorithms accepted in negotiation.
    default: high
  ssl-cert:
    type: string
    raw_type: string
    description: List of certificate names to use for SSL connections to this server. Certificate list.
    max_length: 79
  ssl-dh-bits:
    type: enum
    raw_type: option
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation (default = 2048).
    default: '2048'
  status:
    type: enum
    raw_type: option
    description: Enable/disable the explicit FTP proxy.
    default: disable
children: {}
