id: firewall.schedule.recurring
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/161573977/config-firewall-schedule-recurring
attributes:
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  day:
    type: enum
    raw_type: option
    description: One or more days of the week on which the schedule is valid. Separate the names of the days with a space.
    default: none
  end:
    type: string
    raw_type: user
    description: Time of day to end the schedule, format hh:mm.
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  label-day:
    type: enum
    raw_type: option
    description: Configure a window during the time of day in which the schedule job is executed.
    default: none
  name:
    type: string
    raw_type: string
    description: Recurring schedule name.
    max_length: 31
  start:
    type: string
    raw_type: user
    description: Time of day to start the schedule, format hh:mm.
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
