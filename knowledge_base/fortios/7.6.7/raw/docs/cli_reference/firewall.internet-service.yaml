id: firewall.internet-service
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105652166/config-firewall-internet-service
attributes:
  database:
    type: enum
    raw_type: option
    description: Database name this Internet Service belongs to. Read-only.
    default: isdb
  direction:
    type: enum
    raw_type: option
    description: How this service may be used in a firewall policy (source, destination or both). Read-only.
    default: both
  extra-ip-range-number:
    type: integer
    raw_type: integer
    description: Extra number of IPv4 ranges. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  extra-ip6-range-number:
    type: integer
    raw_type: integer
    description: Extra number of IPv6 ranges. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  icon-id:
    type: integer
    raw_type: integer
    description: Icon ID of Internet Service. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  id:
    type: integer
    raw_type: integer
    description: Internet Service ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  ip-number:
    type: integer
    raw_type: integer
    description: Total number of IPv4 addresses. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  ip-range-number:
    type: integer
    raw_type: integer
    description: Number of IPv4 ranges. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  ip6-range-number:
    type: integer
    raw_type: integer
    description: Number of IPv6 ranges. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Internet Service name. Read-only.
    max_length: 63
  obsolete:
    type: integer
    raw_type: integer
    description: Indicates whether the Internet Service can be used. Read-only.
    default: '0'
    min: 0
    max: 255
  singularity:
    type: integer
    raw_type: integer
    description: Singular level of the Internet Service. Read-only.
    default: '0'
    min: 0
    max: 65535
children: {}
