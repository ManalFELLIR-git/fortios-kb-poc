id: user.scim
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/398109558/config-user-scim
attributes:
  auth-method:
    type: enum
    raw_type: option
    description: TLS client authentication methods (default = bearer token).
    default: token
  base-url:
    type: string
    raw_type: string
    description: Server URL to receive SCIM create, read, update, delete (CRUD) requests.
    max_length: 127
  cascade:
    type: enum
    raw_type: option
    description: Enable/disable to follow SCIM users/groups changes in IDP.
    default: disable
  certificate:
    type: string
    raw_type: string
    description: Certificate for client verification during TLS handshake.
    max_length: 79
  client-identity-check:
    type: enum
    raw_type: option
    description: Enable/disable client identity check.
    default: enable
  id:
    type: integer
    raw_type: integer
    description: SCIM client ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: SCIM client name.
    max_length: 35
  secret:
    type: password
    raw_type: password
    description: Secret for token verification or base authentication.
  status:
    type: enum
    raw_type: option
    description: Enable/disable System for Cross-domain Identity Management (SCIM).
    default: disable
  token-certificate:
    type: string
    raw_type: string
    description: Certificate for token verification.
    max_length: 79
children: {}
