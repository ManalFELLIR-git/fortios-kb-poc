id: wireless-controller.hotspot20.qos-map
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/210241922/config-wireless-controller-hotspot20-qos-map
attributes:
  name:
    type: string
    raw_type: string
    description: QOS-MAP name.
    max_length: 35
children:
  dscp-except:
    attributes:
      dscp:
        type: integer
        raw_type: integer
        description: DSCP value.
        default: '0'
        min: 0
        max: 63
      index:
        type: integer
        raw_type: integer
        description: DSCP exception index.
        default: '0'
        min: 1
        max: 21
      up:
        type: integer
        raw_type: integer
        description: User priority.
        default: '0'
        min: 0
        max: 7
  dscp-range:
    attributes:
      high:
        type: integer
        raw_type: integer
        description: DSCP high value.
        default: '255'
        min: 0
        max: 63
      index:
        type: integer
        raw_type: integer
        description: DSCP range index.
        default: '0'
        min: 1
        max: 8
      low:
        type: integer
        raw_type: integer
        description: DSCP low value.
        default: '255'
        min: 0
        max: 63
      up:
        type: integer
        raw_type: integer
        description: User priority.
        default: '0'
        min: 0
        max: 7
