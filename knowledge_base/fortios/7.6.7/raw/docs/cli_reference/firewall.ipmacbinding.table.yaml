id: firewall.ipmacbinding.table
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/124043061/config-firewall-ipmacbinding-table
attributes:
  ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: 'IPv4 address portion of the pair (format: xxx.xxx.xxx.xxx).'
    default: 0.0.0.0
  mac:
    type: mac-address
    raw_type: mac-address
    description: MAC address portion of the pair (format = xx:xx:xx:xx:xx:xx in hexadecimal).
    default: 00:00:00:00:00:00
  name:
    type: string
    raw_type: string
    description: Name of the pair (optional, default = no name).
    default: noname
    max_length: 35
  seq-num:
    type: integer
    raw_type: integer
    description: Entry number.
    default: '0'
    min: 0
    max: 4294967295
  status:
    type: enum
    raw_type: option
    description: Enable/disable this IP-mac binding pair.
    default: disable
children: {}
