id: system.ddns
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/323334900/config-system-ddns
attributes:
  addr-type:
    type: enum
    raw_type: option
    description: Address type of interface address in DDNS update.
    default: ipv4
  bound-ip:
    type: string
    raw_type: string
    description: Bound IP address. Read-only.
    max_length: 46
  clear-text:
    type: enum
    raw_type: option
    description: Enable/disable use of clear text connections.
    default: disable
  ddns-auth:
    type: enum
    raw_type: option
    description: Enable/disable TSIG authentication for your DDNS server.
    default: disable
  ddns-domain:
    type: string
    raw_type: string
    description: Your fully qualified domain name. For example, yourname.ddns.com.
    max_length: 64
  ddns-key:
    type: password_aes256
    raw_type: password_aes256
    description: DDNS update key (base 64 encoding).
  ddns-keyname:
    type: string
    raw_type: string
    description: DDNS update key name.
    max_length: 64
  ddns-password:
    type: password
    raw_type: password
    description: DDNS password.
  ddns-server:
    type: enum
    raw_type: option
    description: Select a DDNS service provider.
  ddns-server-addr:
    type: string
    raw_type: string
    description: Generic DDNS server IP/FQDN list. IP address or FQDN of the server.
    max_length: 256
  ddns-sn:
    type: string
    raw_type: string
    description: DDNS Serial Number.
    max_length: 64
  ddns-ttl:
    type: integer
    raw_type: integer
    description: Time-to-live for DDNS packets.
    default: '300'
    min: 60
    max: 86400
  ddns-username:
    type: string
    raw_type: string
    description: DDNS user name.
    max_length: 64
  ddns-zone:
    type: string
    raw_type: string
    description: Zone of your domain name (for example, DDNS.com).
    max_length: 64
  ddnsid:
    type: integer
    raw_type: integer
    description: DDNS ID.
    default: '0'
    min: 0
    max: 4294967295
  monitor-interface:
    type: string
    raw_type: string
    description: Monitored interface. Interface name.
    max_length: 79
  server-type:
    type: enum
    raw_type: option
    description: Address type of the DDNS server.
    default: ipv4
  ssl-certificate:
    type: string
    raw_type: string
    description: Name of local certificate for SSL connections.
    default: Fortinet_Factory **
    max_length: 35
  update-interval:
    type: integer
    raw_type: integer
    description: DDNS update interval (60 - 2592000 sec, 0 means default).
    default: '0'
    min: 60
    max: 2592000
  use-public-ip:
    type: enum
    raw_type: option
    description: Enable/disable use of public IP address.
    default: disable
children: {}
