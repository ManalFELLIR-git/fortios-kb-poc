id: firewall.multicast-address
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/205326263/config-firewall-multicast-address
attributes:
  associated-interface:
    type: string
    raw_type: string
    description: Interface associated with the address object. When setting up a policy, only addresses associated with this
      interface are available.
    max_length: 35
  color:
    type: integer
    raw_type: integer
    description: Integer value to determine the color of the icon in the GUI (1 - 32, default = 0, which sets value to 1).
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  end-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Final IPv4 address (inclusive) in the range for the address.
    default: 0.0.0.0
  name:
    type: string
    raw_type: string
    description: Multicast address name.
    max_length: 79
  start-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: First IPv4 address (inclusive) in the range for the address.
    default: 0.0.0.0
  subnet:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: Broadcast address and subnet.
    default: 0.0.0.0 0.0.0.0
  type:
    type: enum
    raw_type: option
    description: 'Type of address object: multicast IP address range or broadcast IP/mask to be treated as a multicast address.'
    default: multicastrange
children:
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
