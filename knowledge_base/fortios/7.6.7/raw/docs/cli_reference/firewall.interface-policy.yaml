id: firewall.interface-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/160113994/config-firewall-interface-policy
attributes:
  application-list:
    type: string
    raw_type: string
    description: Application list name.
    max_length: 47
  application-list-status:
    type: enum
    raw_type: option
    description: Enable/disable application control.
    default: disable
  av-profile:
    type: string
    raw_type: string
    description: Antivirus profile.
    max_length: 47
  av-profile-status:
    type: enum
    raw_type: option
    description: Enable/disable antivirus.
    default: disable
  casb-profile:
    type: string
    raw_type: string
    description: CASB profile.
    max_length: 47
  casb-profile-status:
    type: enum
    raw_type: option
    description: Enable/disable CASB.
    default: disable
  comments:
    type: string
    raw_type: var-string
    description: Comments.
    max_length: 1023
  dlp-profile:
    type: string
    raw_type: string
    description: DLP profile name.
    max_length: 47
  dlp-profile-status:
    type: enum
    raw_type: option
    description: Enable/disable DLP.
    default: disable
  dsri:
    type: enum
    raw_type: option
    description: Enable/disable DSRI.
    default: disable
  dstaddr:
    type: string
    raw_type: string
    description: Address object to limit traffic monitoring to network traffic sent to the specified address or range. Address
      name.
    max_length: 79
  emailfilter-profile:
    type: string
    raw_type: string
    description: Email filter profile.
    max_length: 47
  emailfilter-profile-status:
    type: enum
    raw_type: option
    description: Enable/disable email filter.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Monitored interface name from available interfaces.
    max_length: 35
  ips-sensor:
    type: string
    raw_type: string
    description: IPS sensor name.
    max_length: 47
  ips-sensor-status:
    type: enum
    raw_type: option
    description: Enable/disable IPS.
    default: disable
  logtraffic:
    type: enum
    raw_type: option
    description: 'Logging type to be used in this policy (Options: all | utm | disable, Default: utm).'
    default: utm
  policyid:
    type: integer
    raw_type: integer
    description: Policy ID (0 - 4294967295).
    default: '0'
    min: 0
    max: 4294967295
  service:
    type: string
    raw_type: string
    description: Service object from available options. Service name.
    max_length: 79
  srcaddr:
    type: string
    raw_type: string
    description: Address object to limit traffic monitoring to network traffic sent from the specified address or range. Address
      name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: Enable/disable this policy.
    default: enable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  webfilter-profile:
    type: string
    raw_type: string
    description: Web filter profile.
    max_length: 47
  webfilter-profile-status:
    type: enum
    raw_type: option
    description: Enable/disable web filtering.
    default: disable
children: {}
