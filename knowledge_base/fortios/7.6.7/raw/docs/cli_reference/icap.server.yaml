id: icap.server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/214001587/config-icap-server
attributes:
  addr-type:
    type: enum
    raw_type: option
    description: 'Address type of the remote ICAP server: IPv4, IPv6 or FQDN.'
    default: ip4
  fqdn:
    type: string
    raw_type: string
    description: ICAP remote server Fully Qualified Domain Name (FQDN).
    max_length: 255
  healthcheck:
    type: enum
    raw_type: option
    description: Enable/disable ICAP remote server health checking. Attempts to connect to the remote ICAP server to verify
      that the server is operating normally.
    default: disable
  healthcheck-service:
    type: string
    raw_type: string
    description: ICAP Service name to use for health checks.
    max_length: 127
  ip-address:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 address of the ICAP server.
    default: 0.0.0.0
  ip6-address:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address of the ICAP server.
    default: '::'
  max-connections:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent connections to ICAP server (unlimited = 0, default = 100). Must not be less
      than wad-worker-count.
    default: '100'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Server name.
    max_length: 63
  port:
    type: integer
    raw_type: integer
    description: ICAP server port.
    default: '1344'
    min: 1
    max: 65535
  secure:
    type: enum
    raw_type: option
    description: Enable/disable secure connection to ICAP server.
    default: disable
  ssl-cert:
    type: string
    raw_type: string
    description: CA certificate name.
    max_length: 79
children: {}
