id: firewall.wildcard-fqdn.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/315310253/config-firewall-wildcard-fqdn-custom
attributes:
  color:
    type: integer
    raw_type: integer
    description: GUI icon color.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Address name.
    max_length: 79
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  wildcard-fqdn:
    type: string
    raw_type: string
    description: Wildcard FQDN.
    max_length: 255
children: {}
