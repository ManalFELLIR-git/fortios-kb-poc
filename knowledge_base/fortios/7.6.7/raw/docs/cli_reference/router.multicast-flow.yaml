id: router.multicast-flow
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/454180783/config-router-multicast-flow
attributes:
  comments:
    type: string
    raw_type: string
    description: Comment.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  flows:
    attributes:
      group-addr:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Multicast group IP address.
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: Flow ID.
        default: '0'
        min: 0
        max: 4294967295
      source-addr:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Multicast source IP address.
        default: 0.0.0.0
