id: system.icond
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/939427465/config-system-icond
attributes:
  iec101-keepalive:
    type: enum
    raw_type: option
    description: Send periodic test frame for probing link status.
    default: enable
  iec101-laddr-local:
    type: integer
    raw_type: integer
    description: Link address of local.
    default: '1'
    min: 1
    max: 65534
  iec101-laddr-remote:
    type: integer
    raw_type: integer
    description: Link address of remote.
    default: '2'
    min: 1
    max: 65535
  iec101-laddr-size:
    type: integer
    raw_type: integer
    description: Link address size.
    default: '1'
    min: 0
    max: 2
  iec101-mode:
    type: enum
    raw_type: option
    description: Link layer transmission procedure.
    default: balanced
  iec101-t0:
    type: integer
    raw_type: integer
    description: Time out for repetition of frames in milliseconds (1 - 30000, default = 500).
    default: '500'
    min: 1
    max: 30000
  iec101-trp:
    type: integer
    raw_type: integer
    description: Time interval during which repetitions are permitted in milliseconds (1 - 300000, default = 2500).
    default: '2500'
    min: 1
    max: 300000
  iec101-use-ack-char:
    type: enum
    raw_type: option
    description: Use single character for ACK.
    default: disable
  iec104-k:
    type: integer
    raw_type: integer
    description: Maximum number of outstanding I formate APDUs (1 - 32767, default = 12).
    default: '12'
    min: 1
    max: 32767
  iec104-t1:
    type: integer
    raw_type: integer
    description: Time-out of send or test APDUs in seconds (1 - 255, default = 15).
    default: '15'
    min: 1
    max: 255
  iec104-t2:
    type: integer
    raw_type: integer
    description: Time-out for acknowledges in case no data messages in seconds (1 - 255, default = 10).
    default: '10'
    min: 1
    max: 255
  iec104-t3:
    type: integer
    raw_type: integer
    description: Time-out for sending test frames in case of a long idle state in seconds (1 - 172800, default = 20).
    default: '20'
    min: 1
    max: 172800
  iec104-w:
    type: integer
    raw_type: integer
    description: Maximum number of latest acknowledge APDUs (1 - 32767, default = 8).
    default: '8'
    min: 1
    max: 32767
  modbus-serial-addr:
    type: integer
    raw_type: integer
    description: Serial remote station address.
    default: '1'
    min: 1
    max: 247
  modbus-serial-mode:
    type: enum
    raw_type: option
    description: Serial transmission mode.
    default: RTU
  modbus-serial-timeout-resp:
    type: integer
    raw_type: integer
    description: Time out for serial remote station response in milliseconds (10 - 30000, default = 500).
    default: '500'
    min: 10
    max: 30000
  modbus-tcp-unit-id:
    type: integer
    raw_type: integer
    description: TCP MBAP unit identifier.
    default: '255'
    min: 0
    max: 255
  port:
    type: integer
    raw_type: integer
    description: Listening socket port.
    default: '5000'
    min: 1
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable this connection.
    default: disable
  tty-baudrate:
    type: enum
    raw_type: option
    description: TTY baudrate.
    default: '9600'
  tty-databits:
    type: integer
    raw_type: integer
    description: TTY databits.
    default: '8'
    min: 5
    max: 8
  tty-device:
    type: string
    raw_type: string
    description: TTY device.
    default: serial0
    max_length: 35
  tty-flowcontrol:
    type: enum
    raw_type: option
    description: TTY flowcontrol.
    default: none
  tty-parity:
    type: enum
    raw_type: option
    description: TTY parity.
    default: even
  tty-stopbits:
    type: integer
    raw_type: integer
    description: TTY stopbits.
    default: '1'
    min: 1
    max: 2
  type:
    type: enum
    raw_type: option
    description: Connection type.
    default: raw
children: {}
