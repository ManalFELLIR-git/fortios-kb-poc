id: webfilter.content
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/304754186/config-webfilter-content
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Block or exempt word when a match is found.
        default: block
      name:
        type: string
        raw_type: string
        description: Banned word.
        max_length: 127
      pattern-type:
        type: enum
        raw_type: option
        description: 'Banned word pattern type: wildcard pattern or Perl regular expression.'
        default: wildcard
      score:
        type: integer
        raw_type: integer
        description: Score, to be applied every time the word appears on a web page (0 - 4294967295, default = 10).
        default: '10'
        min: 0
        max: 4294967295
      status:
        type: enum
        raw_type: option
        description: Enable/disable banned word.
        default: disable
