id: vpn.qkd
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/304582863/config-vpn-qkd
attributes:
  certificate:
    type: string
    raw_type: string
    description: Names of up to 4 certificates to offer to the KME. Certificate name.
    max_length: 79
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  id:
    type: string
    raw_type: string
    description: Quantum Key Distribution ID assigned by the KME.
    max_length: 291
  name:
    type: string
    raw_type: string
    description: Quantum Key Distribution configuration name.
    max_length: 35
  peer:
    type: string
    raw_type: string
    description: Authenticate Quantum Key Device's certificate with the peer/peergrp.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: Port to connect to on the KME.
    default: '0'
    min: 1
    max: 65535
  server:
    type: string
    raw_type: string
    description: IPv4, IPv6 or DNS address of the KME.
    max_length: 63
children: {}
