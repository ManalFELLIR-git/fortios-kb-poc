id: user.saml
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/104734780/config-user-saml
attributes:
  adfs-claim:
    type: enum
    raw_type: option
    description: Enable/disable ADFS Claim for user/group attribute in assertion statement (default = disable).
    default: disable
  cert:
    type: string
    raw_type: string
    description: Certificate to sign SAML messages.
    max_length: 35
  clock-tolerance:
    type: integer
    raw_type: integer
    description: Clock skew tolerance in seconds (0 - 300, default = 15, 0 = no tolerance).
    default: '15'
    min: 0
    max: 300
  digest-method:
    type: enum
    raw_type: option
    description: Digest method algorithm.
    default: sha1
  entity-id:
    type: string
    raw_type: string
    description: SP entity ID.
    max_length: 255
  group-claim-type:
    type: enum
    raw_type: option
    description: Group claim in assertion statement.
    default: group
  group-name:
    type: string
    raw_type: string
    description: Group name in assertion statement.
    max_length: 255
  idp-cert:
    type: string
    raw_type: string
    description: IDP Certificate name.
    max_length: 35
  idp-entity-id:
    type: string
    raw_type: string
    description: IDP entity ID.
    max_length: 255
  idp-single-logout-url:
    type: string
    raw_type: string
    description: IDP single logout url.
    max_length: 255
  idp-single-sign-on-url:
    type: string
    raw_type: string
    description: IDP single sign-on URL.
    max_length: 255
  limit-relaystate:
    type: enum
    raw_type: option
    description: Enable/disable limiting of relay-state parameter when it exceeds SAML 2.0 specification limits (80 bytes).
    default: disable
  name:
    type: string
    raw_type: string
    description: SAML server entry name.
    max_length: 35
  reauth:
    type: enum
    raw_type: option
    description: Enable/disable signalling of IDP to force user re-authentication (default = disable).
    default: disable
  require-signed-resp-and-asrt:
    type: enum
    raw_type: option
    description: Require both response and assertion from IDP to be signed when FGT acts as SP (default = disable).
    default: disable
  scim-client:
    type: string
    raw_type: string
    description: SCIM client name.
    max_length: 35
  scim-group-attr-type:
    type: enum
    raw_type: option
    description: Group attribute type used to match SCIM groups (default = display-name).
    default: display-name
  scim-user-attr-type:
    type: enum
    raw_type: option
    description: User attribute type used to match SCIM users (default = user-name).
    default: user-name
  single-logout-url:
    type: string
    raw_type: string
    description: SP single logout URL.
    max_length: 255
  single-sign-on-url:
    type: string
    raw_type: string
    description: SP single sign-on URL.
    max_length: 255
  user-claim-type:
    type: enum
    raw_type: option
    description: User name claim in assertion statement.
    default: upn
  user-name:
    type: string
    raw_type: string
    description: User name in assertion statement.
    max_length: 255
children: {}
