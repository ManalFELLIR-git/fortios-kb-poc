id: webfilter.ips-urlfilter-setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/239393984/config-webfilter-ips-urlfilter-setting
attributes:
  device:
    type: string
    raw_type: string
    description: Interface for this route.
    max_length: 35
  distance:
    type: integer
    raw_type: integer
    description: Administrative distance (1 - 255) for this route.
    default: '1'
    min: 1
    max: 255
  gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: Gateway IP address for this route.
    default: 0.0.0.0
  geo-filter:
    type: string
    raw_type: var-string
    description: Filter based on geographical location. Route will NOT be installed if the resolved IP address belongs to
      the country in the filter.
    max_length: 255
children: {}
