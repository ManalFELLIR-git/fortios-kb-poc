id: system.external-resource
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/549356530/config-system-external-resource
attributes:
  address-comment-field:
    type: string
    raw_type: string
    description: JSON Path to address description in generic address entry.
    default: $.description
    max_length: 511
  address-data-field:
    type: string
    raw_type: string
    description: JSON Path to address data in generic address entry.
    default: $.value
    max_length: 511
  address-name-field:
    type: string
    raw_type: string
    description: JSON Path to address name in generic address entry.
    default: $.name
    max_length: 511
  category:
    type: integer
    raw_type: integer
    description: User resource category.
    default: '0'
    min: 192
    max: 221
  client-cert:
    type: string
    raw_type: string
    description: Client certificate name.
    max_length: 79
  client-cert-auth:
    type: enum
    raw_type: option
    description: Enable/disable using client certificate for TLS authentication.
    default: disable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  name:
    type: string
    raw_type: string
    description: External resource name.
    max_length: 35
  namespace:
    type: string
    raw_type: string
    description: Generic external connector address namespace.
    max_length: 15
  object-array-path:
    type: string
    raw_type: string
    description: JSON Path to array of generic addresses in resource.
    default: $.addresses
    max_length: 511
  password:
    type: varlen_password
    raw_type: varlen_password
    description: HTTP basic authentication password.
  refresh-rate:
    type: integer
    raw_type: integer
    description: Time interval to refresh external resource (1 - 43200 min, default = 5 min).
    default: '5'
    min: 1
    max: 43200
  resource:
    type: string
    raw_type: string
    description: URL of external resource.
    max_length: 511
  server-identity-check:
    type: enum
    raw_type: option
    description: Certificate verification option.
    default: none
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IPv4 address used to communicate with server.
    default: 0.0.0.0
  source-ip-interface:
    type: string
    raw_type: string
    description: IPv4 Source interface for communication with the server.
    max_length: 15
  status:
    type: enum
    raw_type: option
    description: Enable/disable user resource.
    default: enable
  type:
    type: enum
    raw_type: option
    description: User resource type.
    default: category
  update-method:
    type: enum
    raw_type: option
    description: External resource update method.
    default: feed
  user-agent:
    type: string
    raw_type: var-string
    description: HTTP User-Agent header (default = 'curl/7.58.0').
    max_length: 255
  username:
    type: string
    raw_type: string
    description: HTTP basic authentication user name.
    max_length: 64
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
