id: wireless-controller.vap
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/304313044/config-wireless-controller-vap
attributes:
  80211k:
    type: enum
    raw_type: option
    description: Enable/disable 802.11k assisted roaming (default = enable).
    default: enable
  80211v:
    type: enum
    raw_type: option
    description: Enable/disable 802.11v assisted roaming (default = enable).
    default: enable
  access-control-list:
    type: string
    raw_type: string
    description: Profile name for access-control-list.
    max_length: 35
  additional-akms:
    type: enum
    raw_type: option
    description: Additional AKMs.
  address-group:
    type: string
    raw_type: string
    description: Firewall Address Group Name.
    max_length: 79
  address-group-policy:
    type: enum
    raw_type: option
    description: Configure MAC address filtering policy for MAC addresses that are in the address-group.
    default: disable
  akm24-only:
    type: enum
    raw_type: option
    description: WPA3 SAE using group-dependent hash only (default = disable).
    default: disable
  antivirus-profile:
    type: string
    raw_type: string
    description: AntiVirus profile name.
    max_length: 47
  application-detection-engine:
    type: enum
    raw_type: option
    description: Enable/disable application detection engine (default = disable).
    default: disable
  application-dscp-marking:
    type: enum
    raw_type: option
    description: Enable/disable application attribute based DSCP marking (default = disable).
    default: disable
  application-list:
    type: string
    raw_type: string
    description: Application control list name.
    max_length: 47
  application-report-intv:
    type: integer
    raw_type: integer
    description: Application report interval (30 - 864000 sec, default = 120).
    default: '120'
    min: 30
    max: 864000
  atf-weight:
    type: integer
    raw_type: integer
    description: Airtime weight in percentage (default = 20).
    default: '20'
    min: 0
    max: 100
  auth:
    type: enum
    raw_type: option
    description: Authentication protocol.
  auth-cert:
    type: string
    raw_type: string
    description: HTTPS server certificate.
    max_length: 35
  auth-portal-addr:
    type: string
    raw_type: string
    description: Address of captive portal.
    max_length: 63
  beacon-advertising:
    type: enum
    raw_type: option
    description: Fortinet beacon advertising IE data (default = empty).
  beacon-protection:
    type: enum
    raw_type: option
    description: Enable/disable beacon protection support (default = disable).
    default: disable
  broadcast-ssid:
    type: enum
    raw_type: option
    description: Enable/disable broadcasting the SSID (default = enable).
    default: enable
  broadcast-suppression:
    type: enum
    raw_type: option
    description: Optional suppression of broadcast messages. For example, you can keep DHCP messages, ARP broadcasts, and
      so on off of the wireless network.
    default: dhcp-up dhcp-ucast arp-known
  bss-color-partial:
    type: enum
    raw_type: option
    description: Enable/disable 802.11ax partial BSS color (default = enable).
    default: enable
  bstm-disassociation-imminent:
    type: enum
    raw_type: option
    description: Enable/disable forcing of disassociation after the BSTM request timer has been reached (default = enable).
    default: enable
  bstm-load-balancing-disassoc-timer:
    type: integer
    raw_type: integer
    description: Time interval for client to voluntarily leave AP before forcing a disassociation due to AP load-balancing
      (0 to 30, default = 10).
    default: '10'
    min: 1
    max: 30
  bstm-rssi-disassoc-timer:
    type: integer
    raw_type: integer
    description: Time interval for client to voluntarily leave AP before forcing a disassociation due to low RSSI (0 to 2000,
      default = 200).
    default: '200'
    min: 1
    max: 2000
  called-station-id-type:
    type: enum
    raw_type: option
    description: The format type of RADIUS attribute Called-Station-Id (default = mac).
    default: mac
  captive-network-assistant-bypass:
    type: enum
    raw_type: option
    description: Enable/disable Captive Network Assistant bypass.
    default: disable
  captive-portal:
    type: enum
    raw_type: option
    description: Enable/disable captive portal.
    default: disable
  captive-portal-ac-name:
    type: string
    raw_type: string
    description: Local-bridging captive portal ac-name.
    max_length: 35
  captive-portal-auth-timeout:
    type: integer
    raw_type: integer
    description: Hard timeout - AP will always clear the session after timeout regardless of traffic (0 - 864000 sec, default
      = 0).
    default: '0'
    min: 0
    max: 864000
  captive-portal-fw-accounting:
    type: enum
    raw_type: option
    description: Enable/disable RADIUS accounting for captive portal firewall authentication session.
    default: disable
  dhcp-address-enforcement:
    type: enum
    raw_type: option
    description: Enable/disable DHCP address enforcement (default = disable).
    default: disable
  dhcp-lease-time:
    type: integer
    raw_type: integer
    description: DHCP lease time in seconds for NAT IP address.
    default: '2400'
    min: 300
    max: 8640000
  dhcp-option43-insertion:
    type: enum
    raw_type: option
    description: Enable/disable insertion of DHCP option 43 (default = enable).
    default: enable
  dhcp-option82-circuit-id-insertion:
    type: enum
    raw_type: option
    description: Selected fields of DHCP option 82 circuit-id insert.
  dhcp-option82-delimiter:
    type: string
    raw_type: string
    description: DHCP option 82 field delimiter.
    default: ;
    max_length: 4
  dhcp-option82-insertion:
    type: enum
    raw_type: option
    description: Enable/disable DHCP option 82 insert (default = disable).
    default: disable
  dhcp-option82-remote-id-insertion:
    type: enum
    raw_type: option
    description: Selected fields of DHCP option 82 remote-id insert.
  domain-name-stripping:
    type: enum
    raw_type: option
    description: Enable/disable stripping domain name from identity (default = disable).
    default: disable
  dynamic-vlan:
    type: enum
    raw_type: option
    description: Enable/disable dynamic VLAN assignment.
    default: disable
  eap-reauth:
    type: enum
    raw_type: option
    description: Enable/disable EAP re-authentication for WPA-Enterprise security.
    default: disable
  eap-reauth-intv:
    type: integer
    raw_type: integer
    description: EAP re-authentication interval (1800 - 864000 sec, default = 86400).
    default: '86400'
    min: 1800
    max: 864000
  eapol-key-retries:
    type: enum
    raw_type: option
    description: Enable/disable retransmission of EAPOL-Key frames (message 3/4 and group message 1/2) (default = enable).
    default: enable
  encrypt:
    type: enum
    raw_type: option
    description: Encryption protocol to use (only available when security is set to a WPA type).
    default: AES
  external-logout:
    type: string
    raw_type: string
    description: URL of external authentication logout server.
    max_length: 127
  external-pre-auth:
    type: enum
    raw_type: option
    description: Enable/disable pre-authentication with external APs not managed by the FortiGate (default = disable).
    default: disable
  external-web:
    type: string
    raw_type: var-string
    description: URL of external authentication web server.
    max_length: 1023
  external-web-format:
    type: enum
    raw_type: option
    description: URL query parameter detection (default = auto-detect).
    default: auto-detect
  fast-bss-transition:
    type: enum
    raw_type: option
    description: Enable/disable 802.11r Fast BSS Transition (FT) (default = disable).
    default: disable
  ft-mobility-domain:
    type: integer
    raw_type: integer
    description: Mobility domain identifier in FT (1 - 65535, default = 1000).
    default: '1000'
    min: 1
    max: 65535
  ft-over-ds:
    type: enum
    raw_type: option
    description: Enable/disable FT over the Distribution System (DS).
    default: disable
  ft-r0-key-lifetime:
    type: integer
    raw_type: integer
    description: Lifetime of the PMK-R0 key in FT, 1-65535 minutes.
    default: '480'
    min: 1
    max: 65535
  gas-comeback-delay:
    type: integer
    raw_type: integer
    description: GAS comeback delay (0 or 100 - 10000 milliseconds, default = 500).
    default: '500'
    min: 100
    max: 10000
  gas-fragmentation-limit:
    type: integer
    raw_type: integer
    description: GAS fragmentation limit (512 - 4096, default = 1024).
    default: '1024'
    min: 512
    max: 4096
  gtk-rekey:
    type: enum
    raw_type: option
    description: Enable/disable GTK rekey for WPA security.
    default: disable
  gtk-rekey-intv:
    type: integer
    raw_type: integer
    description: GTK rekey interval (600 - 864000 sec, default = 86400).
    default: '86400'
    min: 600
    max: 864000
  high-efficiency:
    type: enum
    raw_type: option
    description: Enable/disable 802.11ax high efficiency (default = enable).
    default: enable
  hotspot20-profile:
    type: string
    raw_type: string
    description: Hotspot 2.0 profile name.
    max_length: 35
  igmp-snooping:
    type: enum
    raw_type: option
    description: Enable/disable IGMP snooping.
    default: disable
  intra-vap-privacy:
    type: enum
    raw_type: option
    description: Enable/disable blocking communication between clients on the same SSID (called intra-SSID privacy) (default
      = disable).
    default: disable
  ip:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: IP address and subnet mask for the local standalone NAT subnet.
    default: 0.0.0.0 0.0.0.0
  ips-sensor:
    type: string
    raw_type: string
    description: IPS sensor name.
    max_length: 47
  ipv6-rules:
    type: enum
    raw_type: option
    description: Optional rules of IPv6 packets. For example, you can keep RA, RS and so on off of the wireless network.
    default: drop-icmp6ra drop-icmp6rs drop-llmnr6 drop-icmp6mld2 drop-dhcp6s drop-dhcp6c ndp-proxy drop-ns-dad
  key:
    type: password
    raw_type: password
    description: WEP Key.
  keyindex:
    type: integer
    raw_type: integer
    description: WEP key index (1 - 4).
    default: '1'
    min: 1
    max: 4
  l3-roaming:
    type: enum
    raw_type: option
    description: Enable/disable layer 3 roaming (default = disable).
    default: disable
  l3-roaming-mode:
    type: enum
    raw_type: option
    description: Select the way that layer 3 roaming traffic is passed (default = direct).
    default: direct
  ldpc:
    type: enum
    raw_type: option
    description: VAP low-density parity-check (LDPC) coding configuration.
    default: rxtx
  local-authentication:
    type: enum
    raw_type: option
    description: Enable/disable AP local authentication.
    default: disable
  local-bridging:
    type: enum
    raw_type: option
    description: Enable/disable bridging of wireless and Ethernet interfaces on the FortiAP (default = disable).
    default: disable
  local-lan:
    type: enum
    raw_type: option
    description: Allow/deny traffic destined for a Class A, B, or C private IP address (default = allow).
    default: allow
  local-lan-partition:
    type: enum
    raw_type: option
    description: Enable/disable segregating client traffic to local LAN side (default = disable).
    default: disable
  local-standalone:
    type: enum
    raw_type: option
    description: Enable/disable AP local standalone (default = disable).
    default: disable
  local-standalone-dns:
    type: enum
    raw_type: option
    description: Enable/disable AP local standalone DNS.
    default: disable
  local-standalone-dns-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 addresses for the local standalone DNS.
  local-standalone-nat:
    type: enum
    raw_type: option
    description: Enable/disable AP local standalone NAT mode.
    default: disable
  mac-auth-bypass:
    type: enum
    raw_type: option
    description: Enable/disable MAC authentication bypass.
    default: disable
  mac-called-station-delimiter:
    type: enum
    raw_type: option
    description: MAC called station delimiter (default = hyphen).
    default: hyphen
  mac-calling-station-delimiter:
    type: enum
    raw_type: option
    description: MAC calling station delimiter (default = hyphen).
    default: hyphen
  mac-case:
    type: enum
    raw_type: option
    description: MAC case (default = uppercase).
    default: uppercase
  mac-password-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication password delimiter (default = hyphen).
    default: hyphen
  mac-username-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication username delimiter (default = hyphen).
    default: hyphen
  max-clients:
    type: integer
    raw_type: integer
    description: Maximum number of clients that can connect simultaneously to the VAP (default = 0, meaning no limitation).
    default: '0'
    min: 0
    max: 4294967295
  max-clients-ap:
    type: integer
    raw_type: integer
    description: Maximum number of clients that can connect simultaneously to the VAP per AP radio (default = 0, meaning no
      limitation).
    default: '0'
    min: 0
    max: 4294967295
  mbo:
    type: enum
    raw_type: option
    description: Enable/disable Multiband Operation (default = disable).
    default: disable
  mbo-cell-data-conn-pref:
    type: enum
    raw_type: option
    description: MBO cell data connection preference (0, 1, or 255, default = 1).
    default: prefer-not
  me-disable-thresh:
    type: integer
    raw_type: integer
    description: Disable multicast enhancement when this many clients are receiving multicast traffic.
    default: '32'
    min: 2
    max: 256
  mesh-backhaul:
    type: enum
    raw_type: option
    description: Enable/disable using this VAP as a WiFi mesh backhaul (default = disable). This entry is only available when
      security is set to a WPA type or open.
    default: disable
  mlo:
    type: enum
    raw_type: option
    description: Enable/disable WiFi7 Multi-Link-Operation (default = disable).
    default: disable
  mpsk-profile:
    type: string
    raw_type: string
    description: MPSK profile name.
    max_length: 35
  mu-mimo:
    type: enum
    raw_type: option
    description: Enable/disable Multi-user MIMO (default = enable).
    default: enable
  multicast-enhance:
    type: enum
    raw_type: option
    description: Enable/disable converting multicast to unicast to improve performance (default = disable).
    default: disable
  multicast-rate:
    type: enum
    raw_type: option
    description: Multicast rate (0, 6000, 12000, or 24000 kbps, default = 0).
    default: '0'
  nac:
    type: enum
    raw_type: option
    description: Enable/disable network access control.
    default: disable
  nac-profile:
    type: string
    raw_type: string
    description: NAC profile name.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Virtual AP name.
    max_length: 15
  nas-filter-rule:
    type: enum
    raw_type: option
    description: Enable/disable NAS filter rule support (default = disable).
    default: disable
  neighbor-report-dual-band:
    type: enum
    raw_type: option
    description: Enable/disable dual-band neighbor report (default = disable).
    default: disable
  okc:
    type: enum
    raw_type: option
    description: Enable/disable Opportunistic Key Caching (OKC) (default = enable).
    default: enable
  osen:
    type: enum
    raw_type: option
    description: Enable/disable OSEN as part of key management (default = disable).
    default: disable
  owe-groups:
    type: enum
    raw_type: option
    description: OWE-Groups.
  owe-transition:
    type: enum
    raw_type: option
    description: Enable/disable OWE transition mode support.
    default: disable
  owe-transition-ssid:
    type: string
    raw_type: string
    description: OWE transition mode peer SSID.
    max_length: 32
  passphrase:
    type: password
    raw_type: password
    description: WPA pre-shared key (PSK) to be used to authenticate WiFi users.
  pmf:
    type: enum
    raw_type: option
    description: Protected Management Frames (PMF) support (default = disable).
    default: disable
  pmf-assoc-comeback-timeout:
    type: integer
    raw_type: integer
    description: Protected Management Frames (PMF) comeback maximum timeout (1-20 sec).
    default: '1'
    min: 1
    max: 20
  pmf-sa-query-retry-timeout:
    type: integer
    raw_type: integer
    description: Protected Management Frames (PMF) SA query retry timeout interval (1 - 5 100s of msec).
    default: '2'
    min: 1
    max: 5
  port-macauth:
    type: enum
    raw_type: option
    description: Enable/disable LAN port MAC authentication (default = disable).
    default: disable
  port-macauth-reauth-timeout:
    type: integer
    raw_type: integer
    description: LAN port MAC authentication re-authentication timeout value (default = 7200 sec).
    default: '7200'
    min: 120
    max: 65535
  port-macauth-timeout:
    type: integer
    raw_type: integer
    description: LAN port MAC authentication idle timeout value (default = 600 sec).
    default: '600'
    min: 60
    max: 65535
  portal-message-override-group:
    type: string
    raw_type: string
    description: Replacement message group for this VAP (only available when security is set to a captive portal type).
    max_length: 35
  portal-type:
    type: enum
    raw_type: option
    description: Captive portal functionality. Configure how the captive portal authenticates users and whether it includes
      a disclaimer.
    default: auth
  pre-auth:
    type: enum
    raw_type: option
    description: Enable/disable pre-authentication, where supported by clients (default = enable).
    default: enable
  primary-wag-profile:
    type: string
    raw_type: string
    description: Primary wireless access gateway profile name.
    max_length: 35
  probe-resp-suppression:
    type: enum
    raw_type: option
    description: Enable/disable probe response suppression (to ignore weak signals) (default = disable).
    default: disable
  probe-resp-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the AP response to probe requests (-95 to -20, default
      = -80).
    default: '-80'
    max_length: 7
  ptk-rekey:
    type: enum
    raw_type: option
    description: Enable/disable PTK rekey for WPA-Enterprise security.
    default: disable
  ptk-rekey-intv:
    type: integer
    raw_type: integer
    description: PTK rekey interval (600 - 864000 sec, default = 86400).
    default: '86400'
    min: 600
    max: 864000
  qos-profile:
    type: string
    raw_type: string
    description: Quality of service profile name.
    max_length: 35
  quarantine:
    type: enum
    raw_type: option
    description: Enable/disable station quarantine (default = disable).
    default: disable
  radio-2g-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the AP response to receive a packet in 2.4G band (-95
      to -20, default = -79).
    default: '-79'
    max_length: 7
  radio-5g-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the AP response to receive a packet in 5G band(-95 to
      -20, default = -76).
    default: '-76'
    max_length: 7
  radio-sensitivity:
    type: enum
    raw_type: option
    description: Enable/disable software radio sensitivity (to ignore weak signals) (default = disable).
    default: disable
  radius-mac-auth:
    type: enum
    raw_type: option
    description: Enable/disable RADIUS-based MAC authentication of clients (default = disable).
    default: disable
  radius-mac-auth-block-interval:
    type: integer
    raw_type: integer
    description: Don't send RADIUS MAC auth request again if the client has been rejected within specific interval (0 or 30
      - 864000 seconds, default = 0, 0 to disable blocking).
    default: '0'
    min: 30
    max: 864000
  radius-mac-auth-server:
    type: string
    raw_type: string
    description: RADIUS-based MAC authentication server.
    max_length: 35
  radius-mac-auth-usergroups:
    type: string
    raw_type: string
    description: Selective user groups that are permitted for RADIUS mac authentication. User group name.
    max_length: 79
  radius-mac-mpsk-auth:
    type: enum
    raw_type: option
    description: Enable/disable RADIUS-based MAC authentication of clients for MPSK authentication (default = disable).
    default: disable
  radius-mac-mpsk-timeout:
    type: integer
    raw_type: integer
    description: RADIUS MAC MPSK cache timeout interval (0 or 300 - 864000, default = 86400, 0 to disable caching).
    default: '86400'
    min: 300
    max: 864000
  radius-server:
    type: string
    raw_type: string
    description: RADIUS server to be used to authenticate WiFi users.
    max_length: 35
  rates-11a:
    type: enum
    raw_type: option
    description: Allowed data rates for 802.11a.
  rates-11ac-mcs-map:
    type: string
    raw_type: string
    description: Comma separated list of max supported VHT MCS for spatial streams 1 through 8.
    max_length: 63
  rates-11ax-mcs-map:
    type: string
    raw_type: string
    description: Comma separated list of max supported HE MCS for spatial streams 1 through 8.
    max_length: 63
  rates-11be-mcs-map:
    type: string
    raw_type: string
    description: Comma separated list of max nss that supports EHT-MCS 0-9, 10-11, 12-13 for 20MHz/40MHz/80MHz bandwidth.
    max_length: 15
  rates-11be-mcs-map-160:
    type: string
    raw_type: string
    description: Comma separated list of max nss that supports EHT-MCS 0-9, 10-11, 12-13 for 160MHz bandwidth.
    max_length: 15
  rates-11be-mcs-map-320:
    type: string
    raw_type: string
    description: Comma separated list of max nss that supports EHT-MCS 0-9, 10-11, 12-13 for 320MHz bandwidth.
    max_length: 15
  rates-11bg:
    type: enum
    raw_type: option
    description: Allowed data rates for 802.11b/g.
  rates-11n-ss12:
    type: enum
    raw_type: option
    description: Allowed data rates for 802.11n with 1 or 2 spatial streams.
  rates-11n-ss34:
    type: enum
    raw_type: option
    description: Allowed data rates for 802.11n with 3 or 4 spatial streams.
  roaming-acct-interim-update:
    type: enum
    raw_type: option
    description: Enable/disable using accounting interim update instead of accounting start/stop on roaming for WPA-Enterprise
      security.
    default: disable
  sae-groups:
    type: enum
    raw_type: option
    description: SAE-Groups.
  sae-h2e-only:
    type: enum
    raw_type: option
    description: Use hash-to-element-only mechanism for PWE derivation (default = disable).
    default: disable
  sae-hnp-only:
    type: enum
    raw_type: option
    description: Use hunting-and-pecking-only mechanism for PWE derivation (default = disable).
    default: disable
  sae-password:
    type: password
    raw_type: password
    description: WPA3 SAE password to be used to authenticate WiFi users.
  sae-pk:
    type: enum
    raw_type: option
    description: Enable/disable WPA3 SAE-PK (default = disable).
    default: disable
  sae-private-key:
    type: string
    raw_type: string
    description: Private key used for WPA3 SAE-PK authentication.
    max_length: 359
  scan-botnet-connections:
    type: enum
    raw_type: option
    description: Block or monitor connections to Botnet servers or disable Botnet scanning.
    default: monitor
  schedule:
    type: string
    raw_type: string
    description: Firewall schedules for enabling this VAP on the FortiAP. This VAP will be enabled when at least one of the
      schedules is valid. Separate multiple schedule names with a space. Schedule name.
    max_length: 35
  secondary-wag-profile:
    type: string
    raw_type: string
    description: Secondary wireless access gateway profile name.
    max_length: 35
  security:
    type: enum
    raw_type: option
    description: Security mode for the wireless interface (default = wpa2-only-personal).
    default: wpa2-only-personal
  security-exempt-list:
    type: string
    raw_type: string
    description: Optional security exempt list for captive portal authentication.
    max_length: 35
  security-redirect-url:
    type: string
    raw_type: var-string
    description: Optional URL for redirecting users after they pass captive portal authentication.
    max_length: 1023
  selected-usergroups:
    type: string
    raw_type: string
    description: Selective user groups that are permitted to authenticate. User group name.
    max_length: 79
  split-tunneling:
    type: enum
    raw_type: option
    description: Enable/disable split tunneling (default = disable).
    default: disable
  ssid:
    type: string
    raw_type: string
    description: IEEE 802.11 service set identifier (SSID) for the wireless interface. Users who wish to use the wireless
      network must configure their computers to access this SSID name.
    default: fortinet
    max_length: 32
  sticky-client-remove:
    type: enum
    raw_type: option
    description: Enable/disable sticky client remove to maintain good signal level clients in SSID (default = disable).
    default: disable
  sticky-client-threshold-2g:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the 2G client to be serviced by the AP (-95 to -20, default
      = -79).
    default: '-79'
    max_length: 7
  sticky-client-threshold-5g:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the 5G client to be serviced by the AP (-95 to -20, default
      = -76).
    default: '-76'
    max_length: 7
  sticky-client-threshold-6g:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the 6G client to be serviced by the AP (-95 to -20, default
      = -76).
    default: '-76'
    max_length: 7
  target-wake-time:
    type: enum
    raw_type: option
    description: Enable/disable 802.11ax target wake time (default = enable).
    default: enable
  tkip-counter-measure:
    type: enum
    raw_type: option
    description: Enable/disable TKIP counter measure.
    default: enable
  tunnel-echo-interval:
    type: integer
    raw_type: integer
    description: The time interval to send echo to both primary and secondary tunnel peers (1 - 65535 sec, default = 300).
    default: '300'
    min: 1
    max: 65535
  tunnel-fallback-interval:
    type: integer
    raw_type: integer
    description: The time interval for secondary tunnel to fall back to primary tunnel (0 - 65535 sec, default = 7200).
    default: '7200'
    min: 0
    max: 65535
  usergroup:
    type: string
    raw_type: string
    description: Firewall user group to be used to authenticate WiFi users. User group name.
    max_length: 79
  utm-log:
    type: enum
    raw_type: option
    description: Enable/disable UTM logging.
    default: enable
  utm-profile:
    type: string
    raw_type: string
    description: UTM profile name.
    max_length: 35
  utm-status:
    type: enum
    raw_type: option
    description: Enable to add one or more security profiles (AV, IPS, etc.) to the VAP.
    default: disable
  vlan-auto:
    type: enum
    raw_type: option
    description: Enable/disable automatic management of SSID VLAN interface.
    default: disable
  vlan-pooling:
    type: enum
    raw_type: option
    description: Enable/disable VLAN pooling, to allow grouping of multiple wireless controller VLANs into VLAN pools (default
      = disable). When set to wtp-group, VLAN pooling occurs with VLAN assignment by wtp-group.
    default: disable
  vlanid:
    type: integer
    raw_type: integer
    description: Optional VLAN ID.
    default: '0'
    min: 0
    max: 4094
  webfilter-profile:
    type: string
    raw_type: string
    description: WebFilter profile name.
    max_length: 47
children:
  portal-message-overrides:
    attributes:
      auth-disclaimer-page:
        type: string
        raw_type: string
        description: Override auth-disclaimer-page message with message from portal-message-overrides group.
        max_length: 35
      auth-login-failed-page:
        type: string
        raw_type: string
        description: Override auth-login-failed-page message with message from portal-message-overrides group.
        max_length: 35
      auth-login-page:
        type: string
        raw_type: string
        description: Override auth-login-page message with message from portal-message-overrides group.
        max_length: 35
      auth-reject-page:
        type: string
        raw_type: string
        description: Override auth-reject-page message with message from portal-message-overrides group.
        max_length: 35
  vlan-name:
    attributes:
      name:
        type: string
        raw_type: string
        description: VLAN name.
        max_length: 35
      vlan-id:
        type: integer
        raw_type: integer
        description: VLAN IDs (maximum 8 VLAN IDs).
        min: 0
        max: 4094
  vlan-pool:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4094
      wtp-group:
        type: string
        raw_type: string
        description: WTP group list(maximum 16 WTP groups). WTP group name.
        max_length: 35
