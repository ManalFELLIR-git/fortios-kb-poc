id: system.pcp-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/437202313/config-system-pcp-server
attributes:
  status:
    type: enum
    raw_type: option
    description: Enable/disable PCP server.
    default: disable
children:
  pools:
    attributes:
      allow-opcode:
        type: enum
        raw_type: option
        description: Allowed PCP opcode.
        default: map peer announce
      announcement-count:
        type: integer
        raw_type: integer
        description: Number of multicast announcements.
        default: '3'
        min: 3
        max: 10
      arp-reply:
        type: enum
        raw_type: option
        description: Enable to respond to ARP requests for external IP (default = enable).
        default: enable
      client-mapping-limit:
        type: integer
        raw_type: integer
        description: Mapping limit per client (0 - 65535, default = 0, 0 = unlimited).
        default: '0'
        min: 0
        max: 65535
      client-subnet:
        type: string
        raw_type: string
        description: Subnets from which PCP requests are accepted. Client subnets.
        max_length: 79
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 127
      ext-intf:
        type: string
        raw_type: string
        description: External interface name.
        max_length: 35
      extip:
        type: string
        raw_type: user
        description: IP address or address range on the external interface that you want to map to an address on the internal
          network.
      extport:
        type: string
        raw_type: user
        description: Incoming port number range that you want to map to a port number on the internal network.
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      intl-intf:
        type: string
        raw_type: string
        description: Internal interface name. Interface name.
        max_length: 79
      mapping-filter-limit:
        type: integer
        raw_type: integer
        description: Filter limit per mapping (0 - 5, default = 1).
        default: '1'
        min: 0
        max: 5
      maximal-lifetime:
        type: integer
        raw_type: integer
        description: Maximal lifetime of a PCP mapping in seconds (3600 - 604800, default = 86400).
        default: '86400'
        min: 3600
        max: 604800
      minimal-lifetime:
        type: integer
        raw_type: integer
        description: Minimal lifetime of a PCP mapping in seconds (60 - 300, default = 120).
        default: '120'
        min: 60
        max: 300
      multicast-announcement:
        type: enum
        raw_type: option
        description: Enable/disable multicast announcements.
        default: enable
      name:
        type: string
        raw_type: string
        description: PCP pool name.
        max_length: 79
      recycle-delay:
        type: integer
        raw_type: integer
        description: Minimum delay (in seconds) the PCP Server will wait before recycling mappings that have expired (0 -
          3600, default = 0).
        default: '0'
        min: 0
        max: 3600
      third-party:
        type: enum
        raw_type: option
        description: Allow/disallow third party option.
        default: disallow
      third-party-subnet:
        type: string
        raw_type: string
        description: Subnets from which third party requests are accepted. Third party subnets.
        max_length: 79
