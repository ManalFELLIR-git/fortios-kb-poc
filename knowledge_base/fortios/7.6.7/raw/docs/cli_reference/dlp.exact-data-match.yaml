id: dlp.exact-data-match
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/155920547/config-dlp-exact-data-match
attributes:
  data:
    type: string
    raw_type: string
    description: External resource for exact data match.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Name of table containing the exact-data-match template.
    max_length: 35
  optional:
    type: integer
    raw_type: integer
    description: Number of optional columns need to match.
    default: '0'
    min: 0
    max: 32
children:
  columns:
    attributes:
      index:
        type: integer
        raw_type: integer
        description: Column index.
        default: '0'
        min: 1
        max: 32
      optional:
        type: enum
        raw_type: option
        description: Enable/disable optional match.
        default: disable
      type:
        type: string
        raw_type: string
        description: Data-type for this column.
        max_length: 35
