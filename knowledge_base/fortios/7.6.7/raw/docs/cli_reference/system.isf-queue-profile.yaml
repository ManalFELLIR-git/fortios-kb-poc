id: system.isf-queue-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/442264941/config-system-isf-queue-profile
attributes:
  bandwidth-unit:
    type: enum
    raw_type: option
    description: Unit of measurement for guaranteed and maximum bandwidth.
    default: kbps
  burst-bps-granularity:
    type: enum
    raw_type: option
    description: Burst granularity based on bytes per second.
    default: disable
  burst-pps-granularity:
    type: enum
    raw_type: option
    description: Burst granularity based on packets per second.
    default: disable
  guaranteed-bandwidth:
    type: integer
    raw_type: integer
    description: Guaranteed bandwidth.
    default: '0'
    min: 0
    max: 1000000000
  maximum-bandwidth:
    type: integer
    raw_type: integer
    description: Upper bandwidth limit enforced.
    default: '0'
    min: 0
    max: 1000000000
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 15
children: {}
