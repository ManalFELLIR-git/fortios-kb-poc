id: firewall.shaper.per-ip-shaper
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/691568157/config-firewall-shaper-per-ip-shaper
attributes:
  bandwidth-unit:
    type: enum
    raw_type: option
    description: Unit of measurement for maximum bandwidth for this shaper (Kbps, Mbps or Gbps).
    default: kbps
  diffserv-forward:
    type: enum
    raw_type: option
    description: Enable/disable changing the Forward (original) DiffServ setting applied to traffic accepted by this shaper.
    default: disable
  diffserv-reverse:
    type: enum
    raw_type: option
    description: Enable/disable changing the Reverse (reply) DiffServ setting applied to traffic accepted by this shaper.
    default: disable
  diffservcode-forward:
    type: string
    raw_type: user
    description: Forward (original) DiffServ setting to be applied to traffic accepted by this shaper.
  diffservcode-rev:
    type: string
    raw_type: user
    description: Reverse (reply) DiffServ setting to be applied to traffic accepted by this shaper.
  max-bandwidth:
    type: integer
    raw_type: integer
    description: Upper bandwidth limit enforced by this shaper (0 - 80000000). 0 means no limit. Units depend on the bandwidth-unit
      setting.
    default: '0'
    min: 0
    max: 80000000
  max-concurrent-session:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent sessions allowed by this shaper (0 - 2097000). 0 means no limit.
    default: '0'
    min: 0
    max: 2097000
  max-concurrent-tcp-session:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent TCP sessions allowed by this shaper (0 - 2097000). 0 means no limit.
    default: '0'
    min: 0
    max: 2097000
  max-concurrent-udp-session:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent UDP sessions allowed by this shaper (0 - 2097000). 0 means no limit.
    default: '0'
    min: 0
    max: 2097000
  name:
    type: string
    raw_type: string
    description: Traffic shaper name.
    max_length: 35
children: {}
