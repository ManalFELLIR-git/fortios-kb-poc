id: extension-controller.extender-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/119972587/config-extension-controller-extender-profile
attributes:
  allowaccess:
    type: enum
    raw_type: option
    description: Control management access to the managed extender. Separate entries with a space.
  bandwidth-limit:
    type: integer
    raw_type: integer
    description: FortiExtender LAN extension bandwidth limit (Mbps).
    default: '1024'
    min: 1
    max: 16776000
  enforce-bandwidth:
    type: enum
    raw_type: option
    description: Enable/disable enforcement of bandwidth on LAN extension interface.
    default: disable
  extension:
    type: enum
    raw_type: option
    description: Extension option.
    default: wan-extension **
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '32'
    min: 0
    max: 102400000
  login-password:
    type: password
    raw_type: password
    description: Set the managed extender's administrator password.
  login-password-change:
    type: enum
    raw_type: option
    description: Change or reset the administrator password of a managed extender (yes, default, or no, default = no).
    default: 'no'
  model:
    type: enum
    raw_type: option
    description: Model.
    default: FX201E
  name:
    type: string
    raw_type: string
    description: FortiExtender profile name.
    max_length: 31
children:
  cellular:
    attributes:
      dataplan:
        type: string
        raw_type: string
        description: Dataplan names. Dataplan name.
        max_length: 79
  controller-report:
    attributes:
      interval:
        type: integer
        raw_type: integer
        description: Controller report interval.
        default: '300'
        min: 0
        max: 4294967295
      signal-threshold:
        type: integer
        raw_type: integer
        description: Controller report signal threshold.
        default: '10'
        min: 10
        max: 50
      status:
        type: enum
        raw_type: option
        description: FortiExtender controller report status.
        default: disable
  modem1:
    attributes:
      conn-status:
        type: integer
        raw_type: integer
        description: Connection status. Read-only.
        default: '0'
        min: 0
        max: 4294967295
      default-sim:
        type: enum
        raw_type: option
        description: Default SIM selection.
        default: sim1
      gps:
        type: enum
        raw_type: option
        description: FortiExtender GPS enable/disable.
        default: enable
      multiple-PDN:
        type: enum
        raw_type: option
        description: Multiple-PDN enable/disable.
        default: disable
      pdn1-dataplan:
        type: string
        raw_type: string
        description: PDN1-dataplan.
        max_length: 31
      pdn2-dataplan:
        type: string
        raw_type: string
        description: PDN2-dataplan.
        max_length: 31
      pdn3-dataplan:
        type: string
        raw_type: string
        description: PDN3-dataplan.
        max_length: 31
      pdn4-dataplan:
        type: string
        raw_type: string
        description: PDN4-dataplan.
        max_length: 31
      preferred-carrier:
        type: string
        raw_type: string
        description: Preferred carrier.
        max_length: 31
      redundant-intf:
        type: string
        raw_type: string
        description: Redundant interface.
        max_length: 15
      redundant-mode:
        type: enum
        raw_type: option
        description: FortiExtender mode.
        default: disable
      sim1-pin:
        type: enum
        raw_type: option
        description: 'SIM #1 PIN status.'
        default: disable
      sim1-pin-code:
        type: password
        raw_type: password
        description: 'SIM #1 PIN password.'
      sim2-pin:
        type: enum
        raw_type: option
        description: 'SIM #2 PIN status.'
        default: disable
      sim2-pin-code:
        type: password
        raw_type: password
        description: 'SIM #2 PIN password.'
  auto-switch:
    attributes:
      dataplan:
        type: enum
        raw_type: option
        description: Automatically switch based on data usage.
        default: disable
      disconnect:
        type: enum
        raw_type: option
        description: Auto switch by disconnect.
        default: disable
      disconnect-period:
        type: integer
        raw_type: integer
        description: Automatically switch based on disconnect period.
        default: '600'
        min: 600
        max: 18000
      disconnect-threshold:
        type: integer
        raw_type: integer
        description: Automatically switch based on disconnect threshold.
        default: '3'
        min: 1
        max: 100
      signal:
        type: enum
        raw_type: option
        description: Automatically switch based on signal strength.
        default: disable
      switch-back:
        type: enum
        raw_type: option
        description: Auto switch with switch back multi-options.
      switch-back-time:
        type: string
        raw_type: string
        description: Automatically switch over to preferred SIM/carrier at a specified time in UTC (HH:MM).
        default: 00:01
        max_length: 31
      switch-back-timer:
        type: integer
        raw_type: integer
        description: Automatically switch over to preferred SIM/carrier after the given time (3600 - 2147483647 sec).
        default: '86400'
        min: 3600
        max: 2147483647
  modem2:
    attributes:
      conn-status:
        type: integer
        raw_type: integer
        description: Connection status. Read-only.
        default: '0'
        min: 0
        max: 4294967295
      default-sim:
        type: enum
        raw_type: option
        description: Default SIM selection.
        default: sim1
      gps:
        type: enum
        raw_type: option
        description: FortiExtender GPS enable/disable.
        default: enable
      multiple-PDN:
        type: enum
        raw_type: option
        description: Multiple-PDN enable/disable.
        default: disable
      pdn1-dataplan:
        type: string
        raw_type: string
        description: PDN1-dataplan.
        max_length: 31
      pdn2-dataplan:
        type: string
        raw_type: string
        description: PDN2-dataplan.
        max_length: 31
      pdn3-dataplan:
        type: string
        raw_type: string
        description: PDN3-dataplan.
        max_length: 31
      pdn4-dataplan:
        type: string
        raw_type: string
        description: PDN4-dataplan.
        max_length: 31
      preferred-carrier:
        type: string
        raw_type: string
        description: Preferred carrier.
        max_length: 31
      redundant-intf:
        type: string
        raw_type: string
        description: Redundant interface.
        max_length: 15
      redundant-mode:
        type: enum
        raw_type: option
        description: FortiExtender mode.
        default: disable
      sim1-pin:
        type: enum
        raw_type: option
        description: 'SIM #1 PIN status.'
        default: disable
      sim1-pin-code:
        type: password
        raw_type: password
        description: 'SIM #1 PIN password.'
      sim2-pin:
        type: enum
        raw_type: option
        description: 'SIM #2 PIN status.'
        default: disable
      sim2-pin-code:
        type: password
        raw_type: password
        description: 'SIM #2 PIN password.'
  sms-notification:
    attributes:
      status:
        type: enum
        raw_type: option
        description: FortiExtender SMS notification status.
        default: disable
  alert:
    attributes:
      data-exhausted:
        type: string
        raw_type: string
        description: Display string when data exhausted.
        default: data plan is exhausted
        max_length: 63
      fgt-backup-mode-switch:
        type: string
        raw_type: string
        description: Display string when FortiGate backup mode switched.
        default: FortiGate backup work mode switched
        max_length: 63
      low-signal-strength:
        type: string
        raw_type: string
        description: Display string when signal strength is low.
        default: LTE signal strength is too low
        max_length: 63
      mode-switch:
        type: string
        raw_type: string
        description: Display string when mode is switched.
        default: system networking mode switched
        max_length: 63
      os-image-fallback:
        type: string
        raw_type: string
        description: Display string when falling back to a previous OS image.
        default: system start to fallback OS image
        max_length: 63
      session-disconnect:
        type: string
        raw_type: string
        description: Display string when session disconnected.
        default: LTE data session is disconnected
        max_length: 63
      system-reboot:
        type: string
        raw_type: string
        description: Display string when system rebooted.
        default: system will reboot
        max_length: 63
  receiver:
    attributes:
      alert:
        type: enum
        raw_type: option
        description: Alert multi-options.
      name:
        type: string
        raw_type: string
        description: FortiExtender SMS notification receiver name.
        max_length: 31
      phone-number:
        type: string
        raw_type: string
        description: 'Receiver phone number. Format: [+][country code][area code][local phone number]. For example, +16501234567.'
        max_length: 31
      status:
        type: enum
        raw_type: option
        description: SMS notification receiver status.
        default: disable
  lan-extension:
    attributes:
      backhaul-interface:
        type: string
        raw_type: string
        description: IPsec phase1 interface.
        max_length: 15
      backhaul-ip:
        type: string
        raw_type: string
        description: IPsec phase1 IPv4/FQDN. Used to specify the external IP/FQDN when the FortiGate unit is behind a NAT
          device.
        max_length: 63
      ipsec-tunnel:
        type: string
        raw_type: string
        description: IPsec tunnel name.
        max_length: 15
      link-loadbalance:
        type: enum
        raw_type: option
        description: LAN extension link load balance strategy.
        default: activebackup
  backhaul:
    attributes:
      health-check-fail-cnt:
        type: integer
        raw_type: integer
        description: Number of failures before the link is considered dead (1 - 10, default = 5).
        default: '5'
        min: 1
        max: 10
      health-check-interval:
        type: integer
        raw_type: integer
        description: Health monitoring interval in seconds (1 - 3600, default = 5).
        default: '5'
        min: 1
        max: 3600
      health-check-probe-cnt:
        type: integer
        raw_type: integer
        description: Number of health monitoring probes to send within an interval (1 - 10, default = 1).
        default: '1'
        min: 1
        max: 10
      health-check-probe-tm:
        type: integer
        raw_type: integer
        description: Health monitoring probe timeout in seconds (1 - 10, default = 2).
        default: '2'
        min: 1
        max: 10
      health-check-recovery-cnt:
        type: integer
        raw_type: integer
        description: Number of successful checks before the link is considered alive (1 - 10, default = 5).
        default: '5'
        min: 1
        max: 10
      name:
        type: string
        raw_type: string
        description: FortiExtender LAN extension backhaul name.
        max_length: 31
      port:
        type: enum
        raw_type: option
        description: FortiExtender uplink port.
        default: wan
      role:
        type: enum
        raw_type: option
        description: FortiExtender uplink port.
        default: primary
      weight:
        type: integer
        raw_type: integer
        description: WRR weight parameter.
        default: '1'
        min: 1
        max: 256
  downlinks:
    attributes:
      name:
        type: string
        raw_type: string
        description: FortiExtender LAN extension downlink config entry name.
        max_length: 31
      port:
        type: enum
        raw_type: option
        description: FortiExtender LAN extension downlink port.
      pvid:
        type: integer
        raw_type: integer
        description: FortiExtender LAN extension downlink PVID (1 - 4089).
        default: '1'
        min: 1
        max: 4089
      type:
        type: enum
        raw_type: option
        description: FortiExtender LAN extension downlink type [port/vap].
        default: port
      vap:
        type: string
        raw_type: string
        description: FortiExtender LAN extension downlink vap.
        max_length: 31
      vids:
        type: integer
        raw_type: integer
        description: FortiExtender LAN extension downlink VIDs. Please enter VID numbers (1 - 4089) with space separated.
          Up to 50 VIDs are accepted.
        min: 1
        max: 4089
  traffic-split-services:
    attributes:
      address:
        type: string
        raw_type: string
        description: Address selection.
        max_length: 79
      name:
        type: string
        raw_type: string
        description: FortiExtender LAN extension tunnel split entry name.
        max_length: 31
      service:
        type: string
        raw_type: string
        description: Service selection.
        default: ALL
        max_length: 79
      vsdb:
        type: enum
        raw_type: option
        description: Set video streaming traffic goes through local WAN [enable/disable].
        default: disable
  wifi:
    attributes:
      country:
        type: enum
        raw_type: option
        description: Country in which this FEX will operate (default = NA).
        default: --
  radio-1:
    attributes:
      80211d:
        type: enum
        raw_type: option
        description: Enable/disable Wi-Fi 802.11d.
        default: enable
      band:
        type: enum
        raw_type: option
        description: Wi-Fi band selection 2.4GHz / 5GHz.
        default: 2.4GHz
      bandwidth:
        type: enum
        raw_type: option
        description: Wi-Fi channel bandwidth.
        default: auto
      beacon-interval:
        type: integer
        raw_type: integer
        description: Wi-Fi beacon interval in miliseconds (100 - 3500, default = 100).
        default: '100'
        min: 100
        max: 3500
      bss-color:
        type: integer
        raw_type: integer
        description: Wi-Fi 802.11AX BSS color value (0 - 63, 0 = disable, default = 0).
        default: '0'
        min: 0
        max: 63
      bss-color-mode:
        type: enum
        raw_type: option
        description: Wi-Fi 802.11AX BSS color mode.
        default: auto
      channel:
        type: enum
        raw_type: option
        description: Wi-Fi channels.
      extension-channel:
        type: enum
        raw_type: option
        description: Wi-Fi extension channel.
        default: auto
      guard-interval:
        type: enum
        raw_type: option
        description: Wi-Fi guard interval.
        default: auto
      lan-ext-vap:
        type: string
        raw_type: string
        description: Wi-Fi LAN-Extention VAP. Select only one VAP.
        max_length: 31
      local-vaps:
        type: string
        raw_type: string
        description: Wi-Fi local VAP. Select up to three VAPs. Wi-Fi local VAP name.
        max_length: 79
      max-clients:
        type: integer
        raw_type: integer
        description: Maximum number of Wi-Fi radio clients (0 - 512, 0 = unlimited, default = 0).
        default: '0'
        min: 0
        max: 512
      mode:
        type: enum
        raw_type: option
        description: Wi-Fi radio mode AP(LAN mode) / Client(WAN mode).
        default: AP
      operating-standard:
        type: enum
        raw_type: option
        description: Wi-Fi operating standard.
        default: auto
      power-level:
        type: integer
        raw_type: integer
        description: Wi-Fi power level in percent (0 - 100, 0 = auto, default = 100).
        default: '100'
        min: 0
        max: 100
      status:
        type: enum
        raw_type: option
        description: Enable/disable Wi-Fi radio.
        default: disable
  radio-2:
    attributes:
      80211d:
        type: enum
        raw_type: option
        description: Enable/disable Wi-Fi 802.11d.
        default: enable
      band:
        type: enum
        raw_type: option
        description: Wi-Fi band selection 2.4GHz / 5GHz.
        default: 5GHz
      bandwidth:
        type: enum
        raw_type: option
        description: Wi-Fi channel bandwidth.
        default: auto
      beacon-interval:
        type: integer
        raw_type: integer
        description: Wi-Fi beacon interval in miliseconds (100 - 3500, default = 100).
        default: '100'
        min: 100
        max: 3500
      bss-color:
        type: integer
        raw_type: integer
        description: Wi-Fi 802.11AX BSS color value (0 - 63, 0 = disable, default = 0).
        default: '0'
        min: 0
        max: 63
      bss-color-mode:
        type: enum
        raw_type: option
        description: Wi-Fi 802.11AX BSS color mode.
        default: auto
      channel:
        type: enum
        raw_type: option
        description: Wi-Fi channels.
      extension-channel:
        type: enum
        raw_type: option
        description: Wi-Fi extension channel.
        default: auto
      guard-interval:
        type: enum
        raw_type: option
        description: Wi-Fi guard interval.
        default: auto
      lan-ext-vap:
        type: string
        raw_type: string
        description: Wi-Fi LAN-Extention VAP. Select only one VAP.
        max_length: 31
      local-vaps:
        type: string
        raw_type: string
        description: Wi-Fi local VAP. Select up to three VAPs. Wi-Fi local VAP name.
        max_length: 79
      max-clients:
        type: integer
        raw_type: integer
        description: Maximum number of Wi-Fi radio clients (0 - 512, 0 = unlimited, default = 0).
        default: '0'
        min: 0
        max: 512
      mode:
        type: enum
        raw_type: option
        description: Wi-Fi radio mode AP(LAN mode) / Client(WAN mode).
        default: AP
      operating-standard:
        type: enum
        raw_type: option
        description: Wi-Fi operating standard.
        default: auto
      power-level:
        type: integer
        raw_type: integer
        description: Wi-Fi power level in percent (0 - 100, 0 = auto, default = 100).
        default: '100'
        min: 0
        max: 100
      status:
        type: enum
        raw_type: option
        description: Enable/disable Wi-Fi radio.
        default: disable
