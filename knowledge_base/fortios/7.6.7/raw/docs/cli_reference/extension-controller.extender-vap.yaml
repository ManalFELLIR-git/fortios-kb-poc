id: extension-controller.extender-vap
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/136862991/config-extension-controller-extender-vap
attributes:
  allowaccess:
    type: enum
    raw_type: option
    description: Control management access to the managed extender. Separate entries with a space.
  auth-server-address:
    type: string
    raw_type: string
    description: Wi-Fi Authentication Server Address (IPv4 format).
    max_length: 63
  auth-server-port:
    type: integer
    raw_type: integer
    description: Wi-Fi Authentication Server Port.
    default: '0'
    min: 1
    max: 65535
  auth-server-secret:
    type: string
    raw_type: string
    description: Wi-Fi Authentication Server Secret.
    max_length: 63
  broadcast-ssid:
    type: enum
    raw_type: option
    description: Wi-Fi broadcast SSID enable / disable.
    default: enable
  bss-color-partial:
    type: enum
    raw_type: option
    description: Wi-Fi 802.11AX bss color partial enable / disable, default = enable.
    default: enable
  dtim:
    type: integer
    raw_type: integer
    description: Wi-Fi DTIM (1 - 255) default = 1.
    default: '1'
    min: 1
    max: 255
  end-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: End ip address.
    default: 0.0.0.0
  ip-address:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: Extender ip address.
    default: 0.0.0.0 0.0.0.0
  max-clients:
    type: integer
    raw_type: integer
    description: Wi-Fi max clients (0 - 512), default = 0 (no limit)
    default: '0'
    min: 0
    max: 512
  mu-mimo:
    type: enum
    raw_type: option
    description: Wi-Fi multi-user MIMO enable / disable, default = enable.
    default: enable
  name:
    type: string
    raw_type: string
    description: Wi-Fi VAP name.
    max_length: 15
  passphrase:
    type: password
    raw_type: password
    description: Wi-Fi passphrase.
  pmf:
    type: enum
    raw_type: option
    description: Wi-Fi pmf enable/disable, default = disable.
    default: disabled
  rts-threshold:
    type: integer
    raw_type: integer
    description: Wi-Fi RTS Threshold (256 - 2347), default = 2347 (RTS/CTS disabled).
    default: '2347'
    min: 256
    max: 2347
  sae-password:
    type: password
    raw_type: password
    description: Wi-Fi SAE Password.
  security:
    type: enum
    raw_type: option
    description: Wi-Fi security.
    default: WPA2-Personal
  ssid:
    type: string
    raw_type: string
    description: Wi-Fi SSID.
    max_length: 32
  start-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Start ip address.
    default: 0.0.0.0
  target-wake-time:
    type: enum
    raw_type: option
    description: Wi-Fi 802.11AX target wake time enable / disable, default = enable.
    default: enable
  type:
    type: enum
    raw_type: option
    description: Wi-Fi VAP type local-vap / lan-extension-vap.
children: {}
