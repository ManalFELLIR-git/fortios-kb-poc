id: wireless-controller.timers
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/203814668/config-wireless-controller-timers
attributes:
  ap-reboot-wait-interval1:
    type: integer
    raw_type: integer
    description: Time in minutes to wait before AP reboots when there is no controller detected (5 - 65535, default = 0, 0
      for no reboot).
    default: '0'
    min: 5
    max: 65535
  ap-reboot-wait-interval2:
    type: integer
    raw_type: integer
    description: Time in minutes to wait before AP reboots when there is no controller detected and standalone SSIDs are pushed
      to the AP in the previous session (5 - 65535, default = 0, 0 for no reboot).
    default: '0'
    min: 5
    max: 65535
  ap-reboot-wait-time:
    type: string
    raw_type: string
    description: Time to reboot the AP when there is no controller detected and standalone SSIDs are pushed to the AP in the
      previous session, format hh:mm.
    max_length: 7
  auth-timeout:
    type: integer
    raw_type: integer
    description: Time after which a client is considered failed in RADIUS authentication and times out (5 - 30 sec, default
      = 5).
    default: '5'
    min: 5
    max: 30
  ble-device-cleanup:
    type: integer
    raw_type: integer
    description: Time period in minutes to keep BLE device after it is gone (default = 60).
    default: '60'
    min: 0
    max: 4294967295
  ble-scan-report-intv:
    type: integer
    raw_type: integer
    description: Time between running Bluetooth Low Energy (BLE) reports (10 - 3600 sec, default = 30).
    default: '30'
    min: 10
    max: 3600
  client-idle-rehome-timeout:
    type: integer
    raw_type: integer
    description: Time after which a client is considered idle and disconnected from the home controller (2 - 3600 sec, default
      = 20, 0 for no timeout).
    default: '20'
    min: 2
    max: 3600
  client-idle-timeout:
    type: integer
    raw_type: integer
    description: Time after which a client is considered idle and times out (20 - 3600 sec, default = 300, 0 for no timeout).
    default: '300'
    min: 20
    max: 3600
  discovery-interval:
    type: integer
    raw_type: integer
    description: Time between discovery requests (2 - 180 sec, default = 5).
    default: '5'
    min: 2
    max: 180
  drma-interval:
    type: integer
    raw_type: integer
    description: Dynamic radio mode assignment (DRMA) schedule interval in minutes (1 - 1440, default = 60).
    default: '60'
    min: 1
    max: 1440
  echo-interval:
    type: integer
    raw_type: integer
    description: Time between echo requests sent by the managed WTP, AP, or FortiAP (1 - 255 sec, default = 30).
    default: '30'
    min: 1
    max: 255
  fake-ap-log:
    type: integer
    raw_type: integer
    description: Time between recording logs about fake APs if periodic fake AP logging is configured (1 - 1440 min, default
      = 1).
    default: '1'
    min: 1
    max: 1440
  ipsec-intf-cleanup:
    type: integer
    raw_type: integer
    description: Time period to keep IPsec VPN interfaces up after WTP sessions are disconnected (30 - 3600 sec, default =
      120).
    default: '120'
    min: 30
    max: 3600
  nat-session-keep-alive:
    type: integer
    raw_type: integer
    description: Maximal time in seconds between control requests sent by the managed WTP, AP, or FortiAP (0 - 255 sec, default
      = 0).
    default: '0'
    min: 0
    max: 255
  radio-stats-interval:
    type: integer
    raw_type: integer
    description: Time between running radio reports (1 - 255 sec, default = 15).
    default: '15'
    min: 1
    max: 255
  rogue-ap-cleanup:
    type: integer
    raw_type: integer
    description: Time period in minutes to keep rogue AP after it is gone (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  rogue-ap-log:
    type: integer
    raw_type: integer
    description: Time between logging rogue AP messages if periodic rogue AP logging is configured (0 - 1440 min, default
      = 0).
    default: '0'
    min: 0
    max: 1440
  rogue-sta-cleanup:
    type: integer
    raw_type: integer
    description: Time period in minutes to keep rogue station after it is gone (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  sta-cap-cleanup:
    type: integer
    raw_type: integer
    description: Time period in minutes to keep station capability data after it is gone (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  sta-capability-interval:
    type: integer
    raw_type: integer
    description: Time between running station capability reports (1 - 255 sec, default = 30).
    default: '30'
    min: 1
    max: 255
  sta-locate-timer:
    type: integer
    raw_type: integer
    description: Time between running client presence flushes to remove clients that are listed but no longer present (0 -
      86400 sec, default = 1800).
    default: '1800'
    min: 0
    max: 86400
  sta-offline-cleanup:
    type: integer
    raw_type: integer
    description: Time period in seconds to keep station offline data after it is gone (default = 300).
    default: '300'
    min: 0
    max: 4294967295
  sta-offline-ip2mac-cleanup:
    type: integer
    raw_type: integer
    description: Time period in seconds to keep station offline Ip2mac data after it is gone (default = 300).
    default: '300'
    min: 0
    max: 4294967295
  sta-stats-interval:
    type: integer
    raw_type: integer
    description: Time between running client (station) reports (1 - 255 sec, default = 10).
    default: '10'
    min: 1
    max: 255
  vap-stats-interval:
    type: integer
    raw_type: integer
    description: Time between running Virtual Access Point (VAP) reports (1 - 255 sec, default = 15).
    default: '15'
    min: 1
    max: 255
  wids-entry-cleanup:
    type: integer
    raw_type: integer
    description: Time period in minutes to keep wids entry after it is gone (default = 0).
    default: '0'
    min: 0
    max: 4294967295
children: {}
