id: firewall.proxy-address
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/152481860/config-firewall-proxy-address
attributes:
  application:
    type: string
    raw_type: string
    description: SaaS application. SaaS application name.
    max_length: 79
  case-sensitivity:
    type: enum
    raw_type: option
    description: Enable to make the pattern case sensitive.
    default: disable
  category:
    type: integer
    raw_type: integer
    description: FortiGuard category ID. FortiGuard category ID.
    min: 0
    max: 4294967295
  color:
    type: integer
    raw_type: integer
    description: Integer value to determine the color of the icon in the GUI (1 - 32, default = 0, which sets value to 1).
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  header:
    type: string
    raw_type: string
    description: HTTP header name as a regular expression.
    max_length: 255
  header-name:
    type: string
    raw_type: string
    description: Name of HTTP header.
    max_length: 79
  host:
    type: string
    raw_type: string
    description: Address object for the host.
    max_length: 79
  host-regex:
    type: string
    raw_type: string
    description: Host name as a regular expression.
    max_length: 255
  method:
    type: enum
    raw_type: option
    description: HTTP request methods to be used.
  name:
    type: string
    raw_type: string
    description: Address name.
    max_length: 79
  path:
    type: string
    raw_type: string
    description: URL path as a regular expression.
    max_length: 255
  query:
    type: string
    raw_type: string
    description: Match the query part of the URL as a regular expression.
    max_length: 255
  referrer:
    type: enum
    raw_type: option
    description: Enable/disable use of referrer field in the HTTP header to match the address.
    default: disable
  type:
    type: enum
    raw_type: option
    description: Proxy address type.
    default: url
  ua:
    type: enum
    raw_type: option
    description: Names of browsers to be used as user agent.
  ua-max-ver:
    type: string
    raw_type: string
    description: Maximum version of the user agent specified in dotted notation. For example, use 120 with the ua field set
      to "chrome" to require Google Chrome's maximum version must be 120.
    max_length: 63
  ua-min-ver:
    type: string
    raw_type: string
    description: Minimum version of the user agent specified in dotted notation. For example, use 90.0.1 with the ua field
      set to "chrome" to require Google Chrome's minimum version must be 90.0.1.
    max_length: 63
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children:
  header-group:
    attributes:
      case-sensitivity:
        type: enum
        raw_type: option
        description: Case sensitivity in pattern.
        default: disable
      header:
        type: string
        raw_type: string
        description: HTTP header regular expression.
        max_length: 255
      header-name:
        type: string
        raw_type: string
        description: HTTP header.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
