id: system.affinity-interrupt
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/176980109/config-system-affinity-interrupt
attributes:
  affinity-cpumask:
    type: string
    raw_type: string
    description: Affinity setting (64-bit hexadecimal value in the format of 0xxxxxxxxxxxxxxxxx).
    max_length: 127
  default-affinity-cpumask:
    type: string
    raw_type: string
    description: Default affinity setting (64-bit hexadecimal value in the format of 0xxxxxxxxxxxxxxxxx). Read-only.
    max_length: 127
  id:
    type: integer
    raw_type: integer
    description: ID of the interrupt affinity setting.
    default: '0'
    min: 0
    max: 4294967295
  interrupt:
    type: string
    raw_type: string
    description: Interrupt name.
    max_length: 127
children: {}
