id: webfilter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/285848147/config-webfilter-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  extended-log:
    type: enum
    raw_type: option
    description: Enable/disable extended logging for web filtering.
    default: disable
  feature-set:
    type: enum
    raw_type: option
    description: Flow/proxy feature set.
    default: flow
  https-replacemsg:
    type: enum
    raw_type: option
    description: Enable replacement messages for HTTPS.
    default: enable
  log-all-url:
    type: enum
    raw_type: option
    description: Enable/disable logging all URLs visited.
    default: disable
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
  options:
    type: enum
    raw_type: option
    description: Options.
  ovrd-perm:
    type: enum
    raw_type: option
    description: Permitted override types.
  post-action:
    type: enum
    raw_type: option
    description: Action taken for HTTP POST traffic.
    default: normal
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group.
    max_length: 35
  web-antiphishing-log:
    type: enum
    raw_type: option
    description: Enable/disable logging of AntiPhishing checks.
    default: enable
  web-content-log:
    type: enum
    raw_type: option
    description: Enable/disable logging logging blocked web content.
    default: enable
  web-extended-all-action-log:
    type: enum
    raw_type: option
    description: Enable/disable extended any filter action logging for web filtering.
    default: disable
  web-filter-activex-log:
    type: enum
    raw_type: option
    description: Enable/disable logging ActiveX.
    default: enable
  web-filter-applet-log:
    type: enum
    raw_type: option
    description: Enable/disable logging Java applets.
    default: enable
  web-filter-command-block-log:
    type: enum
    raw_type: option
    description: Enable/disable logging blocked commands.
    default: enable
  web-filter-cookie-log:
    type: enum
    raw_type: option
    description: Enable/disable logging cookie filtering.
    default: enable
  web-filter-cookie-removal-log:
    type: enum
    raw_type: option
    description: Enable/disable logging blocked cookies.
    default: enable
  web-filter-js-log:
    type: enum
    raw_type: option
    description: Enable/disable logging Java scripts.
    default: enable
  web-filter-jscript-log:
    type: enum
    raw_type: option
    description: Enable/disable logging JScripts.
    default: enable
  web-filter-referer-log:
    type: enum
    raw_type: option
    description: Enable/disable logging referrers.
    default: enable
  web-filter-unknown-log:
    type: enum
    raw_type: option
    description: Enable/disable logging unknown scripts.
    default: enable
  web-filter-vbs-log:
    type: enum
    raw_type: option
    description: Enable/disable logging VBS scripts.
    default: enable
  web-flow-log-encoding:
    type: enum
    raw_type: option
    description: Log encoding in flow mode.
    default: utf-8
  web-ftgd-err-log:
    type: enum
    raw_type: option
    description: Enable/disable logging rating errors.
    default: enable
  web-ftgd-quota-usage:
    type: enum
    raw_type: option
    description: Enable/disable logging daily quota usage.
    default: enable
  web-invalid-domain-log:
    type: enum
    raw_type: option
    description: Enable/disable logging invalid domain names.
    default: enable
  web-url-log:
    type: enum
    raw_type: option
    description: Enable/disable logging URL filtering.
    default: enable
  wisp:
    type: enum
    raw_type: option
    description: Enable/disable web proxy WISP.
    default: disable
  wisp-algorithm:
    type: enum
    raw_type: option
    description: WISP server selection algorithm.
    default: auto-learning
  wisp-servers:
    type: string
    raw_type: string
    description: WISP servers. Server name.
    max_length: 79
children:
  antiphish:
    attributes:
      authentication:
        type: enum
        raw_type: option
        description: Authentication methods.
        default: domain-controller
      check-basic-auth:
        type: enum
        raw_type: option
        description: Enable/disable checking of HTTP Basic Auth field for known credentials.
        default: disable
      check-uri:
        type: enum
        raw_type: option
        description: Enable/disable checking of GET URI parameters for known credentials.
        default: disable
      check-username-only:
        type: enum
        raw_type: option
        description: Enable/disable username only matching of credentials. Action will be taken for valid usernames regardless
          of password validity.
        default: disable
      default-action:
        type: enum
        raw_type: option
        description: Action to be taken when there is no matching rule.
        default: exempt
      domain-controller:
        type: string
        raw_type: string
        description: Domain for which to verify received credentials against.
        max_length: 63
      ldap:
        type: string
        raw_type: string
        description: LDAP server for which to verify received credentials against.
        max_length: 63
      max-body-len:
        type: integer
        raw_type: integer
        description: Maximum size of a POST body to check for credentials.
        default: '1024'
        min: 0
        max: 4294967295
      status:
        type: enum
        raw_type: option
        description: Toggle AntiPhishing functionality.
        default: disable
  custom-patterns:
    attributes:
      category:
        type: enum
        raw_type: option
        description: Category that the pattern matches.
        default: username
      pattern:
        type: string
        raw_type: string
        description: Target pattern.
        max_length: 255
      type:
        type: enum
        raw_type: option
        description: Pattern will be treated either as a regex pattern or literal string.
        default: regex
  inspection-entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to be taken upon an AntiPhishing match.
        default: exempt
      fortiguard-category:
        type: string
        raw_type: user
        description: FortiGuard category to match.
        default: '0'
      name:
        type: string
        raw_type: string
        description: Inspection target name.
        max_length: 63
  ftgd-wf:
    attributes:
      exempt-quota:
        type: string
        raw_type: user
        description: Do not stop quota for these categories.
        default: '17'
      max-quota-timeout:
        type: integer
        raw_type: integer
        description: Maximum FortiGuard quota used by single page view in seconds (excludes streams).
        default: '300'
        min: 1
        max: 86400
      options:
        type: enum
        raw_type: option
        description: Options for FortiGuard Web Filter.
        default: ftgd-disable
      ovrd:
        type: string
        raw_type: user
        description: Allow web filter profile overrides.
      rate-crl-urls:
        type: enum
        raw_type: option
        description: Enable/disable rating CRL by URL.
        default: enable
      rate-css-urls:
        type: enum
        raw_type: option
        description: Enable/disable rating CSS by URL.
        default: enable
      rate-javascript-urls:
        type: enum
        raw_type: option
        description: Enable/disable rating JavaScript by URL.
        default: enable
  filters:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for matches.
        default: monitor
      auth-usr-grp:
        type: string
        raw_type: string
        description: Groups with permission to authenticate. User group name.
        max_length: 79
      category:
        type: integer
        raw_type: integer
        description: Categories and groups the filter examines.
        default: '0'
        min: 0
        max: 255
      id:
        type: integer
        raw_type: integer
        description: ID number.
        default: '0'
        min: 0
        max: 255
      log:
        type: enum
        raw_type: option
        description: Enable/disable logging.
        default: enable
      override-replacemsg:
        type: string
        raw_type: string
        description: Override replacement message.
        max_length: 28
      warn-duration:
        type: string
        raw_type: user
        description: Duration of warnings.
        default: 5m
      warning-duration-type:
        type: enum
        raw_type: option
        description: Re-display warning after closing browser or after a timeout.
        default: timeout
      warning-prompt:
        type: enum
        raw_type: option
        description: Warning prompts in each category or each domain.
        default: per-category
  quota:
    attributes:
      category:
        type: string
        raw_type: user
        description: FortiGuard categories to apply quota to (category action must be set to monitor).
      duration:
        type: string
        raw_type: user
        description: Duration of quota.
        default: 5m
      id:
        type: integer
        raw_type: integer
        description: ID number.
        default: '0'
        min: 0
        max: 4294967295
      override-replacemsg:
        type: string
        raw_type: string
        description: Override replacement message.
        max_length: 28
      type:
        type: enum
        raw_type: option
        description: Quota type.
        default: time
      unit:
        type: enum
        raw_type: option
        description: Traffic quota unit of measurement.
        default: MB
      value:
        type: integer
        raw_type: integer
        description: Traffic quota value.
        default: '1024'
        min: 1
        max: 4294967295
  risk:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for matches.
        default: monitor
      id:
        type: integer
        raw_type: integer
        description: ID number.
        default: '0'
        min: 0
        max: 255
      log:
        type: enum
        raw_type: option
        description: Enable/disable logging.
        default: enable
      risk-level:
        type: string
        raw_type: string
        description: Risk level to be examined.
        max_length: 35
  override:
    attributes:
      ovrd-cookie:
        type: enum
        raw_type: option
        description: Allow/deny browser-based (cookie) overrides.
        default: deny
      ovrd-dur:
        type: string
        raw_type: user
        description: Override duration.
        default: 15m
      ovrd-dur-mode:
        type: enum
        raw_type: option
        description: Override duration mode.
        default: constant
      ovrd-scope:
        type: enum
        raw_type: option
        description: Override scope.
        default: user
      ovrd-user-group:
        type: string
        raw_type: string
        description: User groups with permission to use the override. User group name.
        max_length: 79
      profile:
        type: string
        raw_type: string
        description: Web filter profile with permission to create overrides. Web profile.
        max_length: 79
      profile-attribute:
        type: enum
        raw_type: option
        description: Profile attribute to retrieve from the RADIUS server.
        default: Login-LAT-Service
      profile-type:
        type: enum
        raw_type: option
        description: Override profile type.
        default: list
  web:
    attributes:
      allowlist:
        type: enum
        raw_type: option
        description: FortiGuard allowlist settings.
      blocklist:
        type: enum
        raw_type: option
        description: Enable/disable automatic addition of URLs detected by FortiSandbox to blocklist.
        default: disable
      bword-table:
        type: integer
        raw_type: integer
        description: Banned word table ID.
        default: '0'
        min: 0
        max: 4294967295
      bword-threshold:
        type: integer
        raw_type: integer
        description: Banned word score threshold.
        default: '10'
        min: 0
        max: 2147483647
      content-header-list:
        type: integer
        raw_type: integer
        description: Content header list.
        default: '0'
        min: 0
        max: 4294967295
      keyword-match:
        type: string
        raw_type: string
        description: Search keywords to log when match is found. Pattern/keyword to search for.
        default: '**'
        max_length: 79
      log-search:
        type: enum
        raw_type: option
        description: Enable/disable logging all search phrases.
        default: disable
      safe-search:
        type: enum
        raw_type: option
        description: Safe search type.
      urlfilter-table:
        type: integer
        raw_type: integer
        description: URL filter table ID.
        default: '0'
        min: 0
        max: 4294967295
      vimeo-restrict:
        type: string
        raw_type: string
        description: Set Vimeo-restrict ("7" = don't show mature content, "134" = don't show unrated and mature content).
          A value of cookie "content_rating".
        max_length: 63
      youtube-restrict:
        type: enum
        raw_type: option
        description: YouTube EDU filter level.
        default: none
