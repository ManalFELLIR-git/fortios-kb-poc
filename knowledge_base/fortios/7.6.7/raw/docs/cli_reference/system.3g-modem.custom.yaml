id: system.3g-modem.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/111656022/config-system-3g-modem-custom
attributes:
  class-id:
    type: string
    raw_type: user
    description: USB interface class in hexadecimal format (00-ff).
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  init-string:
    type: string
    raw_type: string
    description: Init string in hexadecimal format (even length).
    max_length: 127
  model:
    type: string
    raw_type: string
    description: MODEM model name.
    max_length: 35
  modeswitch-string:
    type: string
    raw_type: string
    description: 'USB modeswitch arguments. For example: ''-v 1410 -p 9030 -V 1410 -P 9032 -u 3''.'
    max_length: 127
  product-id:
    type: string
    raw_type: user
    description: USB product ID in hexadecimal format (0000-ffff).
  vendor:
    type: string
    raw_type: string
    description: MODEM vendor name.
    max_length: 35
  vendor-id:
    type: string
    raw_type: user
    description: USB vendor ID in hexadecimal format (0000-ffff).
children: {}
