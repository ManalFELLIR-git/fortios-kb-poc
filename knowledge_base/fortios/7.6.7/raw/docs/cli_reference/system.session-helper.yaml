id: system.session-helper
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/180488892/config-system-session-helper
attributes:
  id:
    type: integer
    raw_type: integer
    description: Session helper ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: enum
    raw_type: option
    description: Helper name.
  port:
    type: integer
    raw_type: integer
    description: Protocol port.
    default: '0'
    min: 1
    max: 65535
  protocol:
    type: integer
    raw_type: integer
    description: Protocol number.
    default: '0'
    min: 0
    max: 255
children: {}
