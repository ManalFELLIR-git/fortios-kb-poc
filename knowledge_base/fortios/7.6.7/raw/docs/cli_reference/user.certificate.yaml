id: user.certificate
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/248399313/config-user-certificate
attributes:
  common-name:
    type: string
    raw_type: string
    description: Certificate common name.
    max_length: 64
  id:
    type: integer
    raw_type: integer
    description: User ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  issuer:
    type: string
    raw_type: string
    description: CA certificate used for client certificate verification.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: User name.
    max_length: 64
  status:
    type: enum
    raw_type: option
    description: Enable/disable allowing the certificate user to authenticate with the FortiGate unit.
    default: enable
  type:
    type: enum
    raw_type: option
    description: Type of certificate authentication method.
    default: single-certificate
children: {}
