id: system.saml
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/139082119/config-system-saml
attributes:
  binding-protocol:
    type: enum
    raw_type: option
    description: IdP Binding protocol.
    default: redirect
  cert:
    type: string
    raw_type: string
    description: Certificate to sign SAML messages.
    max_length: 35
  default-login-page:
    type: enum
    raw_type: option
    description: Choose default login page.
    default: normal
  default-profile:
    type: string
    raw_type: string
    description: Default profile for new SSO admin.
    max_length: 35
  entity-id:
    type: string
    raw_type: string
    description: SP entity ID.
    max_length: 255
  idp-cert:
    type: string
    raw_type: string
    description: IDP certificate name.
    max_length: 35
  idp-entity-id:
    type: string
    raw_type: string
    description: IDP entity ID.
    max_length: 255
  idp-single-logout-url:
    type: string
    raw_type: string
    description: IDP single logout URL.
    max_length: 255
  idp-single-sign-on-url:
    type: string
    raw_type: string
    description: IDP single sign-on URL.
    max_length: 255
  life:
    type: integer
    raw_type: integer
    description: Length of the range of time when the assertion is valid (in minutes).
    default: '30'
    min: 0
    max: 4294967295
  portal-url:
    type: string
    raw_type: string
    description: SP portal URL. Read-only.
    max_length: 255
  require-signed-resp-and-asrt:
    type: enum
    raw_type: option
    description: Require both response and assertion from IDP to be signed when FGT acts as SP (default = disable).
    default: disable
  role:
    type: enum
    raw_type: option
    description: SAML role.
    default: service-provider
  server-address:
    type: string
    raw_type: string
    description: Server address.
    max_length: 63
  single-logout-url:
    type: string
    raw_type: string
    description: SP single logout URL. Read-only.
    max_length: 255
  single-sign-on-url:
    type: string
    raw_type: string
    description: SP single sign-on URL. Read-only.
    max_length: 255
  status:
    type: enum
    raw_type: option
    description: Enable/disable SAML authentication (default = disable).
    default: disable
  tolerance:
    type: integer
    raw_type: integer
    description: Tolerance to the range of time when the assertion is valid (in minutes).
    default: '5'
    min: 0
    max: 4294967295
children:
  service-providers:
    attributes:
      idp-entity-id:
        type: string
        raw_type: string
        description: IDP entity ID. Read-only.
        max_length: 255
      idp-single-logout-url:
        type: string
        raw_type: string
        description: IDP single logout URL. Read-only.
        max_length: 255
      idp-single-sign-on-url:
        type: string
        raw_type: string
        description: IDP single sign-on URL. Read-only.
        max_length: 255
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
      prefix:
        type: string
        raw_type: string
        description: Prefix.
        max_length: 35
      sp-binding-protocol:
        type: enum
        raw_type: option
        description: SP binding protocol.
        default: post
      sp-cert:
        type: string
        raw_type: string
        description: SP certificate name.
        max_length: 35
      sp-entity-id:
        type: string
        raw_type: string
        description: SP entity ID.
        max_length: 255
      sp-portal-url:
        type: string
        raw_type: string
        description: SP portal URL.
        max_length: 255
      sp-single-logout-url:
        type: string
        raw_type: string
        description: SP single logout URL.
        max_length: 255
      sp-single-sign-on-url:
        type: string
        raw_type: string
        description: SP single sign-on URL.
        max_length: 255
  assertion-attributes:
    attributes:
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
      type:
        type: enum
        raw_type: option
        description: Type.
        default: username
