id: wireless-controller.ap-status
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/169281763/config-wireless-controller-ap-status
attributes:
  bssid:
    type: mac-address
    raw_type: mac-address
    description: Access Point's (AP's) BSSID.
    default: 00:00:00:00:00:00
  id:
    type: integer
    raw_type: integer
    description: AP ID.
    default: '0'
    min: 0
    max: 4294967295
  ssid:
    type: string
    raw_type: string
    description: Access Point's (AP's) SSID.
    max_length: 32
  status:
    type: enum
    raw_type: option
    description: 'Access Point''s (AP''s) status: rogue, accepted, or suppressed.'
    default: rogue
children: {}
