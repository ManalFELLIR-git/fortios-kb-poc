id: switch-controller.auto-config.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/206892731/config-switch-controller-auto-config-custom
attributes:
  name:
    type: string
    raw_type: string
    description: Auto-Config FortiLink or ISL/ICL interface name.
    max_length: 15
children:
  switch-binding:
    attributes:
      policy:
        type: string
        raw_type: string
        description: Custom auto-config policy.
        default: default
        max_length: 63
      switch-id:
        type: string
        raw_type: string
        description: Switch name.
        max_length: 35
