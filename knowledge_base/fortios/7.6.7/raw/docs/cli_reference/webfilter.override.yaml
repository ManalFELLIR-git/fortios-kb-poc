id: webfilter.override
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/282695361/config-webfilter-override
attributes:
  expires:
    type: string
    raw_type: user
    description: 'Override expiration date and time, from 5 minutes to 365 from now (format: yyyy/mm/dd hh:mm:ss).'
    default: 1969/12/31 16:00:00
  id:
    type: integer
    raw_type: integer
    description: Override rule ID.
    default: '0'
    min: 0
    max: 4294967295
  initiator:
    type: string
    raw_type: string
    description: Initiating user of override (read-only setting).
    max_length: 64
  ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address which the override applies.
    default: 0.0.0.0
  ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address which the override applies.
    default: '::'
  new-profile:
    type: string
    raw_type: string
    description: Name of the new web filter profile used by the override.
    max_length: 47
  old-profile:
    type: string
    raw_type: string
    description: Name of the web filter profile which the override applies.
    max_length: 47
  scope:
    type: enum
    raw_type: option
    description: Override either the specific user, user group, IPv4 address, or IPv6 address.
    default: user
  status:
    type: enum
    raw_type: option
    description: Enable/disable override rule.
    default: disable
  user:
    type: string
    raw_type: string
    description: Name of the user which the override applies.
    max_length: 64
  user-group:
    type: string
    raw_type: string
    description: Specify the user group for which the override applies.
    max_length: 63
children: {}
