id: switch-controller.managed-switch
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/308952696/config-switch-controller-managed-switch
attributes:
  access-profile:
    type: string
    raw_type: string
    description: FortiSwitch access profile.
    default: default
    max_length: 31
  delayed-restart-trigger:
    type: integer
    raw_type: integer
    description: Delayed restart triggered for this FortiSwitch.
    default: '0'
    min: 0
    max: 255
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 63
  dhcp-server-access-list:
    type: enum
    raw_type: option
    description: DHCP snooping server access list.
    default: global
  directly-connected:
    type: integer
    raw_type: integer
    description: Directly connected FortiSwitch. Read-only.
    default: '0'
    min: 0
    max: 1
  dynamic-capability:
    type: string
    raw_type: user
    description: List of features this FortiSwitch supports (not configurable) that is sent to the FortiGate device for subsequent
      configuration initiated by the FortiGate device.
    default: '0x00000000000000000000000000000000'
  dynamically-discovered:
    type: integer
    raw_type: integer
    description: Dynamically discovered FortiSwitch. Read-only.
    default: '0'
    min: 0
    max: 1
  firmware-provision:
    type: enum
    raw_type: option
    description: Enable/disable provisioning of firmware to FortiSwitches on join connection.
    default: disable
  firmware-provision-latest:
    type: enum
    raw_type: option
    description: Enable/disable one-time automatic provisioning of the latest firmware version.
    default: disable
  firmware-provision-version:
    type: string
    raw_type: string
    description: Firmware version to provision to this FortiSwitch on bootup (major.minor.build, i.e. 6.2.1234).
    max_length: 35
  flow-identity:
    type: string
    raw_type: user
    description: Flow-tracking netflow ipfix switch identity in hex format(00000000-FFFFFFFF default=0).
    default: '00000000'
  fsw-wan1-admin:
    type: enum
    raw_type: option
    description: FortiSwitch WAN1 admin status; enable to authorize the FortiSwitch as a managed switch.
    default: discovered
  fsw-wan1-peer:
    type: string
    raw_type: string
    description: FortiSwitch WAN1 peer port.
    max_length: 35
  l3-discovered:
    type: integer
    raw_type: integer
    description: Layer 3 management discovered. Read-only.
    default: '0'
    min: 0
    max: 1
  max-allowed-trunk-members:
    type: integer
    raw_type: integer
    description: FortiSwitch maximum allowed trunk members.
    default: '0'
    min: 0
    max: 255
  max-poe-budget:
    type: integer
    raw_type: integer
    description: Max PoE budget for FortiSwitch. Read-only.
    default: '0'
    min: 0
    max: 65535
  mclag-igmp-snooping-aware:
    type: enum
    raw_type: option
    description: Enable/disable MCLAG IGMP-snooping awareness.
    default: enable
  mgmt-mode:
    type: integer
    raw_type: integer
    description: FortiLink management mode.
    default: '0'
    min: 0
    max: 255
  override-snmp-community:
    type: enum
    raw_type: option
    description: Enable/disable overriding the global SNMP communities.
    default: disable
  override-snmp-sysinfo:
    type: enum
    raw_type: option
    description: Enable/disable overriding the global SNMP system information.
    default: disable
  override-snmp-trap-threshold:
    type: enum
    raw_type: option
    description: Enable/disable overriding the global SNMP trap threshold values.
    default: disable
  override-snmp-user:
    type: enum
    raw_type: option
    description: Enable/disable overriding the global SNMP users.
    default: disable
  owner-vdom:
    type: string
    raw_type: string
    description: VDOM which owner of port belongs to.
    max_length: 31
  poe-detection-type:
    type: integer
    raw_type: integer
    description: PoE detection type for FortiSwitch. Read-only.
    default: '0'
    min: 0
    max: 255
  poe-pre-standard-detection:
    type: enum
    raw_type: option
    description: Enable/disable PoE pre-standard detection.
    default: disable
  pre-provisioned:
    type: integer
    raw_type: integer
    description: Pre-provisioned managed switch.
    default: '0'
    min: 0
    max: 255
  ptp-profile:
    type: string
    raw_type: string
    description: PTP profile configuration.
    default: default
    max_length: 63
  ptp-status:
    type: enum
    raw_type: option
    description: Enable/disable PTP profile on this FortiSwitch.
    default: disable
  purdue-level:
    type: enum
    raw_type: option
    description: Purdue Level of this FortiSwitch.
    default: '3'
  qos-drop-policy:
    type: enum
    raw_type: option
    description: Set QoS drop-policy.
    default: taildrop
  qos-red-probability:
    type: integer
    raw_type: integer
    description: Set QoS RED/WRED drop probability.
    default: '12'
    min: 0
    max: 100
  radius-nas-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: NAS-IP address.
    default: 0.0.0.0
  radius-nas-ip-override:
    type: enum
    raw_type: option
    description: Use locally defined NAS-IP.
    default: disable
  route-offload:
    type: enum
    raw_type: option
    description: Enable/disable route offload on this FortiSwitch.
    default: disable
  route-offload-mclag:
    type: enum
    raw_type: option
    description: Enable/disable route offload MCLAG on this FortiSwitch.
    default: disable
  sn:
    type: string
    raw_type: string
    description: Managed-switch serial number.
    max_length: 16
  staged-image-version:
    type: string
    raw_type: string
    description: Staged image version for FortiSwitch.
    max_length: 127
  switch-device-tag:
    type: string
    raw_type: string
    description: User definable label/tag.
    max_length: 32
  switch-dhcp_opt43_key:
    type: string
    raw_type: string
    description: DHCP option43 key.
    max_length: 63
  switch-id:
    type: string
    raw_type: string
    description: Managed-switch name.
    max_length: 35
  switch-profile:
    type: string
    raw_type: string
    description: FortiSwitch profile.
    default: default
    max_length: 35
  tdr-supported:
    type: string
    raw_type: string
    description: TDR supported. Read-only.
    max_length: 31
  tunnel-discovered:
    type: integer
    raw_type: integer
    description: SOCKS tunnel management discovered. Read-only.
    default: '0'
    min: 0
    max: 1
  type:
    type: enum
    raw_type: option
    description: Indication of switch type, physical or virtual.
    default: physical
  version:
    type: integer
    raw_type: integer
    description: FortiSwitch version.
    default: '0'
    min: 0
    max: 255
children:
  802-1x-settings:
    attributes:
      link-down-auth:
        type: enum
        raw_type: option
        description: Authentication state to set if a link is down.
        default: set-unauth
      local-override:
        type: enum
        raw_type: option
        description: Enable to override global 802.1X settings on individual FortiSwitches.
        default: disable
      mab-reauth:
        type: enum
        raw_type: option
        description: Enable or disable MAB reauthentication settings.
        default: disable
      mac-called-station-delimiter:
        type: enum
        raw_type: option
        description: MAC called station delimiter (default = hyphen).
        default: hyphen
      mac-calling-station-delimiter:
        type: enum
        raw_type: option
        description: MAC calling station delimiter (default = hyphen).
        default: hyphen
      mac-case:
        type: enum
        raw_type: option
        description: MAC case (default = lowercase).
        default: lowercase
      mac-password-delimiter:
        type: enum
        raw_type: option
        description: MAC authentication password delimiter (default = hyphen).
        default: hyphen
      mac-username-delimiter:
        type: enum
        raw_type: option
        description: MAC authentication username delimiter (default = hyphen).
        default: hyphen
      max-reauth-attempt:
        type: integer
        raw_type: integer
        description: Maximum number of authentication attempts (0 - 15, default = 3).
        default: '3'
        min: 0
        max: 15
      reauth-period:
        type: integer
        raw_type: integer
        description: Reauthentication time interval (1 - 1440 min, default = 60, 0 = disable).
        default: '60'
        min: 0
        max: 1440
      tx-period:
        type: integer
        raw_type: integer
        description: 802.1X Tx period (seconds, default=30).
        default: '30'
        min: 12
        max: 60
  custom-command:
    attributes:
      command-entry:
        type: string
        raw_type: string
        description: List of FortiSwitch commands.
        max_length: 35
      command-name:
        type: string
        raw_type: string
        description: Names of commands to be pushed to this FortiSwitch device, as configured under config switch-controller
          custom-command.
        max_length: 35
  dhcp-snooping-static-client:
    attributes:
      ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Client static IP address.
        default: 0.0.0.0
      mac:
        type: mac-address
        raw_type: mac-address
        description: Client MAC address.
        default: 00:00:00:00:00:00
      name:
        type: string
        raw_type: string
        description: Client name.
        max_length: 35
      port:
        type: string
        raw_type: string
        description: Interface name.
        max_length: 15
      vlan:
        type: string
        raw_type: string
        description: VLAN name.
        max_length: 15
  igmp-snooping:
    attributes:
      aging-time:
        type: integer
        raw_type: integer
        description: Maximum time to retain a multicast snooping entry for which no packets have been seen (15 - 3600 sec,
          default = 300).
        default: '300'
        min: 15
        max: 3600
      flood-unknown-multicast:
        type: enum
        raw_type: option
        description: Enable/disable unknown multicast flooding.
        default: disable
      local-override:
        type: enum
        raw_type: option
        description: Enable/disable overriding the global IGMP snooping configuration.
        default: disable
  vlans:
    attributes:
      proxy:
        type: enum
        raw_type: option
        description: IGMP snooping proxy for the VLAN interface.
        default: global
      querier:
        type: enum
        raw_type: option
        description: Enable/disable IGMP snooping querier for the VLAN interface.
        default: disable
      querier-addr:
        type: ipv4-address
        raw_type: ipv4-address
        description: IGMP snooping querier address.
        default: 0.0.0.0
      version:
        type: integer
        raw_type: integer
        description: IGMP snooping querying version.
        default: '2'
        min: 2
        max: 3
      vlan-name:
        type: string
        raw_type: string
        description: List of FortiSwitch VLANs.
        default: default
        max_length: 15
  ip-source-guard:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      port:
        type: string
        raw_type: string
        description: Ingress interface to which source guard is bound.
        max_length: 15
  binding-entry:
    attributes:
      entry-name:
        type: string
        raw_type: string
        description: Configure binding pair.
        max_length: 16
      ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Source IP for this rule.
        default: 0.0.0.0
      mac:
        type: mac-address
        raw_type: mac-address
        description: MAC address for this rule.
        default: 00:00:00:00:00:00
  mirror:
    attributes:
      dst:
        type: string
        raw_type: string
        description: Destination port.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Mirror name.
        max_length: 63
      src-egress:
        type: string
        raw_type: string
        description: Source egress interfaces. Interface name.
        max_length: 79
      src-ingress:
        type: string
        raw_type: string
        description: Source ingress interfaces. Interface name.
        max_length: 79
      status:
        type: enum
        raw_type: option
        description: Active/inactive mirror configuration.
        default: inactive
      switching-packet:
        type: enum
        raw_type: option
        description: Enable/disable switching functionality when mirroring.
        default: disable
  ports:
    attributes:
      access-mode:
        type: enum
        raw_type: option
        description: Access mode of the port.
        default: static
      acl-group:
        type: string
        raw_type: string
        description: ACL groups on this port. ACL group name.
        max_length: 79
      aggregator-mode:
        type: enum
        raw_type: option
        description: LACP member select mode.
        default: bandwidth
      allow-arp-monitor:
        type: enum
        raw_type: option
        description: Enable/Disable allow ARP monitor.
        default: disable
      allowed-vlans:
        type: string
        raw_type: string
        description: Configure switch port tagged VLANs. VLAN name.
        max_length: 79
      allowed-vlans-all:
        type: enum
        raw_type: option
        description: Enable/disable all defined vlans on this port.
        default: disable
      arp-inspection-trust:
        type: enum
        raw_type: option
        description: Trusted or untrusted dynamic ARP inspection.
        default: untrusted
      authenticated-port:
        type: integer
        raw_type: integer
        description: Peer to Peer Authenticated port. Read-only.
        default: '0'
        min: 0
        max: 1
      bundle:
        type: enum
        raw_type: option
        description: Enable/disable Link Aggregation Group (LAG) bundling for non-FortiLink interfaces.
        default: disable
      description:
        type: string
        raw_type: string
        description: Description for port.
        max_length: 63
      dhcp-snoop-option82-trust:
        type: enum
        raw_type: option
        description: Enable/disable allowance of DHCP with option-82 on untrusted interface.
        default: disable
      dhcp-snooping:
        type: enum
        raw_type: option
        description: Trusted or untrusted DHCP-snooping interface.
        default: untrusted
      discard-mode:
        type: enum
        raw_type: option
        description: Configure discard mode for port.
        default: none
      edge-port:
        type: enum
        raw_type: option
        description: Enable/disable this interface as an edge port, bridging connections between workstations and/or computers.
        default: enable
      encrypted-port:
        type: integer
        raw_type: integer
        description: Peer to Peer Encrypted port. Read-only.
        default: '0'
        min: 0
        max: 1
      export-to:
        type: string
        raw_type: string
        description: Export managed-switch port to a tenant VDOM.
        max_length: 31
      export-to-pool:
        type: string
        raw_type: string
        description: Switch controller export port to pool-list.
        max_length: 35
      fallback-port:
        type: string
        raw_type: string
        description: LACP fallback port.
        max_length: 79
      fec-capable:
        type: integer
        raw_type: integer
        description: FEC capable.
        default: '0'
        min: 0
        max: 1
      fec-state:
        type: enum
        raw_type: option
        description: State of forward error correction.
        default: detect-by-module
      fgt-peer-device-name:
        type: string
        raw_type: string
        description: FGT peer device name. Read-only.
        max_length: 35
      fgt-peer-port-name:
        type: string
        raw_type: string
        description: FGT peer port name. Read-only.
        max_length: 15
      fiber-port:
        type: integer
        raw_type: integer
        description: Fiber-port. Read-only.
        default: '0'
        min: 0
        max: 1
      flags:
        type: integer
        raw_type: integer
        description: Port properties flags. Read-only.
        default: '0'
        min: 0
        max: 4294967295
      flap-duration:
        type: integer
        raw_type: integer
        description: Period over which flap events are calculated (seconds).
        default: '30'
        min: 5
        max: 300
      flap-rate:
        type: integer
        raw_type: integer
        description: Number of stage change events needed within flap-duration.
        default: '5'
        min: 1
        max: 30
      flap-timeout:
        type: integer
        raw_type: integer
        description: Flap guard disabling protection (min).
        default: '0'
        min: 0
        max: 120
      flapguard:
        type: enum
        raw_type: option
        description: Enable/disable flap guard.
        default: disable
      flow-control:
        type: enum
        raw_type: option
        description: Flow control direction.
        default: disable
      fortilink-port:
        type: integer
        raw_type: integer
        description: FortiLink uplink port. Read-only.
        default: '0'
        min: 0
        max: 1
      fortiswitch-acls:
        type: integer
        raw_type: integer
        description: ACLs on this port. ACL ID.
        min: 0
        max: 4294967295
      igmp-snooping-flood-reports:
        type: enum
        raw_type: option
        description: Enable/disable flooding of IGMP reports to this interface when igmp-snooping enabled.
        default: disable
      interface-tags:
        type: string
        raw_type: string
        description: Tag(s) associated with the interface for various features including virtual port pool, dynamic port policy.
          FortiSwitch port tag name when exported to a virtual port pool or matched to dynamic port policy.
        max_length: 63
      ip-source-guard:
        type: enum
        raw_type: option
        description: Enable/disable IP source guard.
        default: disable
      isl-local-trunk-name:
        type: string
        raw_type: string
        description: ISL local trunk name. Read-only.
        max_length: 15
      isl-peer-device-name:
        type: string
        raw_type: string
        description: ISL peer device name. Read-only.
        max_length: 35
      isl-peer-device-sn:
        type: string
        raw_type: string
        description: ISL peer device serial number. Read-only.
        max_length: 16
      isl-peer-port-name:
        type: string
        raw_type: string
        description: ISL peer port name. Read-only.
        max_length: 15
      lacp-speed:
        type: enum
        raw_type: option
        description: End Link Aggregation Control Protocol (LACP) messages every 30 seconds (slow) or every second (fast).
        default: slow
      learning-limit:
        type: integer
        raw_type: integer
        description: Limit the number of dynamic MAC addresses on this Port (1 - 128, 0 = no limit, default).
        default: '0'
        min: 0
        max: 128
      lldp-profile:
        type: string
        raw_type: string
        description: LLDP port TLV profile.
        default: default-auto-isl
        max_length: 63
      lldp-status:
        type: enum
        raw_type: option
        description: LLDP transmit and receive status.
        default: tx-rx
      log-mac-event:
        type: enum
        raw_type: option
        description: Enable/disable logging for dynamic MAC address events.
        default: disable
      loop-guard:
        type: enum
        raw_type: option
        description: Enable/disable loop-guard on this interface, an STP optimization used to prevent network loops.
        default: disabled
      loop-guard-timeout:
        type: integer
        raw_type: integer
        description: Loop-guard timeout (0 - 120 min, default = 45).
        default: '45'
        min: 0
        max: 120
      mac-addr:
        type: mac-address
        raw_type: mac-address
        description: Port/Trunk MAC.
        default: 00:00:00:00:00:00
      matched-dpp-intf-tags:
        type: string
        raw_type: string
        description: Matched interface tags in the dynamic port policy.
        max_length: 63
      matched-dpp-policy:
        type: string
        raw_type: string
        description: Matched child policy in the dynamic port policy.
        max_length: 63
      max-bundle:
        type: integer
        raw_type: integer
        description: Maximum size of LAG bundle (1 - 24, default = 24).
        default: '24'
        min: 1
        max: 24
      mcast-snooping-flood-traffic:
        type: enum
        raw_type: option
        description: Enable/disable flooding of IGMP snooping traffic to this interface.
        default: disable
      mclag:
        type: enum
        raw_type: option
        description: Enable/disable multi-chassis link aggregation (MCLAG).
        default: disable
      mclag-icl-port:
        type: integer
        raw_type: integer
        description: MCLAG-ICL port. Read-only.
        default: '0'
        min: 0
        max: 1
      media-type:
        type: string
        raw_type: string
        description: Media type. Read-only.
        max_length: 31
      member-withdrawal-behavior:
        type: enum
        raw_type: option
        description: Port behavior after it withdraws because of loss of control packets.
        default: block
      members:
        type: string
        raw_type: string
        description: Aggregated LAG bundle interfaces. Interface name from available options.
        max_length: 79
      min-bundle:
        type: integer
        raw_type: integer
        description: Minimum size of LAG bundle (1 - 24, default = 1).
        default: '1'
        min: 1
        max: 24
      mode:
        type: enum
        raw_type: option
        description: 'LACP mode: ignore and do not send control messages, or negotiate 802.3ad aggregation passively or actively.'
        default: static
      p2p-port:
        type: integer
        raw_type: integer
        description: General peer to peer tunnel port. Read-only.
        default: '0'
        min: 0
        max: 1
      packet-sample-rate:
        type: integer
        raw_type: integer
        description: Packet sampling rate (0 - 99999 p/sec).
        default: '512'
        min: 0
        max: 99999
      packet-sampler:
        type: enum
        raw_type: option
        description: Enable/disable packet sampling on this interface.
        default: disabled
      pause-meter:
        type: integer
        raw_type: integer
        description: Configure ingress pause metering rate, in kbps (default = 0, disabled).
        default: '0'
        min: 128
        max: 2147483647
      pause-meter-resume:
        type: enum
        raw_type: option
        description: Resume threshold for resuming traffic on ingress port.
        default: 50%
      pd-capable:
        type: integer
        raw_type: integer
        description: Powered device capable.
        default: '0'
        min: 0
        max: 1
      poe-capable:
        type: integer
        raw_type: integer
        description: PoE capable.
        default: '0'
        min: 0
        max: 1
      poe-max-power:
        type: string
        raw_type: string
        description: PoE maximum power. Read-only.
        max_length: 35
      poe-mode-bt-cabable:
        type: integer
        raw_type: integer
        description: PoE mode IEEE 802.3BT capable.
        default: '0'
        min: 0
        max: 1
      poe-port-mode:
        type: enum
        raw_type: option
        description: Configure PoE port mode.
        default: ieee802-3at
      poe-port-power:
        type: enum
        raw_type: option
        description: Configure PoE port power.
        default: normal
      poe-port-priority:
        type: enum
        raw_type: option
        description: Configure PoE port priority.
        default: low-priority
      poe-pre-standard-detection:
        type: enum
        raw_type: option
        description: Enable/disable PoE pre-standard detection.
        default: disable
      poe-standard:
        type: string
        raw_type: string
        description: PoE standard supported. Read-only.
        max_length: 63
      poe-status:
        type: enum
        raw_type: option
        description: Enable/disable PoE status.
        default: enable
      port-name:
        type: string
        raw_type: string
        description: Switch port name.
        max_length: 15
      port-number:
        type: integer
        raw_type: integer
        description: Port number. Read-only.
        default: '0'
        min: 1
        max: 64
      port-owner:
        type: string
        raw_type: string
        description: Switch port name.
        max_length: 15
      port-policy:
        type: string
        raw_type: string
        description: Switch controller dynamic port policy from available options.
        max_length: 63
      port-prefix-type:
        type: integer
        raw_type: integer
        description: Port prefix type. Read-only.
        default: '0'
        min: 0
        max: 1
      port-security-policy:
        type: string
        raw_type: string
        description: Switch controller authentication policy to apply to this managed switch from available options.
        max_length: 31
      port-selection-criteria:
        type: enum
        raw_type: option
        description: Algorithm for aggregate port selection.
        default: src-dst-ip
