id: firewall.service.group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/242456538/config-firewall-service-group
attributes:
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  member:
    type: string
    raw_type: string
    description: Service objects contained within the group. Service or service group name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Service group name.
    max_length: 79
  proxy:
    type: enum
    raw_type: option
    description: Enable/disable web proxy service group.
    default: disable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
