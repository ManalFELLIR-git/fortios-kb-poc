id: virtual-patch.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/235553430/config-virtual-patch-profile
attributes:
  action:
    type: enum
    raw_type: option
    description: Action (pass/block).
    default: block
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  log:
    type: enum
    raw_type: option
    description: Enable/disable logging of detection.
    default: enable
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
  severity:
    type: enum
    raw_type: option
    description: Relative severity of the signature (low, medium, high, critical).
    default: info low medium high critical
children:
  exemption:
    attributes:
      device:
        type: mac-address
        raw_type: mac-address
        description: Device MAC addresses. Device MAC address.
      id:
        type: integer
        raw_type: integer
        description: IDs.
        default: '0'
        min: 0
        max: 4294967295
      rule:
        type: integer
        raw_type: integer
        description: Patch signature rule IDs. Rule IDs.
        min: 0
        max: 4294967295
      status:
        type: enum
        raw_type: option
        description: Enable/disable exemption.
        default: enable
