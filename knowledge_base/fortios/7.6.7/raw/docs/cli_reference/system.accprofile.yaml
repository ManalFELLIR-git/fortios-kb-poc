id: system.accprofile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/309990135/config-system-accprofile
attributes:
  admintimeout:
    type: integer
    raw_type: integer
    description: Administrator timeout for this access profile (0 - 480 min, default = 10, 0 means never timeout).
    default: '10'
    min: 1
    max: 480
  admintimeout-override:
    type: enum
    raw_type: option
    description: Enable/disable overriding the global administrator idle timeout.
    default: disable
  authgrp:
    type: enum
    raw_type: option
    description: Administrator access to Users and Devices.
    default: none
  cli-config:
    type: enum
    raw_type: option
    description: Enable/disable permission to run config commands.
    default: disable
  cli-diagnose:
    type: enum
    raw_type: option
    description: Enable/disable permission to run diagnostic commands.
    default: disable
  cli-exec:
    type: enum
    raw_type: option
    description: Enable/disable permission to run execute commands.
    default: disable
  cli-get:
    type: enum
    raw_type: option
    description: Enable/disable permission to run get commands.
    default: disable
  cli-show:
    type: enum
    raw_type: option
    description: Enable/disable permission to run show commands.
    default: disable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  ftviewgrp:
    type: enum
    raw_type: option
    description: FortiView.
    default: none
  fwgrp:
    type: enum
    raw_type: option
    description: Administrator access to the Firewall configuration.
    default: none
  loggrp:
    type: enum
    raw_type: option
    description: Administrator access to Logging and Reporting including viewing log messages.
    default: none
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 35
  netgrp:
    type: enum
    raw_type: option
    description: Network Configuration.
    default: none
  scope:
    type: enum
    raw_type: option
    description: 'Scope of admin access: global or specific VDOM(s).'
    default: vdom
  secfabgrp:
    type: enum
    raw_type: option
    description: Security Fabric.
    default: none
  sysgrp:
    type: enum
    raw_type: option
    description: System Configuration.
    default: none
  system-execute-ssh:
    type: enum
    raw_type: option
    description: Enable/disable permission to execute SSH commands.
    default: enable
  system-execute-telnet:
    type: enum
    raw_type: option
    description: Enable/disable permission to execute TELNET commands.
    default: enable
  utmgrp:
    type: enum
    raw_type: option
    description: Administrator access to Security Profiles.
    default: none
  vpngrp:
    type: enum
    raw_type: option
    description: Administrator access to IPsec, SSL, PPTP, and L2TP VPN.
    default: none
  wanoptgrp:
    type: enum
    raw_type: option
    description: Administrator access to WAN Opt & Cache.
    default: none
  wifi:
    type: enum
    raw_type: option
    description: Administrator access to the WiFi controller and Switch controller.
    default: none
children:
  fwgrp-permission:
    attributes:
      address:
        type: enum
        raw_type: option
        description: Address Configuration.
        default: none
      others:
        type: enum
        raw_type: option
        description: Other Firewall Configuration.
        default: none
      policy:
        type: enum
        raw_type: option
        description: Policy Configuration.
        default: none
      schedule:
        type: enum
        raw_type: option
        description: Schedule Configuration.
        default: none
      service:
        type: enum
        raw_type: option
        description: Service Configuration.
        default: none
  loggrp-permission:
    attributes:
      config:
        type: enum
        raw_type: option
        description: Log & Report configuration.
        default: none
      data-access:
        type: enum
        raw_type: option
        description: Log & Report Data Access.
        default: none
      report-access:
        type: enum
        raw_type: option
        description: Log & Report Report Access.
        default: none
      threat-weight:
        type: enum
        raw_type: option
        description: Log & Report Threat Weight.
        default: none
  netgrp-permission:
    attributes:
      cfg:
        type: enum
        raw_type: option
        description: Network Configuration.
        default: none
      packet-capture:
        type: enum
        raw_type: option
        description: Packet Capture Configuration.
        default: none
      route-cfg:
        type: enum
        raw_type: option
        description: Router Configuration.
        default: none
  secfabgrp-permission:
    attributes:
      csffoo:
        type: enum
        raw_type: option
        description: Fabric Overlay Orchestrator profiles and settings.
        default: none
      csfsys:
        type: enum
        raw_type: option
        description: Security Fabric system profiles and settings.
        default: none
  sysgrp-permission:
    attributes:
      admin:
        type: enum
        raw_type: option
        description: Administrator Users.
        default: none
      cfg:
        type: enum
        raw_type: option
        description: System Configuration.
        default: none
      mnt:
        type: enum
        raw_type: option
        description: Maintenance.
        default: none
      upd:
        type: enum
        raw_type: option
        description: FortiGuard Updates.
        default: none
  utmgrp-permission:
    attributes:
      antivirus:
        type: enum
        raw_type: option
        description: Antivirus profiles and settings.
        default: none
      application-control:
        type: enum
        raw_type: option
        description: Application Control profiles and settings.
        default: none
      casb:
        type: enum
        raw_type: option
        description: Inline CASB filter profile and settings
        default: none
      dlp:
        type: enum
        raw_type: option
        description: DLP profiles and settings.
        default: none
      dnsfilter:
        type: enum
        raw_type: option
        description: DNS Filter profiles and settings.
        default: none
      emailfilter:
        type: enum
        raw_type: option
        description: Email Filter and settings.
        default: none
      endpoint-control:
        type: enum
        raw_type: option
        description: FortiClient Profiles.
        default: none
      file-filter:
        type: enum
        raw_type: option
        description: File-filter profiles and settings.
        default: none
      icap:
        type: enum
        raw_type: option
        description: ICAP profiles and settings.
        default: none
      ips:
        type: enum
        raw_type: option
        description: IPS profiles and settings.
        default: none
      telemetry:
        type: enum
        raw_type: option
        description: Telemetry profile and settings.
        default: none
      videofilter:
        type: enum
        raw_type: option
        description: Video filter profiles and settings.
        default: none
      virtual-patch:
        type: enum
        raw_type: option
        description: Virtual patch profiles and settings.
        default: none
      voip:
        type: enum
        raw_type: option
        description: VoIP profiles and settings.
        default: none
      waf:
        type: enum
        raw_type: option
        description: Web Application Firewall profiles and settings.
        default: none
      webfilter:
        type: enum
        raw_type: option
        description: Web Filter profiles and settings.
        default: none
