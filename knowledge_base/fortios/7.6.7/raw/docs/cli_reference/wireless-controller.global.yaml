id: wireless-controller.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/454774192/config-wireless-controller-global
attributes:
  acd-process-count:
    type: integer
    raw_type: integer
    description: Configure the number cw_acd daemons for multi-core CPU support (default = 0).
    default: '0'
    min: 0
    max: 255
  ap-log-server:
    type: enum
    raw_type: option
    description: Enable/disable configuring FortiGate to redirect wireless event log messages or FortiAPs to send UTM log
      messages to a syslog server (default = disable).
    default: disable
  ap-log-server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address that FortiGate or FortiAPs send log messages to.
    default: 0.0.0.0
  ap-log-server-port:
    type: integer
    raw_type: integer
    description: Port that FortiGate or FortiAPs send log messages to.
    default: '0'
    min: 0
    max: 65535
  control-message-offload:
    type: enum
    raw_type: option
    description: Configure CAPWAP control message data channel offload.
    default: ebp-frame aeroscout-tag ap-list sta-list sta-cap-list stats aeroscout-mu sta-health spectral-analysis
  data-ethernet-II:
    type: enum
    raw_type: option
    description: Configure the wireless controller to use Ethernet II or 802.3 frames with 802.3 data tunnel mode (default
      = enable).
    default: enable
  dfs-lab-test:
    type: enum
    raw_type: option
    description: Enable/disable DFS certificate lab test mode.
    default: disable
  discovery-mc-addr:
    type: ipv4-address-multicast
    raw_type: ipv4-address-multicast
    description: Multicast IP address for AP discovery (default = 224.0.1.140).
    default: 224.0.1.140
  discovery-mc-addr6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Multicast IPv6 address for AP discovery (default = FF02::18C).
    default: ff02::18c
  fiapp-eth-type:
    type: integer
    raw_type: integer
    description: Ethernet type for Fortinet Inter-Access Point Protocol (IAPP), or IEEE 802.11f, packets (0 - 65535, default
      = 5252).
    default: '5252'
    min: 0
    max: 65535
  image-download:
    type: enum
    raw_type: option
    description: Enable/disable WTP image download at join time.
    default: enable
  ipsec-base-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Base IP address for IPsec VPN tunnels between the access points and the wireless controller (default = 169.254.0.1).
    default: 169.254.0.1
  link-aggregation:
    type: enum
    raw_type: option
    description: Enable/disable calculating the CAPWAP transmit hash to load balance sessions to link aggregation nodes (default
      = disable).
    default: disable
  local-radio-vdom:
    type: string
    raw_type: string
    description: Assign local radio's virtual domain.
    default: root
    max_length: 31
  location:
    type: string
    raw_type: string
    description: Description of the location of the wireless controller.
    max_length: 35
  max-ble-device:
    type: integer
    raw_type: integer
    description: Maximum number of BLE devices stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-clients:
    type: integer
    raw_type: integer
    description: Maximum number of clients that can connect simultaneously (default = 0, meaning no limitation).
    default: '0'
    min: 0
    max: 4294967295
  max-retransmit:
    type: integer
    raw_type: integer
    description: Maximum number of tunnel packet retransmissions (0 - 64, default = 3).
    default: '3'
    min: 0
    max: 64
  max-rogue-ap:
    type: integer
    raw_type: integer
    description: Maximum number of rogue APs stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-rogue-ap-wtp:
    type: integer
    raw_type: integer
    description: Maximum number of rogue AP's wtp info stored on the controller (1 - 16, default = 16).
    default: '16'
    min: 1
    max: 16
  max-rogue-sta:
    type: integer
    raw_type: integer
    description: Maximum number of rogue stations stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-sta-cap:
    type: integer
    raw_type: integer
    description: Maximum number of station cap stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-sta-cap-wtp:
    type: integer
    raw_type: integer
    description: Maximum number of station cap's wtp info stored on the controller (1 - 16, default = 8).
    default: '8'
    min: 1
    max: 8
  max-sta-offline:
    type: integer
    raw_type: integer
    description: Maximum number of station offline stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-sta-offline-ip2mac:
    type: integer
    raw_type: integer
    description: Maximum number of station offline ip2mac stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  max-wids-entry:
    type: integer
    raw_type: integer
    description: Maximum number of wids entries stored on the controller (default = 0).
    default: '0'
    min: 0
    max: 4294967295
  mesh-eth-type:
    type: integer
    raw_type: integer
    description: Mesh Ethernet identifier included in backhaul packets (0 - 65535, default = 8755).
    default: '8755'
    min: 0
    max: 65535
  nac-interval:
    type: integer
    raw_type: integer
    description: Interval in seconds between two WiFi network access control (NAC) checks (10 - 600, default = 120).
    default: '120'
    min: 10
    max: 600
  name:
    type: string
    raw_type: string
    description: Name of the wireless controller.
    max_length: 35
  rogue-scan-mac-adjacency:
    type: integer
    raw_type: integer
    description: Maximum numerical difference between an AP's Ethernet and wireless MAC values to match for rogue detection
      (0 - 31, default = 7).
    default: '7'
    min: 0
    max: 31
  rolling-wtp-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable rolling WTP upgrade (default = disable).
    default: disable
  rolling-wtp-upgrade-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the managed WTP to be included in rolling WTP upgrade
      (-95 to -20, default = -80).
    default: '-80'
    max_length: 7
  tunnel-mode:
    type: enum
    raw_type: option
    description: Compatible/strict tunnel mode.
    default: compatible
  wpad-process-count:
    type: integer
    raw_type: integer
    description: Wpad daemon process count for multi-core CPU support.
    default: '0'
    min: 0
    max: 255
  wtp-share:
    type: enum
    raw_type: option
    description: Enable/disable sharing of WTPs between VDOMs.
    default: disable
children: {}
