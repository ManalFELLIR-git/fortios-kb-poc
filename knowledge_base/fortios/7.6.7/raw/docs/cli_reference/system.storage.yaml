id: system.storage
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/314711681/config-system-storage
attributes:
  device:
    type: string
    raw_type: string
    description: Partition device.
    default: '?'
    max_length: 19
  media-status:
    type: enum
    raw_type: option
    description: The physical status of current media.
    default: disable
  name:
    type: string
    raw_type: string
    description: Storage name.
    default: default_n
    max_length: 35
  order:
    type: integer
    raw_type: integer
    description: Set storage order.
    default: '0'
    min: 0
    max: 255
  partition:
    type: string
    raw_type: string
    description: Label of underlying partition.
    default: <unknown>
    max_length: 16
  size:
    type: integer
    raw_type: integer
    description: Partition size.
    default: '0'
    min: 0
    max: 4294967295
  status:
    type: enum
    raw_type: option
    description: Enable/disable storage.
    default: enable
  usage:
    type: enum
    raw_type: option
    description: Use hard disk for logging or WAN Optimization (default = log).
    default: log **
  wanopt-mode:
    type: enum
    raw_type: option
    description: WAN Optimization mode (default = mix).
    default: mix
children: {}
