id: firewall.vip6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/595255035/config-firewall-vip6
attributes:
  add-nat64-route:
    type: enum
    raw_type: option
    description: Enable/disable adding NAT64 route.
    default: enable
  client-cert:
    type: enum
    raw_type: option
    description: Enable/disable requesting client certificate.
    default: enable
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  embedded-ipv4-address:
    type: enum
    raw_type: option
    description: Enable/disable use of the lower 32 bits of the external IPv6 address as mapped IPv4 address.
    default: disable
  empty-cert-action:
    type: enum
    raw_type: option
    description: Action for an empty client certificate.
    default: block
  extip:
    type: string
    raw_type: user
    description: IPv6 address or address range on the external interface that you want to map to an address or address range
      on the destination network.
  extport:
    type: string
    raw_type: user
    description: Incoming port number range that you want to map to a port number range on the destination network.
  h2-support:
    type: enum
    raw_type: option
    description: Enable/disable HTTP2 support (default = enable).
    default: enable
  h3-support:
    type: enum
    raw_type: option
    description: Enable/disable HTTP3/QUIC support (default = disable).
    default: disable
  http-cookie-age:
    type: integer
    raw_type: integer
    description: Time in minutes that client web browsers should keep a cookie. Default is 60 minutes. 0 = no time limit.
    default: '60'
    min: 0
    max: 525600
  http-cookie-domain:
    type: string
    raw_type: string
    description: Domain that HTTP cookie persistence should apply to.
    max_length: 35
  http-cookie-domain-from-host:
    type: enum
    raw_type: option
    description: Enable/disable use of HTTP cookie domain from host field in HTTP.
    default: disable
  http-cookie-generation:
    type: integer
    raw_type: integer
    description: Generation of HTTP cookie to be accepted. Changing invalidates all existing cookies.
    default: '0'
    min: 0
    max: 4294967295
  http-cookie-path:
    type: string
    raw_type: string
    description: Limit HTTP cookie persistence to the specified path.
    max_length: 35
  http-cookie-share:
    type: enum
    raw_type: option
    description: Control sharing of cookies across virtual servers. Use of same-ip means a cookie from one virtual server
      can be used by another. Disable stops cookie sharing.
    default: same-ip
  http-ip-header:
    type: enum
    raw_type: option
    description: For HTTP multiplexing, enable to add the original client IP address in the X-Forwarded-For HTTP header.
    default: disable
  http-ip-header-name:
    type: string
    raw_type: string
    description: For HTTP multiplexing, enter a custom HTTPS header name. The original client IP address is added to this
      header. If empty, X-Forwarded-For is used.
    max_length: 35
  http-multiplex:
    type: enum
    raw_type: option
    description: Enable/disable HTTP multiplexing.
    default: disable
  http-redirect:
    type: enum
    raw_type: option
    description: Enable/disable redirection of HTTP to HTTPS.
    default: disable
  https-cookie-secure:
    type: enum
    raw_type: option
    description: Enable/disable verification that inserted HTTPS cookies are secure.
    default: disable
  id:
    type: integer
    raw_type: integer
    description: Custom defined ID.
    default: '0'
    min: 0
    max: 65535
  ipv4-mappedip:
    type: string
    raw_type: user
    description: Range of mapped IP addresses. Specify the start IP address followed by a space and the end IP address.
  ipv4-mappedport:
    type: string
    raw_type: user
    description: IPv4 port number range on the destination network to which the external port number range is mapped.
  ldb-method:
    type: enum
    raw_type: option
    description: Method used to distribute sessions to real servers.
    default: static
  mappedip:
    type: string
    raw_type: user
    description: Mapped IPv6 address range in the format startIP-endIP.
  mappedport:
    type: string
    raw_type: user
    description: Port number range on the destination network to which the external port number range is mapped.
  max-embryonic-connections:
    type: integer
    raw_type: integer
    description: Maximum number of incomplete connections.
    default: '1000'
    min: 0
    max: 100000
  monitor:
    type: string
    raw_type: string
    description: Name of the health check monitor to use when polling to determine a virtual server's connectivity status.
      Health monitor name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Virtual ip6 name.
    max_length: 79
  nat-source-vip:
    type: enum
    raw_type: option
    description: Enable to perform SNAT on traffic from mappedip to the extip for all egress interfaces.
    default: disable
  nat64:
    type: enum
    raw_type: option
    description: Enable/disable DNAT64.
    default: disable
  nat66:
    type: enum
    raw_type: option
    description: Enable/disable DNAT66.
    default: enable
  ndp-reply:
    type: enum
    raw_type: option
    description: Enable/disable this FortiGate unit's ability to respond to NDP requests for this virtual IP address (default
      = enable).
    default: enable
  outlook-web-access:
    type: enum
    raw_type: option
    description: Enable to add the Front-End-Https header for Microsoft Outlook Web Access.
    default: disable
  persistence:
    type: enum
    raw_type: option
    description: Configure how to make sure that clients connect to the same server every time they make a request that is
      part of the same session.
    default: none
  portforward:
    type: enum
    raw_type: option
    description: Enable port forwarding.
    default: disable
  protocol:
    type: enum
    raw_type: option
    description: Protocol to use when forwarding packets.
    default: tcp
  server-type:
    type: enum
    raw_type: option
    description: Protocol to be load balanced by the virtual server (also called the server load balance virtual IP).
  src-filter:
    type: string
    raw_type: string
    description: Source IP6 filter (x:x:x:x:x:x:x:x/x). Separate addresses with spaces. Source-filter range.
    max_length: 79
  src-vip-filter:
    type: enum
    raw_type: option
    description: Enable/disable use of 'src-filter' to match destinations for the reverse SNAT rule.
    default: disable
  ssl-accept-ffdhe-groups:
    type: enum
    raw_type: option
    description: Enable/disable FFDHE cipher suite for SSL key exchange.
    default: enable
  ssl-algorithm:
    type: enum
    raw_type: option
    description: Permitted encryption algorithms for SSL sessions according to encryption strength.
    default: high
  ssl-certificate:
    type: string
    raw_type: string
    description: Name of the certificate to use for SSL handshake. Certificate list.
    max_length: 79
  ssl-client-fallback:
    type: enum
    raw_type: option
    description: Enable/disable support for preventing Downgrade Attacks on client connections (RFC 7507).
    default: enable
  ssl-client-rekey-count:
    type: integer
    raw_type: integer
    description: Maximum length of data in MB before triggering a client rekey (0 = disable).
    default: '0'
    min: 200
    max: 1048576
  ssl-client-renegotiation:
    type: enum
    raw_type: option
    description: Allow, deny, or require secure renegotiation of client sessions to comply with RFC 5746.
    default: secure
  ssl-client-session-state-max:
    type: integer
    raw_type: integer
    description: Maximum number of client to FortiGate SSL session states to keep.
    default: '1000'
    min: 1
    max: 10000
  ssl-client-session-state-timeout:
    type: integer
    raw_type: integer
    description: Number of minutes to keep client to FortiGate SSL session state.
    default: '30'
    min: 1
    max: 14400
  ssl-client-session-state-type:
    type: enum
    raw_type: option
    description: How to expire SSL sessions for the segment of the SSL connection between the client and the FortiGate.
    default: both
  ssl-dh-bits:
    type: enum
    raw_type: option
    description: Number of bits to use in the Diffie-Hellman exchange for RSA encryption of SSL sessions.
    default: '2048'
  ssl-hpkp:
    type: enum
    raw_type: option
    description: Enable/disable including HPKP header in response.
    default: disable
  ssl-hpkp-age:
    type: integer
    raw_type: integer
    description: Number of minutes the web browser should keep HPKP.
    default: '5184000'
    min: 60
    max: 157680000
  ssl-hpkp-backup:
    type: string
    raw_type: string
    description: Certificate to generate backup HPKP pin from.
    max_length: 79
  ssl-hpkp-include-subdomains:
    type: enum
    raw_type: option
    description: Indicate that HPKP header applies to all subdomains.
    default: disable
  ssl-hpkp-primary:
    type: string
    raw_type: string
    description: Certificate to generate primary HPKP pin from.
    max_length: 79
  ssl-hpkp-report-uri:
    type: string
    raw_type: var-string
    description: URL to report HPKP violations to.
    max_length: 255
  ssl-hsts:
    type: enum
    raw_type: option
    description: Enable/disable including HSTS header in response.
    default: disable
  ssl-hsts-age:
    type: integer
    raw_type: integer
    description: Number of seconds the client should honor the HSTS setting.
    default: '5184000'
    min: 60
    max: 157680000
  ssl-hsts-include-subdomains:
    type: enum
    raw_type: option
    description: Indicate that HSTS header applies to all subdomains.
    default: disable
  ssl-http-location-conversion:
    type: enum
    raw_type: option
    description: Enable to replace HTTP with HTTPS in the reply's Location HTTP header field.
    default: disable
  ssl-http-match-host:
    type: enum
    raw_type: option
    description: Enable/disable HTTP host matching for location conversion.
    default: enable
  ssl-max-version:
    type: enum
    raw_type: option
    description: Highest SSL/TLS version acceptable from a client.
    default: tls-1.3
  ssl-min-version:
    type: enum
    raw_type: option
    description: Lowest SSL/TLS version acceptable from a client.
    default: tls-1.1
  ssl-mode:
    type: enum
    raw_type: option
    description: Apply SSL offloading between the client and the FortiGate (half) or from the client to the FortiGate and
      from the FortiGate to the server (full).
    default: half
  ssl-pfs:
    type: enum
    raw_type: option
    description: Select the cipher suites that can be used for SSL perfect forward secrecy (PFS). Applies to both client and
      server sessions.
    default: require
  ssl-send-empty-frags:
    type: enum
    raw_type: option
    description: Enable/disable sending empty fragments to avoid CBC IV attacks (SSL 3.0 & TLS 1.0 only). May need to be disabled
      for compatibility with older systems.
    default: enable
  ssl-server-algorithm:
    type: enum
    raw_type: option
    description: Permitted encryption algorithms for the server side of SSL full mode sessions according to encryption strength.
    default: client
  ssl-server-max-version:
    type: enum
    raw_type: option
    description: Highest SSL/TLS version acceptable from a server. Use the client setting by default.
    default: client
  ssl-server-min-version:
    type: enum
    raw_type: option
    description: Lowest SSL/TLS version acceptable from a server. Use the client setting by default.
    default: client
  ssl-server-renegotiation:
    type: enum
    raw_type: option
    description: Enable/disable secure renegotiation to comply with RFC 5746.
    default: enable
  ssl-server-session-state-max:
    type: integer
    raw_type: integer
    description: Maximum number of FortiGate to Server SSL session states to keep.
    default: '100'
    min: 1
    max: 10000
  ssl-server-session-state-timeout:
    type: integer
    raw_type: integer
    description: Number of minutes to keep FortiGate to Server SSL session state.
    default: '60'
    min: 1
    max: 14400
  ssl-server-session-state-type:
    type: enum
    raw_type: option
    description: How to expire SSL sessions for the segment of the SSL connection between the server and the FortiGate.
    default: both
  type:
    type: enum
    raw_type: option
    description: Configure a static NAT server load balance VIP or access proxy.
    default: static-nat
  user-agent-detect:
    type: enum
    raw_type: option
    description: Enable/disable detecting device type by HTTP user-agent if no client certificate is provided.
    default: enable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  weblogic-server:
    type: enum
    raw_type: option
    description: Enable to add an HTTP header to indicate SSL offloading for a WebLogic server.
    default: disable
  websphere-server:
    type: enum
    raw_type: option
    description: Enable to add an HTTP header to indicate SSL offloading for a WebSphere server.
    default: disable
children:
  quic:
    attributes:
      ack-delay-exponent:
        type: integer
        raw_type: integer
        description: ACK delay exponent (1 - 20, default = 3).
        default: '3'
        min: 1
        max: 20
      active-connection-id-limit:
        type: integer
        raw_type: integer
        description: Active connection ID limit (1 - 8, default = 2).
        default: '2'
        min: 1
        max: 8
      active-migration:
        type: enum
        raw_type: option
        description: Enable/disable active migration (default = disable).
        default: disable
      grease-quic-bit:
        type: enum
        raw_type: option
        description: Enable/disable grease QUIC bit (default = enable).
        default: enable
      max-ack-delay:
        type: integer
        raw_type: integer
        description: Maximum ACK delay in milliseconds (1 - 16383, default = 25).
        default: '25'
        min: 1
        max: 16383
      max-datagram-frame-size:
        type: integer
        raw_type: integer
        description: Maximum datagram frame size in bytes (1 - 1500, default = 1500).
        default: '1500'
        min: 1
        max: 1500
      max-idle-timeout:
        type: integer
        raw_type: integer
        description: Maximum idle timeout milliseconds (1 - 60000, default = 30000).
        default: '30000'
        min: 1
        max: 60000
      max-udp-payload-size:
        type: integer
        raw_type: integer
        description: Maximum UDP payload size in bytes (1200 - 1500, default = 1500).
        default: '1500'
        min: 1200
        max: 1500
  realservers:
    attributes:
      client-ip:
        type: string
        raw_type: user
        description: Only clients in this IP range can connect to this real server.
      healthcheck:
        type: enum
        raw_type: option
        description: Enable to check the responsiveness of the real server before forwarding traffic.
        default: vip
      holddown-interval:
        type: integer
        raw_type: integer
        description: Time in seconds that the system waits before re-activating a previously down active server in the active-standby
          mode. This is to prevent any flapping issues.
        default: '300'
        min: 30
        max: 65535
      http-host:
        type: string
        raw_type: string
        description: HTTP server domain name in HTTP header.
        max_length: 63
      id:
        type: integer
        raw_type: integer
        description: Real server ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: string
        raw_type: user
        description: IP address of the real server.
      max-connections:
        type: integer
        raw_type: integer
        description: Max number of active connections that can directed to the real server. When reached, sessions are sent
          to other real servers.
        default: '0'
        min: 0
        max: 2147483647
      monitor:
        type: string
        raw_type: string
        description: Name of the health check monitor to use when polling to determine a virtual server's connectivity status.
          Health monitor name.
        max_length: 79
      port:
        type: integer
        raw_type: integer
        description: Port for communicating with the real server. Required if port forwarding is enabled.
        default: '0'
        min: 1
        max: 65535
      status:
        type: enum
        raw_type: option
        description: Set the status of the real server to active so that it can accept traffic, or on standby or disabled
          so no traffic is sent.
        default: active
      translate-host:
        type: enum
        raw_type: option
        description: Enable/disable translation of hostname/IP from virtual server to real server.
        default: enable
      verify-cert:
        type: enum
        raw_type: option
        description: Enable/disable certificate verification of the real server.
        default: enable
      weight:
        type: integer
        raw_type: integer
        description: Weight of the real server. If weighted load balancing is enabled, the server with the highest weight
          gets more connections.
        default: '1'
        min: 1
        max: 255
  ssl-cipher-suites:
    attributes:
      cipher:
        type: enum
        raw_type: option
        description: Cipher suite name.
      priority:
        type: integer
        raw_type: integer
        description: SSL/TLS cipher suites priority.
        default: '0'
        min: 0
        max: 4294967295
      versions:
        type: enum
        raw_type: option
        description: SSL/TLS versions that the cipher suite can be used with.
        default: ssl-3.0 tls-1.0 tls-1.1 tls-1.2 tls-1.3
  ssl-server-cipher-suites:
    attributes:
      cipher:
        type: enum
        raw_type: option
        description: Cipher suite name.
      priority:
        type: integer
        raw_type: integer
        description: SSL/TLS cipher suites priority.
        default: '0'
        min: 0
        max: 4294967295
      versions:
        type: enum
        raw_type: option
        description: SSL/TLS versions that the cipher suite can be used with.
        default: ssl-3.0 tls-1.0 tls-1.1 tls-1.2 tls-1.3
