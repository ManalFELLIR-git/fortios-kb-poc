id: emailfilter.mheader
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/211964338/config-emailfilter-mheader
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Mark spam or good.
        default: spam
      fieldbody:
        type: string
        raw_type: string
        description: Pattern for the header field body.
        max_length: 127
      fieldname:
        type: string
        raw_type: string
        description: Pattern for header field name.
        max_length: 63
      id:
        type: integer
        raw_type: integer
        description: Mime header entry ID.
        default: '0'
        min: 0
        max: 4294967295
      pattern-type:
        type: enum
        raw_type: option
        description: Wildcard pattern or regular expression.
        default: wildcard
      status:
        type: enum
        raw_type: option
        description: Enable/disable status.
        default: enable
