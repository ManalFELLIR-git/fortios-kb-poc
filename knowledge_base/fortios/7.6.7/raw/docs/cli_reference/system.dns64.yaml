id: system.dns64
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/234319058/config-system-dns64
attributes:
  always-synthesize-aaaa-record:
    type: enum
    raw_type: option
    description: Enable/disable AAAA record synthesis (default = enable).
    default: enable
  dns64-prefix:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: DNS64 prefix must be ::/96 (default = 64:ff9b::/96).
    default: 64:ff9b::/96
  status:
    type: enum
    raw_type: option
    description: Enable/disable DNS64 (default = disable).
    default: disable
children: {}
