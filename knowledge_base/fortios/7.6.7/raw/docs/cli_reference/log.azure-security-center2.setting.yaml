id: log.azure-security-center2.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/373091884/config-log-azure-security-center2-setting
attributes:
  appliance-id:
    type: string
    raw_type: string
    description: Appliance ID.
    max_length: 128
  eventhub-name:
    type: string
    raw_type: string
    description: Event hub name.
    max_length: 128
  policy-name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 128
  policy-saskey:
    type: string
    raw_type: string
    description: Policy saskey.
    max_length: 128
  servicebus-namespace:
    type: string
    raw_type: string
    description: Service bus namespace.
    max_length: 128
  status:
    type: enum
    raw_type: option
    description: Enable Azure Security Center logging.
    default: disable
children:
  custom-field-name:
    attributes:
      custom:
        type: string
        raw_type: string
        description: Field custom name [A-Za-z0-9_].
        max_length: 35
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 255
      name:
        type: string
        raw_type: string
        description: Field name [A-Za-z0-9_].
        max_length: 35
