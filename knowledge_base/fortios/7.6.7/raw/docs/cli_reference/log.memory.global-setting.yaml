id: log.memory.global-setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130254894/config-log-memory-global-setting
attributes:
  full-final-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full final warning threshold as a percent (3 - 100, default = 95).
    default: '95'
    min: 3
    max: 100
  full-first-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full first warning threshold as a percent (1 - 98, default = 75).
    default: '75'
    min: 1
    max: 98
  full-second-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full second warning threshold as a percent (2 - 99, default = 90).
    default: '90'
    min: 2
    max: 99
  max-size:
    type: integer
    raw_type: integer
    description: Maximum amount of memory that can be used for memory logging in bytes.
    default: 168438292 **
    min: 0
    max: 4294967295
children: {}
