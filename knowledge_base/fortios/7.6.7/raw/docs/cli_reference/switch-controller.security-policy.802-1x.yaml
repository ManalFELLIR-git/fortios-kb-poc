id: switch-controller.security-policy.802-1x
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105117164/config-switch-controller-security-policy-802-1x
attributes:
  auth-fail-vlan:
    type: enum
    raw_type: option
    description: Enable to allow limited access to clients that cannot authenticate.
    default: disable
  auth-fail-vlan-id:
    type: string
    raw_type: string
    description: VLAN ID on which authentication failed.
    max_length: 15
  auth-order:
    type: enum
    raw_type: option
    description: Configure authentication order.
    default: mab-dot1x
  auth-priority:
    type: enum
    raw_type: option
    description: Configure authentication priority.
    default: legacy
  authserver-timeout-period:
    type: integer
    raw_type: integer
    description: Authentication server timeout period (3 - 15 sec, default = 3).
    default: '3'
    min: 3
    max: 15
  authserver-timeout-tagged:
    type: enum
    raw_type: option
    description: Configure timeout option for the tagged VLAN which allows limited access when the authentication server is
      unavailable.
    default: disable
  authserver-timeout-tagged-vlanid:
    type: string
    raw_type: string
    description: Tagged VLAN name for which the timeout option is applied to (only one VLAN ID).
    max_length: 15
  authserver-timeout-vlan:
    type: enum
    raw_type: option
    description: Enable/disable the authentication server timeout VLAN to allow limited access when RADIUS is unavailable.
    default: disable
  authserver-timeout-vlanid:
    type: string
    raw_type: string
    description: Authentication server timeout VLAN name.
    max_length: 15
  dacl:
    type: enum
    raw_type: option
    description: Enable/disable dynamic access control list on this interface.
    default: disable
  eap-auto-untagged-vlans:
    type: enum
    raw_type: option
    description: Enable/disable automatic inclusion of untagged VLANs.
    default: enable
  eap-passthru:
    type: enum
    raw_type: option
    description: Enable/disable EAP pass-through mode, allowing protocols (such as LLDP) to pass through ports for more flexible
      authentication.
    default: enable
  framevid-apply:
    type: enum
    raw_type: option
    description: Enable/disable the capability to apply the EAP/MAB frame VLAN to the port native VLAN.
    default: enable
  guest-auth-delay:
    type: integer
    raw_type: integer
    description: Guest authentication delay (1 - 900 sec, default = 30).
    default: '30'
    min: 1
    max: 900
  guest-vlan:
    type: enum
    raw_type: option
    description: Enable the guest VLAN feature to allow limited access to non-802.1X-compliant clients.
    default: disable
  guest-vlan-id:
    type: string
    raw_type: string
    description: Guest VLAN name.
    max_length: 15
  mac-auth-bypass:
    type: enum
    raw_type: option
    description: Enable/disable MAB for this policy.
    default: disable
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 31
  open-auth:
    type: enum
    raw_type: option
    description: Enable/disable open authentication for this policy.
    default: disable
  policy-type:
    type: enum
    raw_type: option
    description: Policy type.
    default: 802.1X
  radius-timeout-overwrite:
    type: enum
    raw_type: option
    description: Enable to override the global RADIUS session timeout.
    default: disable
  security-mode:
    type: enum
    raw_type: option
    description: Port or MAC based 802.1X security mode.
    default: 802.1X
  user-group:
    type: string
    raw_type: string
    description: Name of user-group to assign to this MAC Authentication Bypass (MAB) policy. Group name.
    max_length: 79
children: {}
