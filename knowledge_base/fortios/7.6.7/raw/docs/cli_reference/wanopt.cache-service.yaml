id: wanopt.cache-service
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/717690012/config-wanopt-cache-service
attributes:
  acceptable-connections:
    type: enum
    raw_type: option
    description: Set strategy when accepting cache collaboration connection.
    default: any
  collaboration:
    type: enum
    raw_type: option
    description: Enable/disable cache-collaboration between cache-service clusters.
    default: disable
  device-id:
    type: string
    raw_type: string
    description: Set identifier for this cache device.
    default: default_dev_id
    max_length: 35
  prefer-scenario:
    type: enum
    raw_type: option
    description: Set the preferred cache behavior towards the balance between latency and hit-ratio.
    default: balance
children:
  dst-peer:
    attributes:
      auth-type:
        type: integer
        raw_type: integer
        description: Set authentication type for this peer.
        default: '0'
        min: 0
        max: 255
      device-id:
        type: string
        raw_type: string
        description: Device ID of this peer.
        max_length: 35
      encode-type:
        type: integer
        raw_type: integer
        description: Set encode type for this peer.
        default: '0'
        min: 0
        max: 255
      ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Set cluster IP address of this peer.
        default: 0.0.0.0
      priority:
        type: integer
        raw_type: integer
        description: Set priority for this peer.
        default: '1'
        min: 0
        max: 255
  src-peer:
    attributes:
      auth-type:
        type: integer
        raw_type: integer
        description: Set authentication type for this peer.
        default: '0'
        min: 0
        max: 255
      device-id:
        type: string
        raw_type: string
        description: Device ID of this peer.
        max_length: 35
      encode-type:
        type: integer
        raw_type: integer
        description: Set encode type for this peer.
        default: '0'
        min: 0
        max: 255
      ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: Set cluster IP address of this peer.
        default: 0.0.0.0
      priority:
        type: integer
        raw_type: integer
        description: Set priority for this peer.
        default: '1'
        min: 0
        max: 255
