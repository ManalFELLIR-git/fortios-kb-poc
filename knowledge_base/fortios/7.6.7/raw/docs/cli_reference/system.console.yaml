id: system.console
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/141236613/config-system-console
attributes:
  fortiexplorer:
    type: enum
    raw_type: option
    description: Enable/disable access for FortiExplorer.
    default: enable
  login:
    type: enum
    raw_type: option
    description: Enable/disable serial console and FortiExplorer.
    default: enable
  output:
    type: enum
    raw_type: option
    description: Console output mode.
    default: more
children: {}
