id: vpn.certificate.ocsp-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/251248056/config-vpn-certificate-ocsp-server
attributes:
  cert:
    type: string
    raw_type: string
    description: OCSP server certificate.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: OCSP server entry name.
    max_length: 35
  secondary-cert:
    type: string
    raw_type: string
    description: Secondary OCSP server certificate.
    max_length: 127
  secondary-url:
    type: string
    raw_type: string
    description: Secondary OCSP server URL.
    max_length: 127
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for dynamic AIA and OCSP queries.
    max_length: 63
  unavail-action:
    type: enum
    raw_type: option
    description: Action when server is unavailable (revoke the certificate or ignore the result of the check).
    default: revoke
  url:
    type: string
    raw_type: string
    description: OCSP server URL.
    max_length: 127
children: {}
