id: firewall.ssh.local-key
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/739950788/config-firewall-ssh-local-key
attributes:
  name:
    type: string
    raw_type: string
    description: SSH proxy local key name.
    max_length: 35
  password:
    type: password
    raw_type: password
    description: Password for SSH private key.
  private-key:
    type: string
    raw_type: user
    description: SSH proxy private key, encrypted with a password.
  public-key:
    type: string
    raw_type: user
    description: SSH proxy public key.
  source:
    type: enum
    raw_type: option
    description: SSH proxy local key source type.
    default: user
children: {}
