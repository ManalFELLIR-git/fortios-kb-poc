id: switch-controller.traffic-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/205853363/config-switch-controller-traffic-policy
attributes:
  cos-queue:
    type: integer
    raw_type: integer
    description: COS queue(0 - 7), or unset to disable.
    min: 0
    max: 7
  description:
    type: string
    raw_type: string
    description: Description of the traffic policy.
    max_length: 63
  guaranteed-bandwidth:
    type: integer
    raw_type: integer
    description: Guaranteed bandwidth in kbps (max value = 524287000).
    default: '10000'
    min: 0
    max: 524287000
  guaranteed-burst:
    type: integer
    raw_type: integer
    description: Guaranteed burst size in bytes (max value = 4294967295).
    default: '45000'
    min: 0
    max: 4294967295
  maximum-burst:
    type: integer
    raw_type: integer
    description: Maximum burst size in bytes (max value = 4294967295).
    default: '67500'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Traffic policy name.
    max_length: 63
  policer-status:
    type: enum
    raw_type: option
    description: Enable/disable policer config on the traffic policy.
    default: enable
  type:
    type: enum
    raw_type: option
    description: Configure type of policy(ingress/egress). Read-only.
    default: ingress
children: {}
