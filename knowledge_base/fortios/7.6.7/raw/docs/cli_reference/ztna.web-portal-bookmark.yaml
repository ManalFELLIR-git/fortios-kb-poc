id: ztna.web-portal-bookmark
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/416368785/config-ztna-web-portal-bookmark
attributes:
  groups:
    type: string
    raw_type: string
    description: User groups. Group name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Bookmark name.
    max_length: 35
  users:
    type: string
    raw_type: string
    description: User name. User name.
    max_length: 79
children:
  bookmarks:
    attributes:
      apptype:
        type: enum
        raw_type: option
        description: Application type.
        default: web
      color-depth:
        type: enum
        raw_type: option
        description: Color depth per pixel.
        default: '16'
      description:
        type: string
        raw_type: var-string
        description: Description.
        max_length: 128
      domain:
        type: string
        raw_type: var-string
        description: Login domain.
        max_length: 128
      folder:
        type: string
        raw_type: var-string
        description: Network shared file folder parameter.
        max_length: 128
      height:
        type: integer
        raw_type: integer
        description: Screen height (range from 0 - 65535, default = 0).
        default: '0'
        min: 0
        max: 65535
      host:
        type: string
        raw_type: var-string
        description: Host name/IP parameter.
        max_length: 128
      keyboard-layout:
        type: enum
        raw_type: option
        description: Keyboard layout.
        default: en-us
      load-balancing-info:
        type: string
        raw_type: var-string
        description: The load balancing information or cookie which should be provided to the connection broker.
        max_length: 511
      logon-password:
        type: password
        raw_type: password
        description: Logon password.
      logon-user:
        type: string
        raw_type: var-string
        description: Logon user.
        max_length: 35
      name:
        type: string
        raw_type: string
        description: Bookmark name.
        max_length: 35
      port:
        type: integer
        raw_type: integer
        description: Remote port.
        default: '0'
        min: 0
        max: 65535
      preconnection-blob:
        type: string
        raw_type: var-string
        description: An arbitrary string which identifies the RDP source.
        max_length: 511
      preconnection-id:
        type: integer
        raw_type: integer
        description: The numeric ID of the RDP source (0-4294967295).
        default: '0'
        min: 0
        max: 4294967295
      restricted-admin:
        type: enum
        raw_type: option
        description: Enable/disable restricted admin mode for RDP.
        default: disable
      security:
        type: enum
        raw_type: option
        description: Security mode for RDP connection (default = any).
        default: any
      send-preconnection-id:
        type: enum
        raw_type: option
        description: Enable/disable sending of preconnection ID.
        default: disable
      sso:
        type: enum
        raw_type: option
        description: Single sign-on.
        default: disable
      url:
        type: string
        raw_type: var-string
        description: URL parameter.
        max_length: 128
      verify-cert:
        type: enum
        raw_type: option
        description: Enable/disable certificate verification of the real server.
        default: enable
      vnc-keyboard-layout:
        type: enum
        raw_type: option
        description: Keyboard layout.
        default: default
      width:
        type: integer
        raw_type: integer
        description: Screen width (range from 0 - 65535, default = 0).
        default: '0'
        min: 0
        max: 65535
