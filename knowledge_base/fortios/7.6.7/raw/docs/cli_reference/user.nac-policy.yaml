id: user.nac-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/154535537/config-user-nac-policy
attributes:
  category:
    type: enum
    raw_type: option
    description: Category of NAC policy.
    default: device
  description:
    type: string
    raw_type: string
    description: Description for the NAC policy matching pattern.
    max_length: 63
  ems-tag:
    type: string
    raw_type: string
    description: NAC policy matching EMS tag.
    max_length: 79
  family:
    type: string
    raw_type: string
    description: NAC policy matching family.
    max_length: 31
  firewall-address:
    type: string
    raw_type: string
    description: Dynamic firewall address to associate MAC which match this policy.
    max_length: 79
  fortivoice-tag:
    type: string
    raw_type: string
    description: NAC policy matching FortiVoice tag.
    max_length: 79
  host:
    type: string
    raw_type: string
    description: NAC policy matching host.
    max_length: 64
  hw-vendor:
    type: string
    raw_type: string
    description: NAC policy matching hardware vendor.
    max_length: 15
  hw-version:
    type: string
    raw_type: string
    description: NAC policy matching hardware version.
    max_length: 15
  mac:
    type: string
    raw_type: string
    description: NAC policy matching MAC address.
    max_length: 17
  match-period:
    type: integer
    raw_type: integer
    description: Number of days the matched devices will be retained (0 - always retain)
    default: '0'
    min: 0
    max: 120
  match-remove:
    type: enum
    raw_type: option
    description: Options to remove the matched override devices.
    default: default
  match-type:
    type: enum
    raw_type: option
    description: Match and retain the devices based on the type.
    default: dynamic
  name:
    type: string
    raw_type: string
    description: NAC policy name.
    max_length: 63
  os:
    type: string
    raw_type: string
    description: NAC policy matching operating system.
    max_length: 31
  severity:
    type: integer
    raw_type: integer
    description: NAC policy matching devices vulnerability severity lists. Enter multiple severity levels, where 0 = Info,
      1 = Low, ..., 4 = Critical
    min: 0
    max: 4
  src:
    type: string
    raw_type: string
    description: NAC policy matching source.
    max_length: 15
  ssid-policy:
    type: string
    raw_type: string
    description: SSID policy to be applied on the matched NAC policy.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable NAC policy.
    default: enable
  sw-version:
    type: string
    raw_type: string
    description: NAC policy matching software version.
    max_length: 15
  switch-fortilink:
    type: string
    raw_type: string
    description: FortiLink interface for which this NAC policy belongs to.
    max_length: 15
  switch-group:
    type: string
    raw_type: string
    description: List of managed FortiSwitch groups on which NAC policy can be applied. Managed FortiSwitch group name from
      available options.
    max_length: 79
  switch-mac-policy:
    type: string
    raw_type: string
    description: Switch MAC policy action to be applied on the matched NAC policy.
    max_length: 63
  type:
    type: string
    raw_type: string
    description: NAC policy matching type.
    max_length: 15
  user:
    type: string
    raw_type: string
    description: NAC policy matching user.
    max_length: 64
  user-group:
    type: string
    raw_type: string
    description: NAC policy matching user group.
    max_length: 35
children: {}
