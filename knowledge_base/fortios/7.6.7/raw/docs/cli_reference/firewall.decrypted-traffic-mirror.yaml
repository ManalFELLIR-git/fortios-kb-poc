id: firewall.decrypted-traffic-mirror
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/272149487/config-firewall-decrypted-traffic-mirror
attributes:
  dstmac:
    type: mac-address
    raw_type: mac-address
    description: Set destination MAC address for mirrored traffic.
    default: ff:ff:ff:ff:ff:ff
  interface:
    type: string
    raw_type: string
    description: Decrypted traffic mirror interface. Decrypted traffic mirror interface.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  traffic-source:
    type: enum
    raw_type: option
    description: Source of decrypted traffic to be mirrored.
    default: client
  traffic-type:
    type: enum
    raw_type: option
    description: Types of decrypted traffic to be mirrored.
    default: ssl
children: {}
