id: system.vdom-dns
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/200885969/config-system-vdom-dns
attributes:
  alt-primary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Alternate primary DNS server. This is not used as a failover DNS server.
    default: 0.0.0.0
  alt-secondary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Alternate secondary DNS server. This is not used as a failover DNS server.
    default: 0.0.0.0
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ip6-primary:
    type: ipv6-address
    raw_type: ipv6-address
    description: Primary IPv6 DNS server IP address for the VDOM.
    default: '::'
  ip6-secondary:
    type: ipv6-address
    raw_type: ipv6-address
    description: Secondary IPv6 DNS server IP address for the VDOM.
    default: '::'
  primary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Primary DNS server IP address for the VDOM.
    default: 0.0.0.0
  protocol:
    type: enum
    raw_type: option
    description: DNS transport protocols.
    default: cleartext
  secondary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Secondary DNS server IP address for the VDOM.
    default: 0.0.0.0
  server-hostname:
    type: string
    raw_type: string
    description: DNS server host name list. DNS server host name list separated by space (maximum 4 domains).
    max_length: 127
  server-select-method:
    type: enum
    raw_type: option
    description: Specify how configured servers are prioritized.
    default: least-rtt
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP for communications with the DNS server.
    default: 0.0.0.0
  source-ip-interface:
    type: string
    raw_type: string
    description: IP address of the specified interface as the source IP address.
    max_length: 15
  ssl-certificate:
    type: string
    raw_type: string
    description: Name of local certificate for SSL connections.
    max_length: 35
  vdom-dns:
    type: enum
    raw_type: option
    description: Enable/disable configuring DNS servers for the current VDOM.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
