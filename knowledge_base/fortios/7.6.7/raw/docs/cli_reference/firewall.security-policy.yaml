id: firewall.security-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/127930672/config-firewall-security-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Policy action (accept/deny).
    default: deny
  app-category:
    type: integer
    raw_type: integer
    description: Application category ID list. Category IDs.
    min: 0
    max: 4294967295
  app-group:
    type: string
    raw_type: string
    description: Application group names. Application group names.
    max_length: 79
  application:
    type: integer
    raw_type: integer
    description: Application ID list. Application IDs.
    min: 0
    max: 4294967295
  application-list:
    type: string
    raw_type: string
    description: Name of an existing Application list.
    max_length: 47
  av-profile:
    type: string
    raw_type: string
    description: Name of an existing Antivirus profile.
    max_length: 47
  casb-profile:
    type: string
    raw_type: string
    description: Name of an existing CASB profile.
    max_length: 47
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  diameter-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing Diameter filter profile.
    max_length: 47
  dlp-profile:
    type: string
    raw_type: string
    description: Name of an existing DLP profile.
    max_length: 47
  dnsfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing DNS filter profile.
    max_length: 47
  dstaddr:
    type: string
    raw_type: string
    description: Destination IPv4 address name and address group names. Address name.
    max_length: 79
  dstaddr-negate:
    type: enum
    raw_type: option
    description: When enabled dstaddr specifies what the destination address must NOT be.
    default: disable
  dstaddr6:
    type: string
    raw_type: string
    description: Destination IPv6 address name and address group names. Address name.
    max_length: 79
  dstaddr6-negate:
    type: enum
    raw_type: option
    description: When enabled dstaddr6 specifies what the destination address must NOT be.
    default: disable
  dstintf:
    type: string
    raw_type: string
    description: Outgoing (egress) interface. Interface name.
    max_length: 79
  emailfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing email filter profile.
    max_length: 47
  enforce-default-app-port:
    type: enum
    raw_type: option
    description: Enable/disable default application port enforcement for allowed applications.
    default: enable
  file-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing file-filter profile.
    max_length: 47
  fsso-groups:
    type: string
    raw_type: string
    description: Names of FSSO groups. Names of FSSO groups.
    max_length: 511
  groups:
    type: string
    raw_type: string
    description: Names of user groups that can authenticate with this policy. User group name.
    max_length: 79
  icap-profile:
    type: string
    raw_type: string
    description: Name of an existing ICAP profile.
    max_length: 47
  internet-service:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address, service and default
      application port enforcement are not used.
    default: disable
  internet-service-custom:
    type: string
    raw_type: string
    description: Custom Internet Service name. Custom Internet Service name.
    max_length: 79
  internet-service-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service group name. Custom Internet Service group name.
    max_length: 79
  internet-service-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-group:
    type: string
    raw_type: string
    description: Internet Service group name. Internet Service group name.
    max_length: 79
  internet-service-name:
    type: string
    raw_type: string
    description: Internet Service name. Internet Service name.
    max_length: 79
  internet-service-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service specifies what the service must NOT be.
    default: disable
  internet-service-src:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services in source for this policy. If enabled, source address is not used.
    default: disable
  internet-service-src-custom:
    type: string
    raw_type: string
    description: Custom Internet Service source name. Custom Internet Service name.
    max_length: 79
  internet-service-src-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service source group name. Custom Internet Service group name.
    max_length: 79
  internet-service-src-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service source name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-src-group:
    type: string
    raw_type: string
    description: Internet Service source group name. Internet Service group name.
    max_length: 79
  internet-service-src-name:
    type: string
    raw_type: string
    description: Internet Service source name. Internet Service name.
    max_length: 79
  internet-service-src-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service-src specifies what the service must NOT be.
    default: disable
  internet-service6:
    type: enum
    raw_type: option
    description: Enable/disable use of IPv6 Internet Services for this policy. If enabled, destination address, service and
      default application port enforcement are not used.
    default: disable
  internet-service6-custom:
    type: string
    raw_type: string
    description: Custom IPv6 Internet Service name. Custom IPv6 Internet Service name.
    max_length: 79
  internet-service6-custom-group:
    type: string
    raw_type: string
    description: Custom IPv6 Internet Service group name. Custom IPv6 Internet Service group name.
    max_length: 79
  internet-service6-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard IPv6 Internet Service name. FortiGuard Internet Service name.
    max_length: 79
  internet-service6-group:
    type: string
    raw_type: string
    description: Internet Service group name. Internet Service group name.
    max_length: 79
  internet-service6-name:
    type: string
    raw_type: string
    description: IPv6 Internet Service name. IPv6 Internet Service name.
    max_length: 79
  internet-service6-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service6 specifies what the service must NOT be.
    default: disable
  internet-service6-src:
    type: enum
    raw_type: option
    description: Enable/disable use of IPv6 Internet Services in source for this policy. If enabled, source address is not
      used.
    default: disable
  internet-service6-src-custom:
    type: string
    raw_type: string
    description: Custom IPv6 Internet Service source name. Custom Internet Service name.
    max_length: 79
  internet-service6-src-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service6 source group name. Custom Internet Service6 group name.
    max_length: 79
  internet-service6-src-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard IPv6 Internet Service source name. FortiGuard Internet Service name.
    max_length: 79
  internet-service6-src-group:
    type: string
    raw_type: string
    description: Internet Service6 source group name. Internet Service group name.
    max_length: 79
  internet-service6-src-name:
    type: string
    raw_type: string
    description: IPv6 Internet Service source name. Internet Service name.
    max_length: 79
  internet-service6-src-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service6-src specifies what the service must NOT be.
    default: disable
  ips-sensor:
    type: string
    raw_type: string
    description: Name of an existing IPS sensor.
    max_length: 47
  ips-voip-filter:
    type: string
    raw_type: string
    description: Name of an existing VoIP (ips) profile.
    max_length: 47
  learning-mode:
    type: enum
    raw_type: option
    description: Enable to allow everything, but log all of the meaningful data for security information gathering. A learning
      report will be generated.
    default: disable
  logtraffic:
    type: enum
    raw_type: option
    description: Enable or disable logging. Log all sessions or security profile sessions.
    default: utm
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 35
  nat46:
    type: enum
    raw_type: option
    description: Enable/disable NAT46.
    default: disable
  nat64:
    type: enum
    raw_type: option
    description: Enable/disable NAT64.
    default: disable
  policyid:
    type: integer
    raw_type: integer
    description: Policy ID.
    default: '0'
    min: 0
    max: 4294967294
  profile-group:
    type: string
    raw_type: string
    description: Name of profile group.
    max_length: 47
  profile-protocol-options:
    type: string
    raw_type: string
    description: Name of an existing Protocol options profile.
    default: default
    max_length: 47
  profile-type:
    type: enum
    raw_type: option
    description: Determine whether the firewall policy allows security profile groups or single profiles only.
    default: single
  schedule:
    type: string
    raw_type: string
    description: Schedule name.
    max_length: 35
  sctp-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing SCTP filter profile.
    max_length: 47
  send-deny-packet:
    type: enum
    raw_type: option
    description: Enable to send a reply when a session is denied or blocked by a firewall policy.
    default: disable
  service:
    type: string
    raw_type: string
    description: Service and service group names. Service name.
    max_length: 79
  service-negate:
    type: enum
    raw_type: option
    description: When enabled service specifies what the service must NOT be.
    default: disable
  srcaddr:
    type: string
    raw_type: string
    description: Source IPv4 address name and address group names. Address name.
    max_length: 79
  srcaddr-negate:
    type: enum
    raw_type: option
    description: When enabled srcaddr specifies what the source address must NOT be.
    default: disable
  srcaddr6:
    type: string
    raw_type: string
    description: Source IPv6 address name and address group names. Address name.
    max_length: 79
  srcaddr6-negate:
    type: enum
    raw_type: option
    description: When enabled srcaddr6 specifies what the source address must NOT be.
    default: disable
  srcintf:
    type: string
    raw_type: string
    description: Incoming (ingress) interface. Interface name.
    max_length: 79
  ssh-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing SSH filter profile.
    max_length: 47
  ssl-ssh-profile:
    type: string
    raw_type: string
    description: Name of an existing SSL SSH profile.
    default: no-inspection
    max_length: 47
  status:
    type: enum
    raw_type: option
    description: Enable or disable this policy.
    default: enable
  telemetry-profile:
    type: string
    raw_type: string
    description: Name of an existing telemetry profile.
    max_length: 47
  url-category:
    type: string
    raw_type: user
    description: URL categories or groups.
  users:
    type: string
    raw_type: string
    description: Names of individual users that can authenticate with this policy. User name.
    max_length: 79
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  videofilter-profile:
    type: string
    raw_type: string
    description: Name of an existing VideoFilter profile.
    max_length: 47
  virtual-patch-profile:
    type: string
    raw_type: string
    description: Name of an existing virtual-patch profile.
    max_length: 47
  voip-profile:
    type: string
    raw_type: string
    description: Name of an existing VoIP (voipd) profile.
    max_length: 47
  webfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing Web filter profile.
    max_length: 47
children: {}
