id: system.gre-tunnel
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/414405667/config-system-gre-tunnel
attributes:
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable automatic ASIC offloading.
    default: enable
  checksum-reception:
    type: enum
    raw_type: option
    description: Enable/disable validating checksums in received GRE packets.
    default: disable
  checksum-transmission:
    type: enum
    raw_type: option
    description: Enable/disable including checksums in transmitted GRE packets.
    default: disable
  diffservcode:
    type: string
    raw_type: user
    description: DiffServ setting to be applied to GRE tunnel outer IP header.
  dscp-copying:
    type: enum
    raw_type: option
    description: Enable/disable DSCP copying.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  ip-version:
    type: enum
    raw_type: option
    description: IP version to use for VPN interface.
    default: '4'
  keepalive-failtimes:
    type: integer
    raw_type: integer
    description: Number of consecutive unreturned keepalive messages before a GRE connection is considered down (1 - 255).
    default: '10'
    min: 1
    max: 255
  keepalive-interval:
    type: integer
    raw_type: integer
    description: Keepalive message interval (0 - 32767, 0 = disabled).
    default: '0'
    min: 0
    max: 32767
  key-inbound:
    type: integer
    raw_type: integer
    description: Require received GRE packets contain this key (0 - 4294967295).
    default: '0'
    min: 0
    max: 4294967295
  key-outbound:
    type: integer
    raw_type: integer
    description: Include this key in transmitted GRE packets (0 - 4294967295).
    default: '0'
    min: 0
    max: 4294967295
  local-gw:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IP address of the local gateway.
    default: 0.0.0.0
  local-gw6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address of the local gateway.
    default: '::'
  loopback-ecmp-offload:
    type: enum
    raw_type: option
    description: Enable/disable tunnel over loopback ecmp offloading support.
    default: disable
  name:
    type: string
    raw_type: string
    description: Tunnel name.
    max_length: 15
  remote-gw:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the remote gateway.
    default: 0.0.0.0
  remote-gw6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address of the remote gateway.
    default: '::'
  sequence-number-reception:
    type: enum
    raw_type: option
    description: Enable/disable validating sequence numbers in received GRE packets.
    default: disable
  sequence-number-transmission:
    type: enum
    raw_type: option
    description: Enable/disable including of sequence numbers in transmitted GRE packets.
    default: disable
  use-sdwan:
    type: enum
    raw_type: option
    description: Enable/disable use of SD-WAN to reach remote gateway.
    default: disable
children: {}
