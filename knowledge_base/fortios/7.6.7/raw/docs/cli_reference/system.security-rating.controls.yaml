id: system.security-rating.controls
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/722806545/config-system-security-rating-controls
attributes:
  display-insight:
    type: enum
    raw_type: option
    description: Enable/disable displaying the Security Rating control as an insight across the GUI.
    default: enable
  display-report:
    type: enum
    raw_type: option
    description: Enable/disable displaying the Security Rating control in the default report.
    default: enable
  name:
    type: string
    raw_type: string
    description: Security Rating control name.
    max_length: 35
children: {}
