id: monitoring.np6-ipsec-engine
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260345061/config-monitoring-np6-ipsec-engine
attributes:
  interval:
    type: integer
    raw_type: integer
    description: IPsec engine status check interval (1 - 60 seconds, default = 1).
    default: '1'
    min: 1
    max: 60
  status:
    type: enum
    raw_type: option
    description: Enable/disable NP6 IPsec engine status monitoring.
    default: disable
  threshold:
    type: string
    raw_type: user
    description: 'IPsec engine status check threshold (x x x x x x x x, 8 integers from <1> to <255>, default = 15 15 12 12
      8 8 5 5). Example: Log is generated if IPsec engine 0 is busy each of every 15 consecutive interval checks.'
children: {}
