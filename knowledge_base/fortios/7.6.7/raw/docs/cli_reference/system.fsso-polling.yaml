id: system.fsso-polling
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/554353072/config-system-fsso-polling
attributes:
  auth-password:
    type: password
    raw_type: password
    description: Password to connect to FSSO Agent.
  authentication:
    type: enum
    raw_type: option
    description: Enable/disable FSSO Agent Authentication.
    default: disable
  listening-port:
    type: integer
    raw_type: integer
    description: Listening port to accept clients (1 - 65535).
    default: '8000'
    min: 1
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable FSSO Polling Mode.
    default: enable
children: {}
