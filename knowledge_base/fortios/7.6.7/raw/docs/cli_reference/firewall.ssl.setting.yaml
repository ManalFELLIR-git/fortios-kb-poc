id: firewall.ssl.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/178756044/config-firewall-ssl-setting
attributes:
  abbreviate-handshake:
    type: enum
    raw_type: option
    description: Enable/disable use of SSL abbreviated handshake.
    default: enable
  cert-cache-capacity:
    type: integer
    raw_type: integer
    description: Maximum capacity of the host certificate cache (0 - 500, default = 200).
    default: '200'
    min: 0
    max: 500
  cert-cache-timeout:
    type: integer
    raw_type: integer
    description: Time limit to keep certificate cache (1 - 120 min, default = 10).
    default: '10'
    min: 1
    max: 120
  cert-manager-cache-timeout:
    type: integer
    raw_type: integer
    description: Time limit for certificate manager to keep FortiGate re-signed server certificate (24 - 720 hours, default
      = 72).
    default: '72'
    min: 24
    max: 720
  kxp-queue-threshold:
    type: integer
    raw_type: integer
    description: Maximum length of the CP KXP queue. When the queue becomes full, the proxy switches cipher functions to the
      main CPU (0 - 512, default = 16).
    default: '16'
    min: 0
    max: 512
  no-matching-cipher-action:
    type: enum
    raw_type: option
    description: Bypass or drop the connection when no matching cipher is found.
    default: bypass
  proxy-connect-timeout:
    type: integer
    raw_type: integer
    description: Time limit to make an internal connection to the appropriate proxy process (1 - 60 sec, default = 30).
    default: '30'
    min: 1
    max: 60
  resigned-short-lived-certificate:
    type: enum
    raw_type: option
    description: Enable/disable short-lived certificate.
    default: enable
  session-cache-capacity:
    type: integer
    raw_type: integer
    description: Capacity of the SSL session cache (--Obsolete--) (1 - 1000, default = 500).
    default: '500'
    min: 0
    max: 1000
  session-cache-timeout:
    type: integer
    raw_type: integer
    description: Time limit to keep SSL session state (1 - 60 min, default = 20).
    default: '20'
    min: 1
    max: 60
  ssl-dh-bits:
    type: enum
    raw_type: option
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation (default = 2048).
    default: '2048'
  ssl-queue-threshold:
    type: integer
    raw_type: integer
    description: Maximum length of the CP SSL queue. When the queue becomes full, the proxy switches cipher functions to the
      main CPU (0 - 512, default = 32).
    default: '32'
    min: 0
    max: 512
  ssl-send-empty-frags:
    type: enum
    raw_type: option
    description: Enable/disable sending empty fragments to avoid attack on CBC IV (for SSL 3.0 and TLS 1.0 only).
    default: enable
children: {}
