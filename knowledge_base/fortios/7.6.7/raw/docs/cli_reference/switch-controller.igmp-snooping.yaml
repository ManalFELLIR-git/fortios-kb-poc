id: switch-controller.igmp-snooping
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/110601252/config-switch-controller-igmp-snooping
attributes:
  aging-time:
    type: integer
    raw_type: integer
    description: Maximum number of seconds to retain a multicast snooping entry for which no packets have been seen (15 -
      3600 sec, default = 300).
    default: '300'
    min: 15
    max: 3600
  flood-unknown-multicast:
    type: enum
    raw_type: option
    description: Enable/disable unknown multicast flooding.
    default: disable
  query-interval:
    type: integer
    raw_type: integer
    description: Maximum time after which IGMP query will be sent (10 - 1200 sec, default = 125).
    default: '125'
    min: 10
    max: 1200
children: {}
