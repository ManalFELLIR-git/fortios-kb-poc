id: system.ngfw-settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/206113285/config-system-ngfw-settings
attributes:
  match-timeout:
    type: integer
    raw_type: integer
    description: Number of seconds to wait before a security policy match for an idle non-TCP session (0 - 1800, default =
      300, 0 means unlimited).
    default: '300'
    min: 0
    max: 1800
  tcp-halfopen-match-timeout:
    type: integer
    raw_type: integer
    description: Number of seconds to wait before a security policy match for a session after one peer has sent an open session
      packet but the other has not responded (0 - 300, default = 8, 0 means unlimited).
    default: '8'
    min: 0
    max: 300
  tcp-match-timeout:
    type: integer
    raw_type: integer
    description: Number of seconds to wait before a security policy match for an idle TCP session (0 - 1800, default = 300,
      0 means unlimited).
    default: '300'
    min: 0
    max: 1800
children: {}
