id: system.dedicated-mgmt
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/112538628/config-system-dedicated-mgmt
attributes:
  default-gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: Default gateway for dedicated management interface.
    default: 0.0.0.0
  dhcp-end-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: DHCP end IP for dedicated management.
    default: 0.0.0.0
  dhcp-netmask:
    type: ipv4-netmask
    raw_type: ipv4-netmask
    description: DHCP netmask.
    default: 0.0.0.0
  dhcp-server:
    type: enum
    raw_type: option
    description: Enable/disable DHCP server on management interface.
    default: disable
  dhcp-start-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: DHCP start IP for dedicated management.
    default: 0.0.0.0
  interface:
    type: string
    raw_type: string
    description: Dedicated management interface.
    max_length: 15
  status:
    type: enum
    raw_type: option
    description: Enable/disable dedicated management.
    default: disable
children: {}
