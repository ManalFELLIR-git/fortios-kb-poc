id: switch-controller.mac-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/575173826/config-switch-controller-mac-policy
attributes:
  bounce-port-duration:
    type: integer
    raw_type: integer
    description: Bounce duration in seconds of a switch port where this mac-policy is applied.
    default: '5'
    min: 1
    max: 30
  bounce-port-link:
    type: enum
    raw_type: option
    description: Enable/disable bouncing (administratively bring the link down, up) of a switch port where this mac-policy
      is applied.
    default: enable
  count:
    type: enum
    raw_type: option
    description: Enable/disable packet count on the NAC device.
    default: disable
  description:
    type: string
    raw_type: string
    description: Description for the MAC policy.
    max_length: 63
  fortilink:
    type: string
    raw_type: string
    description: FortiLink interface for which this MAC policy belongs to.
    max_length: 15
  name:
    type: string
    raw_type: string
    description: MAC policy name.
    max_length: 63
  poe-reset:
    type: enum
    raw_type: option
    description: Enable/disable POE reset of a switch port where this mac-policy is applied.
    default: disable
  traffic-policy:
    type: string
    raw_type: string
    description: Traffic policy to be applied when using this MAC policy.
    max_length: 63
  vlan:
    type: string
    raw_type: string
    description: Ingress traffic VLAN assignment for the MAC address matching this MAC policy.
    max_length: 15
children: {}
