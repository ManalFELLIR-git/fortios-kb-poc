id: system.vne-interface
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/106491833/config-system-vne-interface
attributes:
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable tunnel ASIC offloading.
    default: enable
  bmr-hostname:
    type: password
    raw_type: password
    description: BMR hostname.
  br:
    type: string
    raw_type: string
    description: IPv6 address or FQDN of the border relay.
    max_length: 255
  http-password:
    type: password
    raw_type: password
    description: HTTP authentication password.
  http-username:
    type: string
    raw_type: string
    description: HTTP authentication user name.
    max_length: 64
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  ipv4-address:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: Tunnel IPv4 address and netmask.
    default: 0.0.0.0 0.0.0.0
  mode:
    type: enum
    raw_type: option
    description: VNE tunnel mode.
    default: map-e
  name:
    type: string
    raw_type: string
    description: VNE tunnel name.
    max_length: 15
  ssl-certificate:
    type: string
    raw_type: string
    description: Name of local certificate for SSL connections.
    default: Fortinet_Factory **
    max_length: 35
  update-url:
    type: string
    raw_type: string
    description: URL of provisioning server.
    max_length: 511
children: {}
