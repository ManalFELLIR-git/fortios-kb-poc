id: log.threat-weight
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/305436417/config-log-threat-weight
attributes:
  blocked-connection:
    type: enum
    raw_type: option
    description: Threat weight score for blocked connections.
    default: high
  botnet-connection-detected:
    type: enum
    raw_type: option
    description: Threat weight score for detected botnet connections.
    default: critical
  failed-connection:
    type: enum
    raw_type: option
    description: Threat weight score for failed connections.
    default: low
  status:
    type: enum
    raw_type: option
    description: Enable/disable the threat weight feature.
    default: enable
  url-block-detected:
    type: enum
    raw_type: option
    description: Threat weight score for URL blocking.
    default: high
children:
  application:
    attributes:
      category:
        type: integer
        raw_type: integer
        description: Application category.
        default: '0'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 255
      level:
        type: enum
        raw_type: option
        description: Threat weight score for Application events.
        default: low
  geolocation:
    attributes:
      country:
        type: string
        raw_type: string
        description: Country code.
        max_length: 2
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 255
      level:
        type: enum
        raw_type: option
        description: Threat weight score for Geolocation-based events.
        default: low
  ips:
    attributes:
      critical-severity:
        type: enum
        raw_type: option
        description: Threat weight score for IPS critical severity events.
        default: critical
      high-severity:
        type: enum
        raw_type: option
        description: Threat weight score for IPS high severity events.
        default: high
      info-severity:
        type: enum
        raw_type: option
        description: Threat weight score for IPS info severity events.
        default: disable
      low-severity:
        type: enum
        raw_type: option
        description: Threat weight score for IPS low severity events.
        default: low
      medium-severity:
        type: enum
        raw_type: option
        description: Threat weight score for IPS medium severity events.
        default: medium
  level:
    attributes:
      critical:
        type: integer
        raw_type: integer
        description: Critical level score value (1 - 100).
        default: '50'
        min: 1
        max: 100
      high:
        type: integer
        raw_type: integer
        description: High level score value (1 - 100).
        default: '30'
        min: 1
        max: 100
      low:
        type: integer
        raw_type: integer
        description: Low level score value (1 - 100).
        default: '5'
        min: 1
        max: 100
      medium:
        type: integer
        raw_type: integer
        description: Medium level score value (1 - 100).
        default: '10'
        min: 1
        max: 100
  malware:
    attributes:
      command-blocked:
        type: enum
        raw_type: option
        description: Threat weight score for blocked command detected.
        default: disable
      content-disarm:
        type: enum
        raw_type: option
        description: Threat weight score for virus (content disarm) detected.
        default: medium
      ems-threat-feed:
        type: enum
        raw_type: option
        description: Threat weight score for virus (EMS threat feed) detected.
        default: medium
      file-blocked:
        type: enum
        raw_type: option
        description: Threat weight score for blocked file detected.
        default: low
      fsa-high-risk:
        type: enum
        raw_type: option
        description: Threat weight score for FortiSandbox high risk malware detected.
        default: high
      fsa-malicious:
        type: enum
        raw_type: option
        description: Threat weight score for FortiSandbox malicious malware detected.
        default: critical
      fsa-medium-risk:
        type: enum
        raw_type: option
        description: Threat weight score for FortiSandbox medium risk malware detected.
        default: medium
      inline-block:
        type: enum
        raw_type: option
        description: Threat weight score for malware detected by inline block.
        default: critical
      malware-list:
        type: enum
        raw_type: option
        description: Threat weight score for virus (malware list) detected.
        default: medium
      mimefragmented:
        type: enum
        raw_type: option
        description: Threat weight score for mimefragmented detected.
        default: disable
      oversized:
        type: enum
        raw_type: option
        description: Threat weight score for oversized file detected.
        default: disable
      switch-proto:
        type: enum
        raw_type: option
        description: Threat weight score for switch proto detected.
        default: disable
      virus-file-type-executable:
        type: enum
        raw_type: option
        description: Threat weight score for virus (file type executable) detected.
        default: medium
      virus-infected:
        type: enum
        raw_type: option
        description: Threat weight score for virus (infected) detected.
        default: critical
      virus-outbreak-prevention:
        type: enum
        raw_type: option
        description: Threat weight score for virus (outbreak prevention) event.
        default: critical
      virus-scan-error:
        type: enum
        raw_type: option
        description: Threat weight score for virus (scan error) detected.
        default: high
  web:
    attributes:
      category:
        type: integer
        raw_type: integer
        description: Threat weight score for web category filtering matches.
        default: '0'
        min: 0
        max: 255
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 255
      level:
        type: enum
        raw_type: option
        description: Threat weight score for web category filtering matches.
        default: low
