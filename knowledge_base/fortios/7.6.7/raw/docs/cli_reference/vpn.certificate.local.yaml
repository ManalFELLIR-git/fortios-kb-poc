id: vpn.certificate.local
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/556354036/config-vpn-certificate-local
attributes:
  acme-ca-url:
    type: string
    raw_type: string
    description: The URL for the ACME CA server (Let's Encrypt is the default provider).
    default: https://acme-v02.api.letsencrypt.org/directory
    max_length: 255
  acme-domain:
    type: string
    raw_type: string
    description: A valid domain that resolves to this FortiGate unit.
    max_length: 255
  acme-eab-key-hmac:
    type: password
    raw_type: password
    description: External Account Binding HMAC Key (URL-encoded base64).
  acme-eab-key-id:
    type: string
    raw_type: var-string
    description: External Account Binding Key ID (optional setting).
    max_length: 255
  acme-email:
    type: string
    raw_type: string
    description: Contact email address that is required by some CAs like LetsEncrypt.
    max_length: 255
  acme-renew-window:
    type: integer
    raw_type: integer
    description: Beginning of the renewal window (in days before certificate expiration, 30 by default).
    default: '30'
    min: 1
    max: 100
  acme-rsa-key-size:
    type: integer
    raw_type: integer
    description: Length of the RSA private key of the generated cert (Minimum 2048 bits).
    default: '2048'
    min: 2048
    max: 4096
  auto-regenerate-days:
    type: integer
    raw_type: integer
    description: Number of days to wait before expiry of an updated local certificate is requested (0 = disabled).
    default: '0'
    min: 0
    max: 4294967295
  auto-regenerate-days-warning:
    type: integer
    raw_type: integer
    description: Number of days to wait before an expiry warning message is generated (0 = disabled).
    default: '0'
    min: 0
    max: 4294967295
  ca-identifier:
    type: string
    raw_type: string
    description: CA identifier of the CA server for signing via SCEP.
    max_length: 255
  certificate:
    type: string
    raw_type: user
    description: PEM format certificate.
  cmp-path:
    type: string
    raw_type: string
    description: Path location inside CMP server.
    max_length: 255
  cmp-regeneration-method:
    type: enum
    raw_type: option
    description: CMP auto-regeneration method.
    default: keyupate
  cmp-server:
    type: string
    raw_type: string
    description: Address and port for CMP server (format = address:port).
    max_length: 63
  cmp-server-cert:
    type: string
    raw_type: string
    description: CMP server certificate.
    max_length: 79
  comments:
    type: string
    raw_type: string
    description: Comment.
    max_length: 511
  csr:
    type: string
    raw_type: user
    description: Certificate Signing Request.
  enroll-protocol:
    type: enum
    raw_type: option
    description: Certificate enrollment protocol.
    default: none
  est-ca-id:
    type: string
    raw_type: string
    description: CA identifier of the CA server for signing via EST.
    max_length: 255
  est-client-cert:
    type: string
    raw_type: string
    description: Certificate used to authenticate this FortiGate to EST server.
    max_length: 79
  est-http-password:
    type: password
    raw_type: password
    description: HTTP Authentication password for signing via EST.
  est-http-username:
    type: string
    raw_type: string
    description: HTTP Authentication username for signing via EST.
    max_length: 63
  est-regeneration-method:
    type: enum
    raw_type: option
    description: EST behavioral options during re-enrollment.
    default: create-new-key
  est-server:
    type: string
    raw_type: string
    description: Address and port for EST server (e.g. https://example.com:1234).
    max_length: 255
  est-server-cert:
    type: string
    raw_type: string
    description: EST server's certificate must be verifiable by this certificate to be authenticated.
    max_length: 79
  est-srp-password:
    type: password
    raw_type: password
    description: EST SRP authentication password.
  est-srp-username:
    type: string
    raw_type: string
    description: EST SRP authentication username.
    max_length: 63
  ike-localid:
    type: string
    raw_type: string
    description: Local ID the FortiGate uses for authentication as a VPN client.
    max_length: 63
  ike-localid-type:
    type: enum
    raw_type: option
    description: IKE local ID type.
    default: asn1dn
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  name-encoding:
    type: enum
    raw_type: option
    description: Name encoding method for auto-regeneration.
    default: printable
  password:
    type: password
    raw_type: password
    description: Password as a PEM file.
  private-key:
    type: string
    raw_type: user
    description: PEM format key encrypted with a password.
  private-key-retain:
    type: enum
    raw_type: option
    description: Enable/disable retention of private key during SCEP renewal (default = disable).
    default: disable
  range:
    type: enum
    raw_type: option
    description: Either a global or VDOM IP address range for the certificate.
    default: vdom
  scep-password:
    type: password
    raw_type: password
    description: SCEP server challenge password for auto-regeneration.
  scep-url:
    type: string
    raw_type: string
    description: SCEP server URL.
    max_length: 255
  source:
    type: enum
    raw_type: option
    description: Certificate source type.
    default: user
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address for communications to the SCEP server.
    default: 0.0.0.0
  state:
    type: string
    raw_type: user
    description: Certificate Signing Request State. Read-only.
children: {}
