id: antivirus.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/110338989/config-antivirus-profile
attributes:
  analytics-accept-filetype:
    type: integer
    raw_type: integer
    description: Only submit files matching this DLP file-pattern to FortiSandbox (post-transfer scan only).
    default: '0'
    min: 0
    max: 4294967295
  analytics-db:
    type: enum
    raw_type: option
    description: Enable/disable using the FortiSandbox signature database to supplement the AV signature databases.
    default: disable
  analytics-ignore-filetype:
    type: integer
    raw_type: integer
    description: Do not submit files matching this DLP file-pattern to FortiSandbox (post-transfer scan only).
    default: '0'
    min: 0
    max: 4294967295
  av-virus-log:
    type: enum
    raw_type: option
    description: Enable/disable AntiVirus logging.
    default: enable
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  ems-threat-feed:
    type: enum
    raw_type: option
    description: Enable/disable use of EMS threat feed when performing AntiVirus scan. Analyzes files including the content
      of archives.
    default: disable
  extended-log:
    type: enum
    raw_type: option
    description: Enable/disable extended logging for antivirus.
    default: disable
  external-blocklist:
    type: string
    raw_type: string
    description: One or more external malware block lists. External blocklist.
    max_length: 79
  external-blocklist-enable-all:
    type: enum
    raw_type: option
    description: Enable/disable all external blocklists.
    default: disable
  feature-set:
    type: enum
    raw_type: option
    description: Flow/proxy feature set.
    default: flow
  fortindr-error-action:
    type: enum
    raw_type: option
    description: Action to take if FortiNDR encounters an error.
    default: log-only
  fortindr-timeout-action:
    type: enum
    raw_type: option
    description: Action to take if FortiNDR encounters a scan timeout.
    default: log-only
  fortisandbox-error-action:
    type: enum
    raw_type: option
    description: Action to take if FortiSandbox inline scan encounters an error.
    default: log-only
  fortisandbox-max-upload:
    type: integer
    raw_type: integer
    description: Maximum size of files that can be uploaded to FortiSandbox in Mbytes.
    default: '10'
    min: 1
    max: 1606
  fortisandbox-mode:
    type: enum
    raw_type: option
    description: FortiSandbox scan modes.
    default: analytics-everything
  fortisandbox-scan-timeout:
    type: integer
    raw_type: integer
    description: FortiSandbox inline scan timeout in seconds (30 - 180, default = 60).
    default: '60'
    min: 30
    max: 180
  fortisandbox-timeout-action:
    type: enum
    raw_type: option
    description: Action to take if FortiSandbox inline scan encounters a scan timeout.
    default: log-only
  mobile-malware-db:
    type: enum
    raw_type: option
    description: Enable/disable using the mobile malware signature database.
    default: enable
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 47
  outbreak-prevention-archive-scan:
    type: enum
    raw_type: option
    description: Enable/disable outbreak-prevention archive scanning.
    default: enable
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group customized for this profile.
    max_length: 35
  scan-mode:
    type: enum
    raw_type: option
    description: Configure scan mode (default or legacy).
    default: default
children:
  cifs:
    attributes:
      archive-block:
        type: enum
        raw_type: option
        description: Select the archive types to block.
      archive-log:
        type: enum
        raw_type: option
        description: Select the archive types to log.
      av-scan:
        type: enum
        raw_type: option
        description: Enable/disable AntiVirus scan service.
        default: disable
      emulator:
        type: enum
        raw_type: option
        description: Enable/disable the virus emulator.
        default: enable
      external-blocklist:
        type: enum
        raw_type: option
        description: Enable/disable external-blocklist. Analyzes files including the content of archives.
        default: disable
      fortindr:
        type: enum
        raw_type: option
        description: Enable/disable scanning of files by FortiNDR.
        default: disable
      fortisandbox:
        type: enum
        raw_type: option
        description: Enable/disable scanning of files by FortiSandbox.
        default: disable
      malware-stream:
        type: enum
        raw_type: option
        description: Enable/disable 0-day malware-stream scanning. Analyzes files including the content of archives.
        default: disable
      outbreak-prevention:
        type: enum
        raw_type: option
        description: Enable/disable virus outbreak prevention service.
        default: disable
      quarantine:
        type: enum
        raw_type: option
        description: Enable/disable quarantine for infected files.
        default: disable
  content-disarm:
    attributes:
      analytics-suspicious:
        type: enum
        raw_type: option
        description: Enable/disable using CDR as a secondary method for determining suspicous files for analytics.
        default: enable **
      cover-page:
        type: enum
        raw_type: option
        description: Enable/disable inserting a cover page into the disarmed document.
        default: enable
      detect-only:
        type: enum
        raw_type: option
        description: Enable/disable only detect disarmable files, do not alter content.
        default: disable
      error-action:
        type: enum
        raw_type: option
        description: Action to be taken if CDR engine encounters an unrecoverable error.
        default: log-only
      office-action:
        type: enum
        raw_type: option
        description: Enable/disable stripping of PowerPoint action events in Microsoft Office documents.
        default: enable
      office-dde:
        type: enum
        raw_type: option
        description: Enable/disable stripping of Dynamic Data Exchange events in Microsoft Office documents.
        default: enable
      office-embed:
        type: enum
        raw_type: option
        description: Enable/disable stripping of embedded objects in Microsoft Office documents.
        default: enable
      office-hylink:
        type: enum
        raw_type: option
        description: Enable/disable stripping of hyperlinks in Microsoft Office documents.
        default: enable
      office-linked:
        type: enum
        raw_type: option
        description: Enable/disable stripping of linked objects in Microsoft Office documents.
        default: enable
      office-macro:
        type: enum
        raw_type: option
        description: Enable/disable stripping of macros in Microsoft Office documents.
        default: enable
      original-file-destination:
