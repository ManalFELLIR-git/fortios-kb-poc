id: system.resource-limits
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/432515570/config-system-resource-limits
attributes:
  custom-service:
    type: integer
    raw_type: integer
    description: Maximum number of firewall custom services.
    min: 0
    max: 4294967295
  dialup-tunnel:
    type: integer
    raw_type: integer
    description: Maximum number of dial-up tunnels.
    min: 0
    max: 4294967295
  firewall-address:
    type: integer
    raw_type: integer
    description: Maximum number of firewall addresses (IPv4, IPv6, multicast).
    min: 0
    max: 4294967295
  firewall-addrgrp:
    type: integer
    raw_type: integer
    description: Maximum number of firewall address groups (IPv4, IPv6).
    min: 0
    max: 4294967295
  firewall-policy:
    type: integer
    raw_type: integer
    description: Maximum number of firewall policies (policy, DoS-policy4, DoS-policy6, multicast).
    min: 0
    max: 4294967295
  ipsec-phase1:
    type: integer
    raw_type: integer
    description: Maximum number of VPN IPsec phase1 tunnels.
    min: 0
    max: 4294967295
  ipsec-phase1-interface:
    type: integer
    raw_type: integer
    description: Maximum number of VPN IPsec phase1 interface tunnels.
    min: 0
    max: 4294967295
  ipsec-phase2:
    type: integer
    raw_type: integer
    description: Maximum number of VPN IPsec phase2 tunnels.
    min: 0
    max: 4294967295
  ipsec-phase2-interface:
    type: integer
    raw_type: integer
    description: Maximum number of VPN IPsec phase2 interface tunnels.
    min: 0
    max: 4294967295
  log-disk-quota:
    type: integer
    raw_type: integer
    description: Log disk quota in megabytes (MB).
    default: '0'
    min: 0
    max: 4294967295
  onetime-schedule:
    type: integer
    raw_type: integer
    description: Maximum number of firewall one-time schedules.
    min: 0
    max: 4294967295
  proxy:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent proxy users.
    min: 0
    max: 4294967295
  recurring-schedule:
    type: integer
    raw_type: integer
    description: Maximum number of firewall recurring schedules.
    min: 0
    max: 4294967295
  service-group:
    type: integer
    raw_type: integer
    description: Maximum number of firewall service groups.
    min: 0
    max: 4294967295
  session:
    type: integer
    raw_type: integer
    description: Maximum number of sessions.
    min: 0
    max: 4294967295
  sslvpn:
    type: integer
    raw_type: integer
    description: Maximum number of Agentless VPN.
    min: 0
    max: 4294967295
  user:
    type: integer
    raw_type: integer
    description: Maximum number of local users.
    min: 0
    max: 4294967295
  user-group:
    type: integer
    raw_type: integer
    description: Maximum number of user groups.
    min: 0
    max: 4294967295
children: {}
