id: user.external-identity-provider
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/423041802/config-user-external-identity-provider
attributes:
  group-attr-name:
    type: string
    raw_type: string
    description: Group attribute name in authentication query.
    default: id
    max_length: 63
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  name:
    type: string
    raw_type: string
    description: External identity provider name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: External identity provider service port number (0 to use default).
    default: '0'
    min: 0
    max: 65535
  server-identity-check:
    type: enum
    raw_type: option
    description: Enable/disable server's identity check against its certificate and subject alternative name(s).
    default: enable
  source-ip:
    type: string
    raw_type: string
    description: Use this IPv4/v6 address to connect to the external identity provider.
    max_length: 63
  timeout:
    type: integer
    raw_type: integer
    description: Connection timeout value in seconds (default=5).
    default: '5'
    min: 1
    max: 60
  type:
    type: enum
    raw_type: option
    description: External identity provider type.
  url:
    type: string
    raw_type: string
    description: External identity provider URL (e.g. "https://example.com:8080/api/v1"). Read-only.
    max_length: 127
  user-attr-name:
    type: string
    raw_type: string
    description: User attribute name in authentication query.
    default: userPrincipalName
    max_length: 63
  version:
    type: enum
    raw_type: option
    description: External identity API version.
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
