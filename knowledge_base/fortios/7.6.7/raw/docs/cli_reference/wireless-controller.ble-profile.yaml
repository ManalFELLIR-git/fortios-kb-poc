id: wireless-controller.ble-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/976997538/config-wireless-controller-ble-profile
attributes:
  advertising:
    type: enum
    raw_type: option
    description: Advertising type.
  beacon-interval:
    type: integer
    raw_type: integer
    description: Beacon interval (default = 100 msec).
    default: '100'
    min: 40
    max: 3500
  ble-scanning:
    type: enum
    raw_type: option
    description: Enable/disable Bluetooth Low Energy (BLE) scanning.
    default: disable
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  eddystone-instance:
    type: string
    raw_type: string
    description: Eddystone instance ID.
    default: abcdef
    max_length: 12
  eddystone-namespace:
    type: string
    raw_type: string
    description: Eddystone namespace ID.
    default: '0102030405'
    max_length: 20
  eddystone-url:
    type: string
    raw_type: string
    description: Eddystone URL.
    default: http://www.fortinet.com
    max_length: 127
  ibeacon-uuid:
    type: string
    raw_type: string
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 005ea414-cbd1-11e5-9956-625662870761
    max_length: 63
  major-id:
    type: integer
    raw_type: integer
    description: Major ID.
    default: '1000'
    min: 0
    max: 65535
  minor-id:
    type: integer
    raw_type: integer
    description: Minor ID.
    default: '2000'
    min: 0
    max: 65535
  name:
    type: string
    raw_type: string
    description: Bluetooth Low Energy profile name.
    max_length: 35
  scan-interval:
    type: integer
    raw_type: integer
    description: Scan Interval (default = 50 msec).
    default: '50'
    min: 10
    max: 1000
  scan-period:
    type: integer
    raw_type: integer
    description: Scan Period (default = 4000 msec).
    default: '4000'
    min: 1000
    max: 10000
  scan-threshold:
    type: string
    raw_type: string
    description: Minimum signal level/threshold in dBm required for the AP to report detected BLE device (-95 to -20, default
      = -90).
    default: '-90'
    max_length: 7
  scan-time:
    type: integer
    raw_type: integer
    description: Scan Time (default = 1000 msec).
    default: '1000'
    min: 1000
    max: 10000
  scan-type:
    type: enum
    raw_type: option
    description: Scan Type (default = active).
    default: active
  scan-window:
    type: integer
    raw_type: integer
    description: Scan Windows (default = 50 msec).
    default: '50'
    min: 10
    max: 1000
  txpower:
    type: enum
    raw_type: option
    description: Transmit power level (default = 0).
    default: '0'
children: {}
