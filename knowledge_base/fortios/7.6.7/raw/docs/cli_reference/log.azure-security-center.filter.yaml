id: log.azure-security-center.filter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/170272625/config-log-azure-security-center-filter
attributes:
  anomaly:
    type: enum
    raw_type: option
    description: Enable/disable anomaly logging.
    default: enable
  debug:
    type: enum
    raw_type: option
    description: Enable/disable debug logging.
    default: disable
  forti-switch:
    type: enum
    raw_type: option
    description: Enable/disable Forti-Switch logging.
    default: enable
  forward-traffic:
    type: enum
    raw_type: option
    description: Enable/disable forward traffic logging.
    default: enable
  gtp:
    type: enum
    raw_type: option
    description: Enable/disable GTP messages logging.
    default: enable
  http-transaction:
    type: enum
    raw_type: option
    description: Enable/disable log HTTP transaction messages.
    default: enable
  local-traffic:
    type: enum
    raw_type: option
    description: Enable/disable local in or out traffic logging.
    default: enable
  multicast-traffic:
    type: enum
    raw_type: option
    description: Enable/disable multicast traffic logging.
    default: enable
  severity:
    type: enum
    raw_type: option
    description: Lowest severity level to log.
    default: information
  sniffer-traffic:
    type: enum
    raw_type: option
    description: Enable/disable sniffer traffic logging.
    default: enable
  voip:
    type: enum
    raw_type: option
    description: Enable/disable VoIP logging.
    default: enable
  ztna-traffic:
    type: enum
    raw_type: option
    description: Enable/disable ztna traffic logging.
    default: enable
children:
  free-style:
    attributes:
      category:
        type: enum
        raw_type: option
        description: Log category.
        default: traffic
      filter:
        type: string
        raw_type: string
        description: Free style filter string.
        max_length: 1023
      filter-type:
        type: enum
        raw_type: option
        description: Include/exclude logs that match the filter.
        default: include
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
