id: system.bypass
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/417774001/config-system-bypass
attributes:
  auto-recover:
    type: enum
    raw_type: option
    description: Automatically recover from bypass mode after system reboot.
    default: enable
  bypass-timeout:
    type: enum
    raw_type: option
    description: timeout setting for bypass watchdog
    default: '10'
  bypass-watchdog:
    type: enum
    raw_type: option
    description: watchdog to bypass interfaces in case of software/hardware failure
    default: disable
  poweroff-bypass:
    type: enum
    raw_type: option
    description: set interface bypass state in power off
    default: disable
children: {}
