id: dpdk.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/302019978/config-dpdk-global
attributes:
  elasticbuffer:
    type: enum
    raw_type: option
    description: Enable/disable elasticbuffer support for all DPDK ports.
    default: disable
  frag-offload:
    type: enum
    raw_type: option
    description: Enable/disable DPDK fragmentation/defragmentation offloading (default = enable).
    default: enable
  hugepage-percentage:
    type: integer
    raw_type: integer
    description: Percentage of main memory allocated to hugepages, which are available for DPDK operation.
    default: '30'
    min: 15
    max: 50
  interface:
    type: string
    raw_type: string
    description: Physical interfaces that enable DPDK. Physical interface name.
    max_length: 31
  ipsec-offload:
    type: enum
    raw_type: option
    description: Enable/disable DPDK IPsec phase 2 offloading.
    default: disable
  multiqueue:
    type: enum
    raw_type: option
    description: Enable/disable multi-queue RX/TX support for all DPDK ports.
    default: disable
  per-session-accounting:
    type: enum
    raw_type: option
    description: Enable/disable per-session accounting.
    default: traffic-log-only
  protects:
    type: string
    raw_type: string
    description: Special arguments for device
    max_length: 2047
  session-table-percentage:
    type: integer
    raw_type: integer
    description: Percentage of main memory allocated to DPDK session table.
    default: '5'
    min: 0
    max: 60
  sleep-on-idle:
    type: enum
    raw_type: option
    description: Enable/disable sleep-on-idle support for all FDH engines.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable DPDK operation for the entire system.
    default: disable
children: {}
