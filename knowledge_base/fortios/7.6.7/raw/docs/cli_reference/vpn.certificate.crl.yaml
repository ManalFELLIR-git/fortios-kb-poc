id: vpn.certificate.crl
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/408996217/config-vpn-certificate-crl
attributes:
  crl:
    type: string
    raw_type: user
    description: Certificate Revocation List as a PEM file.
  http-url:
    type: string
    raw_type: string
    description: HTTP server URL for CRL auto-update.
    max_length: 255
  ldap-password:
    type: password
    raw_type: password
    description: LDAP server user password.
  ldap-server:
    type: string
    raw_type: string
    description: LDAP server name for CRL auto-update.
    max_length: 35
  ldap-username:
    type: string
    raw_type: string
    description: LDAP server user name.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  range:
    type: enum
    raw_type: option
    description: Either global or VDOM IP address range for the certificate.
    default: vdom
  scep-cert:
    type: string
    raw_type: string
    description: Local certificate for SCEP communication for CRL auto-update.
    default: Fortinet_CA_SSL
    max_length: 35
  scep-url:
    type: string
    raw_type: string
    description: SCEP server URL for CRL auto-update.
    max_length: 255
  source:
    type: enum
    raw_type: option
    description: Certificate source type.
    default: user
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address for communications to a HTTP or SCEP CA server.
    default: 0.0.0.0
  update-interval:
    type: integer
    raw_type: integer
    description: Time in seconds before the FortiGate checks for an updated CRL. Set to 0 to update only when it expires.
    default: '0'
    min: 0
    max: 4294967295
  update-vdom:
    type: string
    raw_type: string
    description: VDOM for CRL update.
    default: root
    max_length: 31
children: {}
