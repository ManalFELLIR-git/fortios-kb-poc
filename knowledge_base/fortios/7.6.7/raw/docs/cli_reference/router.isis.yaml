id: router.isis
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/164164570/config-router-isis
attributes:
  adjacency-check:
    type: enum
    raw_type: option
    description: Enable/disable adjacency check.
    default: disable
  adjacency-check6:
    type: enum
    raw_type: option
    description: Enable/disable IPv6 adjacency check.
    default: disable
  adv-passive-only:
    type: enum
    raw_type: option
    description: Enable/disable IS-IS advertisement of passive interfaces only.
    default: disable
  adv-passive-only6:
    type: enum
    raw_type: option
    description: Enable/disable IPv6 IS-IS advertisement of passive interfaces only.
    default: disable
  auth-keychain-l1:
    type: string
    raw_type: string
    description: Authentication key-chain for level 1 PDUs.
    max_length: 35
  auth-keychain-l2:
    type: string
    raw_type: string
    description: Authentication key-chain for level 2 PDUs.
    max_length: 35
  auth-mode-l1:
    type: enum
    raw_type: option
    description: Level 1 authentication mode.
    default: password
  auth-mode-l2:
    type: enum
    raw_type: option
    description: Level 2 authentication mode.
    default: password
  auth-password-l1:
    type: password
    raw_type: password
    description: Authentication password for level 1 PDUs.
  auth-password-l2:
    type: password
    raw_type: password
    description: Authentication password for level 2 PDUs.
  auth-sendonly-l1:
    type: enum
    raw_type: option
    description: Enable/disable level 1 authentication send-only.
    default: disable
  auth-sendonly-l2:
    type: enum
    raw_type: option
    description: Enable/disable level 2 authentication send-only.
    default: disable
  default-originate:
    type: enum
    raw_type: option
    description: Enable/disable distribution of default route information.
    default: disable
  default-originate6:
    type: enum
    raw_type: option
    description: Enable/disable distribution of default IPv6 route information.
    default: disable
  dynamic-hostname:
    type: enum
    raw_type: option
    description: Enable/disable dynamic hostname.
    default: disable
  ignore-lsp-errors:
    type: enum
    raw_type: option
    description: Enable/disable ignoring of LSP errors with bad checksums.
    default: disable
  is-type:
    type: enum
    raw_type: option
    description: IS type.
    default: level-1-2
  lsp-gen-interval-l1:
    type: integer
    raw_type: integer
    description: Minimum interval for level 1 LSP regenerating.
    default: '30'
    min: 1
    max: 120
  lsp-gen-interval-l2:
    type: integer
    raw_type: integer
    description: Minimum interval for level 2 LSP regenerating.
    default: '30'
    min: 1
    max: 120
  lsp-refresh-interval:
    type: integer
    raw_type: integer
    description: LSP refresh time in seconds.
    default: '900'
    min: 1
    max: 65535
  max-lsp-lifetime:
    type: integer
    raw_type: integer
    description: Maximum LSP lifetime in seconds.
    default: '1200'
    min: 350
    max: 65535
  metric-style:
    type: enum
    raw_type: option
    description: Use old-style (ISO 10589) or new-style packet formats.
    default: narrow
  overload-bit:
    type: enum
    raw_type: option
    description: Enable/disable signal other routers not to use us in SPF.
    default: disable
  overload-bit-on-startup:
    type: integer
    raw_type: integer
    description: Overload-bit only temporarily after reboot.
    default: '0'
    min: 5
    max: 86400
  overload-bit-suppress:
    type: enum
    raw_type: option
    description: Suppress overload-bit for the specific prefixes.
  redistribute-l1:
    type: enum
    raw_type: option
    description: Enable/disable redistribution of level 1 routes into level 2.
    default: disable
  redistribute-l1-list:
    type: string
    raw_type: string
    description: Access-list for route redistribution from l1 to l2.
    max_length: 35
  redistribute-l2:
    type: enum
    raw_type: option
    description: Enable/disable redistribution of level 2 routes into level 1.
    default: disable
  redistribute-l2-list:
    type: string
    raw_type: string
    description: Access-list for route redistribution from l2 to l1.
    max_length: 35
  redistribute6-l1:
    type: enum
    raw_type: option
    description: Enable/disable redistribution of level 1 IPv6 routes into level 2.
    default: disable
  redistribute6-l1-list:
    type: string
    raw_type: string
    description: Access-list for IPv6 route redistribution from l1 to l2.
    max_length: 35
  redistribute6-l2:
    type: enum
    raw_type: option
    description: Enable/disable redistribution of level 2 IPv6 routes into level 1.
    default: disable
  redistribute6-l2-list:
    type: string
    raw_type: string
    description: Access-list for IPv6 route redistribution from l2 to l1.
    max_length: 35
  spf-interval-exp-l1:
    type: string
    raw_type: user
    description: Level 1 SPF calculation delay.
  spf-interval-exp-l2:
    type: string
    raw_type: user
    description: Level 2 SPF calculation delay.
children:
  isis-interface:
    attributes:
      auth-keychain-l1:
        type: string
        raw_type: string
        description: Authentication key-chain for level 1 PDUs.
        max_length: 35
      auth-keychain-l2:
        type: string
        raw_type: string
        description: Authentication key-chain for level 2 PDUs.
        max_length: 35
      auth-mode-l1:
        type: enum
        raw_type: option
        description: Level 1 authentication mode.
        default: password
      auth-mode-l2:
        type: enum
        raw_type: option
        description: Level 2 authentication mode.
        default: password
      auth-password-l1:
        type: password
        raw_type: password
        description: Authentication password for level 1 PDUs.
      auth-password-l2:
        type: password
        raw_type: password
        description: Authentication password for level 2 PDUs.
      auth-send-only-l1:
        type: enum
        raw_type: option
        description: Enable/disable authentication send-only for level 1 PDUs.
        default: disable
      auth-send-only-l2:
        type: enum
        raw_type: option
        description: Enable/disable authentication send-only for level 2 PDUs.
        default: disable
      circuit-type:
        type: enum
        raw_type: option
        description: IS-IS interface's circuit type.
        default: level-1-2
      csnp-interval-l1:
        type: integer
        raw_type: integer
        description: Level 1 CSNP interval.
        default: '10'
        min: 1
        max: 65535
      csnp-interval-l2:
        type: integer
        raw_type: integer
        description: Level 2 CSNP interval.
        default: '10'
        min: 1
        max: 65535
      hello-interval-l1:
        type: integer
        raw_type: integer
        description: Level 1 hello interval.
        default: '10'
        min: 0
        max: 65535
      hello-interval-l2:
        type: integer
        raw_type: integer
        description: Level 2 hello interval.
        default: '10'
        min: 0
        max: 65535
      hello-multiplier-l1:
        type: integer
        raw_type: integer
        description: Level 1 multiplier for Hello holding time.
        default: '3'
        min: 2
        max: 100
      hello-multiplier-l2:
        type: integer
        raw_type: integer
        description: Level 2 multiplier for Hello holding time.
        default: '3'
        min: 2
        max: 100
      hello-padding:
        type: enum
        raw_type: option
        description: Enable/disable padding to IS-IS hello packets.
        default: enable
      lsp-interval:
        type: integer
        raw_type: integer
        description: LSP transmission interval (milliseconds).
        default: '33'
        min: 1
        max: 4294967295
      lsp-retransmit-interval:
        type: integer
        raw_type: integer
        description: LSP retransmission interval (sec).
        default: '5'
        min: 1
        max: 65535
      mesh-group:
        type: enum
        raw_type: option
        description: Enable/disable IS-IS mesh group.
        default: disable
      mesh-group-id:
        type: integer
        raw_type: integer
        description: 'Mesh group ID <0-4294967295>, 0: mesh-group blocked.'
        default: '0'
        min: 0
        max: 4294967295
      metric-l1:
        type: integer
        raw_type: integer
        description: Level 1 metric for interface.
        default: '10'
        min: 1
        max: 63
      metric-l2:
        type: integer
        raw_type: integer
        description: Level 2 metric for interface.
        default: '10'
        min: 1
        max: 63
      name:
        type: string
        raw_type: string
        description: IS-IS interface name.
        max_length: 15
      network-type:
        type: enum
        raw_type: option
        description: IS-IS interface's network type.
      priority-l1:
        type: integer
        raw_type: integer
        description: Level 1 priority.
        default: '64'
        min: 0
        max: 127
      priority-l2:
        type: integer
        raw_type: integer
        description: Level 2 priority.
        default: '64'
        min: 0
        max: 127
      status:
        type: enum
        raw_type: option
        description: Enable/disable interface for IS-IS.
        default: disable
      status6:
        type: enum
        raw_type: option
        description: Enable/disable IPv6 interface for IS-IS.
        default: disable
      wide-metric-l1:
        type: integer
        raw_type: integer
        description: Level 1 wide metric for interface.
        default: '10'
        min: 1
        max: 16777214
      wide-metric-l2:
        type: integer
        raw_type: integer
        description: Level 2 wide metric for interface.
        default: '10'
        min: 1
        max: 16777214
  isis-net:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ISIS network ID.
        default: '0'
        min: 0
        max: 4294967295
      net:
        type: string
        raw_type: user
        description: IS-IS networks (format = xx.xxxx. .xxxx.xx.).
  redistribute:
    attributes:
      level:
        type: enum
        raw_type: option
        description: Level.
        default: level-2
      metric:
        type: integer
        raw_type: integer
        description: Metric.
        default: '0'
        min: 0
        max: 4261412864
      metric-type:
        type: enum
        raw_type: option
        description: Metric type.
        default: internal
      protocol:
        type: string
        raw_type: string
        description: Protocol name.
        max_length: 35
      routemap:
        type: string
        raw_type: string
        description: Route map name.
        max_length: 35
      status:
        type: enum
        raw_type: option
        description: Status.
        default: disable
  redistribute6:
    attributes:
      level:
        type: enum
        raw_type: option
        description: Level.
        default: level-2
      metric:
        type: integer
        raw_type: integer
        description: Metric.
        default: '0'
        min: 0
        max: 4261412864
      metric-type:
        type: enum
        raw_type: option
        description: Metric type.
        default: internal
      protocol:
        type: string
        raw_type: string
        description: Protocol name.
        max_length: 35
      routemap:
        type: string
        raw_type: string
        description: Route map name.
        max_length: 35
      status:
        type: enum
        raw_type: option
        description: Enable/disable redistribution.
        default: disable
  summary-address:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Summary address entry ID.
        default: '0'
        min: 0
        max: 4294967295
      level:
        type: enum
        raw_type: option
        description: Level.
        default: level-2
      prefix:
        type: ipv4-classnet-any
        raw_type: ipv4-classnet-any
        description: Prefix.
        default: 0.0.0.0 0.0.0.0
  summary-address6:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Prefix entry ID.
        default: '0'
        min: 0
        max: 4294967295
      level:
        type: enum
        raw_type: option
        description: Level.
        default: level-2
      prefix6:
        type: ipv6-prefix
        raw_type: ipv6-prefix
        description: IPv6 prefix.
        default: ::/0
