id: telemetry-controller.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/235556723/config-telemetry-controller-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Name of the profile.
    max_length: 35
children:
  application:
    attributes:
      app-name:
        type: string
        raw_type: string
        description: Application name.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      interval:
        type: integer
        raw_type: integer
        description: Time in milliseconds to check the application (1000 - 86,400 * 1000, default = 300 * 1000 ms).
        default: '300000'
        min: 1000
        max: 86400000
      monitor:
        type: enum
        raw_type: option
        description: Enable/disable monitoring of the application.
        default: enable
  sla:
    attributes:
      app-throughput-threshold:
        type: integer
        raw_type: integer
        description: Threshold of application throughput in megabytes (0 - 10,000, default = 2 MB).
        default: '2'
        min: 0
        max: 10000
      atdt-threshold:
        type: integer
        raw_type: integer
        description: Threshold of application total downloading time in milliseconds (0 - 10,000,000, default = 3,000 ms).
        default: '3000'
        min: 0
        max: 10000000
      dns-time-threshold:
        type: integer
        raw_type: integer
        description: Threshold of 95th percentile of DNS resolution time in milliseconds (0 - 10,000,000, default = 100 ms).
        default: '100'
        min: 0
        max: 10000000
      experience-score-threshold:
        type: integer
        raw_type: integer
        description: Threshold of experience score (0 - 10, default = 6).
        default: '6'
        min: 0
        max: 10
      failure-rate-threshold:
        type: integer
        raw_type: integer
        description: Threshold of failure rate (0 - 100, default = 5 percentage).
        default: '5'
        min: 0
        max: 100
      jitter-threshold:
        type: integer
        raw_type: integer
        description: Threshold of jitter in milliseconds (0 - 10,000,000, default = 50 ms).
        default: '50'
        min: 0
        max: 10000000
      latency-threshold:
        type: integer
        raw_type: integer
        description: Threshold of latency in milliseconds (0 - 10,000,000, default = 100 ms).
        default: '100'
        min: 0
        max: 10000000
      packet-loss-threshold:
        type: integer
        raw_type: integer
        description: Threshold of packet loss (0 - 100, default = 5 percentage).
        default: '5'
        min: 0
        max: 100
      sla-factor:
        type: enum
        raw_type: option
        description: Criteria on which metric to SLA threshold list.
      tcp-rtt-threshold:
        type: integer
        raw_type: integer
        description: Threshold of TCP round-trip time in milliseconds (0 - 10,000,000, default = 100 ms).
        default: '100'
        min: 0
        max: 10000000
      tls-time-threshold:
        type: integer
        raw_type: integer
        description: Threshold of 95th percentile of TLS handshake time in milliseconds (0 - 10,000,000, default = 200 ms).
        default: '200'
        min: 0
        max: 10000000
      ttfb-threshold:
        type: integer
        raw_type: integer
        description: Threshold of time to first byte in milliseconds (0 - 10,000,000, default = 200 ms).
        default: '200'
        min: 0
        max: 10000000
