id: user.krb-keytab
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/198099072/config-user-krb-keytab
attributes:
  keytab:
    type: string
    raw_type: user
    description: Base64 coded keytab file containing a pre-shared key.
  ldap-server:
    type: string
    raw_type: string
    description: LDAP server name(s). LDAP server name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Kerberos keytab entry name.
    max_length: 35
  pac-data:
    type: enum
    raw_type: option
    description: Enable/disable parsing PAC data in the ticket.
    default: enable
  principal:
    type: string
    raw_type: string
    description: Kerberos service principal. For example, HTTP/myfgt.example.com@example.com.
    max_length: 511
children: {}
