id: wireless-controller.hotspot20.hs-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/267746033/config-wireless-controller-hotspot20-hs-profile
attributes:
  3gpp-plmn:
    type: string
    raw_type: string
    description: 3GPP PLMN name.
    max_length: 35
  access-network-asra:
    type: enum
    raw_type: option
    description: Enable/disable additional step required for access (ASRA).
    default: disable
  access-network-esr:
    type: enum
    raw_type: option
    description: Enable/disable emergency services reachable (ESR).
    default: disable
  access-network-internet:
    type: enum
    raw_type: option
    description: Enable/disable connectivity to the Internet.
    default: disable
  access-network-type:
    type: enum
    raw_type: option
    description: Access network type.
    default: private-network
  access-network-uesa:
    type: enum
    raw_type: option
    description: Enable/disable unauthenticated emergency service accessible (UESA).
    default: disable
  advice-of-charge:
    type: string
    raw_type: string
    description: Advice of charge.
    max_length: 35
  anqp-domain-id:
    type: integer
    raw_type: integer
    description: ANQP Domain ID (0-65535).
    default: '0'
    min: 0
    max: 65535
  bss-transition:
    type: enum
    raw_type: option
    description: Enable/disable basic service set (BSS) transition Support.
    default: disable
  conn-cap:
    type: string
    raw_type: string
    description: Connection capability name.
    max_length: 35
  deauth-request-timeout:
    type: integer
    raw_type: integer
    description: Deauthentication request timeout (in seconds).
    default: '60'
    min: 30
    max: 120
  dgaf:
    type: enum
    raw_type: option
    description: Enable/disable downstream group-addressed forwarding (DGAF).
    default: disable
  domain-name:
    type: string
    raw_type: string
    description: Domain name.
    max_length: 255
  gas-comeback-delay:
    type: integer
    raw_type: integer
    description: GAS comeback delay (0 or 100 - 10000 milliseconds, default = 500).
    default: '500'
    min: 100
    max: 10000
  gas-fragmentation-limit:
    type: integer
    raw_type: integer
    description: GAS fragmentation limit (512 - 4096, default = 1024).
    default: '1024'
    min: 512
    max: 4096
  hessid:
    type: mac-address
    raw_type: mac-address
    description: Homogeneous extended service set identifier (HESSID).
    default: 00:00:00:00:00:00
  ip-addr-type:
    type: string
    raw_type: string
    description: IP address type name.
    max_length: 35
  l2tif:
    type: enum
    raw_type: option
    description: Enable/disable Layer 2 traffic inspection and filtering.
    default: disable
  nai-realm:
    type: string
    raw_type: string
    description: NAI realm list name.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Hotspot profile name.
    max_length: 35
  network-auth:
    type: string
    raw_type: string
    description: Network authentication name.
    max_length: 35
  oper-friendly-name:
    type: string
    raw_type: string
    description: Operator friendly name.
    max_length: 35
  oper-icon:
    type: string
    raw_type: string
    description: Operator icon.
    max_length: 35
  osu-provider:
    type: string
    raw_type: string
    description: Manually selected list of OSU provider(s). OSU provider name.
    max_length: 35
  osu-provider-nai:
    type: string
    raw_type: string
    description: OSU Provider NAI.
    max_length: 35
  osu-ssid:
    type: string
    raw_type: string
    description: Online sign up (OSU) SSID.
    max_length: 255
  pame-bi:
    type: enum
    raw_type: option
    description: Enable/disable Pre-Association Message Exchange BSSID Independent (PAME-BI).
    default: enable
  proxy-arp:
    type: enum
    raw_type: option
    description: Enable/disable Proxy ARP.
    default: enable
  qos-map:
    type: string
    raw_type: string
    description: QoS MAP set ID.
    max_length: 35
  release:
    type: integer
    raw_type: integer
    description: Hotspot 2.0 Release number (1, 2, 3, default = 2).
    default: '2'
    min: 1
    max: 3
  roaming-consortium:
    type: string
    raw_type: string
    description: Roaming consortium list name.
    max_length: 35
  terms-and-conditions:
    type: string
    raw_type: string
    description: Terms and conditions.
    max_length: 35
  venue-group:
    type: enum
    raw_type: option
    description: Venue group.
    default: unspecified
  venue-name:
    type: string
    raw_type: string
    description: Venue name.
    max_length: 35
  venue-type:
    type: enum
    raw_type: option
    description: Venue type.
    default: unspecified
  venue-url:
    type: string
    raw_type: string
    description: Venue name.
    max_length: 35
  wan-metrics:
    type: string
    raw_type: string
    description: WAN metric name.
    max_length: 35
  wba-charging-currency:
    type: string
    raw_type: string
    description: Three letter currency code.
    max_length: 3
  wba-charging-rate:
    type: integer
    raw_type: integer
    description: Number of currency units per kilobyte.
    default: '0'
    min: 0
    max: 4294967295
  wba-data-clearing-provider:
    type: string
    raw_type: string
    description: WBA ID of data clearing provider.
    max_length: 127
  wba-financial-clearing-provider:
    type: string
    raw_type: string
    description: WBA ID of financial clearing provider.
    max_length: 127
  wba-open-roaming:
    type: enum
    raw_type: option
    description: Enable/disable WBA open roaming support.
    default: disable
  wnm-sleep-mode:
    type: enum
    raw_type: option
    description: Enable/disable wireless network management (WNM) sleep mode.
    default: disable
children: {}
