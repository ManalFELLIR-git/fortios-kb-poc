id: system.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/339914554/config-system-global
attributes:
  admin-ble-button:
    type: enum
    raw_type: option
    description: press the BLE button can enable BLE function
    default: enable
  admin-concurrent:
    type: enum
    raw_type: option
    description: Enable/disable concurrent administrator logins. Use policy-auth-concurrent for firewall authenticated users.
    default: enable
  admin-console-timeout:
    type: integer
    raw_type: integer
    description: Console login timeout that overrides the admin timeout value (15 - 300 seconds, default = 0, which disables
      the timeout).
    default: '0'
    min: 15
    max: 300
  admin-forticloud-sso-default-profile:
    type: string
    raw_type: string
    description: Override access profile.
    max_length: 35
  admin-forticloud-sso-login:
    type: enum
    raw_type: option
    description: Enable/disable FortiCloud admin login via SSO.
    default: disable
  admin-host:
    type: string
    raw_type: string
    description: Administrative host for HTTP and HTTPS. When set, will be used in lieu of the client's Host header for any
      redirection.
    max_length: 255
  admin-hsts-max-age:
    type: integer
    raw_type: integer
    description: HTTPS Strict-Transport-Security header max-age in seconds. A value of 0 will reset any HSTS records in the
      browser.When admin-https-redirect is disabled the header max-age will be 0.
    default: '63072000'
    min: 0
    max: 2147483647
  admin-http-json-request-limit:
    type: integer
    raw_type: integer
    description: HTTP JSON request body size limit in bytes (0 will disable the limit).
    default: '33554432'
    min: 33554432
    max: 268435456
  admin-http-login-request-size-limit:
    type: integer
    raw_type: integer
    description: HTTP login request body size limit in bytes.
    default: '4096'
    min: 1024
    max: 32768
  admin-http-rate-limit-exempt-auth:
    type: enum
    raw_type: option
    description: Enable/disable exemption of authenticated administrator sessions from rate limiting.
    default: disable
  admin-http-rate-limit-max-requests:
    type: integer
    raw_type: integer
    description: Maximum number of HTTP requests that are allowed to be made in a second by a single client (0 will disable
      rate limiting).
    default: '100'
    min: 50
    max: 1000
  admin-http-request-body-timeout:
    type: integer
    raw_type: integer
    description: Authenticated HTTP request body timeout, in milliseconds (0 will disable the timeout).
    default: '1800000'
    min: 100
    max: 3600000
  admin-http-request-header-timeout:
    type: integer
    raw_type: integer
    description: HTTP request header timeout, in milliseconds (0 will disable the timeout).
    default: '10000'
    min: 100
    max: 60000
  admin-http-unauthenticated-request-body-timeout:
    type: integer
    raw_type: integer
    description: Unauthenticated HTTP request body timeout, in milliseconds, before authentication (0 will disable the timeout).
    default: '1000'
    min: 100
    max: 600000
  admin-https-pki-required:
    type: enum
    raw_type: option
    description: Enable/disable admin login method. Enable to force administrators to provide a valid certificate to log in
      if PKI is enabled. Disable to allow administrators to log in with a certificate or password.
    default: disable
  admin-https-redirect:
    type: enum
    raw_type: option
    description: Enable/disable redirection of HTTP administration access to HTTPS.
    default: enable
  admin-https-ssl-banned-ciphers:
    type: enum
    raw_type: option
    description: Select one or more cipher technologies that cannot be used in GUI HTTPS negotiations. Only applies to TLS
      1.2 and below.
  admin-https-ssl-ciphersuites:
    type: enum
    raw_type: option
    description: Select one or more TLS 1.3 ciphersuites to enable. Does not affect ciphers in TLS 1.2 and below. At least
      one must be enabled. To disable all, remove TLS1.3 from admin-https-ssl-versions.
    default: TLS-AES-128-GCM-SHA256 TLS-AES-256-GCM-SHA384 TLS-CHACHA20-POLY1305-SHA256
  admin-https-ssl-versions:
    type: enum
    raw_type: option
    description: Allowed TLS versions for web administration.
    default: tlsv1-2 tlsv1-3
  admin-lockout-duration:
    type: integer
    raw_type: integer
    description: Amount of time in seconds that an administrator account is locked out after reaching the admin-lockout-threshold
      for repeated failed login attempts.
    default: '60'
    min: 1
    max: 2147483647
  admin-lockout-threshold:
    type: integer
    raw_type: integer
    description: Number of failed login attempts before an administrator account is locked out for the admin-lockout-duration.
    default: '3'
    min: 1
    max: 10
  admin-login-max:
    type: integer
    raw_type: integer
    description: Maximum number of administrators who can be logged in at the same time (1 - 100, default = 100).
    default: '100'
    min: 1
    max: 100
  admin-port:
    type: integer
    raw_type: integer
    description: Administrative access port for HTTP. (1 - 65535, default = 80).
    default: '80'
    min: 1
    max: 65535
  admin-reset-button:
    type: enum
    raw_type: option
    description: Press the reset button can reset to factory default.
    default: enable
  admin-restrict-local:
    type: enum
    raw_type: option
    description: Enable/disable local admin authentication restriction when remote authenticator is up and running (default
      = disable).
    default: disable
  admin-scp:
    type: enum
    raw_type: option
    description: Enable/disable SCP support for system configuration backup, restore, and firmware file upload.
    default: disable
  admin-server-cert:
    type: string
    raw_type: string
    description: Server certificate that the FortiGate uses for HTTPS administrative connections.
    default: Fortinet_GUI_Server
    max_length: 35
  admin-sport:
    type: integer
    raw_type: integer
    description: Administrative access port for HTTPS. (1 - 65535, default = 443).
    default: '443'
    min: 1
    max: 65535
  admin-ssh-grace-time:
    type: integer
    raw_type: integer
    description: Maximum time in seconds permitted between making an SSH connection to the FortiGate unit and authenticating
      (10 - 3600 sec (1 hour), default 120).
    default: '120'
    min: 10
    max: 3600
  admin-ssh-password:
    type: enum
    raw_type: option
    description: Enable/disable password authentication for SSH admin access.
    default: enable
  admin-ssh-port:
    type: integer
    raw_type: integer
    description: Administrative access port for SSH. (1 - 65535, default = 22).
    default: '22'
    min: 1
    max: 65535
  admin-ssh-v1:
    type: enum
    raw_type: option
    description: Enable/disable SSH v1 compatibility.
    default: disable
  admin-telnet:
    type: enum
    raw_type: option
    description: Enable/disable TELNET service.
    default: enable
  admin-telnet-port:
    type: integer
    raw_type: integer
    description: Administrative access port for TELNET. (1 - 65535, default = 23).
    default: '23'
    min: 1
    max: 65535
  admintimeout:
    type: integer
    raw_type: integer
    description: Number of minutes before an idle administrator session times out (1 - 480 minutes (8 hours), default = 5).
      A shorter idle timeout is more secure.
    default: '5'
    min: 1
    max: 480
  airplane-mode:
    type: enum
    raw_type: option
    description: Enable/disable airplane mode.
    default: disable
  alias:
    type: string
    raw_type: string
    description: Alias for your FortiGate unit.
    max_length: 35
  allow-traffic-redirect:
    type: enum
    raw_type: option
    description: Disable to prevent traffic with same local ingress and egress interface from being forwarded without policy
      check.
    default: disable
  anti-replay:
    type: enum
    raw_type: option
    description: Level of checking for packet replay and TCP sequence checking.
    default: strict
  application-bandwidth-tracking:
    type: enum
    raw_type: option
    description: Enable/disable application bandwidth tracking.
    default: disable
  arp-max-entry:
    type: integer
    raw_type: integer
    description: Maximum number of dynamically learned MAC addresses that can be added to the ARP table (131072 - 2147483647,
      default = 131072).
    default: '131072'
    min: 131072
    max: 2147483647
  auth-cert:
    type: string
    raw_type: string
    description: Server certificate that the FortiGate uses for HTTPS firewall authentication connections.
    default: Fortinet_Factory **
    max_length: 35
  auth-http-port:
    type: integer
    raw_type: integer
    description: User authentication HTTP port. (1 - 65535, default = 1000).
    default: '1000'
    min: 1
    max: 65535
  auth-https-port:
    type: integer
    raw_type: integer
    description: User authentication HTTPS port. (1 - 65535, default = 1003).
    default: '1003'
    min: 1
    max: 65535
  auth-ike-saml-port:
    type: integer
    raw_type: integer
    description: User IKE SAML authentication port (0 - 65535, default = 1001).
    default: '1001'
    min: 0
    max: 65535
  auth-keepalive:
    type: enum
    raw_type: option
    description: Enable to prevent user authentication sessions from timing out when idle.
    default: disable
  auth-session-auto-backup:
    type: enum
    raw_type: option
    description: Enable/disable automatic and periodic backup of authentication sessions (default = disable). Sessions are
      restored upon bootup.
    default: disable
  auth-session-auto-backup-interval:
    type: enum
    raw_type: option
    description: Configure automatic authentication session backup interval (default = 15min).
    default: 15min
  auth-session-limit:
    type: enum
    raw_type: option
    description: Action to take when the number of allowed user authenticated sessions is reached.
    default: block-new
  auto-auth-extension-device:
    type: enum
    raw_type: option
    description: Enable/disable automatic authorization of dedicated Fortinet extension devices.
    default: enable
  autorun-log-fsck:
    type: enum
    raw_type: option
    description: Enable/disable automatic log partition check after ungraceful shutdown.
    default: disable
  av-affinity:
    type: string
    raw_type: string
    description: Affinity setting for AV scanning (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '0'
    max_length: 79
  av-failopen:
    type: enum
    raw_type: option
    description: Set the action to take if the FortiGate is running low on memory or the proxy connection limit has been reached.
    default: pass
  av-failopen-session:
    type: enum
    raw_type: option
    description: When enabled and a proxy for a protocol runs out of room in its session table, that protocol goes into failopen
      mode and enacts the action specified by av-failopen.
    default: disable
  batch-cmdb:
    type: enum
    raw_type: option
    description: Enable/disable batch mode, allowing you to enter a series of CLI commands that will execute as a group once
      they are loaded.
    default: enable
  bfd-affinity:
    type: string
    raw_type: string
    description: Affinity setting for BFD daemon (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '1'
    max_length: 79
  block-session-timer:
    type: integer
    raw_type: integer
    description: Duration in seconds for blocked sessions (1 - 300 sec (5 minutes), default = 30).
    default: '30'
    min: 1
    max: 300
  br-fdb-max-entry:
    type: integer
    raw_type: integer
    description: Maximum number of bridge forwarding database (FDB) entries.
    default: '8192'
    min: 8192
    max: 2147483647
  cert-chain-max:
    type: integer
    raw_type: integer
    description: Maximum number of certificates that can be traversed in a certificate chain.
    default: '8'
    min: 1
    max: 2147483647
  cfg-revert-timeout:
    type: integer
    raw_type: integer
    description: Time-out for reverting to the last saved configuration. (10 - 4294967295 seconds, default = 600).
    default: '600'
    min: 10
    max: 4294967295
  cfg-save:
    type: enum
    raw_type: option
    description: Configuration file save mode for CLI changes.
    default: automatic
  check-protocol-header:
    type: enum
    raw_type: option
    description: Level of checking performed on protocol headers. Strict checking is more thorough but may affect performance.
      Loose checking is OK in most cases.
    default: loose
  check-reset-range:
    type: enum
    raw_type: option
    description: Configure ICMP error message verification. You can either apply strict RST range checking or disable it.
    default: disable
  cli-audit-log:
    type: enum
    raw_type: option
    description: Enable/disable CLI audit log.
    default: disable
  cloud-communication:
    type: enum
    raw_type: option
    description: Enable/disable all cloud communication.
    default: enable
  clt-cert-req:
    type: enum
    raw_type: option
    description: Enable/disable requiring administrators to have a client certificate to log into the GUI using HTTPS.
    default: disable
  cmdbsvr-affinity:
    type: string
    raw_type: string
    description: Affinity setting for cmdbsvr (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '1'
    max_length: 79
  cpu-use-threshold:
    type: integer
    raw_type: integer
    description: Threshold at which CPU usage is reported (% of total CPU, default = 90).
    default: '90'
    min: 50
    max: 99
  csr-ca-attribute:
    type: enum
    raw_type: option
    description: Enable/disable the CA attribute in certificates. Some CA servers reject CSRs that have the CA attribute.
    default: enable
  daily-restart:
    type: enum
    raw_type: option
    description: Enable/disable daily restart of FortiGate unit. Use the restart-time option to set the time of day for the
      restart.
    default: disable
  default-service-source-port:
    type: string
    raw_type: user
    description: Default service source port range (default = 1 - 65535).
  delay-tcp-npu-session:
    type: enum
    raw_type: option
    description: Enable TCP NPU session delay to guarantee packet order of 3-way handshake.
    default: disable
  device-idle-timeout:
    type: integer
    raw_type: integer
    description: Time in seconds that a device must be idle to automatically log the device user out. (30 - 31536000 sec (30
      sec to 1 year), default = 300).
    default: '300'
    min: 30
    max: 31536000
  dh-params:
    type: enum
    raw_type: option
    description: Number of bits to use in the Diffie-Hellman exchange for HTTPS/SSH protocols.
    default: '2048'
  dhcp-lease-backup-interval:
    type: integer
    raw_type: integer
    description: DHCP leases backup interval in seconds (10 - 3600, default = 60).
    default: '60'
    min: 10
    max: 3600
  dnsproxy-worker-count:
    type: integer
    raw_type: integer
    description: DNS proxy worker count. For a FortiGate with multiple logical CPUs, you can set the DNS process number from
      1 to the number of logical CPUs.
    default: '1'
    min: 1
    max: 8
  early-tcp-npu-session:
    type: enum
    raw_type: option
    description: Enable/disable early TCP NPU session.
    default: disable
  edit-vdom-prompt:
    type: enum
    raw_type: option
    description: Enable/disable edit new VDOM prompt.
    default: disable
  extender-controller-reserved-network:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: Configure reserved network subnet for managed LAN extension FortiExtender units. This is available when the
      FortiExtender daemon is running.
    default: 10.252.0.1 255.255.0.0
  failtime:
    type: integer
    raw_type: integer
    description: Fail-time for server lost.
    default: '5'
    min: 0
    max: 4294967295
  faz-disk-buffer-size:
    type: integer
    raw_type: integer
    description: Maximum disk buffer size to temporarily store logs destined for FortiAnalyzer. To be used in the event that
      FortiAnalyzer is unavailable.
    default: '0'
  fds-statistics:
    type: enum
    raw_type: option
    description: Enable/disable sending IPS, Application Control, and AntiVirus data to FortiGuard. This data is used to improve
      FortiGuard services and is not shared with external parties and is protected by Fortinet's privacy policy.
    default: enable
  fds-statistics-period:
    type: integer
    raw_type: integer
    description: FortiGuard statistics collection period in minutes. (1 - 1440 min (1 min to 24 hours), default = 60).
    default: '60'
    min: 1
    max: 1440
  fgd-alert-subscription:
    type: enum
    raw_type: option
    description: Type of alert to retrieve from FortiGuard.
  forticontroller-proxy:
    type: enum
    raw_type: option
    description: Enable/disable FortiController proxy.
    default: enable
  forticontroller-proxy-port:
    type: integer
    raw_type: integer
    description: FortiController proxy port (1024 - 49150).
    default: '11133'
    min: 1024
    max: 49150
  forticonverter-config-upload:
    type: enum
    raw_type: option
    description: Enable/disable config upload to FortiConverter.
    default: disable
  forticonverter-integration:
    type: enum
    raw_type: option
    description: Enable/disable FortiConverter integration service.
    default: disable
  fortiextender:
    type: enum
    raw_type: option
    description: Enable/disable FortiExtender.
    default: disable **
  fortiextender-data-port:
    type: integer
    raw_type: integer
    description: FortiExtender data port (1024 - 49150, default = 25246).
    default: '25246'
    min: 1024
    max: 49150
  fortiextender-discovery-lockdown:
    type: enum
    raw_type: option
    description: Enable/disable FortiExtender CAPWAP lockdown.
    default: disable
  fortiextender-provision-on-authorization:
    type: enum
    raw_type: option
    description: Enable/disable automatic provisioning of latest FortiExtender firmware on authorization.
    default: disable
  fortiextender-vlan-mode:
    type: enum
    raw_type: option
    description: Enable/disable FortiExtender VLAN mode.
    default: disable
  fortigslb-integration:
    type: enum
    raw_type: option
    description: Enable/disable integration with the FortiGSLB cloud service.
    default: disable
  fortiservice-port:
    type: integer
    raw_type: integer
    description: FortiService port (1 - 65535, default = 8013). Used by FortiClient endpoint compliance. Older versions of
      FortiClient used a different port.
    default: '8013'
    min: 1
    max: 65535
  fortitoken-cloud:
    type: enum
    raw_type: option
    description: Enable/disable FortiToken Cloud service.
    default: enable
  fortitoken-cloud-push-status:
    type: enum
    raw_type: option
    description: Enable/disable FTM push service of FortiToken Cloud.
    default: enable
  fortitoken-cloud-region:
    type: string
    raw_type: string
    description: Region domain of FortiToken Cloud(unset to non-region).
    max_length: 63
  fortitoken-cloud-sync-interval:
    type: integer
    raw_type: integer
    description: Interval in which to clean up remote users in FortiToken Cloud (0 - 336 hours (14 days), default = 24, disable
      = 0).
    default: '24'
    min: 0
    max: 336
  geoip-full-db:
    type: enum
    raw_type: option
    description: When enabled, the full geographic database will be loaded into the kernel which enables geographic information
      in traffic logs - required for FortiView countries. Disabling this option will conserve memory.
    default: enable **
  gtpu-dynamic-source-port:
    type: enum
    raw_type: option
    description: Enable/disable GTP-U dynamic source port support.
    default: disable
  gui-allow-incompatible-fabric-fgt:
    type: enum
    raw_type: option
    description: Enable/disable Allow FGT with incompatible firmware to be treated as compatible in security fabric on the
      GUI. May cause unexpected error.
    default: disable
  gui-app-detection-sdwan:
    type: enum
    raw_type: option
    description: Enable/disable Allow app-detection based SD-WAN.
    default: disable
  gui-auto-upgrade-setup-warning:
    type: enum
    raw_type: option
    description: Enable/disable the automatic patch upgrade setup prompt on the GUI.
    default: enable
  gui-cdn-domain-override:
    type: string
    raw_type: string
    description: Domain of CDN server.
    max_length: 255
  gui-cdn-usage:
    type: enum
    raw_type: option
    description: Enable/disable Load GUI static files from a CDN.
    default: disable
  gui-certificates:
    type: enum
    raw_type: option
    description: Enable/disable the System > Certificate GUI page, allowing you to add and configure certificates from the
      GUI.
    default: enable **
  gui-custom-language:
    type: enum
    raw_type: option
    description: Enable/disable custom languages in GUI.
    default: disable
  gui-date-format:
    type: enum
    raw_type: option
    description: Default date format used throughout GUI.
    default: yyyy/MM/dd
  gui-date-time-source:
    type: enum
    raw_type: option
    description: Source from which the FortiGate GUI uses to display date and time entries.
    default: system
  gui-device-latitude:
    type: string
    raw_type: string
    description: Add the latitude of the location of this FortiGate to position it on the Threat Map.
    max_length: 19
  gui-device-longitude:
    type: string
    raw_type: string
    description: Add the longitude of the location of this FortiGate to position it on the Threat Map.
    max_length: 19
  gui-display-hostname:
    type: enum
    raw_type: option
    description: Enable/disable displaying the FortiGate's hostname on the GUI login page.
    default: disable
  gui-firmware-upgrade-warning:
    type: enum
    raw_type: option
    description: Enable/disable the firmware upgrade warning on the GUI.
    default: enable
  gui-forticare-registration-setup-warning:
    type: enum
    raw_type: option
    description: Enable/disable the FortiCare registration setup warning on the GUI.
    default: enable
  gui-fortigate-cloud-sandbox:
    type: enum
    raw_type: option
    description: Enable/disable displaying FortiGate Cloud Sandbox on the GUI.
    default: disable
  gui-ipv6:
    type: enum
    raw_type: option
    description: Enable/disable IPv6 settings on the GUI.
    default: disable
  gui-local-out:
    type: enum
    raw_type: option
    description: Enable/disable Local-out traffic on the GUI.
    default: disable
  gui-login-request-rate-limit:
    type: integer
    raw_type: integer
    description: Conifgure number of login requests to maintain in the request queue (0 - 30, default = 0 for no rate limit).
    default: '0'
    min: 0
    max: 30
  gui-replacement-message-groups:
    type: enum
    raw_type: option
    description: Enable/disable replacement message groups on the GUI.
    default: disable
  gui-rest-api-cache:
    type: enum
    raw_type: option
    description: Enable/disable REST API result caching on FortiGate.
    default: enable
  gui-theme:
    type: enum
    raw_type: option
    description: Color scheme for the administration GUI.
    default: jade
  gui-wireless-opensecurity:
    type: enum
    raw_type: option
    description: Enable/disable wireless open security option on the GUI.
    default: disable
  gui-workflow-management:
    type: enum
    raw_type: option
    description: Enable/disable Workflow management features on the GUI.
    default: disable
  ha-affinity:
    type: string
    raw_type: string
    description: Affinity setting for HA daemons (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '1'
    max_length: 79
  honor-df:
    type: enum
    raw_type: option
    description: Enable/disable honoring of Don't-Fragment (DF) flag.
    default: enable
  hostname:
    type: string
    raw_type: string
    description: FortiGate unit's hostname. Most models will truncate names longer than 24 characters. Some models support
      hostnames up to 35 characters.
    max_length: 35
  http-request-limit:
    type: integer
    raw_type: integer
    description: HTTP request body size limit.
    default: '524288000'
    min: 524288000
    max: 4194304000
  http-unauthenticated-request-limit:
    type: integer
    raw_type: integer
    description: HTTP request body size limit before authentication.
    default: '131072'
    min: 1024
    max: 524288
  httpd-max-worker-count:
    type: integer
    raw_type: integer
    description: Maximum number of simultaneous HTTP requests that will be served. This number may affect GUI and REST API
      performance (0 - 128, default = 0 means let system decide).
    default: '0'
    min: 0
    max: 128
  hyper-scale-vdom-num:
    type: integer
    raw_type: integer
    description: Number of VDOMs for hyper scale license.
    default: '250'
    min: 1
    max: 250
  igmp-state-limit:
    type: integer
    raw_type: integer
    description: Maximum number of IGMP memberships (96 - 64000, default = 3200).
    default: '3200'
    min: 96
    max: 128000
  interface-subnet-usage:
    type: enum
    raw_type: option
    description: Enable/disable allowing use of interface-subnet setting in firewall addresses (default = enable).
    default: enable
  internet-service-database:
    type: enum
    raw_type: option
    description: Configure which Internet Service database size to download from FortiGuard and use.
    default: full **
  internet-service-download-list:
    type: integer
    raw_type: integer
    description: Configure which on-demand Internet Service IDs are to be downloaded. Internet Service ID.
    min: 0
    max: 4294967295
  interval:
    type: integer
    raw_type: integer
