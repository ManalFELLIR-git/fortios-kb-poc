  virtual-switch-vlan:
    type: enum
    raw_type: option
    description: Enable/disable virtual switch VLAN. This option is disabled when unset, but enabled after a factory reset.
    default: disable
  wad-affinity:
    type: string
    raw_type: string
    description: Affinity setting for wad (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '0'
    max_length: 79
  wad-csvc-cs-count:
    type: integer
    raw_type: integer
    description: Number of concurrent WAD-cache-service object-cache processes.
    default: '1'
    min: 1
    max: 1
  wad-csvc-db-count:
    type: integer
    raw_type: integer
    description: Number of concurrent WAD-cache-service byte-cache processes.
    default: '0'
    min: 0
    max: 8
  wad-memory-change-granularity:
    type: integer
    raw_type: integer
    description: Minimum percentage change in system memory usage detected by the wad daemon prior to adjusting TCP window
      size for any active connection.
    default: '10'
    min: 5
    max: 25
  wad-p2s-max-body-size:
    type: integer
    raw_type: integer
    description: Maximum size of the body of the local out HTTP request (1 - 32 Mbytes, default = 4).
    default: '4'
    min: 1
    max: 32
  wad-restart-end-time:
    type: string
    raw_type: user
    description: WAD workers daily restart end time (hh:mm).
  wad-restart-mode:
    type: enum
    raw_type: option
    description: WAD worker restart mode (default = none).
    default: none
  wad-restart-start-time:
    type: string
    raw_type: user
    description: WAD workers daily restart time (hh:mm).
  wad-source-affinity:
    type: enum
    raw_type: option
    description: Enable/disable dispatching traffic to WAD workers based on source affinity.
    default: enable
  wad-worker-count:
    type: integer
    raw_type: integer
    description: Number of explicit proxy WAN optimization daemon (WAD) processes. By default WAN optimization, explicit proxy,
      and web caching is handled by all of the CPU cores in a FortiGate unit.
    default: '0'
    min: 0
    max: 8
  wad-worker-dev-cache:
    type: integer
    raw_type: integer
    description: Number of cached devices for each ZTNA proxy worker. The default value is tuned by memory consumption. Set
      the option to 0 to disable the cache.
    default: '10240'
    min: 0
    max: 10240
  wifi-ca-certificate:
    type: string
    raw_type: string
    description: CA certificate that verifies the WiFi certificate.
    default: Fortinet_Wifi_CA
    max_length: 79
  wifi-certificate:
    type: string
    raw_type: string
    description: Certificate to use for WiFi authentication.
    default: Fortinet_Wifi
    max_length: 35
  wimax-4g-usb:
    type: enum
    raw_type: option
    description: Enable/disable comparability with WiMAX 4G USB devices.
    default: disable
  wireless-controller:
    type: enum
    raw_type: option
    description: Enable/disable the wireless controller feature to use the FortiGate unit to manage FortiAPs.
    default: enable
  wireless-controller-port:
    type: integer
    raw_type: integer
    description: Port used for the control channel in wireless controller mode (wireless-mode is ac). The data channel port
      is the control channel port number plus one (1024 - 49150, default = 5246).
    default: '5246'
    min: 1024
    max: 49150
  wireless-mode:
    type: enum
    raw_type: option
    description: Wireless mode setting.
    default: ac
children:
  split-port-mode:
    attributes:
      interface:
        type: string
        raw_type: string
        description: Split port interface.
        max_length: 15
      split-mode:
        type: enum
        raw_type: option
        description: The configuration mode for the split port interface.
        default: disable
