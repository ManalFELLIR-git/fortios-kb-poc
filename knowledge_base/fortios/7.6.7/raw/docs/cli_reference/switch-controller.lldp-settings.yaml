id: switch-controller.lldp-settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/515445176/config-switch-controller-lldp-settings
attributes:
  device-detection:
    type: enum
    raw_type: option
    description: Enable/disable dynamic detection of LLDP neighbor devices for VLAN assignment.
    default: enable
  fast-start-interval:
    type: integer
    raw_type: integer
    description: Frequency of LLDP PDU transmission from FortiSwitch for the first 4 packets when the link is up (2 - 5 sec,
      default = 2, 0 = disable fast start).
    default: '2'
    min: 0
    max: 255
  management-interface:
    type: enum
    raw_type: option
    description: Primary management interface to be advertised in LLDP and CDP PDUs.
    default: internal
  tx-hold:
    type: integer
    raw_type: integer
    description: Number of tx-intervals before local LLDP data expires (1 - 16, default = 4). Packet TTL is tx-hold * tx-interval.
    default: '4'
    min: 1
    max: 16
  tx-interval:
    type: integer
    raw_type: integer
    description: Frequency of LLDP PDU transmission from FortiSwitch (5 - 4095 sec, default = 30). Packet TTL is tx-hold *
      tx-interval.
    default: '30'
    min: 5
    max: 4095
children: {}
