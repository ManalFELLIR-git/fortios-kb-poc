id: user.exchange
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/150553947/config-user-exchange
attributes:
  auth-level:
    type: enum
    raw_type: option
    description: Authentication security level used for the RPC protocol layer.
    default: privacy
  auth-type:
    type: enum
    raw_type: option
    description: Authentication security type used for the RPC protocol layer.
    default: kerberos
  auto-discover-kdc:
    type: enum
    raw_type: option
    description: Enable/disable automatic discovery of KDC IP addresses.
    default: enable
  connect-protocol:
    type: enum
    raw_type: option
    description: Connection protocol used to connect to MS Exchange service.
    default: rpc-over-https
  domain-name:
    type: string
    raw_type: string
    description: MS Exchange server fully qualified domain name.
    max_length: 79
  http-auth-type:
    type: enum
    raw_type: option
    description: Authentication security type used for the HTTP transport.
    default: ntlm
  ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Server IPv4 address.
    default: 0.0.0.0
  kdc-ip:
    type: string
    raw_type: string
    description: KDC IPv4 addresses for Kerberos authentication. KDC IPv4 addresses for Kerberos authentication.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: MS Exchange server entry name.
    max_length: 35
  password:
    type: password
    raw_type: password
    description: Password for the specified username.
  server-name:
    type: string
    raw_type: string
    description: MS Exchange server hostname.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum SSL/TLS protocol version for HTTPS transport (default is to follow system global setting).
    default: default
  username:
    type: string
    raw_type: string
    description: User name used to sign in to the server. Must have proper permissions for service.
    max_length: 64
  validate-server-certificate:
    type: enum
    raw_type: option
    description: Enable/disable exchange server certificate validation.
    default: disable
children: {}
