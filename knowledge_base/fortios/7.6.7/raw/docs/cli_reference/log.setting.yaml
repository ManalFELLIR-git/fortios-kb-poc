id: log.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/196223761/config-log-setting
attributes:
  anonymization-hash:
    type: string
    raw_type: string
    description: User name anonymization hash salt.
    max_length: 32
  brief-traffic-format:
    type: enum
    raw_type: option
    description: Enable/disable brief format traffic logging.
    default: disable
  custom-log-fields:
    type: string
    raw_type: string
    description: Custom fields to append to all log messages. Custom log field.
    max_length: 35
  daemon-log:
    type: enum
    raw_type: option
    description: Enable/disable daemon logging.
    default: disable
  expolicy-implicit-log:
    type: enum
    raw_type: option
    description: Enable/disable proxy firewall implicit policy logging.
    default: disable
  extended-log:
    type: enum
    raw_type: option
    description: Enable/disable extended traffic logging.
    default: disable
  extended-utm-log:
    type: enum
    raw_type: option
    description: Enable/disable extended UTM logging.
    default: disable
  faz-override:
    type: enum
    raw_type: option
    description: Enable/disable override FortiAnalyzer settings.
    default: disable
  fortiview-weekly-data:
    type: enum
    raw_type: option
    description: Enable/disable FortiView weekly data.
    default: disable
  fwpolicy-implicit-log:
    type: enum
    raw_type: option
    description: Enable/disable implicit firewall policy logging.
    default: disable
  fwpolicy6-implicit-log:
    type: enum
    raw_type: option
    description: Enable/disable implicit firewall policy6 logging.
    default: disable
  local-in-allow:
    type: enum
    raw_type: option
    description: Enable/disable local-in-allow logging.
    default: disable
  local-in-deny-broadcast:
    type: enum
    raw_type: option
    description: Enable/disable local-in-deny-broadcast logging.
    default: disable
  local-in-deny-unicast:
    type: enum
    raw_type: option
    description: Enable/disable local-in-deny-unicast logging.
    default: disable
  local-in-policy-log:
    type: enum
    raw_type: option
    description: Enable/disable local-in-policy logging.
    default: disable
  local-out:
    type: enum
    raw_type: option
    description: Enable/disable local-out logging.
    default: enable
  local-out-ioc-detection:
    type: enum
    raw_type: option
    description: Enable/disable local-out traffic IoC detection. Requires local-out to be enabled.
    default: enable
  log-policy-comment:
    type: enum
    raw_type: option
    description: Enable/disable inserting policy comments into traffic logs.
    default: disable
  log-user-in-upper:
    type: enum
    raw_type: option
    description: Enable/disable logs with user-in-upper.
    default: disable
  long-live-session-stat:
    type: enum
    raw_type: option
    description: Enable/disable long-live-session statistics logging.
    default: enable
  neighbor-event:
    type: enum
    raw_type: option
    description: Enable/disable neighbor event logging.
    default: disable
  resolve-ip:
    type: enum
    raw_type: option
    description: Enable/disable adding resolved domain names to traffic logs if possible.
    default: disable
  resolve-port:
    type: enum
    raw_type: option
    description: Enable/disable adding resolved service names to traffic logs.
    default: enable
  rest-api-get:
    type: enum
    raw_type: option
    description: Enable/disable REST API GET request logging.
    default: disable
  rest-api-performance:
    type: enum
    raw_type: option
    description: Enable/disable REST API memory and performance stats in rest-api-get/set logs.
    default: disable
  rest-api-set:
    type: enum
    raw_type: option
    description: Enable/disable REST API POST/PUT/DELETE request logging.
    default: disable
  syslog-override:
    type: enum
    raw_type: option
    description: Enable/disable override Syslog settings.
    default: disable
  user-anonymize:
    type: enum
    raw_type: option
    description: Enable/disable anonymizing user names in log messages.
    default: disable
  web-svc-perf:
    type: enum
    raw_type: option
    description: Enable/disable web-svc performance logging.
    default: disable
  zone-name:
    type: enum
    raw_type: option
    description: Enable/disable zone name logging.
    default: disable
children: {}
