id: system.affinity-packet-redistribution
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/255714620/config-system-affinity-packet-redistribution
attributes:
  affinity-cpumask:
    type: string
    raw_type: string
    description: Hexadecimal cpumask, empty value means all CPUs.
    max_length: 127
  id:
    type: integer
    raw_type: integer
    description: ID of the packet redistribution setting.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: Physical interface name on which to perform packet redistribution.
    max_length: 15
  round-robin:
    type: enum
    raw_type: option
    description: Enable/disable round-robin redistribution to multiple CPUs.
    default: enable
  rxqid:
    type: integer
    raw_type: integer
    description: ID of the receive queue (when the interface has multiple queues) on which to perform packet redistribution
      (255 = all queues).
    default: '255'
    min: 0
    max: 255
children: {}
