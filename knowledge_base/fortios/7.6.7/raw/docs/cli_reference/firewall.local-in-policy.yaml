id: firewall.local-in-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/185227842/config-firewall-local-in-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Action performed on traffic matching the policy (default = deny).
    default: deny
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dstaddr:
    type: string
    raw_type: string
    description: Destination address object from available options. Address name.
    max_length: 79
  dstaddr-negate:
    type: enum
    raw_type: option
    description: When enabled dstaddr specifies what the destination address must NOT be.
    default: disable
  ha-mgmt-intf-only:
    type: enum
    raw_type: option
    description: Enable/disable dedicating the HA management interface only for local-in policy.
    default: disable
  internet-service-src:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services in source for this local-in policy. If enabled, source address is
      not used.
    default: disable
  internet-service-src-custom:
    type: string
    raw_type: string
    description: Custom Internet Service source name. Custom Internet Service name.
    max_length: 79
  internet-service-src-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service source group name. Custom Internet Service group name.
    max_length: 79
  internet-service-src-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service source name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-src-group:
    type: string
    raw_type: string
    description: Internet Service source group name. Internet Service group name.
    max_length: 79
  internet-service-src-name:
    type: string
    raw_type: string
    description: Internet Service source name. Internet Service name.
    max_length: 79
  internet-service-src-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service-src specifies what the service must NOT be.
    default: disable
  intf:
    type: string
    raw_type: string
    description: Incoming interface name from available options. Address name.
    max_length: 79
  logtraffic:
    type: enum
    raw_type: option
    description: Enable/disable local-in traffic logging.
    default: disable
  policyid:
    type: integer
    raw_type: integer
    description: User defined local in policy ID.
    default: '0'
    min: 0
    max: 4294967295
  schedule:
    type: string
    raw_type: string
    description: Schedule object from available options.
    max_length: 35
  service:
    type: string
    raw_type: string
    description: Service object from available options. Service name.
    max_length: 79
  service-negate:
    type: enum
    raw_type: option
    description: When enabled service specifies what the service must NOT be.
    default: disable
  srcaddr:
    type: string
    raw_type: string
    description: Source address object from available options. Address name.
    max_length: 79
  srcaddr-negate:
    type: enum
    raw_type: option
    description: When enabled srcaddr specifies what the source address must NOT be.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable this local-in policy.
    default: enable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  virtual-patch:
    type: enum
    raw_type: option
    description: Enable/disable virtual patching.
    default: disable
children: {}
