id: wireless-controller.wag-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/289896081/config-wireless-controller-wag-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  dhcp-ip-addr:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the monitoring DHCP request packet sent through the tunnel.
    default: 0.0.0.0
  name:
    type: string
    raw_type: string
    description: Tunnel profile name.
    max_length: 35
  ping-interval:
    type: integer
    raw_type: integer
    description: Interval between two tunnel monitoring echo packets (1 - 65535 sec, default = 1).
    default: '1'
    min: 1
    max: 65535
  ping-number:
    type: integer
    raw_type: integer
    description: Number of the tunnel monitoring echo packets (1 - 65535, default = 5).
    default: '5'
    min: 1
    max: 65535
  return-packet-timeout:
    type: integer
    raw_type: integer
    description: Window of time for the return packets from the tunnel's remote end (1 - 65535 sec, default = 160).
    default: '160'
    min: 1
    max: 65535
  tunnel-type:
    type: enum
    raw_type: option
    description: Tunnel type.
    default: l2tpv3
  wag-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP Address of the wireless access gateway.
    default: 0.0.0.0
  wag-port:
    type: integer
    raw_type: integer
    description: UDP port of the wireless access gateway.
    default: '1701'
    min: 0
    max: 65535
children: {}
