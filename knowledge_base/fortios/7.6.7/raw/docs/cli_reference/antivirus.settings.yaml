id: antivirus.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/252375733/config-antivirus-settings
attributes:
  cache-infected-result:
    type: enum
    raw_type: option
    description: Enable/disable cache of infected scan results (default = enable).
    default: enable
  grayware:
    type: enum
    raw_type: option
    description: Enable/disable grayware detection when an AntiVirus profile is applied to traffic. This option is disabled
      when unset, but enabled after a factory reset.
    default: disable
  machine-learning-detection:
    type: enum
    raw_type: option
    description: Use machine learning based malware detection.
    default: enable
  override-timeout:
    type: integer
    raw_type: integer
    description: Override the large file scan timeout value in seconds (30 - 3600). Zero is the default value and is used
      to disable this command. When disabled, the daemon adjusts the large file scan timeout based on the file size.
    default: '0'
    min: 30
    max: 3600
  use-extreme-db:
    type: enum
    raw_type: option
    description: Enable/disable the use of Extreme AVDB.
    default: disable
children: {}
