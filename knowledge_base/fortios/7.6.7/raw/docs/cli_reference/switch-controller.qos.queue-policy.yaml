id: switch-controller.qos.queue-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/279707025/config-switch-controller-qos-queue-policy
attributes:
  name:
    type: string
    raw_type: string
    description: QoS policy name.
    max_length: 63
  rate-by:
    type: enum
    raw_type: option
    description: COS queue rate by kbps or percent.
    default: kbps
  schedule:
    type: enum
    raw_type: option
    description: COS queue scheduling.
    default: round-robin
children:
  cos-queue:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description of the COS queue.
        max_length: 63
      drop-policy:
        type: enum
        raw_type: option
        description: COS queue drop policy.
        default: taildrop
      ecn:
        type: enum
        raw_type: option
        description: Enable/disable ECN packet marking to drop eligible packets.
        default: disable
      max-rate:
        type: integer
        raw_type: integer
        description: Maximum rate (0 - 4294967295 kbps, 0 to disable).
        default: '0'
        min: 0
        max: 4294967295
      max-rate-percent:
        type: integer
        raw_type: integer
        description: Maximum rate (% of link speed).
        default: '0'
        min: 0
        max: 4294967295
      min-rate:
        type: integer
        raw_type: integer
        description: Minimum rate (0 - 4294967295 kbps, 0 to disable).
        default: '0'
        min: 0
        max: 4294967295
      min-rate-percent:
        type: integer
        raw_type: integer
        description: Minimum rate (% of link speed).
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Cos queue ID.
        max_length: 63
      weight:
        type: integer
        raw_type: integer
        description: Weight of weighted round robin scheduling.
        default: '1'
        min: 0
        max: 4294967295
