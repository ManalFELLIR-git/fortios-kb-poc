id: router.extcommunity-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/796218767/config-router-extcommunity-list
attributes:
  name:
    type: string
    raw_type: string
    description: Extended community list name.
    max_length: 35
  type:
    type: enum
    raw_type: option
    description: Extended community list type (standard or expanded).
    default: standard
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Permit or deny route-based operations, based on the route's EXTENDED COMMUNITY attribute.
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      match:
        type: string
        raw_type: string
        description: Extended community specifications for matching a reserved extended community.
        max_length: 255
      regexp:
        type: string
        raw_type: string
        description: Ordered list of EXTENDED COMMUNITY attributes as a regular expression.
        max_length: 255
      type:
        type: enum
        raw_type: option
        description: Type of extended community.
        default: rt
