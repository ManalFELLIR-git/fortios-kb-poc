id: system.auto-script
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/265298105/config-system-auto-script
attributes:
  interval:
    type: integer
    raw_type: integer
    description: Repeat interval in seconds.
    default: '0'
    min: 0
    max: 31557600
  name:
    type: string
    raw_type: string
    description: Auto script name.
    max_length: 35
  output-size:
    type: integer
    raw_type: integer
    description: Number of megabytes to limit script output to (10 - 1024, default = 10).
    default: '10'
    min: 10
    max: 1024
  repeat:
    type: integer
    raw_type: integer
    description: Number of times to repeat this script (0 = infinite).
    default: '1'
    min: 0
    max: 65535
  script:
    type: string
    raw_type: var-string
    description: List of FortiOS CLI commands to repeat.
    max_length: 1023
  start:
    type: enum
    raw_type: option
    description: Script starting mode.
    default: manual
  timeout:
    type: integer
    raw_type: integer
    description: Maximum running time for this script in seconds (0 = no timeout).
    default: '0'
    min: 0
    max: 300
children: {}
