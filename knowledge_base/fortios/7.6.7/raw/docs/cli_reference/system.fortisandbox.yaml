id: system.fortisandbox
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/532438794/config-system-fortisandbox
attributes:
  ca:
    type: string
    raw_type: string
    description: The CA that signs remote FortiSandbox certificate, empty for no check.
    max_length: 79
  certificate-verification:
    type: enum
    raw_type: option
    description: Enable/disable identity verification of FortiSandbox by use of certificate.
    default: disable
  cn:
    type: string
    raw_type: string
    description: The CN of remote server certificate, case sensitive, empty for no check.
    max_length: 127
  email:
    type: string
    raw_type: string
    description: Notifier email address.
    max_length: 63
  enc-algorithm:
    type: enum
    raw_type: option
    description: Configure the level of SSL protection for secure communication with FortiSandbox.
    default: default
  forticloud:
    type: enum
    raw_type: option
    description: Enable/disable FortiSandbox Cloud.
    default: disable
  inline-scan:
    type: enum
    raw_type: option
    description: Enable/disable FortiSandbox inline scan.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  server:
    type: string
    raw_type: string
    description: Server IP address or FQDN of the remote FortiSandbox.
    max_length: 63
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for communications to FortiSandbox.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  status:
    type: enum
    raw_type: option
    description: Enable/disable FortiSandbox.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
