id: certificate.hsm-local
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/337946356/config-certificate-hsm-local
attributes:
  api-version:
    type: enum
    raw_type: option
    description: API version for communicating with HSM.
    default: unknown
  certificate:
    type: string
    raw_type: user
    description: PEM format certificate.
  comments:
    type: string
    raw_type: string
    description: Comment.
    max_length: 511
  gch-cloud-service-name:
    type: string
    raw_type: string
    description: Cloud service config name to generate access token.
    max_length: 35
  gch-cryptokey:
    type: string
    raw_type: string
    description: Google Cloud HSM cryptokey.
    max_length: 63
  gch-cryptokey-algorithm:
    type: enum
    raw_type: option
    description: Google Cloud HSM cryptokey algorithm.
    default: rsa-sign-pkcs1-2048-sha256
  gch-cryptokey-version:
    type: string
    raw_type: string
    description: Google Cloud HSM cryptokey version.
    max_length: 31
  gch-keyring:
    type: string
    raw_type: string
    description: Google Cloud HSM keyring.
    max_length: 63
  gch-location:
    type: string
    raw_type: string
    description: Google Cloud HSM location.
    max_length: 63
  gch-project:
    type: string
    raw_type: string
    description: Google Cloud HSM project ID.
    max_length: 31
  gch-url:
    type: string
    raw_type: string
    description: Google Cloud HSM key URL (e.g. "https://cloudkms.googleapis.com/v1/projects/sampleproject/locations/samplelocation/keyRings/samplekeyring/cryptoKeys/sampleKeyName/cryptoKeyVersions/1").
      Read-only.
    max_length: 1024
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  range:
    type: enum
    raw_type: option
    description: Either a global or VDOM IP address range for the certificate.
    default: global
  source:
    type: enum
    raw_type: option
    description: Certificate source type.
    default: user
  vendor:
    type: enum
    raw_type: option
    description: HSM vendor.
    default: unknown
children: {}
