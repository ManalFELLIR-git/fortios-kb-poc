id: system.wccp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/227964791/config-system-wccp
attributes:
  assignment-bucket-format:
    type: enum
    raw_type: option
    description: Assignment bucket format for the WCCP cache engine.
    default: cisco-implementation
  assignment-dstaddr-mask:
    type: ipv4-netmask-any
    raw_type: ipv4-netmask-any
    description: Assignment destination address mask.
    default: 0.0.0.0
  assignment-method:
    type: enum
    raw_type: option
    description: Hash key assignment preference.
    default: HASH
  assignment-srcaddr-mask:
    type: ipv4-netmask-any
    raw_type: ipv4-netmask-any
    description: Assignment source address mask.
    default: 0.0.23.65
  assignment-weight:
    type: integer
    raw_type: integer
    description: Assignment of hash weight/ratio for the WCCP cache engine.
    default: '0'
    min: 0
    max: 255
  authentication:
    type: enum
    raw_type: option
    description: Enable/disable MD5 authentication.
    default: disable
  cache-engine-method:
    type: enum
    raw_type: option
    description: Method used to forward traffic to the routers or to return to the cache engine.
    default: GRE
  cache-id:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address known to all routers. If the addresses are the same, use the default 0.0.0.0.
    default: 0.0.0.0
  forward-method:
    type: enum
    raw_type: option
    description: Method used to forward traffic to the cache servers.
    default: GRE
  group-address:
    type: ipv4-address-multicast
    raw_type: ipv4-address-multicast
    description: IP multicast address used by the cache routers. For the FortiGate to ignore multicast WCCP traffic, use the
      default 0.0.0.0.
    default: 0.0.0.0
  password:
    type: password
    raw_type: password
    description: Password for MD5 authentication.
  ports:
    type: string
    raw_type: user
    description: Service ports.
  ports-defined:
    type: enum
    raw_type: option
    description: Match method.
  primary-hash:
    type: enum
    raw_type: option
    description: Hash method.
    default: dst-ip
  priority:
    type: integer
    raw_type: integer
    description: Service priority.
    default: '0'
    min: 0
    max: 255
  protocol:
    type: integer
    raw_type: integer
    description: Service protocol.
    default: '0'
    min: 0
    max: 255
  return-method:
    type: enum
    raw_type: option
    description: Method used to decline a redirected packet and return it to the FortiGate unit.
    default: GRE
  router-id:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address known to all cache engines. If all cache engines connect to the same FortiGate interface, use
      the default 0.0.0.0.
    default: 0.0.0.0
  router-list:
    type: string
    raw_type: user
    description: IP addresses of one or more WCCP routers.
  server-list:
    type: string
    raw_type: user
    description: IP addresses and netmasks for up to four cache servers.
  server-type:
    type: enum
    raw_type: option
    description: Cache server type.
    default: forward
  service-id:
    type: string
    raw_type: string
    description: Service ID.
    max_length: 3
  service-type:
    type: enum
    raw_type: option
    description: WCCP service type used by the cache server for logical interception and redirection of traffic.
    default: auto
children: {}
