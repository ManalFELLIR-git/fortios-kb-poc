id: system.dns
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/190194324/config-system-dns
attributes:
  alt-primary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Alternate primary DNS server. This is not used as a failover DNS server.
    default: 0.0.0.0
  alt-secondary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Alternate secondary DNS server. This is not used as a failover DNS server.
    default: 0.0.0.0
  cache-notfound-responses:
    type: enum
    raw_type: option
    description: Enable/disable response from the DNS server when a record is not in cache.
    default: disable
  dns-cache-limit:
    type: integer
    raw_type: integer
    description: Maximum number of records in the DNS cache.
    default: '5000'
    min: 0
    max: 4294967295
  dns-cache-ttl:
    type: integer
    raw_type: integer
    description: Duration in seconds that the DNS cache retains information.
    default: '1800'
    min: 60
    max: 86400
  domain:
    type: string
    raw_type: string
    description: Search suffix list for hostname lookup. DNS search domain list separated by space (maximum 8 domains).
    max_length: 127
  fqdn-cache-ttl:
    type: integer
    raw_type: integer
    description: FQDN cache time to live in seconds (0 - 86400, default = 0).
    default: '0'
    min: 0
    max: 86400
  fqdn-max-refresh:
    type: integer
    raw_type: integer
    description: FQDN cache maximum refresh time in seconds (3600 - 86400, default = 3600).
    default: '3600'
    min: 3600
    max: 86400
  fqdn-min-refresh:
    type: integer
    raw_type: integer
    description: FQDN cache minimum refresh time in seconds (10 - 3600, default = 60).
    default: '60'
    min: 10
    max: 3600
  hostname-limit:
    type: integer
    raw_type: integer
    description: Limit of the number of hostname table entries (0 - 50000).
    default: '5000'
    min: 0
    max: 50000
  hostname-ttl:
    type: integer
    raw_type: integer
    description: TTL of hostname table entries (60 - 86400).
    default: '86400'
    min: 60
    max: 86400
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ip6-primary:
    type: ipv6-address
    raw_type: ipv6-address
    description: Primary DNS server IPv6 address.
    default: '::'
  ip6-secondary:
    type: ipv6-address
    raw_type: ipv6-address
    description: Secondary DNS server IPv6 address.
    default: '::'
  log:
    type: enum
    raw_type: option
    description: Local DNS log setting.
    default: disable
  primary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Primary DNS server IP address.
    default: 0.0.0.0
  protocol:
    type: enum
    raw_type: option
    description: DNS transport protocols.
    default: cleartext
  retry:
    type: integer
    raw_type: integer
    description: Number of times to retry (0 - 5).
    default: '2'
    min: 0
    max: 5
  root-servers:
    type: string
    raw_type: user
    description: Configure up to two preferred servers that serve the DNS root zone (default uses all 13 root servers).
  secondary:
    type: ipv4-address
    raw_type: ipv4-address
    description: Secondary DNS server IP address.
    default: 0.0.0.0
  server-hostname:
    type: string
    raw_type: string
    description: DNS server host name list. DNS server host name list separated by space (maximum 4 domains).
    max_length: 127
  server-select-method:
    type: enum
    raw_type: option
    description: Specify how configured servers are prioritized.
    default: least-rtt
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address used by the DNS server as its source IP.
    default: 0.0.0.0
  source-ip-interface:
    type: string
    raw_type: string
    description: IP address of the specified interface as the source IP address.
    max_length: 15
  ssl-certificate:
    type: string
    raw_type: string
    description: Name of local certificate for SSL connections.
    default: Fortinet_Factory
    max_length: 35
  timeout:
    type: integer
    raw_type: integer
    description: DNS query timeout interval in seconds (1 - 10).
    default: '5'
    min: 1
    max: 10
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
