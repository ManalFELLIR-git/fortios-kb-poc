id: system.sflow
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/144115275/config-system-sflow
attributes:
  collector-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP addresses of the sFlow collectors that sFlow agents added to interfaces in this VDOM send sFlow datagrams
      to.
    default: 0.0.0.0
  collector-port:
    type: integer
    raw_type: integer
    description: UDP port number used for sending sFlow datagrams (configure only if required by your sFlow collector or your
      network configuration) (0 - 65535, default = 6343).
    default: '6343'
    min: 0
    max: 65535
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address for sFlow agent.
    default: 0.0.0.0
children:
  collectors:
    attributes:
      collector-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP addresses of the sFlow collectors that sFlow agents added to interfaces in this VDOM send sFlow datagrams
          to.
        default: 0.0.0.0
      collector-port:
        type: integer
        raw_type: integer
        description: UDP port number used for sending sFlow datagrams (configure only if required by your sFlow collector
          or your network configuration) (0 - 65535, default = 6343).
        default: '6343'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      interface:
        type: string
        raw_type: string
        description: Specify outgoing interface to reach server.
        max_length: 15
      interface-select-method:
        type: enum
        raw_type: option
        description: Specify how to select outgoing interface to reach server.
        default: auto
      source-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Source IP address for sFlow agent.
        default: 0.0.0.0
