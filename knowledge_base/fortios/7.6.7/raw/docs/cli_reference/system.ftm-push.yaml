id: system.ftm-push
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/157258996/config-system-ftm-push
attributes:
  interface:
    type: string
    raw_type: string
    description: Interface of FortiToken Mobile push services server.
    max_length: 35
  proxy:
    type: enum
    raw_type: option
    description: Enable/disable communication to the proxy server in FortiGuard configuration.
    default: enable
  server:
    type: string
    raw_type: string
    description: IPv4 address or domain name of FortiToken Mobile push services server.
    max_length: 127
  server-cert:
    type: string
    raw_type: string
    description: Name of the server certificate to be used for SSL.
    default: Fortinet_GUI_Server
    max_length: 35
  server-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: 'IPv4 address of FortiToken Mobile push services server (format: xxx.xxx.xxx.xxx).'
    default: 0.0.0.0
  server-port:
    type: integer
    raw_type: integer
    description: Port to communicate with FortiToken Mobile push services server (1 - 65535, default = 4433).
    default: '4433'
    min: 1
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable the use of FortiToken Mobile push services.
    default: disable
children: {}
