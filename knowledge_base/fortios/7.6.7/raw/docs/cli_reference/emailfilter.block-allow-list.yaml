id: emailfilter.block-allow-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/445985486/config-emailfilter-block-allow-list
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Reject, mark as spam or good email.
        default: spam
      addr-type:
        type: enum
        raw_type: option
        description: IP address type.
        default: ipv4
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
      ip4-subnet:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: IPv4 network address/subnet mask bits.
        default: 0.0.0.0 0.0.0.0
      ip6-subnet:
        type: ipv6-network
        raw_type: ipv6-network
        description: IPv6 network address/subnet mask bits.
        default: ::/128
      pattern:
        type: string
        raw_type: string
        description: Pattern to match.
        max_length: 127
      pattern-type:
        type: enum
        raw_type: option
        description: Wildcard pattern or regular expression.
        default: wildcard
      status:
        type: enum
        raw_type: option
        description: Enable/disable status.
        default: enable
      type:
        type: enum
        raw_type: option
        description: Entry type.
        default: ip
