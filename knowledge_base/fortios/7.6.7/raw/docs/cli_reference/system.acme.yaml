id: system.acme
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/176011231/config-system-acme
attributes:
  interface:
    type: string
    raw_type: string
    description: Interface(s) on which the ACME client will listen for challenges. Interface name.
    max_length: 79
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IPv4 address used to connect to the ACME server.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Source IPv6 address used to connect to the ACME server.
    default: '::'
  use-ha-direct:
    type: enum
    raw_type: option
    description: Enable the use of 'ha-mgmt' interface to connect to the ACME server when 'ha-direct' is enabled in HA configuration
    default: disable
children:
  accounts:
    attributes:
      ca_url:
        type: string
        raw_type: string
        description: Account ca_url.
        max_length: 255
      eab-key-hmac:
        type: password
        raw_type: password
        description: External Acccount Binding Key HMAC.
      eab-key-id:
        type: string
        raw_type: var-string
        description: External Acccount Binding Key ID.
        max_length: 255
      email:
        type: string
        raw_type: string
        description: Account email.
        max_length: 255
      id:
        type: string
        raw_type: string
        description: Account id.
        max_length: 255
      privatekey:
        type: string
        raw_type: string
        description: Account Private Key.
        max_length: 8191
      status:
        type: string
        raw_type: string
        description: Account status.
        max_length: 127
      url:
        type: string
        raw_type: string
        description: Account url.
        max_length: 511
