id: system.ipv6-tunnel
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/698770689/config-system-ipv6-tunnel
attributes:
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable tunnel ASIC offloading.
    default: enable
  destination:
    type: ipv6-address
    raw_type: ipv6-address
    description: Remote IPv6 address of the tunnel.
    default: '::'
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  name:
    type: string
    raw_type: string
    description: IPv6 tunnel name.
    max_length: 15
  source:
    type: ipv6-address
    raw_type: ipv6-address
    description: Local IPv6 address of the tunnel.
    default: '::'
  use-sdwan:
    type: enum
    raw_type: option
    description: Enable/disable use of SD-WAN to reach remote gateway.
    default: disable
children: {}
