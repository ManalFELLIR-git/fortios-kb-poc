id: system.vxlan
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/296583352/config-system-vxlan
attributes:
  dstport:
    type: integer
    raw_type: integer
    description: VXLAN destination port (1 - 65535, default = 4789).
    default: '4789'
    min: 1
    max: 65535
  evpn-id:
    type: integer
    raw_type: integer
    description: EVPN instance.
    default: '0'
    min: 1
    max: 65535
  interface:
    type: string
    raw_type: string
    description: Outgoing interface for VXLAN encapsulated traffic.
    max_length: 15
  ip-version:
    type: enum
    raw_type: option
    description: IP version to use for the VXLAN interface and so for communication over the VXLAN. IPv4 or IPv6 unicast or
      multicast.
    default: ipv4-unicast
  learn-from-traffic:
    type: enum
    raw_type: option
    description: Enable/disable VXLAN MAC learning from traffic.
    default: disable
  local-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address to use as the source address for egress VXLAN packets.
    default: 0.0.0.0
  local-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address to use as the source address for egress VXLAN packets.
    default: '::'
  multicast-ttl:
    type: integer
    raw_type: integer
    description: VXLAN multicast TTL (1-255, default = 0).
    default: '0'
    min: 1
    max: 255
  name:
    type: string
    raw_type: string
    description: VXLAN device or interface name. Must be a unique interface name.
    max_length: 15
  remote-ip:
    type: string
    raw_type: string
    description: IPv4 address of the VXLAN interface on the device at the remote end of the VXLAN. IPv4 address.
    max_length: 15
  remote-ip6:
    type: string
    raw_type: string
    description: IPv6 IP address of the VXLAN interface on the device at the remote end of the VXLAN. IPv6 address.
    max_length: 45
  vni:
    type: integer
    raw_type: integer
    description: VXLAN network ID.
    default: '0'
    min: 1
    max: 16777215
children: {}
