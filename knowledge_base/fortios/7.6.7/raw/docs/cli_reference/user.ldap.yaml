id: user.ldap
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/590785459/config-user-ldap
attributes:
  account-key-cert-field:
    type: enum
    raw_type: option
    description: Define subject identity field in certificate for user access right checking.
    default: othername
  account-key-filter:
    type: string
    raw_type: string
    description: Account key filter, using the UPN as the search filter.
    default: (&(userPrincipalName=%s)(!(UserAccountControl:1.2.840.113556.1.4.803:=2)))
    max_length: 2047
  account-key-processing:
    type: enum
    raw_type: option
    description: Account key processing operation. The FortiGate will keep either the whole domain or strip the domain from
      the subject identity.
    default: same
  antiphish:
    type: enum
    raw_type: option
    description: Enable/disable AntiPhishing credential backend.
    default: disable
  ca-cert:
    type: string
    raw_type: string
    description: CA certificate name.
    max_length: 79
  client-cert:
    type: string
    raw_type: string
    description: Client certificate name.
    max_length: 79
  client-cert-auth:
    type: enum
    raw_type: option
    description: Enable/disable using client certificate for TLS authentication.
    default: disable
  cnid:
    type: string
    raw_type: string
    description: Common name identifier for the LDAP server. The common name identifier for most LDAP servers is "cn".
    default: cn
    max_length: 20
  dn:
    type: string
    raw_type: string
    description: Distinguished name used to look up entries on the LDAP server.
    max_length: 511
  group-filter:
    type: string
    raw_type: string
    description: Filter used for group matching.
    max_length: 2047
  group-member-check:
    type: enum
    raw_type: option
    description: Group member checking methods.
    default: user-attr
  group-object-filter:
    type: string
    raw_type: string
    description: Filter used for group searching.
    default: (&(objectcategory=group)(member=*))
    max_length: 2047
  group-search-base:
    type: string
    raw_type: string
    description: Search base used for group searching.
    max_length: 511
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  member-attr:
    type: string
    raw_type: string
    description: Name of attribute from which to get group membership.
    default: memberOf
    max_length: 63
  name:
    type: string
    raw_type: string
    description: LDAP server entry name.
    max_length: 35
  obtain-user-info:
    type: enum
    raw_type: option
    description: Enable/disable obtaining of user information.
    default: enable
  password:
    type: password
    raw_type: password
    description: Password for initial binding.
  password-attr:
    type: string
    raw_type: string
    description: Name of attribute to get password hash.
    default: userPassword
    max_length: 35
  password-expiry-warning:
    type: enum
    raw_type: option
    description: Enable/disable password expiry warnings.
    default: disable
  password-renewal:
    type: enum
    raw_type: option
    description: Enable/disable online password renewal.
    default: disable
  port:
    type: integer
    raw_type: integer
    description: Port to be used for communication with the LDAP server (default = 389).
    default: '389'
    min: 1
    max: 65535
  search-type:
    type: enum
    raw_type: option
    description: Search type.
  secondary-server:
    type: string
    raw_type: string
    description: Secondary LDAP server CN domain name or IP.
    max_length: 63
  secure:
    type: enum
    raw_type: option
    description: Port to be used for authentication.
    default: disable
  server:
    type: string
    raw_type: string
    description: LDAP server CN domain name or IP.
    max_length: 63
  server-identity-check:
    type: enum
    raw_type: option
    description: Enable/disable LDAP server identity check (verify server domain name/IP address against the server certificate).
    default: enable
  source-ip:
    type: string
    raw_type: string
    description: FortiGate IP address to be used for communication with the LDAP server.
    max_length: 63
  source-ip-interface:
    type: string
    raw_type: string
    description: Source interface for communication with the LDAP server.
    max_length: 15
  source-port:
    type: integer
    raw_type: integer
    description: Source port to be used for communication with the LDAP server.
    default: '0'
    min: 0
    max: 65535
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  status-ttl:
    type: integer
    raw_type: integer
    description: Time for which server reachability is cached so that when a server is unreachable, it will not be retried
      for at least this period of time (0 = cache disabled, default = 300).
    default: '300'
    min: 0
    max: 600
  tertiary-server:
    type: string
    raw_type: string
    description: Tertiary LDAP server CN domain name or IP.
    max_length: 63
  two-factor:
    type: enum
    raw_type: option
    description: Enable/disable two-factor authentication.
    default: disable
  two-factor-authentication:
    type: enum
    raw_type: option
    description: Authentication method by FortiToken Cloud.
  two-factor-filter:
    type: string
    raw_type: string
    description: Filter used to synchronize users to FortiToken Cloud.
    max_length: 2047
  two-factor-notification:
    type: enum
    raw_type: option
    description: Notification method for user activation by FortiToken Cloud.
  type:
    type: enum
    raw_type: option
    description: Authentication type for LDAP searches.
    default: simple
  user-info-exchange-server:
    type: string
    raw_type: string
    description: MS Exchange server from which to fetch user information.
    max_length: 35
  username:
    type: string
    raw_type: string
    description: Username (full DN) for initial binding.
    max_length: 511
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
