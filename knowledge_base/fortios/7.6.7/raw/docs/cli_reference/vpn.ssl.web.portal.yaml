id: vpn.ssl.web.portal
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/113121765/config-vpn-ssl-web-portal
attributes:
  allow-user-access:
    type: enum
    raw_type: option
    description: Allow user access to Agentless VPN applications.
    default: web ftp smb sftp telnet ssh vnc rdp ping
  clipboard:
    type: enum
    raw_type: option
    description: Enable to support RDP/VPC clipboard functionality.
    default: enable
  custom-lang:
    type: string
    raw_type: string
    description: Change the web portal display language. Overrides config system global set language. You can use config system
      custom-language and execute system custom-language to add custom language files.
    max_length: 35
  default-protocol:
    type: enum
    raw_type: option
    description: Application type that is set by default.
    default: web
  default-window-height:
    type: integer
    raw_type: integer
    description: Screen height (range from 0 - 65535, default = 768).
    default: '768'
    min: 0
    max: 65535
  default-window-width:
    type: integer
    raw_type: integer
    description: Screen width (range from 0 - 65535, default = 1024).
    default: '1024'
    min: 0
    max: 65535
  display-bookmark:
    type: enum
    raw_type: option
    description: Enable to display the web portal bookmark widget.
    default: enable
  display-connection-tools:
    type: enum
    raw_type: option
    description: Enable to display the web portal connection tools widget.
    default: enable
  display-history:
    type: enum
    raw_type: option
    description: Enable to display the web portal user login history widget.
    default: enable
  display-status:
    type: enum
    raw_type: option
    description: Enable to display the web portal status widget.
    default: enable
  dns-suffix:
    type: string
    raw_type: var-string
    description: DNS suffix.
    max_length: 253
  focus-bookmark:
    type: enum
    raw_type: option
    description: Enable to prioritize the placement of the bookmark section over the quick-connection section in the Agentless
      VPN application.
    default: disable
  heading:
    type: string
    raw_type: string
    description: Web portal heading message.
    default: Agentless VPN Portal
    max_length: 31
  hide-sso-credential:
    type: enum
    raw_type: option
    description: Enable to prevent SSO credential being sent to client.
    default: enable
  landing-page-mode:
    type: enum
    raw_type: option
    description: Enable/disable Agentless VPN landing page mode.
    default: disable
  limit-user-logins:
    type: enum
    raw_type: option
    description: Enable to limit each user to one Agentless VPN session at a time.
    default: disable
  name:
    type: string
    raw_type: string
    description: Portal name.
    max_length: 35
  prefer-ipv6-dns:
    type: enum
    raw_type: option
    description: Prefer to query IPv6 DNS server first if enabled.
    default: disable
  redir-url:
    type: string
    raw_type: var-string
    description: Client login redirect URL.
    max_length: 255
  rewrite-ip-uri-ui:
    type: enum
    raw_type: option
    description: Rewrite contents for URI contains IP and /ui/ (default = disable).
    default: disable
  smb-max-version:
    type: enum
    raw_type: option
    description: SMB maximum client protocol version.
    default: smbv3
  smb-min-version:
    type: enum
    raw_type: option
    description: SMB minimum client protocol version.
    default: smbv2
  smb-ntlmv1-auth:
    type: enum
    raw_type: option
    description: Enable support of NTLMv1 for Samba authentication.
    default: disable
  smbv1:
    type: enum
    raw_type: option
    description: SMB version 1.
    default: disable
  theme:
    type: enum
    raw_type: option
    description: Web portal color scheme.
    default: security-fabric
  use-sdwan:
    type: enum
    raw_type: option
    description: Use SD-WAN rules to get output interface.
    default: disable
  user-bookmark:
    type: enum
    raw_type: option
    description: Enable to allow web portal users to create their own bookmarks.
    default: enable
  user-group-bookmark:
    type: enum
    raw_type: option
    description: Enable to allow web portal users to create bookmarks for all users in the same user group.
    default: enable
  web-mode:
    type: enum
    raw_type: option
    description: Enable/disable Agentless VPN web mode.
    default: disable
children:
  bookmark-group:
    attributes:
      name:
        type: string
        raw_type: string
        description: Bookmark group name.
        max_length: 35
  bookmarks:
    attributes:
      additional-params:
        type: string
        raw_type: var-string
        description: Additional parameters.
        max_length: 128
      apptype:
        type: enum
        raw_type: option
        description: Application type.
        default: web
      color-depth:
        type: enum
        raw_type: option
        description: Color depth per pixel.
        default: '16'
      description:
        type: string
        raw_type: var-string
        description: Description.
        max_length: 128
      domain:
        type: string
        raw_type: var-string
        description: Login domain.
        max_length: 128
      folder:
        type: string
        raw_type: var-string
        description: Network shared file folder parameter.
        max_length: 128
      height:
        type: integer
        raw_type: integer
        description: Screen height (range from 0 - 65535, default = 0).
        default: '0'
        min: 0
        max: 65535
      host:
        type: string
        raw_type: var-string
        description: Host name/IP parameter.
        max_length: 128
      keyboard-layout:
        type: enum
        raw_type: option
        description: Keyboard layout.
        default: en-us
      load-balancing-info:
        type: string
        raw_type: var-string
        description: The load balancing information or cookie which should be provided to the connection broker.
        max_length: 511
      logon-password:
        type: password
        raw_type: password
        description: Logon password.
      logon-user:
        type: string
        raw_type: var-string
        description: Logon user.
        max_length: 35
      name:
        type: string
        raw_type: string
        description: Bookmark name.
        max_length: 35
      port:
        type: integer
        raw_type: integer
        description: Remote port.
        default: '0'
        min: 0
        max: 65535
      preconnection-blob:
        type: string
        raw_type: var-string
        description: An arbitrary string which identifies the RDP source.
        max_length: 511
      preconnection-id:
        type: integer
        raw_type: integer
        description: The numeric ID of the RDP source (0-4294967295).
        default: '0'
        min: 0
        max: 4294967295
      restricted-admin:
        type: enum
        raw_type: option
        description: Enable/disable restricted admin mode for RDP.
        default: disable
      security:
        type: enum
        raw_type: option
        description: Security mode for RDP connection (default = any).
        default: any
      send-preconnection-id:
        type: enum
        raw_type: option
        description: Enable/disable sending of preconnection ID.
        default: disable
      sso:
        type: enum
        raw_type: option
        description: Single sign-on.
        default: disable
      sso-credential:
        type: enum
        raw_type: option
        description: Single sign-on credentials.
        default: sslvpn-login
      sso-credential-sent-once:
        type: enum
        raw_type: option
        description: Single sign-on credentials are only sent once to remote server.
        default: disable
      sso-password:
        type: password
        raw_type: password
        description: SSO password.
      sso-username:
        type: string
        raw_type: var-string
        description: SSO user name.
        max_length: 35
      url:
        type: string
        raw_type: var-string
        description: URL parameter.
        max_length: 128
      vnc-keyboard-layout:
        type: enum
        raw_type: option
        description: Keyboard layout.
        default: default
      width:
        type: integer
        raw_type: integer
        description: Screen width (range from 0 - 65535, default = 0).
        default: '0'
        min: 0
        max: 65535
  landing-page:
    attributes:
      sso:
        type: enum
        raw_type: option
        description: Single sign-on.
        default: disable
      sso-credential:
        type: enum
        raw_type: option
        description: Single sign-on credentials.
        default: sslvpn-login
      sso-password:
        type: password
        raw_type: password
        description: SSO password.
      sso-username:
        type: string
        raw_type: var-string
        description: SSO user name.
        max_length: 35
      url:
        type: string
        raw_type: var-string
        description: Landing page URL.
        max_length: 511
  form-data:
    attributes:
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
      value:
        type: string
        raw_type: var-string
        description: Value.
        max_length: 63
