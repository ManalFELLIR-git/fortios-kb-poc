id: wireless-controller.bonjour-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/201953780/config-wireless-controller-bonjour-profile
attributes:
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  micro-location:
    type: enum
    raw_type: option
    description: Enable/disable Micro location for Bonjour profile (default = disable).
    default: disable
  name:
    type: string
    raw_type: string
    description: Bonjour profile name.
    max_length: 35
children:
  policy-list:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description.
        max_length: 63
      from-vlan:
        type: string
        raw_type: string
        description: VLAN ID from which the Bonjour service is advertised (0 - 4094, default = 0).
        default: '0'
        max_length: 63
      policy-id:
        type: integer
        raw_type: integer
        description: Policy ID.
        default: '0'
        min: 1
        max: 65535
      services:
        type: enum
        raw_type: option
        description: Bonjour services for the VLAN connecting to the Bonjour network.
        default: all
      to-vlan:
        type: string
        raw_type: string
        description: VLAN ID to which the Bonjour service is made available (0 - 4094, default = all).
        default: all
        max_length: 63
