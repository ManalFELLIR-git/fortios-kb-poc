id: webfilter.ips-urlfilter-cache-setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/460196578/config-webfilter-ips-urlfilter-cache-setting
attributes:
  dns-retry-interval:
    type: integer
    raw_type: integer
    description: Retry interval. Refresh DNS faster than TTL to capture multiple IPs for hosts. 0 means use DNS server's TTL
      only.
    default: '0'
    min: 0
    max: 2147483
  extended-ttl:
    type: integer
    raw_type: integer
    description: Extend time to live beyond reported by DNS. Use of 0 means use DNS server's TTL.
    default: '0'
    min: 0
    max: 2147483
children: {}
