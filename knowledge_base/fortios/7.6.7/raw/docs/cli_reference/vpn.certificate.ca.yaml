id: vpn.certificate.ca
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/144962638/config-vpn-certificate-ca
attributes:
  auto-update-days:
    type: integer
    raw_type: integer
    description: Number of days to wait before requesting an updated CA certificate (0 - 4294967295, 0 = disabled).
    default: '0'
    min: 0
    max: 4294967295
  auto-update-days-warning:
    type: integer
    raw_type: integer
    description: Number of days before an expiry-warning message is generated (0 - 4294967295, 0 = disabled).
    default: '0'
    min: 0
    max: 4294967295
  ca:
    type: string
    raw_type: user
    description: CA certificate as a PEM file.
  ca-identifier:
    type: string
    raw_type: string
    description: CA identifier of the SCEP server.
    max_length: 255
  est-url:
    type: string
    raw_type: string
    description: URL of the EST server.
    max_length: 255
  fabric-ca:
    type: enum
    raw_type: option
    description: Enable/disable synchronization of CA across Security Fabric.
    default: disable
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 79
  obsolete:
    type: enum
    raw_type: option
    description: Enable/disable this CA as obsoleted.
    default: disable
  range:
    type: enum
    raw_type: option
    description: Either global or VDOM IP address range for the CA certificate.
    default: vdom
  scep-url:
    type: string
    raw_type: string
    description: URL of the SCEP server.
    max_length: 255
  source:
    type: enum
    raw_type: option
    description: CA certificate source type.
    default: user
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address for communications to the SCEP server.
    default: 0.0.0.0
  ssl-inspection-trusted:
    type: enum
    raw_type: option
    description: Enable/disable this CA as a trusted CA for SSL inspection.
    default: enable
children: {}
