id: system.ssh-config
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/207795941/config-system-ssh-config
attributes:
  ssh-enc-algo:
    type: enum
    raw_type: option
    description: Select one or more SSH ciphers.
    default: aes256-ctr aes256-gcm@openssh.com
  ssh-hsk:
    type: string
    raw_type: user
    description: Config SSH host key.
  ssh-hsk-algo:
    type: enum
    raw_type: option
    description: Select one or more SSH hostkey algorithms.
    default: ecdsa-sha2-nistp521 ecdsa-sha2-nistp384 ecdsa-sha2-nistp256 rsa-sha2-256 rsa-sha2-512 ssh-ed25519
  ssh-hsk-override:
    type: enum
    raw_type: option
    description: Enable/disable SSH host key override in SSH daemon.
    default: disable
  ssh-hsk-password:
    type: password
    raw_type: password
    description: Password for ssh-hostkey.
  ssh-kex-algo:
    type: enum
    raw_type: option
    description: Select one or more SSH kex algorithms.
    default: diffie-hellman-group14-sha256 diffie-hellman-group16-sha512 diffie-hellman-group18-sha512 diffie-hellman-group-exchange-sha256
      curve25519-sha256@libssh.org ecdh-sha2-nistp256 ecdh-sha2-nistp384 ecdh-sha2-nistp521
  ssh-mac-algo:
    type: enum
    raw_type: option
    description: Select one or more SSH MAC algorithms.
    default: hmac-sha2-256 hmac-sha2-256-etm@openssh.com hmac-sha2-512 hmac-sha2-512-etm@openssh.com
children: {}
