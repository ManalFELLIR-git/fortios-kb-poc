id: switch-controller.custom-command
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/454027989/config-switch-controller-custom-command
attributes:
  command:
    type: string
    raw_type: var-string
    description: 'String of commands to send to FortiSwitch devices (For example (%0a = return key): config switch trunk %0a
      edit myTrunk %0a set members port1 port2 %0a end %0a).'
    max_length: 4095
  command-name:
    type: string
    raw_type: string
    description: Command name called by the FortiGate switch controller in the execute command.
    max_length: 35
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 35
children: {}
