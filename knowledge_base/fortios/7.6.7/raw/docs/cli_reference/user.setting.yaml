id: user.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/263822197/config-user-setting
attributes:
  auth-blackout-time:
    type: integer
    raw_type: integer
    description: Time in seconds an IP address is denied access after failing to authenticate five times within one minute.
    default: '0'
    min: 0
    max: 3600
  auth-ca-cert:
    type: string
    raw_type: string
    description: HTTPS CA certificate for policy authentication.
    max_length: 35
  auth-cert:
    type: string
    raw_type: string
    description: HTTPS server certificate for policy authentication.
    max_length: 35
  auth-http-basic:
    type: enum
    raw_type: option
    description: Enable/disable use of HTTP basic authentication for identity-based firewall policies.
    default: disable
  auth-invalid-max:
    type: integer
    raw_type: integer
    description: Maximum number of failed authentication attempts before the user is blocked.
    default: '5'
    min: 1
    max: 100
  auth-lockout-duration:
    type: integer
    raw_type: integer
    description: Lockout period in seconds after too many login failures.
    default: '0'
    min: 0
    max: 4294967295
  auth-lockout-threshold:
    type: integer
    raw_type: integer
    description: Maximum number of failed login attempts before login lockout is triggered.
    default: '3'
    min: 1
    max: 10
  auth-on-demand:
    type: enum
    raw_type: option
    description: Always/implicitly trigger firewall authentication on demand.
    default: implicitly
  auth-portal-timeout:
    type: integer
    raw_type: integer
    description: Time in minutes before captive portal user have to re-authenticate (1 - 30 min, default 3 min).
    default: '3'
    min: 1
    max: 30
  auth-secure-http:
    type: enum
    raw_type: option
    description: Enable/disable redirecting HTTP user authentication to more secure HTTPS.
    default: disable
  auth-src-mac:
    type: enum
    raw_type: option
    description: Enable/disable source MAC for user identity.
    default: enable
  auth-ssl-allow-renegotiation:
    type: enum
    raw_type: option
    description: Allow/forbid SSL re-negotiation for HTTPS authentication.
    default: disable
  auth-ssl-max-proto-version:
    type: enum
    raw_type: option
    description: Maximum supported protocol version for SSL/TLS connections (default is no limit).
  auth-ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  auth-ssl-sigalgs:
    type: enum
    raw_type: option
    description: Set signature algorithms related to HTTPS authentication (affects TLS version <= 1.2 only, default is to
      enable all).
    default: all
  auth-timeout:
    type: integer
    raw_type: integer
    description: Time in minutes before the firewall user authentication timeout requires the user to re-authenticate.
    default: '5'
    min: 1
    max: 1440
  auth-timeout-type:
    type: enum
    raw_type: option
    description: Control if authenticated users have to login again after a hard timeout, after an idle timeout, or after
      a session timeout.
    default: idle-timeout
  auth-type:
    type: enum
    raw_type: option
    description: Supported firewall policy authentication protocols/methods.
    default: http https ftp telnet
  cors:
    type: enum
    raw_type: option
    description: Enable/disable allowed origins white list for CORS.
    default: disable
  cors-allowed-origins:
    type: string
    raw_type: string
    description: Allowed origins white list for CORS. Allowed origin for CORS.
    max_length: 79
  default-user-password-policy:
    type: string
    raw_type: string
    description: Default password policy to apply to all local users unless otherwise specified, as defined in config user
      password-policy.
    max_length: 35
  per-policy-disclaimer:
    type: enum
    raw_type: option
    description: Enable/disable per policy disclaimer.
    default: disable
  radius-ses-timeout-act:
    type: enum
    raw_type: option
    description: Set the RADIUS session timeout to a hard timeout or to ignore RADIUS server session timeouts.
    default: hard-timeout
children:
  auth-ports:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      port:
        type: integer
        raw_type: integer
        description: Non-standard port for firewall user authentication.
        default: '1024'
        min: 1
        max: 65535
      type:
        type: enum
        raw_type: option
        description: Service type.
        default: http
