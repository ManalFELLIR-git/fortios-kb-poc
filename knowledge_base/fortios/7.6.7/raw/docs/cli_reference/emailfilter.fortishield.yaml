id: emailfilter.fortishield
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/733514645/config-emailfilter-fortishield
attributes:
  spam-submit-force:
    type: enum
    raw_type: option
    description: Enable/disable force insertion of a new mime entity for the submission text.
    default: enable
  spam-submit-srv:
    type: string
    raw_type: string
    description: Hostname of the spam submission server.
    default: www.nospammer.net
    max_length: 63
  spam-submit-txt2htm:
    type: enum
    raw_type: option
    description: Enable/disable conversion of text email to HTML email.
    default: enable
children: {}
