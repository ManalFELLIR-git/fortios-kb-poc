id: switch-controller.traffic-sniffer
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/495835893/config-switch-controller-traffic-sniffer
attributes:
  erspan-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Configure ERSPAN collector IP address.
    default: 0.0.0.0
  mode:
    type: enum
    raw_type: option
    description: Configure traffic sniffer mode.
    default: erspan-auto
children:
  target-ip:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description for the sniffer IP.
        max_length: 63
      ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Sniffer IP.
        default: 0.0.0.0
  target-mac:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description for the sniffer MAC.
        max_length: 63
      mac:
        type: mac-address
        raw_type: mac-address
        description: Sniffer MAC.
        default: 00:00:00:00:00:00
  target-port:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description for the sniffer port entry.
        max_length: 63
      in-ports:
        type: string
        raw_type: string
        description: Configure source ingress port interfaces. Interface name.
        max_length: 79
      out-ports:
        type: string
        raw_type: string
        description: Configure source egress port interfaces. Interface name.
        max_length: 79
      switch-id:
        type: string
        raw_type: string
        description: Managed-switch ID.
        max_length: 35
