id: dlp.label
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/189827090/config-dlp-label
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  connector:
    type: string
    raw_type: string
    description: Name of SDN connector.
    max_length: 35
  mpip-type:
    type: enum
    raw_type: option
    description: MPIP label type.
    default: remote
  name:
    type: string
    raw_type: string
    description: Name of table containing the label.
    max_length: 35
  type:
    type: enum
    raw_type: option
    description: Label type.
    default: mpip
children:
  entries:
    attributes:
      fortidata-label-name:
        type: string
        raw_type: string
        description: Name of FortiData label
        max_length: 127
      guid:
        type: string
        raw_type: string
        description: MPIP label guid.
        max_length: 36
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 1
        max: 32
      mpip-label-name:
        type: string
        raw_type: string
        description: Name of MPIP label.
        max_length: 127
