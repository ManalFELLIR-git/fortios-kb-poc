id: firewall.local-in-policy6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/871912328/config-firewall-local-in-policy6
attributes:
  action:
    type: enum
    raw_type: option
    description: Action performed on traffic matching the policy (default = deny).
    default: deny
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dstaddr:
    type: string
    raw_type: string
    description: Destination address object from available options. Address name.
    max_length: 79
  dstaddr-negate:
    type: enum
    raw_type: option
    description: When enabled dstaddr specifies what the destination address must NOT be.
    default: disable
  internet-service6-src:
    type: enum
    raw_type: option
    description: Enable/disable use of IPv6 Internet Services in source for this local-in policy.If enabled, source address
      is not used.
    default: disable
  internet-service6-src-custom:
    type: string
    raw_type: string
    description: Custom IPv6 Internet Service source name. Custom Internet Service name.
    max_length: 79
  internet-service6-src-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service6 source group name. Custom Internet Service6 group name.
    max_length: 79
  internet-service6-src-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard IPv6 Internet Service source name. FortiGuard Internet Service name.
    max_length: 79
  internet-service6-src-group:
    type: string
    raw_type: string
    description: Internet Service6 source group name. Internet Service group name.
    max_length: 79
  internet-service6-src-name:
    type: string
    raw_type: string
    description: IPv6 Internet Service source name. Internet Service name.
    max_length: 79
  internet-service6-src-negate:
    type: enum
    raw_type: option
    description: When enabled internet-service6-src specifies what the service must NOT be.
    default: disable
  intf:
    type: string
    raw_type: string
    description: Incoming interface name from available options. Address name.
    max_length: 79
  logtraffic:
    type: enum
    raw_type: option
    description: Enable/disable local-in traffic logging.
    default: disable
  policyid:
    type: integer
    raw_type: integer
    description: User defined local in policy ID.
    default: '0'
    min: 0
    max: 4294967295
  schedule:
    type: string
    raw_type: string
    description: Schedule object from available options.
    max_length: 35
  service:
    type: string
    raw_type: string
    description: Service object from available options. Separate names with a space. Service name.
    max_length: 79
  service-negate:
    type: enum
    raw_type: option
    description: When enabled service specifies what the service must NOT be.
    default: disable
  srcaddr:
    type: string
    raw_type: string
    description: Source address object from available options. Address name.
    max_length: 79
  srcaddr-negate:
    type: enum
    raw_type: option
    description: When enabled srcaddr specifies what the source address must NOT be.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable this local-in policy.
    default: enable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  virtual-patch:
    type: enum
    raw_type: option
    description: Enable/disable the virtual patching feature.
    default: disable
children: {}
