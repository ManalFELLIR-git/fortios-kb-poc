id: system.modem
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/229069641/config-system-modem
attributes:
  action:
    type: enum
    raw_type: option
    description: Dial up/stop MODEM.
    default: stop
  altmode:
    type: enum
    raw_type: option
    description: Enable/disable altmode for installations using PPP in China.
    default: enable
  authtype1:
    type: enum
    raw_type: option
    description: Allowed authentication types for ISP 1.
    default: pap chap mschap mschapv2
  authtype2:
    type: enum
    raw_type: option
    description: Allowed authentication types for ISP 2.
    default: pap chap mschap mschapv2
  authtype3:
    type: enum
    raw_type: option
    description: Allowed authentication types for ISP 3.
    default: pap chap mschap mschapv2
  auto-dial:
    type: enum
    raw_type: option
    description: Enable/disable auto-dial after a reboot or disconnection.
    default: disable
  connect-timeout:
    type: integer
    raw_type: integer
    description: Connection completion timeout (30 - 255 sec, default = 90).
    default: '90'
    min: 30
    max: 255
  dial-cmd1:
    type: string
    raw_type: string
    description: Dial command (this is often an ATD or ATDT command).
    max_length: 63
  dial-cmd2:
    type: string
    raw_type: string
    description: Dial command (this is often an ATD or ATDT command).
    max_length: 63
  dial-cmd3:
    type: string
    raw_type: string
    description: Dial command (this is often an ATD or ATDT command).
    max_length: 63
  dial-on-demand:
    type: enum
    raw_type: option
    description: Enable/disable to dial the modem when packets are routed to the modem interface.
    default: disable
  distance:
    type: integer
    raw_type: integer
    description: Distance of learned routes (1 - 255, default = 1).
    default: '1'
    min: 1
    max: 255
  dont-send-CR1:
    type: enum
    raw_type: option
    description: Do not send CR when connected (ISP1).
    default: disable
  dont-send-CR2:
    type: enum
    raw_type: option
    description: Do not send CR when connected (ISP2).
    default: disable
  dont-send-CR3:
    type: enum
    raw_type: option
    description: Do not send CR when connected (ISP3).
    default: disable
  extra-init1:
    type: string
    raw_type: string
    description: Extra initialization string to ISP 1.
    max_length: 127
  extra-init2:
    type: string
    raw_type: string
    description: Extra initialization string to ISP 2.
    max_length: 127
  extra-init3:
    type: string
    raw_type: string
    description: Extra initialization string to ISP 3.
    max_length: 127
  holddown-timer:
    type: integer
    raw_type: integer
    description: Hold down timer in seconds (1 - 60 sec).
    default: '60'
    min: 1
    max: 60
  idle-timer:
    type: integer
    raw_type: integer
    description: MODEM connection idle time (1 - 9999 min, default = 5).
    default: '5'
    min: 1
    max: 9999
  interface:
    type: string
    raw_type: string
    description: Name of redundant interface.
    max_length: 63
  lockdown-lac:
    type: string
    raw_type: string
    description: Allow connection only to the specified Location Area Code (LAC).
    max_length: 127
  mode:
    type: enum
    raw_type: option
    description: Set MODEM operation mode to redundant or standalone.
    default: standalone
  network-init:
    type: string
    raw_type: string
    description: AT command to set the Network name/type (AT+COPS=<mode>,[<format>,<oper>[,<AcT>]]).
    max_length: 127
  passwd1:
    type: password
    raw_type: password
    description: Password to access the specified dialup account.
  passwd2:
    type: password
    raw_type: password
    description: Password to access the specified dialup account.
  passwd3:
    type: password
    raw_type: password
    description: Password to access the specified dialup account.
  peer-modem1:
    type: enum
    raw_type: option
    description: Specify peer MODEM type for phone1.
    default: generic
  peer-modem2:
    type: enum
    raw_type: option
    description: Specify peer MODEM type for phone2.
    default: generic
  peer-modem3:
    type: enum
    raw_type: option
    description: Specify peer MODEM type for phone3.
    default: generic
  phone1:
    type: string
    raw_type: string
    description: Phone number to connect to the dialup account (must not contain spaces, and should include standard special
      characters).
    max_length: 63
  phone2:
    type: string
    raw_type: string
    description: Phone number to connect to the dialup account (must not contain spaces, and should include standard special
      characters).
    max_length: 63
  phone3:
    type: string
    raw_type: string
    description: Phone number to connect to the dialup account (must not contain spaces, and should include standard special
      characters).
    max_length: 63
  pin-init:
    type: string
    raw_type: string
    description: AT command to set the PIN (AT+PIN=<pin>).
    max_length: 127
  ppp-echo-request1:
    type: enum
    raw_type: option
    description: Enable/disable PPP echo-request to ISP 1.
    default: enable
  ppp-echo-request2:
    type: enum
    raw_type: option
    description: Enable/disable PPP echo-request to ISP 2.
    default: enable
  ppp-echo-request3:
    type: enum
    raw_type: option
    description: Enable/disable PPP echo-request to ISP 3.
    default: enable
  priority:
    type: integer
    raw_type: integer
    description: Priority of learned routes (1 - 65535, default = 1).
    default: '1'
    min: 1
    max: 65535
  redial:
    type: enum
    raw_type: option
    description: Redial limit (1 - 10 attempts, none = redial forever).
    default: none
  reset:
    type: integer
    raw_type: integer
    description: Number of dial attempts before resetting modem (0 = never reset).
    default: '0'
    min: 0
    max: 10
  status:
    type: enum
    raw_type: option
    description: Enable/disable Modem support (equivalent to bringing an interface up or down).
    default: disable
  traffic-check:
    type: enum
    raw_type: option
    description: Enable/disable traffic-check.
    default: disable
  username1:
    type: string
    raw_type: string
    description: User name to access the specified dialup account.
    max_length: 63
  username2:
    type: string
    raw_type: string
    description: User name to access the specified dialup account.
    max_length: 63
  username3:
    type: string
    raw_type: string
    description: User name to access the specified dialup account.
    max_length: 63
  wireless-port:
    type: integer
    raw_type: integer
    description: 'Enter wireless port number: 0 for default, 1 for first port, and so on (0 - 4294967295).'
    default: '0'
    min: 0
    max: 4294967295
children: {}
