id: system.email-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/328340547/config-system-email-server
attributes:
  authenticate:
    type: enum
    raw_type: option
    description: Enable/disable authentication.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  password:
    type: password
    raw_type: password
    description: SMTP server user password for authentication.
  port:
    type: integer
    raw_type: integer
    description: SMTP server port. This option is 25 when unset, but 465 after a factory reset.
    default: '25'
    min: 1
    max: 65535
  security:
    type: enum
    raw_type: option
    description: Connection security used by the email server. This option is none when unset, but smtps after a factory reset.
    default: none
  server:
    type: string
    raw_type: string
    description: SMTP server IP address or hostname. This option is blank when unset, but fortinet-notifications.com after
      a factory reset.
    max_length: 63
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: SMTP server IPv4 source IP.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: SMTP server IPv6 source IP.
    default: '::'
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  type:
    type: enum
    raw_type: option
    description: Use FortiGuard Message service or custom email server.
    default: custom
  username:
    type: string
    raw_type: string
    description: SMTP server user name for authentication.
    max_length: 255
  validate-server:
    type: enum
    raw_type: option
    description: Enable/disable validation of server certificate.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
