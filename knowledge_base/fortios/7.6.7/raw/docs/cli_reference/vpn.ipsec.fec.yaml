id: vpn.ipsec.fec
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/278722418/config-vpn-ipsec-fec
attributes:
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 35
children:
  mappings:
    attributes:
      bandwidth-bi-threshold:
        type: integer
        raw_type: integer
        description: Apply FEC parameters when available bi-bandwidth is >= threshold (kbps, 0 means no threshold).
        default: '0'
        min: 0
        max: 4294967295
      bandwidth-down-threshold:
        type: integer
        raw_type: integer
        description: Apply FEC parameters when available down bandwidth is >= threshold (kbps, 0 means no threshold).
        default: '0'
        min: 0
        max: 4294967295
      bandwidth-up-threshold:
        type: integer
        raw_type: integer
        description: Apply FEC parameters when available up bandwidth is >= threshold (kbps, 0 means no threshold).
        default: '0'
        min: 0
        max: 4294967295
      base:
        type: integer
        raw_type: integer
        description: Number of base FEC packets (1 - 20).
        default: '0'
        min: 1
        max: 20
      latency-threshold:
        type: integer
        raw_type: integer
        description: Apply FEC parameters when latency is <= threshold (0 means no threshold).
        default: '0'
        min: 0
        max: 4294967295
      packet-loss-threshold:
        type: integer
        raw_type: integer
        description: Apply FEC parameters when packet loss is >= threshold (0 - 100, 0 means no threshold).
        default: '0'
        min: 0
        max: 100
      redundant:
        type: integer
        raw_type: integer
        description: Number of redundant FEC packets (1 - 5).
        default: '0'
        min: 1
        max: 5
      seqno:
        type: integer
        raw_type: integer
        description: Sequence number (1 - 64).
        default: '0'
        min: 0
        max: 64
