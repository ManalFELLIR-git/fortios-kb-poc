id: vpn.pptp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/830118878/config-vpn-pptp
attributes:
  eip:
    type: ipv4-address
    raw_type: ipv4-address
    description: End IP.
    default: 0.0.0.0
  ip-mode:
    type: enum
    raw_type: option
    description: IP assignment mode for PPTP client.
    default: range
  local-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Local IP to be used for peer's remote IP.
    default: 0.0.0.0
  sip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Start IP.
    default: 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable/disable FortiGate as a PPTP gateway.
    default: disable
  usrgrp:
    type: string
    raw_type: string
    description: User group.
    max_length: 35
children: {}
