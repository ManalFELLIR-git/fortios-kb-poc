id: webfilter.ips-urlfilter-setting6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/167419833/config-webfilter-ips-urlfilter-setting6
attributes:
  device:
    type: string
    raw_type: string
    description: Interface for this route.
    max_length: 35
  distance:
    type: integer
    raw_type: integer
    description: Administrative distance (1 - 255) for this route.
    default: '1'
    min: 1
    max: 255
  gateway6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Gateway IPv6 address for this route.
    default: '::'
  geo-filter:
    type: string
    raw_type: var-string
    description: Filter based on geographical location. Route will NOT be installed if the resolved IPv6 address belongs to
      the country in the filter.
    max_length: 255
children: {}
