id: system.ha-monitor
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/324669782/config-system-ha-monitor
attributes:
  monitor-vlan:
    type: enum
    raw_type: option
    description: Enable/disable monitor VLAN interfaces.
    default: disable
  vlan-hb-interval:
    type: integer
    raw_type: integer
    description: Configure heartbeat interval (seconds).
    default: '5'
    min: 1
    max: 30
  vlan-hb-lost-threshold:
    type: integer
    raw_type: integer
    description: VLAN lost heartbeat threshold (1 - 60).
    default: '3'
    min: 1
    max: 60
children: {}
