id: system.arp-table
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/121274056/config-system-arp-table
attributes:
  id:
    type: integer
    raw_type: integer
    description: Unique integer ID of the entry.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 15
  ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address.
    default: 0.0.0.0
  mac:
    type: mac-address
    raw_type: mac-address
    description: MAC address.
    default: 00:00:00:00:00:00
children: {}
