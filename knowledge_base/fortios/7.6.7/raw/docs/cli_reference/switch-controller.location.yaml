id: switch-controller.location
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/900314841/config-switch-controller-location
attributes:
  name:
    type: string
    raw_type: string
    description: Unique location item name.
    max_length: 63
children:
  address-civic:
    attributes:
      additional:
        type: string
        raw_type: string
        description: Location additional details.
        max_length: 47
      additional-code:
        type: string
        raw_type: string
        description: Location additional code details.
        max_length: 47
      block:
        type: string
        raw_type: string
        description: Location block details.
        max_length: 47
      branch-road:
        type: string
        raw_type: string
        description: Location branch road details.
        max_length: 47
      building:
        type: string
        raw_type: string
        description: Location building details.
        max_length: 47
      city:
        type: string
        raw_type: string
        description: Location city details.
        max_length: 47
      city-division:
        type: string
        raw_type: string
        description: Location city division details.
        max_length: 47
      country:
        type: string
        raw_type: string
        description: The two-letter ISO 3166 country code in capital ASCII letters eg. US, CA, DK, DE.
        max_length: 47
      country-subdivision:
        type: string
        raw_type: string
        description: National subdivisions (state, canton, region, province, or prefecture).
        max_length: 47
      county:
        type: string
        raw_type: string
        description: County, parish, gun (JP), or district (IN).
        max_length: 47
      direction:
        type: string
        raw_type: string
        description: Leading street direction.
        max_length: 47
      floor:
        type: string
        raw_type: string
        description: Floor.
        max_length: 47
      landmark:
        type: string
        raw_type: string
        description: Landmark or vanity address.
        max_length: 47
      language:
        type: string
        raw_type: string
        description: Language.
        max_length: 47
      name:
        type: string
        raw_type: string
        description: Name (residence and office occupant).
        max_length: 47
      number:
        type: string
        raw_type: string
        description: House number.
        max_length: 47
      number-suffix:
        type: string
        raw_type: string
        description: House number suffix.
        max_length: 47
      parent-key:
        type: string
        raw_type: string
        description: Parent key name. Read-only.
        max_length: 63
      place-type:
        type: string
        raw_type: string
        description: Place type.
        max_length: 47
      post-office-box:
        type: string
        raw_type: string
        description: Post office box.
        max_length: 47
      postal-community:
        type: string
        raw_type: string
        description: Postal community name.
        max_length: 47
      primary-road:
        type: string
        raw_type: string
        description: Primary road name.
        max_length: 47
      road-section:
        type: string
        raw_type: string
        description: Road section.
        max_length: 47
      room:
        type: string
        raw_type: string
        description: Room number.
        max_length: 47
      script:
        type: string
        raw_type: string
        description: Script used to present the address information.
        max_length: 47
      seat:
        type: string
        raw_type: string
        description: Seat number.
        max_length: 47
      street:
        type: string
        raw_type: string
        description: Street.
        max_length: 47
      street-name-post-mod:
        type: string
        raw_type: string
        description: Street name post modifier.
        max_length: 47
      street-name-pre-mod:
        type: string
        raw_type: string
        description: Street name pre modifier.
        max_length: 47
      street-suffix:
        type: string
        raw_type: string
        description: Street suffix.
        max_length: 47
      sub-branch-road:
        type: string
        raw_type: string
        description: Sub branch road name.
        max_length: 47
      trailing-str-suffix:
        type: string
        raw_type: string
        description: Trailing street suffix.
        max_length: 47
      unit:
        type: string
        raw_type: string
        description: Unit (apartment, suite).
        max_length: 47
      zip:
        type: string
        raw_type: string
        description: Postal/zip code.
        max_length: 47
  coordinates:
    attributes:
      altitude:
        type: string
        raw_type: string
        description: Plus or minus floating point number. For example, 117.47.
        max_length: 15
      altitude-unit:
        type: enum
        raw_type: option
        description: Configure the unit for which the altitude is to (m = meters, f = floors of a building).
        default: m
      datum:
        type: enum
        raw_type: option
        description: WGS84, NAD83, NAD83/MLLW.
        default: WGS84
      latitude:
        type: string
        raw_type: string
        description: Floating point starting with +/- or ending with (N or S). For example, +/-16.67 or 16.67N.
        max_length: 15
      longitude:
        type: string
        raw_type: string
        description: Floating point starting with +/- or ending with (N or S). For example, +/-26.789 or 26.789E.
        max_length: 15
      parent-key:
        type: string
        raw_type: string
        description: Parent key name. Read-only.
        max_length: 63
  elin-number:
    attributes:
      elin-num:
        type: string
        raw_type: string
        description: Configure ELIN callback number.
        max_length: 31
      parent-key:
        type: string
        raw_type: string
        description: Parent key name. Read-only.
        max_length: 63
