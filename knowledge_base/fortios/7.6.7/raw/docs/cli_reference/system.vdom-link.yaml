id: system.vdom-link
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/232114316/config-system-vdom-link
attributes:
  name:
    type: string
    raw_type: string
    description: VDOM link name (maximum = 11 characters).
    max_length: 11
  type:
