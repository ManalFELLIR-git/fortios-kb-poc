id: wireless-controller.hotspot20.anqp-3gpp-cellular
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/112182140/config-wireless-controller-hotspot20-anqp-3gpp-cellular
attributes:
  name:
    type: string
    raw_type: string
    description: 3GPP PLMN name.
    max_length: 35
children:
  mcc-mnc-list:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 1
        max: 6
      mcc:
        type: string
        raw_type: string
        description: Mobile country code.
        max_length: 3
      mnc:
        type: string
        raw_type: string
        description: Mobile network code.
        max_length: 3
