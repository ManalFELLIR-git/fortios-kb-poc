id: switch-controller.global
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/265637966/config-switch-controller-global
attributes:
  bounce-quarantined-link:
    type: enum
    raw_type: option
    description: Enable/disable bouncing (administratively bring the link down, up) of a switch port where a quarantined device
      was seen last. Helps to re-initiate the DHCP process for a device.
    default: disable
  default-virtual-switch-vlan:
    type: string
    raw_type: string
    description: Default VLAN for ports when added to the virtual-switch.
    max_length: 15
  dhcp-option82-circuit-id:
    type: enum
    raw_type: option
    description: List the parameters to be included to inform about client identification.
    default: intfname vlan mode
  dhcp-option82-format:
    type: enum
    raw_type: option
    description: DHCP option-82 format string.
    default: ascii
  dhcp-option82-remote-id:
    type: enum
    raw_type: option
    description: List the parameters to be included to inform about client identification.
    default: mac
  dhcp-server-access-list:
    type: enum
    raw_type: option
    description: Enable/disable DHCP snooping server access list.
    default: disable
  dhcp-snoop-client-db-exp:
    type: integer
    raw_type: integer
    description: Expiry time for DHCP snooping server database entries (300 - 259200 sec, default = 86400 sec).
    default: '86400'
    min: 300
    max: 259200
  dhcp-snoop-client-req:
    type: enum
    raw_type: option
    description: Client DHCP packet broadcast mode.
    default: drop-untrusted
  dhcp-snoop-db-per-port-learn-limit:
    type: integer
    raw_type: integer
    description: Per Interface dhcp-server entries learn limit (0 - 1024, default = 64).
    default: '64'
    min: 0
    max: 2048
  disable-discovery:
    type: string
    raw_type: string
    description: Prevent this FortiSwitch from discovering. FortiSwitch Serial-number.
    max_length: 79
  fips-enforce:
    type: enum
    raw_type: option
    description: Enable/disable enforcement of FIPS on managed FortiSwitch devices.
    default: enable
  firewall-auth-user-hold-period:
    type: integer
    raw_type: integer
    description: Time period in minutes to hold firewall authenticated MAC users (5 - 1440, default = 5, disable = 0).
    default: '5'
    min: 5
    max: 1440
  firmware-provision-on-authorization:
    type: enum
    raw_type: option
    description: Enable/disable automatic provisioning of latest firmware on authorization.
    default: disable
  https-image-push:
    type: enum
    raw_type: option
    description: Enable/disable image push to FortiSwitch using HTTPS.
    default: enable
  log-mac-limit-violations:
    type: enum
    raw_type: option
    description: Enable/disable logs for Learning Limit Violations.
    default: disable
  mac-aging-interval:
    type: integer
    raw_type: integer
    description: Time after which an inactive MAC is aged out (10 - 1000000 sec, default = 300, 0 = disable).
    default: '300'
    min: 10
    max: 1000000
  mac-event-logging:
    type: enum
    raw_type: option
    description: Enable/disable MAC address event logging.
    default: disable
  mac-retention-period:
    type: integer
    raw_type: integer
    description: Time in hours after which an inactive MAC is removed from client DB (0 = aged out based on mac-aging-interval).
    default: '24'
    min: 0
    max: 168
  mac-violation-timer:
    type: integer
    raw_type: integer
    description: Set timeout for Learning Limit Violations (0 = disabled).
    default: '0'
    min: 0
    max: 4294967295
  quarantine-mode:
    type: enum
    raw_type: option
    description: Quarantine mode.
    default: by-vlan
  sn-dns-resolution:
    type: enum
    raw_type: option
    description: Enable/disable DNS resolution of the FortiSwitch unit's IP address with switch name.
    default: enable
  switch-on-deauth:
    type: enum
    raw_type: option
    description: No-operation/Factory-reset the managed FortiSwitch on deauthorization.
    default: no-op
  update-user-device:
    type: enum
    raw_type: option
    description: Control which sources update the device user list.
    default: mac-cache lldp dhcp-snooping l2-db l3-db
  vlan-all-mode:
    type: enum
    raw_type: option
    description: VLAN configuration mode, user-defined-vlans or all-possible-vlans.
    default: defined
  vlan-identity:
    type: enum
    raw_type: option
    description: Identity of the VLAN. Commonly used for RADIUS Tunnel-Private-Group-Id.
    default: name
  vlan-optimization:
    type: enum
    raw_type: option
    description: FortiLink VLAN optimization.
    default: configured
children:
  custom-command:
    attributes:
      command-entry:
        type: string
        raw_type: string
        description: List of FortiSwitch commands.
        max_length: 35
      command-name:
        type: string
        raw_type: string
        description: Name of custom command to push to all FortiSwitches in VDOM.
        max_length: 35
