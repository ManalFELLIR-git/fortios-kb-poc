id: system.tos-based-priority
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/250254934/config-system-tos-based-priority
attributes:
  id:
    type: integer
    raw_type: integer
    description: Item ID.
    default: '0'
    min: 0
    max: 4294967295
  priority:
    type: enum
    raw_type: option
    description: ToS based priority level to low, medium or high (these priorities match firewall traffic shaping priorities)
      (default = medium).
    default: high
  tos:
    type: integer
    raw_type: integer
    description: 'Value of the ToS byte in the IP datagram header (0-15, 8: minimize delay, 4: maximize throughput, 2: maximize
      reliability, 1: minimize monetary cost, and 0: default service).'
    default: '0'
    min: 0
    max: 15
children: {}
