id: web-proxy.url-match
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/224818171/config-web-proxy-url-match
attributes:
  cache-exemption:
    type: enum
    raw_type: option
    description: Enable/disable exempting this URL pattern from caching.
    default: disable
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  fast-fallback:
    type: string
    raw_type: string
    description: Fast fallback configuration entry name.
    max_length: 63
  forward-server:
    type: string
    raw_type: string
    description: Forward server name.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: Configure a name for the URL to be exempted.
    max_length: 63
  status:
    type: enum
    raw_type: option
    description: Enable/disable exempting the URLs matching the URL pattern from web proxy forwarding, caching and fast-fallback.
    default: enable
  url-pattern:
    type: string
    raw_type: string
    description: URL pattern to be exempted from web proxy forwarding, caching and fast-fallback.
    max_length: 511
children: {}
