id: user.peer
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/460117137/config-user-peer
attributes:
  ca:
    type: string
    raw_type: string
    description: Name of the CA certificate.
    max_length: 127
  cn:
    type: string
    raw_type: string
    description: Peer certificate common name.
    max_length: 255
  cn-type:
    type: enum
    raw_type: option
    description: Peer certificate common name type.
    default: string
  mandatory-ca-verify:
    type: enum
    raw_type: option
    description: Determine what happens to the peer if the CA certificate is not installed. Disable to automatically consider
      the peer certificate as valid.
    default: enable
  mfa-mode:
    type: enum
    raw_type: option
    description: MFA mode for remote peer authentication/authorization.
    default: none
  mfa-password:
    type: password
    raw_type: password
    description: Unified password for remote authentication. This field may be left empty when RADIUS authentication is used,
      in which case the FortiGate will use the RADIUS username as a password.
  mfa-server:
    type: string
    raw_type: string
    description: Name of a remote authenticator. Performs client access right check.
    max_length: 35
  mfa-username:
    type: string
    raw_type: string
    description: Unified username for remote authentication.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Peer name.
    max_length: 35
  ocsp-override-server:
    type: string
    raw_type: string
    description: Online Certificate Status Protocol (OCSP) server for certificate retrieval.
    max_length: 35
  passwd:
    type: password
    raw_type: password
    description: Peer's password used for two-factor authentication.
  subject:
    type: string
    raw_type: string
    description: Peer certificate name constraints.
    max_length: 255
  two-factor:
    type: enum
    raw_type: option
    description: Enable/disable two-factor authentication, applying certificate and password-based authentication.
    default: disable
children: {}
