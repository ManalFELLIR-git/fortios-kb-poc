id: dlp.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/272456114/config-dlp-settings
attributes:
  cache-mem-percent:
    type: integer
    raw_type: integer
    description: Maximum percentage of available memory allocated to caching DLP fingerprints (1 - 15).
    default: '2'
    min: 1
    max: 15
  chunk-size:
    type: integer
    raw_type: integer
    description: Maximum fingerprint chunk size. Caution, changing this setting will flush the entire database.
    default: '2800'
    min: 100
    max: 100000
  config-builder-timeout:
    type: integer
    raw_type: integer
    description: Maximum time allowed for building a single DLP profile (default 60 seconds).
    default: '60'
    min: 10
    max: 100000
  db-mode:
    type: enum
    raw_type: option
    description: Behavior when the maximum size is reached in the DLP fingerprint database.
    default: stop-adding
  size:
    type: integer
    raw_type: integer
    description: Maximum total size of files within the DLP fingerprint database (MB).
    default: '16'
    min: 16
    max: 4294967295
  storage-device:
    type: string
    raw_type: string
    description: Storage device name.
    max_length: 35
children: {}
