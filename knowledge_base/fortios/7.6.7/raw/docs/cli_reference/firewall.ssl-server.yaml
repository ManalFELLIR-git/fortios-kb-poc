id: firewall.ssl-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/163598142/config-firewall-ssl-server
attributes:
  add-header-x-forwarded-proto:
    type: enum
    raw_type: option
    description: Enable/disable adding an X-Forwarded-Proto header to forwarded requests.
    default: enable
  ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IPv4 address of the SSL server.
    default: 0.0.0.0
  mapped-port:
    type: integer
    raw_type: integer
    description: Mapped server service port (1 - 65535, default = 80).
    default: '80'
    min: 1
    max: 65535
  name:
    type: string
    raw_type: string
    description: Server name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: Server service port (1 - 65535, default = 443).
    default: '443'
    min: 1
    max: 65535
  ssl-algorithm:
    type: enum
    raw_type: option
    description: Relative strength of encryption algorithms accepted in negotiation.
    default: high
  ssl-cert:
    type: string
    raw_type: string
    description: List of certificate names to use for SSL connections to this server. (default = "Fortinet_SSL"). Certificate
      list.
    max_length: 79
  ssl-client-renegotiation:
    type: enum
    raw_type: option
    description: Allow or block client renegotiation by server.
    default: allow
  ssl-dh-bits:
    type: enum
    raw_type: option
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation (default = 2048).
    default: '2048'
  ssl-max-version:
    type: enum
    raw_type: option
    description: Highest SSL/TLS version to negotiate.
    default: tls-1.3
  ssl-min-version:
    type: enum
    raw_type: option
    description: Lowest SSL/TLS version to negotiate.
    default: tls-1.1
  ssl-mode:
    type: enum
    raw_type: option
    description: SSL/TLS mode for encryption and decryption of traffic.
    default: full
  ssl-send-empty-frags:
    type: enum
    raw_type: option
    description: Enable/disable sending empty fragments to avoid attack on CBC IV.
    default: enable
  url-rewrite:
    type: enum
    raw_type: option
    description: Enable/disable rewriting the URL.
    default: disable
children: {}
