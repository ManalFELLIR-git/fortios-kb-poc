id: dlp.filepattern
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/243768347/config-dlp-filepattern
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table containing the file pattern list.
    max_length: 63
children:
  entries:
    attributes:
      file-type:
        type: enum
        raw_type: option
        description: Select a file type.
        default: unknown
      filter-type:
        type: enum
        raw_type: option
        description: Filter by file name pattern or by file type.
        default: pattern
      pattern:
        type: string
        raw_type: string
        description: Add a file name pattern.
        max_length: 79
