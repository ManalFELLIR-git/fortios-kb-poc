id: firewall.access-proxy-virtual-host
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/128426226/config-firewall-access-proxy-virtual-host
attributes:
  client-cert:
    type: enum
    raw_type: option
    description: Enable/disable requesting client certificate.
    default: enable
  empty-cert-action:
    type: enum
    raw_type: option
    description: Action for an empty client certificate.
    default: block
  host:
    type: string
    raw_type: string
    description: The host name.
    max_length: 79
  host-type:
    type: enum
    raw_type: option
    description: Type of host pattern.
    default: sub-string
  name:
    type: string
    raw_type: string
    description: Virtual host name.
    max_length: 79
  replacemsg-group:
    type: string
    raw_type: string
    description: Access-proxy-virtual-host replacement message override group.
    max_length: 35
  ssl-certificate:
    type: string
    raw_type: string
    description: SSL certificates for this host. Certificate list.
    max_length: 79
  user-agent-detect:
    type: enum
    raw_type: option
    description: Enable/disable detecting device type by HTTP user-agent if no client certificate is provided.
    default: enable
children: {}
