id: system.cloud-service
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/104788669/config-system-cloud-service
attributes:
  gck-access-token-lifetime:
    type: integer
    raw_type: integer
    description: Lifetime of automatically generated access tokens in minutes (default is 60 minutes).
    default: '60'
    min: 1
    max: 3600
  gck-keyid:
    type: string
    raw_type: string
    description: Key id, also referred as "kid".
    max_length: 127
  gck-private-key:
    type: string
    raw_type: string
    description: Service account private key in PEM format (e.g. "-----BEGIN PRIVATE KEY-----\ ...").
    max_length: 8191
  gck-service-account:
    type: string
    raw_type: string
    description: Service account (e.g. "account-id@sampledomain.com").
    max_length: 285
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  traffic-vdom:
    type: string
    raw_type: string
    description: Vdom used to communicate with cloud service.
    max_length: 31
  vendor:
    type: enum
    raw_type: option
    description: Cloud service vendor.
    default: unknown
children: {}
