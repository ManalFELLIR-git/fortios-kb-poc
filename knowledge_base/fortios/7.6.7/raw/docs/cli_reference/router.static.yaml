id: router.static
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/200835411/config-router-static
attributes:
  bfd:
    type: enum
    raw_type: option
    description: Enable/disable Bidirectional Forwarding Detection (BFD).
    default: disable
  blackhole:
    type: enum
    raw_type: option
    description: Enable/disable black hole.
    default: disable
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  device:
    type: string
    raw_type: string
    description: Gateway out interface or tunnel.
    max_length: 35
  distance:
    type: integer
    raw_type: integer
    description: Administrative distance (1 - 255).
    default: '10'
    min: 1
    max: 255
  dst:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Destination IP and mask for this route.
    default: 0.0.0.0 0.0.0.0
  dstaddr:
    type: string
    raw_type: string
    description: Name of firewall address or address group.
    max_length: 79
  dynamic-gateway:
    type: enum
    raw_type: option
    description: Enable use of dynamic gateway retrieved from a DHCP or PPP server.
    default: disable
  gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: Gateway IP for this route.
    default: 0.0.0.0
  internet-service:
    type: integer
    raw_type: integer
    description: Application ID in the Internet service database.
    default: '0'
    min: 0
    max: 4294967295
  internet-service-custom:
    type: string
    raw_type: string
    description: Application name in the Internet service custom database.
    max_length: 64
  internet-service-fortiguard:
    type: string
    raw_type: string
    description: Application name in the Internet service fortiguard database.
    max_length: 64
  link-monitor-exempt:
    type: enum
    raw_type: option
    description: Enable/disable withdrawal of this static route when link monitor or health check is down.
    default: disable
  preferred-source:
    type: ipv4-address
    raw_type: ipv4-address
    description: Preferred source IP for this route.
    default: 0.0.0.0
  priority:
    type: integer
    raw_type: integer
    description: Administrative priority (1 - 65535).
    default: '1'
    min: 1
    max: 65535
  sdwan-zone:
    type: string
    raw_type: string
    description: Choose SD-WAN Zone. SD-WAN zone name.
    max_length: 79
  seq-num:
    type: integer
    raw_type: integer
    description: Sequence number.
    default: '0'
    min: 0
    max: 4294967295
  src:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Source prefix for this route.
    default: 0.0.0.0 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable/disable this static route.
    default: enable
  tag:
    type: integer
    raw_type: integer
    description: Route tag.
    default: '0'
    min: 0
    max: 4294967295
  vrf:
    type: integer
    raw_type: integer
    description: Virtual Routing Forwarding ID.
    default: unspecified
    min: 0
    max: 511
  weight:
    type: integer
    raw_type: integer
    description: Administrative weight (0 - 255).
    default: '0'
    min: 0
    max: 255
children: {}
