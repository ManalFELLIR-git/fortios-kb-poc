id: system.health-check-fortiguard
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/868022646/config-system-health-check-fortiguard
attributes:
  name:
    type: string
    raw_type: string
    description: Status check or predefined health-check targets name.
    max_length: 35
  obsolete:
    type: integer
    raw_type: integer
    description: Indicates whether Health Check service can be used. Read-only.
    default: '0'
    min: 0
    max: 255
  protocol:
    type: enum
    raw_type: option
    description: Protocol name.
    default: ping
  server:
    type: string
    raw_type: string
    description: Status check or predefined health-check domain name.
    max_length: 127
children: {}
