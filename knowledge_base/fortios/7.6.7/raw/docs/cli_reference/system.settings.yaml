id: system.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130421147/config-system-settings
attributes:
  allow-linkdown-path:
    type: enum
    raw_type: option
    description: Enable/disable link down path.
    default: disable
  allow-subnet-overlap:
    type: enum
    raw_type: option
    description: Enable/disable allowing interface subnets to use overlapping IP addresses.
    default: disable
  asymroute:
    type: enum
    raw_type: option
    description: Enable/disable IPv4 asymmetric routing.
    default: disable
  asymroute-icmp:
    type: enum
    raw_type: option
    description: Enable/disable ICMP asymmetric routing.
    default: disable
  asymroute6:
    type: enum
    raw_type: option
    description: Enable/disable asymmetric IPv6 routing.
    default: disable
  asymroute6-icmp:
    type: enum
    raw_type: option
    description: Enable/disable asymmetric ICMPv6 routing.
    default: disable
  auxiliary-session:
    type: enum
    raw_type: option
    description: Enable/disable auxiliary session.
    default: disable
  bfd:
    type: enum
    raw_type: option
    description: Enable/disable Bi-directional Forwarding Detection (BFD) on all interfaces.
    default: disable
  bfd-desired-min-tx:
    type: integer
    raw_type: integer
    description: BFD desired minimal transmit interval (1 - 100000 ms, default = 250).
    default: '250'
    min: 1
    max: 100000
  bfd-detect-mult:
    type: integer
    raw_type: integer
    description: BFD detection multiplier (1 - 50, default = 3).
    default: '3'
    min: 1
    max: 50
  bfd-dont-enforce-src-port:
    type: enum
    raw_type: option
    description: Enable to not enforce verifying the source port of BFD Packets.
    default: disable
  bfd-required-min-rx:
    type: integer
    raw_type: integer
    description: BFD required minimal receive interval (1 - 100000 ms, default = 250).
    default: '250'
    min: 1
    max: 100000
  block-land-attack:
    type: enum
    raw_type: option
    description: Enable/disable blocking of land attacks.
    default: disable
  central-nat:
    type: enum
    raw_type: option
    description: Enable/disable central NAT.
    default: disable
  comments:
    type: string
    raw_type: var-string
    description: VDOM comments.
    max_length: 255
  default-app-port-as-service:
    type: enum
    raw_type: option
    description: Enable/disable policy service enforcement based on application default ports.
    default: enable
  default-policy-expiry-days:
    type: integer
    raw_type: integer
    description: Default policy expiry in days (0 - 365 days, default = 30).
    default: '30'
    min: 0
    max: 365
  default-voip-alg-mode:
    type: enum
    raw_type: option
    description: Configure how the FortiGate handles VoIP traffic when a policy that accepts the traffic doesn't include a
      VoIP profile.
    default: proxy-based
  deny-tcp-with-icmp:
    type: enum
    raw_type: option
    description: Enable/disable denying TCP by sending an ICMP communication prohibited packet.
    default: disable
  detect-unknown-esp:
    type: enum
    raw_type: option
    description: Enable/disable detection of unknown ESP packets (default = enable).
    default: enable
  device:
    type: string
    raw_type: string
    description: Interface to use for management access for NAT mode.
    max_length: 35
  dhcp-proxy:
    type: enum
    raw_type: option
    description: Enable/disable the DHCP Proxy.
    default: disable
  dhcp-proxy-interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  dhcp-proxy-interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  dhcp-proxy-vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
  dhcp-server-ip:
    type: string
    raw_type: user
    description: DHCP Server IPv4 address.
  dhcp6-server-ip:
    type: string
    raw_type: user
    description: DHCPv6 server IPv6 address.
  discovered-device-timeout:
    type: integer
    raw_type: integer
    description: Timeout for discovered devices (1 - 365 days, default = 28).
    default: '28'
    min: 1
    max: 365
  dyn-addr-session-check:
    type: enum
    raw_type: option
    description: Enable/disable dirty session check caused by dynamic address updates.
    default: disable
  ecmp-max-paths:
    type: integer
    raw_type: integer
    description: Maximum number of Equal Cost Multi-Path (ECMP) next-hops. Set to 1 to disable ECMP routing (1 - 255, default
      = 255).
    default: '255'
    min: 1
    max: 255
  email-portal-check-dns:
    type: enum
    raw_type: option
    description: Enable/disable using DNS to validate email addresses collected by a captive portal.
    default: enable
  ext-resource-session-check:
    type: enum
    raw_type: option
    description: Enable/disable dirty session check caused by external resource updates.
    default: disable
  firewall-session-dirty:
    type: enum
    raw_type: option
    description: Select how to manage sessions affected by firewall policy configuration changes.
    default: check-all
  fqdn-session-check:
    type: enum
    raw_type: option
    description: Enable/disable dirty session check caused by FQDN updates.
    default: disable
  fw-session-hairpin:
    type: enum
    raw_type: option
    description: Enable/disable checking for a matching policy each time hairpin traffic goes through the FortiGate.
    default: disable
  gateway:
    type: ipv4-address
    raw_type: ipv4-address
    description: Transparent mode IPv4 default gateway IP address.
    default: 0.0.0.0
  gateway6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Transparent mode IPv6 default gateway IP address.
    default: '::'
  gui-advanced-policy:
    type: enum
    raw_type: option
    description: Enable/disable advanced policy configuration on the GUI.
    default: disable
  gui-advanced-wireless-features:
    type: enum
    raw_type: option
    description: Enable/disable advanced wireless features in GUI.
    default: disable
  gui-allow-unnamed-policy:
    type: enum
    raw_type: option
    description: Enable/disable the requirement for policy naming on the GUI.
    default: disable
  gui-antivirus:
    type: enum
    raw_type: option
    description: Enable/disable AntiVirus on the GUI.
    default: enable
  gui-ap-profile:
    type: enum
    raw_type: option
    description: Enable/disable FortiAP profiles on the GUI.
    default: enable
  gui-application-control:
    type: enum
    raw_type: option
    description: Enable/disable application control on the GUI.
    default: enable
  gui-casb:
    type: enum
    raw_type: option
    description: Enable/disable Inline-CASB on the GUI.
    default: disable
  gui-default-policy-columns:
    type: string
    raw_type: string
    description: Default columns to display for policy lists on GUI. Select column name.
    max_length: 79
  gui-dhcp-advanced:
    type: enum
    raw_type: option
    description: Enable/disable advanced DHCP options on the GUI.
    default: enable
  gui-dlp-advanced:
    type: enum
    raw_type: option
    description: Enable/disable Show advanced DLP expressions on the GUI.
    default: disable
  gui-dlp-profile:
    type: enum
    raw_type: option
    description: Enable/disable Data Loss Prevention on the GUI.
    default: disable
  gui-dns-database:
    type: enum
    raw_type: option
    description: Enable/disable DNS database settings on the GUI.
    default: disable
  gui-dnsfilter:
    type: enum
    raw_type: option
    description: Enable/disable DNS Filtering on the GUI.
    default: enable
  gui-dos-policy:
    type: enum
    raw_type: option
    description: Enable/disable DoS policies on the GUI.
    default: enable **
  gui-dynamic-device-os-id:
    type: enum
    raw_type: option
    description: Enable/disable Create dynamic addresses to manage known devices.
    default: disable
  gui-dynamic-routing:
    type: enum
    raw_type: option
    description: Enable/disable dynamic routing on the GUI.
    default: enable **
  gui-email-collection:
    type: enum
    raw_type: option
    description: Enable/disable email collection on the GUI.
    default: disable
  gui-enforce-change-summary:
    type: enum
    raw_type: option
    description: Enforce change summaries for select tables in the GUI.
    default: require
  gui-explicit-proxy:
    type: enum
    raw_type: option
    description: Enable/disable the explicit proxy on the GUI.
    default: disable
  gui-file-filter:
    type: enum
    raw_type: option
    description: Enable/disable File-filter on the GUI.
    default: enable **
  gui-fortiap-split-tunneling:
    type: enum
    raw_type: option
    description: Enable/disable FortiAP split tunneling on the GUI.
    default: disable
  gui-fortiextender-controller:
    type: enum
    raw_type: option
    description: Enable/disable FortiExtender on the GUI.
    default: disable **
  gui-fortitelemetry:
    type: enum
    raw_type: option
    description: Enable/disable FortiTelemetry on the GUI.
    default: disable
  gui-gtp:
    type: enum
    raw_type: option
    description: Enable/disable Manage general radio packet service (GPRS) protocols on the GUI.
    default: enable
  gui-icap:
    type: enum
    raw_type: option
    description: Enable/disable ICAP on the GUI.
    default: disable
  gui-implicit-policy:
    type: enum
    raw_type: option
    description: Enable/disable implicit firewall policies on the GUI.
    default: enable
  gui-ips:
    type: enum
    raw_type: option
    description: Enable/disable IPS on the GUI.
    default: enable **
  gui-load-balance:
    type: enum
    raw_type: option
    description: Enable/disable server load balancing on the GUI.
    default: disable
  gui-local-in-policy:
    type: enum
    raw_type: option
    description: Enable/disable Local-In policies on the GUI.
    default: disable
  gui-multicast-policy:
    type: enum
    raw_type: option
    description: Enable/disable multicast firewall policies on the GUI.
    default: disable
  gui-multiple-interface-policy:
    type: enum
    raw_type: option
    description: Enable/disable adding multiple interfaces to a policy on the GUI.
    default: disable
  gui-object-colors:
    type: enum
    raw_type: option
    description: Enable/disable object colors on the GUI.
    default: enable
  gui-ot:
    type: enum
    raw_type: option
    description: Enable/disable Operational technology features on the GUI.
    default: disable
  gui-policy-based-ipsec:
    type: enum
    raw_type: option
    description: Enable/disable policy-based IPsec VPN on the GUI.
    default: disable
  gui-policy-disclaimer:
    type: enum
    raw_type: option
    description: Enable/disable policy disclaimer on the GUI.
    default: disable
  gui-route-tag-address-creation:
    type: enum
    raw_type: option
    description: Enable/disable route-tag addresses on the GUI.
    default: disable
  gui-security-profile-group:
    type: enum
    raw_type: option
    description: Enable/disable Security Profile Groups on the GUI.
    default: disable
  gui-spamfilter:
    type: enum
    raw_type: option
    description: Enable/disable Antispam on the GUI.
    default: disable
  gui-sslvpn:
    type: enum
    raw_type: option
    description: Enable/disable SSL-VPN settings pages on the GUI.
    default: disable
  gui-sslvpn-personal-bookmarks:
    type: enum
    raw_type: option
    description: Enable/disable SSL-VPN personal bookmark management on the GUI.
    default: disable
  gui-sslvpn-realms:
    type: enum
    raw_type: option
    description: Enable/disable SSL-VPN realms on the GUI.
    default: disable
  gui-switch-controller:
    type: enum
    raw_type: option
    description: Enable/disable the switch controller on the GUI.
    default: enable
  gui-threat-weight:
    type: enum
    raw_type: option
    description: Enable/disable threat weight on the GUI.
    default: enable
  gui-traffic-shaping:
    type: enum
    raw_type: option
    description: Enable/disable traffic shaping on the GUI.
    default: enable
  gui-videofilter:
    type: enum
    raw_type: option
    description: Enable/disable Video filtering on the GUI.
    default: enable **
  gui-virtual-patch-profile:
    type: enum
    raw_type: option
    description: Enable/disable Virtual Patching on the GUI.
    default: disable
  gui-voip-profile:
    type: enum
    raw_type: option
    description: Enable/disable VoIP profiles on the GUI.
    default: disable
  gui-vpn:
    type: enum
    raw_type: option
    description: Enable/disable IPsec VPN settings pages on the GUI.
    default: enable
  gui-waf-profile:
    type: enum
    raw_type: option
    description: Enable/disable Web Application Firewall on the GUI.
    default: disable
  gui-wan-load-balancing:
    type: enum
    raw_type: option
    description: Enable/disable SD-WAN on the GUI.
    default: enable
  gui-wanopt-cache:
    type: enum
    raw_type: option
    description: Enable/disable WAN Optimization and Web Caching on the GUI.
    default: disable
  gui-webfilter:
    type: enum
    raw_type: option
    description: Enable/disable Web filtering on the GUI.
    default: enable
  gui-webfilter-advanced:
    type: enum
    raw_type: option
    description: Enable/disable advanced web filtering on the GUI.
    default: disable
  gui-wireless-controller:
    type: enum
    raw_type: option
    description: Enable/disable the wireless controller on the GUI.
    default: enable
  gui-ztna:
    type: enum
    raw_type: option
    description: Enable/disable Zero Trust Network Access features on the GUI.
    default: enable **
  h323-direct-model:
    type: enum
    raw_type: option
    description: Enable/disable H323 direct model.
    default: disable
  http-external-dest:
    type: enum
    raw_type: option
    description: Offload HTTP traffic to FortiWeb or FortiCache.
    default: fortiweb
  ike-detailed-event-logs:
    type: enum
    raw_type: option
    description: Enable/disable detail log for IKE events.
    default: disable
  ike-dn-format:
    type: enum
    raw_type: option
    description: Configure IKE ASN.1 Distinguished Name format conventions.
    default: with-space
  ike-extra-ports:
    type: integer
    raw_type: integer
    description: Extra UDP ports for the IKE daemon to listen on other than 500 and 4500 (maximum 3).
    min: 1024
    max: 65535
  ike-policy-route:
    type: enum
    raw_type: option
    description: Enable/disable IKE Policy Based Routing (PBR).
    default: disable
  ike-port:
    type: integer
    raw_type: integer
    description: UDP port for IKE/IPsec traffic (default 500).
    default: '500'
    min: 1024
    max: 65535
  ike-quick-crash-detect:
    type: enum
    raw_type: option
    description: Enable/disable IKE quick crash detection (RFC 6290).
    default: disable
  ike-session-resume:
    type: enum
    raw_type: option
    description: Enable/disable IKEv2 session resumption (RFC 5723).
    default: disable
  ike-tcp-port:
    type: integer
    raw_type: integer
    description: TCP port for IKE/IPsec traffic (default 443).
    default: '443'
    min: 1
    max: 65535
  internet-service-app-ctrl-size:
    type: integer
    raw_type: integer
    description: Maximum number of tuple entries (protocol, port, IP address, application ID) stored by the FortiGate unit
      (0 - 4294967295, default = 32768). A smaller value limits the FortiGate unit from learning about internet applications.
    default: '32768'
    min: 0
    max: 4294967295
  internet-service-database-cache:
    type: enum
    raw_type: option
    description: Enable/disable Internet Service database caching.
    default: disable
  intree-ses-best-route:
    type: enum
    raw_type: option
    description: Force the intree session to always use the best route.
    default: disable
  ip:
    type: ipv4-classnet-host
    raw_type: ipv4-classnet-host
    description: IP address and netmask.
    default: 0.0.0.0 0.0.0.0
  ip6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: IPv6 address prefix for NAT mode.
    default: ::/0
  lan-extension-controller-addr:
    type: string
    raw_type: string
    description: Controller IP address or FQDN to connect.
    max_length: 255
  lan-extension-controller-port:
    type: integer
    raw_type: integer
    description: Controller port to connect.
    default: '5246'
    min: 1024
    max: 65535
  link-down-access:
    type: enum
    raw_type: option
    description: Enable/disable link down access traffic.
    default: enable
  lldp-reception:
    type: enum
    raw_type: option
    description: Enable/disable Link Layer Discovery Protocol (LLDP) reception for this VDOM or apply global settings to this
      VDOM.
    default: global
  lldp-transmission:
    type: enum
    raw_type: option
    description: Enable/disable Link Layer Discovery Protocol (LLDP) transmission for this VDOM or apply global settings to
      this VDOM.
    default: global
  location-id:
    type: ipv4-address
    raw_type: ipv4-address
    description: Local location ID in the form of an IPv4 address.
    default: 0.0.0.0
  mac-ttl:
    type: integer
    raw_type: integer
    description: Duration of MAC addresses in Transparent mode (300 - 8640000 sec, default = 300).
    default: '300'
    min: 300
    max: 8640000
  manageip:
    type: string
    raw_type: user
    description: Transparent mode IPv4 management IP address and netmask.
  manageip6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Transparent mode IPv6 management IP address and netmask.
    default: ::/0
  multicast-forward:
    type: enum
    raw_type: option
    description: Enable/disable multicast forwarding.
    default: enable
  multicast-skip-policy:
    type: enum
    raw_type: option
    description: Enable/disable allowing multicast traffic through the FortiGate without a policy check.
    default: disable
  multicast-ttl-notchange:
    type: enum
    raw_type: option
    description: Enable/disable preventing the FortiGate from changing the TTL for forwarded multicast packets.
    default: disable
  nat46-force-ipv4-packet-forwarding:
    type: enum
    raw_type: option
    description: Enable/disable mandatory IPv4 packet forwarding in NAT46.
    default: disable
  nat46-generate-ipv6-fragment-header:
    type: enum
    raw_type: option
    description: Enable/disable NAT46 IPv6 fragment header generation.
    default: disable
  nat64-force-ipv6-packet-forwarding:
    type: enum
    raw_type: option
    description: Enable/disable mandatory IPv6 packet forwarding in NAT64.
    default: enable
  ngfw-mode:
    type: enum
    raw_type: option
    description: Next Generation Firewall (NGFW) mode.
    default: profile-based
  opmode:
    type: enum
    raw_type: option
    description: Firewall operation mode (NAT or Transparent).
    default: nat
  policy-offload-level:
    type: enum
    raw_type: option
    description: Configure firewall policy offload level.
    default: disable
  prp-trailer-action:
    type: enum
    raw_type: option
    description: Enable/disable action to take on PRP trailer.
    default: disable
  sccp-port:
    type: integer
    raw_type: integer
    description: TCP port the SCCP proxy monitors for SCCP traffic (0 - 65535, default = 2000).
    default: '2000'
    min: 0
    max: 65535
  sctp-session-without-init:
    type: enum
    raw_type: option
    description: Enable/disable SCTP session creation without SCTP INIT.
    default: disable
  ses-denied-multicast-traffic:
    type: enum
    raw_type: option
    description: Enable/disable including denied multicast session in the session table.
    default: disable
  ses-denied-traffic:
    type: enum
    raw_type: option
    description: Enable/disable including denied session in the session table.
    default: disable
  sip-expectation:
    type: enum
    raw_type: option
    description: Enable/disable the SIP kernel session helper to create an expectation for port 5060.
    default: disable
  sip-nat-trace:
    type: enum
    raw_type: option
    description: Enable/disable recording the original SIP source IP address when NAT is used.
    default: enable
  sip-ssl-port:
    type: integer
    raw_type: integer
    description: TCP port the SIP proxy monitors for SIP SSL/TLS traffic (0 - 65535, default = 5061).
    default: '5061'
    min: 0
    max: 65535
  sip-tcp-port:
    type: integer
    raw_type: integer
    description: TCP port the SIP proxy monitors for SIP traffic (0 - 65535, default = 5060).
    default: '5060'
    min: 1
    max: 65535
  sip-udp-port:
    type: integer
    raw_type: integer
    description: UDP port the SIP proxy monitors for SIP traffic (0 - 65535, default = 5060).
    default: '5060'
    min: 1
    max: 65535
  snat-hairpin-traffic:
    type: enum
    raw_type: option
    description: Enable/disable source NAT (SNAT) for VIP hairpin traffic.
    default: enable
  src-check-reply:
    type: enum
    raw_type: option
    description: Enable/disable source verification for reply packets.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable this VDOM.
    default: enable
  strict-src-check:
    type: enum
    raw_type: option
    description: Enable/disable strict source verification.
    default: disable
  tcp-session-without-syn:
    type: enum
    raw_type: option
    description: Enable/disable allowing TCP session without SYN flags.
    default: disable
  utf8-spam-tagging:
    type: enum
    raw_type: option
    description: Enable/disable converting antispam tags to UTF-8 for better non-ASCII character support.
    default: enable
  v4-ecmp-mode:
    type: enum
    raw_type: option
    description: IPv4 Equal-cost multi-path (ECMP) routing and load balancing mode.
    default: source-ip-based
  vdom-type:
    type: enum
    raw_type: option
    description: Vdom type (traffic, lan-extension or admin).
    default: traffic
  vpn-stats-log:
    type: enum
    raw_type: option
    description: Enable/disable periodic VPN log statistics for one or more types of VPN. Separate names with a space.
    default: ipsec pptp l2tp ssl **
  vpn-stats-period:
    type: integer
    raw_type: integer
    description: Period to send VPN log statistics (0 or 60 - 86400 sec).
    default: '600'
    min: 0
    max: 4294967295
  wccp-cache-engine:
    type: enum
    raw_type: option
    description: Enable/disable WCCP cache engine.
    default: disable
children: {}
