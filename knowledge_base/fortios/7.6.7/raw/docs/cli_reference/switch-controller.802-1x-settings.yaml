id: switch-controller.802-1x-settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/261414769/config-switch-controller-802-1x-settings
attributes:
  link-down-auth:
    type: enum
    raw_type: option
    description: Interface-reauthentication state to set if a link is down.
    default: set-unauth
  mab-reauth:
    type: enum
    raw_type: option
    description: Enable/disable MAB re-authentication.
    default: disable
  mac-called-station-delimiter:
    type: enum
    raw_type: option
    description: MAC called station delimiter (default = hyphen).
    default: hyphen
  mac-calling-station-delimiter:
    type: enum
    raw_type: option
    description: MAC calling station delimiter (default = hyphen).
    default: hyphen
  mac-case:
    type: enum
    raw_type: option
    description: MAC case (default = lowercase).
    default: lowercase
  mac-password-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication password delimiter (default = hyphen).
    default: hyphen
  mac-username-delimiter:
    type: enum
    raw_type: option
    description: MAC authentication username delimiter (default = hyphen).
    default: hyphen
  max-reauth-attempt:
    type: integer
    raw_type: integer
    description: Maximum number of authentication attempts (0 - 15, default = 3).
    default: '3'
    min: 0
    max: 15
  reauth-period:
    type: integer
    raw_type: integer
    description: Period of time to allow for reauthentication (1 - 1440 sec, default = 60, 0 = disable reauthentication).
    default: '60'
    min: 0
    max: 1440
  tx-period:
    type: integer
    raw_type: integer
    description: 802.1X Tx period (seconds, default=30).
    default: '30'
    min: 12
    max: 60
children: {}
