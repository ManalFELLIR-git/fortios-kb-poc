id: firewall.ippool6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/767867650/config-firewall-ippool6
attributes:
  add-nat46-route:
    type: enum
    raw_type: option
    description: Enable/disable adding NAT46 route.
    default: enable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  endip:
    type: ipv6-address
    raw_type: ipv6-address
    description: Final IPv6 address (inclusive) in the range for the address pool (format = xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx,
      default = ::).
    default: '::'
  external-prefix:
    type: ipv6-network
    raw_type: ipv6-network
    description: External NPTv6 prefix length (32 - 64).
    default: ::/0
  internal-prefix:
    type: ipv6-network
    raw_type: ipv6-network
    description: Internal NPTv6 prefix length (32 - 64).
    default: ::/0
  name:
    type: string
    raw_type: string
    description: IPv6 IP pool name.
    max_length: 79
  nat46:
    type: enum
    raw_type: option
    description: Enable/disable NAT46.
    default: disable
  startip:
    type: ipv6-address
    raw_type: ipv6-address
    description: First IPv6 address (inclusive) in the range for the address pool (format = xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx,
      default = ::).
    default: '::'
  type:
    type: enum
    raw_type: option
    description: Configure IPv6 pool type (overload or NPTv6).
    default: overload
children: {}
