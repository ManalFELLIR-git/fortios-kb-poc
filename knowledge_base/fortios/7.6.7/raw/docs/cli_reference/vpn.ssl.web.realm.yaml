id: vpn.ssl.web.realm
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/110330524/config-vpn-ssl-web-realm
attributes:
  login-page:
    type: string
    raw_type: var-string
    description: Replacement HTML for Agentless VPN login page.
    max_length: 32768
  max-concurrent-user:
    type: integer
    raw_type: integer
    description: Maximum concurrent users (0 - 65535, 0 means unlimited).
    default: '0'
    min: 0
    max: 65535
  nas-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address used as a NAS-IP to communicate with the RADIUS server.
    default: 0.0.0.0
  radius-port:
    type: integer
    raw_type: integer
    description: RADIUS service port number (0 - 65535, 0 means user.radius.radius-port).
    default: '0'
    min: 0
    max: 65535
  radius-server:
    type: string
    raw_type: string
    description: RADIUS server associated with realm.
    max_length: 35
  url-path:
    type: string
    raw_type: string
    description: URL path to access Agentless VPN login page.
    max_length: 35
  virtual-host:
    type: string
    raw_type: var-string
    description: Virtual host name for realm.
    max_length: 255
  virtual-host-only:
    type: enum
    raw_type: option
    description: Enable/disable enforcement of virtual host method for Agentless VPN client access.
    default: disable
  virtual-host-server-cert:
    type: string
    raw_type: string
    description: Name of the server certificate to used for this realm.
    max_length: 35
children: {}
