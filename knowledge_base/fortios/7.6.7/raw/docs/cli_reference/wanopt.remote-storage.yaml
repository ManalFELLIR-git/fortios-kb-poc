id: wanopt.remote-storage
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/486153105/config-wanopt-remote-storage
attributes:
  local-cache-id:
    type: string
    raw_type: string
    description: ID that this device uses to connect to the remote device.
    max_length: 35
  remote-cache-id:
    type: string
    raw_type: string
    description: ID of the remote device to which the device connects.
    max_length: 35
  remote-cache-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IP address of the remote device to which the device connects.
    default: 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable/disable using remote device as Web cache storage.
    default: disable
children: {}
