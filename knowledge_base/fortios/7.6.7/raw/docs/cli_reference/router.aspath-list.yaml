id: router.aspath-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/217014437/config-router-aspath-list
attributes:
  name:
    type: string
    raw_type: string
    description: AS path list name.
    max_length: 35
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Permit or deny route-based operations, based on the route's AS_PATH attribute.
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      regexp:
        type: string
        raw_type: string
        description: Regular-expression to match the Border Gateway Protocol (BGP) AS paths.
        max_length: 63
