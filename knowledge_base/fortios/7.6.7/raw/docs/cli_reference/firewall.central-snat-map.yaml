id: firewall.central-snat-map
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/135632652/config-firewall-central-snat-map
attributes:
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dst-addr:
    type: string
    raw_type: string
    description: IPv4 Destination address. Address name.
    max_length: 79
  dst-addr6:
    type: string
    raw_type: string
    description: IPv6 Destination address. Address name.
    max_length: 79
  dst-port:
    type: string
    raw_type: user
    description: Destination port or port range (1 to 65535, 0 means any port).
  dstintf:
    type: string
    raw_type: string
    description: Destination interface name from available interfaces. Interface name.
    max_length: 79
  nat:
    type: enum
    raw_type: option
    description: Enable/disable source NAT.
    default: enable
  nat-ippool:
    type: string
    raw_type: string
    description: Name of the IP pools to be used to translate addresses from available IP Pools. IP pool name.
    max_length: 79
  nat-ippool6:
    type: string
    raw_type: string
    description: IPv6 pools to be used for source NAT. IPv6 pool name.
    max_length: 79
  nat-port:
    type: string
    raw_type: user
    description: Translated port or port range (1 to 65535, 0 means any port).
  nat46:
    type: enum
    raw_type: option
    description: Enable/disable NAT46.
    default: disable
  nat64:
    type: enum
    raw_type: option
    description: Enable/disable NAT64.
    default: disable
  orig-addr:
    type: string
    raw_type: string
    description: IPv4 Original address. Address name.
    max_length: 79
  orig-addr6:
    type: string
    raw_type: string
    description: IPv6 Original address. Address name.
    max_length: 79
  orig-port:
    type: string
    raw_type: user
    description: Original TCP port (1 to 65535, 0 means any port).
  policyid:
    type: integer
    raw_type: integer
    description: Policy ID.
    default: '0'
    min: 0
    max: 4294967295
  port-preserve:
    type: enum
    raw_type: option
    description: Enable/disable preservation of the original source port from source NAT if it has not been used.
    default: enable
  port-random:
    type: enum
    raw_type: option
    description: Enable/disable random source port selection for source NAT.
    default: disable
  protocol:
    type: integer
    raw_type: integer
    description: Integer value for the protocol type (0 - 255).
    default: '0'
    min: 0
    max: 255
  srcintf:
    type: string
    raw_type: string
    description: Source interface name from available interfaces. Interface name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: Enable/disable the active status of this policy.
    default: enable
  type:
    type: enum
    raw_type: option
    description: IPv4/IPv6 source NAT.
    default: ipv4
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
