id: system.ptp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/193226766/config-system-ptp
attributes:
  delay-mechanism:
    type: enum
    raw_type: option
    description: End to end delay detection or peer to peer delay detection.
    default: E2E
  interface:
    type: string
    raw_type: string
    description: PTP client will reply through this interface.
    max_length: 15
  mode:
    type: enum
    raw_type: option
    description: Multicast transmission or hybrid transmission.
    default: multicast
  request-interval:
    type: integer
    raw_type: integer
    description: The delay request value is the logarithmic mean interval in seconds between the delay request messages sent
      by the slave to the master.
    default: '1'
    min: 1
    max: 6
  server-mode:
    type: enum
    raw_type: option
    description: Enable/disable FortiGate PTP server mode. Your FortiGate becomes an PTP server for other devices on your
      network.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable setting the FortiGate system time by synchronizing with an PTP Server.
    default: disable
children:
  server-interface:
    attributes:
      delay-mechanism:
        type: enum
        raw_type: option
        description: End to end delay detection or peer to peer delay detection.
        default: E2E
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      server-interface-name:
        type: string
        raw_type: string
        description: Interface name.
        max_length: 15
