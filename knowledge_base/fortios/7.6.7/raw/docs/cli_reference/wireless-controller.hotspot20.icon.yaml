id: wireless-controller.hotspot20.icon
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/334017602/config-wireless-controller-hotspot20-icon
attributes:
  name:
    type: string
    raw_type: string
    description: Icon list ID.
    max_length: 35
children:
  icon-list:
    attributes:
      file:
        type: string
        raw_type: string
        description: Icon file.
        max_length: 255
      height:
        type: integer
        raw_type: integer
        description: Icon height.
        default: '0'
        min: 1
        max: 65535
      lang:
        type: string
        raw_type: string
        description: Language code.
        default: eng
        max_length: 3
      name:
        type: string
        raw_type: string
        description: Icon name.
        max_length: 255
      type:
        type: enum
        raw_type: option
        description: Icon type.
        default: png
      width:
        type: integer
        raw_type: integer
        description: Icon width.
        default: '0'
        min: 1
        max: 65535
