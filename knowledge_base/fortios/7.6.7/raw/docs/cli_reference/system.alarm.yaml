id: system.alarm
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/136530721/config-system-alarm
attributes:
  audible:
    type: enum
    raw_type: option
    description: Enable/disable audible alarm.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable alarm.
    default: disable
children:
  groups:
    attributes:
      admin-auth-failure-threshold:
        type: integer
        raw_type: integer
        description: Admin authentication failure threshold.
        default: '0'
        min: 0
        max: 1024
      admin-auth-lockout-threshold:
        type: integer
        raw_type: integer
        description: Admin authentication lockout threshold.
        default: '0'
        min: 0
        max: 1024
      decryption-failure-threshold:
        type: integer
        raw_type: integer
        description: Decryption failure threshold.
        default: '0'
        min: 0
        max: 1024
      encryption-failure-threshold:
        type: integer
        raw_type: integer
        description: Encryption failure threshold.
        default: '0'
        min: 0
        max: 1024
      fw-policy-id:
        type: integer
        raw_type: integer
        description: Firewall policy ID.
        default: '0'
        min: 0
        max: 4294967295
      fw-policy-id-threshold:
        type: integer
        raw_type: integer
        description: Firewall policy ID threshold.
        default: '0'
        min: 0
        max: 1024
      id:
        type: integer
        raw_type: integer
        description: Group ID.
        default: '0'
        min: 0
        max: 4294967295
      log-full-warning-threshold:
        type: integer
        raw_type: integer
        description: Log full warning threshold.
        default: '0'
        min: 0
        max: 1024
      period:
        type: integer
        raw_type: integer
        description: Time period in seconds (0 = from start up).
        default: '0'
        min: 0
        max: 4294967295
      replay-attempt-threshold:
        type: integer
        raw_type: integer
        description: Replay attempt threshold.
        default: '0'
        min: 0
        max: 1024
      self-test-failure-threshold:
        type: integer
        raw_type: integer
        description: Self-test failure threshold.
        default: '0'
        min: 0
        max: 1
      user-auth-failure-threshold:
        type: integer
        raw_type: integer
        description: User authentication failure threshold.
        default: '0'
        min: 0
        max: 1024
      user-auth-lockout-threshold:
        type: integer
        raw_type: integer
        description: User authentication lockout threshold.
        default: '0'
        min: 0
        max: 1024
  fw-policy-violations:
    attributes:
      dst-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Destination IP (0=all).
        default: 0.0.0.0
      dst-port:
        type: integer
        raw_type: integer
        description: Destination port (0=all).
        default: '0'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: Firewall policy violations ID.
        default: '0'
        min: 0
        max: 4294967295
      src-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Source IP (0=all).
        default: 0.0.0.0
      src-port:
        type: integer
        raw_type: integer
        description: Source port (0=all).
        default: '0'
        min: 0
        max: 65535
      threshold:
        type: integer
        raw_type: integer
        description: Firewall policy violation threshold.
        default: '0'
        min: 0
        max: 1024
