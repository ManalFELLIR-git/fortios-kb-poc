id: firewall.profile-protocol-options
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/166172817/config-firewall-profile-protocol-options
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 47
  oversize-log:
    type: enum
    raw_type: option
    description: Enable/disable logging for antivirus oversize file blocking.
    default: disable
  replacemsg-group:
    type: string
    raw_type: string
    description: Name of the replacement message group to be used.
    max_length: 35
  rpc-over-http:
    type: enum
    raw_type: option
    description: Enable/disable inspection of RPC over HTTP.
    default: disable
  switching-protocols-log:
    type: enum
    raw_type: option
    description: Enable/disable logging for HTTP/HTTPS switching protocols.
    default: disable
children:
