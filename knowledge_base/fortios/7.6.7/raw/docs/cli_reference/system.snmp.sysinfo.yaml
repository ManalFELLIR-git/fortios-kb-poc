id: system.snmp.sysinfo
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/195798379/config-system-snmp-sysinfo
attributes:
  append-index:
    type: enum
    raw_type: option
    description: Enable/disable allowance of appending vdom or interface index in some RFC tables.
    default: disable
  contact-info:
    type: string
    raw_type: var-string
    description: Contact information.
    max_length: 255
  description:
    type: string
    raw_type: var-string
    description: System description.
    max_length: 255
  engine-id:
    type: string
    raw_type: string
    description: Local SNMP engineID string (maximum 27 characters).
    max_length: 54
  engine-id-type:
    type: enum
    raw_type: option
    description: Local SNMP engineID type (text/hex/mac).
    default: text
  location:
    type: string
    raw_type: var-string
    description: System location.
    max_length: 255
  non-mgmt-vdom-query:
    type: enum
    raw_type: option
    description: Enable/disable allowance of SNMPv3 query from non-management vdoms.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable SNMP.
    default: disable
  trap-free-memory-threshold:
    type: integer
    raw_type: integer
    description: Free memory usage when trap is sent.
    default: '5'
    min: 1
    max: 100
  trap-freeable-memory-threshold:
    type: integer
    raw_type: integer
    description: Freeable memory usage when trap is sent.
    default: '60'
    min: 1
    max: 100
  trap-high-cpu-threshold:
    type: integer
    raw_type: integer
    description: CPU usage when trap is sent.
    default: '80'
    min: 1
    max: 100
  trap-log-full-threshold:
    type: integer
    raw_type: integer
    description: Log disk usage when trap is sent.
    default: '90'
    min: 1
    max: 100
  trap-low-memory-threshold:
    type: integer
    raw_type: integer
    description: Memory usage when trap is sent.
    default: '80'
    min: 1
    max: 100
children: {}
