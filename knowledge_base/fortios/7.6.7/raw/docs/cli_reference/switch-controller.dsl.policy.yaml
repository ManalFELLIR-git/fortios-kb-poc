id: switch-controller.dsl.policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/208278323/config-switch-controller-dsl-policy
attributes:
  append_padding:
    type: enum
    raw_type: option
    description: Device pause frame configuration.
    default: enable
  cpe-aele:
    type: enum
    raw_type: option
    description: CPE AELE.
    default: enable
  cpe-aele-mode:
    type: enum
    raw_type: option
    description: CPE AELE-Mode with given string.
    default: ELE_MIN
  cs:
    type: enum
    raw_type: option
    description: CPE carrier set.
    default: A43 B43 A43C
  ds-bitswap:
    type: enum
    raw_type: option
    description: Enable/disable bitswap.
    default: enable
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 63
  pause-frame:
    type: enum
    raw_type: option
    description: Device pause frame configuration.
    default: enable
  profile:
    type: enum
    raw_type: option
    description: VDSL CPE profile.
    default: auto-30a
  type:
    type: enum
    raw_type: option
    description: Type.
    default: Proscend
  us-bitswap:
    type: enum
    raw_type: option
    description: Enable/disable bitswap.
    default: enable
children: {}
