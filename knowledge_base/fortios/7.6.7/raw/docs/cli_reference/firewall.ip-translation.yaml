id: firewall.ip-translation
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/542420545/config-firewall-ip-translation
attributes:
  endip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: 'Final IPv4 address (inclusive) in the range of the addresses to be translated (format xxx.xxx.xxx.xxx, default:
      0.0.0.0).'
    default: 0.0.0.0
  map-startip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: 'Address to be used as the starting point for translation in the range (format xxx.xxx.xxx.xxx, default:
      0.0.0.0).'
    default: 0.0.0.0
  startip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: 'First IPv4 address (inclusive) in the range of the addresses to be translated (format xxx.xxx.xxx.xxx, default:
      0.0.0.0).'
    default: 0.0.0.0
  transid:
    type: integer
    raw_type: integer
    description: IP translation ID.
    default: '0'
    min: 0
    max: 4294967295
  type:
    type: enum
    raw_type: option
    description: 'IP translation type (option: SCTP).'
    default: SCTP
children: {}
