id: firewall.vendor-mac
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130611841/config-firewall-vendor-mac
attributes:
  id:
    type: integer
    raw_type: integer
    description: Vendor ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  mac-number:
    type: integer
    raw_type: integer
    description: Total number of MAC addresses. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Vendor name. Read-only.
    max_length: 63
  obsolete:
    type: integer
    raw_type: integer
    description: Indicates whether the Vendor ID can be used. Read-only.
    default: '0'
    min: 0
    max: 255
children: {}
