id: wireless-controller.inter-controller
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/294594760/config-wireless-controller-inter-controller
attributes:
  fast-failover-max:
    type: integer
    raw_type: integer
    description: Maximum number of retransmissions for fast failover HA messages between peer wireless controllers (3 - 64,
      default = 10).
    default: '10'
    min: 3
    max: 64
  fast-failover-wait:
    type: integer
    raw_type: integer
    description: Minimum wait time before an AP transitions from secondary controller to primary controller (10 - 86400 sec,
      default = 10).
    default: '10'
    min: 10
    max: 86400
  inter-controller-key:
    type: password
    raw_type: password
    description: Secret key for inter-controller communications.
  inter-controller-mode:
    type: enum
    raw_type: option
    description: Configure inter-controller mode (disable, l2-roaming, 1+1, default = disable).
    default: disable
  inter-controller-pri:
    type: enum
    raw_type: option
    description: Configure inter-controller's priority (primary or secondary, default = primary).
    default: primary
  l3-roaming:
    type: enum
    raw_type: option
    description: Enable/disable layer 3 roaming (default = disable).
    default: disable
children:
  inter-controller-peer:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      peer-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Peer wireless controller's IP address.
        default: 0.0.0.0
      peer-port:
        type: integer
        raw_type: integer
        description: Port used by the wireless controller's for inter-controller communications (1024 - 49150, default = 5246).
        default: '5246'
        min: 1024
        max: 49150
      peer-priority:
        type: enum
        raw_type: option
        description: Peer wireless controller's priority (primary or secondary, default = primary).
        default: primary
