id: webfilter.ftgd-local-risk
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/178850921/config-webfilter-ftgd-local-risk
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  risk-score:
    type: integer
    raw_type: integer
    description: Local risk score.
    default: '0'
    min: 0
    max: 100
  status:
    type: enum
    raw_type: option
    description: Enable/disable local risk score.
    default: enable
  url:
    type: string
    raw_type: string
    description: URL to rate locally.
    max_length: 511
children: {}
