id: wireless-controller.hotspot20.h2qp-wan-metric
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/877268770/config-wireless-controller-hotspot20-h2qp-wan-metric
attributes:
  downlink-load:
    type: integer
    raw_type: integer
    description: Downlink load.
    default: '0'
    min: 0
    max: 255
  downlink-speed:
    type: integer
    raw_type: integer
    description: Downlink speed (in kilobits/s).
    default: '2400'
    min: 0
    max: 4294967295
  link-at-capacity:
    type: enum
    raw_type: option
    description: Link at capacity.
    default: disable
  link-status:
    type: enum
    raw_type: option
    description: Link status.
    default: up
  load-measurement-duration:
    type: integer
    raw_type: integer
    description: Load measurement duration (in tenths of a second).
    default: '0'
    min: 0
    max: 65535
  name:
    type: string
    raw_type: string
    description: WAN metric name.
    max_length: 35
  symmetric-wan-link:
    type: enum
    raw_type: option
    description: WAN link symmetry.
    default: asymmetric
  uplink-load:
    type: integer
    raw_type: integer
    description: Uplink load.
    default: '0'
    min: 0
    max: 255
  uplink-speed:
    type: integer
    raw_type: integer
    description: Uplink speed (in kilobits/s).
    default: '2400'
    min: 0
    max: 4294967295
children: {}
