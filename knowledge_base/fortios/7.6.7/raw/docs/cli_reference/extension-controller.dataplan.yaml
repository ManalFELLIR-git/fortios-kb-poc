id: extension-controller.dataplan
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260554699/config-extension-controller-dataplan
attributes:
  apn:
    type: string
    raw_type: string
    description: APN configuration.
    max_length: 63
  auth-type:
    type: enum
    raw_type: option
    description: Authentication type.
    default: none
  billing-date:
    type: integer
    raw_type: integer
    description: Billing day of the month (1 - 31).
    default: '1'
    min: 1
    max: 31
  capacity:
    type: integer
    raw_type: integer
    description: Capacity in MB (0 - 102400000).
    default: '0'
    min: 0
    max: 102400000
  carrier:
    type: string
    raw_type: string
    description: Carrier configuration.
    max_length: 31
  iccid:
    type: string
    raw_type: string
    description: ICCID configuration.
    max_length: 31
  modem-id:
    type: enum
    raw_type: option
    description: Dataplan's modem specifics, if any.
    default: all
  monthly-fee:
    type: integer
    raw_type: integer
    description: Monthly fee of dataplan (0 - 100000, in local currency).
    default: '0'
    min: 0
    max: 1000000
  name:
    type: string
    raw_type: string
    description: FortiExtender data plan name.
    max_length: 31
  overage:
    type: enum
    raw_type: option
    description: Enable/disable dataplan overage detection.
    default: disable
  password:
    type: password
    raw_type: password
    description: Password.
  pdn:
    type: enum
    raw_type: option
    description: PDN type.
    default: ipv4-only
  preferred-subnet:
    type: integer
    raw_type: integer
    description: Preferred subnet mask (0 - 32).
    default: '0'
    min: 0
    max: 32
  private-network:
    type: enum
    raw_type: option
    description: Enable/disable dataplan private network support.
    default: disable
  signal-period:
    type: integer
    raw_type: integer
    description: Signal period (600 to 18000 seconds).
    default: '3600'
    min: 600
    max: 18000
  signal-threshold:
    type: integer
    raw_type: integer
    description: Signal threshold. Specify the range between 50 - 100, where 50/100 means -50/-100 dBm.
    default: '100'
    min: 50
    max: 100
  slot:
    type: enum
    raw_type: option
    description: SIM slot configuration.
  type:
    type: enum
    raw_type: option
    description: Type preferences configuration.
    default: generic
  username:
    type: string
    raw_type: string
    description: Username.
    max_length: 127
children: {}
