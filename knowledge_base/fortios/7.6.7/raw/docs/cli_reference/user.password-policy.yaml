id: user.password-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/282941989/config-user-password-policy
attributes:
  expire-days:
    type: integer
    raw_type: integer
    description: Time in days before the user's password expires.
    default: '180'
    min: 0
    max: 999
  expire-status:
    type: enum
    raw_type: option
    description: Enable/disable password expiration.
    default: disable
  expired-password-renewal:
    type: enum
    raw_type: option
    description: Enable/disable renewal of a password that already is expired.
    default: disable
  min-change-characters:
    type: integer
    raw_type: integer
    description: Minimum number of unique characters in new password which do not exist in old password (0 - 128, default
      = 0. This attribute overrides reuse-password if both are enabled).
    default: '0'
    min: 0
    max: 128
  min-lower-case-letter:
    type: integer
    raw_type: integer
    description: Minimum number of lowercase characters in password (0 - 128, default = 0).
    default: '0'
    min: 0
    max: 128
  min-non-alphanumeric:
    type: integer
    raw_type: integer
    description: Minimum number of non-alphanumeric characters in password (0 - 128, default = 0).
    default: '0'
    min: 0
    max: 128
  min-number:
    type: integer
    raw_type: integer
    description: Minimum number of numeric characters in password (0 - 128, default = 0).
    default: '0'
    min: 0
    max: 128
  min-upper-case-letter:
    type: integer
    raw_type: integer
    description: Minimum number of uppercase characters in password (0 - 128, default = 0).
    default: '0'
    min: 0
    max: 128
  minimum-length:
    type: integer
    raw_type: integer
    description: Minimum password length (8 - 128, default = 8).
    default: '8'
    min: 8
    max: 128
  name:
    type: string
    raw_type: string
    description: Password policy name.
    max_length: 35
  reuse-password:
    type: enum
    raw_type: option
    description: Enable/disable reuse of password. If both reuse-password and min-change-characters are enabled, min-change-characters
      overrides.
    default: enable
  reuse-password-limit:
    type: integer
    raw_type: integer
    description: Number of times passwords can be reused (0 - 20, default = 0. If set to 0, can reuse password an unlimited
      number of times.).
    default: '0'
    min: 0
    max: 20
  warn-days:
    type: integer
    raw_type: integer
    description: Time in days before a password expiration warning message is displayed to the user upon login.
    default: '15'
    min: 0
    max: 30
children: {}
