id: switch-controller.switch-log
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/111333988/config-switch-controller-switch-log
attributes:
  severity:
    type: enum
    raw_type: option
    description: Severity of FortiSwitch logs that are added to the FortiGate event log.
