id: wireless-controller.hotspot20.anqp-nai-realm
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/284381219/config-wireless-controller-hotspot20-anqp-nai-realm
attributes:
  name:
    type: string
    raw_type: string
    description: NAI realm list name.
    max_length: 35
children:
  nai-list:
    attributes:
      encoding:
        type: enum
        raw_type: option
        description: Enable/disable format in accordance with IETF RFC 4282.
        default: enable
      nai-realm:
        type: string
        raw_type: string
        description: Configure NAI realms (delimited by a semi-colon character).
        max_length: 255
      name:
        type: string
        raw_type: string
        description: NAI realm name.
        max_length: 35
  eap-method:
    attributes:
      index:
        type: integer
        raw_type: integer
        description: EAP method index.
        default: '0'
        min: 1
        max: 5
      method:
        type: enum
        raw_type: option
        description: EAP method type.
        default: eap-identity
