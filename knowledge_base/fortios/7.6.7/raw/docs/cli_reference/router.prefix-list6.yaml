id: router.prefix-list6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/156775425/config-router-prefix-list6
attributes:
  comments:
    type: string
    raw_type: string
    description: Comment.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Permit or deny packets that match this rule.
        default: permit
      flags:
        type: integer
        raw_type: integer
        description: Flags. Read-only.
        default: '0'
        min: 0
        max: 4294967295
      ge:
        type: integer
        raw_type: integer
        description: Minimum prefix length to be matched (0 - 128).
        min: 0
        max: 128
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
      le:
        type: integer
        raw_type: integer
        description: Maximum prefix length to be matched (0 - 128).
        min: 0
        max: 128
      prefix6:
        type: string
        raw_type: user
        description: IPv6 prefix to define regular filter criteria, such as "any" or subnets.
