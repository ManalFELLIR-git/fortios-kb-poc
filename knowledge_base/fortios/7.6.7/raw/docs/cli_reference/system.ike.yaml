id: system.ike
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/193360997/config-system-ike
attributes:
  dh-keypair-cache:
    type: enum
    raw_type: option
    description: Enable/disable Diffie-Hellman key pair cache.
    default: enable
  dh-keypair-count:
    type: integer
    raw_type: integer
    description: Number of key pairs to pre-generate for each Diffie-Hellman group (per-worker).
    default: 100 **
    min: 0
    max: 50000
  dh-keypair-throttle:
    type: enum
    raw_type: option
    description: Enable/disable Diffie-Hellman key pair cache CPU throttling.
    default: enable
  dh-mode:
    type: enum
    raw_type: option
    description: Use software (CPU) or hardware (CPX) to perform Diffie-Hellman calculations.
    default: hardware **
  dh-multiprocess:
    type: enum
    raw_type: option
    description: Enable/disable multiprocess Diffie-Hellman daemon for IKE.
    default: enable
  dh-worker-count:
    type: integer
    raw_type: integer
    description: Number of Diffie-Hellman workers to start.
    default: '0'
    min: 1
    max: 8
  embryonic-limit:
    type: integer
    raw_type: integer
    description: Maximum number of IPsec tunnels to negotiate simultaneously.
    default: 5000 **
    min: 50
    max: 20000
children:
