id: wanopt.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/365383488/config-wanopt-profile
attributes:
  auth-group:
    type: string
    raw_type: string
    description: Optionally add an authentication group to restrict access to the WAN Optimization tunnel to peers in the
      authentication group.
    max_length: 35
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Profile name.
    max_length: 35
  transparent:
    type: enum
    raw_type: option
    description: Enable/disable transparent mode.
    default: enable
children:
  cifs:
    attributes:
      byte-caching:
        type: enum
        raw_type: option
        description: Enable/disable byte-caching. Byte caching reduces the amount of traffic by caching file data sent across
          the WAN and in future serving if from the cache.
        default: enable
      prefer-chunking:
        type: enum
        raw_type: option
        description: Select dynamic or fixed-size data chunking for WAN Optimization.
        default: fix
      protocol-opt:
        type: enum
        raw_type: option
        description: Select protocol specific optimization or generic TCP optimization.
        default: protocol
      secure-tunnel:
        type: enum
        raw_type: option
        description: Enable/disable securing the WAN Opt tunnel using SSL. Secure and non-secure tunnels use the same TCP
          port (7810).
        default: disable
      status:
        type: enum
        raw_type: option
        description: Enable/disable WAN Optimization.
        default: disable
      tunnel-sharing:
        type: enum
        raw_type: option
        description: Tunnel sharing mode for aggressive/non-aggressive and/or interactive/non-interactive protocols.
        default: private
