id: firewall.vipgrp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/318298644/config-firewall-vipgrp
attributes:
  color:
    type: integer
    raw_type: integer
    description: Integer value to determine the color of the icon in the GUI (range 1 to 32, default = 0, which sets the value
      to 1).
    default: '0'
    min: 0
    max: 32
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  interface:
    type: string
    raw_type: string
    description: Interface.
    max_length: 35
  member:
    type: string
    raw_type: string
    description: Member VIP objects of the group (Separate multiple objects with a space). VIP name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: VIP group name.
    max_length: 79
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
