id: wanopt.content-delivery-network-rule
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/946804468/config-wanopt-content-delivery-network-rule
attributes:
  category:
    type: enum
    raw_type: option
    description: Content delivery network rule category.
    default: vcache
  comment:
    type: string
    raw_type: var-string
    description: Comment about this CDN-rule.
    max_length: 255
  host-domain-name-suffix:
    type: string
    raw_type: string
    description: Suffix portion of the fully qualified domain name. For example, fortinet.com in "www.fortinet.com". Suffix
      portion of the fully qualified domain name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 35
  request-cache-control:
    type: enum
    raw_type: option
    description: Enable/disable HTTP request cache control.
    default: disable
  response-cache-control:
    type: enum
    raw_type: option
    description: Enable/disable HTTP response cache control.
    default: disable
  response-expires:
    type: enum
    raw_type: option
    description: Enable/disable HTTP response cache expires.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable WAN optimization content delivery network rules.
    default: enable
  updateserver:
    type: enum
    raw_type: option
    description: Enable/disable update server.
    default: disable
children:
  rules:
    attributes:
      match-mode:
        type: enum
        raw_type: option
        description: Match criteria for collecting content ID.
        default: all
      name:
        type: string
        raw_type: string
        description: WAN optimization content delivery network rule name.
        max_length: 35
      skip-rule-mode:
        type: enum
        raw_type: option
        description: Skip mode when evaluating skip-rules.
        default: all
  content-id:
    attributes:
      end-direction:
        type: enum
        raw_type: option
        description: Search direction from end-str match.
        default: forward
      end-skip:
        type: integer
        raw_type: integer
        description: Number of characters in URL to skip after end-str has been matched.
        default: '0'
        min: 0
        max: 4294967295
      end-str:
        type: string
        raw_type: string
        description: String from which to end search.
        max_length: 35
      range-str:
        type: string
        raw_type: string
        description: Name of content ID within the start string and end string.
        max_length: 35
      start-direction:
        type: enum
        raw_type: option
        description: Search direction from start-str match.
        default: forward
      start-skip:
        type: integer
        raw_type: integer
        description: Number of characters in URL to skip after start-str has been matched.
        default: '0'
        min: 0
        max: 4294967295
      start-str:
        type: string
        raw_type: string
        description: String from which to start search.
        default: /
        max_length: 35
      target:
        type: enum
        raw_type: option
        description: Option in HTTP header or URL parameter to match.
        default: path
  match-entries:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
      pattern:
        type: string
        raw_type: string
        description: Pattern string for matching target (Referrer or URL pattern). For example, a, a*c, *a*, a*c*e, and *.
          Pattern strings.
        max_length: 79
      target:
        type: enum
        raw_type: option
        description: Option in HTTP header or URL parameter to match.
        default: path
  skip-entries:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
      pattern:
        type: string
        raw_type: string
        description: Pattern string for matching target (Referrer or URL pattern). For example, a, a*c, *a*, a*c*e, and *.
          Pattern strings.
        max_length: 79
      target:
        type: enum
        raw_type: option
        description: Option in HTTP header or URL parameter to match.
        default: path
