id: wireless-controller.snmp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/601742472/config-wireless-controller-snmp
attributes:
  contact-info:
    type: string
    raw_type: string
    description: Contact Information.
    max_length: 31
  engine-id:
    type: string
    raw_type: string
    description: AC SNMP engineID string (maximum 24 characters).
    max_length: 23
  trap-high-cpu-threshold:
    type: integer
    raw_type: integer
    description: CPU usage when trap is sent.
    default: '80'
    min: 10
    max: 100
  trap-high-mem-threshold:
    type: integer
    raw_type: integer
    description: Memory usage when trap is sent.
    default: '80'
    min: 10
    max: 100
children:
  community:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Community ID.
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Community name.
        max_length: 35
      query-v1-status:
        type: enum
        raw_type: option
        description: Enable/disable SNMP v1 queries.
        default: enable
      query-v2c-status:
        type: enum
        raw_type: option
        description: Enable/disable SNMP v2c queries.
        default: enable
      status:
        type: enum
        raw_type: option
        description: Enable/disable this SNMP community.
        default: enable
      trap-v1-status:
        type: enum
        raw_type: option
        description: Enable/disable SNMP v1 traps.
        default: enable
      trap-v2c-status:
        type: enum
        raw_type: option
        description: Enable/disable SNMP v2c traps.
        default: enable
  hosts:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Host entry ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: string
        raw_type: user
        description: IPv4 address of the SNMP manager (host).
  hosts6:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Host6 entry ID.
        default: '0'
        min: 0
        max: 4294967295
      ipv6:
        type: ipv6-prefix
        raw_type: ipv6-prefix
        description: IPv6 address of the SNMP manager (host).
        default: ::/0
  user:
    attributes:
      auth-proto:
        type: enum
        raw_type: option
        description: Authentication protocol.
        default: sha
      auth-pwd:
        type: password
        raw_type: password
        description: Password for authentication protocol.
      name:
        type: string
        raw_type: string
        description: SNMP user name.
        max_length: 32
      notify-hosts:
        type: ipv4-address
        raw_type: ipv4-address
        description: Configure SNMP User Notify Hosts.
      notify-hosts6:
        type: ipv6-address
        raw_type: ipv6-address
        description: Configure IPv6 SNMP User Notify Hosts.
      priv-proto:
        type: enum
        raw_type: option
        description: Privacy (encryption) protocol.
        default: aes
      priv-pwd:
        type: password
        raw_type: password
        description: Password for privacy (encryption) protocol.
      queries:
        type: enum
        raw_type: option
        description: Enable/disable SNMP queries for this user.
        default: enable
      security-level:
        type: enum
        raw_type: option
        description: Security level for message authentication and encryption.
        default: no-auth-no-priv
      status:
        type: enum
        raw_type: option
        description: SNMP user enable.
        default: enable
      trap-status:
        type: enum
        raw_type: option
        description: Enable/disable traps for this SNMP user.
        default: disable
