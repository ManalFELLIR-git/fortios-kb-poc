id: firewall.proxy-addrgrp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/648355124/config-firewall-proxy-addrgrp
attributes:
  color:
    type: integer
    raw_type: integer
    description: Integer value to determine the color of the icon in the GUI (1 - 32, default = 0, which sets value to 1).
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  member:
    type: string
    raw_type: string
    description: Members of address group. Address name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Address group name.
    max_length: 79
  type:
    type: enum
    raw_type: option
    description: Source or destination address group type.
    default: src
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children:
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
