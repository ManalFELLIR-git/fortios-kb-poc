id: webfilter.fortiguard
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/247552369/config-webfilter-fortiguard
attributes:
  cache-mem-permille:
    type: integer
    raw_type: integer
    description: Maximum permille of available memory allocated to caching (1 - 150).
    default: '1'
    min: 1
    max: 150
  cache-mode:
    type: enum
    raw_type: option
    description: Cache entry expiration mode.
    default: ttl
  cache-prefix-match:
    type: enum
    raw_type: option
    description: Enable/disable prefix matching in the cache.
    default: enable
  close-ports:
    type: enum
    raw_type: option
    description: Close ports used for HTTP/HTTPS override authentication and disable user overrides.
    default: disable
  embed-image:
    type: enum
    raw_type: option
    description: Enable/disable embedding images into replacement messages (default = enable).
    default: enable
  ovrd-auth-https:
    type: enum
    raw_type: option
    description: Enable/disable use of HTTPS for override authentication.
    default: enable
  ovrd-auth-port-http:
    type: integer
    raw_type: integer
    description: Port to use for FortiGuard Web Filter HTTP override authentication.
    default: '8008'
    min: 0
    max: 65535
  ovrd-auth-port-https:
    type: integer
    raw_type: integer
    description: Port to use for FortiGuard Web Filter HTTPS override authentication in proxy mode.
    default: '8010'
    min: 0
    max: 65535
  ovrd-auth-port-https-flow:
    type: integer
    raw_type: integer
    description: Port to use for FortiGuard Web Filter HTTPS override authentication in flow mode.
    default: '8015'
    min: 0
    max: 65535
  ovrd-auth-port-warning:
    type: integer
    raw_type: integer
    description: Port to use for FortiGuard Web Filter Warning override authentication.
    default: '8020'
    min: 0
    max: 65535
  request-packet-size-limit:
    type: integer
    raw_type: integer
    description: Limit size of URL request packets sent to FortiGuard server (0 for default).
    default: '0'
    min: 576
    max: 10000
  warn-auth-https:
    type: enum
    raw_type: option
    description: Enable/disable use of HTTPS for warning and authentication.
    default: enable
children: {}
