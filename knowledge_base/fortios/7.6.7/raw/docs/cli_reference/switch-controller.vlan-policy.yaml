id: switch-controller.vlan-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/134245756/config-switch-controller-vlan-policy
attributes:
  allowed-vlans:
    type: string
    raw_type: string
    description: Allowed VLANs to be applied when using this VLAN policy. VLAN name.
    max_length: 79
  allowed-vlans-all:
    type: enum
    raw_type: option
    description: Enable/disable all defined VLANs when using this VLAN policy.
    default: disable
  description:
    type: string
    raw_type: string
    description: Description for the VLAN policy.
    max_length: 63
  discard-mode:
    type: enum
    raw_type: option
    description: Discard mode to be applied when using this VLAN policy.
    default: none
  fortilink:
    type: string
    raw_type: string
    description: FortiLink interface for which this VLAN policy belongs to.
    max_length: 15
  name:
    type: string
    raw_type: string
    description: VLAN policy name.
    max_length: 63
  untagged-vlans:
    type: string
    raw_type: string
    description: Untagged VLANs to be applied when using this VLAN policy. VLAN name.
    max_length: 79
  vlan:
    type: string
    raw_type: string
    description: Native VLAN to be applied when using this VLAN policy.
    max_length: 15
children: {}
