id: system.geoip-override
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/548700923/config-system-geoip-override
attributes:
  country-id:
    type: string
    raw_type: string
    description: Two character Country ID code.
    max_length: 2
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Location name.
    max_length: 63
children:
  ip-range:
    attributes:
      end-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: 'Ending IP address, inclusive, of the address range (format: xxx.xxx.xxx.xxx).'
        default: 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: ID of individual entry in the IP range table.
        default: '0'
        min: 0
        max: 65535
      start-ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: 'Starting IP address, inclusive, of the address range (format: xxx.xxx.xxx.xxx).'
        default: 0.0.0.0
  ip6-range:
    attributes:
      end-ip:
        type: ipv6-address
        raw_type: ipv6-address
        description: 'Ending IP address, inclusive, of the address range (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
        default: '::'
      id:
        type: integer
        raw_type: integer
        description: ID of individual entry in the IPv6 range table.
        default: '0'
        min: 0
        max: 65535
      start-ip:
        type: ipv6-address
        raw_type: ipv6-address
        description: 'Starting IP address, inclusive, of the address range (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
        default: '::'
