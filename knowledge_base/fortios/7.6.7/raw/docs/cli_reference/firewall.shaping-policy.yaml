id: firewall.shaping-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/968775025/config-firewall-shaping-policy
attributes:
  app-category:
    type: integer
    raw_type: integer
    description: IDs of one or more application categories that this shaper applies application control traffic shaping to.
      Category IDs.
    min: 0
    max: 4294967295
  app-group:
    type: string
    raw_type: string
    description: One or more application group names. Application group name.
    max_length: 79
  application:
    type: integer
    raw_type: integer
    description: IDs of one or more applications that this shaper applies application control traffic shaping to. Application
      IDs.
    min: 0
    max: 4294967295
  class-id:
    type: integer
    raw_type: integer
    description: Traffic class ID.
    default: '0'
    min: 0
    max: 4294967295
  comment:
    type: string
    raw_type: var-string
    description: Comments.
    max_length: 255
  cos:
    type: string
    raw_type: user
    description: VLAN CoS bit pattern.
  cos-mask:
    type: string
    raw_type: user
    description: VLAN CoS evaluated bits.
  diffserv-forward:
    type: enum
    raw_type: option
    description: Enable to change packet's DiffServ values to the specified diffservcode-forward value.
    default: disable
  diffserv-reverse:
    type: enum
    raw_type: option
    description: Enable to change packet's reverse (reply) DiffServ values to the specified diffservcode-rev value.
    default: disable
  diffservcode-forward:
    type: string
    raw_type: user
    description: Change packet's DiffServ to this value.
  diffservcode-rev:
    type: string
    raw_type: user
    description: Change packet's reverse (reply) DiffServ to this value.
  dstaddr:
    type: string
    raw_type: string
    description: IPv4 destination address and address group names. Address name.
    max_length: 79
  dstaddr6:
    type: string
    raw_type: string
    description: IPv6 destination address and address group names. Address name.
    max_length: 79
  dstintf:
    type: string
    raw_type: string
    description: One or more outgoing (egress) interfaces. Interface name.
    max_length: 79
  groups:
    type: string
    raw_type: string
    description: Apply this traffic shaping policy to user groups that have authenticated with the FortiGate. Group name.
    max_length: 79
  id:
    type: integer
    raw_type: integer
    description: Shaping policy ID (0 - 4294967295).
    default: '0'
    min: 0
    max: 4294967295
  internet-service:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address and service are
      not used.
    default: disable
  internet-service-custom:
    type: string
    raw_type: string
    description: Custom Internet Service name. Custom Internet Service name.
    max_length: 79
  internet-service-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service group name. Custom Internet Service group name.
    max_length: 79
  internet-service-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-group:
    type: string
    raw_type: string
    description: Internet Service group name. Internet Service group name.
    max_length: 79
  internet-service-name:
    type: string
    raw_type: string
    description: Internet Service ID. Internet Service name.
    max_length: 79
  internet-service-src:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services in source for this policy. If enabled, source address is not used.
    default: disable
  internet-service-src-custom:
    type: string
    raw_type: string
    description: Custom Internet Service source name. Custom Internet Service name.
    max_length: 79
  internet-service-src-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service source group name. Custom Internet Service group name.
    max_length: 79
  internet-service-src-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service source name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-src-group:
    type: string
    raw_type: string
    description: Internet Service source group name. Internet Service group name.
    max_length: 79
  internet-service-src-name:
    type: string
    raw_type: string
    description: Internet Service source name. Internet Service name.
    max_length: 79
  ip-version:
    type: enum
    raw_type: option
    description: Apply this traffic shaping policy to IPv4 or IPv6 traffic.
    default: '4'
  name:
    type: string
    raw_type: string
    description: Shaping policy name.
    max_length: 35
  per-ip-shaper:
    type: string
    raw_type: string
    description: Per-IP traffic shaper to apply with this policy.
    max_length: 35
  schedule:
    type: string
    raw_type: string
    description: Schedule name.
    max_length: 35
  service:
    type: string
    raw_type: string
    description: Service and service group names. Service name.
    max_length: 79
  srcaddr:
    type: string
    raw_type: string
    description: IPv4 source address and address group names. Address name.
    max_length: 79
  srcaddr6:
    type: string
    raw_type: string
    description: IPv6 source address and address group names. Address name.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: One or more incoming (ingress) interfaces. Interface name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: Enable/disable this traffic shaping policy.
    default: enable
  tos:
    type: string
    raw_type: user
    description: ToS (Type of Service) value used for comparison.
  tos-mask:
    type: string
    raw_type: user
    description: Non-zero bit positions are used for comparison while zero bit positions are ignored.
  tos-negate:
    type: enum
    raw_type: option
    description: Enable negated TOS match.
    default: disable
  traffic-shaper:
    type: string
    raw_type: string
    description: Traffic shaper to apply to traffic forwarded by the firewall policy.
    max_length: 35
  traffic-shaper-reverse:
    type: string
    raw_type: string
    description: Traffic shaper to apply to response traffic received by the firewall policy.
    max_length: 35
  traffic-type:
    type: enum
    raw_type: option
    description: Traffic type.
    default: forwarding
  url-category:
    type: integer
    raw_type: integer
    description: IDs of one or more FortiGuard Web Filtering categories that this shaper applies traffic shaping to. URL category
      ID.
    min: 0
    max: 4294967295
  users:
    type: string
    raw_type: string
    description: Apply this traffic shaping policy to individual users that have authenticated with the FortiGate. User name.
    max_length: 79
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
