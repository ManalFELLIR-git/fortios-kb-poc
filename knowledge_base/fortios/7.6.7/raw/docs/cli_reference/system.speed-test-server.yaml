id: system.speed-test-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/116264550/config-system-speed-test-server
attributes:
  name:
    type: string
    raw_type: string
    description: Speed test server name.
    max_length: 35
  timestamp:
    type: integer
    raw_type: integer
    description: Speed test server timestamp.
    default: '0'
    min: 0
    max: 4294967295
children:
  host:
    attributes:
      distance:
        type: integer
        raw_type: integer
        description: Speed test host distance.
        default: '0'
        min: 0
        max: 4294967295
      id:
        type: integer
        raw_type: integer
        description: Server host ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: Server host IPv4 address.
        default: 0.0.0.0
      latitude:
        type: string
        raw_type: string
        description: Speed test host latitude.
        max_length: 7
      longitude:
        type: string
        raw_type: string
        description: Speed test host longitude.
        max_length: 7
      password:
        type: password
        raw_type: password
        description: Speed test host password.
      port:
        type: integer
        raw_type: integer
        description: Server host port number to communicate with client.
        default: '5204'
        min: 1
        max: 65535
      user:
        type: string
        raw_type: string
        description: Speed test host user name.
        max_length: 64
