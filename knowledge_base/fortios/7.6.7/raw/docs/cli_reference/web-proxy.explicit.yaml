id: web-proxy.explicit
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/153691562/config-web-proxy-explicit
attributes:
  client-cert:
    type: enum
    raw_type: option
    description: Enable/disable to request client certificate.
    default: disable
  empty-cert-action:
    type: enum
    raw_type: option
    description: Action of an empty client certificate.
    default: block
  ftp-incoming-port:
    type: string
    raw_type: user
    description: Accept incoming FTP-over-HTTP requests on one or more ports (0 - 65535, default = 0; use the same as HTTP).
  ftp-over-http:
    type: enum
    raw_type: option
    description: Enable to proxy FTP-over-HTTP sessions sent from a web browser.
    default: disable
  http-connection-mode:
    type: enum
    raw_type: option
    description: HTTP connection mode (default = static).
    default: static
  http-incoming-port:
    type: string
    raw_type: user
    description: Accept incoming HTTP requests on one or more ports (0 - 65535, default = 8080).
  https-incoming-port:
    type: string
    raw_type: user
    description: Accept incoming HTTPS requests on one or more ports (0 - 65535, default = 0, use the same as HTTP).
  https-replacement-message:
    type: enum
    raw_type: option
    description: Enable/disable sending the client a replacement message for HTTPS requests.
    default: enable
  incoming-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Restrict the explicit HTTP proxy to only accept sessions from this IP address. An interface must have this
      IP address.
    default: 0.0.0.0
  incoming-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Restrict the explicit web proxy to only accept sessions from this IPv6 address. An interface must have this
      IPv6 address.
    default: '::'
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: sdwan
  ipv6-status:
    type: enum
    raw_type: option
    description: Enable/disable allowing an IPv6 web proxy destination in policies and all IPv6 related entries in this command.
    default: disable
  message-upon-server-error:
    type: enum
    raw_type: option
    description: Enable/disable displaying a replacement message when a server error is detected.
    default: enable
  outgoing-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Outgoing HTTP requests will have this IP address as their source address. An interface must have this IP
      address.
  outgoing-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Outgoing HTTP requests will leave this IPv6. Multiple interfaces can be specified. Interfaces must have these
      IPv6 addresses.
  pac-file-data:
    type: string
    raw_type: user
    description: PAC file contents enclosed in quotes (maximum of 256K bytes).
  pac-file-name:
    type: string
    raw_type: string
    description: Pac file name.
    default: proxy.pac
    max_length: 63
  pac-file-server-port:
    type: string
    raw_type: user
    description: Port number that PAC traffic from client web browsers uses to connect to the explicit web proxy (0 - 65535,
      default = 0; use the same as HTTP).
  pac-file-server-status:
    type: enum
    raw_type: option
    description: Enable/disable Proxy Auto-Configuration (PAC) for users of this explicit proxy profile.
    default: disable
  pac-file-through-https:
    type: enum
    raw_type: option
    description: Enable/disable to get Proxy Auto-Configuration (PAC) through HTTPS.
    default: disable
  pac-file-url:
    type: string
    raw_type: user
    description: PAC file access URL. Read-only.
  pref-dns-result:
    type: enum
    raw_type: option
    description: Prefer resolving addresses using the configured IPv4 or IPv6 DNS server (default = ipv4).
    default: ipv4
  realm:
    type: string
    raw_type: string
    description: Authentication realm used to identify the explicit web proxy (maximum of 63 characters).
    default: default
    max_length: 63
  sec-default-action:
    type: enum
    raw_type: option
    description: Accept or deny explicit web proxy sessions when no web proxy firewall policy exists.
    default: deny
  secure-web-proxy:
    type: enum
    raw_type: option
    description: Enable/disable/require the secure web proxy for HTTP and HTTPS session.
    default: disable
  secure-web-proxy-cert:
    type: string
    raw_type: string
    description: Name of certificates for secure web proxy. Certificate list.
    max_length: 79
  socks:
    type: enum
    raw_type: option
    description: Enable/disable the SOCKS proxy.
    default: disable
  socks-incoming-port:
    type: string
    raw_type: user
    description: Accept incoming SOCKS proxy requests on one or more ports (0 - 65535, default = 0; use the same as HTTP).
  ssl-algorithm:
    type: enum
    raw_type: option
    description: 'Relative strength of encryption algorithms accepted in HTTPS deep scan: high, medium, or low.'
    default: low
  ssl-dh-bits:
    type: enum
    raw_type: option
    description: Bit-size of Diffie-Hellman (DH) prime used in DHE-RSA negotiation (default = 2048).
    default: '2048'
  status:
    type: enum
    raw_type: option
    description: Enable/disable the explicit Web proxy for HTTP and HTTPS session.
    default: disable
  strict-guest:
    type: enum
    raw_type: option
    description: Enable/disable strict guest user checking by the explicit web proxy.
    default: disable
  trace-auth-no-rsp:
    type: enum
    raw_type: option
    description: Enable/disable logging timed-out authentication requests.
    default: disable
  unknown-http-version:
    type: enum
    raw_type: option
    description: How to handle HTTP sessions that do not comply with HTTP 0.9, 1.0, or 1.1.
    default: reject
  user-agent-detect:
    type: enum
    raw_type: option
    description: Enable/disable to detect device type by HTTP user-agent if no client certificate provided.
    default: enable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '-1'
    min: 0
    max: 511
children:
  pac-policy:
    attributes:
      comments:
        type: string
        raw_type: var-string
        description: Optional comments.
        max_length: 1023
      dstaddr:
        type: string
        raw_type: string
        description: Destination address objects. Address name.
        max_length: 79
      pac-file-data:
        type: string
        raw_type: user
        description: PAC file contents enclosed in quotes (maximum of 256K bytes).
      pac-file-name:
        type: string
        raw_type: string
        description: Pac file name.
        default: proxy.pac
        max_length: 63
      policyid:
        type: integer
        raw_type: integer
        description: Policy ID.
        default: '0'
        min: 1
        max: 100
      srcaddr:
        type: string
        raw_type: string
        description: Source address objects. Address name.
        max_length: 79
      srcaddr6:
        type: string
        raw_type: string
        description: Source address6 objects. Address name.
        max_length: 79
      status:
        type: enum
        raw_type: option
        description: Enable/disable policy.
        default: enable
