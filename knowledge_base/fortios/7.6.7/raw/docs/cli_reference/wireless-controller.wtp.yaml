        default: offline
      port5-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 5 to SSID.
        max_length: 15
      port6-mode:
        type: enum
        raw_type: option
        description: LAN port 6 mode.
        default: offline
      port6-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 6 to SSID.
        max_length: 15
      port7-mode:
        type: enum
        raw_type: option
        description: LAN port 7 mode.
        default: offline
      port7-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 7 to SSID.
        max_length: 15
      port8-mode:
        type: enum
        raw_type: option
        description: LAN port 8 mode.
        default: offline
      port8-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 8 to SSID.
        max_length: 15
  radio-1:
    attributes:
      auto-power-high:
        type: integer
        raw_type: integer
        description: The upper bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
        default: '17'
        min: 0
        max: 4294967295
      auto-power-level:
        type: enum
        raw_type: option
        description: Enable/disable automatic power-level adjustment to prevent co-channel interference (default = enable).
        default: disable
      auto-power-low:
        type: integer
        raw_type: integer
        description: The lower bound of automatic transmit power adjustment in dBm (the actual range of transmit power depends
          on the AP platform type).
        default: '10'
        min: 0
        max: 4294967295
      auto-power-target:
        type: string
        raw_type: string
        description: Target of automatic transmit power adjustment in dBm (-95 to -20, default = -70).
        default: '-70'
        max_length: 7
      band:
        type: enum
        raw_type: option
        description: WiFi band that Radio 1 operates on.
      channel:
        type: string
        raw_type: string
        description: Selected list of wireless radio channels. Channel number.
        max_length: 3
      drma-manual-mode:
        type: enum
        raw_type: option
        description: Radio mode to be used for DRMA manual mode (default = ncf).
        default: ncf
      override-band:
        type: enum
        raw_type: option
        description: Enable to override the WTP profile band setting.
        default: disable
      override-channel:
        type: enum
        raw_type: option
        description: Enable to override WTP profile channel settings.
        default: disable
      override-txpower:
        type: enum
        raw_type: option
        description: Enable to override the WTP profile power level configuration.
        default: disable
      override-vaps:
        type: enum
        raw_type: option
        description: Enable to override WTP profile Virtual Access Point (VAP) settings.
        default: disable
      power-level:
        type: integer
        raw_type: integer
        description: Radio EIRP power level as a percentage of the maximum EIRP power (0 - 100, default = 100).
        default: '100'
        min: 0
        max: 100
      power-mode:
        type: enum
        raw_type: option
        description: Set radio effective isotropic radiated power (EIRP) in dBm or by a percentage of the maximum EIRP (default
          = percentage). This power takes into account both radio transmit power and antenna gain. Higher power level settings
          may be constrained by local regulatory requirements and AP capabilities.
        default: percentage
      power-value:
        type: integer
        raw_type: integer
        description: Radio EIRP power in dBm (1 - 33, default = 27).
        default: '27'
        min: 1
        max: 33
      vap-all:
        type: enum
        raw_type: option
        description: Configure method for assigning SSIDs to this FortiAP (default = automatically assign tunnel SSIDs).
        default: tunnel
      vaps:
        type: string
        raw_type: string
        description: Manually selected list of Virtual Access Points (VAPs). Virtual Access Point (VAP) name.
        max_length: 35
