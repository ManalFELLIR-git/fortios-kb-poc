id: wireless-controller.wtp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/221793529/config-wireless-controller-wtp
attributes:
  admin:
    type: enum
    raw_type: option
    description: Configure how the FortiGate operating as a wireless controller discovers and manages this WTP, AP or FortiAP.
    default: enable
  allowaccess:
    type: enum
    raw_type: option
    description: Control management access to the managed WTP, FortiAP, or AP. Separate entries with a space.
  apcfg-profile:
    type: string
    raw_type: string
    description: AP local configuration profile name.
    max_length: 35
  ble-major-id:
    type: integer
    raw_type: integer
    description: Override BLE Major ID.
    default: '0'
    min: 0
    max: 65535
  ble-minor-id:
    type: integer
    raw_type: integer
    description: Override BLE Minor ID.
    default: '0'
    min: 0
    max: 65535
  bonjour-profile:
    type: string
    raw_type: string
    description: Bonjour profile name.
    max_length: 35
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  coordinate-latitude:
    type: string
    raw_type: string
    description: WTP latitude coordinate.
    max_length: 19
  coordinate-longitude:
    type: string
    raw_type: string
    description: WTP longitude coordinate.
    max_length: 19
  default-mesh-root:
    type: enum
    raw_type: option
    description: Configure default mesh root SSID when it is not included by radio's SSID configuration.
    default: disable
  firmware-provision:
    type: string
    raw_type: string
    description: Firmware version to provision to this FortiAP on bootup (major.minor.build, i.e. 6.2.1234).
    max_length: 35
  firmware-provision-latest:
    type: enum
    raw_type: option
    description: Enable/disable one-time automatic provisioning of the latest firmware version.
    default: disable
  image-download:
    type: enum
    raw_type: option
    description: Enable/disable WTP image download.
    default: enable
  index:
    type: integer
    raw_type: integer
    description: Index (0 - 4294967295). Read-only.
    default: '0'
    min: 0
    max: 4294967295
  ip-fragment-preventing:
    type: enum
    raw_type: option
    description: Method(s) by which IP fragmentation is prevented for control and data packets through CAPWAP tunnel (default
      = tcp-mss-adjust).
    default: tcp-mss-adjust
  led-state:
    type: enum
    raw_type: option
    description: Enable to allow the FortiAPs LEDs to light. Disable to keep the LEDs off. You may want to keep the LEDs off
      so they are not distracting in low light areas etc.
    default: enable
  location:
    type: string
    raw_type: string
    description: Field for describing the physical location of the WTP, AP or FortiAP.
    max_length: 35
  login-passwd:
    type: password
    raw_type: password
    description: Set the managed WTP, FortiAP, or AP's administrator password.
  login-passwd-change:
    type: enum
    raw_type: option
    description: Change or reset the administrator password of a managed WTP, FortiAP or AP (yes, default, or no, default
      = no).
    default: 'no'
  mesh-bridge-enable:
    type: enum
    raw_type: option
    description: Enable/disable mesh Ethernet bridge when WTP is configured as a mesh branch/leaf AP.
    default: default
  name:
    type: string
    raw_type: string
    description: WTP, AP or FortiAP configuration name.
    max_length: 35
  override-allowaccess:
    type: enum
    raw_type: option
    description: Enable to override the WTP profile management access configuration.
    default: disable
  override-default-mesh-root:
    type: enum
    raw_type: option
    description: Enable to override the WTP profile default mesh root SSID setting.
    default: disable
  override-ip-fragment:
    type: enum
    raw_type: option
    description: Enable/disable overriding the WTP profile IP fragment prevention setting.
    default: disable
  override-lan:
    type: enum
    raw_type: option
    description: Enable to override the WTP profile LAN port setting.
    default: disable
  override-led-state:
    type: enum
    raw_type: option
    description: Enable to override the profile LED state setting for this FortiAP. You must enable this option to use the
      led-state command to turn off the FortiAP's LEDs.
    default: disable
  override-login-passwd-change:
    type: enum
    raw_type: option
    description: Enable to override the WTP profile login-password (administrator password) setting.
    default: disable
  override-split-tunnel:
    type: enum
    raw_type: option
    description: Enable/disable overriding the WTP profile split tunneling setting.
    default: disable
  override-wan-port-mode:
    type: enum
    raw_type: option
    description: Enable/disable overriding the wan-port-mode in the WTP profile.
    default: disable
  purdue-level:
    type: enum
    raw_type: option
    description: Purdue Level of this WTP.
    default: '3'
  region:
    type: string
    raw_type: string
    description: Region name WTP is associated with.
    max_length: 35
  region-x:
    type: string
    raw_type: string
    description: Relative horizontal region coordinate (between 0 and 1).
    default: '0'
    max_length: 15
  region-y:
    type: string
    raw_type: string
    description: Relative vertical region coordinate (between 0 and 1).
    default: '0'
    max_length: 15
  split-tunneling-acl-local-ap-subnet:
    type: enum
    raw_type: option
    description: Enable/disable automatically adding local subnetwork of FortiAP to split-tunneling ACL (default = disable).
    default: disable
  split-tunneling-acl-path:
    type: enum
    raw_type: option
    description: Split tunneling ACL path is local/tunnel.
    default: local
  tun-mtu-downlink:
    type: integer
    raw_type: integer
    description: The MTU of downlink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU of FortiAP; default = 0).
    default: '0'
    min: 576
    max: 1500
  tun-mtu-uplink:
    type: integer
    raw_type: integer
    description: The maximum transmission unit (MTU) of uplink CAPWAP tunnel (576 - 1500 bytes or 0; 0 means the local MTU
      of FortiAP; default = 0).
    default: '0'
    min: 576
    max: 1500
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  wan-port-mode:
    type: enum
    raw_type: option
    description: Enable/disable using the FortiAP WAN port as a LAN port.
    default: wan-only
  wtp-id:
    type: string
    raw_type: string
    description: WTP ID.
    max_length: 35
  wtp-profile:
    type: string
    raw_type: string
    description: WTP profile name to apply to this WTP, AP or FortiAP.
    max_length: 35
children:
  lan:
    attributes:
      port-esl-mode:
        type: enum
        raw_type: option
        description: ESL port mode.
        default: offline
      port-esl-ssid:
        type: string
        raw_type: string
        description: Bridge ESL port to SSID.
        max_length: 15
      port-mode:
        type: enum
        raw_type: option
        description: LAN port mode.
        default: offline
      port-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port to SSID.
        max_length: 15
      port1-mode:
        type: enum
        raw_type: option
        description: LAN port 1 mode.
        default: offline
      port1-ssid:
        type: string
        raw_type: string
        description: Bridge LAN port 1 to SSID.
        max_length: 15
      port2-mode:
