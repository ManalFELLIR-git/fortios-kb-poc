id: system.wireless.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/317184132/config-system-wireless-settings
attributes:
  band:
    type: enum
    raw_type: option
    description: Band.
    default: 802.11g
  beacon-interval:
    type: integer
    raw_type: integer
    description: Beacon level (25 - 1000).
    default: '100'
    min: 25
    max: 1000
  bgscan:
    type: enum
    raw_type: option
    description: Enable/disable background rogue AP scan.
    default: disable
  bgscan-idle:
    type: integer
    raw_type: integer
    description: Interval between scanning channels (100 - 1000 ms).
    default: '250'
    min: 100
    max: 1000
  bgscan-interval:
    type: integer
    raw_type: integer
    description: Interval between two rounds of scanning (15 - 3600 sec).
    default: '120'
    min: 15
    max: 3600
  channel:
    type: integer
    raw_type: integer
    description: Channel.
    default: '0'
    min: 0
    max: 4294967295
  channel-bonding:
    type: enum
    raw_type: option
    description: Supported channel width.
    default: disable
  geography:
    type: enum
    raw_type: option
    description: Geography.
    default: Americas
  mode:
    type: enum
    raw_type: option
    description: Mode.
    default: AP
  power-level:
    type: integer
    raw_type: integer
    description: Power level (0 - 17).
    default: '17'
    min: 0
    max: 17
  rogue-scan:
    type: enum
    raw_type: option
    description: Enable/disable rogue scan.
    default: disable
  rogue-scan-mac-adjacency:
    type: integer
    raw_type: integer
    description: MAC adjacency (0-31).
    default: '7'
    min: 0
    max: 31
  short-guard-interval:
    type: enum
    raw_type: option
    description: Enable/disable short guard interval.
    default: disable
children: {}
