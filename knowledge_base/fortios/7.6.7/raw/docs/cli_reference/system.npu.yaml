id: system.npu
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/249766674/config-system-npu
attributes:
  capwap-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading managed FortiAP and FortiLink CAPWAP sessions.
    default: enable
  dedicated-management-affinity:
    type: string
    raw_type: string
    description: Affinity setting for management daemons (hexadecimal value up to 256 bits in the format of xxxxxxxxxxxxxxxx).
    default: '1'
    max_length: 79
  dedicated-management-cpu:
    type: enum
    raw_type: option
    description: Enable to dedicate one CPU for GUI and CLI connections when NPs are busy. On NP7 devices this parameter is
      enabled by default.
    default: disable **
  default-qos-type:
    type: enum
    raw_type: option
    description: Set default QoS type.
    default: policing
  double-level-mcast-offload:
    type: enum
    raw_type: option
    description: Enable/disable double level mcast offload.
    default: disable
  fastpath:
    type: enum
    raw_type: option
    description: Enable/disable NP6 offloading (also called fast path).
    default: enable
  gtp-enhanced-cpu-range:
    type: enum
    raw_type: option
    description: GTP enhanced CPU range option.
    default: '0'
  gtp-enhanced-mode:
    type: enum
    raw_type: option
    description: Enable/disable GTP enhanced mode.
    default: disable
  gtp-support:
    type: enum
    raw_type: option
    description: Enable/Disable NP7 GTP support
    default: disable
  hash-tbl-spread:
    type: enum
    raw_type: option
    description: Enable/disable hash table entry spread (default enabled).
    default: enable
  hif-queue-customize:
    type: enum
    raw_type: option
    description: Customize HIF queue settings.
    default: numa-affinity
  host-shortcut-mode:
    type: enum
    raw_type: option
    description: Set NP6 host shortcut mode.
    default: bi-directional
  htab-dedi-queue-nr:
    type: integer
    raw_type: integer
    description: Set the number of dedicate queue for hash table messages.
    default: '1'
    min: 1
    max: 2
  htab-msg-queue:
    type: enum
    raw_type: option
    description: Set hash table message queue mode.
    default: dedicated
  htx-gtse-quota:
    type: enum
    raw_type: option
    description: Configure HTX GTSE quota.
    default: 1Gbps
  htx-icmp-csum-chk:
    type: enum
    raw_type: option
    description: Set HTX icmp csum checking mode.
    default: drop
  ike-port:
    type: integer
    raw_type: integer
    description: Configure additional IPsec ports for offloading. Port.
    min: 1
    max: 65535
  inbound-dscp-copy-port:
    type: string
    raw_type: string
    description: Physical interfaces that support inbound-dscp-copy. Physical interface name.
    max_length: 15
  intf-shaping-offload:
    type: enum
    raw_type: option
    description: Enable/disable NPU offload when doing interface-based traffic shaping according to the egress-shaping-profile.
    default: disable
  ip-fragment-offload:
    type: enum
    raw_type: option
    description: Enable/disable NP7 NPU IP fragment offload.
    default: enable
  iph-rsvd-re-cksum:
    type: enum
    raw_type: option
    description: Enable/disable IP checksum re-calculation for packets with iph.reserved bit set.
    default: disable
  ipsec-STS-timeout:
    type: enum
    raw_type: option
    description: Set NP7Lite IPsec STS msg timeout.
    default: '5'
  ipsec-dec-subengine-mask:
    type: string
    raw_type: user
    description: IPsec decryption subengine mask (0x1 - 0xff, default 0xff).
  ipsec-enc-subengine-mask:
    type: string
    raw_type: user
    description: IPsec encryption subengine mask (0x1 - 0xff, default 0xff).
  ipsec-inbound-cache:
    type: enum
    raw_type: option
    description: Enable/disable IPsec inbound cache for anti-replay.
    default: enable
  ipsec-mtu-override:
    type: enum
    raw_type: option
    description: Enable/disable NP6 IPsec MTU override.
    default: disable
  ipsec-ob-np-sel:
    type: enum
    raw_type: option
    description: IPsec NP selection for OB SA offloading.
    default: rr
  ipsec-ordering:
    type: enum
    raw_type: option
    description: Enable/disable IPsec ordering.
    default: disable
  ipsec-over-vlink:
    type: enum
    raw_type: option
    description: Enable/disable IPsec over vlink.
    default: disable
  ipsec-throughput-msg-frequency:
    type: enum
    raw_type: option
    description: 'Set NP7Lite IPsec throughput msg frequency: 0--disable 1--32KB 3--64KB ... 0x3fff--256MB 0x7fff--512MB 0xffff--1GB.'
    default: disable
  ipt-STS-timeout:
    type: enum
    raw_type: option
    description: Set NP7Lite IPT STS msg timeout.
    default: '5'
  ipt-throughput-msg-frequency:
    type: enum
    raw_type: option
    description: 'Set NP7Lite IPT throughput msg frequency: 0--disable 1--32KB 3--64KB ... 0x3fff--256MB 0x7fff--512MB 0xffff--1GB.'
    default: disable
  lag-hash-gre:
    type: enum
    raw_type: option
    description: Set LAG hash for standard GRE.
    default: disable
  lag-out-port-select:
    type: enum
    raw_type: option
    description: Enable/disable LAG outgoing port selection based on incoming traffic port.
    default: disable
  max-receive-unit:
    type: integer
    raw_type: integer
    description: Set the maximum packet size for receive, larger packets will be silently dropped.
    default: '10000'
    min: 64
    max: 10000
  max-session-timeout:
    type: integer
    raw_type: integer
    description: Maximum time interval for refreshing NPU-offloaded sessions (10 - 1000 sec, default 40 sec).
    default: '40'
    min: 10
    max: 1000
  mcast-denied-ses-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading of multicast denied sessions.
    default: disable
  mcast-session-accounting:
    type: enum
    raw_type: option
    description: Enable/disable traffic accounting for each multicast session through TAE counter.
    default: tpe-based
  mcs-auto-start:
    type: enum
    raw_type: option
    description: Enable/disable NPU MCS auto start.
    default: disable
  napi-break-interval:
    type: integer
    raw_type: integer
    description: NAPI break interval (default 0).
    default: '0'
    min: 0
    max: 65535
  np-linkscan-interval:
    type: integer
    raw_type: integer
    description: NPU link scan interval in milliseconds (50 - 1000, default = 1000).
    default: '1000'
    min: 50
    max: 1000
  np6-cps-optimization-mode:
    type: enum
    raw_type: option
    description: Enable/disable NP6 connection per second (CPS) optimization mode.
    default: disable
  per-policy-accounting:
    type: enum
    raw_type: option
    description: Set per-policy accounting.
    default: disable
  per-session-accounting:
    type: enum
    raw_type: option
    description: Set per-session accounting.
    default: traffic-log-only
  qos-mode:
    type: enum
    raw_type: option
    description: QoS mode on switch and NP.
    default: disable
  qtm-buf-mode:
    type: enum
    raw_type: option
    description: QTM channel configuration for packet buffer.
    default: 6ch
  rdp-offload:
    type: enum
    raw_type: option
    description: Enable/disable RDP offload.
    default: enable
  session-acct-interval:
    type: integer
    raw_type: integer
    description: Session accounting update interval (1 - 10 sec, default 5 sec).
    default: '5'
    min: 1
    max: 10
  session-denied-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading of denied sessions. Requires ses-denied-traffic to be set.
    default: disable
  shadow-virtual-switch:
    type: enum
    raw_type: option
    description: Enable/disable shadow virtual switch.
    default: disable
  shaping-stats:
    type: enum
    raw_type: option
    description: Enable/disable NP7 traffic shaping statistics (default = disable).
    default: disable
  sse-backpressure:
    type: enum
    raw_type: option
    description: Enable/disable SSE backpressure.
    default: disable
  strip-clear-text-padding:
    type: enum
    raw_type: option
    description: Enable/disable stripping clear text padding.
    default: disable
  strip-esp-padding:
    type: enum
    raw_type: option
    description: Enable/disable stripping ESP padding.
    default: disable
  sw-np-bandwidth:
    type: enum
    raw_type: option
    description: Bandwidth from switch to NP.
    default: 0G
  sw-np-pause:
    type: enum
    raw_type: option
    description: Enable SP5 tx pause and marvell rx receive pause, for sw uplink only.
    default: enable
  sw-np-rate:
    type: integer
    raw_type: integer
    description: Bandwidth from switch to NP, for sw uplink port.
    default: '0'
    min: 0
    max: 4294967295
  sw-np-rate-unit:
    type: enum
    raw_type: option
    description: Unit for bandwidth from switch to NP, for sw uplink port.
    default: mbps
  switch-np-hash:
    type: enum
    raw_type: option
    description: Switch-NP trunk port selection Criteria.
    default: src-dst-ip
  tunnel-over-vlink:
    type: enum
    raw_type: option
    description: Enable/disable selection of which NP6 chip the tunnel uses (default = enable).
    default: enable
  uesp-offload:
    type: enum
    raw_type: option
    description: Enable/disable UDP-encapsulated ESP offload (default = disable).
    default: disable
  ull-port-mode:
    type: enum
    raw_type: option
    description: Set ULL port's speed to 10G/25G (default 10G).
    default: 10G
  use-mse-oft:
    type: enum
    raw_type: option
    description: Enable/disable use of MSE OFT.
    default: enable
  vlan-accounting:
    type: enum
    raw_type: option
    description: Enable/disable NP7 VLAN accounting (default = enabled).
    default: enable
  vlan-acct-interval:
    type: integer
    raw_type: integer
    description: VLAN accounting update interval in milliseconds (100 - 10000, default = 200).
    default: '200'
    min: 100
    max: 10000
  vlan-lookup-cache:
    type: enum
    raw_type: option
    description: Enable/disable VLAN lookup cache (default = disabled).
    default: disable
  vxlan-mac-flapping-guard:
    type: enum
    raw_type: option
    description: Enable/disable VxLAN MAC flapping guard.
    default: enable
  vxlan-offload:
    type: enum
    raw_type: option
    description: Enable/disable offloading vxlan.
    default: enable
children:
  dos-options:
    attributes:
      npu-dos-meter-mode:
        type: enum
        raw_type: option
        description: Set DoS meter NPU offloading mode.
        default: global
      npu-dos-tpe-mode:
        type: enum
        raw_type: option
        description: Enable/disable insertion of DoS meter ID to session table.
        default: enable
  dsw-dts-profile:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Set NPU DSW DTS profile action.
        default: wait
      min-limit:
        type: integer
        raw_type: integer
        description: Set NPU DSW DTS profile min-limt.
        default: '0'
        min: 32
        max: 2048
      profile-id:
        type: integer
        raw_type: integer
        description: Set NPU DSW DTS profile profile id.
        default: '0'
        min: 1
        max: 32
      step:
        type: integer
        raw_type: integer
        description: Set NPU DSW DTS profile step.
        default: '0'
        min: 0
        max: 64
  dsw-queue-dts-profile:
    attributes:
      iport:
        type: enum
        raw_type: option
        description: Set NPU DSW DTS in port.
        default: eif0 **
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
      oport:
        type: enum
        raw_type: option
        description: Set NPU DSW DTS out port.
        default: eif0 **
      profile-id:
        type: integer
        raw_type: integer
        description: Set NPU DSW DTS profile ID.
        default: '0'
        min: 1
        max: 32
      queue-select:
        type: integer
        raw_type: integer
        description: Set NPU DSW DTS queue ID select (0 - reset to default).
        default: '0'
        min: 0
        max: 4095
  fp-anomaly:
    attributes:
      gre-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 GRE checksum anomalies.
        default: drop
      icmp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 ICMP checksum anomalies.
        default: drop
      icmp-frag:
        type: enum
        raw_type: option
        description: Layer 3 fragmented packets that could be part of layer 4 ICMP anomalies.
        default: allow
      icmp-land:
        type: enum
        raw_type: option
        description: ICMP land anomalies.
        default: trap-to-host
      ipv4-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 IP checksum anomalies.
        default: drop
      ipv4-land:
        type: enum
        raw_type: option
        description: Land anomalies.
        default: trap-to-host
      ipv4-optlsrr:
        type: enum
        raw_type: option
        description: Loose source record route option anomalies.
        default: trap-to-host
      ipv4-optrr:
        type: enum
        raw_type: option
        description: Record route option anomalies.
        default: trap-to-host
      ipv4-optsecurity:
        type: enum
        raw_type: option
        description: Security option anomalies.
        default: trap-to-host
      ipv4-optssrr:
        type: enum
        raw_type: option
        description: Strict source record route option anomalies.
        default: trap-to-host
      ipv4-optstream:
        type: enum
        raw_type: option
        description: Stream option anomalies.
        default: trap-to-host
      ipv4-opttimestamp:
        type: enum
        raw_type: option
        description: Timestamp option anomalies.
        default: trap-to-host
      ipv4-proto-err:
        type: enum
        raw_type: option
        description: Invalid layer 4 protocol anomalies.
        default: trap-to-host
      ipv4-unknopt:
        type: enum
        raw_type: option
        description: Unknown option anomalies.
        default: trap-to-host
      ipv6-daddr-err:
        type: enum
        raw_type: option
        description: Destination address as unspecified or loopback address anomalies.
        default: trap-to-host
      ipv6-land:
        type: enum
        raw_type: option
        description: Land anomalies.
        default: trap-to-host
      ipv6-optendpid:
        type: enum
        raw_type: option
        description: End point identification anomalies.
        default: trap-to-host
      ipv6-opthomeaddr:
        type: enum
        raw_type: option
        description: Home address option anomalies.
        default: trap-to-host
      ipv6-optinvld:
        type: enum
        raw_type: option
        description: Invalid option anomalies.Invalid option anomalies.
        default: trap-to-host
      ipv6-optjumbo:
        type: enum
        raw_type: option
        description: Jumbo options anomalies.
        default: trap-to-host
      ipv6-optnsap:
        type: enum
        raw_type: option
        description: Network service access point address option anomalies.
        default: trap-to-host
      ipv6-optralert:
        type: enum
        raw_type: option
        description: Router alert option anomalies.
        default: trap-to-host
      ipv6-opttunnel:
        type: enum
        raw_type: option
        description: Tunnel encapsulation limit option anomalies.
        default: trap-to-host
      ipv6-proto-err:
        type: enum
        raw_type: option
        description: Layer 4 invalid protocol anomalies.
        default: trap-to-host
      ipv6-saddr-err:
        type: enum
        raw_type: option
        description: Source address as multicast anomalies.
        default: trap-to-host
      ipv6-unknopt:
        type: enum
        raw_type: option
        description: Unknown option anomalies.
        default: trap-to-host
      sctp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 SCTP checksum anomalies.
        default: drop
      tcp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 TCP checksum anomalies.
        default: drop
      tcp-fin-noack:
        type: enum
        raw_type: option
        description: TCP SYN flood with FIN flag set without ACK setting anomalies.
        default: trap-to-host
      tcp-fin-only:
        type: enum
        raw_type: option
        description: TCP SYN flood with only FIN flag set anomalies.
        default: trap-to-host
      tcp-land:
        type: enum
        raw_type: option
        description: TCP land anomalies.
        default: trap-to-host
      tcp-no-flag:
        type: enum
        raw_type: option
        description: TCP SYN flood with no flag set anomalies.
        default: allow
      tcp-syn-data:
        type: enum
        raw_type: option
        description: TCP SYN flood packets with data anomalies.
        default: allow
      tcp-syn-fin:
        type: enum
        raw_type: option
        description: TCP SYN flood SYN/FIN flag set anomalies.
        default: allow
      tcp-winnuke:
        type: enum
        raw_type: option
        description: TCP WinNuke anomalies.
        default: trap-to-host
      udp-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 UDP checksum anomalies.
        default: drop
      udp-land:
        type: enum
        raw_type: option
        description: UDP land anomalies.
        default: trap-to-host
      udplite-csum-err:
        type: enum
        raw_type: option
        description: Invalid IPv4 UDPlite checksum anomalies.
        default: drop
  hpe:
    attributes:
      arp-max:
        type: integer
        raw_type: integer
        description: Maximum ARP packet rate (1K - 32M pps, default = 5K pps). Entry is valid when ARP is removed from high-priority
          traffic.
        default: '5000'
        min: 1000
        max: 32000000
      enable-shaper:
        type: enum
        raw_type: option
        description: Enable/Disable NPU Host Protection Engine (HPE) for packet type shaper.
        default: disable
      esp-max:
        type: integer
        raw_type: integer
        description: Maximum ESP packet rate (1K - 32M pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      high-priority:
        type: integer
        raw_type: integer
        description: Maximum packet rate for high priority traffic packets (1K - 32M pps, default = 400K pps).
        default: 400000 **
        min: 1000
        max: 32000000
      icmp-max:
        type: integer
        raw_type: integer
        description: Maximum ICMP packet rate (1K - 32M pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      ip-frag-max:
        type: integer
        raw_type: integer
        description: Maximum fragmented IP packet rate (1K - 32M pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      ip-others-max:
        type: integer
        raw_type: integer
        description: Maximum IP packet rate for other packets (packet types that cannot be set with other options) (1K - 32G
          pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      l2-others-max:
        type: integer
        raw_type: integer
        description: Maximum L2 packet rate for L2 packets that are not ARP packets (1K - 32M pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      sctp-max:
        type: integer
        raw_type: integer
        description: Maximum SCTP packet rate (1K - 32M pps, default = 5K pps).
        default: '5000'
        min: 1000
        max: 32000000
      tcp-max:
        type: integer
        raw_type: integer
        description: Maximum TCP packet rate (1K - 32M pps, default = 40K pps).
        default: '40000'
        min: 1000
        max: 32000000
      tcpfin-rst-max:
        type: integer
        raw_type: integer
        description: Maximum TCP carries FIN or RST flags packet rate (1K - 32M pps, default = 40K pps).
        default: '40000'
        min: 1000
        max: 32000000
      tcpsyn-ack-max:
        type: integer
        raw_type: integer
        description: Maximum TCP carries SYN and ACK flags packet rate (1K - 32M pps, default = 40K pps).
        default: '40000'
        min: 1000
        max: 32000000
      tcpsyn-max:
        type: integer
        raw_type: integer
        description: Maximum TCP SYN packet rate (1K - 40M pps, default = 32K pps).
        default: '40000'
        min: 1000
        max: 32000000
      udp-max:
        type: integer
        raw_type: integer
        description: Maximum UDP packet rate (1K - 32M pps, default = 40K pps).
        default: '40000'
        min: 1000
        max: 32000000
  ip-reassembly:
    attributes:
      max-timeout:
        type: integer
        raw_type: integer
        description: Maximum timeout value for IP reassembly (5 us - 600,000,000 us).
        default: '200000'
        min: 5
        max: 600000000
      min-timeout:
        type: integer
        raw_type: integer
        description: Minimum timeout value for IP reassembly (5 us - 600,000,000 us).
        default: '64'
        min: 5
        max: 600000000
      status:
        type: enum
        raw_type: option
        description: Set IP reassembly processing status.
        default: disable
  isf-np-queues:
    attributes:
      cos0:
        type: string
        raw_type: string
        description: CoS profile name for CoS 0.
        max_length: 35
      cos1:
        type: string
        raw_type: string
        description: CoS profile name for CoS 1.
        max_length: 35
      cos2:
        type: string
        raw_type: string
        description: CoS profile name for CoS 2.
        max_length: 35
      cos3:
        type: string
        raw_type: string
        description: CoS profile name for CoS 3.
        max_length: 35
      cos4:
        type: string
        raw_type: string
        description: CoS profile name for CoS 4.
        max_length: 35
      cos5:
        type: string
        raw_type: string
        description: CoS profile name for CoS 5.
        max_length: 35
      cos6:
        type: string
        raw_type: string
        description: CoS profile name for CoS 6.
        max_length: 35
      cos7:
        type: string
        raw_type: string
        description: CoS profile name for CoS 7.
        max_length: 35
  ethernet-type:
    attributes:
      name:
        type: string
        raw_type: string
        description: Ethernet Type Name.
        max_length: 35
      queue:
        type: integer
        raw_type: integer
        description: Queue Number.
        default: '0'
        min: 0
        max: 11
      type:
        type: ether-type
        raw_type: ether-type
        description: Ethernet Type.
        default: '0'
      weight:
        type: integer
        raw_type: integer
        description: Class Weight.
        default: '15'
        min: 0
        max: 15
  ip-protocol:
    attributes:
      name:
        type: string
        raw_type: string
        description: IP Protocol Name.
        max_length: 35
      protocol:
        type: integer
        raw_type: integer
        description: IP Protocol.
        default: '0'
        min: 0
        max: 255
      queue:
        type: integer
        raw_type: integer
        description: Queue Number.
        default: '0'
        min: 0
        max: 11
      weight:
        type: integer
        raw_type: integer
        description: Class Weight.
        default: '14'
        min: 0
        max: 15
  ip-service:
    attributes:
      dport:
        type: integer
        raw_type: integer
        description: Destination port.
        default: '0'
        min: 0
        max: 65535
      name:
        type: string
        raw_type: string
        description: IP service name.
        max_length: 35
      protocol:
        type: integer
        raw_type: integer
        description: IP protocol.
        default: '0'
        min: 0
        max: 255
      queue:
        type: integer
        raw_type: integer
        description: Queue number.
        default: '0'
        min: 0
        max: 11
      sport:
        type: integer
        raw_type: integer
        description: Source port.
        default: '0'
        min: 0
        max: 65535
      weight:
        type: integer
        raw_type: integer
        description: Class weight.
        default: '13'
        min: 0
        max: 15
  profile:
    attributes:
      cos0:
        type: enum
        raw_type: option
        description: Queue number of CoS 0.
        default: queue0
      cos1:
        type: enum
        raw_type: option
