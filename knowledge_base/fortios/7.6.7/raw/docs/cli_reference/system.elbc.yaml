id: system.elbc
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/716529452/config-system-elbc
attributes:
  graceful-upgrade:
    type: enum
    raw_type: option
    description: enable/disable graceful upgrade
    default: enable
  hb-device:
    type: string
    raw_type: string
    description: ELBC heartbeat device. set interface name
    max_length: 79
  inter-chassis-support:
    type: enum
    raw_type: option
    description: Enable/disable content-cluster across multiple chassis.
    default: disable
  mode:
    type: enum
    raw_type: option
    description: ELBC mode.
    default: none
children: {}
