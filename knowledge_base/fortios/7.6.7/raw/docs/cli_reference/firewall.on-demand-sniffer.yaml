id: firewall.on-demand-sniffer
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105105929/config-firewall-on-demand-sniffer
attributes:
  advanced-filter:
    type: string
    raw_type: var-string
    description: Advanced freeform filter that will be used over existing filter settings if set. Can only be used by super
      admin.
    max_length: 255
  hosts:
    type: string
    raw_type: string
    description: IPv4 or IPv6 hosts to filter in this traffic sniffer. IPv4 or IPv6 host.
    max_length: 255
  interface:
    type: string
    raw_type: string
    description: Interface name that on-demand packet sniffer will take place.
    max_length: 35
  max-packet-count:
    type: integer
    raw_type: integer
    description: Maximum number of packets to capture per on-demand packet sniffer.
    default: '0'
    min: 1
    max: 20000
  name:
    type: string
    raw_type: string
    description: On-demand packet sniffer name.
    max_length: 35
  non-ip-packet:
    type: enum
    raw_type: option
    description: Include non-IP packets.
    default: disable
  ports:
    type: integer
    raw_type: integer
    description: Ports to filter for in this traffic sniffer. Port to filter in this traffic sniffer.
    min: 1
    max: 65536
  protocols:
    type: integer
    raw_type: integer
    description: Protocols to filter in this traffic sniffer. Integer value for the protocol type as defined by IANA (0 -
      255).
    min: 0
    max: 255
children: {}
