id: system.automation-trigger
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/160942731/config-system-automation-trigger
attributes:
  description:
    type: string
    raw_type: var-string
    description: Description.
    max_length: 255
  event-type:
    type: enum
    raw_type: option
    description: Event type.
    default: ioc
  fabric-event-name:
    type: string
    raw_type: var-string
    description: Fabric connector event handler name.
    max_length: 255
  fabric-event-severity:
    type: string
    raw_type: var-string
    description: Fabric connector event severity.
    max_length: 255
  faz-event-name:
    type: string
    raw_type: var-string
    description: FortiAnalyzer event handler name.
    max_length: 255
  faz-event-severity:
    type: string
    raw_type: var-string
    description: FortiAnalyzer event severity.
    max_length: 255
  faz-event-tags:
    type: string
    raw_type: var-string
    description: FortiAnalyzer event tags.
    max_length: 255
  license-type:
    type: enum
    raw_type: option
    description: License type.
    default: forticare-support
  logid:
    type: integer
    raw_type: integer
    description: Log IDs to trigger event. Log ID.
    min: 1
    max: 65535
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  report-type:
    type: enum
    raw_type: option
    description: Security Rating report.
    default: posture
  serial:
    type: string
    raw_type: var-string
    description: Fabric connector serial number.
    max_length: 255
  stitch-name:
    type: string
    raw_type: string
    description: Triggering stitch name.
    max_length: 35
  trigger-datetime:
    type: datetime
    raw_type: datetime
    description: Trigger date and time (YYYY-MM-DD HH:MM:SS).
    default: '0000-00-00 00:00:00'
  trigger-day:
    type: integer
    raw_type: integer
    description: Day within a month to trigger.
    default: '1'
    min: 1
    max: 31
  trigger-frequency:
    type: enum
    raw_type: option
    description: Scheduled trigger frequency (default = daily).
    default: daily
  trigger-hour:
    type: integer
    raw_type: integer
    description: Hour of the day on which to trigger (0 - 23, default = 1).
    default: '0'
    min: 0
    max: 23
  trigger-minute:
    type: integer
    raw_type: integer
    description: Minute of the hour on which to trigger (0 - 59, default = 0).
    default: '0'
    min: 0
    max: 59
  trigger-type:
    type: enum
    raw_type: option
    description: Trigger type.
    default: event-based
  trigger-weekday:
    type: enum
    raw_type: option
    description: Day of week for trigger.
  vdom:
    type: string
    raw_type: string
    description: Virtual domain(s) that this trigger is valid for. Virtual domain name.
    max_length: 79
children:
  fields:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
      value:
        type: string
        raw_type: var-string
        description: Value.
        max_length: 63
