id: switch-controller.quarantine
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/292952547/config-switch-controller-quarantine
attributes:
  quarantine:
    type: enum
    raw_type: option
    description: Enable/disable quarantine.
    default: disable
children:
  targets:
    attributes:
      description:
        type: string
        raw_type: string
        description: Description for the quarantine MAC.
        max_length: 63
      mac:
        type: mac-address
        raw_type: mac-address
        description: Quarantine MAC.
        default: 00:00:00:00:00:00
      tag:
        type: string
        raw_type: string
        description: Tags for the quarantine MAC. Tag string. For example, string1 string2 string3.
        max_length: 63
