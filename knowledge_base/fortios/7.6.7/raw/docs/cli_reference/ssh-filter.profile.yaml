id: ssh-filter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/302613935/config-ssh-filter-profile
attributes:
  block:
    type: enum
    raw_type: option
    description: SSH blocking options.
  default-command-log:
    type: enum
    raw_type: option
    description: Enable/disable logging unmatched shell commands.
    default: disable
  log:
    type: enum
    raw_type: option
    description: SSH logging options.
  name:
    type: string
    raw_type: string
    description: SSH filter profile name.
    max_length: 47
children:
  shell-commands:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for SSH shell command matches.
        default: block
      alert:
        type: enum
        raw_type: option
        description: Enable/disable alert.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: Id.
        default: '0'
        min: 0
        max: 4294967295
      log:
        type: enum
        raw_type: option
        description: Enable/disable logging.
        default: disable
      pattern:
        type: string
        raw_type: string
        description: SSH shell command pattern.
        max_length: 128
      severity:
        type: enum
        raw_type: option
        description: Log severity.
        default: medium
      type:
        type: enum
        raw_type: option
        description: Matching type.
        default: simple
