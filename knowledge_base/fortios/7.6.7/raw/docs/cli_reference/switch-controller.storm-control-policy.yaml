id: switch-controller.storm-control-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/295749914/config-switch-controller-storm-control-policy
attributes:
  broadcast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop/allow broadcast traffic in override mode.
    default: disable
  burst-size-level:
    type: integer
    raw_type: integer
    description: Increase level to handle bursty traffic (0 - 4, default = 0).
    default: '0'
    min: 0
    max: 4
  description:
    type: string
    raw_type: string
    description: Description of the storm control policy.
    max_length: 63
  name:
    type: string
    raw_type: string
    description: Storm control policy name.
    max_length: 63
  rate:
    type: integer
    raw_type: integer
    description: Threshold rate in packets per second at which storm traffic is controlled in override mode (default=500,
      0 to drop all).
    default: '500'
    min: 0
    max: 10000000
  storm-control-mode:
    type: enum
    raw_type: option
    description: Set Storm control mode.
    default: global
  unknown-multicast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop/allow unknown multicast traffic in override mode.
    default: disable
  unknown-unicast:
    type: enum
    raw_type: option
    description: Enable/disable storm control to drop/allow unknown unicast traffic in override mode.
    default: disable
children: {}
