id: firewall.dnstranslation
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/933890991/config-firewall-dnstranslation
attributes:
  dst:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address or subnet on the external network to substitute for the resolved address in DNS query replies.
      Can be single IP address or subnet on the external network, but number of addresses must equal number of mapped IP addresses
      in src.
    default: 0.0.0.0
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  netmask:
    type: ipv4-netmask
    raw_type: ipv4-netmask
    description: If src and dst are subnets rather than single IP addresses, enter the netmask for both src and dst.
    default: 255.255.255.255
  src:
    type: ipv4-address
    raw_type: ipv4-address
    description: IPv4 address or subnet on the internal network to compare with the resolved address in DNS query replies.
      If the resolved address matches, the resolved address is substituted with dst.
    default: 0.0.0.0
children: {}
