id: router.bfd
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/191777831/config-router-bfd
attributes:
  auth-mode:
    type: enum
    raw_type: option
    description: Authentication mode.
    default: none
  bfd-desired-min-tx:
    type: integer
    raw_type: integer
    description: BFD desired minimal transmit interval (milliseconds).
    default: '250'
    min: 100
    max: 30000
  bfd-detect-mult:
    type: integer
    raw_type: integer
    description: BFD detection multiplier.
    default: '3'
    min: 3
    max: 50
  bfd-required-min-rx:
    type: integer
    raw_type: integer
    description: BFD required minimal receive interval (milliseconds).
    default: '250'
    min: 100
    max: 30000
  dst:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Destination prefix.
    default: 0.0.0.0 0.0.0.0
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  md5-key:
    type: password
    raw_type: password
    description: MD5 key of key ID 1.
  src:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Source prefix.
    default: 0.0.0.0 0.0.0.0
children:
  multihop-template:
    attributes:
      auth-mode:
        type: enum
        raw_type: option
        description: Authentication mode.
        default: none
      bfd-desired-min-tx:
        type: integer
        raw_type: integer
        description: BFD desired minimal transmit interval (milliseconds).
        default: '250'
        min: 100
        max: 30000
      bfd-detect-mult:
        type: integer
        raw_type: integer
        description: BFD detection multiplier.
        default: '3'
        min: 3
        max: 50
      bfd-required-min-rx:
        type: integer
        raw_type: integer
        description: BFD required minimal receive interval (milliseconds).
        default: '250'
        min: 100
        max: 30000
      dst:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: Destination prefix.
        default: 0.0.0.0 0.0.0.0
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      md5-key:
        type: password
        raw_type: password
        description: MD5 key of key ID 1.
      src:
        type: ipv4-classnet
        raw_type: ipv4-classnet
        description: Source prefix.
        default: 0.0.0.0 0.0.0.0
  neighbor:
    attributes:
      interface:
        type: string
        raw_type: string
        description: Interface name.
        max_length: 15
      ip:
        type: ipv4-address
        raw_type: ipv4-address
        description: IPv4 address of the BFD neighbor.
        default: 0.0.0.0
