id: system.link-monitor
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/320711343/config-system-link-monitor
attributes:
  addr-mode:
    type: enum
    raw_type: option
    description: Address mode (IPv4 or IPv6).
    default: ipv4
  class-id:
    type: integer
    raw_type: integer
    description: Traffic class ID.
    default: '0'
    min: 0
    max: 4294967295
  diffservcode:
    type: string
    raw_type: user
    description: Differentiated services code point (DSCP) in the IP header of the probe packet.
  fail-weight:
    type: integer
    raw_type: integer
    description: Threshold weight to trigger link failure alert.
    default: '0'
    min: 0
    max: 255
  failtime:
    type: integer
    raw_type: integer
    description: Number of retry attempts before the server is considered down (1 - 3600, default = 5).
    default: '5'
    min: 1
    max: 3600
  gateway-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Gateway IP address used to probe the server.
    default: 0.0.0.0
  gateway-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Gateway IPv6 address used to probe the server.
    default: '::'
  ha-priority:
    type: integer
    raw_type: integer
    description: HA election priority (1 - 50).
    default: '1'
    min: 1
    max: 50
  http-agent:
    type: string
    raw_type: string
    description: String in the http-agent field in the HTTP header.
    default: Chrome/ Safari/
    max_length: 1024
  http-get:
    type: string
    raw_type: string
    description: If you are monitoring an HTML server you can send an HTTP-GET request with a custom string. Use this option
      to define the string.
    default: /
    max_length: 1024
  http-match:
    type: string
    raw_type: string
    description: String that you expect to see in the HTTP-GET requests of the traffic to be monitored.
    max_length: 1024
  interval:
    type: integer
    raw_type: integer
    description: Detection interval in milliseconds (20 - 3600 * 1000 msec, default = 500).
    default: '500'
    min: 20
    max: 3600000
  name:
    type: string
    raw_type: string
    description: Link monitor name.
    max_length: 35
  packet-size:
    type: integer
    raw_type: integer
    description: Packet size of a TWAMP test session (124/158 - 1024).
    default: '124'
    min: 0
    max: 65535
  password:
    type: password
    raw_type: password
    description: TWAMP controller password in authentication mode.
  port:
    type: integer
    raw_type: integer
    description: Port number of the traffic to be used to monitor the server.
    default: '0'
    min: 1
    max: 65535
  probe-count:
    type: integer
    raw_type: integer
    description: Number of most recent probes that should be used to calculate latency and jitter (5 - 30, default = 30).
    default: '30'
    min: 5
    max: 30
  probe-timeout:
    type: integer
    raw_type: integer
    description: Time to wait before a probe packet is considered lost (20 - 5000 msec, default = 500).
    default: '500'
    min: 20
    max: 5000
  protocol:
    type: enum
    raw_type: option
    description: Protocols used to monitor the server.
    default: ping
  recoverytime:
    type: integer
    raw_type: integer
    description: Number of successful responses received before server is considered recovered (1 - 3600, default = 5).
    default: '5'
    min: 1
    max: 3600
  route:
    type: string
    raw_type: string
    description: Subnet to monitor. IP and netmask (x.x.x.x/y).
    max_length: 79
  security-mode:
    type: enum
    raw_type: option
    description: Twamp controller security mode.
    default: none
  server:
    type: string
    raw_type: string
    description: IP address of the server(s) to be monitored. Server address.
    max_length: 79
  server-config:
    type: enum
    raw_type: option
    description: Mode of server configuration.
    default: default
  server-type:
    type: enum
    raw_type: option
    description: Server type (static or dynamic).
    default: static
  service-detection:
    type: enum
    raw_type: option
    description: Only use monitor to read quality values. If enabled, static routes and cascade interfaces will not be updated.
    default: disable
  source-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Source IP address used in packet to the server.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Source IPv6 address used in packet to the server.
    default: '::'
  srcintf:
    type: string
    raw_type: string
    description: Interface that receives the traffic to be monitored.
    max_length: 15
  status:
    type: enum
    raw_type: option
    description: Enable/disable this link monitor.
    default: enable
  update-cascade-interface:
    type: enum
    raw_type: option
    description: Enable/disable update cascade interface.
    default: enable
  update-policy-route:
    type: enum
    raw_type: option
    description: Enable/disable updating the policy route.
    default: enable
  update-static-route:
    type: enum
    raw_type: option
    description: Enable/disable updating the static route.
    default: enable
children:
  server-list:
    attributes:
      dst:
        type: string
        raw_type: string
        description: IP address of the server to be monitored.
        max_length: 64
      id:
        type: integer
        raw_type: integer
        description: Server ID.
        default: '0'
        min: 1
        max: 32
      port:
        type: integer
        raw_type: integer
        description: Port number of the traffic to be used to monitor the server.
        default: '0'
        min: 1
        max: 65535
      protocol:
        type: enum
        raw_type: option
        description: Protocols used to monitor the server.
        default: ping
      weight:
        type: integer
        raw_type: integer
        description: Weight of the monitor to this dst (0 - 255).
        default: '0'
        min: 0
        max: 255
