id: dnsfilter.domain-filter
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/238558396/config-dnsfilter-domain-filter
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: Name of table.
    max_length: 63
children:
  entries:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action to take for domain filter matches.
        default: block
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      domain:
        type: string
        raw_type: string
        description: Domain entries to be filtered.
        max_length: 511
      id:
        type: integer
        raw_type: integer
        description: Id.
        default: '0'
        min: 0
        max: 4294967295
      status:
        type: enum
        raw_type: option
        description: Enable/disable this domain filter.
        default: enable
      type:
        type: enum
        raw_type: option
        description: DNS domain filter type.
        default: simple
