id: system.fortindr
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/247315682/config-system-fortindr
attributes:
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  source-ip:
    type: string
    raw_type: string
    description: Source IP address for communications to FortiNDR.
    max_length: 63
  status:
    type: enum
    raw_type: option
    description: Enable/disable FortiNDR.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
