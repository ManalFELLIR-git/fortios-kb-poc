id: firewall.address6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/137851815/config-firewall-address6
attributes:
  cache-ttl:
    type: integer
    raw_type: integer
    description: Minimal TTL of individual IPv6 addresses in FQDN cache.
    default: '0'
    min: 0
    max: 86400
  color:
    type: integer
    raw_type: integer
    description: Integer value to determine the color of the icon in the GUI (range 1 to 32, default = 0, which sets the value
      to 1).
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  country:
    type: string
    raw_type: string
    description: IPv6 addresses associated to a specific country.
    max_length: 2
  end-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: 'Final IP address (inclusive) in the range for the address (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
    default: '::'
  epg-name:
    type: string
    raw_type: string
    description: Endpoint group name.
    max_length: 255
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  filter:
    type: string
    raw_type: var-string
    description: Match criteria filter.
    max_length: 2047
  fqdn:
    type: string
    raw_type: string
    description: Fully qualified domain name.
    max_length: 255
  host:
    type: ipv6-address
    raw_type: ipv6-address
    description: Host Address.
    default: '::'
  host-type:
    type: enum
    raw_type: option
    description: Host type.
    default: any
  ip6:
    type: ipv6-network
    raw_type: ipv6-network
    description: 'IPv6 address prefix (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx/xxx).'
    default: ::/0
  macaddr:
    type: string
    raw_type: string
    description: Multiple MAC address ranges. MAC address ranges <start>[-<end>] separated by space.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Address name.
    max_length: 79
  obj-id:
    type: string
    raw_type: var-string
    description: Object ID for NSX.
    max_length: 255
  obsolete:
    type: integer
    raw_type: integer
    description: Indicates whether the address can be used. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  passive-fqdn-learning:
    type: enum
    raw_type: option
    description: Enable/disable passive learning of FQDNs. When enabled, the FortiGate learns, trusts, and saves FQDNs from
      endpoint DNS queries (default = enable).
    default: enable
  route-tag:
    type: integer
    raw_type: integer
    description: route-tag address.
    default: '0'
    min: 1
    max: 4294967295
  sdn:
    type: string
    raw_type: string
    description: SDN.
    max_length: 35
  sdn-addr-type:
    type: enum
    raw_type: option
    description: Type of addresses to collect.
    default: private
  sdn-tag:
    type: string
    raw_type: string
    description: SDN Tag.
    max_length: 15
  start-ip:
    type: ipv6-address
    raw_type: ipv6-address
    description: 'First IP address (inclusive) in the range for the address (format: xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx).'
    default: '::'
  template:
    type: string
    raw_type: string
    description: IPv6 address template.
    max_length: 63
  tenant:
    type: string
    raw_type: string
    description: Tenant.
    max_length: 35
  type:
    type: enum
    raw_type: option
    description: Type of IPv6 address object (default = ipprefix).
    default: ipprefix
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  wildcard:
    type: ipv6-wildcard
    raw_type: ipv6-wildcard
    description: IPv6 address and wildcard netmask.
    default: ':: ::'
children:
  list:
    attributes:
      ip:
        type: string
        raw_type: string
        description: IP.
        max_length: 89
  subnet-segment:
    attributes:
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 63
      type:
        type: enum
        raw_type: option
        description: Subnet segment type.
        default: any
      value:
        type: string
        raw_type: string
        description: Subnet segment value.
        max_length: 35
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
