id: router.route-map
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/254669892/config-router-route-map
attributes:
  comments:
    type: string
    raw_type: string
    description: Optional comments.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Action.
        default: permit
      id:
        type: integer
        raw_type: integer
        description: Rule ID.
        default: '0'
        min: 0
        max: 4294967295
      match-as-path:
        type: string
        raw_type: string
        description: Match BGP AS path list.
        max_length: 35
      match-community:
        type: string
        raw_type: string
        description: Match BGP community list.
        max_length: 35
      match-community-exact:
        type: enum
        raw_type: option
        description: Enable/disable exact matching of communities.
        default: disable
      match-extcommunity:
        type: string
        raw_type: string
        description: Match BGP extended community list.
        max_length: 35
      match-extcommunity-exact:
        type: enum
        raw_type: option
        description: Enable/disable exact matching of extended communities.
        default: disable
      match-interface:
        type: string
        raw_type: string
        description: Match interface configuration.
        max_length: 15
      match-ip-address:
        type: string
        raw_type: string
        description: Match IP address permitted by access-list or prefix-list.
        max_length: 35
      match-ip-nexthop:
        type: string
        raw_type: string
        description: Match next hop IP address passed by access-list or prefix-list.
        max_length: 35
      match-ip6-address:
        type: string
        raw_type: string
        description: Match IPv6 address permitted by access-list6 or prefix-list6.
        max_length: 35
      match-ip6-nexthop:
        type: string
        raw_type: string
        description: Match next hop IPv6 address passed by access-list6 or prefix-list6.
        max_length: 35
      match-metric:
        type: integer
        raw_type: integer
        description: Match metric for redistribute routes.
        min: 0
        max: 4294967295
      match-origin:
        type: enum
        raw_type: option
        description: Match BGP origin code.
        default: none
      match-route-type:
        type: enum
        raw_type: option
        description: Match route type.
      match-suppress:
        type: enum
        raw_type: option
        description: Enable/disable matching of suppressed original neighbor.
        default: disable
      match-tag:
        type: integer
        raw_type: integer
        description: Match tag.
        min: 0
        max: 4294967295
      match-vrf:
        type: integer
        raw_type: integer
        description: Match VRF ID.
        min: 0
        max: 511
      set-aggregator-as:
        type: integer
        raw_type: integer
        description: BGP aggregator AS.
        default: '0'
        min: 0
        max: 4294967295
      set-aggregator-ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: BGP aggregator IP.
        default: 0.0.0.0
      set-aspath:
        type: string
        raw_type: string
        description: Prepend BGP AS path attribute. AS number (0 - 4294967295). Use quotes for repeating numbers, For example,
          "1 1 2".
        max_length: 79
      set-aspath-action:
        type: enum
        raw_type: option
        description: Specify preferred action of set-aspath.
        default: prepend
      set-atomic-aggregate:
        type: enum
        raw_type: option
        description: Enable/disable BGP atomic aggregate attribute.
        default: disable
      set-community:
        type: string
        raw_type: string
        description: 'BGP community attribute. Attribute: AA|AA:NN|internet|local-AS|no-advertise|no-export (exact match required
          for well known communities).'
        max_length: 79
      set-community-additive:
        type: enum
        raw_type: option
        description: Enable/disable adding set-community to existing community.
        default: disable
      set-community-delete:
        type: string
        raw_type: string
        description: Delete communities matching community list.
        max_length: 35
      set-dampening-max-suppress:
        type: integer
        raw_type: integer
        description: Maximum duration to suppress a route (1 - 255 min, 0 = unset).
        default: '0'
        min: 0
        max: 255
      set-dampening-reachability-half-life:
        type: integer
        raw_type: integer
        description: Reachability half-life time for the penalty (1 - 45 min, 0 = unset).
        default: '0'
        min: 0
        max: 45
      set-dampening-reuse:
        type: integer
        raw_type: integer
        description: Value to start reusing a route (1 - 20000, 0 = unset).
        default: '0'
        min: 0
        max: 20000
      set-dampening-suppress:
        type: integer
        raw_type: integer
        description: Value to start suppressing a route (1 - 20000, 0 = unset).
        default: '0'
        min: 0
        max: 20000
      set-dampening-unreachability-half-life:
        type: integer
        raw_type: integer
        description: Unreachability Half-life time for the penalty (1 - 45 min, 0 = unset).
        default: '0'
        min: 0
        max: 45
      set-extcommunity-rt:
        type: string
        raw_type: string
        description: Route Target extended community. AA:NN.
        max_length: 79
      set-extcommunity-soo:
        type: string
        raw_type: string
        description: Site-of-Origin extended community. Community (format = AA:NN).
        max_length: 79
      set-ip-nexthop:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address of next hop.
      set-ip-prefsrc:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address of preferred source.
      set-ip6-nexthop:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 global address of next hop.
      set-ip6-nexthop-local:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 local address of next hop.
      set-local-preference:
        type: integer
        raw_type: integer
        description: BGP local preference path attribute.
        min: 0
        max: 4294967295
      set-metric:
        type: integer
        raw_type: integer
        description: Metric value.
        min: 0
        max: 4294967295
      set-metric-type:
        type: enum
        raw_type: option
        description: Metric type.
      set-origin:
        type: enum
        raw_type: option
        description: BGP origin code.
        default: none
      set-originator-id:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: BGP originator ID attribute.
      set-priority:
        type: integer
        raw_type: integer
        description: Priority for routing table.
        min: 1
        max: 65535
      set-route-tag:
        type: integer
        raw_type: integer
        description: Route tag for routing table.
        min: 0
        max: 4294967295
      set-tag:
        type: integer
        raw_type: integer
        description: Tag value.
        min: 0
        max: 4294967295
      set-vpnv4-nexthop:
        type: ipv4-address
        raw_type: ipv4-address
        description: IP address of VPNv4 next-hop.
      set-vpnv6-nexthop:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 global address of VPNv6 next-hop.
      set-vpnv6-nexthop-local:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 link-local address of VPNv6 next-hop.
      set-weight:
        type: integer
        raw_type: integer
        description: BGP weight for routing table.
        min: 0
        max: 4294967295
