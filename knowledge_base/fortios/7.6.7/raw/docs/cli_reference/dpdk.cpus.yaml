id: dpdk.cpus
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/322209183/config-dpdk-cpus
attributes:
  ips-cpus:
    type: string
    raw_type: string
    description: CPUs enabled to run DPDK IPS engines.
    default: all
    max_length: 1022
  isolated-cpus:
    type: string
    raw_type: string
    description: CPUs isolated to run only the DPDK engines with the exception of processes that have affinity explicitly
      set by either a user configuration or by their implementation.
    default: none
    max_length: 1022
  rx-cpus:
    type: string
    raw_type: string
    description: CPUs enabled to run DPDK RX engines.
    default: all
    max_length: 1022
  tx-cpus:
    type: string
    raw_type: string
    description: CPUs enabled to run DPDK TX engines.
    default: all
    max_length: 1022
  vnp-cpus:
    type: string
    raw_type: string
    description: CPUs enabled to run DPDK VNP engines.
    default: all
    max_length: 1022
  vnpsp-cpus:
    type: string
    raw_type: string
    description: CPUs enabled to run DPDK VNP slow path.
    default: all
    max_length: 1022
children: {}
