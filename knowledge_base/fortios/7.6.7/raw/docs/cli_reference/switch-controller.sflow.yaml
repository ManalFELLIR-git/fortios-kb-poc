id: switch-controller.sflow
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/132341850/config-switch-controller-sflow
attributes:
  collector-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Collector IP.
    default: 0.0.0.0
  collector-port:
    type: integer
    raw_type: integer
    description: SFlow collector port (0 - 65535).
    default: '6343'
    min: 0
    max: 65535
children: {}
