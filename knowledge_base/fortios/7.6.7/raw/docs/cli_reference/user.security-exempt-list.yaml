id: user.security-exempt-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/282331203/config-user-security-exempt-list
attributes:
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Name of the exempt list.
    max_length: 35
children:
  rule:
    attributes:
      dstaddr:
        type: string
        raw_type: string
        description: Destination addresses or address groups. Address or group name.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      service:
        type: string
        raw_type: string
        description: Destination services. Service name.
        max_length: 79
      srcaddr:
        type: string
        raw_type: string
        description: Source addresses or address groups. Address or group name.
        max_length: 79
