id: system.ips
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/781356570/config-system-ips
attributes:
  override-signature-hold-by-id:
    type: enum
    raw_type: option
    description: Enable/disable override of hold of triggering signatures that are specified by IDs regardless of hold.
    default: enable
  signature-hold-time:
    type: string
    raw_type: user
    description: 'Time to hold and monitor IPS signatures. Format <#d##h> (day range: 0 - 21, hour range: 0 - 23, max hold
      time: 21d0h, default hold time: 0d0h).'
    default: 0h
children: {}
