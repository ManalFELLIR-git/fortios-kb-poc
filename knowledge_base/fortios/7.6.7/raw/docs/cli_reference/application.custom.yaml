id: application.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/330402526/config-application-custom
attributes:
  behavior:
    type: string
    raw_type: user
    description: Custom application signature behavior.
  category:
    type: integer
    raw_type: integer
    description: Custom application category ID (use ? to view available options).
    default: '0'
    min: 0
    max: 4294967295
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  id:
    type: integer
    raw_type: integer
    description: Custom application category ID (use ? to view available options). Read-only.
    default: '0'
    min: 0
    max: 4294967295
  protocol:
    type: string
    raw_type: user
    description: Custom application signature protocol.
  signature:
    type: string
    raw_type: var-string
    description: The text that makes up the actual custom application signature.
    max_length: 4095
  tag:
    type: string
    raw_type: string
    description: Signature tag.
    max_length: 63
  technology:
    type: string
    raw_type: user
    description: Custom application signature technology.
  vendor:
    type: string
    raw_type: user
    description: Custom application signature vendor.
children: {}
