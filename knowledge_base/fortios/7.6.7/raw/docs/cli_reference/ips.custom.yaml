id: ips.custom
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130115773/config-ips-custom
attributes:
  action:
    type: enum
    raw_type: option
    description: Default action (pass or block) for this signature.
    default: pass
  application:
    type: string
    raw_type: user
    description: Applications to be protected. Blank for all applications.
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  location:
    type: string
    raw_type: user
    description: Protect client or server traffic.
  log:
    type: enum
    raw_type: option
    description: Enable/disable logging.
    default: enable
  log-packet:
    type: enum
    raw_type: option
    description: Enable/disable packet logging.
    default: disable
  os:
    type: string
    raw_type: user
    description: Operating system(s) that the signature protects. Blank for all operating systems.
  protocol:
    type: string
    raw_type: user
    description: Protocol(s) that the signature scans. Blank for all protocols.
  rule-id:
    type: integer
    raw_type: integer
    description: Signature ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  severity:
    type: string
    raw_type: user
    description: Relative severity of the signature, from info to critical. Log messages generated by the signature include
      the severity.
  signature:
    type: string
    raw_type: var-string
    description: Custom signature enclosed in single quotes.
    max_length: 4095
  status:
    type: enum
    raw_type: option
    description: Enable/disable this signature.
    default: enable
  tag:
    type: string
    raw_type: string
    description: Signature tag.
    max_length: 63
children: {}
