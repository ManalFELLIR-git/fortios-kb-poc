id: casb.user-activity
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/184463717/config-casb-user-activity
attributes:
  application:
    type: string
    raw_type: string
    description: CASB SaaS application name.
    max_length: 79
  casb-name:
    type: string
    raw_type: string
    description: CASB user activity signature name.
    max_length: 79
  category:
    type: enum
    raw_type: option
    description: CASB user activity category.
    default: activity-control
  description:
    type: string
    raw_type: string
    description: CASB user activity description.
    max_length: 63
  match-strategy:
    type: enum
    raw_type: option
    description: CASB user activity match strategy.
    default: or
  name:
    type: string
    raw_type: string
    description: CASB user activity name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: CASB user activity status.
    default: enable
  type:
    type: enum
    raw_type: option
    description: CASB user activity type.
    default: customized
  uuid:
    type: string
    raw_type: string
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    max_length: 36
children:
  control-options:
    attributes:
      name:
        type: string
        raw_type: string
        description: CASB control option name.
        max_length: 79
      status:
        type: enum
        raw_type: option
        description: CASB control option status.
        default: enable
  operations:
    attributes:
      action:
        type: enum
        raw_type: option
        description: CASB operation action.
        default: append
      case-sensitive:
        type: enum
        raw_type: option
        description: CASB operation search case sensitive.
        default: disable
      direction:
        type: enum
        raw_type: option
        description: CASB operation direction.
        default: request
      header-name:
        type: string
        raw_type: string
        description: CASB operation header name to search.
        max_length: 255
      name:
        type: string
        raw_type: string
        description: CASB control option operation name.
        max_length: 79
      search-key:
        type: string
        raw_type: string
        description: CASB operation key to search.
        max_length: 1023
      search-pattern:
        type: enum
        raw_type: option
        description: CASB operation search pattern.
        default: simple
      target:
        type: enum
        raw_type: option
        description: CASB operation target.
        default: header
      value-from-input:
        type: enum
        raw_type: option
        description: Enable/disable value from user input.
        default: disable
      value-name-from-input:
        type: string
        raw_type: string
        description: CASB operation value name from user input.
        max_length: 79
      values:
        type: string
        raw_type: string
        description: CASB operation new values. Operation value.
        max_length: 79
  match:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: CASB user activity match rules ID.
        default: '0'
        min: 0
        max: 4294967295
      strategy:
        type: enum
        raw_type: option
        description: CASB user activity rules strategy.
        default: and
  rules:
    attributes:
      body-type:
        type: enum
        raw_type: option
        description: CASB user activity match rule body type.
        default: json
      case-sensitive:
        type: enum
        raw_type: option
        description: CASB user activity match case sensitive.
        default: disable
      domains:
        type: string
        raw_type: string
        description: CASB user activity domain list. Domain list separated by space.
        max_length: 127
      header-name:
        type: string
        raw_type: string
        description: CASB user activity rule header name.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: CASB user activity rule ID.
        default: '0'
        min: 0
        max: 4294967295
      jq:
        type: string
        raw_type: string
        description: CASB user activity rule match jq script.
        max_length: 255
      match-pattern:
        type: enum
        raw_type: option
        description: CASB user activity rule match pattern.
        default: simple
      match-value:
        type: string
        raw_type: string
        description: CASB user activity rule match value.
        max_length: 1023
      methods:
        type: string
        raw_type: string
        description: CASB user activity method list. User activity method.
        max_length: 79
      negate:
        type: enum
        raw_type: option
        description: Enable/disable what the matching strategy must not be.
        default: disable
      type:
        type: enum
        raw_type: option
        description: CASB user activity rule type.
        default: host
  tenant-extraction:
    attributes:
      jq:
        type: string
        raw_type: string
        description: CASB user activity tenant extraction jq script.
        max_length: 1023
      status:
        type: enum
        raw_type: option
        description: Enable/disable CASB tenant extraction.
        default: disable
      type:
        type: enum
        raw_type: option
        description: CASB user activity tenant extraction type.
        default: json-query
