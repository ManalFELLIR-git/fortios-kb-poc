id: firewall.policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/333889629/config-firewall-policy
attributes:
  action:
    type: enum
    raw_type: option
    description: Policy action (accept/deny/ipsec).
    default: deny
  anti-replay:
    type: enum
    raw_type: option
    description: Enable/disable anti-replay check.
    default: enable
  app-monitor:
    type: enum
    raw_type: option
    description: Enable/disable application TCP metrics in session logs.When enabled, auto-asic-offload is disabled.
    default: disable
  application-list:
    type: string
    raw_type: string
    description: Name of an existing Application list.
    max_length: 47
  auth-cert:
    type: string
    raw_type: string
    description: HTTPS server certificate for policy authentication.
    max_length: 35
  auth-path:
    type: enum
    raw_type: option
    description: Enable/disable authentication-based routing.
    default: disable
  auth-redirect-addr:
    type: string
    raw_type: string
    description: HTTP-to-HTTPS redirect address for firewall authentication.
    max_length: 63
  auto-asic-offload:
    type: enum
    raw_type: option
    description: Enable/disable policy traffic ASIC offloading.
    default: enable
  av-profile:
    type: string
    raw_type: string
    description: Name of an existing Antivirus profile.
    max_length: 47
