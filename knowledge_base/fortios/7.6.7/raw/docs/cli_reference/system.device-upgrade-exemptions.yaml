id: system.device-upgrade-exemptions
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/912745172/config-system-device-upgrade-exemptions
attributes:
  fortinet-device:
    type: string
    raw_type: string
    description: Fortinet extension device (FortiAP, FortiSwitch, FortiExtender).
    max_length: 35
  id:
    type: integer
    raw_type: integer
    description: Device upgrade exemption ID (0 - 65535).
    default: '0'
    min: 0
    max: 65535
  version:
    type: string
    raw_type: user
    description: Highest version of Fortinet firmware to exempt (format in Major.minor.patch, such as 7.6.4).
children: {}
