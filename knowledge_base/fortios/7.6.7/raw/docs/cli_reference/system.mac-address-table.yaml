id: system.mac-address-table
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/192775810/config-system-mac-address-table
attributes:
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 35
  mac:
    type: mac-address
    raw_type: mac-address
    description: MAC address.
    default: 00:00:00:00:00:00
  reply-substitute:
    type: mac-address
    raw_type: mac-address
    description: New MAC for reply traffic.
    default: 00:00:00:00:00:00
children: {}
