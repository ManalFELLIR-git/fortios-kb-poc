id: system.snmp.rmon-stat
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/162454826/config-system-snmp-rmon-stat
attributes:
  id:
    type: integer
    raw_type: integer
    description: RMON Ethernet statistics entry ID.
    default: '0'
    min: 0
    max: 4294967295
  owner:
    type: string
    raw_type: string
    description: Owner of the Ethernet statistics entry.
    max_length: 127
  source:
    type: string
    raw_type: string
    description: Data source of the Ethernet statistics entry.
    max_length: 15
children: {}
