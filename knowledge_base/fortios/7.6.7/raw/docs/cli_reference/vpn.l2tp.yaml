id: vpn.l2tp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/997216877/config-vpn-l2tp
attributes:
  compress:
    type: enum
    raw_type: option
    description: Enable/disable data compression.
    default: disable
  eip:
    type: ipv4-address
    raw_type: ipv4-address
    description: End IP.
    default: 0.0.0.0
  enforce-ipsec:
    type: enum
    raw_type: option
    description: Enable/disable IPsec enforcement.
    default: disable
  hello-interval:
    type: integer
    raw_type: integer
    description: L2TP hello message interval in seconds (0 - 3600 sec, default = 60).
    default: '60'
    min: 0
    max: 3600
  lcp-echo-interval:
    type: integer
    raw_type: integer
    description: Time in seconds between PPPoE Link Control Protocol (LCP) echo requests.
    default: '5'
    min: 0
    max: 32767
  lcp-max-echo-fails:
    type: integer
    raw_type: integer
    description: Maximum number of missed LCP echo messages before disconnect.
    default: '3'
    min: 0
    max: 32767
  sip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Start IP.
    default: 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable/disable FortiGate as a L2TP gateway.
    default: disable
  usrgrp:
    type: string
    raw_type: string
    description: User group.
    max_length: 35
children: {}
