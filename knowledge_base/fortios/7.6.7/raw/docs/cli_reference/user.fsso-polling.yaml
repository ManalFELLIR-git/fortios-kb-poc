id: user.fsso-polling
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/825346697/config-user-fsso-polling
attributes:
  default-domain:
    type: string
    raw_type: string
    description: Default domain managed by this Active Directory server.
    max_length: 35
  id:
    type: integer
    raw_type: integer
    description: Active Directory server ID.
    default: '0'
    min: 0
    max: 4294967295
  ldap-server:
    type: string
    raw_type: string
    description: LDAP server name used in LDAP connection strings.
    max_length: 35
  logon-history:
    type: integer
    raw_type: integer
    description: Number of hours of logon history to keep, 0 means keep all history.
    default: '8'
    min: 0
    max: 48
  password:
    type: password
    raw_type: password
    description: Password required to log into this Active Directory server.
  polling-frequency:
    type: integer
    raw_type: integer
    description: Polling frequency (every 1 to 30 seconds).
    default: '10'
    min: 1
    max: 30
  port:
    type: integer
    raw_type: integer
    description: Port to communicate with this Active Directory server.
    default: '0'
    min: 0
    max: 65535
  server:
    type: string
    raw_type: string
    description: Host name or IP address of the Active Directory server.
    max_length: 63
  smb-ntlmv1-auth:
    type: enum
    raw_type: option
    description: Enable/disable support of NTLMv1 for Samba authentication.
    default: disable
  smbv1:
    type: enum
    raw_type: option
    description: Enable/disable support of SMBv1 for Samba.
    default: disable
  status:
    type: enum
    raw_type: option
    description: Enable/disable polling for the status of this Active Directory server.
    default: enable
  user:
    type: string
    raw_type: string
    description: User name required to log into this Active Directory server.
    max_length: 35
children:
  adgrp:
    attributes:
      name:
        type: string
        raw_type: string
        description: Name.
        max_length: 511
