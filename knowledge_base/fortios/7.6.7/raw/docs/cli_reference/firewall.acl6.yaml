id: firewall.acl6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/260842926/config-firewall-acl6
attributes:
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  dstaddr:
    type: string
    raw_type: string
    description: Destination address name. Address name.
    max_length: 79
  fragment:
    type: enum
    raw_type: option
    description: Pass/drop fragments that match L3 information.
    default: pass
  interface:
    type: string
    raw_type: string
    description: Interface name.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 35
  policyid:
    type: integer
    raw_type: integer
    description: Policy ID.
    default: '0'
    min: 0
    max: 9999
  service:
    type: string
    raw_type: string
    description: Service name. Service name.
    max_length: 79
  srcaddr:
    type: string
    raw_type: string
    description: Source address name. Address name.
    max_length: 79
  status:
    type: enum
    raw_type: option
    description: Enable/disable access control list status.
    default: enable
children: {}
