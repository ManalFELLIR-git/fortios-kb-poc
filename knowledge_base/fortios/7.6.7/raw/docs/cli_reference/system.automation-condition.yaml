id: system.automation-condition
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/589962035/config-system-automation-condition
attributes:
  condition-type:
    type: enum
    raw_type: option
    description: Condition type.
    default: cpu
  cpu-usage-percent:
    type: integer
    raw_type: integer
    description: CPU usage reaches specified percentage.
    default: '0'
    min: 0
    max: 100
  description:
    type: string
    raw_type: var-string
    description: Description.
    max_length: 255
  input-id:
    type: integer
    raw_type: integer
    description: Input ID.
    default: '0'
    min: 0
    max: 4294967295
  input-state:
    type: enum
    raw_type: option
    description: Input state.
    default: close
  mem-usage-percent:
    type: integer
    raw_type: integer
    description: Memory usage reaches specified percentage.
    default: '0'
    min: 0
    max: 100
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  vdom:
    type: string
    raw_type: string
    description: Virtual domain which the tunnel belongs to.
    default: root
    max_length: 31
  vpn-tunnel-name:
    type: string
    raw_type: string
    description: VPN tunnel name.
    max_length: 79
  vpn-tunnel-state:
    type: enum
    raw_type: option
    description: VPN tunnel state.
    default: tunnel-up
children: {}
