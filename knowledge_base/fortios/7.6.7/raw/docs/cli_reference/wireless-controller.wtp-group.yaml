id: wireless-controller.wtp-group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105008268/config-wireless-controller-wtp-group
attributes:
  ble-major-id:
    type: integer
    raw_type: integer
    description: Override BLE Major ID.
    default: '0'
    min: 0
    max: 65535
  name:
    type: string
    raw_type: string
    description: WTP group name.
    max_length: 35
  platform-type:
    type: enum
    raw_type: option
    description: FortiAP models to define the WTP group platform type.
  wtps:
    type: string
    raw_type: string
    description: WTP list. WTP ID.
    max_length: 35
children: {}
