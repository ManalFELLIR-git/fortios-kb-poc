id: firewall.ssh.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/565750157/config-firewall-ssh-setting
attributes:
  caname:
    type: string
    raw_type: string
    description: CA certificate used by SSH Inspection.
    max_length: 35
  host-trusted-checking:
    type: enum
    raw_type: option
    description: Enable/disable host trusted checking.
    default: enable
  hostkey-dsa1024:
    type: string
    raw_type: string
    description: DSA certificate used by SSH proxy.
    max_length: 35
  hostkey-ecdsa256:
    type: string
    raw_type: string
    description: ECDSA nid256 certificate used by SSH proxy.
    max_length: 35
  hostkey-ecdsa384:
    type: string
    raw_type: string
    description: ECDSA nid384 certificate used by SSH proxy.
    max_length: 35
  hostkey-ecdsa521:
    type: string
    raw_type: string
    description: ECDSA nid384 certificate used by SSH proxy.
    max_length: 35
  hostkey-ed25519:
    type: string
    raw_type: string
    description: ED25519 hostkey used by SSH proxy.
    max_length: 35
  hostkey-rsa2048:
    type: string
    raw_type: string
    description: RSA certificate used by SSH proxy.
    max_length: 35
  untrusted-caname:
    type: string
    raw_type: string
    description: Untrusted CA certificate used by SSH Inspection.
    max_length: 35
children: {}
