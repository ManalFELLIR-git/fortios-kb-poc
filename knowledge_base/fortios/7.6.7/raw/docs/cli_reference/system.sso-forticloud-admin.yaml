id: system.sso-forticloud-admin
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/114270059/config-system-sso-forticloud-admin
attributes:
  accprofile:
    type: string
    raw_type: string
    description: FortiCloud SSO admin user access profile. Permission is set to read-only without a FortiGate Cloud Central
      Management license.
