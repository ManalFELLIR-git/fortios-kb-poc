id: system.zone
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/314783845/config-system-zone
attributes:
  description:
    type: string
    raw_type: string
    description: Description.
    max_length: 127
  interface:
    type: string
    raw_type: string
    description: Add interfaces to this zone. Interfaces must not be assigned to another zone or have firewall policies defined.
      Select interfaces to add to the zone.
    max_length: 79
  intrazone:
    type: enum
    raw_type: option
    description: Allow or deny traffic routing between different interfaces in the same zone (default = deny).
    default: deny
  name:
    type: string
    raw_type: string
    description: Zone name.
    max_length: 35
children:
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
