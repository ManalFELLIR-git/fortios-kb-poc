id: user.fsso
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/614401817/config-user-fsso
attributes:
  group-poll-interval:
    type: integer
    raw_type: integer
    description: Interval in minutes within to fetch groups from FSSO server, or unset to disable.
    default: '0'
    min: 1
    max: 2880
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ldap-poll:
    type: enum
    raw_type: option
    description: Enable/disable automatic fetching of groups from LDAP server.
    default: disable
  ldap-poll-filter:
    type: string
    raw_type: string
    description: Filter used to fetch groups.
    default: (objectCategory=group)
    max_length: 2047
  ldap-poll-interval:
    type: integer
    raw_type: integer
    description: Interval in minutes within to fetch groups from LDAP server.
    default: '180'
    min: 1
    max: 2880
  ldap-server:
    type: string
    raw_type: string
    description: LDAP server to get group information.
    max_length: 35
  logon-timeout:
    type: integer
    raw_type: integer
    description: Interval in minutes to keep logons after FSSO server down.
    default: '5'
    min: 1
    max: 2880
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 35
  password:
    type: password
    raw_type: password
    description: Password of the first FSSO collector agent.
  password2:
    type: password
    raw_type: password
    description: Password of the second FSSO collector agent.
  password3:
    type: password
    raw_type: password
    description: Password of the third FSSO collector agent.
  password4:
    type: password
    raw_type: password
    description: Password of the fourth FSSO collector agent.
  password5:
    type: password
    raw_type: password
    description: Password of the fifth FSSO collector agent.
  port:
    type: integer
    raw_type: integer
    description: Port of the first FSSO collector agent.
    default: '8000'
    min: 1
    max: 65535
  port2:
    type: integer
    raw_type: integer
    description: Port of the second FSSO collector agent.
    default: '8000'
    min: 1
    max: 65535
  port3:
    type: integer
    raw_type: integer
    description: Port of the third FSSO collector agent.
    default: '8000'
    min: 1
    max: 65535
  port4:
    type: integer
    raw_type: integer
    description: Port of the fourth FSSO collector agent.
    default: '8000'
    min: 1
    max: 65535
  port5:
    type: integer
    raw_type: integer
    description: Port of the fifth FSSO collector agent.
    default: '8000'
    min: 1
    max: 65535
  server:
    type: string
    raw_type: string
    description: Domain name or IP address of the first FSSO collector agent.
    max_length: 63
  server2:
    type: string
    raw_type: string
    description: Domain name or IP address of the second FSSO collector agent.
    max_length: 63
  server3:
    type: string
    raw_type: string
    description: Domain name or IP address of the third FSSO collector agent.
    max_length: 63
  server4:
    type: string
    raw_type: string
    description: Domain name or IP address of the fourth FSSO collector agent.
    max_length: 63
  server5:
    type: string
    raw_type: string
    description: Domain name or IP address of the fifth FSSO collector agent.
    max_length: 63
  sni:
    type: string
    raw_type: string
    description: Server Name Indication.
    max_length: 255
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP for communications to FSSO agent.
    default: 0.0.0.0
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 source for communications to FSSO agent.
    default: '::'
  ssl:
    type: enum
    raw_type: option
    description: Enable/disable use of SSL.
    default: disable
  ssl-server-host-ip-check:
    type: enum
    raw_type: option
    description: Enable/disable server host/IP verification.
    default: disable
  ssl-trusted-cert:
    type: string
    raw_type: string
    description: Trusted server certificate or CA certificate.
    max_length: 79
  type:
    type: enum
    raw_type: option
    description: Server type.
    default: default
  user-info-server:
    type: string
    raw_type: string
    description: LDAP server to get user information.
    max_length: 35
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
