id: user.pop3
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/194694641/config-user-pop3
attributes:
  name:
    type: string
    raw_type: string
    description: POP3 server entry name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: POP3 service port number.
    default: '0'
    min: 0
    max: 65535
  secure:
    type: enum
    raw_type: option
    description: SSL connection.
    default: starttls
  server:
    type: string
    raw_type: string
    description: Server domain name or IP address.
    max_length: 63
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
children: {}
