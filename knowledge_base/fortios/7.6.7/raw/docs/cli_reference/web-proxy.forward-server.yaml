id: web-proxy.forward-server
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/860610789/config-web-proxy-forward-server
attributes:
  addr-type:
    type: enum
    raw_type: option
    description: 'Address type of the forwarding proxy server: IP or FQDN.'
    default: ip
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  fqdn:
    type: string
    raw_type: string
    description: Forward server Fully Qualified Domain Name (FQDN).
    max_length: 255
  healthcheck:
    type: enum
    raw_type: option
    description: Enable/disable forward server health checking. Attempts to connect through the remote forwarding server to
      a destination to verify that the forwarding server is operating normally.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: sdwan
  ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Forward proxy server IP address.
    default: 0.0.0.0
  ipv6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Forward proxy server IPv6 address.
    default: '::'
  masquerade:
    type: enum
    raw_type: option
    description: Enable/disable use of the IP address of the outgoing interface as the client IP address (default = enable)
    default: enable
  monitor:
    type: string
    raw_type: string
    description: URL for forward server health check monitoring (default = www.google.com).
    default: www.google.com
    max_length: 255
  name:
    type: string
    raw_type: string
    description: Server name.
    max_length: 63
  password:
    type: password
    raw_type: password
    description: HTTP authentication password.
  port:
    type: integer
    raw_type: integer
    description: Port number that the forwarding server expects to receive HTTP sessions on (1 - 65535, default = 3128).
    default: '3128'
    min: 1
    max: 65535
  server-down-option:
    type: enum
    raw_type: option
    description: 'Action to take when the forward server is found to be down: block sessions until the server is back up or
      pass sessions to their destination.'
    default: block
  username:
    type: string
    raw_type: string
    description: HTTP authentication user name.
    max_length: 64
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '-1'
    min: 0
    max: 511
children: {}
