id: system.npu-post
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/142436840/config-system-npu-post
attributes:
  npu-group-effective-scope:
    type: integer
    raw_type: integer
    description: npu-group-effective-scope defines under which npu-group cmds such as list/purge will be excecuted. Default
      scope is for all four HS-ok groups. (0-3, default = 255).
    default: '255'
    min: 0
    max: 255
children:
  port-npu-map:
    attributes:
      interface:
        type: string
        raw_type: string
        description: Set NPU interface port for NPU group mapping.
        max_length: 15
      npu-group:
        type: string
        raw_type: string
        description: Mapping NPU group list. NPU group name.
        max_length: 15
