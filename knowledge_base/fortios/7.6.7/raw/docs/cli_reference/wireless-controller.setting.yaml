id: wireless-controller.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/232220720/config-wireless-controller-setting
attributes:
  account-id:
    type: string
    raw_type: string
    description: FortiCloud customer account ID.
    max_length: 63
  country:
    type: enum
    raw_type: option
    description: Country or region in which the FortiGate is located. The country determines the 802.11 bands and channels
      that are available.
    default: US **
  darrp-optimize:
    type: integer
    raw_type: integer
    description: Time for running Distributed Automatic Radio Resource Provisioning (DARRP) optimizations (0 - 86400 sec,
      default = 86400, 0 = disable).
    default: '86400'
    min: 0
    max: 86400
  darrp-optimize-schedules:
    type: string
    raw_type: string
    description: Firewall schedules for DARRP running time. DARRP will run periodically based on darrp-optimize within the
      schedules. Separate multiple schedule names with a space. Schedule name.
    max_length: 35
  device-holdoff:
    type: integer
    raw_type: integer
    description: Lower limit of creation time of device for identification in minutes (0 - 60, default = 5).
    default: '5'
    min: 0
    max: 60
  device-idle:
    type: integer
    raw_type: integer
    description: Upper limit of idle time of device for identification in minutes (0 - 14400, default = 1440).
    default: '1440'
    min: 0
    max: 14400
  device-weight:
    type: integer
    raw_type: integer
    description: Upper limit of confidence of device for identification (0 - 255, default = 1, 0 = disable).
    default: '1'
    min: 0
    max: 255
  duplicate-ssid:
    type: enum
    raw_type: option
    description: Enable/disable allowing Virtual Access Points (VAPs) to use the same SSID name in the same VDOM.
    default: disable
  fake-ssid-action:
    type: enum
    raw_type: option
    description: Actions taken for detected fake SSID.
    default: log
  fapc-compatibility:
    type: enum
    raw_type: option
    description: Enable/disable FAP-C series compatibility.
    default: disable
  firmware-provision-on-authorization:
    type: enum
    raw_type: option
    description: Enable/disable automatic provisioning of latest firmware on authorization.
    default: disable
  phishing-ssid-detect:
    type: enum
    raw_type: option
    description: Enable/disable phishing SSID detection.
    default: enable
  rolling-wtp-upgrade:
    type: enum
    raw_type: option
    description: Enable/disable rolling WTP upgrade (default = disable).
    default: disable
  wfa-compatibility:
    type: enum
    raw_type: option
    description: Enable/disable WFA compatibility.
    default: disable
children:
  offending-ssid:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Actions taken for detected offending SSID.
        default: log
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 65535
      ssid-pattern:
        type: string
        raw_type: string
        description: Define offending SSID pattern (case insensitive). For example, word, word*, *word, wo*rd.
        max_length: 33
