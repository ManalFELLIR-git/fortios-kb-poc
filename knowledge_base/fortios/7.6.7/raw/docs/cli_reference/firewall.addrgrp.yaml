id: firewall.addrgrp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/301511994/config-firewall-addrgrp
attributes:
  allow-routing:
    type: enum
    raw_type: option
    description: Enable/disable use of this group in routing configurations.
    default: disable
  category:
    type: enum
    raw_type: option
    description: Address group category.
    default: default
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  exclude:
    type: enum
    raw_type: option
    description: Enable/disable address exclusion.
    default: disable
  exclude-member:
    type: string
    raw_type: string
    description: Address exclusion member. Address name.
    max_length: 79
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  member:
    type: string
    raw_type: string
    description: Address objects contained within the group. Address name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Address group name.
    max_length: 79
  type:
    type: enum
    raw_type: option
    description: Address group type.
    default: default
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children:
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
