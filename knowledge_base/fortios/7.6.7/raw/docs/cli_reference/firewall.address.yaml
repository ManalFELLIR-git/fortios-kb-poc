id: firewall.address
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/306021697/config-firewall-address
attributes:
  agent-id:
    type: string
    raw_type: string
    description: Telemetry agent id.
    max_length: 19
  allow-routing:
    type: enum
    raw_type: option
    description: Enable/disable use of this address in routing configurations.
    default: disable
  associated-interface:
    type: string
    raw_type: string
    description: Network interface associated with address.
    max_length: 35
  cache-ttl:
    type: integer
    raw_type: integer
    description: Defines the minimal TTL of individual IP addresses in FQDN cache measured in seconds.
    default: '0'
    min: 0
    max: 86400
  clearpass-spt:
    type: enum
    raw_type: option
    description: SPT (System Posture Token) value.
    default: unknown
  color:
    type: integer
    raw_type: integer
    description: Color of icon on the GUI.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  country:
    type: string
    raw_type: string
    description: IP addresses associated to a specific country.
    max_length: 2
  end-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: Final IP address (inclusive) in the range for the address.
    default: 0.0.0.0
  epg-name:
    type: string
    raw_type: string
    description: Endpoint group name.
    max_length: 255
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  filter:
    type: string
    raw_type: var-string
    description: Match criteria filter.
    max_length: 2047
  fqdn:
    type: string
    raw_type: string
    description: Fully Qualified Domain Name address.
    max_length: 255
  fsso-group:
    type: string
    raw_type: string
    description: FSSO group(s). FSSO group name.
    max_length: 511
  hw-model:
    type: string
    raw_type: string
    description: Dynamic address matching hardware model.
    max_length: 35
  hw-vendor:
    type: string
    raw_type: string
    description: Dynamic address matching hardware vendor.
    max_length: 35
  interface:
    type: string
    raw_type: string
    description: Name of interface whose IP address is to be used.
    max_length: 35
  macaddr:
    type: string
    raw_type: string
    description: Multiple MAC address ranges. MAC address ranges <start>[-<end>] separated by space.
    max_length: 127
  name:
    type: string
    raw_type: string
    description: Address name.
    max_length: 79
  node-ip-only:
    type: enum
    raw_type: option
    description: Enable/disable collection of node addresses only in Kubernetes.
    default: disable
  obj-id:
    type: string
    raw_type: var-string
    description: Object ID for NSX.
    max_length: 255
  obj-tag:
    type: string
    raw_type: string
    description: Tag of dynamic address object.
    max_length: 255
  obj-type:
    type: enum
    raw_type: option
    description: Object type.
    default: ip
  obsolete:
    type: integer
    raw_type: integer
    description: Indicates whether the address can be used. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  organization:
    type: string
    raw_type: string
    description: 'Organization domain name (Syntax: organization/domain).'
    max_length: 35
  os:
    type: string
    raw_type: string
    description: Dynamic address matching operating system.
    max_length: 35
  passive-fqdn-learning:
    type: enum
    raw_type: option
    description: Enable/disable passive learning of FQDNs. When enabled, the FortiGate learns, trusts, and saves FQDNs from
      endpoint DNS queries (default = enable).
    default: enable
  policy-group:
    type: string
    raw_type: string
    description: Policy group name.
    max_length: 15
  route-tag:
    type: integer
    raw_type: integer
    description: route-tag address.
    default: '0'
    min: 1
    max: 4294967295
  sdn:
    type: string
    raw_type: string
    description: SDN.
    max_length: 35
  sdn-addr-type:
    type: enum
    raw_type: option
    description: Type of addresses to collect.
    default: private
  sdn-tag:
    type: string
    raw_type: string
    description: SDN Tag.
    max_length: 15
  sso-attribute-value:
    type: string
    raw_type: string
    description: RADIUS attributes value. RADIUS attribute value.
    max_length: 511
  start-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: First IP address (inclusive) in the range for the address.
    default: 0.0.0.0
  sub-type:
    type: enum
    raw_type: option
    description: Sub-type of address.
    default: sdn
  subnet:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: IP address and subnet mask of address.
    default: 0.0.0.0 0.0.0.0
  subnet-name:
    type: string
    raw_type: string
    description: Subnet name.
    max_length: 255
  sw-version:
    type: string
    raw_type: string
    description: Dynamic address matching software version.
    max_length: 35
  tag-detection-level:
    type: string
    raw_type: string
    description: Tag detection level of dynamic address object.
    max_length: 15
  tag-type:
    type: string
    raw_type: string
    description: Tag type of dynamic address object.
    max_length: 63
  tenant:
    type: string
    raw_type: string
    description: Tenant.
    max_length: 35
  type:
    type: enum
    raw_type: option
    description: Type of address.
    default: ipmask
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  wildcard:
    type: ipv4-classnet-any
    raw_type: ipv4-classnet-any
    description: IP address and wildcard netmask.
    default: 0.0.0.0 0.0.0.0
  wildcard-fqdn:
    type: string
    raw_type: string
    description: Fully Qualified Domain Name with wildcard characters.
    max_length: 255
children:
  list:
    attributes:
      ip:
        type: string
        raw_type: string
        description: IP.
        max_length: 35
  tagging:
    attributes:
      category:
        type: string
        raw_type: string
        description: Tag category.
        max_length: 63
      name:
        type: string
        raw_type: string
        description: Tagging entry name.
        max_length: 63
      tags:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
