id: wireless-controller.qos-profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/191814669/config-wireless-controller-qos-profile
attributes:
  bandwidth-admission-control:
    type: enum
    raw_type: option
    description: Enable/disable WMM bandwidth admission control.
    default: disable
  bandwidth-capacity:
    type: integer
    raw_type: integer
    description: Maximum bandwidth capacity allowed (1 - 600000 Kbps, default = 2000).
    default: '2000'
    min: 1
    max: 600000
  burst:
    type: enum
    raw_type: option
    description: Enable/disable client rate burst.
    default: disable
  call-admission-control:
    type: enum
    raw_type: option
    description: Enable/disable WMM call admission control.
    default: disable
  call-capacity:
    type: integer
    raw_type: integer
    description: Maximum number of Voice over WLAN (VoWLAN) phones allowed (0 - 60, default = 10).
    default: '10'
    min: 0
    max: 60
  comment:
    type: string
    raw_type: string
    description: Comment.
    max_length: 63
  downlink:
    type: integer
    raw_type: integer
    description: Maximum downlink bandwidth for Virtual Access Points (VAPs) (0 - 2097152 Kbps, default = 0, 0 means no limit).
    default: '0'
    min: 0
    max: 2097152
  downlink-sta:
    type: integer
    raw_type: integer
    description: Maximum downlink bandwidth for clients (0 - 2097152 Kbps, default = 0, 0 means no limit).
    default: '0'
    min: 0
    max: 2097152
  dscp-wmm-be:
    type: integer
    raw_type: integer
    description: DSCP mapping for best effort access (default = 0 24). DSCP WMM mapping numbers (0 - 63).
    min: 0
    max: 63
  dscp-wmm-bk:
    type: integer
    raw_type: integer
    description: DSCP mapping for background access (default = 8 16). DSCP WMM mapping numbers (0 - 63).
    min: 0
    max: 63
  dscp-wmm-mapping:
    type: enum
    raw_type: option
    description: Enable/disable Differentiated Services Code Point (DSCP) mapping.
    default: disable
  dscp-wmm-vi:
    type: integer
    raw_type: integer
    description: DSCP mapping for video access (default = 32 40). DSCP WMM mapping numbers (0 - 63).
    min: 0
    max: 63
  dscp-wmm-vo:
    type: integer
    raw_type: integer
    description: DSCP mapping for voice access (default = 48 56). DSCP WMM mapping numbers (0 - 63).
    min: 0
    max: 63
  name:
    type: string
    raw_type: string
    description: WiFi QoS profile name.
    max_length: 35
  uplink:
    type: integer
    raw_type: integer
    description: Maximum uplink bandwidth for Virtual Access Points (VAPs) (0 - 2097152 Kbps, default = 0, 0 means no limit).
    default: '0'
    min: 0
    max: 2097152
  uplink-sta:
    type: integer
    raw_type: integer
    description: Maximum uplink bandwidth for clients (0 - 2097152 Kbps, default = 0, 0 means no limit).
    default: '0'
    min: 0
    max: 2097152
  wmm:
    type: enum
    raw_type: option
    description: Enable/disable WiFi multi-media (WMM) control.
    default: enable
  wmm-be-dscp:
    type: integer
    raw_type: integer
    description: DSCP marking for best effort access (default = 0).
    default: '0'
    min: 0
    max: 63
  wmm-bk-dscp:
    type: integer
    raw_type: integer
    description: DSCP marking for background access (default = 8).
    default: '8'
    min: 0
    max: 63
  wmm-dscp-marking:
    type: enum
    raw_type: option
    description: Enable/disable WMM Differentiated Services Code Point (DSCP) marking.
    default: disable
  wmm-uapsd:
    type: enum
    raw_type: option
    description: Enable/disable WMM Unscheduled Automatic Power Save Delivery (U-APSD) power save mode.
    default: enable
  wmm-vi-dscp:
    type: integer
    raw_type: integer
    description: DSCP marking for video access (default = 32).
    default: '32'
    min: 0
    max: 63
  wmm-vo-dscp:
    type: integer
    raw_type: integer
    description: DSCP marking for voice access (default = 48).
    default: '48'
    min: 0
    max: 63
children: {}
