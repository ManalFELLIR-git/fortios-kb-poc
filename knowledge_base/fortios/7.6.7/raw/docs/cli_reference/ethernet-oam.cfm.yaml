id: ethernet-oam.cfm
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/570361923/config-ethernet-oam-cfm
attributes:
  domain-id:
    type: integer
    raw_type: integer
    description: OAM domain ID.
    default: '0'
    min: 0
    max: 4294967295
  domain-level:
    type: integer
    raw_type: integer
    description: OAM maintenance level (0 - 7)
    default: '7'
    min: 0
    max: 7
  domain-name:
    type: text
    raw_type: text
    description: OAM domain name. Maintenance Domain Identifier (MDID).
children:
  service:
    attributes:
      cos:
        type: integer
        raw_type: integer
        description: Set Class of service (CoS) bit for continuity-check messages. range[0 - 7]
        default: '0'
        min: 0
        max: 7
      interface:
        type: string
        raw_type: string
        description: VLAN interface name where service is enabled
        max_length: 63
      mepid:
        type: integer
        raw_type: integer
        description: ID of the local MEP. range[1 - 8191]
        default: '1'
        min: 1
        max: 8191
      message-interval:
        type: enum
        raw_type: option
        description: Continuity-check message frequency interval in ms
        default: '1000'
      sender-id:
        type: enum
        raw_type: option
        description: TLV Sender ID. {None | Hostname}
        default: None
      service-id:
        type: integer
        raw_type: integer
        description: Service ID to specify service
        default: '0'
        min: 0
        max: 4294967295
      service-name:
        type: text
        raw_type: text
        description: Short MA Name (SMAN)
