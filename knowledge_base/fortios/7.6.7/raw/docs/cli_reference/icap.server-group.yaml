id: icap.server-group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/578188804/config-icap-server-group
attributes:
  ldb-method:
    type: enum
    raw_type: option
    description: Load balance method.
    default: weighted
  name:
    type: string
    raw_type: string
    description: Configure an ICAP server group consisting one or multiple forward servers. Supports failover and load balancing.
    max_length: 63
children:
  server-list:
    attributes:
      name:
        type: string
        raw_type: string
        description: ICAP server name.
        max_length: 63
      weight:
        type: integer
        raw_type: integer
        description: Optionally assign a weight of the forwarding server for weighted load balancing (1 - 100, default = 10).
        default: '10'
        min: 1
        max: 100
