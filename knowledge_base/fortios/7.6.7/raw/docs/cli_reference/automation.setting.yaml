id: automation.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/225348970/config-automation-setting
attributes:
  fabric-sync:
    type: enum
    raw_type: option
    description: Enable/disable synchronization of automation settings with security fabric.
    default: enable
  max-concurrent-stitches:
    type: integer
    raw_type: integer
    description: Maximum number of automation stitches that are allowed to run concurrently.
    default: 512 **
    min: 32
    max: 1024
  secure-mode:
    type: enum
    raw_type: option
    description: Enable/disable secure running mode for automation.
    default: disable
children: {}
