id: switch-controller.qos.qos-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/267970246/config-switch-controller-qos-qos-policy
attributes:
  default-cos:
    type: integer
    raw_type: integer
    description: Default cos queue for untagged packets.
    default: '0'
    min: 0
    max: 7
  name:
    type: string
    raw_type: string
    description: QoS policy name.
    max_length: 63
  queue-policy:
    type: string
    raw_type: string
    description: QoS egress queue policy.
    default: default
    max_length: 63
  trust-dot1p-map:
    type: string
    raw_type: string
    description: QoS trust 802.1p map.
    max_length: 63
  trust-ip-dscp-map:
    type: string
    raw_type: string
    description: QoS trust ip dscp map.
    max_length: 63
children: {}
