id: firewall.address6-template
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/282237258/config-firewall-address6-template
attributes:
  fabric-object:
    type: enum
    raw_type: option
    description: Security Fabric global object setting.
    default: disable
  ip6:
    type: ipv6-network
    raw_type: ipv6-network
    description: IPv6 address prefix.
    default: ::/0
  name:
    type: string
    raw_type: string
    description: IPv6 address template name.
    max_length: 63
  subnet-segment-count:
    type: integer
    raw_type: integer
    description: Number of IPv6 subnet segments.
    default: '0'
    min: 1
    max: 6
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children:
  subnet-segment:
    attributes:
      bits:
        type: integer
        raw_type: integer
        description: Number of bits.
        default: '0'
        min: 1
        max: 16
      exclusive:
        type: enum
        raw_type: option
        description: Enable/disable exclusive value.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: Subnet segment ID.
        default: '0'
        min: 0
        max: 4294967295
      name:
        type: string
        raw_type: string
        description: Subnet segment name.
        max_length: 63
  values:
    attributes:
      name:
        type: string
        raw_type: string
        description: Subnet segment value name.
        max_length: 63
      value:
        type: string
        raw_type: string
        description: Subnet segment value.
        max_length: 35
