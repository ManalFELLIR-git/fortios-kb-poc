id: wireless-controller.hotspot20.h2qp-osu-provider
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/130344864/config-wireless-controller-hotspot20-h2qp-osu-provider
attributes:
  icon:
    type: string
    raw_type: string
    description: OSU provider icon.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: OSU provider ID.
    max_length: 35
  osu-method:
    type: enum
    raw_type: option
    description: OSU method list.
  osu-nai:
    type: string
    raw_type: string
    description: OSU NAI.
    max_length: 255
  server-uri:
    type: string
    raw_type: string
    description: Server URI.
    max_length: 255
children:
  friendly-name:
    attributes:
      friendly-name:
        type: string
        raw_type: string
        description: OSU provider friendly name.
        max_length: 252
      index:
        type: integer
        raw_type: integer
        description: OSU provider friendly name index.
        default: '0'
        min: 1
        max: 10
      lang:
        type: string
        raw_type: string
        description: Language code.
        default: eng
        max_length: 3
  service-description:
    attributes:
      lang:
        type: string
        raw_type: string
        description: Language code.
        default: eng
        max_length: 3
      service-description:
        type: string
        raw_type: string
        description: Service description.
        max_length: 252
      service-id:
        type: integer
        raw_type: integer
        description: OSU service ID.
        default: '0'
        min: 0
        max: 4294967295
