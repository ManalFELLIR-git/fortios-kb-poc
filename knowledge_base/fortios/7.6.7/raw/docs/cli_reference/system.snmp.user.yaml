id: system.snmp.user
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/292257317/config-system-snmp-user
attributes:
  auth-proto:
    type: enum
    raw_type: option
    description: Authentication protocol.
    default: sha
  auth-pwd:
    type: password
    raw_type: password
    description: Password for authentication protocol.
  events:
    type: enum
    raw_type: option
    description: SNMP notifications (traps) to send.
    default: cpu-high mem-low log-full intf-ip vpn-tun-up vpn-tun-down ha-switch ha-hb-failure ips-signature ips-anomaly av-virus
      av-oversize av-pattern av-fragmented fm-if-change bgp-established bgp-backward-transition ha-member-up ha-member-down
      ent-conf-change av-conserve av-bypass av-oversize-passed av-oversize-blocked ips-pkg-update ips-fail-open temperature-high
      voltage-alert power-supply faz-disconnect faz fan-failure wc-ap-up wc-ap-down fswctl-session-up fswctl-session-down
      load-balance-real-server-down per-cpu-high dhcp pool-usage ippool interface ospf-nbr-state-change ospf-virtnbr-state-change
      bfd **
  ha-direct:
    type: enum
    raw_type: option
    description: Enable/disable direct management of HA cluster members.
    default: disable
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  mib-view:
    type: string
    raw_type: string
    description: SNMP access control MIB view.
    max_length: 32
  name:
    type: string
    raw_type: string
    description: SNMP user name.
    max_length: 32
  notify-hosts:
    type: ipv4-address
    raw_type: ipv4-address
    description: SNMP managers to send notifications (traps) to.
  notify-hosts6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 SNMP managers to send notifications (traps) to.
  priv-proto:
    type: enum
    raw_type: option
    description: Privacy (encryption) protocol.
    default: aes
  priv-pwd:
    type: password
    raw_type: password
    description: Password for privacy (encryption) protocol.
  queries:
    type: enum
    raw_type: option
    description: Enable/disable SNMP queries for this user.
    default: enable
  query-port:
    type: integer
    raw_type: integer
    description: SNMPv3 query port (default = 161).
    default: '161'
    min: 1
    max: 65535
  security-level:
    type: enum
    raw_type: option
    description: Security level for message authentication and encryption.
    default: no-auth-no-priv
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP for SNMP trap.
    default: 0.0.0.0
  source-ipv6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Source IPv6 for SNMP trap.
    default: '::'
  status:
    type: enum
    raw_type: option
    description: Enable/disable this SNMP user.
    default: enable
  trap-lport:
    type: integer
    raw_type: integer
    description: SNMPv3 local trap port (default = 162).
    default: '162'
    min: 1
    max: 65535
  trap-rport:
    type: integer
    raw_type: integer
    description: SNMPv3 trap remote port (default = 162).
    default: '162'
    min: 1
    max: 65535
  trap-status:
    type: enum
    raw_type: option
    description: Enable/disable traps for this SNMP user.
    default: enable
  vdoms:
    type: string
    raw_type: string
    description: SNMP access control VDOMs. VDOM name.
    max_length: 79
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
