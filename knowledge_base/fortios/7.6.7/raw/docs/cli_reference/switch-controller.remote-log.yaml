id: switch-controller.remote-log
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/199563149/config-switch-controller-remote-log
attributes:
  csv:
    type: enum
    raw_type: option
    description: Enable/disable comma-separated value (CSV) strings.
    default: disable
  facility:
    type: enum
    raw_type: option
    description: Facility to log to remote syslog server.
    default: local7
  name:
    type: string
    raw_type: string
    description: Remote log name.
    max_length: 35
  port:
    type: integer
    raw_type: integer
    description: Remote syslog server listening port.
    default: '514'
    min: 0
    max: 65535
  server:
    type: string
    raw_type: string
    description: IPv4 address of the remote syslog server.
    max_length: 63
  severity:
    type: enum
    raw_type: option
    description: Severity of logs to be transferred to remote log server.
    default: information
  status:
    type: enum
    raw_type: option
    description: Enable/disable logging by FortiSwitch device to a remote syslog server.
    default: disable
children: {}
