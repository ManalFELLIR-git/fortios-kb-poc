id: web-proxy.wisp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/250104525/config-web-proxy-wisp
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  max-connections:
    type: integer
    raw_type: integer
    description: Maximum number of web proxy WISP connections (4 - 4096, default = 64).
    default: '64'
    min: 4
    max: 4096
  name:
    type: string
    raw_type: string
    description: Server name.
    max_length: 35
  outgoing-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: WISP outgoing IP address.
    default: 0.0.0.0
  server-ip:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: WISP server IP address.
    default: 0.0.0.0
  server-port:
    type: integer
    raw_type: integer
    description: WISP server port (1 - 65535, default = 15868).
    default: '15868'
    min: 1
    max: 65535
  timeout:
    type: integer
    raw_type: integer
    description: Period of time before WISP requests time out (1 - 15 sec, default = 5).
    default: '5'
    min: 1
    max: 15
children: {}
