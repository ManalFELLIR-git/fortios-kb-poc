id: switch-controller.auto-config.policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/192799506/config-switch-controller-auto-config-policy
attributes:
  igmp-flood-report:
    type: enum
    raw_type: option
    description: Enable/disable IGMP flood report.
    default: disable
  igmp-flood-traffic:
    type: enum
    raw_type: option
    description: Enable/disable IGMP flood traffic.
    default: disable
  name:
    type: string
    raw_type: string
    description: Auto-config policy name.
    max_length: 63
  poe-status:
    type: enum
    raw_type: option
    description: Enable/disable PoE status.
    default: enable
  qos-policy:
    type: string
    raw_type: string
    description: Auto-Config QoS policy.
    default: default
    max_length: 63
  storm-control-policy:
    type: string
    raw_type: string
    description: Auto-Config storm control policy.
    default: auto-config
    max_length: 63
children: {}
