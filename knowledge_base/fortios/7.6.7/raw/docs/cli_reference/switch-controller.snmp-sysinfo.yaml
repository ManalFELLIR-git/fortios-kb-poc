id: switch-controller.snmp-sysinfo
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/314871907/config-switch-controller-snmp-sysinfo
attributes:
  contact-info:
    type: string
    raw_type: string
    description: Contact information.
    max_length: 35
  description:
    type: string
    raw_type: string
    description: System description.
    max_length: 35
