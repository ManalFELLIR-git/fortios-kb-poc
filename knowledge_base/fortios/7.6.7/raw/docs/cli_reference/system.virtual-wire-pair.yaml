id: system.virtual-wire-pair
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/204077709/config-system-virtual-wire-pair
attributes:
  member:
    type: string
    raw_type: string
    description: Interfaces belong to the virtual-wire-pair. Interface name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Virtual-wire-pair name. Must be a unique interface name.
    max_length: 11
  outer-vlan-id:
    type: integer
    raw_type: integer
    description: Outer VLAN ID. VLAN ID (1 - 4094).
    min: 1
    max: 4094
  poweroff-bypass:
    type: enum
    raw_type: option
    description: Enable/disable interface bypass state when power off.
    default: disable
  poweron-bypass:
    type: enum
    raw_type: option
    description: Enable/disable interface bypass state when power on.
    default: disable
  vlan-filter:
    type: string
    raw_type: user
    description: VLAN ranges to allow
  wildcard-vlan:
    type: enum
    raw_type: option
    description: Enable/disable wildcard VLAN.
    default: disable
children: {}
