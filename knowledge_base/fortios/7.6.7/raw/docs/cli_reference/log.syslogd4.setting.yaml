id: log.syslogd4.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/326975389/config-log-syslogd4-setting
attributes:
  certificate:
    type: string
    raw_type: string
    description: Certificate used to communicate with Syslog server.
    max_length: 35
  enc-algorithm:
    type: enum
    raw_type: option
    description: Enable/disable reliable syslogging with TLS encryption.
    default: disable
  facility:
    type: enum
    raw_type: option
    description: Remote syslog facility.
    default: local7
  format:
    type: enum
    raw_type: option
    description: Log format.
    default: default
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  max-log-rate:
    type: integer
    raw_type: integer
    description: Syslog maximum log rate in MBps (0 = unlimited).
    default: '0'
    min: 0
    max: 100000
  mode:
    type: enum
    raw_type: option
    description: Remote syslog logging over UDP/Reliable TCP.
    default: udp
  port:
    type: integer
    raw_type: integer
    description: Server listen port.
    default: '514'
    min: 0
    max: 65535
  priority:
    type: enum
    raw_type: option
    description: Set log transmission priority.
    default: default
  server:
    type: string
    raw_type: string
    description: Address of remote syslog server.
    max_length: 127
  source-ip:
    type: string
    raw_type: string
    description: Source IP address of syslog.
    max_length: 63
  source-ip-interface:
    type: string
    raw_type: string
    description: Source interface of syslog.
    max_length: 15
  ssl-min-proto-version:
    type: enum
    raw_type: option
    description: Minimum supported protocol version for SSL/TLS connections (default is to follow system global setting).
    default: default
  status:
    type: enum
    raw_type: option
    description: Enable/disable remote syslog logging.
    default: disable
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  custom-field-name:
    attributes:
      custom:
        type: string
        raw_type: string
        description: Field custom name [A-Za-z0-9_].
        max_length: 35
      id:
        type: integer
        raw_type: integer
        description: Entry ID.
        default: '0'
        min: 0
        max: 255
      name:
        type: string
        raw_type: string
        description: Field name [A-Za-z0-9_].
        max_length: 35
