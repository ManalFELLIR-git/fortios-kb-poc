id: firewall.ipmacbinding.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/985312136/config-firewall-ipmacbinding-setting
attributes:
  bindthroughfw:
    type: enum
    raw_type: option
    description: Enable/disable use of IP/MAC binding to filter packets that would normally go through the firewall.
    default: disable
  bindtofw:
    type: enum
    raw_type: option
    description: Enable/disable use of IP/MAC binding to filter packets that would normally go to the firewall.
    default: disable
  undefinedhost:
    type: enum
    raw_type: option
    description: Select action to take on packets with IP/MAC addresses not in the binding list (default = block).
    default: block
children: {}
