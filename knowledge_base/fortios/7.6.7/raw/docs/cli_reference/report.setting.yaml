id: report.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/303922876/config-report-setting
attributes:
  fortiview:
    type: enum
    raw_type: option
    description: Enable/disable historical FortiView.
    default: enable **
  pdf-report:
    type: enum
    raw_type: option
    description: Enable/disable PDF report.
    default: enable **
  report-source:
    type: enum
    raw_type: option
    description: Report log source.
    default: forward-traffic
  top-n:
    type: integer
    raw_type: integer
    description: Number of items to populate (1000 - 20000).
    default: '1000'
    min: 1000
    max: 20000
  web-browsing-threshold:
    type: integer
    raw_type: integer
    description: Web browsing time calculation threshold (3 - 15 min).
    default: '3'
    min: 3
    max: 15
children: {}
