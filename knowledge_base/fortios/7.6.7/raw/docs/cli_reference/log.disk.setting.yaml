id: log.disk.setting
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/188501544/config-log-disk-setting
attributes:
  diskfull:
    type: enum
    raw_type: option
    description: Action to take when disk is full. The system can overwrite the oldest log messages or stop logging when the
      disk is full (default = overwrite).
    default: overwrite
  dlp-archive-quota:
    type: integer
    raw_type: integer
    description: DLP archive quota (MB).
    default: '0'
    min: 0
    max: 4294967295
  full-final-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full final warning threshold as a percent (3 - 100, default = 95).
    default: '95'
    min: 3
    max: 100
  full-first-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full first warning threshold as a percent (1 - 98, default = 75).
    default: '75'
    min: 1
    max: 98
  full-second-warning-threshold:
    type: integer
    raw_type: integer
    description: Log full second warning threshold as a percent (2 - 99, default = 90).
    default: '90'
    min: 2
    max: 99
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ips-archive:
    type: enum
    raw_type: option
    description: Enable/disable IPS packet archiving to the local disk.
    default: enable
  log-quota:
    type: integer
    raw_type: integer
    description: Disk log quota (MB).
    default: '0'
    min: 0
    max: 4294967295
  max-log-file-size:
    type: integer
    raw_type: integer
    description: Maximum log file size before rolling (1 - 100 Mbytes).
    default: '20'
    min: 1
    max: 100
  max-policy-packet-capture-size:
    type: integer
    raw_type: integer
    description: Maximum size of policy sniffer in MB (0 means unlimited).
    default: '100'
    min: 0
    max: 4294967295
  maximum-log-age:
    type: integer
    raw_type: integer
    description: Delete log files older than (days).
    default: '7'
    min: 0
    max: 3650
  report-quota:
    type: integer
    raw_type: integer
    description: Report db quota (MB).
    default: '0'
    min: 0
    max: 4294967295
  roll-day:
    type: enum
    raw_type: option
    description: Day of week on which to roll log file.
    default: sunday
  roll-schedule:
    type: enum
    raw_type: option
    description: Frequency to check log file for rolling.
    default: daily
  roll-time:
    type: string
    raw_type: user
    description: Time of day to roll the log file (hh:mm).
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP address to use for uploading disk log files.
    default: 0.0.0.0
  status:
    type: enum
    raw_type: option
    description: Enable/disable local disk logging.
    default: disable **
  upload:
    type: enum
    raw_type: option
    description: Enable/disable uploading log files when they are rolled.
    default: disable
  upload-delete-files:
    type: enum
    raw_type: option
    description: Delete log files after uploading (default = enable).
    default: enable
  upload-destination:
    type: enum
    raw_type: option
    description: The type of server to upload log files to. Only FTP is currently supported.
    default: ftp-server
  upload-ssl-conn:
    type: enum
    raw_type: option
    description: Enable/disable encrypted FTPS communication to upload log files.
    default: default
  uploaddir:
    type: string
    raw_type: string
    description: The remote directory on the FTP server to upload log files to.
    max_length: 63
  uploadip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address of the FTP server to upload log files to.
    default: 0.0.0.0
  uploadpass:
    type: password
    raw_type: password
    description: Password required to log into the FTP server to upload disk log files.
  uploadport:
    type: integer
    raw_type: integer
    description: TCP port to use for communicating with the FTP server (default = 21).
    default: '21'
    min: 0
    max: 65535
  uploadsched:
    type: enum
    raw_type: option
    description: Set the schedule for uploading log files to the FTP server (default = disable = upload when rolling).
    default: disable
  uploadtime:
    type: string
    raw_type: user
    description: Time of day at which log files are uploaded if uploadsched is enabled (hh:mm or hh).
  uploadtype:
    type: enum
    raw_type: option
    description: Types of log files to upload. Separate multiple entries with a space.
    default: traffic event virus webfilter IPS emailfilter dlp-archive anomaly voip dlp app-ctrl waf dns ssh ssl **
  uploaduser:
    type: string
    raw_type: string
    description: Username required to log into the FTP server to upload disk log files.
    max_length: 35
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children: {}
