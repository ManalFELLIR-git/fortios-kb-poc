id: vpn.ipsec.concentrator
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/171932655/config-vpn-ipsec-concentrator
attributes:
  id:
    type: integer
    raw_type: integer
    description: Concentrator ID (1 - 65535).
    default: '0'
    min: 1
    max: 65535
  member:
    type: string
    raw_type: string
    description: Names of up to 3 VPN tunnels to add to the concentrator. Member name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Concentrator name.
    max_length: 35
  src-check:
    type: enum
    raw_type: option
    description: Enable to check source address of phase 2 selector. Disable to check only the destination selector.
    default: disable
children: {}
