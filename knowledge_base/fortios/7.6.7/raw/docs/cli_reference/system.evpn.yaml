id: system.evpn
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/126425277/config-system-evpn
attributes:
  arp-suppression:
    type: enum
    raw_type: option
    description: Enable/disable ARP suppression.
    default: disable
  export-rt:
    type: string
    raw_type: string
    description: 'List of export route targets. Route target: AA:NN|A.B.C.D:NN.'
    max_length: 79
  id:
    type: integer
    raw_type: integer
    description: ID.
    default: '0'
    min: 1
    max: 65535
  import-rt:
    type: string
    raw_type: string
    description: 'List of import route targets. Route target: AA:NN|A.B.C.D:NN.'
    max_length: 79
  ip-local-learning:
    type: enum
    raw_type: option
    description: Enable/disable IP address local learning.
    default: disable
  rd:
    type: string
    raw_type: string
    description: 'Route Distinguisher: AA:NN|A.B.C.D:NN.'
    max_length: 79
children: {}
