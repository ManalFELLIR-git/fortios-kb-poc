id: system.dns-database
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/193609391/config-system-dns-database
attributes:
  allow-transfer:
    type: string
    raw_type: user
    description: DNS zone transfer IP address list.
  authoritative:
    type: enum
    raw_type: option
    description: Enable/disable authoritative zone.
    default: enable
  contact:
    type: string
    raw_type: string
    description: Email address of the administrator for this zone. You can specify only the username, such as admin or the
      full email address, such as admin@test.com When using only a username, the domain of the email will be this zone.
    default: host
    max_length: 255
  domain:
    type: string
    raw_type: string
    description: Domain name.
    max_length: 255
  forwarder:
    type: string
    raw_type: user
    description: DNS zone forwarder IP address list.
  forwarder6:
    type: ipv6-address
    raw_type: ipv6-address
    description: Forwarder IPv6 address.
    default: '::'
  interface:
    type: string
    raw_type: string
    description: Specify outgoing interface to reach server.
    max_length: 15
  interface-select-method:
    type: enum
    raw_type: option
    description: Specify how to select outgoing interface to reach server.
    default: auto
  ip-primary:
    type: ipv4-address-any
    raw_type: ipv4-address-any
    description: IP address of primary DNS server. Entries in this primary DNS server and imported into the DNS zone.
    default: 0.0.0.0
  name:
    type: string
    raw_type: string
    description: Zone name.
    max_length: 35
  primary-name:
    type: string
    raw_type: string
    description: Domain name of the default DNS server for this zone.
    default: dns
    max_length: 255
  rr-max:
    type: integer
    raw_type: integer
    description: Maximum number of resource records (10 - 65536, 0 means infinite).
    default: '16384'
    min: 10
    max: 65536
  source-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: Source IP for forwarding to DNS server.
    default: 0.0.0.0
  source-ip-interface:
    type: string
    raw_type: string
    description: IP address of the specified interface as the source IP address.
    max_length: 15
  source-ip6:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 source IP address for forwarding to DNS server.
    default: '::'
  status:
    type: enum
    raw_type: option
    description: Enable/disable this DNS zone.
    default: enable
  ttl:
    type: integer
    raw_type: integer
    description: Default time-to-live value for the entries of this DNS zone (0 - 2147483647 sec, default = 86400).
    default: '86400'
    min: 0
    max: 2147483647
  type:
    type: enum
    raw_type: option
    description: Zone type (primary to manage entries directly, secondary to import entries from other zones).
    default: primary
  view:
    type: enum
    raw_type: option
    description: Zone view (public to serve public clients, shadow to serve internal clients).
    default: shadow
  vrf-select:
    type: integer
    raw_type: integer
    description: VRF ID used for connection to server.
    default: '0'
    min: 0
    max: 511
children:
  dns-entry:
    attributes:
      canonical-name:
        type: string
        raw_type: string
        description: Canonical name of the host.
        max_length: 255
      hostname:
        type: string
        raw_type: string
        description: Name of the host.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: DNS entry ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: ipv4-address-any
        raw_type: ipv4-address-any
        description: IPv4 address of the host.
        default: 0.0.0.0
      ipv6:
        type: ipv6-address
        raw_type: ipv6-address
        description: IPv6 address of the host.
        default: '::'
      preference:
        type: integer
        raw_type: integer
        description: DNS entry preference (0 - 65535, highest preference = 0, default = 10).
        default: '10'
        min: 0
        max: 65535
      status:
        type: enum
        raw_type: option
        description: Enable/disable resource record status.
        default: enable
      ttl:
        type: integer
        raw_type: integer
        description: Time-to-live for this entry (0 to 2147483647 sec, default = 0).
        default: '0'
        min: 0
        max: 2147483647
      type:
        type: enum
        raw_type: option
        description: Resource record type.
        default: A
