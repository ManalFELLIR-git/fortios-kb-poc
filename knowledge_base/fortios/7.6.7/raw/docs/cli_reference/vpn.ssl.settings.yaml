id: vpn.ssl.settings
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/114404382/config-vpn-ssl-settings
attributes:
  algorithm:
    type: enum
    raw_type: option
    description: Force the Agentless VPN security level. High allows only high. Medium allows medium and high. Low allows
      any.
    default: high
  auth-session-check-source-ip:
    type: enum
    raw_type: option
    description: Enable/disable checking of source IP for authentication session.
    default: enable
  auth-timeout:
    type: integer
    raw_type: integer
    description: Agentless VPN authentication timeout (1 - 259200 sec (3 days), 0 for no timeout).
    default: '28800'
    min: 0
    max: 259200
  banned-cipher:
    type: enum
    raw_type: option
    description: Select one or more cipher technologies that cannot be used in Agentless VPN negotiations. Only applies to
      TLS 1.2 and below.
    default: SHA1 SHA256 SHA384
  browser-language-detection:
    type: enum
    raw_type: option
    description: Enable/disable overriding the configured system language based on the preferred language of the browser.
    default: enable
  check-referer:
    type: enum
    raw_type: option
    description: Enable/disable verification of referer field in HTTP request header.
    default: disable
  ciphersuite:
    type: enum
    raw_type: option
    description: Select one or more TLS 1.3 ciphersuites to enable. Does not affect ciphers in TLS 1.2 and below. At least
      one must be enabled. To disable all, set ssl-max-proto-ver to tls1-2 or below.
    default: TLS-AES-128-GCM-SHA256 TLS-AES-256-GCM-SHA384 TLS-CHACHA20-POLY1305-SHA256
  client-sigalgs:
    type: enum
    raw_type: option
    description: Set signature algorithms related to client authentication. Affects TLS version <= 1.2 only.
    default: all
  default-portal:
    type: string
    raw_type: string
    description: Default Agentless VPN portal.
    max_length: 35
  deflate-compression-level:
    type: integer
    raw_type: integer
    description: Compression level (0~9).
    default: '6'
    min: 0
    max: 9
  deflate-min-data-size:
    type: integer
    raw_type: integer
    description: Minimum amount of data that triggers compression (200 - 65535 bytes).
    default: '300'
    min: 200
    max: 65535
  dns-suffix:
    type: string
    raw_type: var-string
    description: DNS suffix used for Agentless VPN clients.
    max_length: 253
  dtls-heartbeat-fail-count:
    type: integer
    raw_type: integer
    description: Number of missing heartbeats before the connection is considered dropped.
    default: '3'
    min: 3
    max: 10
  dtls-heartbeat-idle-timeout:
    type: integer
    raw_type: integer
    description: Idle timeout before DTLS heartbeat is sent.
    default: '3'
    min: 3
    max: 10
  dtls-heartbeat-interval:
    type: integer
    raw_type: integer
    description: Interval between DTLS heartbeat.
    default: '3'
    min: 3
    max: 10
  dtls-hello-timeout:
    type: integer
    raw_type: integer
    description: SSLVPN maximum DTLS hello timeout (10 - 60 sec, default = 10).
    default: '10'
    min: 10
    max: 60
  dual-stack-mode:
    type: enum
    raw_type: option
    description: 'Agentless web mode: support IPv4 and IPv6 bookmarks in the portal.'
    default: disable
  encode-2f-sequence:
    type: enum
    raw_type: option
    description: Encode \2F sequence to forward slash in URLs.
    default: disable
  encrypt-and-store-password:
    type: enum
    raw_type: option
    description: Encrypt and store user passwords for Agentless VPN web sessions.
    default: disable
  force-two-factor-auth:
    type: enum
    raw_type: option
    description: Enable/disable only PKI users with two-factor authentication for Agentless VPNs.
    default: disable
  header-x-forwarded-for:
    type: enum
    raw_type: option
    description: Forward the same, add, or remove HTTP header.
    default: add
  hsts-include-subdomains:
    type: enum
    raw_type: option
    description: Add HSTS includeSubDomains response header.
    default: disable
  http-compression:
    type: enum
    raw_type: option
    description: Enable/disable to allow HTTP compression over Agentless VPN connections.
    default: disable
  http-only-cookie:
    type: enum
    raw_type: option
    description: Enable/disable Agentless VPN support for HttpOnly cookies.
    default: enable
  http-request-body-timeout:
    type: integer
    raw_type: integer
    description: Agentless VPN session is disconnected if an HTTP request body is not received within this time (1 - 60 sec,
      default = 20).
    default: '30'
    min: 0
    max: 4294967295
  http-request-header-timeout:
    type: integer
    raw_type: integer
    description: Agentless VPN session is disconnected if an HTTP request header is not received within this time (1 - 60
      sec, default = 20).
    default: '20'
    min: 0
    max: 4294967295
  https-redirect:
    type: enum
    raw_type: option
    description: Enable/disable redirect of port 80 to Agentless VPN port.
    default: disable
  idle-timeout:
    type: integer
    raw_type: integer
    description: Agentless VPN disconnects if idle for specified time in seconds.
    default: '300'
    min: 0
    max: 259200
  login-attempt-limit:
    type: integer
    raw_type: integer
    description: Agentless VPN maximum login attempt times before block (0 - 10, default = 2, 0 = no limit).
    default: '2'
    min: 0
    max: 10
  login-block-time:
    type: integer
    raw_type: integer
    description: Time for which a user is blocked from logging in after too many failed login attempts (0 - 86400 sec, default
      = 60).
    default: '60'
    min: 0
    max: 86400
  login-timeout:
    type: integer
    raw_type: integer
    description: Agentless VPN maximum login timeout (10 - 180 sec, default = 30).
    default: '30'
    min: 10
    max: 180
  port:
    type: integer
    raw_type: integer
    description: Agentless VPN access port (1 - 65535).
    default: '10443'
    min: 1
    max: 65535
  port-precedence:
    type: enum
    raw_type: option
    description: Enable/disable, Enable means that if Agentless VPN connections are allowed on an interface admin GUI connections
      are blocked on that interface.
    default: enable
  remote-https-cert-check:
    type: enum
    raw_type: option
    description: Configure how the FortiGate unit checks and responds to the remote HTTPS server's certificate (default =
      warn-on-error).
    default: warn-on-error
  reqclientcert:
    type: enum
    raw_type: option
    description: Enable/disable to require client certificates for all Agentless VPN users.
    default: disable
  server-hostname:
    type: string
    raw_type: string
    description: Server hostname for HTTPS. When set, will be used for Agentless VPN web proxy host header for any redirection.
    max_length: 255
  servercert:
    type: string
    raw_type: string
    description: Name of the server certificate to be used for Agentless VPNs.
    max_length: 35
  source-address:
    type: string
    raw_type: string
    description: Source address of incoming traffic. Address name.
    max_length: 79
  source-address-negate:
    type: enum
    raw_type: option
    description: Enable/disable negated source address match.
    default: disable
  source-address6:
    type: string
    raw_type: string
    description: IPv6 source address of incoming traffic. IPv6 address name.
    max_length: 79
  source-address6-negate:
    type: enum
    raw_type: option
    description: Enable/disable negated source IPv6 address match.
    default: disable
  source-interface:
    type: string
    raw_type: string
    description: Agentless VPN source interface of incoming traffic. Interface name.
    max_length: 35
  ssl-client-renegotiation:
    type: enum
    raw_type: option
    description: Enable/disable to allow client renegotiation by the server if the tunnel goes down.
    default: disable
  ssl-insert-empty-fragment:
    type: enum
    raw_type: option
    description: Enable/disable insertion of empty fragment.
    default: enable
  ssl-max-proto-ver:
    type: enum
    raw_type: option
    description: SSL maximum protocol version.
    default: tls1-3
  ssl-min-proto-ver:
    type: enum
    raw_type: option
    description: SSL minimum protocol version.
    default: tls1-2
  status:
    type: enum
    raw_type: option
    description: Enable/disable Agentless VPN.
    default: enable
  tls-groups:
    type: enum
    raw_type: option
    description: Configure the supported groups for TLS negotiation.
    default: P-521 P-384 ML-KEM768 ML-KEM1024 P-384-MLKEM1024 P-256-MLKEM768 X25519-MLKEM768 X448 FFDHE4096 FFDHE6144 FFDHE8192
  transform-backward-slashes:
    type: enum
    raw_type: option
    description: Transform backward slashes to forward slashes in URLs.
    default: disable
  unsafe-legacy-renegotiation:
    type: enum
    raw_type: option
    description: Enable/disable unsafe legacy re-negotiation.
    default: disable
  url-obscuration:
    type: enum
    raw_type: option
    description: Enable/disable to obscure the host name of the URL of the web browser display.
    default: disable
  user-peer:
    type: string
    raw_type: string
    description: Name of user peer.
    max_length: 35
  x-content-type-options:
    type: enum
    raw_type: option
    description: Add HTTP X-Content-Type-Options header.
    default: enable
children:
  authentication-rule:
    attributes:
      auth:
        type: enum
        raw_type: option
        description: Agentless VPN authentication method restriction.
        default: any
      cipher:
        type: enum
        raw_type: option
        description: Agentless VPN cipher strength.
        default: high
      client-cert:
        type: enum
        raw_type: option
        description: Enable/disable Agentless VPN client certificate restrictive.
        default: disable
      groups:
        type: string
        raw_type: string
        description: User groups. Group name.
        max_length: 79
      id:
        type: integer
        raw_type: integer
        description: ID (0 - 4294967295).
        default: '0'
        min: 0
        max: 4294967295
      portal:
        type: string
        raw_type: string
        description: Agentless VPN portal.
        max_length: 35
      realm:
        type: string
        raw_type: string
        description: Agentless VPN realm.
        max_length: 35
      source-address:
        type: string
        raw_type: string
        description: Source address of incoming traffic. Address name.
        max_length: 79
      source-address-negate:
        type: enum
        raw_type: option
        description: Enable/disable negated source address match.
        default: disable
      source-address6:
        type: string
        raw_type: string
        description: IPv6 source address of incoming traffic. IPv6 address name.
        max_length: 79
      source-address6-negate:
        type: enum
        raw_type: option
        description: Enable/disable negated source IPv6 address match.
        default: disable
      source-interface:
        type: string
        raw_type: string
        description: Agentless VPN source interface of incoming traffic. Interface name.
        max_length: 35
      user-peer:
        type: string
        raw_type: string
        description: Name of user peer.
        max_length: 35
      users:
        type: string
        raw_type: string
        description: User name. User name.
        max_length: 79
