id: system.proxy-arp
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/230821373/config-system-proxy-arp
attributes:
  end-ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: End IP of IP range to be proxied.
    default: 0.0.0.0
  id:
    type: integer
    raw_type: integer
    description: Unique integer ID of the entry.
    default: '0'
    min: 0
    max: 4294967295
  interface:
    type: string
    raw_type: string
    description: Interface acting proxy-ARP.
    max_length: 15
  ip:
    type: ipv4-address
    raw_type: ipv4-address
    description: IP address or start IP to be proxied.
    default: 0.0.0.0
children: {}
