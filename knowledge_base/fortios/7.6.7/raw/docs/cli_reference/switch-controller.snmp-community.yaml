id: switch-controller.snmp-community
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/156837068/config-switch-controller-snmp-community
attributes:
  events:
    type: enum
    raw_type: option
    description: SNMP notifications (traps) to send.
    default: cpu-high mem-low log-full intf-ip ent-conf-change l2mac
  id:
    type: integer
    raw_type: integer
    description: SNMP community ID.
    default: '0'
    min: 0
    max: 4294967295
  name:
    type: string
    raw_type: string
    description: SNMP community name.
    max_length: 35
  query-v1-port:
    type: integer
    raw_type: integer
    description: SNMP v1 query port (default = 161).
    default: '161'
    min: 0
    max: 65535
  query-v1-status:
    type: enum
    raw_type: option
    description: Enable/disable SNMP v1 queries.
    default: enable
  query-v2c-port:
    type: integer
    raw_type: integer
    description: SNMP v2c query port (default = 161).
    default: '161'
    min: 0
    max: 65535
  query-v2c-status:
    type: enum
    raw_type: option
    description: Enable/disable SNMP v2c queries.
    default: enable
  status:
    type: enum
    raw_type: option
    description: Enable/disable this SNMP community.
    default: enable
  trap-v1-lport:
    type: integer
    raw_type: integer
    description: SNMP v2c trap local port (default = 162).
    default: '162'
    min: 0
    max: 65535
  trap-v1-rport:
    type: integer
    raw_type: integer
    description: SNMP v2c trap remote port (default = 162).
    default: '162'
    min: 0
    max: 65535
  trap-v1-status:
    type: enum
    raw_type: option
    description: Enable/disable SNMP v1 traps.
    default: enable
  trap-v2c-lport:
    type: integer
    raw_type: integer
    description: SNMP v2c trap local port (default = 162).
    default: '162'
    min: 0
    max: 65535
  trap-v2c-rport:
    type: integer
    raw_type: integer
    description: SNMP v2c trap remote port (default = 162).
    default: '162'
    min: 0
    max: 65535
  trap-v2c-status:
    type: enum
    raw_type: option
    description: Enable/disable SNMP v2c traps.
    default: enable
children:
  hosts:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: Host entry ID.
        default: '0'
        min: 0
        max: 4294967295
      ip:
        type: string
        raw_type: user
        description: IPv4 address of the SNMP manager (host).
