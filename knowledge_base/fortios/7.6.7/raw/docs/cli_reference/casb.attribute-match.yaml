id: casb.attribute-match
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/477682417/config-casb-attribute-match
attributes:
  application:
    type: string
    raw_type: string
    description: CASB attribute application name.
    max_length: 79
  match-strategy:
    type: enum
    raw_type: option
    description: CASB attribute match strategy.
    default: or
  name:
    type: string
    raw_type: string
    description: CASB attribute match name.
    max_length: 79
children:
  match:
    attributes:
      id:
        type: integer
        raw_type: integer
        description: CASB attribute match rule ID.
        default: '0'
        min: 0
        max: 4294967295
      rule-strategy:
        type: enum
        raw_type: option
        description: CASB attribute match rule strategy.
        default: and
  rule:
    attributes:
      attribute:
        type: string
        raw_type: string
        description: CASB attribute match name.
        max_length: 79
      case-sensitive:
        type: enum
        raw_type: option
        description: CASB attribute match case sensitive.
        default: disable
      id:
        type: integer
        raw_type: integer
        description: CASB attribute rule ID.
        default: '0'
        min: 0
        max: 4294967295
      match-pattern:
        type: enum
        raw_type: option
        description: CASB attribute match pattern.
        default: simple
      match-value:
        type: string
        raw_type: string
        description: CASB attribute match value.
        max_length: 1023
      negate:
        type: enum
        raw_type: option
        description: Enable/disable what the matching strategy must not be.
        default: disable
