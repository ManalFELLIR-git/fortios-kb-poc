id: firewall.auth-portal
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/316141366/config-firewall-auth-portal
attributes:
  groups:
    type: string
    raw_type: string
    description: Firewall user groups permitted to authenticate through this portal. Separate group names with spaces. Group
      name.
    max_length: 79
  identity-based-route:
    type: string
    raw_type: string
    description: Name of the identity-based route that applies to this portal.
    max_length: 35
  portal-addr:
    type: string
    raw_type: string
    description: Address (or FQDN) of the authentication portal.
    max_length: 63
  portal-addr6:
    type: string
    raw_type: string
    description: IPv6 address (or FQDN) of authentication portal.
    max_length: 63
  proxy-auth:
    type: enum
    raw_type: option
    description: Enable/disable authentication by proxy daemon (default = disable).
    default: disable
children: {}
