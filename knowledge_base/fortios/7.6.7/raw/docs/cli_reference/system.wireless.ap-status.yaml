id: system.wireless.ap-status
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/167154666/config-system-wireless-ap-status
attributes:
  bssid:
    type: mac-address
    raw_type: mac-address
    description: AP's BSSID.
    default: 00:00:00:00:00:00
  id:
    type: integer
    raw_type: integer
    description: AP ID.
    default: '0'
    min: 0
    max: 4294967295
  ssid:
    type: string
    raw_type: string
    description: AP's ssid
    max_length: 32
  status:
    type: enum
    raw_type: option
    description: AP status.
    default: rogue
children: {}
