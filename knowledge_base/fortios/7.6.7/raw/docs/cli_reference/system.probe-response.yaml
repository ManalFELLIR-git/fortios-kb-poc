id: system.probe-response
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/294062949/config-system-probe-response
attributes:
  http-probe-value:
    type: string
    raw_type: string
    description: Value to respond to the monitoring server.
    default: OK
    max_length: 1024
  mode:
    type: enum
    raw_type: option
    description: SLA response mode.
    default: none
  password:
    type: password
    raw_type: password
    description: TWAMP responder password in authentication mode.
  port:
    type: integer
    raw_type: integer
    description: Port number to response.
    default: '8008'
    min: 1
    max: 65535
  security-mode:
    type: enum
    raw_type: option
    description: TWAMP responder security mode.
    default: none
  timeout:
    type: integer
    raw_type: integer
    description: An inactivity timer for a twamp test session.
    default: '300'
    min: 10
    max: 3600
  ttl-mode:
    type: enum
    raw_type: option
    description: Mode for TWAMP packet TTL modification.
    default: retain
children: {}
