id: system.dnp3-proxy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/237283045/config-system-dnp3-proxy
attributes:
  port:
    type: integer
    raw_type: integer
    description: DNP3 TCPServer Port.
    default: '20000'
    min: 1
    max: 65535
  status:
    type: enum
    raw_type: option
    description: Enable/disable DNP daemon.
    default: disable
  term-baudrate:
    type: enum
    raw_type: option
    description: Term Baudrate.
    default: '19200'
  term-databits:
    type: integer
    raw_type: integer
    description: Term Data Bits.
    default: '8'
    min: 0
    max: 65535
  term-flowcontrol:
    type: enum
    raw_type: option
    description: Term Flow Control
    default: none
  term-parity:
    type: enum
    raw_type: option
    description: Term Parity
    default: none
  term-stopbits:
    type: integer
    raw_type: integer
    description: Term Stop Bits.
    default: '1'
    min: 0
    max: 65535
children: {}
