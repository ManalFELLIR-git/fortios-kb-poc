id: firewall.wildcard-fqdn.group
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/219007912/config-firewall-wildcard-fqdn-group
attributes:
  color:
    type: integer
    raw_type: integer
    description: GUI icon color.
    default: '0'
    min: 0
    max: 32
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  member:
    type: string
    raw_type: string
    description: Address group members. Address name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Address group name.
    max_length: 79
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
children: {}
