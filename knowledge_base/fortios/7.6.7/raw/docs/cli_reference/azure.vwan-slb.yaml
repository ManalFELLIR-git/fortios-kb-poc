id: azure.vwan-slb
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/229493575/config-azure-vwan-slb
attributes:
  mode:
    type: enum
    raw_type: option
    description: Mode of VWAN SLB setting.
    default: passive
children:
  permanent-security-rules:
    attributes:
      status:
        type: enum
        raw_type: option
        description: Status of SLB inbound security rules setting (read-only).
        default: disable
      version:
        type: integer
        raw_type: integer
        description: Version of SLB setting (read-only).
        default: '0'
        min: 0
        max: 4294967295
  rules:
    attributes:
      applies-on:
        type: string
        raw_type: string
        description: Applies on target.
        max_length: 255
      destination-port-ranges:
        type: string
        raw_type: string
        description: Destination port ranges.
        max_length: 127
      name:
        type: string
        raw_type: string
        description: Name of security rule.
        max_length: 63
      protocol:
        type: enum
        raw_type: option
        description: Protocol.
        default: TCP
      source-address-prefix:
        type: string
        raw_type: string
        description: Source address ranges.
        max_length: 63
  temporary-security-rules:
    attributes:
      expiration-time:
        type: string
        raw_type: string
        description: Expiration time (read-only).
        max_length: 31
      status:
        type: enum
        raw_type: option
        description: Status of SLB inbound security rules setting (read-only).
        default: disable
