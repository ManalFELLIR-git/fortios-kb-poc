id: system.auto-install
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/304730529/config-system-auto-install
attributes:
  auto-install-config:
    type: enum
    raw_type: option
    description: Enable/disable auto install the config in USB disk. This option is disabled when unset, but enabled after
      a factory reset.
    default: disable
  auto-install-image:
    type: enum
    raw_type: option
    description: Enable/disable auto install the image in USB disk. This option is disabled when unset, but enabled after
      a factory reset.
    default: disable
  default-config-file:
    type: string
    raw_type: string
    description: Default config file name in USB disk.
    default: fgt_system.conf
    max_length: 127
  default-image-file:
    type: string
    raw_type: string
    description: Default image file name in USB disk.
    default: image.out
    max_length: 127
children: {}
