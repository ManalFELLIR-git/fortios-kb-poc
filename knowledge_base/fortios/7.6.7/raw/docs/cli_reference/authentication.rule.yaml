id: authentication.rule
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/286221557/config-authentication-rule
attributes:
  active-auth-method:
    type: string
    raw_type: string
    description: Select an active authentication method.
    max_length: 35
  cert-auth-cookie:
    type: enum
    raw_type: option
    description: Enable/disable to use device certificate as authentication cookie (default = enable).
    default: enable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 1023
  cors-depth:
    type: integer
    raw_type: integer
    description: Depth to allow CORS access (default = 3).
    default: '3'
    min: 1
    max: 8
  cors-stateful:
    type: enum
    raw_type: option
    description: Enable/disable allowance of CORS access (default = disable).
    default: disable
  dstaddr:
    type: string
    raw_type: string
    description: Select an IPv4 destination address from available options. Required for web proxy authentication. Address
      name.
    max_length: 79
  dstaddr6:
    type: string
    raw_type: string
    description: Select an IPv6 destination address from available options. Required for web proxy authentication. Address
      name.
    max_length: 79
  ip-based:
    type: enum
    raw_type: option
    description: Enable/disable IP-based authentication. When enabled, previously authenticated users from the same IP address
      will be exempted.
    default: enable
  name:
    type: string
    raw_type: string
    description: Authentication rule name.
    max_length: 35
  protocol:
    type: enum
    raw_type: option
    description: Authentication is required for the selected protocol (default = HTTP).
    default: http
  session-logout:
    type: enum
    raw_type: option
    description: Enable/disable logout of a user from the current session.
    default: disable
  srcaddr:
    type: string
    raw_type: string
    description: Authentication is required for the selected IPv4 source address. Address name.
    max_length: 79
  srcaddr6:
    type: string
    raw_type: string
    description: Authentication is required for the selected IPv6 source address. Address name.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: Incoming (ingress) interface. Interface name.
    max_length: 79
  sso-auth-method:
    type: string
    raw_type: string
    description: Select a single-sign on (SSO) authentication method.
    max_length: 35
  status:
    type: enum
    raw_type: option
    description: Enable/disable this authentication rule.
    default: enable
  transaction-based:
    type: enum
    raw_type: option
    description: Enable/disable transaction based authentication (default = disable).
    default: disable
  web-auth-cookie:
    type: enum
    raw_type: option
    description: Enable/disable Web authentication cookies (default = disable).
    default: disable
  web-portal:
    type: enum
    raw_type: option
    description: Enable/disable web portal for proxy transparent policy (default = enable).
    default: enable
children: {}
