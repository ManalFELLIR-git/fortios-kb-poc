id: router.static6
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/210378249/config-router-static6
attributes:
  bfd:
    type: enum
    raw_type: option
    description: Enable/disable Bidirectional Forwarding Detection (BFD).
    default: disable
  blackhole:
    type: enum
    raw_type: option
    description: Enable/disable black hole.
    default: disable
  comment:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 255
  device:
    type: string
    raw_type: string
    description: Gateway out interface or tunnel.
    max_length: 35
  devindex:
    type: integer
    raw_type: integer
    description: Device index (0 - 4294967295).
    default: '0'
    min: 0
    max: 4294967295
  distance:
    type: integer
    raw_type: integer
    description: Administrative distance (1 - 255).
    default: '10'
    min: 1
    max: 255
  dst:
    type: ipv6-network
    raw_type: ipv6-network
    description: Destination IPv6 prefix.
    default: ::/0
  dstaddr:
    type: string
    raw_type: string
    description: Name of firewall address or address group.
    max_length: 79
  dynamic-gateway:
    type: enum
    raw_type: option
    description: Enable use of dynamic gateway retrieved from Router Advertisement (RA).
    default: disable
  gateway:
    type: ipv6-address
    raw_type: ipv6-address
    description: IPv6 address of the gateway.
    default: '::'
  link-monitor-exempt:
    type: enum
    raw_type: option
    description: Enable/disable withdrawal of this static route when link monitor or health check is down.
    default: disable
  priority:
    type: integer
    raw_type: integer
    description: Administrative priority (1 - 65535).
    default: '1024'
    min: 1
    max: 65535
  sdwan-zone:
    type: string
    raw_type: string
    description: Choose SD-WAN Zone. SD-WAN zone name.
    max_length: 79
  seq-num:
    type: integer
    raw_type: integer
    description: Sequence number.
    default: '0'
    min: 0
    max: 4294967295
  status:
    type: enum
    raw_type: option
    description: Enable/disable this static route.
    default: enable
  tag:
    type: integer
    raw_type: integer
    description: Route tag.
    default: '0'
    min: 0
    max: 4294967295
  vrf:
    type: integer
    raw_type: integer
    description: Virtual Routing Forwarding ID.
    default: unspecified
    min: 0
    max: 511
  weight:
    type: integer
    raw_type: integer
    description: Administrative weight (0 - 255).
    default: '0'
    min: 0
    max: 255
children: {}
