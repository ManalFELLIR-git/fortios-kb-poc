    description: Any IPv4 address or subnet address and netmask from which the administrator can connect to the FortiGate
      unit. Default allows access from any IPv4 address.
    default: 0.0.0.0 0.0.0.0
  two-factor:
    type: enum
    raw_type: option
    description: Enable/disable two-factor authentication.
    default: disable
  two-factor-authentication:
    type: enum
    raw_type: option
    description: Authentication method by FortiToken Cloud.
  two-factor-notification:
    type: enum
    raw_type: option
    description: Notification method for user activation by FortiToken Cloud.
  vdom:
    type: string
    raw_type: string
    description: Virtual domain(s) that the administrator can access. Virtual domain name.
    max_length: 79
  vdom-override:
    type: enum
    raw_type: option
    description: Enable to use the names of VDOMs provided by the remote authentication server to control the VDOMs that this
      administrator can access.
    default: disable
  wildcard:
    type: enum
    raw_type: option
    description: Enable/disable wildcard RADIUS authentication.
    default: disable
children: {}
