    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost5:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost6:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost7:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost8:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost9:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  name:
    type: string
    raw_type: string
    description: User name.
    max_length: 64
  password:
    type: password-2
    raw_type: password-2
    description: Admin user password.
  password-expire:
    type: datetime
    raw_type: datetime
    description: Password expire time.
    default: '0000-00-00 00:00:00'
  peer-auth:
    type: enum
    raw_type: option
    description: Set to enable peer certificate authentication (for HTTPS admin access).
    default: disable
  peer-group:
    type: string
    raw_type: string
    description: Name of peer group defined under config user group which has PKI members. Used for peer certificate authentication
      (for HTTPS admin access).
    max_length: 35
  remote-auth:
    type: enum
    raw_type: option
    description: Enable/disable authentication using a remote RADIUS, LDAP, or TACACS+ server.
    default: disable
  remote-group:
    type: string
    raw_type: string
    description: User group name used for remote auth.
    max_length: 35
  schedule:
    type: string
    raw_type: string
    description: Firewall schedule used to restrict when the administrator can log in. No schedule means no restrictions.
    max_length: 35
  sms-custom-server:
    type: string
    raw_type: string
    description: Custom SMS server to send SMS messages to.
    max_length: 35
  sms-phone:
    type: string
    raw_type: string
    description: Phone number on which the administrator receives SMS messages.
    max_length: 15
  sms-server:
    type: enum
    raw_type: option
    description: Send SMS messages using the FortiGuard SMS server or a custom server.
    default: fortiguard
  ssh-certificate:
    type: string
    raw_type: string
    description: Select the certificate to be used by the FortiGate for authentication with an SSH client.
    max_length: 35
  ssh-public-key1:
    type: string
    raw_type: user
    description: Public key of an SSH client. The client is authenticated without being asked for credentials. Create the
      public-private key pair in the SSH client application.
  ssh-public-key2:
    type: string
    raw_type: user
    description: Public key of an SSH client. The client is authenticated without being asked for credentials. Create the
      public-private key pair in the SSH client application.
  ssh-public-key3:
    type: string
    raw_type: user
    description: Public key of an SSH client. The client is authenticated without being asked for credentials. Create the
      public-private key pair in the SSH client application.
  trusthost1:
    type: ipv4-classnet
    raw_type: ipv4-classnet
    description: Any IPv4 address or subnet address and netmask from which the administrator can connect to the FortiGate
      unit. Default allows access from any IPv4 address.
    default: 0.0.0.0 0.0.0.0
  trusthost10:
    type: ipv4-classnet
