id: system.admin
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/390485493/config-system-admin
attributes:
  accprofile:
    type: string
    raw_type: string
    description: Access profile for this administrator. Access profiles control administrator access to FortiGate features.
    max_length: 35
  accprofile-override:
    type: enum
    raw_type: option
    description: Enable to use the name of an access profile provided by the remote authentication server to control the FortiGate
      features that this administrator can access.
    default: disable
  allow-remove-admin-session:
    type: enum
    raw_type: option
    description: Enable/disable allow admin session to be removed by privileged admin users.
    default: enable
  comments:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  email-to:
    type: string
    raw_type: string
    description: This administrator's email address.
    max_length: 63
  force-password-change:
    type: enum
    raw_type: option
    description: Enable/disable force password change on next login.
    default: disable
  fortitoken:
    type: string
    raw_type: string
    description: This administrator's FortiToken serial number.
    max_length: 16
  guest-auth:
    type: enum
    raw_type: option
    description: Enable/disable guest authentication.
    default: disable
  guest-lang:
    type: string
    raw_type: string
    description: Guest management portal language.
    max_length: 35
  guest-usergroups:
    type: string
    raw_type: string
    description: Select guest user groups. Select guest user groups.
    max_length: 79
  ip6-trusthost1:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost10:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost2:
    type: ipv6-prefix
    raw_type: ipv6-prefix
    description: Any IPv6 address from which the administrator can connect to the FortiGate unit. Default allows access from
      any IPv6 address.
    default: ::/0
  ip6-trusthost3:
