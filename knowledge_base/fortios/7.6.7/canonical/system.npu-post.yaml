      terraform:
        type: list
        raw_type: TypeSet
        optional: true
        children: *id002
        source_attribute: port_npu_map.npu_group
    sources:
    - terraform
  port_npu_map.npu_group.group_name:
    canonical:
      type: string
      min_length: 0
      max_length: 15
      source_attribute: port_npu_map.npu_group.group_name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 15
        source_attribute: port_npu_map.npu_group.group_name
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
