id: llm.profile
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  chat:
    canonical:
      type: list
      children: &id001
        status:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        max_completion_tokens:
          type: integer
          raw_type: TypeInt
          optional: true
          min: 0
          max: 10000000
        stream:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        max_req_len:
          type: integer
          raw_type: TypeInt
          optional: true
          computed: true
          min: 0
          max: 65535
        system_prompt_mode:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        system_prompt:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 255
      source_attribute: chat
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        computed: true
        children: *id001
        source_attribute: chat
    sources:
    - terraform
  chat.max_completion_tokens:
    canonical:
      type: integer
      min: 0
      max: 10000000
      source_attribute: chat.max_completion_tokens
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 10000000
        source_attribute: chat.max_completion_tokens
    sources:
    - terraform
  chat.max_req_len:
    canonical:
      type: integer
      min: 0
      max: 65535
      source_attribute: chat.max_req_len
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 0
        max: 65535
        source_attribute: chat.max_req_len
    sources:
    - terraform
  chat.status:
    canonical:
      type: string
      source_attribute: chat.status
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: chat.status
    sources:
    - terraform
  chat.stream:
    canonical:
      type: string
      source_attribute: chat.stream
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: chat.stream
    sources:
    - terraform
  chat.system_prompt:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: chat.system_prompt
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: chat.system_prompt
    sources:
    - terraform
  chat.system_prompt_mode:
    canonical:
      type: string
      source_attribute: chat.system_prompt_mode
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: chat.system_prompt_mode
    sources:
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  image_gen:
    canonical:
      type: list
      children: &id002
        status:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
      source_attribute: image_gen
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        computed: true
        children: *id002
        source_attribute: image_gen
    sources:
    - terraform
  image_gen.status:
    canonical:
      type: string
      source_attribute: image_gen.status
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: image_gen.status
    sources:
    - terraform
  list_models:
    canonical:
      type: list
      children: &id003
        status:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
      source_attribute: list_models
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        computed: true
        children: *id003
        source_attribute: list_models
    sources:
    - terraform
  list_models.status:
    canonical:
      type: string
      source_attribute: list_models.status
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: list_models.status
    sources:
    - terraform
  log:
    canonical:
      type: string
      source_attribute: log
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: log
    sources:
    - terraform
  name:
    canonical:
      type: string
      min_length: 0
      max_length: 35
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
    sources:
    - terraform
  unknown_api:
    canonical:
      type: string
      source_attribute: unknown_api
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: unknown_api
    sources:
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
