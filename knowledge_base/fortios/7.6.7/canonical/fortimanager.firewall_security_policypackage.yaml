id: fortimanager.firewall_security_policypackage
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  adom:
    canonical:
      type: string
      default: root
      source_attribute: adom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: adom
    sources:
    - terraform
  inspection_mode:
    canonical:
      type: enum
      choices: &id001
      - flow
      - proxy
      default: flow
      source_attribute: inspection_mode
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id001
        default: flow
        source_attribute: inspection_mode
    sources:
    - terraform
  name:
    canonical:
      type: string
      required: true
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: name
    sources:
    - terraform
  target:
    canonical:
      type: string
      source_attribute: target
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: target
    sources:
    - terraform
  vdom:
    canonical:
      type: string
      default: root
      source_attribute: vdom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: vdom
    sources:
    - terraform
conflicts: []
