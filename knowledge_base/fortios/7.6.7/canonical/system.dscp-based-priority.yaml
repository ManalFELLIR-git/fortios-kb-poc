      ansible:
        type: integer
        raw_type: integer
        required: true
        version_ranges: *id002
        description: Item ID. see <a href='#notes'>Notes</a>.
        source_attribute: id
      cli_reference:
        type: integer
        raw_type: integer
        description: Item ID.
        default: '0'
        min: 0
        max: 4294967295
        source_attribute: id
