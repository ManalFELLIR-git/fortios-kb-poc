        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        force_new: true
        source_attribute: fosid
    sources:
    - terraform
  id:
    canonical:
      type: integer
      required: true
      version_ranges: &id002
      - - v6.0.0
        - ''
      default: '0'
      min: 0
      max: 4294967295
      description: Item ID.
      source_attribute: id
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
