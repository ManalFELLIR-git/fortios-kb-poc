id: system.dscp-based-priority
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  ds:
    canonical:
      type: integer
      version_ranges: &id001
      - - v6.0.0
        - ''
      default: '0'
      min: 0
      max: 63
      description: DSCP(DiffServ) DS value (0 - 63).
      source_attribute: ds
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id001
        description: DSCP(DiffServ) DS value (0 - 63).
        source_attribute: ds
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 63
        source_attribute: ds
      cli_reference:
        type: integer
        raw_type: integer
        description: DSCP(DiffServ) DS value (0 - 63).
        default: '0'
        min: 0
        max: 63
        source_attribute: ds
    sources:
    - ansible
    - cli_reference
    - terraform
  fosid:
    canonical:
      type: integer
