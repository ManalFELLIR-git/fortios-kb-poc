      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  member:
    canonical:
      type: list
      elements: dict
      children: &id004
        tunnel_name:
          type: string
          raw_type: string
          required: true
          version_ranges: &id007
          - - v6.2.0
            - ''
          description: Tunnel name. Source vpn.ipsec.phase1-interface.name.
          references: &id006
          - vpn.ipsec.phase1-interface.name
