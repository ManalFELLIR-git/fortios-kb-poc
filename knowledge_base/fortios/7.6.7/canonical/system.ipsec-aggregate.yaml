      type: string
      references: *id006
      required: true
      version_ranges: *id007
      min_length: 0
      max_length: 79
      description: Tunnel name. Source vpn.ipsec.phase1-interface.name.
      source_attribute: member.tunnel_name
    canonical_source: merged
    field_sources:
      type: ansible
      references: ansible
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: terraform
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id007
        description: Tunnel name. Source vpn.ipsec.phase1-interface.name.
        references: *id006
        source_attribute: member.tunnel_name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: member.tunnel_name
    sources:
    - ansible
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id008
      - - v6.2.0
        - ''
      min_length: 0
      max_length: 15
      description: IPsec aggregate name.
      source_attribute: name
