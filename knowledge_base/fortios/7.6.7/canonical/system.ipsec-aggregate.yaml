        type: list
        raw_type: list
        elements: dict
        version_ranges: *id003
        description: Member tunnels of the aggregate.
        children: *id004
        source_attribute: member
      terraform:
        type: list
        raw_type: TypeSet
        required: true
        children:
          tunnel_name:
