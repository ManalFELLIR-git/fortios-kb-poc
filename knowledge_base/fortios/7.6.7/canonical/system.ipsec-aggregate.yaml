      - - v6.2.0
        - ''
      choices: &id001
      - L3
      - L4
      - round-robin
      - redundant
      - weighted-round-robin
      default: round-robin
      description: Frame distribution algorithm.
      source_attribute: algorithm
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Frame distribution algorithm.
        source_attribute: algorithm
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: algorithm
      cli_reference:
        type: enum
        raw_type: option
        description: Frame distribution algorithm.
        default: round-robin
        source_attribute: algorithm
    sources:
    - ansible
    - cli_reference
    - terraform
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
