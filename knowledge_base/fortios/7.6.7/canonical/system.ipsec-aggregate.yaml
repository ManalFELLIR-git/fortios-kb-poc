            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 79
        source_attribute: member
      cli_reference:
        type: string
        raw_type: string
        description: Member tunnels of the aggregate. Tunnel name.
        max_length: 79
        source_attribute: member
    sources:
    - ansible
    - cli_reference
    - terraform
    resolution:
      type:
        resolution: compatible_representation
        semantic_type: &id005
          element_type: string
          cardinality: multiple
        confidence: high
    semantic_type: *id005
  member.tunnel_name:
