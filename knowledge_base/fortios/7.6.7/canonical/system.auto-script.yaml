id: system.auto-script
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  interval:
    canonical:
      type: integer
      version_ranges: &id001
      - - v6.0.0
        - ''
      default: '0'
      min: 0
      max: 31557600
      description: Repeat interval in seconds.
      source_attribute: interval
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id001
        description: Repeat interval in seconds.
        source_attribute: interval
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 31557600
        source_attribute: interval
      cli_reference:
        type: integer
        raw_type: integer
        description: Repeat interval in seconds.
        default: '0'
        min: 0
        max: 31557600
        source_attribute: interval
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id002
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Auto script name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id002
        description: Auto script name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Auto script name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  output_size:
    canonical:
      type: integer
      version_ranges: &id003
      - - v6.0.0
        - ''
      default: '10'
      min: 10
      max: 1024
      description: Number of megabytes to limit script output to (10 - 1024, default = 10).
      source_attribute: output-size
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id003
        description: Number of megabytes to limit script output to (10 - 1024).
        source_attribute: output_size
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 10
        max: 1024
        source_attribute: output_size
      cli_reference:
        type: integer
        raw_type: integer
        description: Number of megabytes to limit script output to (10 - 1024, default = 10).
        default: '10'
        min: 10
        max: 1024
        source_attribute: output-size
    sources:
    - ansible
    - cli_reference
    - terraform
  repeat:
    canonical:
      type: integer
      version_ranges: &id004
      - - v6.0.0
        - ''
      default: '1'
      min: 0
      max: 65535
      description: Number of times to repeat this script (0 = infinite).
      source_attribute: repeat
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id004
        description: Number of times to repeat this script (0 = infinite).
        source_attribute: repeat
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 0
        max: 65535
        source_attribute: repeat
      cli_reference:
        type: integer
        raw_type: integer
        description: Number of times to repeat this script (0 = infinite).
        default: '1'
        min: 0
        max: 65535
        source_attribute: repeat
    sources:
    - ansible
    - cli_reference
    - terraform
  script:
    canonical:
      type: string
      version_ranges: &id005
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 1023
      description: List of FortiOS CLI commands to repeat.
      source_attribute: script
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id005
        description: List of FortiOS CLI commands to repeat.
        source_attribute: script
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 1023
        source_attribute: script
      cli_reference:
        type: string
        raw_type: var-string
        description: List of FortiOS CLI commands to repeat.
        max_length: 1023
        source_attribute: script
    sources:
    - ansible
    - cli_reference
    - terraform
  start:
    canonical:
      type: enum
      version_ranges: &id007
      - - v6.0.0
        - ''
      choices: &id006
      - manual
      - auto
      default: manual
      description: Script starting mode.
      source_attribute: start
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id006
        version_ranges: *id007
        description: Script starting mode.
        source_attribute: start
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: start
      cli_reference:
        type: enum
        raw_type: option
        description: Script starting mode.
        default: manual
        source_attribute: start
    sources:
    - ansible
    - cli_reference
    - terraform
  timeout:
    canonical:
      type: integer
      version_ranges: &id008
      - - v6.4.0
        - ''
      default: '0'
      min: 0
      max: 300
      description: Maximum running time for this script in seconds (0 = no timeout).
      source_attribute: timeout
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id008
        description: Maximum running time for this script in seconds (0 = no timeout).
        source_attribute: timeout
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 300
        source_attribute: timeout
      cli_reference:
        type: integer
        raw_type: integer
        description: Maximum running time for this script in seconds (0 = no timeout).
        default: '0'
        min: 0
        max: 300
        source_attribute: timeout
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
