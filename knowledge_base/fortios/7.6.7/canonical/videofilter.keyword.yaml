id: videofilter.keyword
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  comment:
    canonical:
      type: string
      version_ranges: &id001
      - - v7.4.2
        - ''
      min_length: 0
      max_length: 255
      description: Comment.
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Comment.
        source_attribute: comment
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comment
      cli_reference:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
        source_attribute: comment
    sources:
    - ansible
    - cli_reference
    - terraform
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  fosid:
    canonical:
      type: integer
      source_attribute: fosid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        force_new: true
        source_attribute: fosid
    sources:
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  id:
    canonical:
      type: integer
      required: true
      version_ranges: &id002
      - - v7.4.2
        - ''
      default: '0'
      min: 0
      max: 4294967295
      description: ID.
      source_attribute: id
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        required: true
        version_ranges: *id002
        description: ID. see <a href='#notes'>Notes</a>.
        source_attribute: id
      cli_reference:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
        source_attribute: id
    sources:
    - ansible
    - cli_reference
  match:
    canonical:
      type: enum
      version_ranges: &id004
      - - v7.4.2
        - ''
      choices: &id003
      - or
      - and
      default: or
      description: Keyword matching logic.
      source_attribute: match
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id003
        version_ranges: *id004
        description: Keyword matching logic.
        source_attribute: match
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: match
      cli_reference:
        type: enum
        raw_type: option
        description: Keyword matching logic.
        default: or
        source_attribute: match
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      version_ranges: &id005
      - - v7.4.2
        - ''
      min_length: 0
      max_length: 35
      description: Name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id005
        description: Name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
  word:
    canonical:
      type: list
      elements: dict
      children: &id007
        name:
          type: string
          raw_type: string
          required: true
          version_ranges: &id009
          - - v7.4.2
            - ''
          description: Name.
        comment:
          type: string
          raw_type: string
          version_ranges: &id008
          - - v7.4.2
            - ''
          description: Comment.
        pattern_type:
          type: enum
          raw_type: string
          choices: &id011
          - wildcard
          - regex
          version_ranges: &id010
          - - v7.4.2
            - ''
          description: Pattern type.
        status:
          type: enum
          raw_type: string
          choices: &id013
          - enable
          - disable
          version_ranges: &id012
          - - v7.4.2
            - ''
          description: Enable(consider)/disable(ignore) this keyword.
      version_ranges: &id006
      - - v7.4.2
        - ''
      description: List of keywords.
      source_attribute: word
    canonical_source: merged
    field_sources:
      type: ansible
      elements: ansible
      children: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: list
        raw_type: list
        elements: dict
        version_ranges: *id006
        description: List of keywords.
        children: *id007
        source_attribute: word
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        children:
          name:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 79
          comment:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 255
          pattern_type:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          status:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
        source_attribute: word
    sources:
    - ansible
    - terraform
  word.comment:
    canonical:
      type: string
      version_ranges: *id008
      min_length: 0
      max_length: 255
      description: Comment.
      source_attribute: word.comment
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: terraform
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id008
        description: Comment.
        source_attribute: word.comment
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: word.comment
    sources:
    - ansible
    - terraform
  word.name:
    canonical:
      type: string
      required: true
      version_ranges: *id009
      min_length: 0
      max_length: 79
      description: Name.
      source_attribute: word.name
    canonical_source: merged
    field_sources:
      type: ansible
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: terraform
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id009
        description: Name.
        source_attribute: word.name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: word.name
    sources:
    - ansible
    - terraform
  word.pattern_type:
    canonical:
      type: enum
      version_ranges: *id010
      choices: *id011
      description: Pattern type.
      source_attribute: word.pattern_type
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id011
        version_ranges: *id010
        description: Pattern type.
        source_attribute: word.pattern_type
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: word.pattern_type
    sources:
    - ansible
    - terraform
  word.status:
    canonical:
      type: enum
      version_ranges: *id012
      choices: *id013
      description: Enable(consider)/disable(ignore) this keyword.
      source_attribute: word.status
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id013
        version_ranges: *id012
        description: Enable(consider)/disable(ignore) this keyword.
        source_attribute: word.status
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: word.status
    sources:
