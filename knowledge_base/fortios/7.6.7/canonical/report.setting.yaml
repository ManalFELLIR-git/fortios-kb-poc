id: report.setting
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  fortiview:
    canonical:
      type: enum
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - enable
      - disable
      default: enable **
      description: Enable/disable historical FortiView.
      source_attribute: fortiview
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Enable/disable historical FortiView.
        source_attribute: fortiview
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fortiview
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable historical FortiView.
        default: enable **
        source_attribute: fortiview
    sources:
    - ansible
    - cli_reference
    - terraform
  pdf_report:
    canonical:
      type: enum
      version_ranges: &id004
      - - v6.0.0
        - ''
      choices: &id003
      - enable
      - disable
      default: enable **
      description: Enable/disable PDF report.
      source_attribute: pdf-report
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id003
        version_ranges: *id004
        description: Enable/disable PDF report.
        source_attribute: pdf_report
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: pdf_report
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable PDF report.
        default: enable **
        source_attribute: pdf-report
    sources:
    - ansible
    - cli_reference
    - terraform
  report_source:
    canonical:
      type: enum
      elements: str
      version_ranges: &id006
      - - v6.0.0
        - ''
      choices: &id005
      - forward-traffic
      - sniffer-traffic
      - local-deny-traffic
      default: forward-traffic
      description: Report log source.
      source_attribute: report-source
    canonical_source: merged
    field_sources:
      type: cli_reference
      elements: ansible
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: list
        choices: *id005
        multiple_values: true
        elements: str
        version_ranges: *id006
        description: Report log source.
        source_attribute: report_source
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: report_source
      cli_reference:
        type: enum
        raw_type: option
        description: Report log source.
        default: forward-traffic
        source_attribute: report-source
    sources:
    - ansible
    - cli_reference
    - terraform
  top_n:
    canonical:
      type: integer
      version_ranges: &id007
      - - v6.0.0
        - ''
      default: '1000'
      min: 1000
      max: 20000
      description: Number of items to populate (1000 - 20000).
      source_attribute: top-n
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id007
        description: Number of items to populate (1000 - 20000).
        source_attribute: top_n
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 100
        max: 20000
        source_attribute: top_n
      cli_reference:
        type: integer
        raw_type: integer
        description: Number of items to populate (1000 - 20000).
        default: '1000'
        min: 1000
        max: 20000
        source_attribute: top-n
    sources:
    - ansible
    - cli_reference
    - terraform
    resolution:
      range:
        min:
          resolution: terraform_constraint_mismatch
          status: resolved
          confidence: high
          canonical_policy: prefer_exact_version_cli_range
          special_values: []
          requires_hardware_overlay: false
          requires_runtime_validation: false
          ansible_ranges_detected:
          - - '1000'
            - '20000'
          cli_ranges_detected:
          - - '1000'
            - '20000'
          cli_units: []
          ansible_units: []
          cli_internal_inconsistency: false
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
  web_browsing_threshold:
    canonical:
      type: integer
      version_ranges: &id008
      - - v6.0.0
        - ''
      default: '3'
      min: 3
      max: 15
      description: Web browsing time calculation threshold (3 - 15 min).
      source_attribute: web-browsing-threshold
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id008
        description: Web browsing time calculation threshold (3 - 15 min).
        source_attribute: web_browsing_threshold
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 3
        max: 15
        source_attribute: web_browsing_threshold
      cli_reference:
        type: integer
        raw_type: integer
        description: Web browsing time calculation threshold (3 - 15 min).
        default: '3'
        min: 3
        max: 15
        source_attribute: web-browsing-threshold
    sources:
    - ansible
    - cli_reference
    - terraform
conflicts: []
