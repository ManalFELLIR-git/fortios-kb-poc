id: log.customformat
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  empty_value_indicator:
    canonical:
      type: string
      min_length: 0
      max_length: 1
      source_attribute: empty_value_indicator
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 1
        source_attribute: empty_value_indicator
    sources:
    - terraform
  field_exclusion_list:
    canonical:
      type: list
      children: &id001
        field:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 79
      source_attribute: field_exclusion_list
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeSet
        optional: true
        children: *id001
        source_attribute: field_exclusion_list
    sources:
    - terraform
  field_exclusion_list.field:
    canonical:
      type: string
      min_length: 0
      max_length: 79
      source_attribute: field_exclusion_list.field
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: field_exclusion_list.field
    sources:
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  log_templates:
    canonical:
      type: list
      children: &id002
        name:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 35
        category:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        subtypes:
          type: list
          raw_type: TypeSet
          optional: true
          children: &id003
            subtype:
              type: string
              raw_type: TypeString
              optional: true
              min_length: 0
              max_length: 79
        template:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 2047
      source_attribute: log_templates
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        children: *id002
        source_attribute: log_templates
    sources:
    - terraform
  log_templates.category:
    canonical:
      type: string
      source_attribute: log_templates.category
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: log_templates.category
    sources:
    - terraform
  log_templates.name:
    canonical:
      type: string
      min_length: 0
      max_length: 35
      source_attribute: log_templates.name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 35
        source_attribute: log_templates.name
    sources:
    - terraform
  log_templates.subtypes:
    canonical:
      type: list
      children: *id003
      source_attribute: log_templates.subtypes
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeSet
        optional: true
        children: *id003
        source_attribute: log_templates.subtypes
    sources:
    - terraform
  log_templates.subtypes.subtype:
    canonical:
      type: string
      min_length: 0
      max_length: 79
      source_attribute: log_templates.subtypes.subtype
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: log_templates.subtypes.subtype
    sources:
    - terraform
  log_templates.template:
    canonical:
      type: string
      min_length: 0
      max_length: 2047
      source_attribute: log_templates.template
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 2047
        source_attribute: log_templates.template
    sources:
    - terraform
  name:
    canonical:
      type: string
      min_length: 0
      max_length: 35
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
    sources:
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
