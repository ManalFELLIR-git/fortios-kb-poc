id: log.custom-field
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  fabric_force_sync:
    canonical:
      type: string
      source_attribute: fabric_force_sync
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_force_sync
    sources:
    - terraform
  fabric_object:
    canonical:
      type: string
      source_attribute: fabric_object
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_object
    sources:
    - terraform
  fabric_object_source:
    canonical:
      type: string
      source_attribute: fabric_object_source
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_object_source
    sources:
    - terraform
  fosid:
    canonical:
      type: string
      min_length: 0
      max_length: 35
      source_attribute: fosid
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: fosid
    sources:
    - terraform
  id:
    canonical:
      type: string
      required: true
      version_ranges: &id001
      - - v6.0.0
        - ''
      max_length: 35
      description: Field ID string.
      source_attribute: id
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id001
        description: Field ID string.
        source_attribute: id
      cli_reference:
        type: string
        raw_type: string
        description: Field ID string.
        max_length: 35
        source_attribute: id
    sources:
    - ansible
    - cli_reference
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id002
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 15
      description: 'Field name (max: 15 characters).'
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: terraform
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id002
        description: 'Field name (max: 15 characters).'
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        min_length: 0
        max_length: 15
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: 'Field name (max: 15 characters).'
        max_length: 15
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  uuid:
    canonical:
      type: string
      source_attribute: uuid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: uuid
    sources:
    - terraform
  value:
    canonical:
      type: string
      required: true
      version_ranges: &id003
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 15
      description: 'Field value (max: 15 characters).'
      source_attribute: value
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: terraform
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id003
        description: 'Field value (max: 15 characters).'
        source_attribute: value
      terraform:
        type: string
        raw_type: TypeString
        required: true
        min_length: 0
        max_length: 15
        source_attribute: value
      cli_reference:
        type: string
        raw_type: string
        description: 'Field value (max: 15 characters).'
        max_length: 15
        source_attribute: value
    sources:
    - ansible
    - cli_reference
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
