id: fortimanager.devicemanager_installpackage
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  adom:
    canonical:
      type: string
      default: root
      source_attribute: adom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: adom
    sources:
    - terraform
  package_name:
    canonical:
      type: string
      required: true
      source_attribute: package_name
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: package_name
    sources:
    - terraform
  timeout:
    canonical:
      type: integer
      default: 3
      source_attribute: timeout
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        default: 3
        source_attribute: timeout
    sources:
    - terraform
conflicts: []
