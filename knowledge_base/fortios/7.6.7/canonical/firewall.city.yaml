id: firewall.city
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: true
attributes_flat:
  fosid:
    canonical:
      type: integer
      min: 0
      max: 65535
      source_attribute: fosid
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 65535
        source_attribute: fosid
    sources:
    - terraform
  id:
    canonical:
      type: integer
      default: '0'
      min: 0
      max: 65535
      description: City ID.
      source_attribute: id
    canonical_source: merged
    field_sources:
      type: cli_reference
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      cli_reference:
        type: integer
        raw_type: integer
        description: City ID.
        default: '0'
        min: 0
        max: 65535
        source_attribute: id
    sources:
    - cli_reference
  name:
    canonical:
      type: string
      min_length: 0
      max_length: 63
      description: City name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 63
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: City name.
        max_length: 63
        source_attribute: name
    sources:
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
