id: videofilter.youtubechannelfilter
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  comment:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comment
    sources:
    - terraform
  default_action:
    canonical:
      type: string
      source_attribute: default_action
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: default_action
    sources:
    - terraform
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  entries:
    canonical:
      type: list
      children: &id001
        id:
          type: integer
          raw_type: TypeInt
          optional: true
        comment:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 255
        action:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        channel_id:
          type: string
          raw_type: TypeString
          optional: true
          min_length: 0
          max_length: 255
      source_attribute: entries
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        children: *id001
        source_attribute: entries
    sources:
    - terraform
  entries.action:
    canonical:
      type: string
      source_attribute: entries.action
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: entries.action
    sources:
    - terraform
  entries.channel_id:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: entries.channel_id
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: entries.channel_id
    sources:
    - terraform
  entries.comment:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: entries.comment
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: entries.comment
    sources:
    - terraform
  entries.id:
    canonical:
      type: integer
      source_attribute: entries.id
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: entries.id
    sources:
    - terraform
  fosid:
    canonical:
      type: integer
      source_attribute: fosid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        force_new: true
        source_attribute: fosid
    sources:
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
