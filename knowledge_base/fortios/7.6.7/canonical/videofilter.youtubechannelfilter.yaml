    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 35
        source_attribute: name
    sources:
    - terraform
  override_category:
    canonical:
      type: string
      source_attribute: override_category
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: override_category
    sources:
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
