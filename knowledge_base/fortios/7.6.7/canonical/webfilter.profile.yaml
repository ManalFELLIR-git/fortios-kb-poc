              raw_type: string
              choices: &id019
              - regex
              - literal
              version_ranges: &id018
              - - v7.0.0
                - ''
              description: Pattern will be treated either as a regex pattern or literal string.
        authentication:
          type: enum
          raw_type: string
          choices: &id005
          - domain-controller
          - ldap
          version_ranges: &id004
          - - v7.0.0
            - ''
          description: Authentication methods.
        domain_controller:
          type: string
          raw_type: string
          version_ranges: &id023
          - - v6.4.0
            - ''
          description: Domain for which to verify received credentials against. Source user.domain-controller.name credential-store.domain-controller
            .server-name.
          references: &id022
          - user.domain-controller.name
        ldap:
          type: string
          raw_type: string
          version_ranges: &id033
          - - v7.0.0
            - ''
