              raw_type: string
              required: true
              version_ranges: &id031
              - - v6.4.0
                - ''
              description: Inspection target name.
            fortiguard_category:
              type: list
              raw_type: list
              multiple_values: true
              elements: str
              version_ranges: &id029
              - - v6.4.0
                - ''
              description: FortiGuard category to match.
            action:
              type: enum
              raw_type: string
              choices: &id028
              - exempt
              - log
              - block
              version_ranges: &id027
              - - v6.4.0
                - ''
              description: Action to be taken upon an AntiPhishing match.
        custom_patterns:
          type: list
          raw_type: list
          elements: dict
          version_ranges: &id013
          - - v6.4.0
            - ''
          description: Custom username and password regex patterns.
          children: &id012
            pattern:
              type: string
              raw_type: string
              required: true
              version_ranges: &id017
              - - v6.4.0
                - ''
