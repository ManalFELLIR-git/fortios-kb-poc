id: cifs.domaincontroller
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  domain_name:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: domain_name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: domain_name
    sources:
    - terraform
  ip:
    canonical:
      type: string
      source_attribute: ip
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: ip
    sources:
    - terraform
  ip6:
    canonical:
      type: string
      source_attribute: ip6
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: ip6
    sources:
    - terraform
  password:
    canonical:
      type: string
      min_length: 0
      max_length: 128
      source_attribute: password
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 128
        source_attribute: password
    sources:
    - terraform
  port:
    canonical:
      type: integer
      min: 0
      max: 65535
      source_attribute: port
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 65535
        source_attribute: port
    sources:
    - terraform
  server_name:
    canonical:
      type: string
      min_length: 0
      max_length: 255
      source_attribute: server_name
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 255
        source_attribute: server_name
    sources:
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  username:
    canonical:
      type: string
      min_length: 0
      max_length: 64
      source_attribute: username
