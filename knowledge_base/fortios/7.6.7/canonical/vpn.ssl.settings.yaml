id: vpn.ssl.settings
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  algorithm:
    canonical:
      type: enum
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - high
      - medium
      - default
      - low
      default: high
      description: Force the Agentless VPN security level. High allows only high. Medium allows medium and high. Low allows
        any.
      source_attribute: algorithm
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
