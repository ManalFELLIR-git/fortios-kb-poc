        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Force the Agentless VPN security level. High allows only high. Medium allows medium and high. Low allows
          any.
        source_attribute: algorithm
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: algorithm
      cli_reference:
        type: enum
        raw_type: option
        description: Force the Agentless VPN security level. High allows only high. Medium allows medium and high. Low allows
          any.
        default: high
        source_attribute: algorithm
    sources:
    - ansible
    - cli_reference
    - terraform
  auth_session_check_source_ip:
    canonical:
      type: enum
