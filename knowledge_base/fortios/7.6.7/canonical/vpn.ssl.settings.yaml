      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: auth_session_check_source_ip
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable checking of source IP for authentication session.
        default: enable
        source_attribute: auth-session-check-source-ip
    sources:
    - ansible
    - cli_reference
    - terraform
  auth_timeout:
    canonical:
