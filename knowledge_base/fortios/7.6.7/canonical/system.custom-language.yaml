id: system.custom-language
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  comments:
    canonical:
      type: string
      version_ranges: &id001
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 255
      description: Comment.
      source_attribute: comments
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Comment.
        source_attribute: comments
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comments
      cli_reference:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
        source_attribute: comments
    sources:
    - ansible
    - cli_reference
    - terraform
  filename:
    canonical:
      type: string
      required: true
      version_ranges: &id002
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 63
      description: Custom language file path.
      source_attribute: filename
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: terraform
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id002
        description: Custom language file path.
        source_attribute: filename
      terraform:
        type: string
        raw_type: TypeString
        required: true
        min_length: 0
        max_length: 63
        source_attribute: filename
      cli_reference:
        type: string
        raw_type: string
        description: Custom language file path.
        max_length: 63
        source_attribute: filename
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id003
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id003
        description: Name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
