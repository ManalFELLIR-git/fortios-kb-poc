id: spamfilter.options
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  dns_timeout:
    canonical:
      type: integer
      min: 1
      max: 30
      source_attribute: dns_timeout
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 1
        max: 30
        source_attribute: dns_timeout
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
