id: dlp.profile
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  comment:
    canonical:
      type: string
      version_ranges: &id001
      - - v7.2.0
        - ''
      min_length: 0
      max_length: 255
      description: Comment.
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Comment.
        source_attribute: comment
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comment
      cli_reference:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
        source_attribute: comment
    sources:
    - ansible
    - cli_reference
    - terraform
  dlp_log:
    canonical:
      type: enum
      version_ranges: &id003
      - - v7.2.0
        - ''
      choices: &id002
      - enable
      - disable
      default: enable
      description: Enable/disable DLP logging.
      source_attribute: dlp-log
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id002
        version_ranges: *id003
        description: Enable/disable DLP logging.
        source_attribute: dlp_log
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: dlp_log
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable DLP logging.
        default: enable
        source_attribute: dlp-log
    sources:
    - ansible
    - cli_reference
    - terraform
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  extended_log:
    canonical:
      type: enum
      version_ranges: &id005
      - - v7.2.0
        - ''
      choices: &id004
      - enable
      - disable
      default: disable
      description: Enable/disable extended logging for data loss prevention.
      source_attribute: extended-log
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id004
        version_ranges: *id005
        description: Enable/disable extended logging for data loss prevention.
        source_attribute: extended_log
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: extended_log
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable extended logging for data loss prevention.
        default: disable
        source_attribute: extended-log
    sources:
    - ansible
    - cli_reference
    - terraform
  fabric_force_sync:
    canonical:
      type: string
      source_attribute: fabric_force_sync
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_force_sync
    sources:
    - terraform
  fabric_object:
    canonical:
      type: string
      source_attribute: fabric_object
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_object
    sources:
    - terraform
  fabric_object_source:
    canonical:
      type: string
      source_attribute: fabric_object_source
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fabric_object_source
    sources:
    - terraform
  feature_set:
    canonical:
      type: enum
      version_ranges: &id007
      - - v7.2.0
        - ''
      choices: &id006
      - flow
      - proxy
      default: flow
      description: Flow/proxy feature set.
      source_attribute: feature-set
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id006
        version_ranges: *id007
        description: Flow/proxy feature set.
        source_attribute: feature_set
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: feature_set
      cli_reference:
        type: enum
        raw_type: option
        description: Flow/proxy feature set.
        default: flow
        source_attribute: feature-set
    sources:
    - ansible
    - cli_reference
    - terraform
  fortidata_error_action:
    canonical:
      type: enum
      version_ranges: &id009
      - - v7.6.4
        - ''
      choices: &id008
      - log-only
      - block
      - ignore
      default: block
      description: Action to take if FortiData query fails.
      source_attribute: fortidata-error-action
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id008
        version_ranges: *id009
        description: Action to take if FortiData query fails.
        source_attribute: fortidata_error_action
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: fortidata_error_action
      cli_reference:
        type: enum
        raw_type: option
        description: Action to take if FortiData query fails.
        default: block
        source_attribute: fortidata-error-action
    sources:
    - ansible
    - cli_reference
    - terraform
  fortidata_scan_timeout:
    canonical:
      type: integer
      min: 10
      max: 30
      source_attribute: fortidata_scan_timeout
    canonical_source: merged
    field_sources:
      type: terraform
      min: terraform
      max: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 10
        max: 30
        source_attribute: fortidata_scan_timeout
    sources:
    - terraform
  full_archive_proto:
    canonical:
      type: enum
      elements: str
      version_ranges: &id011
      - - v7.2.0
        - ''
      choices: &id010
      - smtp
      - pop3
      - imap
      - http-get
      - http-post
      - ftp
      - nntp
      - mapi
      - ssh
      - cifs
      - websocket
      description: Protocols to always content archive.
      source_attribute: full-archive-proto
    canonical_source: merged
    field_sources:
      type: cli_reference
      elements: ansible
      version_ranges: ansible
      choices: ansible
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: list
        choices: *id010
        multiple_values: true
        elements: str
        version_ranges: *id011
        description: Protocols to always content archive.
        source_attribute: full_archive_proto
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: full_archive_proto
      cli_reference:
        type: enum
        raw_type: option
        description: Protocols to always content archive.
        source_attribute: full-archive-proto
    sources:
    - ansible
    - cli_reference
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  nac_quar_log:
    canonical:
      type: enum
      version_ranges: &id013
      - - v7.2.0
        - ''
      choices: &id012
      - enable
      - disable
      default: disable
      description: Enable/disable NAC quarantine logging.
      source_attribute: nac-quar-log
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id012
        version_ranges: *id013
        description: Enable/disable NAC quarantine logging.
        source_attribute: nac_quar_log
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: nac_quar_log
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable NAC quarantine logging.
        default: disable
        source_attribute: nac-quar-log
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id014
      - - v7.2.0
        - ''
      min_length: 0
      max_length: 47
      description: Name of the DLP profile.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id014
        description: Name of the DLP profile.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 47
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Name of the DLP profile.
        max_length: 47
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  replacemsg_group:
    canonical:
      type: string
      references: &id016
      - system.replacemsg-group.name
      version_ranges: &id015
      - - v7.2.0
        - ''
      min_length: 0
      max_length: 35
      description: Replacement message group used by this DLP profile.
      source_attribute: replacemsg-group
    canonical_source: merged
    field_sources:
      type: cli_reference
      references: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id015
        description: Replacement message group used by this DLP profile. Source system.replacemsg-group.name.
        references: *id016
        source_attribute: replacemsg_group
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 35
        source_attribute: replacemsg_group
      cli_reference:
        type: string
        raw_type: string
        description: Replacement message group used by this DLP profile.
        max_length: 35
        source_attribute: replacemsg-group
    sources:
    - ansible
    - cli_reference
    - terraform
  rule:
    canonical:
      type: list
      elements: dict
      children: &id018
        id:
          type: integer
          raw_type: integer
          required: true
          version_ranges: &id029
          - - v7.2.0
            - ''
          description: ID. see <a href='#notes'>Notes</a>.
        name:
          type: string
          raw_type: string
          version_ranges: &id033
          - - v7.2.0
            - ''
          description: Filter name.
        severity:
          type: enum
          raw_type: string
          choices: &id047
          - info
          - low
          - medium
          - high
          - critical
          version_ranges: &id046
          - - v7.2.0
            - ''
          description: Select the severity or threat level that matches this filter.
        type:
          type: enum
          raw_type: string
          choices: &id049
          - file
          - fos_message
          version_ranges: &id048
          - - v7.2.0
            - ''
          description: Select whether to check the content of messages (an email message) or files (downloaded files or email
            attachments).
        proto:
          type: enum
          raw_type: list
          choices: &id035
          - smtp
          - pop3
          - imap
          - http-get
          - http-post
          - ftp
          - nntp
          - mapi
          - ssh
          - cifs
          - websocket
          multiple_values: true
          elements: str
          version_ranges: &id034
          - - v7.2.0
            - ''
          description: Check messages or files over one or more of these protocols.
        filter_by:
          type: enum
          raw_type: string
          choices: &id028
          - sensor
          - label
          - fingerprint
          - encrypted
          - none
          version_ranges: &id027
          - - v7.2.0
            - ''
          description: Select the type of content to match.
        file_size:
          type: integer
          raw_type: integer
          version_ranges: &id024
          - - v7.2.0
            - ''
          description: Match files greater than or equal to this size (KB).
        sensitivity:
          type: list
          raw_type: list
          elements: dict
          version_ranges: &id037
          - - v7.2.0
            - v7.4.1
          - - v7.4.3
            - ''
          description: Select a DLP file pattern sensitivity to match.
          children: &id036
            name:
              type: string
              raw_type: string
              required: true
              version_ranges: &id040
              - - v7.2.0
                - ''
              description: Select a DLP sensitivity. Source dlp.sensitivity.name.
              references: &id039
              - dlp.sensitivity.name
        match_percentage:
          type: integer
          raw_type: integer
          version_ranges: &id032
          - - v7.2.0
            - v7.4.1
          - - v7.4.3
            - ''
          description: Percentage of fingerprints in the fingerprint databases designated with the selected sensitivity to
            match.
        file_type:
          type: integer
          raw_type: integer
          version_ranges: &id026
          - - v7.2.0
            - ''
          description: Select the number of a DLP file pattern table to match. Source dlp.filepattern.id.
          references: &id025
          - dlp.filepattern.id
        sensor:
          type: list
          raw_type: list
          elements: dict
          version_ranges: &id042
          - - v7.2.0
            - ''
          description: Select DLP sensors.
          children: &id041
            name:
              type: string
              raw_type: string
              required: true
              version_ranges: &id045
              - - v7.2.0
                - ''
              description: Sensor name. Source dlp.sensor.name.
              references: &id044
              - dlp.sensor.name
        label:
          type: string
          raw_type: string
          version_ranges: &id031
          - - v7.2.0
            - ''
          description: Select DLP label. Source dlp.label.name.
          references: &id030
          - dlp.label.name
        archive:
          type: enum
          raw_type: string
          choices: &id022
          - disable
          - enable
          version_ranges: &id021
          - - v7.2.0
            - ''
          description: Enable/disable DLP archiving.
        action:
          type: enum
          raw_type: string
          choices: &id020
          - allow
          - log-only
          - block
          - quarantine-ip
          version_ranges: &id019
          - - v7.2.0
            - ''
          description: Action to take with content that this DLP profile matches.
        expiry:
          type: string
          raw_type: string
          version_ranges: &id023
          - - v7.2.0
            - ''
          description: Quarantine duration in days, hours, minutes (format = dddhhmm).
      version_ranges: &id017
      - - v7.2.0
        - ''
      description: Set up DLP rules for this profile.
      source_attribute: rule
    canonical_source: merged
    field_sources:
      type: ansible
      elements: ansible
      children: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: list
        raw_type: list
        elements: dict
        version_ranges: *id017
        description: Set up DLP rules for this profile.
        children: *id018
        source_attribute: rule
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        children:
          id:
            type: integer
            raw_type: TypeInt
            optional: true
            computed: true
          name:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 35
          severity:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          type:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          proto:
            type: string
            raw_type: TypeString
            optional: true
          filter_by:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          file_size:
            type: integer
            raw_type: TypeInt
            optional: true
          sensitivity:
            type: list
            raw_type: TypeSet
            optional: true
            children: &id038
              name:
                type: string
                raw_type: TypeString
                optional: true
                min_length: 0
                max_length: 35
          match_percentage:
            type: integer
            raw_type: TypeInt
            optional: true
            computed: true
            min: 1
            max: 100
          file_type:
            type: integer
            raw_type: TypeInt
            optional: true
          sensor:
            type: list
            raw_type: TypeSet
            optional: true
            children: &id043
              name:
                type: string
                raw_type: TypeString
                optional: true
                min_length: 0
                max_length: 35
          label:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 35
          archive:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          action:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          expiry:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
        source_attribute: rule
    sources:
    - ansible
    - terraform
  rule.action:
    canonical:
      type: enum
      version_ranges: *id019
      choices: *id020
      description: Action to take with content that this DLP profile matches.
      source_attribute: rule.action
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id020
        version_ranges: *id019
        description: Action to take with content that this DLP profile matches.
        source_attribute: rule.action
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: rule.action
    sources:
    - ansible
    - terraform
  rule.archive:
    canonical:
      type: enum
      version_ranges: *id021
      choices: *id022
      description: Enable/disable DLP archiving.
      source_attribute: rule.archive
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id022
        version_ranges: *id021
        description: Enable/disable DLP archiving.
        source_attribute: rule.archive
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: rule.archive
    sources:
    - ansible
    - terraform
  rule.expiry:
    canonical:
      type: string
      version_ranges: *id023
      description: Quarantine duration in days, hours, minutes (format = dddhhmm).
      source_attribute: rule.expiry
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id023
        description: Quarantine duration in days, hours, minutes (format = dddhhmm).
        source_attribute: rule.expiry
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: rule.expiry
    sources:
    - ansible
    - terraform
  rule.file_size:
    canonical:
      type: integer
      version_ranges: *id024
      description: Match files greater than or equal to this size (KB).
      source_attribute: rule.file_size
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id024
        description: Match files greater than or equal to this size (KB).
        source_attribute: rule.file_size
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: rule.file_size
    sources:
    - ansible
    - terraform
  rule.file_type:
    canonical:
      type: integer
      references: *id025
      version_ranges: *id026
      description: Select the number of a DLP file pattern table to match. Source dlp.filepattern.id.
      source_attribute: rule.file_type
    canonical_source: merged
    field_sources:
      type: ansible
      references: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id026
        description: Select the number of a DLP file pattern table to match. Source dlp.filepattern.id.
        references: *id025
        source_attribute: rule.file_type
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: rule.file_type
    sources:
    - ansible
    - terraform
  rule.filter_by:
    canonical:
      type: enum
      version_ranges: *id027
      choices: *id028
      description: Select the type of content to match.
      source_attribute: rule.filter_by
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id028
        version_ranges: *id027
        description: Select the type of content to match.
        source_attribute: rule.filter_by
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: rule.filter_by
    sources:
    - ansible
    - terraform
  rule.id:
    canonical:
      type: integer
