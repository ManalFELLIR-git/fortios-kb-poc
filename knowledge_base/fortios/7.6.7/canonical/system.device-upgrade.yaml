        type: string
        raw_type: string
        version_ranges: *id023
        description: Limit upgrade to this virtual domain (VDOM). Source system.vdom.name.
        references: *id024
        source_attribute: vdom
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 31
        source_attribute: vdom
      cli_reference:
        type: string
        raw_type: string
        description: Limit upgrade to this virtual domain (VDOM).
        max_length: 31
        source_attribute: vdom
