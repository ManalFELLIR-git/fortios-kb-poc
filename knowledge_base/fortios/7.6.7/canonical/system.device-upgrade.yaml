  upgrade_path:
    canonical:
      type: string
      version_ranges: &id022
      - - v7.2.4
        - ''
      description: Fortinet OS image versions to upgrade through in major-minor-patch format, such as 7-0-4.
      source_attribute: upgrade-path
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id022
        description: Fortinet OS image versions to upgrade through in major-minor-patch format, such as 7-0-4.
        source_attribute: upgrade_path
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: upgrade_path
      cli_reference:
        type: string
        raw_type: user
        description: Fortinet OS image versions to upgrade through in major-minor-patch format, such as 7-0-4.
        source_attribute: upgrade-path
    sources:
    - ansible
    - cli_reference
    - terraform
  vdom:
