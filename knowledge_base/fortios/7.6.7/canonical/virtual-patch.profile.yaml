      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id019
        description: Profile name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 47
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Profile name.
        max_length: 47
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  severity:
    canonical:
      type: enum
      elements: str
      version_ranges: &id021
      - - v7.4.1
        - ''
      choices: &id020
      - info
      - low
      - medium
      - high
      - critical
      default: info low medium high critical
      description: Relative severity of the signature (low, medium, high, critical).
      source_attribute: severity
    canonical_source: merged
    field_sources:
      type: cli_reference
      elements: ansible
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: list
        choices: *id020
        multiple_values: true
        elements: str
        version_ranges: *id021
        description: Relative severity of the signature (low, medium, high, critical).
        source_attribute: severity
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: severity
      cli_reference:
        type: enum
        raw_type: option
        description: Relative severity of the signature (low, medium, high, critical).
        default: info low medium high critical
        source_attribute: severity
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  uuid:
    canonical:
      type: string
      source_attribute: uuid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: uuid
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
