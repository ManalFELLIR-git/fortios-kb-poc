          - dlp.dictionary.name
          - dlp.exact-data-match.name
        count:
          type: integer
          raw_type: integer
          version_ranges: &id004
          - - v7.2.0
            - ''
          description: Count of dictionary matches to trigger sensor entry match (Dictionary might not be able to trigger
            more than once based on its "repeat" option, 1 - 255).
