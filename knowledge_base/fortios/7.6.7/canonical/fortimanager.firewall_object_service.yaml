id: fortimanager.firewall_object_service
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  adom:
    canonical:
      type: string
      default: root
      source_attribute: adom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: adom
    sources:
    - terraform
  category:
    canonical:
      type: enum
      choices: &id001
      - ''
      - File Access
      - Authentication
      - Email
      - General
      - Network Services
      - Remote Access
      - Tunneling
      - VoIP, Messaging & Other Applications
      - Web Access
      - Web Proxy
      default: ''
      source_attribute: category
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id001
        default: ''
        source_attribute: category
    sources:
    - terraform
  comment:
    canonical:
      type: string
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: comment
    sources:
    - terraform
  fqdn:
    canonical:
      type: string
      source_attribute: fqdn
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: fqdn
    sources:
    - terraform
  icmp_code:
    canonical:
      type: integer
      source_attribute: icmp_code
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: icmp_code
    sources:
    - terraform
  icmp_type:
    canonical:
      type: integer
      source_attribute: icmp_type
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: icmp_type
    sources:
    - terraform
  iprange:
    canonical:
      type: string
      source_attribute: iprange
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: iprange
    sources:
    - terraform
  name:
    canonical:
      type: string
      required: true
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: name
    sources:
    - terraform
  protocol:
    canonical:
      type: enum
      choices: &id002
      - TCP/UDP/SCTP
      - ICMP
      - ICMP6
      - IP
      default: TCP/UDP/SCTP
      source_attribute: protocol
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id002
        default: TCP/UDP/SCTP
        source_attribute: protocol
    sources:
    - terraform
  protocol_number:
    canonical:
      type: integer
      source_attribute: protocol_number
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        source_attribute: protocol_number
    sources:
    - terraform
  proxy:
    canonical:
      type: enum
      choices: &id003
      - disable
      - enable
      default: disable
      source_attribute: proxy
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id003
        default: disable
        source_attribute: proxy
    sources:
    - terraform
  sctp_portrange:
    canonical:
      type: list
      source_attribute: sctp_portrange
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        source_attribute: sctp_portrange
    sources:
    - terraform
  tcp_portrange:
    canonical:
      type: list
      source_attribute: tcp_portrange
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        source_attribute: tcp_portrange
    sources:
    - terraform
  udp_portrange:
    canonical:
      type: list
      source_attribute: udp_portrange
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        source_attribute: udp_portrange
    sources:
    - terraform
conflicts: []
