id: webfilter.search-engine
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  charset:
    canonical:
      type: enum
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - utf-8
      - gb2312
      default: utf-8
      description: Search engine charset.
      source_attribute: charset
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Search engine charset.
        source_attribute: charset
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: charset
      cli_reference:
        type: enum
        raw_type: option
        description: Search engine charset.
        default: utf-8
        source_attribute: charset
    sources:
    - ansible
    - cli_reference
    - terraform
  hostname:
    canonical:
      type: string
      version_ranges: &id003
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 127
      description: Hostname (regular expression).
      source_attribute: hostname
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id003
        description: Hostname (regular expression).
        source_attribute: hostname
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 127
        source_attribute: hostname
      cli_reference:
        type: string
        raw_type: string
        description: Hostname (regular expression).
        max_length: 127
        source_attribute: hostname
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id004
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Search engine name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id004
        description: Search engine name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Search engine name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  query:
    canonical:
      type: string
      version_ranges: &id005
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 15
      description: Code used to prefix a query (must end with an equals character).
      source_attribute: query
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id005
        description: Code used to prefix a query (must end with an equals character).
        source_attribute: query
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 15
        source_attribute: query
      cli_reference:
        type: string
        raw_type: string
        description: Code used to prefix a query (must end with an equals character).
        max_length: 15
        source_attribute: query
    sources:
    - ansible
    - cli_reference
    - terraform
  safesearch:
    canonical:
      type: enum
      version_ranges: &id007
      - - v6.0.0
        - ''
      choices: &id006
      - disable
      - url
      - header
      - translate
      - yt-pattern
      - yt-scan
      - yt-video
      - yt-channel
      default: disable
      description: Safe search method. You can disable safe search, add the safe search string to URLs, or insert a safe search
        header.
      source_attribute: safesearch
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id006
        version_ranges: *id007
        description: Safe search method. You can disable safe search, add the safe search string to URLs, or insert a safe
          search header.
        source_attribute: safesearch
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: safesearch
      cli_reference:
        type: enum
        raw_type: option
        description: Safe search method. You can disable safe search, add the safe search string to URLs, or insert a safe
          search header.
        default: disable
        source_attribute: safesearch
    sources:
    - ansible
    - cli_reference
    - terraform
  safesearch_str:
    canonical:
      type: string
      version_ranges: &id008
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 255
      description: Safe search parameter used in the URL in URL mode. In translate mode, it provides either the regex to translate
        the URL or the special case to translate the URL.
      source_attribute: safesearch-str
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id008
        description: Safe search parameter used in the URL in URL mode. In translate mode, it provides either the regex to
          translate the URL or the special case to translate the URL.
        source_attribute: safesearch_str
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: safesearch_str
      cli_reference:
        type: string
        raw_type: string
        description: Safe search parameter used in the URL in URL mode. In translate mode, it provides either the regex to
          translate the URL or the special case to translate the URL.
        max_length: 255
        source_attribute: safesearch-str
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  url:
    canonical:
      type: string
      version_ranges: &id009
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 127
      description: URL (regular expression).
      source_attribute: url
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id009
        description: URL (regular expression).
        source_attribute: url
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 127
        source_attribute: url
      cli_reference:
        type: string
        raw_type: string
        description: URL (regular expression).
        max_length: 127
        source_attribute: url
    sources:
    - ansible
    - cli_reference
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
