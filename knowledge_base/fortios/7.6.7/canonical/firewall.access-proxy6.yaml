        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Enable/disable adding vhost/domain to dnsdb for ztna dox tunnel.
        source_attribute: add_vhost_domain_to_dnsdb
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: add_vhost_domain_to_dnsdb
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable adding vhost/domain to dnsdb for ztna dox tunnel.
        default: disable
        source_attribute: add-vhost-domain-to-dnsdb
