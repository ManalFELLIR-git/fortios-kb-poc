          raw_type: string
          version_ranges: &id109
          - - v7.0.1
            - v7.6.7
          description: URL pattern to match.
        service:
          type: enum
          raw_type: string
          choices: &id088
          - http
          - https
          - tcp-forwarding
          - samlsp
          - web-portal
          - saas
          version_ranges: &id087
          - - v7.0.1
            - v7.6.7
          description: Service.
        ldb_method:
