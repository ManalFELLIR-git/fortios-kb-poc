          raw_type: string
          choices: &id049
          - enable
          - disable
          version_ranges: &id048
          - - v6.2.0
            - ''
          description: Enable/disable fail back for RPF neighbor query.
        rpf_nbr_fail_back_filter:
          type: string
          raw_type: string
          version_ranges: &id051
          - - v6.2.0
            - ''
          description: Filter for fail back RPF neighbors. Source router.access-list.name.
          references: &id050
          - router.access-list.name
        join_group:
          type: list
          raw_type: list
          elements: dict
          version_ranges: &id028
          - - v6.0.0
            - ''
          description: Join multicast groups.
          children: &id027
            address:
              type: string
              raw_type: string
              required: true
              version_ranges: &id030
              - - v6.0.0
                - ''
              description: Multicast group IP address.
        igmp:
          type: object
          raw_type: dict
          version_ranges: &id011
          - - v6.0.0
            - ''
          description: IGMP configuration options.
          children: &id010
