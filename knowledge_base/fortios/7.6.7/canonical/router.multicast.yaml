              references: &id014
              - router.access-list.name
            version:
              type: enum
              raw_type: string
              choices: &id026
              - '3'
              - '2'
              - '1'
              version_ranges: &id025
              - - v6.0.0
                - ''
              description: Maximum version of IGMP to support.
            immediate_leave_group:
              type: string
              raw_type: string
              version_ranges: &id017
              - - v6.0.0
                - ''
              description: Groups to drop membership for immediately after receiving IGMPv2 leave. Source router.access-list.name.
              references: &id016
              - router.access-list.name
            last_member_query_interval:
              type: integer
              raw_type: integer
              version_ranges: &id019
              - - v6.0.0
