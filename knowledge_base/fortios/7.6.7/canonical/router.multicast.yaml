  terraform: true
  cli_reference: true
attributes_flat:
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
