        dr_priority:
          type: integer
          raw_type: integer
          version_ranges: &id007
          - - v6.0.0
            - ''
          description: DR election priority.
        propagation_delay:
          type: integer
          raw_type: integer
          version_ranges: &id041
          - - v6.0.0
            - ''
          description: Delay flooding packets on this interface (100 - 5000 msec).
        state_refresh_interval:
          type: integer
          raw_type: integer
          version_ranges: &id052
          - - v6.0.0
            - ''
          description: Interval between sending state-refresh packets (1 - 100 sec).
