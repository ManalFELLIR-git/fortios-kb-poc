id: firewall.security_policyseq
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  alter_position:
    canonical:
      type: string
      required: true
      source_attribute: alter_position
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: alter_position
    sources:
    - terraform
  comment:
    canonical:
      type: string
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: comment
    sources:
    - terraform
  enable_state_checking:
    canonical:
      type: boolean
      default: false
      source_attribute: enable_state_checking
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        default: false
        source_attribute: enable_state_checking
    sources:
    - terraform
  policy_dst_id:
    canonical:
      type: integer
      required: true
      source_attribute: policy_dst_id
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        required: true
        source_attribute: policy_dst_id
    sources:
    - terraform
  policy_src_id:
    canonical:
      type: integer
      required: true
      source_attribute: policy_src_id
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        required: true
        source_attribute: policy_src_id
    sources:
    - terraform
  state_policy_list:
    canonical:
      type: list
      children: &id001
        policyid:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        name:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        action:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
      source_attribute: state_policy_list
    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        computed: true
        children: *id001
        source_attribute: state_policy_list
    sources:
    - terraform
  state_policy_list.action:
    canonical:
      type: string
      source_attribute: state_policy_list.action
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: state_policy_list.action
    sources:
    - terraform
  state_policy_list.name:
    canonical:
      type: string
      source_attribute: state_policy_list.name
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: state_policy_list.name
    sources:
    - terraform
  state_policy_list.policyid:
    canonical:
      type: string
      source_attribute: state_policy_list.policyid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: state_policy_list.policyid
    sources:
    - terraform
  state_policy_srcdst_pos:
    canonical:
      type: string
      default: ''
      source_attribute: state_policy_srcdst_pos
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: ''
        source_attribute: state_policy_srcdst_pos
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
