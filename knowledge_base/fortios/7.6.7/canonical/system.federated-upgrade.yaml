    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id005
        version_ranges: *id006
        description: Allow/reject use of FortiGate firmware images that are unsigned.
        source_attribute: ignore_signing_errors
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: ignore_signing_errors
      cli_reference:
        type: enum
        raw_type: option
        description: Allow/reject use of FortiGate firmware images that are unsigned.
        default: disable
        source_attribute: ignore-signing-errors
    sources:
    - ansible
    - cli_reference
    - terraform
  initial_version:
    canonical:
      type: string
      version_ranges: &id007
      - - v7.6.1
        - ''
      description: Firmware version when the upgrade was set up.
      source_attribute: initial-version
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id007
        description: Firmware version when the upgrade was set up.
        source_attribute: initial_version
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: initial_version
      cli_reference:
        type: string
        raw_type: user
        description: Firmware version when the upgrade was set up.
        source_attribute: initial-version
    sources:
    - ansible
    - cli_reference
    - terraform
  known_ha_members:
    canonical:
      type: list
      elements: dict
      children: &id009
        serial:
          type: string
          raw_type: string
          required: true
          version_ranges: &id010
          - - v7.4.2
            - ''
          description: Serial number of HA member
      version_ranges: &id008
      - - v7.4.2
        - ''
      description: Known members of the HA cluster. If a member is missing at upgrade time, the upgrade will be cancelled.
      source_attribute: known_ha_members
    canonical_source: merged
    field_sources:
      type: ansible
      elements: ansible
      children: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: list
        raw_type: list
        elements: dict
        version_ranges: *id008
        description: Known members of the HA cluster. If a member is missing at upgrade time, the upgrade will be cancelled.
