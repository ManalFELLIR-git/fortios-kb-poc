id: system.federated-upgrade
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  failure_device:
    canonical:
      type: string
      version_ranges: &id001
      - - v7.0.2
        - ''
      min_length: 0
      max_length: 79
      description: Serial number of the node to include.
      source_attribute: failure-device
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Serial number of the node to include.
        source_attribute: failure_device
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        min_length: 0
        max_length: 79
        source_attribute: failure_device
      cli_reference:
        type: string
        raw_type: string
        description: Serial number of the node to include.
        max_length: 79
        source_attribute: failure-device
    sources:
    - ansible
    - cli_reference
    - terraform
  failure_reason:
    canonical:
      type: enum
      version_ranges: &id003
      - - v7.0.2
        - ''
      choices: &id002
      - none
      - internal
      - timeout
      - device-type-unsupported
      - download-failed
      - device-missing
      - version-unavailable
      - staging-failed
      - reboot-failed
      - device-not-reconnected
      - node-not-ready
      - no-final-confirmation
      - no-confirmation-query
      - config-error-log-nonempty
      - csf-tree-not-supported
      - firmware-changed
      - node-failed
      - image-missing
      default: none
      description: Reason for upgrade failure.
      source_attribute: failure-reason
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id002
        version_ranges: *id003
        description: Reason for upgrade failure.
        source_attribute: failure_reason
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: failure_reason
      cli_reference:
        type: enum
        raw_type: option
        description: Reason for upgrade failure.
        default: none
        source_attribute: failure-reason
    sources:
    - ansible
    - cli_reference
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
