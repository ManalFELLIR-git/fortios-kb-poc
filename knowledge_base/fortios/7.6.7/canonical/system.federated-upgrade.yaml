      source_attribute: ha-reboot-controller
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id004
        description: Serial number of the FortiGate unit that will control the reboot process for the federated upgrade of
          the HA cluster.
        source_attribute: ha_reboot_controller
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: ha_reboot_controller
      cli_reference:
        type: string
        raw_type: string
        description: Serial number of the FortiGate unit that will control the reboot process for the federated upgrade of
          the HA cluster.
        max_length: 79
        source_attribute: ha-reboot-controller
    sources:
    - ansible
    - cli_reference
    - terraform
  ignore_signing_errors:
    canonical:
      type: enum
      version_ranges: &id006
      - - v7.6.0
        - ''
      choices: &id005
      - enable
      - disable
      default: disable
      description: Allow/reject use of FortiGate firmware images that are unsigned.
      source_attribute: ignore-signing-errors
