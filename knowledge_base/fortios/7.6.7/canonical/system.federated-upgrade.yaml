            optional: true
            computed: true
          allow_download:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
          coordinating_fortigate:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 79
          failure_reason:
            type: string
            raw_type: TypeString
            optional: true
