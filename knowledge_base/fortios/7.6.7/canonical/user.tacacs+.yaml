      - chap
      - pap
      - ascii
      - auto
      default: auto
      description: Allowed authentication protocols/methods.
      source_attribute: authen-type
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
