id: antivirus.quarantine
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  agelimit:
    canonical:
      type: integer
      version_ranges: &id001
      - - v6.0.0
        - ''
      default: '0'
      min: 0
      max: 479
      description: Age limit for quarantined files (0 - 479 hours, 0 means forever).
      source_attribute: agelimit
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id001
        description: Age limit for quarantined files (0 - 479 hours, 0 means forever).
        source_attribute: agelimit
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 479
        source_attribute: agelimit
      cli_reference:
        type: integer
        raw_type: integer
        description: Age limit for quarantined files (0 - 479 hours, 0 means forever).
        default: '0'
        min: 0
        max: 479
        source_attribute: agelimit
    sources:
    - ansible
    - cli_reference
    - terraform
  destination:
    canonical:
      type: enum
      version_ranges: &id003
      - - v6.0.0
        - ''
      choices: &id002
      - 'NULL'
      - disk
      - FortiAnalyzer
      default: disk **
      description: Choose whether to quarantine files to the FortiGate disk or to FortiAnalyzer or to delete them instead
