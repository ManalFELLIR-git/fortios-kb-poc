        source_attribute: destination
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: destination
      cli_reference:
        type: enum
        raw_type: option
        description: Choose whether to quarantine files to the FortiGate disk or to FortiAnalyzer or to delete them instead
          of quarantining them.
        default: disk **
        source_attribute: destination
    sources:
    - ansible
    - cli_reference
    - terraform
  drop_blocked:
