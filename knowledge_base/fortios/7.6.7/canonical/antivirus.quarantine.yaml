      type: enum
      elements: str
      version_ranges: &id005
      - - v6.0.0
        - ''
      choices: &id004
      - imap
      - smtp
      - pop3
      - http
      - ftp
      - nntp
      - imaps
      - smtps
      - pop3s
      - https
      - ftps
      - mapi
      - cifs
      - ssh
      description: Do not quarantine infected files found in sessions using the selected protocols. Dropped files are deleted
        instead of being quarantined.
      source_attribute: drop-infected
    canonical_source: merged
    field_sources:
      type: cli_reference
      elements: ansible
      version_ranges: ansible
      choices: ansible
      description: cli_reference
      source_attribute: cli_reference
