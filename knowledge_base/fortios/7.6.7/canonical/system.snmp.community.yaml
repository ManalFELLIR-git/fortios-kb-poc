  events:
    canonical:
      type: enum
      elements: str
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - cpu-high
      - mem-low
      - log-full
      - intf-ip
      - vpn-tun-up
      - vpn-tun-down
      - ha-switch
      - ha-hb-failure
      - ips-signature
      - ips-anomaly
      - av-virus
      - av-oversize
      - av-pattern
      - av-fragmented
      - fm-if-change
      - fm-conf-change
      - bgp-established
      - bgp-backward-transition
      - ha-member-up
      - ha-member-down
      - ent-conf-change
      - av-conserve
      - av-bypass
      - av-oversize-passed
      - av-oversize-blocked
      - ips-pkg-update
      - ips-fail-open
      - temperature-high
      - voltage-alert
      - power-supply
      - faz-disconnect
      - faz
      - fan-failure
      - wc-ap-up
      - wc-ap-down
      - fswctl-session-up
      - fswctl-session-down
      - load-balance-real-server-down
      - device-new
      - per-cpu-high
      - dhcp
      - pool-usage
      - ippool
      - interface
      - ospf-nbr-state-change
      - ospf-virtnbr-state-change
      - bfd
      default: cpu-high mem-low log-full intf-ip vpn-tun-up vpn-tun-down ha-switch ha-hb-failure ips-signature ips-anomaly
        av-virus av-oversize av-pattern av-fragmented fm-if-change bgp-established bgp-backward-transition ha-member-up ha-member-down
        ent-conf-change av-conserve av-bypass av-oversize-passed av-oversize-blocked ips-pkg-update ips-fail-open temperature-high
        voltage-alert power-supply faz-disconnect faz fan-failure wc-ap-up wc-ap-down fswctl-session-up fswctl-session-down
        load-balance-real-server-down per-cpu-high dhcp pool-usage ippool interface ospf-nbr-state-change ospf-virtnbr-state-change
        bfd **
      description: SNMP trap events.
      source_attribute: events
    canonical_source: merged
    field_sources:
      type: cli_reference
      elements: ansible
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: list
        choices: *id001
        multiple_values: true
        elements: str
        version_ranges: *id002
        description: SNMP trap events.
        source_attribute: events
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: events
      cli_reference:
        type: enum
        raw_type: option
