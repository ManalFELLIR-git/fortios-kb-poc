id: router.key-chain
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  dynamic_sort_subtable:
    canonical:
      type: string
      default: 'false'
      source_attribute: dynamic_sort_subtable
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: dynamic_sort_subtable
    sources:
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  key:
    canonical:
      type: list
      elements: dict
      children: &id002
        id:
          type: string
          raw_type: string
          required: true
          version_ranges: &id006
          - - v6.0.0
            - ''
          description: Key ID (0 - 2147483647).
        accept_lifetime:
          type: string
          raw_type: string
          version_ranges: &id003
          - - v6.0.0
            - ''
          description: Lifetime of received authentication key.
        send_lifetime:
          type: string
          raw_type: string
          version_ranges: &id008
          - - v6.0.0
            - ''
          description: Lifetime of sent authentication key.
        key_string:
          type: string
          raw_type: string
          version_ranges: &id007
          - - v6.0.0
            - ''
          description: Password for the key (maximum = 64 characters).
        algorithm:
          type: enum
          raw_type: string
          choices: &id005
          - md5
          - hmac-sha1
          - hmac-sha256
          - hmac-sha384
          - hmac-sha512
          - cmac-aes128
          version_ranges: &id004
          - - v7.0.1
            - ''
          description: Cryptographic algorithm.
      version_ranges: &id001
      - - v6.0.0
        - ''
      description: Configuration method to edit key settings.
      source_attribute: key
    canonical_source: merged
    field_sources:
      type: ansible
      elements: ansible
      children: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: list
        raw_type: list
        elements: dict
        version_ranges: *id001
        description: Configuration method to edit key settings.
        children: *id002
        source_attribute: key
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        children:
          id:
            type: string
            raw_type: TypeString
            optional: true
          accept_lifetime:
            type: string
            raw_type: TypeString
            optional: true
          send_lifetime:
            type: string
            raw_type: TypeString
            optional: true
          key_string:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 60
          algorithm:
            type: string
            raw_type: TypeString
            optional: true
            computed: true
        source_attribute: key
    sources:
    - ansible
    - terraform
  key.accept_lifetime:
    canonical:
      type: string
      version_ranges: *id003
      description: Lifetime of received authentication key.
      source_attribute: key.accept_lifetime
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id003
        description: Lifetime of received authentication key.
        source_attribute: key.accept_lifetime
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: key.accept_lifetime
    sources:
    - ansible
    - terraform
  key.algorithm:
    canonical:
      type: enum
      version_ranges: *id004
      choices: *id005
      description: Cryptographic algorithm.
      source_attribute: key.algorithm
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      choices: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id005
        version_ranges: *id004
        description: Cryptographic algorithm.
        source_attribute: key.algorithm
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: key.algorithm
    sources:
    - ansible
    - terraform
  key.id:
    canonical:
      type: string
      required: true
      version_ranges: *id006
      description: Key ID (0 - 2147483647).
      source_attribute: key.id
    canonical_source: merged
    field_sources:
      type: ansible
      required: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id006
        description: Key ID (0 - 2147483647).
        source_attribute: key.id
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: key.id
    sources:
    - ansible
    - terraform
  key.key_string:
    canonical:
      type: string
      version_ranges: *id007
      min_length: 0
      max_length: 60
      description: Password for the key (maximum = 64 characters).
      source_attribute: key.key_string
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: terraform
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id007
        description: Password for the key (maximum = 64 characters).
        source_attribute: key.key_string
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 60
        source_attribute: key.key_string
    sources:
    - ansible
    - terraform
  key.send_lifetime:
    canonical:
      type: string
      version_ranges: *id008
      description: Lifetime of sent authentication key.
      source_attribute: key.send_lifetime
    canonical_source: merged
    field_sources:
      type: ansible
      version_ranges: ansible
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id008
        description: Lifetime of sent authentication key.
        source_attribute: key.send_lifetime
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: key.send_lifetime
    sources:
    - ansible
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id009
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Key-chain name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id009
        description: Key-chain name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Key-chain name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
