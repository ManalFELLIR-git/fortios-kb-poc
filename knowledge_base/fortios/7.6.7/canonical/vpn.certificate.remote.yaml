id: vpn.certificate.remote
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id001
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id001
        description: Name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  range:
    canonical:
      type: enum
      version_ranges: &id003
      - - v6.0.0
        - ''
      choices: &id002
      - global
      - vdom
      default: vdom
      description: Either the global or VDOM IP address range for the remote certificate.
      source_attribute: range
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id002
        version_ranges: *id003
        description: Either the global or VDOM IP address range for the remote certificate.
        source_attribute: range
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: range
      cli_reference:
        type: enum
        raw_type: option
        description: Either the global or VDOM IP address range for the remote certificate.
        default: vdom
        source_attribute: range
    sources:
    - ansible
    - cli_reference
    - terraform
  remote:
    canonical:
      type: string
      version_ranges: &id004
      - - v6.0.0
        - ''
      description: Remote certificate.
      source_attribute: remote
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id004
        description: Remote certificate.
        source_attribute: remote
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: remote
      cli_reference:
        type: string
        raw_type: user
        description: Remote certificate.
        source_attribute: remote
    sources:
    - ansible
    - cli_reference
    - terraform
  source:
    canonical:
      type: enum
      version_ranges: &id006
      - - v6.0.0
        - ''
      choices: &id005
      - factory
      - user
      - bundle
      default: user
      description: Remote certificate source type.
      source_attribute: source
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id005
        version_ranges: *id006
        description: Remote certificate source type.
        source_attribute: source
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: source
      cli_reference:
        type: enum
        raw_type: option
        description: Remote certificate source type.
        default: user
        source_attribute: source
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
