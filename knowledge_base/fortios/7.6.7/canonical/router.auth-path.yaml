id: router.auth-path
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  device:
    canonical:
      type: string
      references: &id002
      - system.interface.name
      required: true
      version_ranges: &id001
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 35
      description: Outgoing interface.
      source_attribute: device
    canonical_source: merged
    field_sources:
      type: cli_reference
      references: ansible
      required: terraform
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Outgoing interface. Source system.interface.name.
        references: *id002
        source_attribute: device
      terraform:
        type: string
        raw_type: TypeString
        required: true
        min_length: 0
        max_length: 35
        source_attribute: device
      cli_reference:
        type: string
        raw_type: string
        description: Outgoing interface.
        max_length: 35
        source_attribute: device
    sources:
    - ansible
    - cli_reference
    - terraform
  gateway:
    canonical:
      type: ipv4-address
      version_ranges: &id003
      - - v6.0.0
        - ''
      default: 0.0.0.0
      description: Gateway IP address.
      source_attribute: gateway
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id003
        description: Gateway IP address.
        source_attribute: gateway
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: gateway
      cli_reference:
        type: ipv4-address
        raw_type: ipv4-address
        description: Gateway IP address.
        default: 0.0.0.0
        source_attribute: gateway
    sources:
    - ansible
    - cli_reference
    - terraform
    resolution:
      type:
        resolution: compatible_specialization
        semantic_type: &id004
          primitive: string
          format: ipv4-address
        authority: cli_reference
        confidence: high
    semantic_type: *id004
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id005
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 15
      description: Name of the entry.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id005
        description: Name of the entry.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        required: true
        force_new: true
        min_length: 0
        max_length: 15
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Name of the entry.
        max_length: 15
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts:
- attribute: gateway
  field: type
  values:
    ansible: string
    terraform: string
    cli_reference: ipv4-address
  classification: representation_or_real_conflict
