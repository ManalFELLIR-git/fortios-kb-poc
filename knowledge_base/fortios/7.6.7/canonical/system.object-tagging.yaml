        type: integer
        raw_type: integer
        description: Color of icon on the GUI.
        default: '0'
        min: 0
        max: 32
        source_attribute: color
    sources:
    - ansible
    - cli_reference
    - terraform
  device:
    canonical:
      type: enum
      version_ranges: &id006
      - - v6.0.0
        - ''
      choices: &id005
      - disable
      - mandatory
      - optional
      default: optional
      description: Device.
      source_attribute: device
