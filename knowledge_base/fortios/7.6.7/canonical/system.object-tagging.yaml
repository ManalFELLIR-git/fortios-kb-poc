        default: enable
        source_attribute: multiple
    sources:
    - ansible
    - cli_reference
    - terraform
  tags:
    canonical:
      type: list
      elements: dict
      children: &id012
        name:
          type: string
          raw_type: string
          required: true
          version_ranges: &id014
          - - v6.0.0
            - ''
          description: Tag name.
      version_ranges: &id011
      - - v6.0.0
        - ''
      max_length: 79
      description: Tags. Tag name.
      source_attribute: tags
    canonical_source: merged
    field_sources:
      type: ansible
      elements: ansible
      children: ansible
      version_ranges: ansible
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
