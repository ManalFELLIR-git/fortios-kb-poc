      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id004
        description: Color of icon on the GUI.
        source_attribute: color
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        min: 0
        max: 32
        source_attribute: color
