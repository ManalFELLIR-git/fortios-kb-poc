        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  interface:
    canonical:
      type: enum
      version_ranges: &id008
      - - v6.0.0
        - ''
      choices: &id007
      - disable
      - mandatory
      - optional
      default: optional
      description: Interface.
      source_attribute: interface
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id007
        version_ranges: *id008
        description: Interface.
        source_attribute: interface
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: interface
      cli_reference:
        type: enum
        raw_type: option
        description: Interface.
        default: optional
        source_attribute: interface
