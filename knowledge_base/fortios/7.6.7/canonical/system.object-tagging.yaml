      ansible:
        type: list
        raw_type: list
        elements: dict
        version_ranges: *id011
        description: Tags.
        children: *id012
        source_attribute: tags
      terraform:
        type: list
        raw_type: TypeSet
        optional: true
        children:
          name:
            type: string
            raw_type: TypeString
            optional: true
            min_length: 0
            max_length: 79
        source_attribute: tags
      cli_reference:
        type: string
        raw_type: string
        description: Tags. Tag name.
        max_length: 79
        source_attribute: tags
    sources:
    - ansible
    - cli_reference
    - terraform
    resolution:
      type:
        resolution: compatible_representation
        semantic_type: &id013
          element_type: string
          cardinality: multiple
        confidence: high
    semantic_type: *id013
  tags.name:
    canonical:
      type: string
      required: true
      version_ranges: *id014
      min_length: 0
      max_length: 79
      description: Tag name.
      source_attribute: tags.name
    canonical_source: merged
    field_sources:
      type: ansible
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: terraform
      description: ansible
      source_attribute: ansible
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id014
        description: Tag name.
        source_attribute: tags.name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 79
        source_attribute: tags.name
    sources:
    - ansible
    - terraform
  update_if_exist:
