id: system.object-tagging
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  address:
    canonical:
      type: enum
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - disable
      - mandatory
      - optional
      default: optional
      description: Address.
      source_attribute: address
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id001
        version_ranges: *id002
        description: Address.
        source_attribute: address
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: address
      cli_reference:
        type: enum
        raw_type: option
        description: Address.
        default: optional
        source_attribute: address
    sources:
    - ansible
    - cli_reference
    - terraform
  category:
    canonical:
      type: string
      required: true
      version_ranges: &id003
      - - v6.0.0
        - ''
      min_length: 0
      max_length: 63
      description: Tag Category.
      source_attribute: category
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id003
        description: Tag Category.
        source_attribute: category
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 63
        source_attribute: category
      cli_reference:
        type: string
        raw_type: string
        description: Tag Category.
        max_length: 63
        source_attribute: category
    sources:
    - ansible
    - cli_reference
    - terraform
  color:
    canonical:
      type: integer
      version_ranges: &id004
      - - v6.0.0
        - ''
      default: '0'
      min: 0
      max: 32
      description: Color of icon on the GUI.
      source_attribute: color
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
