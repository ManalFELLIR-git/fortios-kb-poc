id: fortimanager.firewall_object_address
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  adom:
    canonical:
      type: string
      default: root
      source_attribute: adom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: adom
    sources:
    - terraform
  allow_routing:
    canonical:
      type: enum
      choices: &id001
      - enable
      - disable
      default: disable
      source_attribute: allow_routing
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id001
        default: disable
        source_attribute: allow_routing
    sources:
    - terraform
  associated_intf:
    canonical:
      type: string
      default: any
      source_attribute: associated_intf
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: any
        source_attribute: associated_intf
    sources:
    - terraform
  comment:
    canonical:
      type: string
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: comment
    sources:
    - terraform
  end_ip:
    canonical:
      type: string
      default: 255.255.255.255
      source_attribute: end_ip
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 255.255.255.255
        source_attribute: end_ip
    sources:
    - terraform
  fqdn:
    canonical:
      type: string
      source_attribute: fqdn
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: fqdn
    sources:
    - terraform
  name:
    canonical:
      type: string
      required: true
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: name
    sources:
    - terraform
  start_ip:
    canonical:
      type: string
      default: 0.0.0.0
      source_attribute: start_ip
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 0.0.0.0
        source_attribute: start_ip
    sources:
    - terraform
  subnet:
    canonical:
      type: string
      default: 0.0.0.0 0.0.0.0
      source_attribute: subnet
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 0.0.0.0 0.0.0.0
        source_attribute: subnet
    sources:
    - terraform
  type:
    canonical:
      type: enum
      choices: &id002
      - ipmask
      - iprange
      - fqdn
      default: ipmask
      source_attribute: type
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id002
        default: ipmask
        source_attribute: type
    sources:
    - terraform
conflicts: []
