        source_attribute: address
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: address
      cli_reference:
        type: string
        raw_type: string
        description: Connector service edge adress(IP or FQDN).
        max_length: 255
        source_attribute: address
    sources:
    - ansible
    - cli_reference
    - terraform
