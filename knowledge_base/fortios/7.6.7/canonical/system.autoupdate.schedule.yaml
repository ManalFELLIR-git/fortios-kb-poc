      type: enum
      version_ranges: &id002
      - - v6.0.0
        - ''
      choices: &id001
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      default: Monday
      description: Update day.
      source_attribute: day
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
