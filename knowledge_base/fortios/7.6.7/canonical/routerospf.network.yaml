      type: string
      min_length: 0
      max_length: 255
      source_attribute: comments
    canonical_source: merged
    field_sources:
      type: terraform
      min_length: terraform
      max_length: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comments
    sources:
    - terraform
  fosid:
    canonical:
      type: integer
      source_attribute: fosid
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        force_new: true
        source_attribute: fosid
    sources:
    - terraform
  prefix:
    canonical:
      type: string
      source_attribute: prefix
    canonical_source: merged
    field_sources:
      type: terraform
