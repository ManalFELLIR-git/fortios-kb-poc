        optional: true
        computed: true
        source_attribute: bandwidth_unit
      cli_reference:
        type: enum
        raw_type: option
        description: Unit of measurement for maximum bandwidth for this shaper (Kbps, Mbps or Gbps).
        default: kbps
        source_attribute: bandwidth-unit
    sources:
    - ansible
    - cli_reference
    - terraform
