        min: 0
        max: 80000000
        source_attribute: max-bandwidth
    sources:
    - ansible
    - cli_reference
    - terraform
    resolution:
      range:
        max:
          resolution: sentinel_value_plus_normal_range
          status: resolved
          confidence: high
          canonical_policy: cli_reference_normal_range_plus_special_values
          special_values: &id010
          - 0
          requires_hardware_overlay: false
          requires_runtime_validation: false
          ansible_ranges_detected:
          - - '0'
            - '100000000'
          cli_ranges_detected:
          - - '0'
            - '80000000'
          cli_units: []
          ansible_units: []
          cli_internal_inconsistency: false
    special_values: *id010
  max_concurrent_session:
