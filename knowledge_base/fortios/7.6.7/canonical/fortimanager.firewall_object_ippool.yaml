id: fortimanager.firewall_object_ippool
version: 7.6.7
source_presence:
  ansible: false
  terraform: true
  cli_reference: false
attributes_flat:
  adom:
    canonical:
      type: string
      default: root
      source_attribute: adom
    canonical_source: merged
    field_sources:
      type: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: root
        source_attribute: adom
    sources:
    - terraform
  arp_intf:
    canonical:
      type: string
      source_attribute: arp_intf
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: arp_intf
    sources:
    - terraform
  arp_reply:
    canonical:
      type: enum
      choices: &id001
      - disable
      - enable
      default: enable
      source_attribute: arp_reply
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id001
        default: enable
        source_attribute: arp_reply
    sources:
    - terraform
  associated_intf:
    canonical:
      type: string
      source_attribute: associated_intf
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: associated_intf
    sources:
    - terraform
  comment:
    canonical:
      type: string
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        source_attribute: comment
    sources:
    - terraform
  endip:
    canonical:
      type: string
      required: true
      source_attribute: endip
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: endip
    sources:
    - terraform
  name:
    canonical:
      type: string
      required: true
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: name
    sources:
    - terraform
  startip:
    canonical:
      type: string
      required: true
      source_attribute: startip
    canonical_source: merged
    field_sources:
      type: terraform
      required: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        required: true
        source_attribute: startip
    sources:
    - terraform
  type:
    canonical:
      type: enum
      choices: &id002
      - overload
      - one-to-one
      default: overload
      source_attribute: type
    canonical_source: merged
    field_sources:
      type: terraform
      choices: terraform
      default: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        choices: *id002
        default: overload
        source_attribute: type
    sources:
    - terraform
conflicts: []
