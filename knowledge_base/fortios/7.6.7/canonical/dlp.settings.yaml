        source_attribute: db_mode
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: db_mode
      cli_reference:
        type: enum
        raw_type: option
        description: Behavior when the maximum size is reached in the DLP fingerprint database.
        default: stop-adding
        source_attribute: db-mode
    sources:
    - ansible
    - cli_reference
    - terraform
  get_all_tables:
    canonical:
      type: string
      default: 'false'
      source_attribute: get_all_tables
