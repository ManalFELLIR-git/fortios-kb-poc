id: dlp.settings
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  cache_mem_percent:
    canonical:
      type: integer
      version_ranges: &id001
      - - v6.0.0
        - ''
      default: '2'
      min: 1
      max: 15
      description: Maximum percentage of available memory allocated to caching DLP fingerprints (1 - 15).
      source_attribute: cache-mem-percent
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id001
        description: Maximum percentage of available memory allocated to caching DLP fingerprints (1 - 15).
        source_attribute: cache_mem_percent
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 1
        max: 15
        source_attribute: cache_mem_percent
      cli_reference:
        type: integer
        raw_type: integer
        description: Maximum percentage of available memory allocated to caching DLP fingerprints (1 - 15).
        default: '2'
        min: 1
        max: 15
        source_attribute: cache-mem-percent
    sources:
    - ansible
    - cli_reference
    - terraform
  chunk_size:
    canonical:
      type: integer
      version_ranges: &id002
      - - v6.0.0
        - ''
      default: '2800'
      min: 100
      max: 100000
      description: Maximum fingerprint chunk size. Caution, changing this setting will flush the entire database.
      source_attribute: chunk-size
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: integer
        raw_type: integer
        version_ranges: *id002
        description: Maximum fingerprint chunk size. Caution, changing this setting will flush the entire database.
        source_attribute: chunk_size
      terraform:
        type: integer
        raw_type: TypeInt
        optional: true
        computed: true
        min: 100
        max: 100000
        source_attribute: chunk_size
      cli_reference:
        type: integer
        raw_type: integer
        description: Maximum fingerprint chunk size. Caution, changing this setting will flush the entire database.
        default: '2800'
        min: 100
        max: 100000
        source_attribute: chunk-size
    sources:
    - ansible
    - cli_reference
    - terraform
  config_builder_timeout:
    canonical:
      type: integer
      version_ranges: &id003
      - - v7.6.1
        - ''
      default: '60'
      min: 10
      max: 100000
      description: Maximum time allowed for building a single DLP profile (default 60 seconds).
      source_attribute: config-builder-timeout
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      default: cli_reference
      min: cli_reference
      max: cli_reference
      description: cli_reference
      source_attribute: cli_reference
