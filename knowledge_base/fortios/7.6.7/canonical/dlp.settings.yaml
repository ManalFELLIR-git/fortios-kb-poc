        default: '60'
        min: 10
        max: 100000
        source_attribute: config-builder-timeout
    sources:
    - ansible
    - cli_reference
    - terraform
  db_mode:
    canonical:
      type: enum
      version_ranges: &id005
      - - v6.0.0
        - ''
      choices: &id004
      - stop-adding
      - remove-modified-then-oldest
      - remove-oldest
      default: stop-adding
      description: Behavior when the maximum size is reached in the DLP fingerprint database.
      source_attribute: db-mode
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
