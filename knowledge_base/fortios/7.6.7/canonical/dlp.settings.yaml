    canonical_source: merged
    field_sources:
      type: terraform
      children: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: list
        raw_type: TypeList
        optional: true
        computed: true
        children: *id006
        source_attribute: ocr
    sources:
    - terraform
  ocr.confidence:
    canonical:
