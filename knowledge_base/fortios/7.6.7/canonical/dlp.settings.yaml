      terraform:
        type: string
        raw_type: TypeString
        optional: true
        default: 'false'
        source_attribute: get_all_tables
    sources:
    - terraform
  ocr:
    canonical:
      type: list
      children: &id006
        scan:
          type: string
          raw_type: TypeString
          optional: true
          computed: true
        confidence:
          type: integer
          raw_type: TypeInt
          optional: true
          computed: true
          min: 0
          max: 100
        max_file_size:
          type: integer
          raw_type: TypeInt
          optional: true
          min: 0
          max: 1427456
        filetype_ignore_list:
          type: list
          raw_type: TypeSet
          optional: true
          children: &id007
            name:
              type: string
              raw_type: TypeString
              optional: true
              min_length: 0
              max_length: 39
