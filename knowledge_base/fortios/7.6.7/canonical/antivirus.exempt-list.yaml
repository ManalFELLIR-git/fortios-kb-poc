id: antivirus.exempt-list
version: 7.6.7
source_presence:
  ansible: true
  terraform: true
  cli_reference: true
attributes_flat:
  comment:
    canonical:
      type: string
      version_ranges: &id001
      - - v7.2.4
        - ''
      min_length: 0
      max_length: 255
      description: Comment.
      source_attribute: comment
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id001
        description: Comment.
        source_attribute: comment
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 255
        source_attribute: comment
      cli_reference:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
        source_attribute: comment
    sources:
    - ansible
    - cli_reference
    - terraform
  hash:
    canonical:
      type: string
      version_ranges: &id002
      - - v7.2.4
        - ''
      min_length: 0
      max_length: 64
      description: Hash value to be matched.
      source_attribute: hash
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        version_ranges: *id002
        description: Hash value to be matched.
        source_attribute: hash
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        min_length: 0
        max_length: 64
        source_attribute: hash
      cli_reference:
        type: string
        raw_type: string
        description: Hash value to be matched.
        max_length: 64
        source_attribute: hash
    sources:
    - ansible
    - cli_reference
    - terraform
  hash_type:
    canonical:
      type: enum
      version_ranges: &id004
      - - v7.2.4
        - ''
      choices: &id003
      - md5
      - sha1
      - sha256
      default: sha1
      description: Hash type.
      source_attribute: hash-type
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id003
        version_ranges: *id004
        description: Hash type.
        source_attribute: hash_type
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: hash_type
      cli_reference:
        type: enum
        raw_type: option
        description: Hash type.
        default: sha1
        source_attribute: hash-type
    sources:
    - ansible
    - cli_reference
    - terraform
  name:
    canonical:
      type: string
      required: true
      version_ranges: &id005
      - - v7.2.4
        - ''
      min_length: 0
      max_length: 35
      description: Table entry name.
      source_attribute: name
    canonical_source: merged
    field_sources:
      type: cli_reference
      required: ansible
      version_ranges: ansible
      min_length: terraform
      max_length: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: string
        raw_type: string
        required: true
        version_ranges: *id005
        description: Table entry name.
        source_attribute: name
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        min_length: 0
        max_length: 35
        source_attribute: name
      cli_reference:
        type: string
        raw_type: string
        description: Table entry name.
        max_length: 35
        source_attribute: name
    sources:
    - ansible
    - cli_reference
    - terraform
  status:
    canonical:
      type: enum
      version_ranges: &id007
      - - v7.2.4
        - ''
      choices: &id006
      - disable
      - enable
      default: enable
      description: Enable/disable table entry.
      source_attribute: status
    canonical_source: merged
    field_sources:
      type: cli_reference
      version_ranges: ansible
      choices: ansible
      default: cli_reference
      description: cli_reference
      source_attribute: cli_reference
    evidence:
      ansible:
        type: enum
        raw_type: string
        choices: *id006
        version_ranges: *id007
        description: Enable/disable table entry.
        source_attribute: status
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        source_attribute: status
      cli_reference:
        type: enum
        raw_type: option
        description: Enable/disable table entry.
        default: enable
        source_attribute: status
    sources:
    - ansible
    - cli_reference
    - terraform
  update_if_exist:
    canonical:
      type: boolean
      source_attribute: update_if_exist
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: boolean
        raw_type: TypeBool
        optional: true
        computed: true
        source_attribute: update_if_exist
    sources:
    - terraform
  vdomparam:
    canonical:
      type: string
      source_attribute: vdomparam
    canonical_source: merged
    field_sources:
      type: terraform
      source_attribute: terraform
    evidence:
      terraform:
        type: string
        raw_type: TypeString
        optional: true
        computed: true
        force_new: true
        source_attribute: vdomparam
    sources:
    - terraform
conflicts: []
