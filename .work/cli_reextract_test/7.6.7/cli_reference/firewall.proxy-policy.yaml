id: firewall.proxy-policy
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/100133014/config-firewall-proxy-policy
attributes:
  access-proxy:
    type: string
    raw_type: string
    description: IPv4 access proxy. Access Proxy name.
    max_length: 79
  access-proxy6:
    type: string
    raw_type: string
    description: IPv6 access proxy. Access proxy name.
    max_length: 79
  action:
    type: enum
    raw_type: option
    description: Accept or deny traffic matching the policy parameters.
    default: deny
  application-list:
    type: string
    raw_type: string
    description: Name of an existing Application list.
    max_length: 47
  av-profile:
    type: string
    raw_type: string
    description: Name of an existing Antivirus profile.
    max_length: 47
  block-notification:
    type: enum
    raw_type: option
    description: Enable/disable block notification.
    default: disable
  casb-profile:
    type: string
    raw_type: string
    description: Name of an existing CASB profile.
    max_length: 47
  comments:
    type: string
    raw_type: var-string
    description: Optional comments.
    max_length: 1023
  decrypted-traffic-mirror:
    type: string
    raw_type: string
    description: Decrypted traffic mirror.
    max_length: 35
  detect-https-in-http-request:
    type: enum
    raw_type: option
    description: Enable/disable detection of HTTPS in HTTP request.
    default: disable
  device-ownership:
    type: enum
    raw_type: option
    description: When enabled, the ownership enforcement will be done at policy level.
    default: disable
  disclaimer:
    type: enum
    raw_type: option
    description: 'Web proxy disclaimer setting: by domain, policy, or user.'
    default: disable
  dlp-profile:
    type: string
    raw_type: string
    description: Name of an existing DLP profile.
    max_length: 47
  dnsfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing DNS filter profile.
    max_length: 47
  dstaddr:
    type: string
    raw_type: string
    description: Destination address objects. Address name.
    max_length: 79
  dstaddr-negate:
    type: enum
    raw_type: option
    description: When enabled, destination addresses match against any address EXCEPT the specified destination addresses.
    default: disable
  dstaddr6:
    type: string
    raw_type: string
    description: IPv6 destination address objects. Address name.
    max_length: 79
  dstintf:
    type: string
    raw_type: string
    description: Destination interface names. Interface name.
    max_length: 79
  emailfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing email filter profile.
    max_length: 47
  file-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing file-filter profile.
    max_length: 47
  groups:
    type: string
    raw_type: string
    description: Names of group objects. Group name.
    max_length: 79
  http-tunnel-auth:
    type: enum
    raw_type: option
    description: Enable/disable HTTP tunnel authentication.
    default: disable
  https-sub-category:
    type: enum
    raw_type: option
    description: Enable/disable HTTPS sub-category policy matching.
    default: disable
  icap-profile:
    type: string
    raw_type: string
    description: Name of an existing ICAP profile.
    max_length: 47
  internet-service:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services for this policy. If enabled, destination address and service are
      not used.
    default: disable
  internet-service-custom:
    type: string
    raw_type: string
    description: Custom Internet Service name. Custom Internet Service name.
    max_length: 79
  internet-service-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service group name. Custom Internet Service group name.
    max_length: 79
  internet-service-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service name. FortiGuard Internet Service name.
    max_length: 79
  internet-service-group:
    type: string
    raw_type: string
    description: Internet Service group name. Internet Service group name.
    max_length: 79
  internet-service-name:
    type: string
    raw_type: string
    description: Internet Service name. Internet Service name.
    max_length: 79
  internet-service-negate:
    type: enum
    raw_type: option
    description: When enabled, Internet Services match against any internet service EXCEPT the selected Internet Service.
    default: disable
  internet-service6:
    type: enum
    raw_type: option
    description: Enable/disable use of Internet Services IPv6 for this policy. If enabled, destination IPv6 address and service
      are not used.
    default: disable
  internet-service6-custom:
    type: string
    raw_type: string
    description: Custom Internet Service IPv6 name. Custom Internet Service IPv6 name.
    max_length: 79
  internet-service6-custom-group:
    type: string
    raw_type: string
    description: Custom Internet Service IPv6 group name. Custom Internet Service IPv6 group name.
    max_length: 79
  internet-service6-fortiguard:
    type: string
    raw_type: string
    description: FortiGuard Internet Service IPv6 name. FortiGuard Internet Service IPv6 name.
    max_length: 79
  internet-service6-group:
    type: string
    raw_type: string
    description: Internet Service IPv6 group name. Internet Service IPv6 group name.
    max_length: 79
  internet-service6-name:
    type: string
    raw_type: string
    description: Internet Service IPv6 name. Internet Service IPv6 name.
    max_length: 79
  internet-service6-negate:
    type: enum
    raw_type: option
    description: When enabled, Internet Services match against any internet service IPv6 EXCEPT the selected Internet Service
      IPv6.
    default: disable
  ips-sensor:
    type: string
    raw_type: string
    description: Name of an existing IPS sensor.
    max_length: 47
  ips-voip-filter:
    type: string
    raw_type: string
    description: Name of an existing VoIP (ips) profile.
    max_length: 47
  isolator-server:
    type: string
    raw_type: string
    description: Isolator server name.
    max_length: 63
  log-http-transaction:
    type: enum
    raw_type: option
    description: Enable/disable HTTP transaction log.
    default: disable
  logtraffic:
    type: enum
    raw_type: option
    description: Enable/disable logging traffic through the policy.
    default: utm
  logtraffic-start:
    type: enum
    raw_type: option
    description: Enable/disable policy log traffic start.
    default: disable
  name:
    type: string
    raw_type: string
    description: Policy name.
    max_length: 35
  policyid:
    type: integer
    raw_type: integer
    description: Policy ID.
    default: '0'
    min: 0
    max: 4294967295
  poolname:
    type: string
    raw_type: string
    description: Name of IP pool object. IP pool name.
    max_length: 79
  poolname6:
    type: string
    raw_type: string
    description: Name of IPv6 pool object. IPv6 pool name.
    max_length: 79
  profile-group:
    type: string
    raw_type: string
    description: Name of profile group.
    max_length: 47
  profile-protocol-options:
    type: string
    raw_type: string
    description: Name of an existing Protocol options profile.
    default: default
    max_length: 47
  profile-type:
    type: enum
    raw_type: option
    description: Determine whether the firewall policy allows security profile groups or single profiles only.
    default: single
  proxy:
    type: enum
    raw_type: option
    description: Type of explicit proxy.
  redirect-url:
    type: string
    raw_type: var-string
    description: Redirect URL for further explicit web proxy processing.
    max_length: 1023
  replacemsg-override-group:
    type: string
    raw_type: string
    description: Authentication replacement message override group.
    max_length: 35
  schedule:
    type: string
    raw_type: string
    description: Name of schedule object.
    max_length: 35
  service:
    type: string
    raw_type: string
    description: Name of service objects. Service name.
    max_length: 79
  service-negate:
    type: enum
    raw_type: option
    description: When enabled, services match against any service EXCEPT the specified destination services.
    default: disable
  session-ttl:
    type: integer
    raw_type: integer
    description: TTL in seconds for sessions accepted by this policy (0 means use the system default session TTL).
    default: '0'
    min: 300
    max: 2764800
  srcaddr:
    type: string
    raw_type: string
    description: Source address objects. Address name.
    max_length: 79
  srcaddr-negate:
    type: enum
    raw_type: option
    description: When enabled, source addresses match against any address EXCEPT the specified source addresses.
    default: disable
  srcaddr6:
    type: string
    raw_type: string
    description: IPv6 source address objects. Address name.
    max_length: 79
  srcintf:
    type: string
    raw_type: string
    description: Source interface names. Interface name.
    max_length: 79
  ssh-filter-profile:
    type: string
    raw_type: string
    description: Name of an existing SSH filter profile.
    max_length: 47
  ssh-policy-redirect:
    type: enum
    raw_type: option
    description: Redirect SSH traffic to matching transparent proxy policy.
    default: disable
  ssl-ssh-profile:
    type: string
    raw_type: string
    description: Name of an existing SSL SSH profile.
    default: no-inspection
    max_length: 47
  status:
    type: enum
    raw_type: option
    description: Enable/disable the active status of the policy.
    default: enable
  telemetry-profile:
    type: string
    raw_type: string
    description: Name of an existing telemetry profile.
    max_length: 47
  transparent:
    type: enum
    raw_type: option
    description: Enable to use the IP address of the client to connect to the server.
    default: disable
  url-risk:
    type: string
    raw_type: string
    description: URL risk level name. Risk level name.
    max_length: 79
  users:
    type: string
    raw_type: string
    description: Names of user objects. Group name.
    max_length: 79
  utm-status:
    type: enum
    raw_type: option
    description: Enable the use of UTM profiles/sensors/lists.
    default: disable
  uuid:
    type: uuid
    raw_type: uuid
    description: Universally Unique Identifier (UUID; automatically assigned but can be manually reset).
    default: 00000000-0000-0000-0000-000000000000
  videofilter-profile:
    type: string
    raw_type: string
    description: Name of an existing VideoFilter profile.
    max_length: 47
  waf-profile:
    type: string
    raw_type: string
    description: Name of an existing Web application firewall profile.
    max_length: 47
  webcache:
    type: enum
    raw_type: option
    description: Enable/disable web caching.
    default: disable
  webcache-https:
    type: enum
    raw_type: option
    description: Enable/disable web caching for HTTPS (Requires deep-inspection enabled in ssl-ssh-profile).
    default: disable
  webfilter-profile:
    type: string
    raw_type: string
    description: Name of an existing Web filter profile.
    max_length: 47
  webproxy-forward-server:
    type: string
    raw_type: string
    description: Web proxy forward server name.
    max_length: 63
  webproxy-profile:
    type: string
    raw_type: string
    description: Name of web proxy profile.
    max_length: 63
  ztna-ems-tag:
    type: string
    raw_type: string
    description: ZTNA EMS Tag names. EMS Tag name.
    max_length: 79
  ztna-ems-tag-negate:
    type: enum
    raw_type: option
    description: When enabled, ZTNA EMS tags match against any tag EXCEPT the specified ZTNA EMS tags.
    default: disable
  ztna-proxy:
    type: string
    raw_type: string
    description: ZTNA proxies. ZTNA proxy name.
    max_length: 79
  ztna-tags-match-logic:
    type: enum
    raw_type: option
    description: ZTNA tag matching logic.
    default: or
children: {}
