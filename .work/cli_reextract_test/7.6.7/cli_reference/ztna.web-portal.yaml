id: ztna.web-portal
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/100828294/config-ztna-web-portal
attributes:
  auth-portal:
    type: enum
    raw_type: option
    description: Enable/disable authentication portal.
    default: disable
  auth-rule:
    type: string
    raw_type: string
    description: Authentication Rule.
    max_length: 35
  auth-virtual-host:
    type: string
    raw_type: string
    description: Virtual host for authentication portal.
    max_length: 79
  clipboard:
    type: enum
    raw_type: option
    description: Enable to support RDP/VPC clipboard functionality.
    default: enable
  cookie-age:
    type: integer
    raw_type: integer
    description: Time in minutes that client web browsers should keep a cookie. Default is 60 minutes. 0 = no time limit.
    default: '60'
    min: 0
    max: 525600
  customize-forticlient-download-url:
    type: enum
    raw_type: option
    description: Enable support of customized download URL for FortiClient.
    default: disable
  decrypted-traffic-mirror:
    type: string
    raw_type: string
    description: Decrypted traffic mirror.
    max_length: 35
  default-window-height:
    type: integer
    raw_type: integer
    description: Screen height (range from 0 - 65535, default = 768).
    default: '768'
    min: 0
    max: 65535
  default-window-width:
    type: integer
    raw_type: integer
    description: Screen width (range from 0 - 65535, default = 1024).
    default: '1024'
    min: 0
    max: 65535
  display-bookmark:
    type: enum
    raw_type: option
    description: Enable to display the web portal bookmark widget.
    default: enable
  display-history:
    type: enum
    raw_type: option
    description: Enable to display the web portal user login history widget.
    default: disable
  display-status:
    type: enum
    raw_type: option
    description: Enable to display the web portal status widget.
    default: enable
  focus-bookmark:
    type: enum
    raw_type: option
    description: Enable to prioritize the placement of the bookmark section over the quick-connection section in the ztna
      web-portal.
    default: disable
  forticlient-download:
    type: enum
    raw_type: option
    description: Enable/disable download option for FortiClient.
    default: enable
  heading:
    type: string
    raw_type: string
    description: Web portal heading message.
    default: ZTNA Portal
    max_length: 31
  host:
    type: string
    raw_type: string
    description: Virtual or real host name.
    max_length: 79
  log-blocked-traffic:
    type: enum
    raw_type: option
    description: Enable/disable logging of blocked traffic.
    default: enable
  macos-forticlient-download-url:
    type: string
    raw_type: var-string
    description: Download URL for Mac FortiClient.
    max_length: 1023
  name:
    type: string
    raw_type: string
    description: ZTNA proxy name.
    max_length: 79
  policy-auth-sso:
    type: enum
    raw_type: option
    description: Enable policy sso authentication.
    default: enable
  theme:
    type: enum
    raw_type: option
    description: Web portal color scheme.
    default: security-fabric
  vip:
    type: string
    raw_type: string
    description: Virtual IP name.
    max_length: 79
  vip6:
    type: string
    raw_type: string
    description: Virtual IPv6 name.
    max_length: 79
  windows-forticlient-download-url:
    type: string
    raw_type: var-string
    description: Download URL for Windows FortiClient.
    max_length: 1023
children: {}
