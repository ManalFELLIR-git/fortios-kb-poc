id: router.community-list
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/102224540/config-router-community-list
attributes:
  name:
    type: string
    raw_type: string
    description: Community list name.
    max_length: 35
  type:
    type: enum
    raw_type: option
    description: Community list type (standard or expanded).
    default: standard
children:
  rule:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Permit or deny route-based operations, based on the route's COMMUNITY attribute.
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      match:
        type: string
        raw_type: string
        description: Community specifications for matching a reserved community.
        max_length: 255
      regexp:
        type: string
        raw_type: string
        description: Ordered list of COMMUNITY attributes as a regular expression.
        max_length: 255
