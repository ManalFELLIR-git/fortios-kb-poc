id: system.virtual-switch
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/101854390/config-system-virtual-switch
attributes:
  name:
    type: string
    raw_type: string
    description: Name of the virtual switch.
    max_length: 15
  physical-switch:
    type: string
    raw_type: string
    description: Physical switch parent.
    max_length: 15
  span:
    type: enum
    raw_type: option
    description: Enable/disable SPAN.
    default: disable
  span-dest-port:
    type: string
    raw_type: string
    description: SPAN destination port.
    max_length: 15
  span-direction:
    type: enum
    raw_type: option
    description: SPAN direction.
    default: both
  span-source-port:
    type: string
    raw_type: string
    description: SPAN source port.
    max_length: 15
  vlan:
    type: integer
    raw_type: integer
    description: VLAN.
    default: '0'
    min: 0
    max: 4294967295
children:
  port:
    attributes:
      alias:
        type: string
        raw_type: string
        description: Alias.
        max_length: 25
      name:
        type: string
        raw_type: string
        description: Physical interface name.
        max_length: 15
