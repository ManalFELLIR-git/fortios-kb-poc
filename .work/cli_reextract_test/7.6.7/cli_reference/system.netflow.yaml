id: system.netflow
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105185180/config-system-netflow
attributes:
  active-flow-timeout:
    type: integer
    raw_type: integer
    description: Timeout to report active flows (60 - 3600 sec, default = 1800).
    default: '1800'
    min: 60
    max: 3600
  inactive-flow-timeout:
    type: integer
    raw_type: integer
    description: Timeout for periodic report of finished flows (10 - 600 sec, default = 15).
    default: '15'
    min: 10
    max: 600
  session-cache-size:
    type: enum
    raw_type: option
    description: Maximum RAM usage allowed for Netflow session cache.
    default: default
  template-tx-counter:
    type: integer
    raw_type: integer
    description: Counter of flowset records before resending a template flowset record.
    default: '20'
    min: 10
    max: 6000
  template-tx-timeout:
    type: integer
    raw_type: integer
    description: Timeout for periodic template flowset transmission (60 - 86400 sec, default = 1800).
    default: '1800'
    min: 60
    max: 86400
children:
  collectors:
    attributes:
      collector-ip:
        type: string
        raw_type: string
        description: Collector IP.
        max_length: 63
      collector-port:
        type: integer
        raw_type: integer
        description: NetFlow collector port number.
        default: '2055'
        min: 0
        max: 65535
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 1
        max: 6
      interface:
        type: string
        raw_type: string
        description: Specify outgoing interface to reach server.
        max_length: 15
      interface-select-method:
        type: enum
        raw_type: option
        description: Specify how to select outgoing interface to reach server.
        default: auto
      source-ip:
        type: string
        raw_type: string
        description: Source IP address for communication with the NetFlow agent.
        max_length: 63
      source-ip-interface:
        type: string
        raw_type: string
        description: Name of the interface used to determine the source IP for exporting packets.
        max_length: 15
      vrf-select:
        type: integer
        raw_type: integer
        description: VRF ID used for connection to server.
        default: '0'
        min: 0
        max: 511
  exclusion-filters:
    attributes:
      destination-ip:
        type: string
        raw_type: user
        description: Session destination address.
      destination-port:
        type: string
        raw_type: user
        description: Session destination port number or range.
      id:
        type: integer
        raw_type: integer
        description: Filter ID.
        default: '0'
        min: 0
        max: 4294967295
      protocol:
        type: integer
        raw_type: integer
        description: Session IP protocol (0 - 255, default = 255, meaning any).
        default: '255'
        min: 0
        max: 255
      source-ip:
        type: string
        raw_type: user
        description: Session source address.
      source-port:
        type: string
        raw_type: user
        description: Session source port number or range.
