id: videofilter.profile
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/105143270/config-videofilter-profile
attributes:
  comment:
    type: string
    raw_type: var-string
    description: Comment.
    max_length: 255
  dailymotion:
    type: enum
    raw_type: option
    description: Enable/disable Dailymotion video source.
    default: enable
  name:
    type: string
    raw_type: string
    description: Name.
    max_length: 47
  replacemsg-group:
    type: string
    raw_type: string
    description: Replacement message group.
    max_length: 35
  vimeo:
    type: enum
    raw_type: option
    description: Enable/disable Vimeo video source.
    default: enable
  youtube:
    type: enum
    raw_type: option
    description: Enable/disable YouTube video source.
    default: enable
children:
  filters:
    attributes:
      action:
        type: enum
        raw_type: option
        description: Video filter action.
        default: monitor
      category:
        type: string
        raw_type: string
        description: FortiGuard category ID.
        max_length: 7
      channel:
        type: string
        raw_type: string
        description: Channel ID.
        max_length: 255
      comment:
        type: string
        raw_type: var-string
        description: Comment.
        max_length: 255
      id:
        type: integer
        raw_type: integer
        description: ID.
        default: '0'
        min: 0
        max: 4294967295
      keyword:
        type: integer
        raw_type: integer
        description: Video filter keyword ID.
        default: '0'
        min: 0
        max: 4294967295
      log:
        type: enum
        raw_type: option
        description: Enable/disable logging.
        default: enable
      type:
        type: enum
        raw_type: option
        description: Filter type.
        default: category
