id: user.local
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/109120963/config-user-local
attributes:
  auth-concurrent-override:
    type: enum
    raw_type: option
    description: Enable/disable overriding the policy-auth-concurrent under config system global.
    default: disable
  auth-concurrent-value:
    type: integer
    raw_type: integer
    description: Maximum number of concurrent logins permitted from the same user.
    default: '0'
    min: 0
    max: 100
  authtimeout:
    type: integer
    raw_type: integer
    description: Time in minutes before the authentication timeout for a user is reached.
    default: '0'
    min: 0
    max: 1440
  email-to:
    type: string
    raw_type: string
    description: Two-factor recipient's email address.
    max_length: 63
  fortitoken:
    type: string
    raw_type: string
    description: Two-factor recipient's FortiToken serial number.
    max_length: 16
  id:
    type: integer
    raw_type: integer
    description: User ID. Read-only.
    default: '0'
    min: 0
    max: 4294967295
  ldap-server:
    type: string
    raw_type: string
    description: Name of LDAP server with which the user must authenticate.
    max_length: 35
  name:
    type: string
    raw_type: string
    description: Local user name.
    max_length: 64
  passwd:
    type: password
    raw_type: password
    description: User's password.
  passwd-policy:
    type: string
    raw_type: string
    description: Password policy to apply to this user, as defined in config user password-policy.
    max_length: 35
  passwd-time:
    type: string
    raw_type: user
    description: Time of the last password update.
  ppk-identity:
    type: string
    raw_type: string
    description: IKEv2 Postquantum Preshared Key Identity.
    max_length: 35
  ppk-secret:
    type: password-3
    raw_type: password-3
    description: IKEv2 Postquantum Preshared Key (ASCII string or hexadecimal encoded with a leading 0x).
  qkd-profile:
    type: string
    raw_type: string
    description: Quantum Key Distribution (QKD) profile.
    max_length: 35
  radius-server:
    type: string
    raw_type: string
    description: Name of RADIUS server with which the user must authenticate.
    max_length: 35
  saml-server:
    type: string
    raw_type: string
    description: Name of SAML server with which the user must authenticate.
    max_length: 35
  sms-custom-server:
    type: string
    raw_type: string
    description: Two-factor recipient's SMS server.
    max_length: 35
  sms-phone:
    type: string
    raw_type: string
    description: Two-factor recipient's mobile phone number.
    max_length: 15
  sms-server:
    type: enum
    raw_type: option
    description: Send SMS through FortiGuard or other external server.
    default: fortiguard
  status:
    type: enum
    raw_type: option
    description: Enable/disable allowing the local user to authenticate with the FortiGate unit.
    default: enable
  tacacs:
    type: string
    raw_type: string
    description: Name of TACACS+ server with which the user must authenticate.
    max_length: 35
  two-factor:
    type: enum
    raw_type: option
    description: Enable/disable two-factor authentication.
    default: disable
  two-factor-authentication:
    type: enum
    raw_type: option
    description: Authentication method by FortiToken Cloud.
  two-factor-notification:
    type: enum
    raw_type: option
    description: Notification method for user activation by FortiToken Cloud.
  type:
    type: enum
    raw_type: option
    description: Authentication method.
    default: password
  username-sensitivity:
    type: enum
    raw_type: option
    description: Enable/disable case and accent sensitivity when performing username matching (accents are stripped and case
      is ignored when disabled).
    default: enable
  workstation:
    type: string
    raw_type: string
    description: Name of the remote user workstation, if you want to limit the user to authenticate only from a particular
      workstation.
    max_length: 35
children: {}
