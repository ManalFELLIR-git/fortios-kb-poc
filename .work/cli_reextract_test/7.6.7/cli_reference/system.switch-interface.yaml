id: system.switch-interface
version: 7.6.7
source:
  kind: fortinet_cli_reference
  url: https://docs.fortinet.com/document/fortigate/7.6.7/cli-reference/103147613/config-system-switch-interface
attributes:
  intra-switch-policy:
    type: enum
    raw_type: option
    description: Allow any traffic between switch interfaces or require firewall policies to allow traffic between switch
      interfaces.
    default: implicit
  mac-ttl:
    type: integer
    raw_type: integer
    description: Duration for which MAC addresses are held in the ARP table (300 - 8640000 sec, default = 300).
    default: '300'
    min: 300
    max: 8640000
  member:
    type: string
    raw_type: string
    description: Names of the interfaces that belong to the virtual switch. Interface name.
    max_length: 79
  name:
    type: string
    raw_type: string
    description: Interface name (name cannot be in use by any other interfaces, VLANs, or inter-VDOM links).
    max_length: 15
  span:
    type: enum
    raw_type: option
    description: Enable/disable port spanning. Port spanning echoes traffic received by the software switch to the span destination
      port.
    default: disable
  span-dest-port:
    type: string
    raw_type: string
    description: SPAN destination port name. All traffic on the SPAN source ports is echoed to the SPAN destination port.
    max_length: 15
  span-direction:
    type: enum
    raw_type: option
    description: 'The direction in which the SPAN port operates, either: rx, tx, or both.'
    default: both
  span-source-port:
    type: string
    raw_type: string
    description: Physical interface name. Port spanning echoes all traffic on the SPAN source ports to the SPAN destination
      port. Physical interface name.
    max_length: 79
  type:
    type: enum
    raw_type: option
    description: 'Type of switch based on functionality: switch for normal functionality, or hub to duplicate packets to all
      port members.'
    default: switch
  vdom:
    type: string
    raw_type: string
    description: VDOM that the software switch belongs to.
    max_length: 31
children: {}
