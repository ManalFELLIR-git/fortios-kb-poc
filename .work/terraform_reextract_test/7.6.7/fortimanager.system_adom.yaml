id: fortimanager.system_adom
version: 7.6.7
source_object: resource_fortimanager_system_adom
source:
  kind: terraform
  file: .work\terraform\fortios\resource_fortimanager_system_adom.go
attributes:
  name:
    type: string
    raw_type: TypeString
    required: true
  type:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - FortiGate
    - FortiCarrier
    default: FortiGate
  central_management_vpn:
    type: boolean
    raw_type: TypeBool
    optional: true
    default: true
  central_management_fortiap:
    type: boolean
    raw_type: TypeBool
    optional: true
    default: true
  central_management_sdwan:
    type: boolean
    raw_type: TypeBool
    optional: true
    default: false
  mode:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - Normal
    - Backup
    default: Normal
  perform_policy_check_before_every_install:
    type: boolean
    raw_type: TypeBool
    optional: true
    default: false
  action_when_conflicts_occur_during_policy_check:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - Continue
    - Stop
    default: Continue
  auto_push_policy_packages_when_device_back_online:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - Disable
    - Enable
    default: Disable
  status:
    type: integer
    raw_type: TypeInt
    optional: true
