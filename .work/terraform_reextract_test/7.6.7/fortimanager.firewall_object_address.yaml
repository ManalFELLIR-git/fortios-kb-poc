id: fortimanager.firewall_object_address
version: 7.6.7
source_object: resource_fortimanager_firewall_object_address
source:
  kind: terraform
  file: .work\terraform\fortios\resource_fortimanager_firewall_object_address.go
attributes:
  name:
    type: string
    raw_type: TypeString
    required: true
  type:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - ipmask
    - iprange
    - fqdn
    default: ipmask
  comment:
    type: string
    raw_type: TypeString
    optional: true
  fqdn:
    type: string
    raw_type: TypeString
    optional: true
  associated_intf:
    type: string
    raw_type: TypeString
    optional: true
    default: any
  subnet:
    type: string
    raw_type: TypeString
    optional: true
    default: 0.0.0.0 0.0.0.0
  start_ip:
    type: string
    raw_type: TypeString
    optional: true
    default: 0.0.0.0
  end_ip:
    type: string
    raw_type: TypeString
    optional: true
    default: 255.255.255.255
  allow_routing:
    type: string
    raw_type: TypeString
    optional: true
    choices:
    - enable
    - disable
    default: disable
  adom:
    type: string
    raw_type: TypeString
    optional: true
    default: root
